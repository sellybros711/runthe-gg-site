  /* ---- deterministic RNG shared by both devices (same seed → same race) ---- */
  function _mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; var t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
  function duoRng(round, salt){ var s=((S.online.seed>>>0) ^ Math.imul((round+1)>>>0,2654435761>>>0) ^ Math.imul((salt+1)>>>0,40503>>>0))>>>0; return _mulberry32(s); }
  // run existing Math.random-based generators (shuffle/pick/genTasks) off a seeded
  // stream so both devices build the identical field / countries / challenges.
  function withRng(gen, fn){ var o=Math.random; Math.random=gen; try{ return fn(); } finally{ Math.random=o; } }

  /* ---- duo session persistence (refresh-safe) ---- */
  function duoSave(){ try{ if(S.online&&S.online.duoId) localStorage.setItem('rtg_duo', JSON.stringify({ duoId:S.online.duoId, code:S.online.code, seed:S.online.seed, slot:S.online.slot })); }catch(e){} }
  function duoLoadSess(){ try{ return JSON.parse(localStorage.getItem('rtg_duo')||'null'); }catch(e){ return null; } }
  function duoClearSess(){ try{ localStorage.removeItem('rtg_duo'); }catch(e){} }

  function enterDuo(json){
    S.online = { active:true, duoId:json.id, code:json.code, seed:Number(json.seed), slot:0,
                 teamName:json.name, partnerName:null, times:{}, memberCount:0, view:'lobby',
                 channel:null, poll:null, status:json.status, started:false };
    duoIngest(json);
    if(acct.user && S.online._slotByUser && S.online._slotByUser[acct.user.id]!=null) S.online.slot=S.online._slotByUser[acct.user.id];
    S.teamName=json.name; S.screen='lobby'; duoSave(); duoSubscribe(); renderDuoLobby();
  }

  function duoSubscribe(){
    if(!sb || !S.online || S.online.channel) return;
    var id=S.online.duoId;
    try{
      var ch=sb.channel('rtgduo_'+id);
      ['globe_duo_members','globe_duo_times'].forEach(function(tbl){
        ch.on('postgres_changes',{event:'*',schema:'public',table:tbl,filter:'duo_id=eq.'+id}, function(){ duoRefresh(); });
      });
      ch.subscribe(); S.online.channel=ch;
    }catch(e){ /* realtime optional; polling fallback below */ }
    S.online.poll=setInterval(function(){ if(onlineActive()) duoRefresh(); else clearInterval(S.online.poll); }, 3500);
  }
  function duoLeave(){
    if(!S.online) return;
    try{ if(S.online.channel) sb.removeChannel(S.online.channel); }catch(e){}
    if(S.online.poll) clearInterval(S.online.poll);
    S.online=null;
  }
  function duoRefresh(){
    if(!onlineActive()) return;
    rpc('get_globe_duo',{p_duo:S.online.duoId}).then(function(r){
      if(!onlineActive()||!r||r.error||!r.data) return; duoIngest(r.data);
    }).catch(function(){});
  }
  // fold a server duo blob into local state (members + both partners' times)
  function duoIngest(json){
    if(!json||!S.online) return;
    S.online.teamName=json.name||S.online.teamName;
    S.online.status=json.status;
    var map={}; (json.members||[]).forEach(function(m){ map[m.user_id]=m.slot; });
    S.online._slotByUser=map;
    var me=acct.user&&acct.user.id;
    (json.members||[]).forEach(function(m){ if(m.user_id!==me) S.online.partnerName=m.name; });
    S.online.memberCount=(json.members||[]).length;
    var tm={}; (json.times||[]).forEach(function(t){ var slot=map[t.user_id]; if(slot==null) return; (tm[t.round]=tm[t.round]||{})[slot]=t.effective_ms; });
    // never regress a locally-known time (mine, just submitted, before the roundtrip)
    var loc=S.online.times||{}; Object.keys(loc).forEach(function(r){ var d=loc[r]||{}; tm[r]=tm[r]||{}; if(d[0]!=null&&tm[r][0]==null) tm[r][0]=d[0]; if(d[1]!=null&&tm[r][1]==null) tm[r][1]=d[1]; });
    S.online.times=tm;
    duoOnUpdate();
  }
  // re-render only when something the current screen shows actually changed (no flicker)
  function duoOnUpdate(){
    if(!onlineActive()) return;
    if(S.online.view==='lobby'){
      var sig='n'+S.online.memberCount+':'+(S.online.partnerName||'');
      if(sig!==S.online._sig){ S.online._sig=sig; renderDuoLobby(); }
      return;
    }
    if(S.screen==='stage' && S.phase==='leaderboard'){
      var tt=S.online.times[S.round]||{};
      var s2=(tt[0]!=null?tt[0]:'-')+'/'+(tt[1]!=null?tt[1]:'-')+'#'+S.round;
      if(s2!==S.online._sig2){ S.online._sig2=s2; renderStage(); }
    }
  }

  function renderDuoLobby(){
    if(!S.online){ return; }
    S.online.view='lobby';
    var two=S.online.memberCount>=2;
    var meName=acct.username||'You';
    var rows='<div class="lbrow you"><span class="p">🧭</span><span class="nm">'+esc(meName)+' <span style="color:var(--globe);font-size:11px">you</span></span><span class="tm" style="color:var(--mut);font-size:12px">ready</span></div>'
      + (two
          ? '<div class="lbrow"><span class="p">🧭</span><span class="nm">'+esc(S.online.partnerName||'Partner')+'</span><span class="tm" style="color:var(--mut);font-size:12px">ready</span></div>'
          : '<div class="lbrow"><span class="p">⏳</span><span class="nm" style="color:var(--mut)">Waiting for your partner…</span><span class="tm"></span></div>');
    var ctrl = two
      ? '<button class="btn globe" id="ostart" style="margin-top:14px">Start the race 🌍</button>'
        + '<p class="muted" style="font-size:12px;text-align:center;margin-top:8px">You face a field of '+FIELD_SIZE+' teams. Each Stage you both play a different challenge — your times add up.</p>'
      : '<p class="muted" style="text-align:center;margin-top:14px">Send your partner the code above. When they join, you can start.</p>';
    app.innerHTML = topbar()
      + '<div class="card center"><div class="muted" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase">Your team code</div>'
        + '<div style="font-family:\'Bricolage Grotesque\',sans-serif;font-size:46px;letter-spacing:.14em;color:var(--globe);margin:4px 0 2px">'+esc(S.online.code)+'</div>'
        + '<div class="muted" style="font-size:12.5px">'+esc(S.online.teamName||'Our Team')+'</div>'
      + '</div>'
      + '<div class="card"><h3 style="font-size:15px;margin-bottom:10px">Your team</h3><div class="lb">'+rows+'</div>'+ctrl+'</div>'
      + '<button class="btn ghost sm" id="oleave" style="width:auto">‹ Leave</button>' + foot();
    if($('ostart')) $('ostart').onclick=duoStart;
    $('oleave').onclick=function(){ duoClearSess(); duoLeave(); S.screen='home'; render(); };
    renderAcct();
  }

  /* ---- deterministic field + stage (identical on both devices) ---- */
  function duoBuildField(){
    var gen=duoRng(0,101);
    var skills=[]; for(var i=0;i<GHOSTS.length;i++){ skills.push(0.92 + (i*(1.75-0.92)/(GHOSTS.length-1))); }
    skills=withRng(gen, function(){ return shuffle(skills); });
    var teams=[{ id:'you', name:S.online.teamName||'Our Team', flag:'🧭', isGhost:false, startedAsGhost:false, skill:1, alive:true, eff:0 }];
    for(var g=0; g<GHOSTS.length; g++){ teams.push({ id:'g'+g, name:GHOSTS[g].n, flag:GHOSTS[g].f, isGhost:true, startedAsGhost:true, skill:skills[g], alive:true, eff:0 }); }
    S.teams=teams;
  }
  function duoCountryFor(round){ var gen=duoRng(0,103); var order=withRng(gen, function(){ return shuffle(COUNTRIES); }); return order[(round-1)%order.length]; }
  function duoRebuild(){ S.online.finishLine=withRng(duoRng(0,102), function(){ return pick(FINISH); }); S.finishLine=S.online.finishLine; duoBuildField(); }
  function duoSetStage(round){
    S.round=round;
    if(round>=ROUNDS){ var fl=S.online.finishLine; S.dest={ name:fl.city, region:fl.region, flag:fl.flag, final:true, landmark:fl.landmark, country: fl.country?countryById(fl.country):null }; }
    else { var c=duoCountryFor(round); S.dest={ name:c.name, region:c.region, flag:c.flag, final:false, country:c }; var st=statsDefault(); st.countries[c.id]=1; saveStats(st); }
    // build the Split-Path pair off the seeded stream with recent-kind filtering
    // neutralised, so both devices produce the identical two challenges.
    var savedRecent=S.recentKinds; S.recentKinds=[];
    withRng(duoRng(round,1), function(){ buildChallenge(); });
    S.recentKinds=savedRecent;
    if(!S.offered || S.offered.length<2) S.offered=[S.offered&&S.offered[0], S.offered&&S.offered[0]].filter(Boolean);
  }
  // which of the two challenges is MINE this Stage (partner always gets the other)
  function duoMyTaskIndex(){ return (S.round + S.online.slot) % 2; }
  // a ghost TEAM plays both Split-Path challenges and its Stage time is the sum,
  // exactly like the human team — so the fields are directly comparable.
  function duoGhostTimes(round, offered, aliveGhosts){
    return withRng(duoRng(round,9), function(){
      return aliveGhosts.map(function(t){
        var eff=0;
        offered.forEach(function(task){
          var kind=taskKind(task), base=BASE[kind]||8, pen=PENALTY[task.cat]||12;
          var misses=(Math.random()<clampP(t.skill))?1:0; if(Math.random()<clampP(t.skill)*0.4) misses++;
          // each partner's challenge + their own City Run to the mat
          eff += base*t.skill*rnd(0.9,1.12) + misses*pen + RUN_BASE*t.skill*rnd(0.85,1.15);
        });
        return { team:t, eff:eff };
      });
    });
  }
  function duoStampRound(round){
    var tt=S.online.times[round]||{}; var teamEff=((tt[0]||0)+(tt[1]||0))/1000;
    var aliveGhosts=S.teams.filter(function(t){ return t.alive&&t.isGhost; });
    var ghosts=duoGhostTimes(round, S.offered, aliveGhosts);
    S.teams.forEach(function(t){ if(t.alive&&!t.isGhost) t.eff=teamEff; });
    ghosts.forEach(function(g){ g.team.eff=g.eff; });
  }
  function duoRank(){ return S.teams.filter(function(t){ return t.alive; }).slice().sort(function(a,b){ return (a.eff-b.eff) || (a.id<b.id?-1:1); }); }
  function duoCompletedRounds(){ var r=0; for(var k=1;k<=ROUNDS;k++){ var tt=S.online.times[k]; if(tt&&tt[0]!=null&&tt[1]!=null) r=k; else break; } return r; }

  /* ---- duo race flow ---- */
  function duoDestLL(){ return (S.dest && S.dest.country && S.dest.country.ll) || null; }
  function duoStart(){
    S._recorded=false; S._runPend=null; S._runDone=false;
    duoRebuild(); S.online.started=true; S.online.view='race';
    S.screen='stage'; S._lastLL=null; duoSetStage(1);
    flightTo(duoDestLL(), function(){ S.phase='draw'; renderStage(); }); duoSave();
  }
  function duoViewChoice(){
    var mine=duoMyTaskIndex();
    var html=topbar()+hud()+'<div class="card">'
      + '<div class="stagetype">🍴 Split Path — you and your partner each take one</div>'
      + '<div class="choice">';
    S.offered.forEach(function(t,i){
      var refl=!!REFLEX_KINDS[taskKind(t)];
      if(i===mine){
        html+='<button class="taskcard" data-i="'+i+'"><div class="ct"><span class="catchip '+(refl?'reflex':'')+'">'+esc(taskLabel(t))+'</span><span class="pen">miss +'+PENALTY[t.cat]+'s</span></div>'
          +'<div class="pr">'+esc(taskBlurb(t))+'</div>'
          +'<div style="color:var(--globe);font-weight:800;font-size:12px;margin-top:8px">▶ Your challenge — tap to play</div></button>';
      } else {
        html+='<div class="taskcard" style="opacity:.55;cursor:default"><div class="ct"><span class="catchip '+(refl?'reflex':'')+'">'+esc(taskLabel(t))+'</span><span class="pen">miss +'+PENALTY[t.cat]+'s</span></div>'
          +'<div class="pr">'+esc(taskBlurb(t))+'</div>'
          +'<div style="color:var(--mut);font-weight:800;font-size:12px;margin-top:8px">🔒 '+esc(S.online.partnerName||'Your partner')+'\'s challenge</div></div>';
      }
    });
    html+='</div><p class="muted" style="font-size:12px;text-align:center;margin-top:8px">Your team\'s Stage time is <b>both challenges added together</b> — so you can\'t both grab the quick one.</p></div>'+foot();
    app.innerHTML=html;
    var mb=document.querySelector('.taskcard[data-i="'+mine+'"]');
    if(mb) mb.onclick=function(){ S.chosen=S.offered[mine]; S.phase='play'; renderStage(); };
    renderAcct();
  }
  function duoSubmit(raw, misses, act, runT){
    if(act==null) act=raw; runT=runT||0;
    var cat=S.chosen.cat, pen=PENALTY[cat];
    var effSec=raw+misses*pen, effMs=Math.round(effSec*1000);
    S.lastResult={ raw:raw, act:act, runT:runT, misses:misses, eff:effSec, pen:pen, skipped:false };
    var st=statsDefault(); st.stagesPlayed++; if(misses===0) st.perfectStages++;
    var k=taskKind(S.chosen||{}); if(misses===0&&k!=='reaction'&&k!=='sequence'&&k!=='mapfind'&&(!st.fastestStage||act<st.fastestStage)) st.fastestStage=act; saveStats(st);
    (S.online.times[S.round]=S.online.times[S.round]||{})[S.online.slot]=effMs;   // remember mine immediately
    S.phase='checkpoint'; renderStage();
    rpc('post_globe_duo_time',{p_duo:S.online.duoId, p_round:S.round, p_ms:effMs}).then(function(r){ if(onlineActive()&&r&&r.data) duoIngest(r.data); }).catch(function(){});
  }
  function duoShowLeaderboard(){ S.online.view='race'; S.phase='leaderboard'; S.online._sig2=null; duoRefresh(); renderStage(); }

  function duoViewLeaderboard(){
    var tt=S.online.times[S.round]||{};
    if(tt[0]==null||tt[1]==null){   // still waiting on a partner's time
      var mineIn=tt[S.online.slot]!=null;
      app.innerHTML = topbar() + hud()
        + '<div class="card center"><h3 style="font-size:15px;letter-spacing:.1em;color:var(--teal)">✅ Checkpoint · Stage '+S.round+'</h3>'
        + '<div class="bigtime" style="margin-top:8px">'+(mineIn?fmtTime(tt[S.online.slot]/1000):'—')+'<span class="u">s</span></div>'
        + '<div class="muted" style="font-size:12px;margin-top:4px">'+(mineIn?'your time is in':'')+'</div>'
        + '<p class="lede" style="text-align:center;margin-top:14px">⏳ Waiting for <b>'+esc(S.online.partnerName||'your partner')+'</b> to finish their challenge…</p>'
        + '</div>' + foot();
      renderAcct(); return;
    }
    duoStampRound(S.round);
    var teamEff=(tt[0]+tt[1])/1000;
    var ranked=duoRank();
    var final=(S.round>=ROUNDS);
    var groundedTeam=ranked[ranked.length-1];
    var youRank=ranked.findIndex(function(t){ return t.id==='you'; })+1;
    var rowsHtml='';
    ranked.forEach(function(t,i){
      var out=(!final && t===groundedTeam), win=(final && i===0), you=(t.id==='you');
      rowsHtml += '<div class="lbrow'+(you?' you':'')+(out?' out':'')+(win?' win':'')+'">'
        + '<span class="p">'+(win?'🏆':(i+1))+'</span>'
        + '<span class="nm">'+esc(t.name)+(you?' <span style="color:var(--globe);font-size:11px">you</span>':'')+'</span>'
        + '<span class="tm">'+fmtTime(t.eff)+'s'+(out?' · Grounded':'')+'</span></div>';
    });
    var banner;
    if(final){
      var youWon=ranked[0].id==='you';
      banner = youWon
        ? '<div class="banner win"><h2>🏆 Your team wins RunTheGlobe!</h2><p>First across the finish at '+esc(S.dest.landmark||S.dest.name)+' with a combined '+fmtTime(teamEff)+'s.</p></div>'
        : '<div class="banner grounded"><h2>So close.</h2><p>Your team finished #'+youRank+' in the Final. '+esc(ranked[0].name)+' took the race.</p></div>';
    } else if(groundedTeam.id==='you'){
      banner = '<div class="banner grounded"><h2>✈️ Your team is Grounded</h2><p>Slowest at '+esc(S.dest.name)+' (combined '+fmtTime(teamEff)+'s). Your race ends here.</p></div>';
    } else {
      banner = '<div class="banner safe"><h2>You advance ›</h2><p>#'+youRank+' of '+ranked.length+' at '+esc(S.dest.name)+' with a combined '+fmtTime(teamEff)+'s. '+esc(groundedTeam.name)+' is Grounded.</p></div>';
    }
    app.innerHTML = topbar() + hud()
      + '<div class="card">'+banner
      + '<div class="breakdown" style="justify-content:center"><span>'+esc(acct.username||'You')+' <b>'+fmtTime(tt[S.online.slot]/1000)+'s</b></span>'
        + '<span>'+esc(S.online.partnerName||'Partner')+' <b>'+fmtTime(tt[1-S.online.slot]/1000)+'s</b></span>'
        + '<span>Team <b>'+fmtTime(teamEff)+'s</b></span></div>'
      + '<div class="lb">'+rowsHtml+'</div><div id="lbbtns"></div></div>' + foot();
    var btns=$('lbbtns');
    if(final){
      var youWon2=ranked[0].id==='you'; sfx(youWon2?'win':'lose'); recordRaceEnd(ranked); duoClearSess();
      btns.innerHTML='<div class="btnrow"><button class="btn ghost" id="home">Home</button><button class="btn ghost" id="share">📋 Share</button><button class="btn globe" id="again">New team race 🌍</button></div>';
      $('home').onclick=function(){ duoLeave(); S.screen='home'; render(); };
      $('again').onclick=function(){ duoLeave(); S.screen='online'; render(); };
      $('share').onclick=function(){ shareResult(youWon2 ? ('🌍 My partner and I just WON a team race in RunTheGlobe! Play at runthe.gg/globe') : ('🌍 My team finished #'+youRank+' in a RunTheGlobe team race. Race us at runthe.gg/globe')); };
    } else if(groundedTeam.id==='you'){
      sfx('lose'); recordRaceEnd(ranked); duoClearSess();
      btns.innerHTML='<div class="btnrow"><button class="btn ghost" id="home">Home</button><button class="btn globe" id="watch">Watch the rest ▶</button></div>';
      $('home').onclick=function(){ duoLeave(); S.screen='home'; render(); };
      $('watch').onclick=function(){ groundAndAdvance(groundedTeam); duoSpectate(); };
    } else {
      btns.innerHTML='<button class="btn globe" id="next" style="margin-top:14px">Next Stage ›</button>';
      $('next').onclick=function(){ groundAndAdvance(groundedTeam); duoSetStage(S.round+1); S.online._sig2=null; duoSave(); flightTo(duoDestLL(), function(){ S.phase='draw'; renderStage(); }); };
    }
    renderAcct();
  }

  function duoSpectate(){
    // team Grounded — deterministically finish the field for a quick summary
    while(S.round<ROUNDS && S.teams.filter(function(t){return t.alive;}).length>3){
      S.round++;
      var ag=S.teams.filter(function(t){return t.alive&&t.isGhost;});
      var res=withRng(duoRng(S.round,9), function(){ return ag.map(function(t){ return {team:t, eff: (BASE.mcq+RUN_BASE)*t.skill*rnd(0.9,1.12)}; }); });
      res.sort(function(a,b){ return (a.eff-b.eff)||(a.team.id<b.team.id?-1:1); });
      var slow=res[res.length-1]; if(slow) slow.team.alive=false;
    }
    S.round=ROUNDS;
    var last3=S.teams.filter(function(t){return t.alive;});
    var fin=withRng(duoRng(999,9), function(){ return last3.map(function(t){ return {team:t, eff: (BASE.mcq+RUN_BASE)*t.skill*rnd(0.9,1.12)}; }); });
    fin.sort(function(a,b){ return (a.eff-b.eff)||(a.team.id<b.team.id?-1:1); });
    var rows=fin.map(function(x,i){ return '<div class="lbrow'+(i===0?' win':'')+'"><span class="p">'+(i===0?'🏆':(i+1))+'</span><span class="nm">'+esc(x.team.name)+'</span><span class="tm">'+fmtTime(x.eff)+'s</span></div>'; }).join('');
    app.innerHTML = topbar()
      + '<div class="card"><div class="banner"><h2 style="color:var(--globe)">🏁 The Final · '+esc(S.online.finishLine.city)+'</h2>'
      + '<p>Your team was Grounded, but here\'s how the race finished at '+esc(S.online.finishLine.landmark)+'.</p></div>'
      + '<div class="lb">'+rows+'</div>'
      + '<div class="btnrow"><button class="btn ghost" id="home">Home</button><button class="btn globe" id="again">New team race 🌍</button></div></div>' + foot();
    $('home').onclick=function(){ duoLeave(); S.screen='home'; render(); };
    $('again').onclick=function(){ duoLeave(); S.screen='online'; render(); };
    renderAcct();
  }

  /* ---- resume an in-progress duo from the seed + posted times (refresh-safe) ---- */
  var _duoResumeTried=false;
  function maybeDuoResume(force){
    if(_duoResumeTried && !force) return;
    var sess=duoLoadSess(); if(!sess||!acct.user||!sb) return;
    _duoResumeTried=true;
    rpc('get_globe_duo',{p_duo:sess.duoId}).then(function(r){
      if(!r||r.error||!r.data){ if(r&&r.error) duoClearSess(); return; }
      S.online={ active:true, duoId:r.data.id, code:r.data.code, seed:Number(r.data.seed), slot:sess.slot,
                 teamName:r.data.name, partnerName:null, times:{}, memberCount:0, view:'race',
                 channel:null, poll:null, status:r.data.status, started:true };
      duoIngest(r.data);
      if(S.online._slotByUser[acct.user.id]!=null) S.online.slot=S.online._slotByUser[acct.user.id];
      duoSubscribe(); duoResume();
    }).catch(function(){});
  }
  function duoResume(){
    duoRebuild();
    var completed=duoCompletedRounds();
    var status='racing', groundedRound=0;
    for(var r=1;r<=completed;r++){
      duoSetStage(r); duoStampRound(r);
      var ranked=duoRank();
      if(r<ROUNDS){ var last=ranked[ranked.length-1]; if(last.id==='you'){ status='grounded'; groundedRound=r; break; } last.alive=false; }
      else { status='final'; }
    }
    S._recorded=false; S.screen='stage'; S.online.view='race';
    if(status==='grounded'){
      S.round=groundedRound; duoSetStage(groundedRound); duoStampRound(groundedRound);
      recordRaceEnd(duoRank());
      var you=S.teams.filter(function(t){return t.id==='you';})[0]; if(you) groundAndAdvance(you);
      duoSpectate(); return;
    }
    if(status==='final'){ S.round=ROUNDS; duoSetStage(ROUNDS); S.phase='leaderboard'; S.online._sig2=null; renderStage(); return; }
    var cur=completed+1; if(cur>ROUNDS) cur=ROUNDS;
    duoSetStage(cur);
    var tt=S.online.times[cur]||{};
    if(tt[S.online.slot]!=null){ S.phase='leaderboard'; S.online._sig2=null; renderStage(); return; }   // I've played, waiting
    if(cur===1 && S.online.memberCount<2 && tt[0]==null && tt[1]==null){ S.online.view='lobby'; S.screen='lobby'; renderDuoLobby(); return; }
    S.phase='draw'; renderStage();
  }

  /* --------------------------------------------------------------- bootstrap */
  S.screen='home';
  if(!COUNTRIES.length){
    app.innerHTML = '<div class="wrap"><div class="card center"><h2>Content failed to load</h2>'
      + '<p class="lede">The country task bank didn\'t load. Refresh to try again.</p></div></div>';
  } else {
    render();
    initAccount();
    // mute toggle (delegated so it works on every screen without a re-render)
    app.addEventListener('click', function(e){
      var b=(e.target && e.target.closest) ? e.target.closest('#muteBtn') : null;
      if(b){ toggleMute(); b.textContent=_muted?'🔇':'🔊'; }
    });
  }
})();
</script>
</body>
