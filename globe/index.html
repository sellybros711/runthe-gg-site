  /* =============================================================== THE RACE */
  function startRace(){
    // build the field: player + (FIELD_SIZE-1) lobby-fill ghosts (GDD §8).
    // ghost pace spread: a few sharp ghosts, several beatable ones. Skewed a
    // touch slower than before so a competent player has a fair, winnable field.
    var skills = []; for(var i=0;i<GHOSTS.length;i++){ skills.push(0.92 + (i*(1.75-0.92)/(GHOSTS.length-1))); }
    skills = shuffle(skills);
    var teams = [{ id:'you', name:S.teamName, flag:'🧭', isGhost:false, startedAsGhost:false, skill:1, alive:true, eff:0 }];
    for(var g=0; g<GHOSTS.length; g++){
      teams.push({ id:'g'+g, name:GHOSTS[g].n, flag:GHOSTS[g].f, isGhost:true, startedAsGhost:true,
                   skill:skills[g], alive:true, eff:0 });
    }
    S.teams = teams;
    S.round = 1;
    S.usedCountries = {};
    S.skipUsed = false;
    S.spectating = false;
    S.finishLine = pick(FINISH);   // GDD §11: the Final's location, locked at race start
    S.screen='stage';
    drawStage();
  }

  function aliveTeams(){ return S.teams.filter(function(t){ return t.alive; }); }
  function isFinal(){ return S.round === ROUNDS; }
  // same-screen duo: whose turn this Stage (alternates by round). null when solo.
  function coopTurn(){ if(!(S.coop&&S.coop.same)) return null; return (S.round%2===1)?S.coop.p1:S.coop.p2; }

  function drawStage(){
    // GDD per-round loop step 1: destination draw (same country for everyone).
    if(isFinal()){
      var fl = S.finishLine;
      S.dest = { name:fl.city, region:fl.region, flag:fl.flag, final:true, landmark:fl.landmark,
                 country: fl.country ? countryById(fl.country) : null };
    } else {
      var pool = COUNTRIES.filter(function(c){ return !S.usedCountries[c.id]; });
      if(!pool.length){ S.usedCountries={}; pool=COUNTRIES.slice(); }
      var c = pick(pool);
      // TEMP (Street Scout testing): force stage 1 to a dense-coverage city so imagery loads
      if(FORCE_STREET_FIRST && streetEnabled() && S.round===1){ c = countryById('FR') || c; }
      S.usedCountries[c.id]=1;
      S.dest = { name:c.name, region:c.region, flag:c.flag, final:false, country:c };
      var st=statsDefault(); st.countries[c.id]=1; saveStats(st);
    }
    // build the challenge: Split Path (choose 1 of 2) or Solo Call (1 assigned). GDD §5-6.
    buildChallenge();
    S.phase='draw';
    renderStage();
  }

  function countryById(id){ for(var i=0;i<COUNTRIES.length;i++){ if(COUNTRIES[i].id===id) return COUNTRIES[i]; } return null; }

  function taskPool(){
    // authored tasks for the destination's country + tasks GENERATED from the
    // country/world data (flags, capitals, regions, stats, coords). The generated
    // set is what makes the mix varied without hand-authoring every type.
    var c = S.dest.country || pick(COUNTRIES);
    var out=[];
    Object.keys(c.tasks||{}).forEach(function(cat){
      if(!KIND[cat]) return;
      (c.tasks[cat]||[]).forEach(function(t){ out.push(t); });
    });
    out = out.concat(genTasks(c));
    return shuffle(out);
  }

  // ---- generated game types (self-contained, no per-country authoring) ----
  function otherCountries(c, n){ return shuffle(COUNTRIES.filter(function(x){ return x.id!==c.id; })).slice(0,n); }
  function genTasks(c){
    var g=[], i;
    // Guess The Flag — show a flag, pick the country
    var wrong = otherCountries(c,3);
    var opts = shuffle([c.name].concat(wrong.map(function(x){return x.name;})));
    g.push({ kind:'flagid', cat:'trivia', type:'brain', q:'Which country flies this flag?', flag:c.flag,
             options:opts, a:opts.indexOf(c.name) });
    // Zoom Reveal — name the country as its flag zooms out
    var zw = otherCountries(c,3);
    var zopts = shuffle([c.name].concat(zw.map(function(x){return x.name;})));
    g.push({ kind:'zoomreveal', cat:'trivia', type:'brain', q:'Guess the country as its flag zooms out', flag:c.flag,
             options:zopts, a:zopts.indexOf(c.name) });
    // Name The Capital — pick the capital from four
    var wc = otherCountries(c,3);
    var capOpts = shuffle([c.capital].concat(wc.map(function(x){return x.capital;})));
    g.push({ kind:'capital', cat:'trivia', type:'brain', q:'What is the capital of '+c.name+'?',
             options:capOpts, a:capOpts.indexOf(c.capital) });
    // Odd One Out — three from one region + one outlier
    var same = COUNTRIES.filter(function(x){ return x.region===c.region && x.id!==c.id; });
    var diff = COUNTRIES.filter(function(x){ return x.region!==c.region; });
    if(same.length>=2 && diff.length){
      var trio=[c].concat(shuffle(same).slice(0,2)); var outlier=pick(diff);
      var four=shuffle(trio.concat([outlier])).map(function(x){return {n:x.name,bad:x.id===outlier.id};});
      g.push({ kind:'oddoneout', cat:'math', type:'brain', q:'Three of these are in '+c.region+'. Tap the one that is NOT.',
               options:four.map(function(x){return x.n;}), a:four.map(function(x){return x.bad;}).indexOf(true) });
    }
    // True or False rapid-fire — capital statements drawn from the world
    var tf=[]; var picks=shuffle(COUNTRIES).slice(0,5);
    picks.forEach(function(x){
      var lie=Math.random()<0.5, cap=x.capital;
      if(lie){ var o=pick(otherCountries(x,1)); cap=o.capital; }
      tf.push({ s:'The capital of '+x.name+' is '+cap+'.', t:!lie });
    });
    g.push({ kind:'truefalse', cat:'trivia', type:'brain', q:'True or false — tap fast!', items:tf });
    // Higher or Lower — compare two cities. ONLY from a DIRECTIONAL spatial task
    // (lat/long), where the question and scoring are unambiguous. Stat-ordered
    // tasks (population/size/etc.) are skipped so we never ask "farther north"
    // about a non-latitude value.
    var sp=(c.tasks.spatial&&c.tasks.spatial[0]);
    var HLQ={ north:'Which is farther NORTH?', south:'Which is farther SOUTH?',
              west:'Which is farther WEST?', east:'Which is farther EAST?' };
    if(sp && sp.items && sp.items.length>=2 && HLQ[sp.dir]){
      g.push({ kind:'higherlower', cat:'math', type:'brain', q:HLQ[sp.dir], dir:sp.dir,
               items:sp.items.slice(), rounds:Math.min(3, sp.items.length-1) });
    }
    // Memory Match — pairs from the country's memory tiles
    var tiles=(c.tasks.memory&&c.tasks.memory[0]&&c.tasks.memory[0].tiles)||['🌍','🧭','✈️','🗺️'];
    g.push({ kind:'memorymatch', cat:'memory', type:'brain', q:'Match all the pairs', tiles:tiles.slice(0,4) });
    // Whack-A-Landmark — tap the country's flag, dodge the decoys
    g.push({ kind:'whack', cat:'reflex', type:'reflex', q:'Tap '+c.flag+' as it pops up — ignore the rest!',
             target:c.flag, decoys:shuffle(otherCountries(c,4).map(function(x){return x.flag;})) });
    // Quick Tap — hit the moving target
    g.push({ kind:'targettap', cat:'reflex', type:'reflex', q:'Tap the target as fast as you can!', target:c.flag });
    // Find It On The Map — pin-drop, scored by distance (needs coords)
    if(c.ll && c.ll.length===2){
      g.push({ kind:'mapfind', cat:'spatial', type:'brain', q:'Where in the world is '+c.name+'? Tap the map.', ll:c.ll, name:c.name });
      // Street Scout — real street imagery; only offered when a Mapillary token is set
      if(streetEnabled()){
        g.push({ kind:'streetscout', cat:'spatial', type:'brain', q:'Street Scout: explore a real street near '+c.name, ll:c.ll, name:c.name });
      }
    }
    // ---- knowledge-free skill games: the country only SKINS these (its flags,
    // its city names) — the contest is timing, aim, memory and dexterity, so a
    // player who knows nothing about the destination competes evenly. ----
    // Swing Meter — land taps in a shrinking green zone (timing)
    g.push({ kind:'swingmeter', cat:'reflex', type:'reflex', q:'Land 3 taps in the green zone' });
    // Eagle Eye — one flag in the wall doesn't belong (visual hunt)
    g.push({ kind:'eagleeye', cat:'reflex', type:'reflex', q:'One of these is NOT '+c.name+'’s flag — spot it!',
             target:c.flag, imposters:shuffle(otherCountries(c,3).map(function(x){return x.flag;})) });
    // Memory Lineup — flags flash, find the one that WASN'T shown (observation)
    g.push({ kind:'kimsgame', cat:'memory', type:'brain', q:'Memorize the lineup — then spot the flag that wasn’t there' });
    // Type The Ticket — retype the destination shown on your boarding pass (dexterity)
    var tw=ticketWord(c);
    if(tw) g.push({ kind:'typeticket', cat:'word', type:'brain', q:'Type your destination, fast', word:tw });
    // Baggage Claim — grab YOUR bag off the belt, ignore lookalikes (visual match)
    g.push({ kind:'baggage', cat:'reflex', type:'reflex', q:'Grab YOUR bag off the belt — 3 grabs' });
    // Rhythm Echo — hear a rhythm, tap it back (timing memory; opens the audio category)
    g.push({ kind:'rhythmecho', cat:'audio', type:'brain', q:'Listen to the rhythm, then tap it back' });
    return g;
  }
  // boarding-pass word for Type The Ticket: capital (fallback: country name),
  // diacritics folded, punctuation dropped; skip anything too long to type fun.
  function ticketWord(c){
    function clean(s){ try{ s=(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }catch(e){ s=s||''; }
      return s.toUpperCase().replace(/[^A-Z ]/g,'').trim().replace(/ +/g,' '); }
    var w=clean(c.capital);
    if(w.replace(/ /g,'').length<3 || w.replace(/ /g,'').length>13) w=clean(c.name);
    var n=w.replace(/ /g,'').length;
    return (n>=3 && n<=13) ? w : null;
  }

  function buildChallenge(){
    // TEMP (Street Scout testing): force the very first stage of a race to be a
    // Street Scout so it's easy to reach. Flip FORCE_STREET_FIRST back to false
    // (near MAPILLARY_TOKEN) to restore fully random selection.
    if(FORCE_STREET_FIRST && streetEnabled() && !onlineActive() && S.round===1 && !isFinal()){
      var fc = S.dest.country || pick(COUNTRIES);
      S.stageType='solo';
      S.offered=[{ kind:'streetscout', cat:'spatial', type:'brain', q:'Street Scout: explore a real street near '+fc.name, ll:fc.ll, name:fc.name }];
      S.chosen=null; return;
    }
    var pool = taskPool();
    // testing hook (?kind=…): pin every offline stage to one game type
    if(FORCE_KIND && !onlineActive()){
      var fkl=pool.filter(function(t){ return taskKind(t)===FORCE_KIND; });
      if(fkl.length){ S.stageType='solo'; S.offered=[fkl[0]]; S.chosen=null; return; }
    }
    var recent = S.recentKinds || [];
    function fresh(list){ var f=list.filter(function(t){ return recent.indexOf(taskKind(t))<0; }); return f.length?f:list; }
    var brain  = pool.filter(function(t){ return !REFLEX_KINDS[taskKind(t)]; });
    var reflex = pool.filter(function(t){ return REFLEX_KINDS[taskKind(t)]; });
    // Split Path most stages (always on the Final): one brain + one reflex when
    // possible (GDD §5), and never two of the same game type.
    var wantSplit = isFinal() || onlineActive() || Math.random() < 0.6;   // duo (two-devices) is always Split Path — each partner takes a different one
    if(wantSplit && pool.length>=2){
      var a,b;
      if(brain.length && reflex.length){ a=pick(fresh(brain)); b=pick(fresh(reflex)); }
      else {
        var two=shuffle(fresh(pool)); a=two[0];
        b=two.filter(function(t){ return taskKind(t)!==taskKind(a); })[0] || two[1];
      }
      S.stageType='split'; S.offered=[a,b];
    } else {
      S.stageType='solo'; S.offered=[pick(fresh(pool))];
    }
    S.chosen=null;
  }
  function noteKind(k){ S.recentKinds=(S.recentKinds||[]); S.recentKinds.push(k); if(S.recentKinds.length>3) S.recentKinds.shift(); }

  function renderStage(){
    if(S.phase==='draw')       return viewDraw();
    if(S.phase==='choice')     return onlineActive()?duoViewChoice():viewChoice();
    if(S.phase==='play')       return viewPlay();
    if(S.phase==='checkpoint') return viewCheckpoint();
    if(S.phase==='leaderboard')return onlineActive()?duoViewLeaderboard():viewLeaderboard();
    if(S.phase==='grounded')   return onlineActive()?duoSpectate():viewGrounded();
  }

  function hud(){
    var pips='';
    for(var r=1;r<=ROUNDS;r++){
      var cls = r<S.round?'done':(r===S.round?'now':'');
      if(r===ROUNDS && cls!=='now') cls+=' final';
      pips += '<span class="pip '+cls+'"></span>';
    }
    var alive = aliveTeams().length;
    return '<div class="hud"><div class="pips">'+pips+'</div>'
      + '<div class="remain">Stage <b>'+S.round+'</b>/'+ROUNDS+' · <b>'+alive+'</b> left</div></div>';
  }

  /* --- phase: destination draw --- */
  function viewDraw(){
    var d=S.dest;
    app.innerHTML = topbar() + hud()
      + '<div class="card">'
        + '<div class="dest">'
          + '<div class="fl">'+d.flag+'</div>'
          + '<div class="cn">'+esc(d.name)+'</div>'
          + '<div class="rg">'+esc(d.region)+'</div>'
          + (d.final?'<div><span class="final-badge">🏁 The Final · '+esc(d.landmark||'the finish line')+'</span></div>':'')
        + '</div>'
        + '<p class="lede" style="text-align:center">'
          + (d.final ? 'The last '+aliveTeams().length+' teams race to the finish. Fastest effective time wins the whole race.'
                     : 'All '+aliveTeams().length+' remaining teams draw the same destination.')
        + '</p>'
        + (coopTurn() ? '<div class="coopturn">👤 <b>'+esc(coopTurn())+'</b>, you\'re up this Stage — hand over the device</div>' : '')
        + '<button class="btn globe" id="rev" style="margin-top:6px">Reveal the challenge ›</button>'
      + '</div>' + foot();
    $('rev').onclick=function(){ S.phase='choice'; renderStage(); };
    renderAcct();
  }

  /* --- phase: challenge choice (Split Path / Solo Call) --- */
  function viewChoice(){
    var html = topbar() + hud() + '<div class="card">'
      + '<div class="stagetype">'+(S.stageType==='split'?'🍴 Split Path — choose your task':'📢 Solo Call — one task, no choice')+'</div>'
      + '<div class="choice">';
    S.offered.forEach(function(t,i){
      var refl = !!REFLEX_KINDS[taskKind(t)];
      html += '<button class="taskcard" data-i="'+i+'">'
        + '<div class="ct"><span class="catchip '+(refl?'reflex':'')+'">'+esc(taskLabel(t))+'</span>'
        + '<span class="pen">miss +'+PENALTY[t.cat]+'s</span></div>'
        + '<div class="pr">'+esc(taskBlurb(t))+'</div></button>';
    });
    html += '</div>';
    // Skip Pass (GDD §2 — Fast Forward analog): once per race, take the field median
    // time. Offline only — online timing is server-authoritative.
    if(!S.skipUsed && !isFinal() && !onlineActive()){
      html += '<div class="skiprow"><div class="sx"><b>⏩ Skip Pass</b> — skip this task once per race and check in at the field\'s median time. Safe, but you won\'t gain ground.</div>'
        + '<button class="btn ghost sm" id="skip" style="flex:0 0 auto">Use</button></div>';
    }
    html += '</div>' + foot();
    app.innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('.taskcard'), function(b){
      b.onclick=function(){
        S.chosen=S.offered[+b.getAttribute('data-i')];
        S.phase='play'; renderStage();
      };
    });
    if($('skip')) $('skip').onclick=useSkipPass;
    renderAcct();
  }
  function taskBlurb(t){
    switch(taskKind(t)){
      case 'mcq':      return t.q;
      case 'scramble': return 'Unscramble the word — '+t.hint;
      case 'sequence': return t.prompt+' — repeat it back';
      case 'reaction': return 'Signal Sprint — tap on GO, hold on STOP';
      case 'order':    return t.q;
      default:         return t.q || t.prompt || 'Complete the task';
    }
  }

  /* --- phase: play (the minigame) --- */
  function viewPlay(){
    var t=S.chosen, kind=taskKind(t);
    noteKind(kind);   // remember for cross-stage variety
    var _sk=statsDefault(); _sk.kinds[kind]=1; saveStats(_sk);   // track game types played (badges)
    S.play = { start: performance.now(), misses:0, done:false };
    app.innerHTML = topbar() + hud()
      + '<div class="card">'
        + '<div class="game-hd"><span class="cat">'+esc(taskLabel(t))+(coopTurn()?' · 👤 '+esc(coopTurn()):'')+'</span>'
        + '<span class="timer" id="tmr">0.0</span></div>'
        + '<div id="mg"></div>'
        + '<div class="missline" id="miss"></div>'
      + '</div>' + foot();
    startTimer();
    if(kind==='mcq'||kind==='flagid'||kind==='capital'||kind==='oddoneout') mgMcq(t);
    else if(kind==='scramble') mgScramble(t);
    else if(kind==='sequence') mgSequence(t);
    else if(kind==='reaction') mgReaction(t);
    else if(kind==='order')    mgOrder(t);
    else if(kind==='truefalse') mgTrueFalse(t);
    else if(kind==='higherlower') mgHigherLower(t);
    else if(kind==='memorymatch') mgMemoryMatch(t);
    else if(kind==='whack') mgWhack(t);
    else if(kind==='targettap') mgTargetTap(t);
    else if(kind==='mapfind') mgMapFind(t);
    else if(kind==='streetscout') mgStreetScout(t);
    else if(kind==='zoomreveal') mgZoomReveal(t);
    else if(kind==='swingmeter') mgSwingMeter(t);
    else if(kind==='eagleeye') mgEagleEye(t);
    else if(kind==='kimsgame') mgKimsGame(t);
    else if(kind==='typeticket') mgTypeTicket(t);
    else if(kind==='baggage') mgBaggage(t);
    else if(kind==='rhythmecho') mgRhythmEcho(t);
    else finishTask();   // safety
    renderAcct();
  }
  function startTimer(){
    stopTimer();
    S.timerId = setInterval(function(){
      var e=$('tmr'); if(!e){ stopTimer(); return; }
      e.textContent = fmtTime((performance.now()-S.play.start)/1000);
    }, 100);
  }
  function stopTimer(){ if(S.timerId){ clearInterval(S.timerId); S.timerId=null; } }
  function showMiss(){
    if(S.play && S.play.misses) sfx('wrong');   // central miss cue for every game
    var e=$('miss'); if(!e) return;
    e.innerHTML = S.play.misses ? 'Misses: <b>'+S.play.misses+'</b> (+'+(S.play.misses*PENALTY[S.chosen.cat])+'s)' : '';
  }
  function finishTask(){
    stopTimer();
    var raw = (performance.now()-S.play.start)/1000;
    resolveRound(raw, S.play.misses, false);
  }

  /* ---------- minigame: multiple choice (trivia / math) ---------- */
  function mgMcq(t){
    var order = shuffle(t.options.map(function(o,i){ return {o:o,i:i}; }));
    var flag = t.flag ? '<div style="text-align:center;font-size:88px;line-height:1;margin:2px 0 12px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))">'+t.flag+'</div>' : '';
    var html=flag+'<div class="prompt">'+esc(t.q)+'</div><div class="opts">';
    order.forEach(function(x,j){ html += '<button class="opt" data-i="'+x.i+'" data-j="'+j+'">'+esc(x.o)+'</button>'; });
    html+='</div>'; $('mg').innerHTML=html;
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){
      b.onclick=function(){
        if(S.play.done) return;
        var correct = (+b.getAttribute('data-i'))===t.a;
        if(correct){ b.classList.add('right'); sfx('correct'); S.play.done=true; setTimeout(finishTask,220); }
        else{ b.classList.add('wrong'); b.disabled=true; S.play.misses++; showMiss(); }
      };
    });
  }

  /* ---------- minigame: Zoom Reveal (name the flag as it zooms out) ---------- */
  function mgZoomReveal(t){
    var order = shuffle(t.options.map(function(o,i){ return {o:o,i:i}; }));
    var opts=''; order.forEach(function(x){ opts+='<button class="opt" data-i="'+x.i+'">'+esc(x.o)+'</button>'; });
    $('mg').innerHTML='<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div class="zoombox"><div class="zoomflag" id="zf">'+t.flag+'</div></div>'
      + '<div class="opts" style="margin-top:14px">'+opts+'</div>';
    var zf=$('zf'); if(zf){ requestAnimationFrame(function(){ if($('zf')) $('zf').style.transform='scale(1)'; }); }
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){
      b.onclick=function(){
        if(S.play.done) return;
        if((+b.getAttribute('data-i'))===t.a){ b.classList.add('right'); sfx('correct'); S.play.done=true; setTimeout(finishTask,220); }
        else{ b.classList.add('wrong'); b.disabled=true; S.play.misses++; showMiss(); }
      };
    });
  }

  /* ---------- minigame: unscramble (word) ---------- */
  function mgScramble(t){
    var answer=t.answer.toUpperCase();
    var letters=shuffle(answer.split(''));
    // guarantee it isn't already solved
    if(letters.join('')===answer && answer.length>1){ var x=letters[0];letters[0]=letters[1];letters[1]=x; }
    S.scr={ built:[], letters:letters, used:[] };
    renderScramble(t);
  }
  function renderScramble(t){
    var answer=t.answer.toUpperCase();
    var slots='';
    for(var i=0;i<answer.length;i++){ var ch=S.scr.built[i]; slots+='<div class="tileslot'+(ch?' filled':'')+'">'+(ch?esc(ch):'')+'</div>'; }
    var bank='';
    S.scr.letters.forEach(function(l,i){ bank+='<div class="ltile'+(S.scr.used[i]?' used':'')+'" data-i="'+i+'">'+esc(l)+'</div>'; });
    $('mg').innerHTML = '<div class="prompt">Unscramble · <span style="color:var(--mut);font-weight:600">'+esc(t.hint)+'</span></div>'
      + '<div class="slot">'+slots+'</div><div class="bank">'+bank+'</div>'
      + '<button class="btn ghost sm" id="undo" style="width:auto;margin:0 auto;display:block">⌫ Undo</button>';
    Array.prototype.forEach.call(document.querySelectorAll('.ltile'), function(b){
      b.onclick=function(){
        if(S.play.done) return;
        var i=+b.getAttribute('data-i'); if(S.scr.used[i]) return;
        S.scr.used[i]=1; S.scr.built.push({i:i,ch:S.scr.letters[i]});
        checkScramble(t);
      };
    });
    $('undo').onclick=function(){
      if(S.play.done||!S.scr.built.length) return;
      var last=S.scr.built.pop(); S.scr.used[last.i]=0; renderScramble(t);
    };
    // normalize built to chars for slot rendering
  }
  function builtStr(){ return S.scr.built.map(function(x){return x.ch;}).join(''); }
  function checkScramble(t){
    var answer=t.answer.toUpperCase();
    // re-render with the new letter placed
    var slots='';
    for(var i=0;i<answer.length;i++){ var e=S.scr.built[i]; slots+='<div class="tileslot'+(e?' filled':'')+'">'+(e?esc(e.ch):'')+'</div>'; }
    var slotEl=document.querySelector('.slot'); if(slotEl) slotEl.innerHTML=slots;
    var bankEls=document.querySelectorAll('.ltile');
    S.scr.built.forEach(function(x){ if(bankEls[x.i]) bankEls[x.i].classList.add('used'); });
    if(S.scr.built.length===answer.length){
      if(builtStr()===answer){ S.play.done=true; setTimeout(finishTask,200); }
      else{ S.play.misses++; showMiss();
        // clear the wrong attempt
        S.scr.built=[]; S.scr.used=[]; setTimeout(function(){ if(!S.play.done) renderScramble(t); },350); }
    }
  }

  /* ---------- minigame: memory sequence (repeat it back) ----------
     The grid is built ONCE and tile elements stay put; taps only toggle classes
     and update the counter. (Rebuilding the grid on every tap dropped taps that
     landed mid-render — the "button won't click" bug.) */
  function mgSequence(t){
    var pal=t.tiles.slice();
    var len = Math.min(pal.length, 3 + Math.floor(S.round/3));   // grows slightly with stage
    var seq=[]; for(var i=0;i<len;i++){ seq.push(Math.floor(Math.random()*pal.length)); }
    S.seq={ pal:pal, seq:seq, input:[], playing:true };
    stopTimer();   // timer counts the INPUT phase only
    var tiles='';
    pal.forEach(function(em,i){ tiles+='<div class="seqtile" data-i="'+i+'">'+em+'</div>'; });
    $('mg').innerHTML='<div class="prompt">'+esc(t.prompt)+'</div>'
      + '<div class="seqstatus" id="seqst">👀 Watch the sequence…</div><div class="seqgrid">'+tiles+'</div>';
    // bind once; taps no-op while playing
    Array.prototype.forEach.call(document.querySelectorAll('.seqtile'), function(b){
      b.onclick=function(){ seqTap(t, +b.getAttribute('data-i'), b); };
    });
    playSequence(t,0);
  }
  function seqStatus(){ var e=$('seqst'); if(e) e.innerHTML = S.seq.playing ? '👀 Watch the sequence…' : 'Repeat it: <b>'+S.seq.input.length+'</b>/'+S.seq.seq.length; }
  function seqTile(i){ return document.querySelector('.seqtile[data-i="'+i+'"]'); }
  function playSequence(t,k){
    if(!$('mg')) return;
    if(k>=S.seq.seq.length){
      S.seq.playing=false; seqStatus();
      S.play.start=performance.now(); startTimer();   // start timing the input phase
      return;
    }
    var el=seqTile(S.seq.seq[k]); if(el) el.classList.add('lit');
    setTimeout(function(){ if(el) el.classList.remove('lit');
      setTimeout(function(){ playSequence(t,k+1); }, 220);
    }, 600);
  }
  function seqTap(t,i,el){
    if(S.play.done||S.seq.playing) return;
    var want=S.seq.seq[S.seq.input.length];
    if(i===want){
      S.seq.input.push(i);
      el.classList.add('tap'); setTimeout(function(){ if(el) el.classList.remove('tap'); },180);
      seqStatus();
      if(S.seq.input.length===S.seq.seq.length){ S.play.done=true; setTimeout(finishTask,220); }
    } else {
      S.play.misses++; showMiss(); S.seq.input=[];   // reset input on a wrong tile
      el.style.background='rgba(255,107,107,.35)'; setTimeout(function(){ if(el) el.style.background=''; },320);
      seqStatus();
    }
  }

  /* ---------- minigame: reaction window (reflex) ---------- */
  /* Signal Sprint — a Go/No-Go reflex test (deeper than plain "tap green" and on
     theme): tap on the TEAL "GO" signal, but HOLD on the CORAL "STOP". Measures
     reaction time on GO; misses for false starts, tapping STOP, or being too slow. */
  function mgReaction(t){
    // completion requires a fixed number of GO reps; STOP signals are traps that
    // do NOT advance completion — so the score always reflects real reaction time
    // (no "all-STOP draw = ~1s" exploit).
    S.rx={ go:0, need:5, sum:0, state:'idle', armAt:0, msg:'', sub:'', to:null };
    stopTimer();   // reaction measures its own summed reaction time, not wall clock
    renderReaction(t);
  }
  function renderReaction(t){
    var reps=''; for(var i=0;i<S.rx.need;i++){ reps+='<div class="rep'+(i<S.rx.go?' done':'')+'"></div>'; }
    var st=S.rx.state, cls, big, sm;
    if(st==='idle'){ cls='idle'; big='Ready?'; sm='Tap to start — then tap on 🟢 GO, but never on 🛑 STOP.'; }
    else if(st==='wait'){ cls='wait'; big='Wait…'; sm='Watch for the signal.'; }
    else if(st==='go'){ cls='go'; big='GO — TAP!'; sm='Now!'; }
    else if(st==='stop'){ cls='stop'; big='🛑 STOP'; sm="Don't tap!"; }
    else { cls='fb'; big=S.rx.msg; sm=S.rx.sub; }
    $('mg').innerHTML='<div class="prompt" style="text-align:center">Signal Sprint — tap on GO, hold on STOP</div>'
      + '<div class="reps">'+reps+'</div>'
      + '<div class="reactbox '+cls+'" id="rbox"><div class="big">'+big+'</div><div class="sm">'+sm+'</div></div>';
    $('rbox').onclick=function(){ reactTap(t); };
  }
  function rxClear(){ if(S.rx.to){ clearTimeout(S.rx.to); S.rx.to=null; } }
  function reactBegin(t){
    S.rx.state='wait'; renderReaction(t); rxClear();
    S.rx.to=setTimeout(function(){ reactSignal(t); }, rnd(800,2000));
  }
  function reactSignal(t){
    if(S.play.done) return;
    var isGo = Math.random() > 0.4;   // ~60% GO
    S.rx.state = isGo?'go':'stop'; S.rx.armAt=performance.now(); renderReaction(t); rxClear();
    if(isGo) S.rx.to=setTimeout(function(){ if(S.rx.state==='go'&&!S.play.done) reactResolve(t,'slow'); }, 1300);
    else     S.rx.to=setTimeout(function(){ if(S.rx.state==='stop'&&!S.play.done) reactResolve(t,'held'); }, 950);
  }
  function reactTap(t){
    if(S.play.done) return;
    var s=S.rx.state;
    if(s==='idle'){ reactBegin(t); return; }
    if(s==='fb') return;                                   // feedback auto-advances
    if(s==='wait'){ rxClear(); reactResolve(t,'early'); return; }
    if(s==='go'){ rxClear(); reactResolve(t,'go', performance.now()-S.rx.armAt); return; }
    if(s==='stop'){ rxClear(); reactResolve(t,'stopTap'); return; }
  }
  // outcomes: go (tapped GO) / slow (missed GO) count a GO rep; held/stopTap/early do not
  function reactResolve(t, kind, rt){
    rxClear();
    if(kind==='go'){ S.rx.sum+=rt; S.rx.go++; sfx('correct'); S.rx.msg=Math.round(rt)+' ms ⚡'; S.rx.sub='Nice.'; }
    else if(kind==='slow'){ S.rx.sum+=1300; S.rx.go++; S.play.misses++; showMiss(); S.rx.msg='Too slow!'; S.rx.sub='+1 miss'; }
    else if(kind==='held'){ S.rx.msg='Held ✓'; S.rx.sub='Good hold.'; }
    else if(kind==='stopTap'){ S.play.misses++; showMiss(); S.rx.msg='That was STOP!'; S.rx.sub='+1 miss'; }
    else /* early */{ S.play.misses++; showMiss(); S.rx.msg='Too soon!'; S.rx.sub='+1 miss — wait for it'; }
    S.rx.state='fb'; renderReaction(t);
    if(S.rx.go>=S.rx.need){
      S.play.done=true;
      var raw = 0.8 + S.rx.sum/1000;   // small overhead + summed reaction time (incl. slow penalties)
      S.rx.to=setTimeout(function(){ resolveRound(raw, S.play.misses, false); }, 650);
    } else {
      S.rx.to=setTimeout(function(){ if(!S.play.done) reactBegin(t); }, 750);
    }
  }

  /* ---------- minigame: order-by-stat (spatial / logic) ---------- */
  function mgOrder(t){
    var target = sortedLabels(t);
    var val={}; t.items.forEach(function(it){ val[it.label]=it.value; });
    S.ord={ target:target, placed:[], val:val };
    renderOrder(t);
  }
  function sortedLabels(t){
    var dir=t.dir, items=t.items.slice();
    var asc = (dir==='asc'||dir==='south'||dir==='west');   // ascending value = first
    items.sort(function(a,b){ return asc ? a.value-b.value : b.value-a.value; });
    return items.map(function(x){ return x.label; });
  }
  function dirHint(t){
    var map={ north:'northernmost → southernmost', south:'southernmost → northernmost',
      west:'westernmost → easternmost', east:'easternmost → westernmost',
      asc:'smallest → largest', desc:'largest → smallest' };
    return map[t.dir] || 'in order';
  }
  function renderOrder(t){
    var rows='';
    shuffleStable(t.items).forEach(function(it){
      var pos=S.ord.placed.indexOf(it.label);
      rows += '<div class="oitem'+(pos>=0?' placed':'')+'" data-l="'+esc(it.label)+'">'
        + '<span class="num'+(pos>=0?' on':'')+'">'+(pos>=0?(pos+1):'')+'</span>'
        + '<span>'+esc(it.label)+'</span></div>';
    });
    $('mg').innerHTML='<div class="prompt">'+esc(t.q)+'</div>'
      + '<div class="ohint">Tap in order: <b style="color:var(--globe)">'+dirHint(t)+'</b></div>'
      + '<div class="orderwrap">'+rows+'</div>';
    Array.prototype.forEach.call(document.querySelectorAll('.oitem'), function(b){
      b.onclick=function(){ orderTap(t, b.getAttribute('data-l')); };
    });
  }
  function shuffleStable(items){ if(!S.ord._shuf){ S.ord._shuf=shuffle(items); } return S.ord._shuf; }
  function orderTap(t,label){
    if(S.play.done || S.ord.placed.indexOf(label)>=0) return;
    var nextCorrect = S.ord.target[S.ord.placed.length];
    var el=document.querySelector('.oitem[data-l="'+label.replace(/"/g,'')+'"]');
    // accept exact match OR a tie (equal stat value) so tied cities aren't unfair
    if(label===nextCorrect || S.ord.val[label]===S.ord.val[nextCorrect]){
      S.ord.placed.push(label);
      // update the tapped row IN PLACE (no full re-render → no dropped taps)
      if(el){ el.classList.add('placed'); var num=el.querySelector('.num'); if(num){ num.textContent=S.ord.placed.length; num.classList.add('on'); } }
      if(S.ord.placed.length===S.ord.target.length){ S.play.done=true; setTimeout(finishTask,220); }
    } else {
      S.play.misses++; showMiss();
      if(el){ el.style.borderColor='var(--bad)'; setTimeout(function(){ if(el) el.style.borderColor=''; },300); }
    }
  }

  function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }

  /* ---------- minigame: True or False rapid-fire (trivia) ---------- */
  function mgTrueFalse(t){ S.tf={ i:0, items:t.items }; renderTF(t); }
  function renderTF(t){
    var it=S.tf.items[S.tf.i];
    $('mg').innerHTML='<div class="seqstatus">Statement <b>'+(S.tf.i+1)+'</b>/'+S.tf.items.length+'</div>'
      + '<div class="prompt" style="text-align:center;min-height:56px;display:flex;align-items:center;justify-content:center">'+esc(it.s)+'</div>'
      + '<div class="btnrow"><button class="btn ghost" id="tft" style="flex:1">✓ True</button>'
      + '<button class="btn ghost" id="tff" style="flex:1">✗ False</button></div>';
    $('tft').onclick=function(){ tfAns(t,true); }; $('tff').onclick=function(){ tfAns(t,false); };
  }
  function tfAns(t,ans){
    if(S.play.done) return;
    if(ans!==S.tf.items[S.tf.i].t){ S.play.misses++; showMiss(); }
    S.tf.i++;
    if(S.tf.i>=S.tf.items.length){ S.play.done=true; finishTask(); } else renderTF(t);
  }

  /* ---------- minigame: Higher or Lower (compare a stat) ---------- */
  function mgHigherLower(t){ S.hl={ round:0, rounds:t.rounds||3, items:t.items }; renderHL(t); }
  function renderHL(t){
    S.hl.pair=shuffle(S.hl.items).slice(0,2);
    $('mg').innerHTML='<div class="seqstatus">Round <b>'+(S.hl.round+1)+'</b>/'+S.hl.rounds+'</div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div class="btnrow">'+S.hl.pair.map(function(p,i){ return '<button class="btn ghost hlo" data-i="'+i+'" style="flex:1">'+esc(p.label)+'</button>'; }).join('')+'</div>';
    each('.hlo', function(b){ b.onclick=function(){ hlAns(t, +b.getAttribute('data-i')); }; });
  }
  function hlAns(t,i){
    if(S.play.done) return;
    // north/east => higher value wins; south/west => lower value wins. Ties ok.
    var lowerWins = (t.dir==='south' || t.dir==='west');
    var p=S.hl.pair, mine=p[i].value, other=p[1-i].value;
    var ok = (mine===other) || (lowerWins ? mine<=other : mine>=other);
    if(ok) sfx('tap'); else { S.play.misses++; showMiss(); }
    S.hl.round++;
    if(S.hl.round>=S.hl.rounds){ S.play.done=true; finishTask(); } else renderHL(t);
  }

  /* ---------- minigame: Memory Match (concentration) ---------- */
  function mgMemoryMatch(t){
    var cards=shuffle(t.tiles.concat(t.tiles)).map(function(e,i){ return { id:i, em:e, up:false, done:false }; });
    S.mm={ cards:cards, open:[] }; renderMM();
  }
  function renderMM(){
    var grid=S.mm.cards.map(function(c){
      return '<div class="seqtile mmc'+(c.done?' tap':'')+(c.up&&!c.done?' lit':'')+'" data-id="'+c.id+'">'+((c.up||c.done)?c.em:'❓')+'</div>';
    }).join('');
    $('mg').innerHTML='<div class="prompt" style="text-align:center">Flip the cards, match all the pairs</div>'
      + '<div class="seqgrid" style="max-width:280px;margin:8px auto 0">'+grid+'</div>';
    each('.mmc', function(b){ b.onclick=function(){ mmFlip(+b.getAttribute('data-id')); }; });
  }
  function mmFlip(id){
    if(S.play.done) return;
    var c=S.mm.cards[id]; if(!c||c.up||c.done||S.mm.open.length>=2) return;
    c.up=true; S.mm.open.push(id); renderMM();
    if(S.mm.open.length===2){
      var a=S.mm.cards[S.mm.open[0]], b=S.mm.cards[S.mm.open[1]];
      if(a.em===b.em){
        a.done=b.done=true; S.mm.open=[]; renderMM();
        var all=true; S.mm.cards.forEach(function(x){ if(!x.done) all=false; });
        if(all){ S.play.done=true; setTimeout(finishTask,260); }
      } else {
        S.play.misses++; showMiss();
        setTimeout(function(){ a.up=false; b.up=false; S.mm.open=[]; if(!S.play.done) renderMM(); }, 720);
      }
    }
  }

  /* ---------- minigame: Whack-A-Landmark (reflex) ---------- */
  // grid built ONCE; cells update via textContent so taps are never dropped mid-render
  function mgWhack(t){
    S.wk={ hits:0, need:5, cells:[null,null,null,null,null,null,null,null,null], timer:null };
    var cells=''; for(var i=0;i<9;i++){ cells+='<div class="seqtile wkc" data-i="'+i+'"></div>'; }
    $('mg').innerHTML='<div class="seqstatus" id="wkst"></div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div class="seqgrid" style="max-width:260px;margin:8px auto 0">'+cells+'</div>';
    each('.wkc', function(b){ b.onclick=function(){ whackTap(t, +b.getAttribute('data-i')); }; });
    wkStatus(); S.wk.timer=setInterval(function(){ tickWhack(t); }, 820); tickWhack(t);
  }
  function wkStatus(){ var e=$('wkst'); if(e) e.innerHTML='Hits <b>'+S.wk.hits+'</b>/'+S.wk.need; }
  function wkCell(i){ return document.querySelector('.wkc[data-i="'+i+'"]'); }
  function wkPaint(){ for(var i=0;i<9;i++){ var el=wkCell(i); if(el) el.textContent=S.wk.cells[i]||''; } }
  function tickWhack(t){
    if(S.play.done || !$('wkst')){ clearInterval(S.wk.timer); return; }
    var cells=[null,null,null,null,null,null,null,null,null];
    var idx=shuffle([0,1,2,3,4,5,6,7,8]);
    cells[idx[0]]=t.target;
    var nd=2+Math.floor(Math.random()*2);
    for(var k=1;k<=nd;k++){ cells[idx[k]]=t.decoys[(k-1)%t.decoys.length]; }
    S.wk.cells=cells; wkPaint();
  }
  function whackTap(t,i){
    if(S.play.done) return;
    var c=S.wk.cells[i]; if(!c) return;
    if(c===t.target){ S.wk.hits++; S.wk.cells[i]=null; var el=wkCell(i); if(el) el.textContent=''; wkStatus();
      if(S.wk.hits>=S.wk.need){ S.play.done=true; clearInterval(S.wk.timer); finishTask(); return; }
    } else { S.play.misses++; showMiss(); S.wk.cells[i]=null; var el2=wkCell(i); if(el2) el2.textContent=''; }
  }

  /* ---------- minigame: Quick Tap (reflex) ---------- */
  // box + target built ONCE; hits just move the existing target (no rebuild → a
  // fast follow-up tap can't accidentally land on the background as a miss)
  function mgTargetTap(t){
    S.tt={ hits:0, need:6 };
    $('mg').innerHTML='<div class="seqstatus" id="ttst"></div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div id="ttbox" style="position:relative;height:210px;border-radius:16px;border:1px solid var(--cardb);background:rgba(255,255,255,.04);overflow:hidden">'
      + '<div id="ttgt" style="position:absolute;font-size:42px;cursor:pointer;transform:translate(-50%,-50%);transition:left .06s,top .06s">'+t.target+'</div></div>';
    $('ttgt').onclick=function(ev){ if(ev.stopPropagation)ev.stopPropagation(); ttHit(t); };
    $('ttbox').onclick=function(){ if(S.play.done) return; S.play.misses++; showMiss(); };
    ttStatus(); ttMove();
  }
  function ttStatus(){ var e=$('ttst'); if(e) e.innerHTML='Hits <b>'+S.tt.hits+'</b>/'+S.tt.need; }
  function ttMove(){ var g=$('ttgt'); if(g){ g.style.left=(10+Math.floor(Math.random()*80))+'%'; g.style.top=(12+Math.floor(Math.random()*70))+'%'; } }
  function ttHit(t){
    if(S.play.done) return;
    S.tt.hits++; ttStatus();
    if(S.tt.hits>=S.tt.need){ S.play.done=true; finishTask(); return; }
    ttMove();
  }

  /* ================================================================
     KNOWLEDGE-FREE SKILL GAMES — the country skins the screen, but the
     contest is timing / aim / memory / dexterity, so a player who knows
     nothing about the destination competes evenly. All six read ramp()
     so late Stages get faster, tighter, longer. Build-once DOM rule
     applies everywhere (taps must never land mid-render).
     ================================================================ */

  /* ---------- minigame: Swing Meter (timing) ---------- */
  function mgSwingMeter(t){
    var d=ramp();
    S.sw={ hits:0, need:3, pos:0, zw:0.26-0.10*d, zc:0.5, speed:0.55+0.40*d, t0:performance.now() };
    swNewZone();
    $('mg').innerHTML='<div class="seqstatus" id="swst"></div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div id="swbar" style="position:relative;height:74px;border-radius:14px;border:1px solid var(--cardb);background:rgba(255,255,255,.05);overflow:hidden;cursor:pointer;touch-action:manipulation">'
        + '<div id="swz" style="position:absolute;top:0;bottom:0;background:rgba(53,214,160,.30);border-left:2px solid var(--ok);border-right:2px solid var(--ok)"></div>'
        + '<div id="swm" style="position:absolute;top:6px;bottom:6px;width:5px;border-radius:3px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.85)"></div>'
      + '</div>'
      + '<div class="ohint" style="margin-top:10px">Tap the bar while the marker is in the green. The zone shrinks every hit!</div>';
    swStatus(); swPaint();
    $('swbar').onclick=swTap;
    (function loop(){
      if(S.play.done || !$('swm')) return;
      var el=(performance.now()-S.sw.t0)/1000;
      S.sw.pos=(Math.sin(el*S.sw.speed*Math.PI*2 - Math.PI/2)+1)/2;   // smooth 0..1 ping-pong
      $('swm').style.left='calc('+(S.sw.pos*100)+'% - 2px)';
      requestAnimationFrame(loop);
    })();
  }
  function swStatus(){ var e=$('swst'); if(e) e.innerHTML='Hits <b>'+S.sw.hits+'</b>/'+S.sw.need; }
  function swNewZone(){ var m=S.sw.zw/2+0.06; S.sw.zc=rnd(m,1-m); }
  function swPaint(){ var z=$('swz'); if(z){ z.style.left=((S.sw.zc-S.sw.zw/2)*100)+'%'; z.style.width=(S.sw.zw*100)+'%'; } }
  function swTap(){
    if(S.play.done) return;
    if(Math.abs(S.sw.pos-S.sw.zc)<=S.sw.zw/2){
      sfx('correct'); S.sw.hits++; swStatus();
      if(S.sw.hits>=S.sw.need){ S.play.done=true; setTimeout(finishTask,200); return; }
      S.sw.zw*=0.78; S.sw.speed*=1.12; swNewZone(); swPaint();
    } else { S.play.misses++; showMiss(); }
  }

  /* ---------- minigame: Eagle Eye (visual hunt — spot the imposter flag) ---------- */
  function mgEagleEye(t){
    S.ee={ round:0, rounds:3, n:12+Math.round(6*ramp()) };
    renderEagle(t);
  }
  function renderEagle(t){
    var n=Math.min(24, S.ee.n + S.ee.round*3);
    var imp=t.imposters[S.ee.round % t.imposters.length] || t.imposters[0];
    var at=Math.floor(Math.random()*n), tiles='';
    for(var i=0;i<n;i++){ tiles+='<div class="seqtile eet" data-b="'+(i===at?1:0)+'" style="width:52px;height:52px;font-size:27px">'+(i===at?imp:t.target)+'</div>'; }
    $('mg').innerHTML='<div class="seqstatus">Found <b>'+S.ee.round+'</b>/'+S.ee.rounds+'</div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div class="seqgrid" style="max-width:340px;margin:8px auto 0;gap:8px">'+tiles+'</div>';
    each('.eet', function(b){ b.onclick=function(){ eagleTap(t,b); }; });
  }
  function eagleTap(t,el){
    if(S.play.done) return;
    if(el.getAttribute('data-b')==='1'){
      sfx('correct'); el.classList.add('lit');
      S.ee.round++;
      if(S.ee.round>=S.ee.rounds){ S.play.done=true; setTimeout(finishTask,220); }
      else setTimeout(function(){ if(!S.play.done) renderEagle(t); },300);   // rebuild BETWEEN rounds only
    } else { S.play.misses++; showMiss(); el.style.opacity=.35; el.style.pointerEvents='none'; }
  }

  /* ---------- minigame: Memory Lineup (flags flash — spot the one NOT shown) ---------- */
  function mgKimsGame(t){
    var d=ramp();
    S.km={ round:0, rounds:3, k:4+Math.round(2*d), flashMs:2200-900*d };
    renderKim(t);
  }
  function renderKim(t){
    var flags=shuffle(COUNTRIES).slice(0, S.km.k+1).map(function(c){ return c.flag; });
    S.km.intruder=flags[S.km.k];
    var shown=flags.slice(0, S.km.k);
    S.km.opts=shuffle([S.km.intruder].concat(shuffle(shown).slice(0,3)));
    var tiles=shown.map(function(f){ return '<div class="seqtile" style="width:54px;height:54px;font-size:28px">'+f+'</div>'; }).join('');
    $('mg').innerHTML='<div class="seqstatus">Lineup <b>'+(S.km.round+1)+'</b>/'+S.km.rounds+'</div>'
      + '<div class="prompt" style="text-align:center">👀 Memorize the lineup…</div>'
      + '<div class="seqgrid" id="kmshow" style="max-width:340px;margin:8px auto 0">'+tiles+'</div>';
    setTimeout(function(){ if(!S.play.done && $('kmshow')) kimAsk(t); }, S.km.flashMs);
  }
  function kimAsk(t){
    var opts=S.km.opts.map(function(f){ return '<div class="seqtile kmo" data-f="'+f+'" style="width:58px;height:58px;font-size:30px">'+f+'</div>'; }).join('');
    $('mg').innerHTML='<div class="seqstatus">Lineup <b>'+(S.km.round+1)+'</b>/'+S.km.rounds+'</div>'
      + '<div class="prompt" style="text-align:center">Which flag was <b style="color:var(--bad)">NOT</b> in the lineup?</div>'
      + '<div class="seqgrid" style="margin-top:8px">'+opts+'</div>';
    each('.kmo', function(b){ b.onclick=function(){ kimTap(t,b); }; });
  }
  function kimTap(t,el){
    if(S.play.done) return;
    if(el.getAttribute('data-f')===S.km.intruder){
      sfx('correct'); el.classList.add('lit');
      S.km.round++;
      if(S.km.round>=S.km.rounds){ S.play.done=true; setTimeout(finishTask,220); }
      else setTimeout(function(){ if(!S.play.done) renderKim(t); },320);
    } else { S.play.misses++; showMiss(); el.style.opacity=.35; el.style.pointerEvents='none'; }
  }

  /* ---------- minigame: Type The Ticket (typing sprint — the word is SHOWN) ---------- */
  function mgTypeTicket(t){
    var word=t.word;
    var letters=shuffle(word.replace(/ /g,'').split(''));
    S.tk={ word:word, idx:0, letters:letters, used:[], fade:(ramp()>=0.35) };
    $('mg').innerHTML='<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div style="border:1px solid var(--cardb);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:rgba(58,160,255,.07);text-align:center">'
        + '<div style="font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--mut);text-transform:uppercase">🎫 Boarding pass · destination</div>'
        + '<div id="tkword" style="font-family:\'Anton\',sans-serif;font-size:26px;letter-spacing:.08em;margin-top:4px;transition:opacity .9s">'+esc(word)+'</div>'
      + '</div>'
      + '<div class="slot" id="tkslots">'+tkSlots()+'</div>'
      + '<div class="bank">'+letters.map(function(l,i){ return '<div class="ltile tkt" data-i="'+i+'">'+esc(l)+'</div>'; }).join('')+'</div>'
      + (S.tk.fade?'<div class="ohint">The ink fades fast — read it while you can!</div>':'');
    each('.tkt', function(b){ b.onclick=function(){ tkTap(+b.getAttribute('data-i'), b); }; });
    if(S.tk.fade) setTimeout(function(){ var w=$('tkword'); if(w && !S.play.done) w.style.opacity='0.05'; }, 1500);
  }
  function tkSlots(){
    var out='';
    for(var i=0;i<S.tk.word.length;i++){
      var ch=S.tk.word[i];
      if(ch===' '){ out+='<div style="width:14px"></div>'; continue; }
      var done=i<S.tk.idx;
      out+='<div class="tileslot'+(done?' filled':'')+'">'+(done?esc(ch):'')+'</div>';
    }
    return out;
  }
  function tkTap(i, el){
    if(S.play.done || S.tk.used[i]) return;
    if(S.tk.letters[i]===S.tk.word[S.tk.idx]){
      S.tk.used[i]=1; el.classList.add('used'); sfx('tap');
      S.tk.idx++;
      while(S.tk.word[S.tk.idx]===' ') S.tk.idx++;   // spaces fill themselves
      var s=$('tkslots'); if(s) s.innerHTML=tkSlots();   // slots aren't tappable — safe to rebuild
      if(S.tk.idx>=S.tk.word.length){ S.play.done=true; setTimeout(finishTask,200); }
    } else {
      S.play.misses++; showMiss();
      el.style.borderColor='var(--bad)'; setTimeout(function(){ if(el) el.style.borderColor=''; },300);
    }
  }

  /* ---------- minigame: Baggage Claim (visual match on a moving belt) ---------- */
  function mgBaggage(t){
    var d=ramp();
    var bases=['🟥','🟦','🟩','🟨','🟪','🟧'], sticks=['⭐','🌙','⚡','🍀','🎀','🔔'];
    var tb=pick(bases), ts=pick(sticks);
    S.bg={ tb:tb, ts:ts, target:tb+ts, bases:bases, sticks:sticks, grabs:0, need:3,
           slots:[null,null,null,null], hard:d, timer:null };
    var cells=''; for(var i=0;i<4;i++){ cells+='<div class="seqtile bgc" data-i="'+i+'" style="width:74px;height:64px;font-size:23px;letter-spacing:2px"></div>'; }
    $('mg').innerHTML='<div class="seqstatus" id="bgst"></div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div style="text-align:center;margin-bottom:10px"><span class="catchip">Your bag</span> <span style="font-size:26px;letter-spacing:2px;vertical-align:middle">'+S.bg.target+'</span></div>'
      + '<div class="seqgrid" style="margin-top:2px">'+cells+'</div>'
      + '<div class="ohint">The belt keeps moving — tap only YOUR bag.</div>';
    each('.bgc', function(b){ b.onclick=function(){ bgTap(+b.getAttribute('data-i')); }; });
    bgStatus();
    S.bg.timer=setInterval(bgTick, 1050-350*d); bgTick();
  }
  function bgStatus(){ var e=$('bgst'); if(e) e.innerHTML='Grabbed <b>'+S.bg.grabs+'</b>/'+S.bg.need; }
  function bgCell(i){ return document.querySelector('.bgc[data-i="'+i+'"]'); }
  function bgNew(){
    // decoys converge on your bag as the race ramps: same colour, wrong sticker
    var b = (Math.random() < 0.35+0.5*S.bg.hard) ? S.bg.tb : pick(S.bg.bases);
    var s = pick(S.bg.sticks);
    if(b===S.bg.tb && s===S.bg.ts) s = S.bg.sticks[(S.bg.sticks.indexOf(s)+1)%S.bg.sticks.length];
    return b+s;
  }
  function bgTick(){
    if(S.play.done || !$('bgst')){ clearInterval(S.bg.timer); return; }
    var incoming = (S.bg.slots.indexOf(S.bg.target)<0 && Math.random()<0.55) ? S.bg.target : bgNew();
    S.bg.slots.shift(); S.bg.slots.push(incoming);
    for(var i=0;i<4;i++){ var el=bgCell(i); if(el) el.textContent=S.bg.slots[i]||''; }   // update in place
  }
  function bgTap(i){
    if(S.play.done) return;
    var bag=S.bg.slots[i]; if(!bag) return;
    var el=bgCell(i);
    if(bag===S.bg.target){
      sfx('correct'); S.bg.grabs++; S.bg.slots[i]=null; if(el) el.textContent=''; bgStatus();
      if(S.bg.grabs>=S.bg.need){ S.play.done=true; clearInterval(S.bg.timer); finishTask(); }
    } else { S.play.misses++; showMiss(); S.bg.slots[i]=null; if(el) el.textContent=''; }
  }

  /* ---------- minigame: Rhythm Echo (audio — hear a rhythm, tap it back) ----------
     Beats are separated by SHORT (~330ms) or LONG (~950ms) gaps; the player's echo
     is judged on gap pattern, not exact timing. The pad pulses in sync with every
     beat, so the game is fully playable muted (visual rhythm). */
  function mgRhythmEcho(t){
    S.re={ round:0, rounds:2, n:4+Math.round(ramp()), state:'idle', pat:[], taps:[] };
    $('mg').innerHTML='<div class="seqstatus" id="rest">🎧 Listen…</div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div class="reps" id="redots"></div>'
      + '<div class="reactbox idle" id="repad" style="height:170px;cursor:pointer"><div class="big">🥁</div><div class="sm" id="resm">Listen to the beat…</div></div>';
    $('repad').onclick=reTap;
    reBegin();
  }
  function reDots(fill){
    var e=$('redots'); if(!e) return; var h='';
    for(var i=0;i<S.re.n;i++){ h+='<div class="rep'+(i<fill?' done':'')+'"></div>'; }
    e.innerHTML=h;
  }
  function reBegin(){
    S.re.state='play'; S.re.taps=[]; S.re.pat=[];
    for(var i=0;i<S.re.n-1;i++){ S.re.pat.push(Math.random()<0.5?'S':'L'); }
    if(S.re.pat.indexOf('S')<0) S.re.pat[0]='S';                       // always a mix
    if(S.re.pat.indexOf('L')<0) S.re.pat[S.re.pat.length-1]='L';
    var pad=$('repad'); if(pad) pad.setAttribute('data-pat', S.re.pat.join(''));
    var st=$('rest'); if(st) st.innerHTML='🎧 Round <b>'+(S.re.round+1)+'</b>/'+S.re.rounds+' — listen…';
    var sm=$('resm'); if(sm) sm.textContent='Listen to the beat…';
    reDots(0);
    var when=420;
    rePulse(0, when);
    for(var k=0;k<S.re.pat.length;k++){ when += (S.re.pat[k]==='S'?330:950); rePulse(k+1, when); }
    setTimeout(function(){
      if(S.play.done || !$('repad')) return;
      S.re.state='echo';
      var s2=$('rest'); if(s2) s2.innerHTML='🫵 Your turn — tap the same rhythm ('+S.re.n+' taps)';
      var m2=$('resm'); if(m2) m2.textContent='Tap it back!';
      reDots(0);
    }, when+520);
  }
  function rePulse(i, delay){
    setTimeout(function(){
      var pad=$('repad'); if(!pad || S.play.done || S.re.state!=='play') return;
      beep(720,0.10,'triangle',0.14); vibe(14);
      pad.style.background='rgba(58,160,255,.45)';
      reDots(i+1);
      setTimeout(function(){ var p=$('repad'); if(p && S.re.state==='play') p.style.background=''; },150);
    }, delay);
  }
  function reTap(){
    if(S.play.done || S.re.state!=='echo') return;   // taps during playback are ignored
    S.re.taps.push(performance.now());
    beep(600,0.08,'triangle',0.12); vibe(10);
    var pad=$('repad'); if(pad){ pad.style.background='rgba(53,214,160,.4)'; setTimeout(function(){ var p=$('repad'); if(p) p.style.background=''; },120); }
    reDots(S.re.taps.length);
    if(S.re.taps.length>=S.re.n) reJudge();
  }
  function reJudge(){
    var got=[];
    for(var i=1;i<S.re.taps.length;i++){ got.push((S.re.taps[i]-S.re.taps[i-1])<620?'S':'L'); }
    if(got.join('')===S.re.pat.join('')){
      sfx('correct');
      S.re.round++;
      if(S.re.round>=S.re.rounds){ S.play.done=true; setTimeout(finishTask,250); return; }
      S.re.n++;   // next echo is one beat longer
      S.re.state='play'; setTimeout(function(){ if(!S.play.done && $('repad')) reBegin(); },600);
    } else {
      S.play.misses++; showMiss();
      var st=$('rest'); if(st) st.innerHTML='❌ Not quite — listen again…';
      S.re.state='play'; setTimeout(function(){ if(!S.play.done && $('repad')) reBegin(); },800);
    }
  }

  /* ---------- minigame: Find It On The Map (spatial, distance-scored) ---------- */
  function haversine(la1,lo1,la2,lo2){
    var R=6371, r=Math.PI/180, dLa=(la2-la1)*r, dLo=(lo2-lo1)*r;
    var a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)*Math.sin(dLo/2);
    return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));
  }
  // rough continent outlines ([lng,lat] vertices) — schematic, just to orient the
  // player; scoring uses real coordinates so map crudeness doesn't affect fairness.
  var CONTINENTS=[
    [[-168,66],[-95,71],[-60,60],[-52,47],[-80,25],[-105,15],[-125,32],[-140,58]],
    [[-81,10],[-52,3],[-35,-8],[-53,-33],[-72,-54],[-77,-30],[-82,-3]],
    [[-10,58],[12,60],[30,66],[40,46],[10,36],[-9,37],[-11,44]],
    [[-17,35],[10,34],[33,31],[51,12],[40,-34],[18,-35],[9,4],[-17,15]],
    [[26,66],[80,72],[140,70],[170,66],[142,45],[122,22],[100,6],[70,8],[60,25],[45,42],[33,50]],
    [[113,-12],[131,-12],[154,-20],[150,-38],[129,-32],[115,-35]]
  ];
  function mgMapFind(t){ runMapGuess(t.q, t.ll); }
  // shared world-map pin-drop, reused by Find-It and Street Scout. `targetLL`=[lat,lng].
  function runMapGuess(qText, targetLL){
    var grid='', lo, la, x, y;
    for(lo=-150;lo<=150;lo+=30){ x=lo+180; grid+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="180" stroke="rgba(255,255,255,.05)" stroke-width="0.4"/>'; }
    for(la=-60;la<=60;la+=30){ y=90-la; grid+='<line x1="0" y1="'+y+'" x2="360" y2="'+y+'" stroke="rgba(255,255,255,.05)" stroke-width="0.4"/>'; }
    grid+='<line x1="0" y1="90" x2="360" y2="90" stroke="rgba(255,255,255,.12)" stroke-width="0.6"/>';
    var paths=CONTINENTS.map(function(poly){
      return '<polygon points="'+poly.map(function(p){ return (p[0]+180)+','+(90-p[1]); }).join(' ')+'" fill="rgba(58,160,255,.20)" stroke="rgba(58,160,255,.45)" stroke-width="0.6"/>';
    }).join('');
    $('mg').innerHTML='<div class="prompt" style="text-align:center">'+esc(qText)+'</div>'
      + '<svg id="wmap" viewBox="0 0 360 180" preserveAspectRatio="none" style="width:100%;height:auto;aspect-ratio:2/1;background:rgba(8,20,36,.85);border:1px solid var(--cardb);border-radius:12px;cursor:crosshair;touch-action:manipulation">'
      + grid + paths + '</svg><div class="ohint" id="maphint">Tap the map where you think it is.</div>';
    $('wmap').addEventListener('click', function(ev){ mapGuess(ev, targetLL); });
  }
  function mapGuess(ev, targetLL){
    if(S.play.done) return;
    var svg=$('wmap'); if(!svg) return;
    S.play.done=true; stopTimer();
    var raw=(performance.now()-S.play.start)/1000;
    var b=svg.getBoundingClientRect();
    var vx=(ev.clientX-b.left)/b.width*360, vy=(ev.clientY-b.top)/b.height*180;
    var gLng=vx-180, gLat=90-vy, d=haversine(gLat,gLng,targetLL[0],targetLL[1]);
    var miss = d<600?0 : d<1800?1 : d<4500?2 : d<9000?3 : 4;
    S.play.misses=miss;
    var cx=targetLL[1]+180, cy=90-targetLL[0];
    svg.insertAdjacentHTML('beforeend',
      '<line x1="'+vx+'" y1="'+vy+'" x2="'+cx+'" y2="'+cy+'" stroke="rgba(255,255,255,.5)" stroke-width="0.7" stroke-dasharray="2 2"/>'
      + '<circle cx="'+vx+'" cy="'+vy+'" r="3" fill="#EF4E50"/>'
      + '<circle cx="'+cx+'" cy="'+cy+'" r="3.2" fill="#35d6a0" stroke="#fff" stroke-width="0.5"/>');
    var h=$('maphint'); if(h) h.innerHTML='You were <b>'+Math.round(d).toLocaleString()+' km</b> away — '+(miss===0?'bullseye! 🎯':('+'+miss+' miss'+(miss>1?'es':'')));
    setTimeout(function(){ resolveRound(raw, miss, false); }, 1500);
  }

  /* ---------- minigame: Street Scout (Mapillary street imagery) ----------
     "Drop into a real street somewhere near the country, look around, then pin
     where in the world you are." DISABLED unless MAPILLARY_TOKEN is set, and
     fully FAIL-OPEN: any hiccup (no token, SDK/tiles blocked, no imagery nearby)
     silently falls back to the plain map pin-drop so a race can never break. */
  function streetEnabled(){ return STREET_LIVE && typeof MAPILLARY_TOKEN==='string' && MAPILLARY_TOKEN.length>10; }
  var _mly=0; // 0 unloaded · 1 loading · 2 ready · 3 failed
  function loadMapillary(cb){
    if(_mly===2) return cb(true,'cached');
    if(_mly===3) return cb(false,'previously failed to load');
    var done=false; function fin(ok,why){ if(done) return; done=true; _mly=ok?2:3; cb(ok,why); }
    try{
      var css=document.createElement('link'); css.rel='stylesheet';
      css.href='https://cdn.jsdelivr.net/npm/mapillary-js@4.1.2/dist/mapillary.css'; document.head.appendChild(css);
      var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/mapillary-js@4.1.2/dist/mapillary.js';
      s.onload=function(){ var ok=!!(window.mapillary&&window.mapillary.Viewer); fin(ok, ok?'loaded':'loaded but window.mapillary.Viewer missing'); };
      s.onerror=function(){ fin(false,'script failed to load (CDN blocked?)'); };
      _mly=1; document.head.appendChild(s);
      setTimeout(function(){ fin(false,'timed out loading SDK'); }, 5000);
    }catch(e){ fin(false,'exception: '+(e&&e.message)); }
  }
  function mapillaryNearby(ll, cb){
    var d=0.4, bbox=[ll[1]-d, ll[0]-d, ll[1]+d, ll[0]+d].join(',');
    var url='https://graph.mapillary.com/images?access_token='+encodeURIComponent(MAPILLARY_TOKEN)
      +'&bbox='+bbox+'&limit=20&fields=id,computed_geometry,geometry';
    var done=false; function fin(v,err){ if(done) return; done=true; cb(v,err); }
    setTimeout(function(){ fin(null,'imagery request timed out'); }, 6000);
    try{
      fetch(url).then(function(r){ if(!r.ok) { fin(null,'API HTTP '+r.status); return null; } return r.json(); }).then(function(j){
        if(!j) return;
        var arr=(j&&j.data)||[]; if(!arr.length) return fin(null,'0 images within bbox of '+ll[0]+','+ll[1]);
        var im=arr[Math.floor(Math.random()*arr.length)];
        var g=(im.computed_geometry&&im.computed_geometry.coordinates)||(im.geometry&&im.geometry.coordinates);   // [lng,lat]
        fin({ id:im.id, ll:[ g?g[1]:ll[0], g?g[0]:ll[1] ] });
      }).catch(function(e){ fin(null,'fetch error: '+(e&&e.message)); });
    }catch(e){ fin(null,'exception: '+(e&&e.message)); }
  }
  function mgStreetScout(t){
    var dbg = !!FORCE_STREET_FIRST;   // verbose diagnostics only while force-testing
    $('mg').innerHTML='<div class="prompt" style="text-align:center">🛰️ Finding a street to scout…</div>'
      + (dbg?'<div id="sslog" class="ohint" style="white-space:pre-line;text-align:left;font-family:monospace;font-size:11px"></div>':'')
      + '<button class="btn ghost sm" id="ssskip" style="width:auto;margin:12px auto 0;display:block">Skip to the map ›</button>';
    if($('ssskip')) $('ssskip').onclick=function(){ if(!S.play.done){ ssKill(); mgMapFind(t); } };
    function log(m){ var e=$('sslog'); if(e) e.textContent=(e.textContent?e.textContent+'\n':'')+m; }
    function fail(m){ log('⚠️ '+m); if(!dbg){ ssKill(); mgMapFind(t); } else { log('→ tap "Skip to the map" to continue.'); } }
    log('1) loading Mapillary viewer…');
    loadMapillary(function(ok,why){
      log('   '+(ok?'✓ ':'✗ ')+why);
      if(!ok) return fail('viewer SDK unavailable');
      log('2) searching imagery near '+t.name+'…');
      mapillaryNearby(t.ll, function(loc,err){
        if(!loc) return fail(err||'no imagery');
        log('   ✓ found image '+String(loc.id).slice(0,10)+'…');
        $('mg').innerHTML='<div class="prompt" style="text-align:center;font-size:15px">Look around this street — then pin where in the world you are.</div>'
          + '<div id="pano" style="width:100%;height:250px;border-radius:12px;overflow:hidden;border:1px solid var(--cardb);background:#000"></div>'
          + '<div style="text-align:center;font-size:10.5px;color:var(--mut);margin-top:5px">Street imagery © <a href="https://www.mapillary.com" target="_blank" rel="noopener" style="color:var(--mut)">Mapillary</a> contributors, CC BY-SA</div>'
          + '<button class="btn globe" id="ssguess" style="margin-top:10px">📍 Make my guess ›</button>';
        try{
          S.ssViewer=new window.mapillary.Viewer({ accessToken:MAPILLARY_TOKEN, container:'pano', imageId:loc.id });
        }catch(e){ ssKill(); return mgMapFind(t); }
        $('ssguess').onclick=function(){ ssKill(); runMapGuess('Where in the world was that street? Tap the map.', loc.ll); };
      });
    });
  }
  function ssKill(){ try{ if(S.ssViewer&&S.ssViewer.remove) S.ssViewer.remove(); }catch(e){} S.ssViewer=null; }

  /* -------------------------------------------------- Skip Pass (field median) */
  function useSkipPass(){
    S.skipUsed=true;
    var ghosts = simulateGhosts();       // pace the field first
    var med = median(ghosts.map(function(x){ return x.eff; }));
    resolveRound(med, 0, true, ghosts);  // player checks in at the median
  }

  /* --------------------------------------------------------- round resolve */
  // GDD §4/§8: player's effective time is real; the AI ghost field is paced by
  // per-team skill and this stage's task kind, with fresh per-stage noise. As
  // weaker ghosts are Grounded, the surviving field is naturally faster — the
  // difficulty ramps without a hand-tuned curve.
  function simulateGhosts(){
    var kind = (S.chosen&&taskKind(S.chosen)) || 'mcq';
    var base = BASE[kind] || 8;
    var pen  = PENALTY[(S.chosen&&S.chosen.cat) || 'trivia'];
    return aliveTeams().filter(function(t){ return t.isGhost; }).map(function(t){
      var misses = (Math.random() < clampP(t.skill)) ? 1 : 0;
      if(Math.random() < clampP(t.skill)*0.4) misses++;
      var eff = base * t.skill * rnd(0.9,1.12) + misses*pen;
      return { team:t, eff:eff };
    });
  }
  function clampP(skill){ var p=(skill-0.8)*0.45; return Math.max(0, Math.min(0.55, p)); }

  function resolveRound(playerRaw, playerMisses, skipped, preGhosts){
    if(onlineActive()){ return duoSubmit(playerRaw, playerMisses); }   // two-devices duo: post my time, combine on the leaderboard
    var pen = PENALTY[(S.chosen&&S.chosen.cat) || 'trivia'];
    var playerEff = skipped ? playerRaw : (playerRaw + playerMisses*pen);
    S.lastResult = { raw:playerRaw, misses:playerMisses, eff:playerEff, skipped:!!skipped, pen:pen };

    var ghosts = preGhosts || simulateGhosts();
    // stamp this round's effective time onto every alive team
    S.teams.forEach(function(t){ if(t.alive) t.eff = t.isGhost ? null : playerEff; });
    ghosts.forEach(function(g){ g.team.eff = g.eff; });

    // retention metrics (badges)
    var st=statsDefault(); st.stagesPlayed++;
    if(!skipped){
      // fastest-stage only counts real wall-clock games; reaction/sequence report
      // a synthetic time (summed reaction / input-only) that isn't comparable.
      var k=taskKind(S.chosen||{});
      if(k!=='reaction' && k!=='sequence' && (!st.fastestStage || playerRaw<st.fastestStage)) st.fastestStage=playerRaw;
      if(playerMisses===0) st.perfectStages++;
    }
    saveStats(st);

    S.phase='checkpoint';
    renderStage();
  }

  /* --- phase: checkpoint (lock the time) --- */
  function viewCheckpoint(){
    sfx('checkpoint');
    var r=S.lastResult;
    var body;
    if(r.skipped){

    } else {

  /* --- phase: leaderboard + grounding --- */
  function viewLeaderboard(){
    var ranked = aliveTeams().slice().sort(function(a,b){ return a.eff-b.eff; });
    var final = isFinal();
    // determine who is Grounded this stage (slowest), or the winner on the Final
    var groundedTeam = ranked[ranked.length-1];
    var youRank = ranked.findIndex(function(t){ return t.id==='you'; }) + 1;

    var rowsHtml='';
    ranked.forEach(function(t,i){
      var out = (!final && t===groundedTeam);

        + '<span class="nm">'+esc(t.name)+''+'</span>'

    var banner;

      var youWon = ranked[0].id==='you';

        ? '<div class="banner win"><h2>🏆 You win RunTheGlobe!</h2><p>First across the finish at '+esc(S.dest.landmark||S.dest.name)+'. The whole race is yours.</p></div>'
        : '<div class="banner grounded"><h2>So close.</h2><p>You finished #'+youRank+' in the Final at '+esc(S.dest.name)+'. '+esc(ranked[0].name)+' took the race.</p></div>';
    } else if(groundedTeam.id==='you'){
      banner = '<div class="banner grounded"><h2>✈️ You\'ve been Grounded</h2><p>Slowest at '+esc(S.dest.name)+' this Stage. Your race ends here.</p></div>';
    } else {
      banner = '<div class="banner safe"><h2>You advance ›</h2><p>#'+youRank+' of '+ranked.length+' at '+esc(S.dest.name)+'. '+esc(groundedTeam.name)+' is Grounded.</p></div>';
    }

    app.innerHTML = topbar() + hud()
      + '<div class="card">'
        + banner
        + '<div class="lb">'+rowsHtml+'</div>'
        + '<div id="lbbtns"></div>'
      + '</div>' + foot();

    var btns=$('lbbtns');
    if(final){
      var youWon2 = ranked[0].id==='you';
      sfx(youWon2?'win':'lose');
      recordRaceEnd(ranked);
      btns.innerHTML='<div class="btnrow"><button class="btn ghost" id="home">Home</button><button class="btn ghost" id="share">📋 Share</button><button class="btn globe" id="again">Race again 🌍</button></div>';
      $('home').onclick=function(){ S.screen='home'; render(); };
      $('again').onclick=function(){ S.screen='setup'; render(); };

          ? ('🌍 I just WON RunTheGlobe — first across the finish at '+(S.dest.landmark||S.dest.name)+', beating '+(FIELD_SIZE-1)+' teams! Play at runthe.gg/globe')
          : ('🌍 I finished #'+youRank+' of '+FIELD_SIZE+' in RunTheGlobe\'s Final at '+S.dest.name+'. Can you do better? runthe.gg/globe'));
      };
    } else if(groundedTeam.id==='you'){
      sfx('lose');
      recordRaceEnd(ranked);   // record now (idempotent) so an abandon still counts
      // GDD §10: binary Grounded choice — watch live, or return home. No reward for watching.
      btns.innerHTML='<div class="btnrow"><button class="btn ghost" id="home">Return home</button><button class="btn globe" id="watch">Watch the rest ▶</button></div>';
      $('home').onclick=function(){ S.screen='home'; render(); };
      $('watch').onclick=function(){ S.phase='grounded'; S.spectating=true; groundAndAdvance(groundedTeam); render(); };
    } else {
      btns.innerHTML='<button class="btn globe" id="next" style="margin-top:14px">Next Stage ›</button>';
      $('next').onclick=function(){ groundAndAdvance(groundedTeam); S.round++; drawStage(); };
    }
    renderAcct();
  }

  function groundAndAdvance(team){ team.alive=false; team.grounded=true; }

  /* --- phase: spectate (player Grounded, watching the field finish) --- */
  function viewGrounded(){
    // auto-simulate the remaining stages among the ghost field, quick summary.
    while(S.round < ROUNDS && aliveTeams().length > 3){
      S.round++;
      simSpectatorStage();
    }
    // Final among the last 3
    S.round = ROUNDS;
    var last3 = aliveTeams().slice();
    // pace a final and rank
    var kind='mcq', base=BASE.mcq;
    var res = last3.map(function(t){ return { team:t, eff: base*t.skill*rnd(0.9,1.12) }; });
    res.sort(function(a,b){ return a.eff-b.eff; });

    var rows='';
    res.forEach(function(x,i){
      rows+='<div class="lbrow'+(i===0?' win':'')+'"><span class="p">'+(i===0?'🏆':(i+1))+'</span>'

        + '<div class="lb">'+rows+'</div>'

      + '</div>' + foot();

    $('again').onclick=function(){ S.screen='setup'; render(); };

  function simSpectatorStage(){
    var ghosts=aliveTeams().filter(function(t){return t.isGhost;});
    var base=BASE.mcq;
    var res=ghosts.map(function(t){ return {team:t, eff: base*t.skill*rnd(0.9,1.12)}; });
    res.sort(function(a,b){ return a.eff-b.eff; });
    var slow=res[res.length-1]; if(slow) slow.team.alive=false;
  }

  /* --------------------------------------------------------- record a race */
  function recordRaceEnd(ranked){
    if(S._recorded) return; S._recorded=true;
    var st=statsDefault();
    var before=badgeTiers(st);
    st.races++;
    var youRank = ranked.findIndex(function(t){ return t.id==='you'; }) + 1;
    var won = isFinal() && ranked[0] && ranked[0].id==='you';
    // finishing place: on the Final it's the rank; if Grounded mid-race it's the
    // number still in the race at that stage (the player was slowest of them).
    var place = isFinal() ? youRank : aliveTeams().length;
    if(!st.bestPlace || place<st.bestPlace) st.bestPlace=place;
    if(won) st.wins++;
    if(isFinal() && youRank<=3) st.top3++;
    if(won){ st.winStreak=(st.winStreak||0)+1; if(st.winStreak>st.longestStreak) st.longestStreak=st.winStreak; }
    else { st.winStreak=0; }
    saveStats(st);
    announceNewBadges(before);
  }
  // reset the per-race guard whenever a new race starts
  var _startRace = startRace;
  startRace = function(){ S._recorded=false; _startRace(); };

  /* ======================================================================
     TWO-DEVICES DUO (Beta) — host-less, deterministic — GDD §3/§6-9
     Two players pair into ONE team via a short code. The duo shares a SEED, so
     BOTH devices run the exact same race locally: identical country order,
     finish line, AI opponent field and eliminations. There is no "host of the
     game" and the field always finishes, because every device computes the same
     outcome. Each Stage BOTH partners play — and they're forced onto DIFFERENT
     challenges (one each of the two Split-Path options), so they can't both grab
     the fast one. The team's Stage time is the two partners' effective times
     ADDED together. Each device posts its own time; realtime pushes the
     partner's. Refresh-safe: the pairing is stored and the whole race is rebuilt
     from the seed + posted times. Requires supabase/43_globe_duo.sql.
     ====================================================================== */
  function onlineActive(){ return !!(S.online && S.online.active); }
  function finishById(id){ for(var i=0;i<FINISH.length;i++){ if(FINISH[i].id===id) return FINISH[i]; } return null; }
  function toast(msg){
    var t=document.createElement('div'); t.textContent=msg;
    t.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;'
      +'background:#122a44;border:1px solid var(--cardb);color:var(--ink);font-weight:700;font-size:13px;'
      +'padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.7);max-width:90%;text-align:center;';
    document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 3200);
  }
  function rpc(fn, args){ return sb.rpc(fn, args); }

  /* ---- duo entry: pair with a partner (the race is always "already there") ---- */
  function renderDuoMenu(){

        + '<button class="btn globe" id="oresume">Rejoin race ›</button>'

    app.innerHTML = topbar()
      + '<div class="card"><h2 style="font-size:22px">Team Race · Two Devices <span style="font-size:12px;color:var(--globe)">Beta</span></h2>'

        + '<label class="fld" for="ojoin">Join your partner\'s code</label>'
        + '<input type="text" id="ojoin" maxlength="5" placeholder="ABC12" style="text-transform:uppercase" />'
