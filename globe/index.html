<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RunTheGlobe — Globe-Trotting Race (Preview Build)</title>

<!-- PREVIEW / BACKGROUND BUILD: this game is not released yet. Keep it out of
     search until it ships, and it is intentionally NOT linked from the homepage
     or listed in sitemap.xml. -->
<meta name="robots" content="noindex,nofollow" />
<meta name="description" content="RunTheGlobe: a globe-trotting drafting and trivia race. Draw a country each stage, beat the clock, check in, and don't finish last — or you're Grounded. Part of RunThe.GG." />
<meta name="theme-color" content="#0e0b20" />

<link rel="icon" href="/globe/brand/icon_48.png?v=4" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/globe/brand/icon_32.png?v=4" />
<link rel="icon" type="image/png" sizes="192x192" href="/globe/brand/icon_192.png?v=4" />
<link rel="apple-touch-icon" sizes="180x180" href="/globe/brand/icon_180.png?v=4" />
<link rel="manifest" href="/globe/manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="RunTheGlobe" />

<!-- social card (the wordmark on its own dark map) -->
<meta property="og:type" content="website" />
<meta property="og:title" content="RunTheGlobe — The Race Around The World" />
<meta property="og:description" content="Draw a country, beat the clock, don't finish last. A globe-trotting race — part of RunThe.GG." />
<meta property="og:image" content="/globe/brand/og.jpg?v=4" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet" />

<!-- Google AdSense (same publisher tag as the rest of RunThe.GG; Auto ads).
     Left in place so the preview matches the live monetization pattern (GDD §15). -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5952069078178257" crossorigin="anonymous"></script>

<!-- RunThe.GG shared account session (same Supabase project as the other games;
     the session lives in localStorage on this origin, so a player signed in on
     runthe.gg is the same identity here). Fail-open: the game is fully playable
     with no account and no network. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<style>
  :root{
    /* brand: deep indigo-navy + brass gold hero + coral action + map green
       (matched to the RunTheGlobe stopwatch icon & gold wordmark) */
    --bg:#0e0b20; --bg2:#141031; --card:#1a1638; --card2:#231d47; --cardb:#332c58;
    --ink:#f1eee6; --mut:#a49dbe;
    --globe:#ECB550; --goldhi:#F6D488; --golddk:#C6913A;   /* PRIMARY = brass gold */
    --teal:#46A56C; --emer:#46A56C; --amber:#ECB550;        /* secondary = map green */
    --coral:#EE5A44;                                        /* action / danger */
    --line:rgba(255,255,255,.09); --ok:#3fce86; --bad:#ff6b6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  /* snappy input: no 300ms tap delay / double-tap-zoom, no text-selection lag on
     rapid tapping across every interactive surface */
  .btn,.opt,.taskcard,.mode,.hlo,.oitem,.ltile,.seqtile,.mutebtn,.eet,.kmo,.tkt,.bgc,.wkc,
  #mg,#mg *{touch-action:manipulation;}
  #mg,.opt,.taskcard,.hlo,.seqtile,.btn{user-select:none;-webkit-user-select:none;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1150px 560px at 50% -12%, rgba(236,181,80,.15), transparent 62%),
      radial-gradient(760px 460px at 90% 3%, rgba(238,90,68,.11), transparent 55%),
      radial-gradient(900px 720px at 6% 106%, rgba(70,165,108,.10), transparent 60%),
      linear-gradient(180deg,#140f2c 0%, var(--bg) 46%, #08061a 100%);
    background-attachment:fixed;
  }
  /* faint lat/long grid — echoes the wordmark map, kills the flat "empty dark" look */
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(120% 90% at 50% 0%,#000 40%,transparent 85%);
            mask-image:radial-gradient(120% 90% at 50% 0%,#000 40%,transparent 85%);}
  .wrap{max-width:620px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 42px;}

  /* preview ribbon */
  .preview{background:linear-gradient(90deg,rgba(236,181,80,.16),rgba(238,90,68,.15));
    border:1px solid rgba(236,181,80,.35);color:var(--goldhi);border-radius:12px;
    font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    padding:7px 12px;text-align:center;margin-bottom:14px;}

  /* topbar */
  .topbar{display:flex;align-items:center;gap:11px;margin-bottom:16px;}
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;min-width:0;}
  .globemark{width:40px;height:40px;flex:0 0 auto;border-radius:12px;display:block;object-fit:cover;
    border:1px solid rgba(236,181,80,.35);box-shadow:0 5px 16px -7px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.35);}
  .wm{font-family:'Bricolage Grotesque','Archivo',sans-serif;font-weight:400;letter-spacing:.015em;font-size:23px;line-height:1;
    white-space:nowrap;}
  .wm .r{color:var(--globe);} .wm .t{color:var(--ink);} .wm .g{color:var(--globe);}
  .mutebtn{margin-left:auto;flex:0 0 auto;background:rgba(255,255,255,.05);border:1px solid var(--cardb);border-radius:10px;
    width:44px;height:44px;font-size:17px;cursor:pointer;line-height:1;padding:0;transition:border-color .15s,background .15s;}
  .mutebtn:hover{border-color:var(--globe);background:rgba(236,181,80,.08);}
  .mutebtn + .acct{margin-left:10px;}
  .acct{text-align:right;font-size:12px;line-height:1.3;flex:0 0 auto;}
  .acct .u{color:var(--globe);font-weight:800;}
  .acct .lo{color:var(--mut);}
  .acct a{color:var(--teal);text-decoration:none;font-weight:700;}
  .acct a:hover{text-decoration:underline;}

  h1,h2,h3{font-family:'Bricolage Grotesque','Archivo',sans-serif;font-weight:400;letter-spacing:.02em;text-transform:uppercase;margin:0;}

  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--cardb);
    border-radius:20px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;
    box-shadow:0 18px 40px -24px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.04);}
  /* soft brass top-edge sheen so cards read as lit, not flat panels */
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(246,212,136,.28),transparent);pointer-events:none;}
  .card.center{text-align:center;}
  .lede{color:var(--mut);font-size:14px;line-height:1.6;margin:8px 0 0;}
  .muted{color:var(--mut);}

  /* home hero — the gold wordmark on its own map, framed to bleed then fade into the page */
  .hero{position:relative;border-radius:20px;overflow:hidden;margin-bottom:14px;border:1px solid var(--cardb);
    background:var(--card);box-shadow:0 22px 50px -26px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.05);}
  .hero-imgwrap{position:relative;}
  .hero-wm{display:block;width:100%;height:auto;}
  /* fade only the bottom sliver of the banner into the card so text never overlaps the logo */
  .hero-imgwrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none;
    background:linear-gradient(180deg,transparent,var(--card));}
  .hero-cap{padding:2px 18px 18px;text-align:center;}
  .hero-cap .lede{color:#d9d3ea;}
  .herohook{font-family:'Bricolage Grotesque','Archivo',sans-serif;font-weight:800;font-size:19px;line-height:1.2;
    color:var(--goldhi);}

  /* how-to-play panels (illustrated) */
  .howp{display:flex;gap:15px;align-items:center;padding:15px;}
  .howp .howillo{flex:0 0 auto;width:98px;min-height:92px;border-radius:14px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;text-align:center;padding:8px 6px;color:var(--acc);
    background:radial-gradient(circle at 40% 28%,var(--accl),rgba(255,255,255,.02) 75%);border:1px solid var(--accb);}
  .howp .howtx{min-width:0;flex:1;}
  .howp .howtx h3{font-family:'Bricolage Grotesque','Archivo',sans-serif;font-size:15.5px;margin-bottom:5px;}
  .howp .howtx p{font-size:12.5px;color:var(--mut);line-height:1.55;margin:0;}
  .howp .howtx p b{color:var(--ink);}
  .ill-flag{font-size:34px;line-height:1;}
  .ill-t{font-family:'Bricolage Grotesque','Archivo',sans-serif;font-weight:800;font-size:12px;color:var(--ink);letter-spacing:.03em;}
  .ill-s{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);}
  .ill-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:18px;}
  .ill-split{display:flex;flex-direction:column;gap:5px;width:100%;font-size:9.5px;font-weight:800;}
  .ill-split span{padding:5px 6px;border-radius:7px;border:1px solid var(--accb);background:rgba(255,255,255,.05);color:var(--ink);}
  .ill-time{font-family:'Bricolage Grotesque','Archivo',sans-serif;font-weight:800;font-size:30px;color:var(--acc);line-height:1;}
  .ill-time span{font-size:14px;color:var(--mut);}
  .ill-lb{width:86px;font-size:8.5px;font-weight:700;}
  .ill-lb div{display:flex;justify-content:space-between;gap:6px;padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.06);margin-bottom:3px;color:var(--ink);}
  .ill-lb .g{background:rgba(238,90,68,.2);color:#ffb3a6;}

  /* City Run (the Amazing-Race sprint to the Checkpoint) */
  #runscene{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--cardb);cursor:pointer;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;}
  .runbanner{position:absolute;top:8px;left:10px;font-family:'Bricolage Grotesque','Archivo',sans-serif;font-weight:800;
    font-size:13px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.75);letter-spacing:.05em;pointer-events:none;}
  .runtmr{position:absolute;top:8px;right:10px;font-weight:900;font-size:12.5px;color:#fff;background:rgba(0,0,0,.4);
    padding:3px 8px;border-radius:8px;font-variant-numeric:tabular-nums;pointer-events:none;}
  .runhint{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,.85);pointer-events:none;}
  .gate.pick .matp{animation:gatepulse .9s ease-in-out infinite;}
  @keyframes gatepulse{0%,100%{opacity:.45;}50%{opacity:1;}}
  @keyframes runshake{0%,100%{transform:none;}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .runshake{animation:runshake .28s ease;}

  .btn{appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:800;font-size:15px;
    border-radius:13px;padding:14px 18px;text-decoration:none;display:inline-flex;align-items:center;
    justify-content:center;gap:8px;transition:transform .12s cubic-bezier(.22,.9,.32,1),filter .15s,box-shadow .2s;
    line-height:1;width:100%;letter-spacing:.01em;}
  .btn:hover:not([disabled]){transform:translateY(-1px);filter:brightness(1.05);}
  .btn:active{transform:translateY(1px);}
  /* primary CTA = brass gold (dark ink text reads premium on gold) */
  .btn.globe{background:linear-gradient(180deg,var(--goldhi),var(--globe) 55%,var(--golddk));color:#2a1e05;
    box-shadow:0 10px 26px -12px rgba(236,181,80,.85), inset 0 1px 0 rgba(255,255,255,.45);}
  /* coral action button */
  .btn.gold{background:linear-gradient(180deg,#F5715C,#E24632);color:#fff;
    box-shadow:0 10px 26px -12px rgba(238,90,68,.85), inset 0 1px 0 rgba(255,255,255,.25);}
  .btn.ghost{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--cardb);}
  .btn.ghost:hover{border-color:var(--globe);background:rgba(236,181,80,.07);}
  .btn.sm{width:auto;padding:12px 16px;font-size:13px;min-height:44px;}
  .btn[disabled]{opacity:.45;cursor:default;filter:grayscale(.3);}
  .btnrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .btnrow .btn{flex:1 1 auto;}

  /* mode list — each mode is a designed card with its own accent identity */
  .mode{--acc:var(--globe);--accl:rgba(236,181,80,.26);--accb:rgba(236,181,80,.42);--accs:rgba(236,181,80,.5);
    display:flex;align-items:center;gap:15px;width:100%;text-align:left;margin-bottom:12px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
    border:1px solid var(--line);border-radius:18px;padding:16px 16px 16px 19px;cursor:pointer;
    transition:border-color .18s,transform .18s cubic-bezier(.22,.9,.32,1),box-shadow .18s,background .18s;}
  .m-gold{--acc:#ECB550;--accl:rgba(236,181,80,.26);--accb:rgba(236,181,80,.42);--accs:rgba(236,181,80,.55);}
  .m-green{--acc:#4FB57A;--accl:rgba(70,165,108,.28);--accb:rgba(70,165,108,.46);--accs:rgba(70,165,108,.55);}
  .m-coral{--acc:#F0684F;--accl:rgba(238,90,68,.26);--accb:rgba(238,90,68,.44);--accs:rgba(238,90,68,.55);}
  .mode::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc);opacity:.85;}
  /* faint accent glow bloom behind the icon */
  .mode::after{content:"";position:absolute;left:-10px;top:50%;width:120px;height:120px;transform:translateY(-50%);
    background:radial-gradient(circle,var(--accl),transparent 68%);opacity:.5;pointer-events:none;}
  .mode:hover:not(.soon){transform:translateY(-2px);border-color:var(--accb);box-shadow:0 16px 34px -20px #000,0 0 0 1px var(--accb) inset;}
  .mode.soon{opacity:.6;cursor:default;}
  .mode .ic{position:relative;z-index:1;flex:0 0 auto;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    color:var(--acc);background:radial-gradient(circle at 34% 26%,var(--accl),rgba(255,255,255,.02) 75%);
    border:1px solid var(--accb);box-shadow:0 8px 18px -10px var(--accs),inset 0 1px 0 rgba(255,255,255,.14);}
  .mode .ic svg{width:28px;height:28px;display:block;}
  .mode .mm{min-width:0;flex:1;position:relative;z-index:1;}
  .mode .mn{display:block;font-family:'Bricolage Grotesque','Archivo',sans-serif;font-weight:800;font-size:17px;letter-spacing:.005em;line-height:1.12;}
  .mode .md{display:block;color:var(--mut);font-size:12.5px;margin-top:4px;line-height:1.45;}
  .mode .chev{flex:0 0 auto;position:relative;z-index:1;color:var(--mut);font-size:22px;line-height:1;opacity:.55;transition:color .16s,opacity .16s,transform .16s;}
  .mode:hover:not(.soon) .chev{color:var(--acc);opacity:1;transform:translateX(3px);}
  .tag{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:999px;align-self:center;
    background:var(--accl);color:var(--acc);border:1px solid var(--accb);flex:0 0 auto;position:relative;z-index:1;}
  .tag.soon{background:rgba(255,255,255,.06);color:var(--mut);border-color:var(--line);}

  input[type=text]{width:100%;background:rgba(8,6,20,.6);border:1px solid var(--cardb);border-radius:11px;color:var(--ink);
    font-family:inherit;font-size:15px;padding:12px 13px;outline:none;transition:border-color .15s,box-shadow .15s;}
  input[type=text]:focus{border-color:var(--globe);box-shadow:0 0 0 3px rgba(236,181,80,.16);}
  label.fld{display:block;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:0 0 7px;}

  /* HUD */
  .hud{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .pips{display:flex;gap:5px;flex:1;min-width:0;flex-wrap:wrap;}
  .pip{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.12);flex:0 0 auto;}
  .pip.done{background:var(--globe);} .pip.now{background:var(--coral);box-shadow:0 0 0 3px rgba(238,90,68,.25);}
  .pip.final{background:var(--amber);}
  .remain{font-size:12px;font-weight:800;color:var(--mut);white-space:nowrap;}
  .remain b{color:var(--ink);}

  /* destination reveal */
  .dest{text-align:center;padding:6px 0 2px;}
  .dest .fl{font-size:64px;line-height:1;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));}
  .dest .cn{font-family:'Bricolage Grotesque','Archivo',sans-serif;font-size:36px;margin-top:8px;letter-spacing:.01em;
    color:var(--goldhi);text-shadow:0 2px 14px rgba(0,0,0,.5);}
  .dest .rg{color:var(--mut);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-top:4px;}
  .coopturn{text-align:center;background:rgba(236,181,80,.1);border:1px solid rgba(236,181,80,.35);border-radius:12px;
    padding:9px 12px;margin:0 0 12px;font-size:13.5px;color:#F6D488;}
  .dest .final-badge{display:inline-block;margin-top:10px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:#2a1c00;background:linear-gradient(180deg,#ffd766,#ECB550);padding:5px 11px;border-radius:999px;}

  /* task choice */
  .stagetype{text-align:center;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:2px 0 12px;}
  .choice{display:grid;gap:12px;}
  .taskcard{text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--cardb);border-radius:15px;
    padding:15px;cursor:pointer;transition:border-color .12s,transform .12s;}
  .taskcard:hover{border-color:var(--globe);transform:translateY(-1px);}
  .taskcard .ct{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .catchip{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;
    background:rgba(236,181,80,.14);color:#F6D488;border:1px solid rgba(236,181,80,.3);}
  .catchip.reflex{background:rgba(238,90,68,.14);color:#ffc2be;border-color:rgba(238,90,68,.32);}
  .taskcard .pen{margin-left:auto;font-size:11px;color:var(--mut);font-weight:700;}
  .taskcard .pr{font-size:14px;color:var(--ink);font-weight:700;line-height:1.4;}

  /* minigame */
  .game-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .game-hd .cat{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);}
  .timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:900;font-size:18px;color:var(--ink);
    background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:5px 10px;}
  .prompt{font-size:17px;font-weight:800;line-height:1.4;margin-bottom:14px;}
  .opts{display:grid;gap:10px;}
  .opt{position:relative;text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--cardb);border-radius:12px;
    padding:14px 40px 14px 15px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;transition:border-color .1s,background .1s,transform .1s;}
  .opt:hover{border-color:var(--globe);}
  .opt.right{border-color:var(--ok);background:rgba(53,214,160,.12);}
  .opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.12);}
  /* glyph so correctness isn't signalled by colour alone (accessibility) */
  .opt.right::after,.opt.wrong::after{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-weight:900;font-size:16px;}
  .opt.right::after{content:"✓";color:var(--ok);}
  .opt.wrong::after{content:"✗";color:var(--bad);}

  /* zoom reveal (guess the flag as it zooms out) */
  .zoombox{width:158px;height:158px;margin:8px auto 0;border-radius:16px;overflow:hidden;border:1px solid var(--cardb);
    background:#15112e;display:flex;align-items:center;justify-content:center;}
  .zoomflag{font-size:132px;line-height:1;transform:scale(6);transition:transform 6.5s linear;will-change:transform;}

  /* juice: gentle, cushioned motion — no hard cuts, no re-render jumps */
  @keyframes rtgFade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes rtgPop{0%{transform:scale(.6);opacity:0;}60%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
  @keyframes rtgSwap{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
  @keyframes rtgPopIn{0%{transform:scale(.55);opacity:0;}60%{transform:scale(1.1);opacity:1;}100%{transform:scale(1);opacity:1;}}
  @keyframes rtgBelt{from{transform:translateX(30px);opacity:.25;}to{transform:none;opacity:1;}}
  @keyframes rtgToast{from{opacity:0;transform:translate(-50%,12px);}to{opacity:1;transform:translate(-50%,0);}}
  @keyframes rtgFlash{from{box-shadow:inset 0 0 0 3px rgba(53,214,160,.55);}to{box-shadow:inset 0 0 0 3px rgba(53,214,160,0);}}
  .card{animation:rtgFade .3s cubic-bezier(.22,.9,.32,1) both;}
  .card+.card{animation-delay:.05s;}
  .card+.card+.card{animation-delay:.1s;}
  .card+.card+.card+.card{animation-delay:.15s;}
  .bigtime{animation:rtgPop .4s cubic-bezier(.2,1.3,.4,1) both;}
  .swap-in{animation:rtgSwap .22s cubic-bezier(.22,.9,.32,1) both;}
  .pop-in{animation:rtgPopIn .22s cubic-bezier(.2,1.2,.4,1) both;}
  .bg-step{animation:rtgBelt .3s cubic-bezier(.22,.9,.32,1);}
  .hitflash{animation:rtgFlash .4s ease-out;}
  .dest .fl{animation:rtgPop .5s cubic-bezier(.2,1.3,.4,1) both;}
  .dest .cn,.dest .rg{animation:rtgSwap .3s ease-out both;}
  .dest .cn{animation-delay:.08s;} .dest .rg{animation-delay:.14s;}
  .choice .taskcard{animation:rtgSwap .26s cubic-bezier(.22,.9,.32,1) both;}
  .choice .taskcard:nth-child(2){animation-delay:.06s;}
  .pip{transition:background .35s ease,box-shadow .35s ease;}
  .opt:active,.taskcard:active,.oitem:active{transform:scale(.99);}
  .lb .lbrow>span{animation:rtgSwap .26s cubic-bezier(.22,.9,.32,1) both;}
  .lbrow:nth-child(2)>span{animation-delay:.03s;} .lbrow:nth-child(3)>span{animation-delay:.06s;}
  .lbrow:nth-child(4)>span{animation-delay:.09s;} .lbrow:nth-child(5)>span{animation-delay:.12s;}
  .lbrow:nth-child(6)>span{animation-delay:.15s;} .lbrow:nth-child(7)>span{animation-delay:.18s;}
  .lbrow:nth-child(8)>span{animation-delay:.21s;} .lbrow:nth-child(9)>span{animation-delay:.24s;}
  .lbrow:nth-child(10)>span{animation-delay:.27s;} .lbrow:nth-child(11)>span{animation-delay:.3s;}

  .missline{font-size:12.5px;color:var(--mut);margin-top:12px;text-align:center;}

  /* scramble */
  .slot{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;min-height:52px;margin-bottom:14px;}
  .tileslot{width:40px;height:48px;border:2px dashed var(--cardb);border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:22px;color:var(--ink);background:rgba(0,0,0,.15);}
  .tileslot.filled{border-style:solid;border-color:var(--globe);background:rgba(236,181,80,.12);}
  .bank{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
  .ltile{width:44px;height:50px;border:1px solid var(--cardb);border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:22px;color:var(--ink);background:rgba(255,255,255,.05);cursor:pointer;transition:transform .08s,opacity .1s;}
  .ltile:hover{transform:translateY(-2px);border-color:var(--globe);}

  /* sequence / memory */
  .seqgrid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0 14px;}
  .seqtile{width:62px;height:62px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;
    background:rgba(255,255,255,.05);border:1px solid var(--cardb);cursor:pointer;transition:transform .1s,background .1s,box-shadow .1s;}
  .seqtile.lit{background:rgba(236,181,80,.35);box-shadow:0 0 0 4px rgba(236,181,80,.25);transform:scale(1.08);}

  .seqstatus{text-align:center;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:10px;}

  /* reaction */
  .reactbox{height:190px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;text-align:center;transition:background .05s;border:1px solid var(--cardb);}
  .reactbox.wait{background:linear-gradient(180deg,#221c46,#161130);}
  .reactbox.go{background:linear-gradient(180deg,#54b878,#2c7d4c);}      /* map-green GO — on theme */
  .reactbox.stop{background:linear-gradient(180deg,#F26D6E,#c1332f);}    /* coral STOP — on theme */
  .reactbox.idle{background:rgba(255,255,255,.04);}
  .reactbox.fb{background:linear-gradient(180deg,#231d47,#15112e);}
  .reactbox .big{font-family:'Bricolage Grotesque','Archivo',sans-serif;font-size:28px;}
  .reactbox .sm{font-size:13px;color:rgba(255,255,255,.85);margin-top:6px;}
  .reps{display:flex;gap:6px;justify-content:center;margin-bottom:12px;}
  .rep{width:26px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);}

  /* Stamp It — a real passport page you press ink stamps onto */
  .passport{position:relative;height:180px;border-radius:12px;overflow:hidden;cursor:pointer;touch-action:manipulation;
    background:linear-gradient(160deg,#efe4c6,#dcc99e 60%,#cdb888);border:1px solid #a98f5f;

  .passport .gutter{position:absolute;left:50%;top:6px;bottom:6px;width:2px;transform:translateX(-1px);

  .oitem:hover{border-color:var(--globe);}
  .oitem.placed{opacity:.4;pointer-events:none;border-color:var(--ok);}
  .oitem .num{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:900;flex:0 0 auto;}
  .oitem .num.on{background:var(--globe);color:#fff;}
  .ohint{font-size:12.5px;color:var(--mut);text-align:center;margin-bottom:12px;}

  /* checkpoint / result */
  .bigtime{font-family:'Bricolage Grotesque','Archivo',sans-serif;font-size:48px;text-align:center;letter-spacing:.01em;
    color:var(--goldhi);text-shadow:0 3px 16px rgba(236,181,80,.2);}
  .bigtime .u{font-size:22px;color:var(--mut);}
  .breakdown{display:flex;justify-content:center;gap:18px;margin-top:6px;color:var(--mut);font-size:13px;font-weight:700;}
  .breakdown b{color:var(--ink);}

  /* leaderboard */
  .lb{display:grid;grid-template-columns:30px 1fr auto;gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);}

  .lbrow .nm .ai{font-size:9.5px;font-weight:800;letter-spacing:.05em;color:var(--mut);background:rgba(255,255,255,.07);
    border:1px solid var(--line);padding:1px 5px;border-radius:5px;}
  .lbrow .tm{font-variant-numeric:tabular-nums;font-weight:800;justify-content:flex-end;white-space:nowrap;}
  .lbrow.you>span{background:rgba(236,181,80,.12);}
  .lbrow.you .nm{color:#F6D488;}
  .lbrow.out>span{background:rgba(238,90,68,.1);}
  .lbrow.out .tm{color:var(--coral);}

  .banner{border-radius:14px;padding:15px;text-align:center;margin-bottom:14px;}
  .banner.safe{background:rgba(53,214,160,.1);border:1px solid rgba(53,214,160,.35);}
  .banner.grounded{background:rgba(238,90,68,.12);border:1px solid rgba(238,90,68,.4);}
  .banner.win{background:linear-gradient(180deg,rgba(236,181,80,.18),rgba(238,90,68,.12));border:1px solid rgba(236,181,80,.4);}
  .banner h2{font-size:24px;} .banner p{margin:6px 0 0;color:var(--mut);font-size:13.5px;line-height:1.5;}
  .banner.grounded h2{color:var(--coral);} .banner.win h2{color:var(--amber);}

  /* records */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .stat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;}
  .stat .v{font-family:'Bricolage Grotesque','Archivo',sans-serif;font-size:24px;color:var(--globe);}
  .stat .k{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-top:3px;}

  /* how-to steps */
  .steps{display:grid;gap:9px;}
  .step{display:flex;gap:11px;align-items:flex-start;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:11px 13px;}
  .step .n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--globe);color:#fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .step .tx{font-size:13px;line-height:1.5;color:var(--mut);} .step .tx b{color:var(--ink);}

  /* trophy room */
  .badges-list{display:grid;gap:10px;}
  .badge-row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:13px;padding:11px 13px;opacity:.62;}
  .badge-row.earned{opacity:1;border-color:rgba(236,181,80,.35);background:rgba(236,181,80,.06);}
  .badge-ic{flex:0 0 auto;width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:23px;background:#15112e;border:1px solid var(--line);}
  .badge-meta{flex:1;min-width:0;}
  .badge-nm{font-weight:800;font-size:14px;}
  .badge-tier{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#2a1c00;background:linear-gradient(180deg,#ffd766,#ECB550);padding:2px 7px;border-radius:999px;margin-left:6px;}
  .badge-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);margin:7px 0 4px;overflow:hidden;}
  .badge-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--globe),var(--teal));}
  .badge-prog{font-size:11.5px;color:var(--mut);font-weight:700;}

  .skiprow{display:flex;align-items:center;gap:10px;background:rgba(236,181,80,.08);border:1px solid rgba(236,181,80,.3);
    border-radius:12px;padding:11px 13px;margin-top:12px;}
  .skiprow .sx{font-size:12.5px;color:#f3dca0;line-height:1.4;flex:1;}
  .skiprow .sx b{color:#ffd766;}

  .foot{margin-top:26px;text-align:center;color:#6f829a;font-size:12px;line-height:1.8;}
  .foot a{color:#9db2c8;text-decoration:none;font-weight:700;}
  .foot a:hover{color:var(--ink);}
  .foot .sep{margin:0 6px;color:#3c4c60;}
  .foot .footsub{margin-top:5px;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.02em;}
  .foot .footsub a{color:var(--globe);font-weight:800;}
</style>

  <div class="wrap" id="app"><!-- rendered by JS --></div>

<!-- data banks (loaded before the engine) -->

<script>
"use strict";
(function(){
/* ==========================================================================
   RunTheGlobe — Offline Solo engine (GDD v1)
   Playable MVP: the full per-round race loop for one human vs a ghost field.
   No backend dependency (GDD §7 "fastest to ship"). Online / duo modes are
   scaffolded on the home screen but not yet wired.
   ========================================================================== */

  var COUNTRIES = window.GLOBE_COUNTRIES || [];
  var FINISH = window.GLOBE_FINISH_LINES || [];

  /* ---- IP-safe terminology (GDD §2) is used throughout the UI strings ----
     Checkpoint / Split Path / Solo Call / Skip Pass / Grounded / Stage ---- */

  var FIELD_SIZE = 11;   // GDD §3: 11 teams max per lobby
  var ROUNDS     = 9;    // GDD §3: 9 stages, Round 9 = the Final (top 3)

  // Miss penalty by scoring category (GDD §4). word/dragdrop/audio are not in
  // the §4 table (which lists the 5 scoring categories); mapped to sensible
  // defaults here and flagged in README as pending design sign-off.
  // --- Street Scout (Mapillary street imagery) — GDD §13, virtual/immersive ---
  // Leave BLANK to keep the street game DISABLED (default, ships dormant). To
  // enable: create a free Mapillary client token (mapillary.com → your account →
  // Developers → register an application) and paste it here. The game lazy-loads
  // the Mapillary viewer only when chosen and fails open (falls back to the map
  // pin-drop) if the token/SDK/imagery are unavailable — it can never break a race.
  // NOTE: needs live testing with a real token; untested against Mapillary so far.
  var MAPILLARY_TOKEN = 'MLY|28596352536621799|108d6154fbd03cc2b4bdbb06b9aac963';
  // Street Scout is PARKED until it can be tested end-to-end where Mapillary is
  // reachable (the build sandbox blocks Mapillary, so it can't be debugged here).
  // Flip STREET_LIVE = true to re-enable the game type — token + integration are
  // preserved. FORCE_STREET_FIRST forces stage 1 to Street Scout (testing only).
  var STREET_LIVE = false;
  var FORCE_STREET_FIRST = false;

  var PENALTY = { trivia:15, math:15, memory:12, spatial:12, reflex:10, word:12, dragdrop:12, audio:12, duo:8 };

  // task category -> DEFAULT interactive minigame kind (authored tasks). Generated
  // tasks (genTasks) carry their own `kind` explicitly, so one category can drive
  // several game types. This is what gives Split Path / Solo Call real variety.
  var KIND = { trivia:'mcq', math:'mcq', spatial:'order', memory:'sequence', reflex:'reaction', word:'scramble' };
  var CAT_LABEL = { trivia:'Trivia', math:'Math / Logic', spatial:'Spatial / Map', memory:'Memory',
                    reflex:'Reflex / Timing', word:'Word / Language' };
  // per-kind display label (shown on the task card + game header)
  var KIND_LABEL = {
    mcq:'Trivia', scramble:'Word Scramble', sequence:'Memory Sequence', reaction:'Signal Sprint',
    order:'Rank The Order', flagid:'Guess The Flag', capital:'Name The Capital',
    truefalse:'True or False', higherlower:'Higher or Lower', oddoneout:'Odd One Out',
    memorymatch:'Memory Match', whack:'Whack-A-Landmark', targettap:'Quick Tap', mapfind:'Find It On The Map',
    streetscout:'Street Scout', zoomreveal:'Zoom Reveal',
    swingmeter:'Swing Meter', eagleeye:'Eagle Eye', kimsgame:'Memory Lineup',
    typeticket:'Type The Ticket', baggage:'Baggage Claim', rhythmecho:'Rhythm Echo',
    closest:'Closest Neighbor', closerfar:'Closer or Farther', compass:'Compass Chase',
    regionsort:'Region Sort', flightplan:'Flight Plan', globehunt:'Globe Hunt', detective:'The Dossier',
    pitchpatrol:'Pitch Patrol', runway:'Pilot The Landing', photosnap:'Photo Snap', stampit:'Stamp It'
  };
  // expected completion (seconds) for an average player per kind — used ONLY to
  // pace the AI ghost field. The human always competes on real time, so these are
  // tuned so a competent human is ~even with the MEDIAN ghost on every kind (no
  // kind is an auto-win or an auto-loss). Retuned after playtest audit:
  //  · eagleeye/kimsgame were far too fast (human always Grounded) → raised
  //  · reaction/sequence report synthetic input-only time → ghosts sped up so
  //    they aren't free wins that dominate every Split Path choice
  var BASE = { mcq:6, scramble:13, sequence:5, reaction:2.8, order:14,
    flagid:5.5, capital:5.5, truefalse:7, higherlower:7, oddoneout:6,
    memorymatch:15, whack:8, targettap:6.5, mapfind:9, streetscout:22, zoomreveal:7,
    swingmeter:8, eagleeye:15, kimsgame:14, typeticket:12, baggage:9, rhythmecho:13,
    closest:6, closerfar:8, compass:7, regionsort:10, flightplan:12, globehunt:12, detective:9,
    pitchpatrol:14, runway:9, photosnap:8, stampit:7 };
  // which kinds feel "reflex/physical" for Split Path pairing (GDD §5); rest are "brain"
  var REFLEX_KINDS = { reaction:1, whack:1, targettap:1, sequence:1,
    swingmeter:1, eagleeye:1, baggage:1, rhythmecho:1,
    pitchpatrol:1, runway:1, photosnap:1, stampit:1 };
  function taskKind(t){ return t.kind || KIND[t.cat] || 'mcq'; }
  function taskLabel(t){ return KIND_LABEL[taskKind(t)] || CAT_LABEL[t.cat] || 'Task'; }

  var GHOSTS = [
    {n:'Team Fox',   f:'🦊'}, {n:'Team Wolf',  f:'🐺'}, {n:'Team Hawk',  f:'🦅'},
    {n:'Team Puma',  f:'🐆'}, {n:'Team Bear',  f:'🐻'}, {n:'Team Otter', f:'🦦'},
    {n:'Team Lynx',  f:'🐈'}, {n:'Team Raven', f:'🐦‍⬛'}, {n:'Team Bison', f:'🦬'},
    {n:'Team Cobra', f:'🐍'}
  ];

  var app = document.getElementById('app');
  var S = {};   // active session state

  /* ------------------------------------------------------------- utilities */
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function rnd(a,b){ return a + Math.random()*(b-a); }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function fmtTime(sec){ return (Math.round(sec*10)/10).toFixed(1); }
  function median(arr){ var s=arr.slice().sort(function(x,y){return x-y;}); var m=Math.floor(s.length/2);
    return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
  // difficulty ramp: 0 at Stage 1 → 1 at the Final. Skill games read this to
  // scale speed / grid size / pattern length, so late Stages FEEL like a final.
  function ramp(){ return Math.max(0, Math.min(1, (S.round-1)/(ROUNDS-1))); }
  // motion helpers: retrigger a CSS animation on an element that stays in the DOM.
  // Used for every in-game content swap so rounds GLIDE in instead of hard-cutting.
  function retrig(el, cls){ if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function swapIn(el){ retrig(el,'swap-in'); }
  function popIn(el){ retrig(el,'pop-in'); }
  function flash(el){ retrig(el,'hitflash'); }
  // fastTap: fire on pointerdown so reflex/timing taps register INSTANTLY (no
  // wait for the click event, which on touch can lag ~tens of ms behind the
  // finger). Still fires for a synthetic .click() (used by the test harness) via
  // the click listener, guarded so a real tap never double-fires. `stop`=true
  // stops propagation so a hit on a child target doesn't also trip a parent miss.
  function fastTap(el, fn, stop){
    if(!el) return;
    el.addEventListener('pointerdown', function(e){ el.__pd=1; if(stop&&e.stopPropagation) e.stopPropagation(); fn(e); });
    el.addEventListener('click', function(e){ if(stop&&e.stopPropagation) e.stopPropagation(); if(el.__pd){ el.__pd=0; return; } fn(e); });
  }
  // testing hook: /globe/?kind=swingmeter forces every offline stage to that game
  var FORCE_KIND=(function(){ try{ return new URLSearchParams(location.search).get('kind'); }catch(e){ return null; } })();

  /* ------------------------------------------------- sound + haptics (juice) */
  var _actx=null, _muted=false;
  try{ _muted = localStorage.getItem('rtg_muted')==='1'; }catch(e){}
  function toggleMute(){ _muted=!_muted; try{ localStorage.setItem('rtg_muted', _muted?'1':'0'); }catch(e){} if(!_muted) actx(); }
  function actx(){ if(_muted) return null; try{ if(!_actx){ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; _actx=new AC(); } if(_actx.state==='suspended') _actx.resume(); return _actx; }catch(e){ return null; } }
  function beep(freq,dur,type,vol,when){ var c=actx(); if(!c) return; var t=c.currentTime+(when||0);
    var o=c.createOscillator(), g=c.createGain(); o.type=type||'sine'; o.frequency.value=freq;
    o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.11,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.03); }
  function vibe(p){ try{ if(navigator.vibrate && !_muted) navigator.vibrate(p); }catch(e){} }
  function sfx(kind){
    if(_muted) return;
    if(kind==='correct'){ beep(660,0.09,'triangle',0.12); beep(990,0.10,'triangle',0.10,0.08); vibe(12); }

    { id:'champion', name:'Champion', icon:'🏆', metric:function(s){return s.wins;}, unit:'wins',
      tiers:[{n:1,l:'Bronze'},{n:5,l:'Silver'},{n:15,l:'Gold'},{n:40,l:'Platinum'}] },
    { id:'podium', name:'Podium Regular', icon:'🥉', metric:function(s){return s.top3;}, unit:'top-3s',
      tiers:[{n:3,l:'Bronze'},{n:10,l:'Silver'},{n:30,l:'Gold'}] },
    { id:'sharp', name:'Sharpshooter', icon:'🎯', metric:function(s){return s.perfectStages;}, unit:'flawless stages',
      tiers:[{n:10,l:'Bronze'},{n:50,l:'Silver'},{n:150,l:'Gold'}] },
    { id:'speed', name:'Speed Demon', icon:'⚡', metric:function(s){return s.fastestStage?Math.max(0, 6-s.fastestStage):0;}, unit:'',
      tiers:[{n:1,l:'Bronze'},{n:2.5,l:'Silver'},{n:3.5,l:'Gold'}] },   // fastest < 5s / 3.5s / 2.5s
    { id:'decathlete', name:'Decathlete', icon:'🎮', metric:function(s){return kindsCount();}, unit:'game types',
      tiers:[{n:6,l:'Bronze'},{n:12,l:'Silver'},{n:18,l:'Gold'}] },

      tiers:[{n:2,l:'Bronze'},{n:3,l:'Silver'},{n:5,l:'Gold'}] },

  function tierReached(b, s){ var v=b.metric(s), n=0; for(var i=0;i<b.tiers.length;i++){ if(v>=b.tiers[i].n) n=i+1; } return n; }
  function totalBadges(s){ s=s||statsDefault(); var t=0; BADGES.forEach(function(b){ t+=tierReached(b,s); }); return t; }
  function badgeTiers(s){ return BADGES.map(function(b){ return tierReached(b,s); }); }
  // compare pre-race tiers to current, toast any newly-earned tiers, stash for UI
  function announceNewBadges(beforeTiers){
    var s=statsDefault(), earned=[];
    BADGES.forEach(function(b,i){
      var now=tierReached(b,s), was=beforeTiers[i]||0;
      for(var tr=was+1; tr<=now; tr++){ earned.push({ icon:b.icon, name:b.name, tier:b.tiers[tr-1].l }); }
    });
    s.badgeSeen=totalBadges(s); saveStats(s);
    if(earned.length){
      var msg = earned.length===1
        ? ('🎉 New badge: '+earned[0].icon+' '+earned[0].name+' — '+earned[0].tier)
        : ('🎉 '+earned.length+' new badges unlocked! See the Trophy Room.');

  /* =============================================================== THE RACE */
  function startRace(){
    // build the field: player + (FIELD_SIZE-1) lobby-fill ghosts (GDD §8).
    // ghost pace spread: a few sharp ghosts, several beatable ones. Skewed a
    // touch slower than before so a competent player has a fair, winnable field.
    var skills = []; for(var i=0;i<GHOSTS.length;i++){ skills.push(0.92 + (i*(1.75-0.92)/(GHOSTS.length-1))); }
    skills = shuffle(skills);
    var teams = [{ id:'you', name:S.teamName, flag:'🧭', isGhost:false, startedAsGhost:false, skill:1, alive:true, eff:0 }];
    for(var g=0; g<GHOSTS.length; g++){
      teams.push({ id:'g'+g, name:GHOSTS[g].n, flag:GHOSTS[g].f, isGhost:true, startedAsGhost:true,
                   skill:skills[g], alive:true, eff:0 });
    }
    S.teams = teams;
    S.round = 1;
    S.usedCountries = {};
    S.skipUsed = false;
    S.spectating = false;
    S._runPend=null; S._runDone=false;   // City Run guards
    S._lastLL = null;   // no origin yet → first Flight Leg departs from HOME_LL (player's area, or US east coast)
    requestHome();      // ask for location so the opening leg departs from near the player
    S.finishLine = pick(FINISH);   // GDD §11: the Final's location, locked at race start
    S.screen='stage';
    drawStage();
  }

  function aliveTeams(){ return S.teams.filter(function(t){ return t.alive; }); }
  function isFinal(){ return S.round === ROUNDS; }
  // same-screen duo: whose turn this Stage (alternates by round). null when solo.
  function coopTurn(){ if(!(S.coop&&S.coop.same)) return null; return (S.round%2===1)?S.coop.p1:S.coop.p2; }

  function drawStage(){
    // GDD per-round loop step 1: destination draw (same country for everyone).
    if(isFinal()){
      var fl = S.finishLine;
      S.dest = { name:fl.city, region:fl.region, flag:fl.flag, final:true, landmark:fl.landmark,
                 country: fl.country ? countryById(fl.country) : null };
    } else {
      var pool = COUNTRIES.filter(function(c){ return !S.usedCountries[c.id]; });
      if(!pool.length){ S.usedCountries={}; pool=COUNTRIES.slice(); }
      var c = pick(pool);
      // TEMP (Street Scout testing): force stage 1 to a dense-coverage city so imagery loads
      if(FORCE_STREET_FIRST && streetEnabled() && S.round===1){ c = countryById('FR') || c; }
      S.usedCountries[c.id]=1;
      S.dest = { name:c.name, region:c.region, flag:c.flag, final:false, country:c };
      var st=statsDefault(); st.countries[c.id]=1; saveStats(st);
    }
    // build the challenge: Split Path (choose 1 of 2) or Solo Call (1 assigned). GDD §5-6.
    buildChallenge();
    // fly the leg to this destination first (skipped on the Final / no-coord dests),
    // then reveal the draw. The reveal is the payoff after the flight's suspense.
    var toLL = (S.dest.country && S.dest.country.ll) || null;
    flightTo(toLL, function(){ S.phase='draw'; renderStage(); });
  }

  function countryById(id){ for(var i=0;i<COUNTRIES.length;i++){ if(COUNTRIES[i].id===id) return COUNTRIES[i]; } return null; }

  function taskPool(){
    // authored tasks for the destination's country + tasks GENERATED from the
    // country/world data (flags, capitals, regions, stats, coords). The generated
    // set is what makes the mix varied without hand-authoring every type.
    var c = S.dest.country || pick(COUNTRIES);
    var out=[];
    Object.keys(c.tasks||{}).forEach(function(cat){
      if(!KIND[cat]) return;
      (c.tasks[cat]||[]).forEach(function(t){ out.push(t); });
    });
    out = out.concat(genTasks(c));
    return shuffle(out);
  }

  // ---- generated game types (self-contained, no per-country authoring) ----
  function otherCountries(c, n){ return shuffle(COUNTRIES.filter(function(x){ return x.id!==c.id; })).slice(0,n); }
  // regions can be compound (e.g. Turkey = "Europe/Asia"); two regions "share" if
  // any slash-part matches, so a transcontinental country is never a false outlier.
  function regionShares(a, b){
    var pa=String(a).split('/'), pb=String(b).split('/');
    for(var i=0;i<pa.length;i++){ if(pb.indexOf(pa[i])>=0) return true; }
    return false;
  }
  function genTasks(c){
    var g=[], i;
    // Guess The Flag — show a flag, pick the country. The subject is a RANDOM
    // country, NOT the one you're currently visiting (showing your own flag was a
    // giveaway, not a game).
    var fq = otherCountries(c,1)[0] || c;
    var wrong = otherCountries(fq,3);
    var opts = shuffle([fq.name].concat(wrong.map(function(x){return x.name;})));
    g.push({ kind:'flagid', cat:'trivia', type:'brain', q:'Which country flies this flag?', flag:fq.flag,
             options:opts, a:opts.indexOf(fq.name) });
    // Zoom Reveal — name the country as its flag zooms out (also a random subject)
    var zq = otherCountries(c,1)[0] || c;
    var zw = otherCountries(zq,3);
    var zopts = shuffle([zq.name].concat(zw.map(function(x){return x.name;})));
    g.push({ kind:'zoomreveal', cat:'trivia', type:'brain', q:'Guess the country as its flag zooms out', flag:zq.flag,
             options:zopts, a:zopts.indexOf(zq.name) });
    // Name The Capital — pick the capital from four
    var wc = otherCountries(c,3);
    var capOpts = shuffle([c.capital].concat(wc.map(function(x){return x.capital;})));
    g.push({ kind:'capital', cat:'trivia', type:'brain', q:'What is the capital of '+c.name+'?',
             options:capOpts, a:capOpts.indexOf(c.capital) });
    // Odd One Out — three from one region + one outlier. Use region OVERLAP so a
    // transcontinental country (e.g. Turkey = Europe/Asia) is never an ambiguous
    // outlier, and the region label shown is a clean single continent.
    var cReg = String(c.region).split('/')[0];
    var same = COUNTRIES.filter(function(x){ return x.id!==c.id && regionShares(x.region, c.region); });
    var diff = COUNTRIES.filter(function(x){ return !regionShares(x.region, c.region); });
    if(same.length>=2 && diff.length){
      var trio=[c].concat(shuffle(same).slice(0,2)); var outlier=pick(diff);
      var four=shuffle(trio.concat([outlier])).map(function(x){return {n:x.name,bad:x.id===outlier.id};});
      g.push({ kind:'oddoneout', cat:'math', type:'brain', q:'Three of these are in '+cReg+'. Tap the one that is NOT.',
               options:four.map(function(x){return x.n;}), a:four.map(function(x){return x.bad;}).indexOf(true) });
    }
    // True or False rapid-fire — capital statements drawn from the world
    // (count ramps 4→7 across the race so later Stages are longer/harder)
    var tf=[]; var picks=shuffle(COUNTRIES).slice(0, 4+Math.round(3*ramp()));
    picks.forEach(function(x){
      var lie=Math.random()<0.5, cap=x.capital;
      if(lie){ var o=pick(otherCountries(x,1)); cap=o.capital; }
      tf.push({ s:'The capital of '+x.name+' is '+cap+'.', t:!lie });
    });
    g.push({ kind:'truefalse', cat:'trivia', type:'brain', q:'True or false — tap fast!', items:tf });
    // Higher or Lower — compare two cities. ONLY from a DIRECTIONAL spatial task
    // (lat/long), where the question and scoring are unambiguous. Stat-ordered
    // tasks (population/size/etc.) are skipped so we never ask "farther north"
    // about a non-latitude value.
    var sp=(c.tasks.spatial&&c.tasks.spatial[0]);
    var HLQ={ north:'Which is farther NORTH?', south:'Which is farther SOUTH?',
              west:'Which is farther WEST?', east:'Which is farther EAST?' };
    if(sp && sp.items && sp.items.length>=2 && HLQ[sp.dir]){
      g.push({ kind:'higherlower', cat:'math', type:'brain', q:HLQ[sp.dir], dir:sp.dir,
               items:sp.items.slice(), rounds:Math.min(3, sp.items.length-1) });
    }
    // Memory Match — pairs from the country's memory tiles
    var tiles=(c.tasks.memory&&c.tasks.memory[0]&&c.tasks.memory[0].tiles)||['🌍','🧭','✈️','🗺️'];
    g.push({ kind:'memorymatch', cat:'memory', type:'brain', q:'Match all the pairs', tiles:tiles.slice(0,4) });
    // Whack-A-Landmark — tap the country's flag, dodge the decoys
    g.push({ kind:'whack', cat:'reflex', type:'reflex', q:'Tap '+c.flag+' as it pops up — ignore the rest!',
             target:c.flag, decoys:shuffle(otherCountries(c,4).map(function(x){return x.flag;})) });
    // Quick Tap — hit the moving target
    g.push({ kind:'targettap', cat:'reflex', type:'reflex', q:'Tap the target as fast as you can!', target:c.flag });
    // Find It On The Map — pin-drop, scored by distance (needs coords)
    if(c.ll && c.ll.length===2){
      g.push({ kind:'mapfind', cat:'spatial', type:'brain', q:'Where in the world is '+c.name+'? Tap the map.', ll:c.ll, name:c.name });
      // Street Scout — real street imagery; only offered when a Mapillary token is set
      if(streetEnabled()){
        g.push({ kind:'streetscout', cat:'spatial', type:'brain', q:'Street Scout: explore a real street near '+c.name, ll:c.ll, name:c.name });
      }
    }
    // ---- knowledge-free skill games: the country only SKINS these (its flags,
    // its city names) — the contest is timing, aim, memory and dexterity, so a
    // player who knows nothing about the destination competes evenly. ----
    // Swing Meter — land taps in a shrinking green zone (timing)
    g.push({ kind:'swingmeter', cat:'reflex', type:'reflex', q:'Land 3 taps in the green zone' });
    // Eagle Eye — one flag in the wall doesn't belong (visual hunt)
    g.push({ kind:'eagleeye', cat:'reflex', type:'reflex', q:'One of these is NOT '+c.name+'’s flag — spot it!',
             target:c.flag, imposters:shuffle(otherCountries(c,3).map(function(x){return x.flag;})) });
    // Memory Lineup — flags flash, find the one that WASN'T shown (observation)
    g.push({ kind:'kimsgame', cat:'memory', type:'brain', q:'Memorize the lineup — then spot the flag that wasn’t there' });
    // Type The Ticket — retype the destination shown on your boarding pass (dexterity)
    var tw=ticketWord(c);
    if(tw) g.push({ kind:'typeticket', cat:'word', type:'brain', q:'Type your destination, fast', word:tw });
    // Baggage Claim — grab YOUR bag off the belt, ignore lookalikes (visual match)
    g.push({ kind:'baggage', cat:'reflex', type:'reflex', q:'Grab YOUR bag off the belt — 3 grabs' });
    // Rhythm Echo — hear a rhythm, tap it back (timing memory; opens the audio category)
    g.push({ kind:'rhythmecho', cat:'audio', type:'brain', q:'Listen to the rhythm, then tap it back' });
    // ---- distance/direction games generated from coordinates (objective, no
    // authoring): each is only offered when a clearly-fair instance exists ----
    if(c.ll && c.ll.length===2){
      var byd = COUNTRIES.filter(function(x){ return x.id!==c.id && x.ll; })
        .map(function(x){ return { x:x, d:haversine(c.ll[0],c.ll[1],x.ll[0],x.ll[1]) }; })
        .sort(function(p,q2){ return p.d-q2.d; });
      if(byd.length>=12){
        // Closest Neighbor — one option is clearly nearest (others ≥1.7× farther)
        var near=byd[0], far=shuffle(byd.filter(function(p){ return p.d>near.d*1.7; })).slice(0,3);
        if(far.length===3){
          var copts=shuffle([near.x.name].concat(far.map(function(p){ return p.x.name; })));
          g.push({ kind:'closest', cat:'spatial', type:'brain', q:'Which of these is CLOSEST to '+c.name+'?',
                   options:copts, a:copts.indexOf(near.x.name) });
        }
        // Closer or Farther — 3 rounds; pairs differ by ≥1.5× so they're never a coin flip
        var pairs=[], tries=0;
        while(pairs.length<3 && tries<40){
          tries++;
          var two=shuffle(byd).slice(0,2);
          var hi=Math.max(two[0].d,two[1].d), lo=Math.min(two[0].d,two[1].d);
          if(lo>200 && hi/lo>=1.5) pairs.push({ a:{label:two[0].x.capital, d:two[0].d}, b:{label:two[1].x.capital, d:two[1].d} });
        }
        if(pairs.length>=2) g.push({ kind:'closerfar', cat:'spatial', type:'brain',
                                     q:'Which capital is CLOSER to '+(c.capital||c.name)+'?', pairs:pairs });
        // Compass Chase — only targets whose direction is DOMINANT (no ambiguity)
        var dirs=[], shuf=shuffle(byd), k2;
        for(k2=0;k2<shuf.length && dirs.length<3;k2++){
          var o2=shuf[k2].x;
          var dlat=o2.ll[0]-c.ll[0];
          var dlng=((o2.ll[1]-c.ll[1]+540)%360)-180;
          if(Math.abs(dlat)>=Math.abs(dlng)*2 && Math.abs(dlat)>8) dirs.push({ name:o2.name, flag:o2.flag, dir:dlat>0?'N':'S' });
          else if(Math.abs(dlng)>=Math.abs(dlat)*2 && Math.abs(dlng)>10) dirs.push({ name:o2.name, flag:o2.flag, dir:dlng>0?'E':'W' });
        }
        if(dirs.length>=2) g.push({ kind:'compass', cat:'spatial', type:'brain',
                                    q:'You\'re in '+c.name+' — which way to each country?', rounds:dirs });
        // Flight Plan — order 4 stops nearest → farthest (gaps ≥1.25× keep it fair)
        var idxs=[Math.floor(byd.length*0.05), Math.floor(byd.length*0.3), Math.floor(byd.length*0.6), byd.length-2];
        var stops=idxs.map(function(i2){ return byd[i2]; });
        var okgap=true, s2;
        for(s2=1;s2<stops.length;s2++){ if(stops[s2].d < stops[s2-1].d*1.25) okgap=false; }
        if(okgap) g.push({ kind:'flightplan', cat:'dragdrop', type:'brain', dir:'near',
                           q:'Flight plan from '+c.name+': tap the stops nearest → farthest',
                           items:shuffle(stops).map(function(p){ return { label:p.x.capital, value:Math.round(p.d) }; }) });
        // Globe Hunt — a hidden country; tap dots and follow the heat to find it
        // (the "warmer / colder" hunt). Spread ~15 decoy pins across the world so
        // the heat readings actually triangulate.
        var decoys=shuffle(byd.slice(3)).slice(0,15).map(function(p){ return p.x; });
        var pins=shuffle([c].concat(decoys)).map(function(x){ return { name:x.name, flag:x.flag, ll:x.ll }; });
        if(pins.length>=8) g.push({ kind:'globehunt', cat:'spatial', type:'brain',
                                    q:'A country is hidden. Tap dots and follow the heat to find it.',
                                    target:{ name:c.name, flag:c.flag, ll:c.ll }, pins:pins });
      }
    }
    // Region Sort — two buckets, six countries (opens the dragdrop category)
    var regs={}; COUNTRIES.forEach(function(x){ if(x.region!==c.region) regs[x.region]=(regs[x.region]||0)+1; });
    var regB=shuffle(Object.keys(regs).filter(function(r2){ return regs[r2]>=3; }))[0];
    var sameR=COUNTRIES.filter(function(x){ return x.region===c.region; });
    if(regB && sameR.length>=3){
      var qA=shuffle(sameR).slice(0,3), qB=shuffle(COUNTRIES.filter(function(x){ return x.region===regB; })).slice(0,3);
      g.push({ kind:'regionsort', cat:'dragdrop', type:'brain', q:'Sort each country into its region',
               regA:c.region, regB:regB,
               queue:shuffle(qA.concat(qB)).map(function(x){ return { name:x.name, flag:x.flag, region:x.region }; }) });
    }
    // The Dossier — Countryle-style deduction: crack a hidden country from a
    // ladder of clues (region → hemisphere → capital initial → capital). Decoys
    // are chosen so every clue actually rules one suspect out.
    if(c.ll && c.capital){
      var oth=COUNTRIES.filter(function(x){ return x.id!==c.id && x.ll && x.capital; });
      var cNorth=c.ll[0]>=0, cInit=c.capital.charAt(0).toUpperCase();
      var dR=shuffle(oth.filter(function(x){ return x.region!==c.region; }))[0];
      var dH=shuffle(oth.filter(function(x){ return (x.ll[0]>=0)!==cNorth && (!dR||x.id!==dR.id); }))[0];
      var dI=shuffle(oth.filter(function(x){ return x.capital.charAt(0).toUpperCase()!==cInit && (!dR||x.id!==dR.id) && (!dH||x.id!==dH.id); }))[0];
      if(dR && dH && dI){
        var suspects=shuffle([c,dR,dH,dI]).map(function(x){ return { name:x.name, flag:x.flag }; });
        g.push({ kind:'detective', cat:'trivia', type:'brain',
                 q:'Whose passport is this? Read the dossier and make your accusation.',
                 answer:c.name, suspects:suspects,
                 clues:[ 'Region on file: '+c.region,
                         'Last seen in the '+(cNorth?'Northern':'Southern')+' Hemisphere',
                         'Their capital begins with the letter “'+cInit+'”',
                         'Capital city: '+c.capital ] });
      }
    }
    // ---- pure-skill set 2 (timing/aim/ears — zero knowledge) ----
    g.push({ kind:'runway', cat:'reflex', type:'reflex', q:'Land on the runway — 3 clean landings' });
    g.push({ kind:'photosnap', cat:'reflex', type:'reflex', flag:c.flag, q:'Frame '+c.flag+' in the viewfinder — 3 clean shots' });
    g.push({ kind:'stampit', cat:'reflex', type:'reflex', q:'Stamp the passport — press when the stamp lines up over the box' });
    g.push({ kind:'pitchpatrol', cat:'audio', type:'reflex', q:'Tap on the HIGH note — hold on the LOW' });
    return g;
  }
  // boarding-pass word for Type The Ticket: capital (fallback: country name),
  // diacritics folded, punctuation dropped; skip anything too long to type fun.
  function ticketWord(c){
    function clean(s){ try{ s=(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }catch(e){ s=s||''; }
      return s.toUpperCase().replace(/[^A-Z ]/g,'').trim().replace(/ +/g,' '); }
    var w=clean(c.capital);
    if(w.replace(/ /g,'').length<3 || w.replace(/ /g,'').length>13) w=clean(c.name);
    var n=w.replace(/ /g,'').length;
    return (n>=3 && n<=13) ? w : null;
  }

  function buildChallenge(){
    // TEMP (Street Scout testing): force the very first stage of a race to be a
    // Street Scout so it's easy to reach. Flip FORCE_STREET_FIRST back to false
    // (near MAPILLARY_TOKEN) to restore fully random selection.
    if(FORCE_STREET_FIRST && streetEnabled() && !onlineActive() && S.round===1 && !isFinal()){
      var fc = S.dest.country || pick(COUNTRIES);
      S.stageType='solo';
      S.offered=[{ kind:'streetscout', cat:'spatial', type:'brain', q:'Street Scout: explore a real street near '+fc.name, ll:fc.ll, name:fc.name }];
      S.chosen=null; return;
    }
    var pool = taskPool();
    // testing hook (?kind=…): pin every offline stage to one game type
    if(FORCE_KIND && !onlineActive()){
      var fkl=pool.filter(function(t){ return taskKind(t)===FORCE_KIND; });
      if(fkl.length){ S.stageType='solo'; S.offered=[fkl[0]]; S.chosen=null; return; }
    }
    var recent = S.recentKinds || [];
    function fresh(list){ var f=list.filter(function(t){ return recent.indexOf(taskKind(t))<0; }); return f.length?f:list; }
    var brain  = pool.filter(function(t){ return !REFLEX_KINDS[taskKind(t)]; });
    var reflex = pool.filter(function(t){ return REFLEX_KINDS[taskKind(t)]; });
    // Split Path most stages (always on the Final): one brain + one reflex when
    // possible (GDD §5), and never two of the same game type.
    var wantSplit = isFinal() || onlineActive() || Math.random() < 0.6;   // duo (two-devices) is always Split Path — each partner takes a different one
    if(wantSplit && pool.length>=2){
      var a,b;
      if(brain.length && reflex.length){ a=pick(fresh(brain)); b=pick(fresh(reflex)); }
      else {
        var two=shuffle(fresh(pool)); a=two[0];
        b=two.filter(function(t){ return taskKind(t)!==taskKind(a); })[0] || two[1];
      }
      S.stageType='split'; S.offered=[a,b];
    } else {
      S.stageType='solo'; S.offered=[pick(fresh(pool))];
    }
    S.chosen=null;
  }
  function noteKind(k){ S.recentKinds=(S.recentKinds||[]); S.recentKinds.push(k); if(S.recentKinds.length>3) S.recentKinds.shift(); }

  function renderStage(){
    if(S.phase==='flight')     return viewFlight();
    if(S.phase==='draw')       return viewDraw();
    if(S.phase==='choice')     return onlineActive()?duoViewChoice():viewChoice();
    if(S.phase==='play')       return viewPlay();
    if(S.phase==='run')        return viewRun();
    if(S.phase==='checkpoint') return viewCheckpoint();
    if(S.phase==='leaderboard')return onlineActive()?duoViewLeaderboard():viewLeaderboard();
    if(S.phase==='grounded')   return onlineActive()?duoSpectate():viewGrounded();
  }

  function hud(){
    var pips='';
    for(var r=1;r<=ROUNDS;r++){
      var cls = r<S.round?'done':(r===S.round?'now':'');
      if(r===ROUNDS && cls!=='now') cls+=' final';
      pips += '<span class="pip '+cls+'"></span>';
    }
    var alive = aliveTeams().length;
    return '<div class="hud"><div class="pips">'+pips+'</div>'
      + '<div class="remain">Stage <b>'+S.round+'</b>/'+ROUNDS+' · <b>'+alive+'</b> left</div></div>';
  }

  /* --- phase: Flight Leg (watch the plane travel to the next country) ----------
     Between Stages a plane traces a dashed airline-style arc across the world map
     from the last country to the next — echoing the app icon's coral route line.
     Fast (~1.3s), tap-to-skip, and skipped entirely under reduced-motion. The
     destination name stays hidden until the draw, so the flight builds suspense
     and the draw is the payoff (the golf "ball lands last" beat). */
  function reduceMotion(){ try{ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){ return false; } }
  // where the very first Flight Leg departs from. Defaults to the US east coast
  // (New Jersey / New York coastline — clearly on land, not mid-ocean) and is
  // upgraded to the player's real location if they allow it.
  var HOME_LL=[39.8,-74.1];
  var _homeAsked=false;
  function requestHome(){
    if(_homeAsked) return; _homeAsked=true;
    try{
      if(navigator.geolocation) navigator.geolocation.getCurrentPosition(
        function(pos){ if(pos&&pos.coords&&isFinite(pos.coords.latitude)&&isFinite(pos.coords.longitude)) HOME_LL=[pos.coords.latitude, pos.coords.longitude]; },
        function(){},
        { timeout:7000, maximumAge:1800000, enableHighAccuracy:false });
    }catch(e){}
  }
  function flightTo(toLL, then){
    if(reduceMotion() || !toLL || toLL.length!==2){ if(then) then(); return; }
    S.flight={ from:(S._lastLL||HOME_LL), to:toLL, then:then, done:false };
    S._lastLL=toLL; S.phase='flight'; renderStage();
  }
  function llToXY(ll){ return [ll[1]+180, 90-ll[0]]; }
  function viewFlight(){
    var f=S.flight; if(!f){ S.phase='draw'; return renderStage(); }
    var P0=llToXY(f.from), P1=llToXY(f.to);
    var mx=(P0[0]+P1[0])/2, my=(P0[1]+P1[1])/2;
    var dx=P1[0]-P0[0], dy=P1[1]-P0[1], len=Math.sqrt(dx*dx+dy*dy)||1;
    var nx=-dy/len, ny=dx/len; if(ny>0){ nx=-nx; ny=-ny; }           // lift the arc toward the top
    var lift=Math.min(70, 20+len*0.35);
    var C=[mx+nx*lift, my+ny*lift];
    function bez(t){ var u=1-t; return [u*u*P0[0]+2*u*t*C[0]+t*t*P1[0], u*u*P0[1]+2*u*t*C[1]+t*t*P1[1]]; }
    app.innerHTML = topbar() + hud()
      + '<div class="card" id="flycard" style="cursor:pointer">'
        + '<div class="stagetype">✈️ In transit — Stage '+S.round+'</div>'
        + '<svg id="flysvg" viewBox="0 0 360 180" preserveAspectRatio="none" style="width:100%;height:auto;aspect-ratio:2/1;'
          + 'background:radial-gradient(120% 120% at 50% 35%,rgba(26,74,134,.55),rgba(10,8,26,.95));border:1px solid var(--cardb);border-radius:12px">'
          + worldSVGInner()
          + '<path id="flyarc" d="M '+P0[0]+' '+P0[1]+' Q '+C[0]+' '+C[1]+' '+P1[0]+' '+P1[1]+'" fill="none" stroke="#EE5A44" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round" pathLength="1" style="stroke-dashoffset:1;stroke-dasharray:1 1"/>'
          + '<circle cx="'+P0[0]+'" cy="'+P0[1]+'" r="2.6" fill="#F6D488" stroke="#EE5A44" stroke-width="0.8"/>'
          + '<circle id="flydest" cx="'+P1[0]+'" cy="'+P1[1]+'" r="0" fill="none" stroke="#EE5A44" stroke-width="1.4"/>'
          + '<text id="flyplane" x="'+P0[0]+'" y="'+P0[1]+'" font-size="15" text-anchor="middle" dominant-baseline="central">✈️</text>'
        + '</svg>'
        + '<div class="ohint" id="flyhint" style="margin-top:10px">Drawing your next destination… <span style="opacity:.6">· tap to skip</span></div>'
      + '</div>' + foot();
    var arc=$('flyarc'), plane=$('flyplane'), dest=$('flydest');
    var DUR=1250, t0=performance.now();
    function finish(){ if(f.done) return; f.done=true; if(S.flight) S.flight=null; if(f.then) f.then(); }
    var card=$('flycard'); if(card) card.onclick=finish;
    (function loop(){
      if(f.done || !$('flyplane') || S.phase!=='flight'){ return; }
      var t=Math.min(1,(performance.now()-t0)/DUR);
      var e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;   // easeInOut
      var p=bez(e), p2=bez(Math.min(1,e+0.01));
      var ang=Math.atan2(p2[1]-p[1], p2[0]-p[0])*180/Math.PI + 45;   // ✈️ points NE at rest
      if(plane){ plane.setAttribute('x',p[0]); plane.setAttribute('y',p[1]); plane.setAttribute('transform','rotate('+ang+' '+p[0]+' '+p[1]+')'); }
      if(arc){ arc.style.strokeDasharray='1 1'; arc.style.strokeDashoffset=String(1-e); }   // trail draws behind the plane
      if(dest && e>0.82){ dest.setAttribute('r', String((e-0.82)/0.18*5)); }                // destination ring blooms on arrival
      if(t>=1){ if(dest) dest.setAttribute('r','5'); setTimeout(finish,260); return; }
      requestAnimationFrame(loop);
    })();
    renderAcct();
  }

  /* --- phase: destination draw --- */
  function viewDraw(){
    var d=S.dest;
    app.innerHTML = topbar() + hud()
      + '<div class="card">'
        + '<div class="dest">'
          + '<div class="fl">'+d.flag+'</div>'
          + '<div class="cn">'+esc(d.name)+'</div>'
          + '<div class="rg">'+esc(d.region)+'</div>'
          + (d.final?'<div><span class="final-badge">🏁 The Final · '+esc(d.landmark||'the finish line')+'</span></div>':'')
        + '</div>'
        + '<p class="lede" style="text-align:center">'
          + (d.final ? 'The last '+aliveTeams().length+' teams race to the finish. Fastest effective time wins the whole race.'
                     : 'All '+aliveTeams().length+' remaining teams draw the same destination.')
        + '</p>'
        + (coopTurn() ? '<div class="coopturn">👤 <b>'+esc(coopTurn())+'</b>, you\'re up this Stage — hand over the device</div>' : '')
        + '<button class="btn globe" id="rev" style="margin-top:6px">Reveal the challenge ›</button>'
      + '</div>' + foot();
    $('rev').onclick=function(){ S.phase='choice'; renderStage(); };

  }

  /* --- phase: challenge choice (Split Path / Solo Call) --- */
  function viewChoice(){
    var html = topbar() + hud() + '<div class="card">'
      + '<div class="stagetype">'+(S.stageType==='split'?'🍴 Split Path — choose your task':'📢 Solo Call — one task, no choice')+'</div>'
      + '<div class="choice">';
    S.offered.forEach(function(t,i){
      var refl = !!REFLEX_KINDS[taskKind(t)];
      html += '<button class="taskcard" data-i="'+i+'">'
        + '<div class="ct"><span class="catchip '+(refl?'reflex':'')+'">'+esc(taskLabel(t))+'</span>'
        + '<span class="pen">miss +'+PENALTY[t.cat]+'s</span></div>'
        + '<div class="pr">'+esc(taskBlurb(t))+'</div></button>';
    });
    html += '</div>';
    // Skip Pass (GDD §2 — Fast Forward analog): once per race, take the field median
    // time. Offline only — online timing is server-authoritative.
    if(!S.skipUsed && !isFinal() && !onlineActive()){
      html += '<div class="skiprow"><div class="sx"><b>⏩ Skip Pass</b> — skip this task once per race and check in at the field\'s median time. Safe, but you won\'t gain ground.</div>'
        + '<button class="btn ghost sm" id="skip" style="flex:0 0 auto">Use</button></div>';
    }
