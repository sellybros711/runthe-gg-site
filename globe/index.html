    Array.prototype.forEach.call(document.querySelectorAll('.taskcard'), function(b){
      b.onclick=function(){
        S.chosen=S.offered[+b.getAttribute('data-i')];
        S.phase='play'; renderStage();
      };
    });
    if($('skip')) $('skip').onclick=useSkipPass;
    renderAcct();
  }
  function taskBlurb(t){
    switch(taskKind(t)){
      case 'mcq':      return t.q;
      case 'scramble': return 'Unscramble the word — '+t.hint;
      case 'sequence': return t.prompt+' — repeat it back';
      case 'reaction': return 'Signal Sprint — tap on GO, hold on STOP';
      case 'order':    return t.q;
      default:         return t.q || t.prompt || 'Complete the task';
    }
  }

  /* --- phase: play (the minigame) --- */
  function viewPlay(){
    var t=S.chosen, kind=taskKind(t);
    noteKind(kind);   // remember for cross-stage variety
    var _sk=statsDefault(); _sk.kinds[kind]=1; saveStats(_sk);   // track game types played (badges)
    S.play = { start: performance.now(), misses:0, done:false };
    app.innerHTML = topbar() + hud()
      + '<div class="card">'
        + '<div class="game-hd"><span class="cat">'+esc(taskLabel(t))+(coopTurn()?' · 👤 '+esc(coopTurn()):'')+'</span>'
        + '<span class="timer" id="tmr">0.0</span></div>'
        + '<div id="mg"></div>'
        + '<div class="missline" id="miss"></div>'
      + '</div>' + foot();
    startTimer();
    if(kind==='mcq'||kind==='flagid'||kind==='capital'||kind==='oddoneout'||kind==='closest') mgMcq(t);
    else if(kind==='scramble') mgScramble(t);
    else if(kind==='sequence') mgSequence(t);
    else if(kind==='reaction') mgReaction(t);
    else if(kind==='order'||kind==='flightplan') mgOrder(t);
    else if(kind==='truefalse') mgTrueFalse(t);
    else if(kind==='higherlower') mgHigherLower(t);
    else if(kind==='memorymatch') mgMemoryMatch(t);
    else if(kind==='whack') mgWhack(t);
    else if(kind==='targettap') mgTargetTap(t);
    else if(kind==='mapfind') mgMapFind(t);
    else if(kind==='globehunt') mgGlobeHunt(t);
    else if(kind==='detective') mgDetective(t);
    else if(kind==='streetscout') mgStreetScout(t);
    else if(kind==='zoomreveal') mgZoomReveal(t);
    else if(kind==='swingmeter') mgSwingMeter(t);
    else if(kind==='eagleeye') mgEagleEye(t);
    else if(kind==='kimsgame') mgKimsGame(t);
    else if(kind==='typeticket') mgTypeTicket(t);
    else if(kind==='baggage') mgBaggage(t);
    else if(kind==='rhythmecho') mgRhythmEcho(t);
    else if(kind==='closerfar') mgCloserFar(t);
    else if(kind==='compass') mgCompass(t);
    else if(kind==='regionsort') mgRegionSort(t);
    else if(kind==='pitchpatrol') mgPitchPatrol(t);
    else if(kind==='runway') mgRunway(t);
    else if(kind==='photosnap') mgPhotoSnap(t);
    else if(kind==='stampit') mgStampIt(t);
    else finishTask();   // safety
    renderAcct();
  }
  function startTimer(){
    stopTimer();
    S.timerId = setInterval(function(){
      var e=$('tmr'); if(!e){ stopTimer(); return; }
      e.textContent = fmtTime((performance.now()-S.play.start)/1000);
    }, 100);
  }
  function stopTimer(){ if(S.timerId){ clearInterval(S.timerId); S.timerId=null; } }
  function showMiss(){
    if(S.play && S.play.misses) sfx('wrong');   // central miss cue for every game
    var e=$('miss'); if(!e) return;
    e.innerHTML = S.play.misses ? 'Misses: <b>'+S.play.misses+'</b> (+'+(S.play.misses*PENALTY[S.chosen.cat])+'s)' : '';
    if(S.play.misses) swapIn(e);   // pulse so the penalty registers without looking down
  }
  function finishTask(){
    stopTimer();
    var raw = (performance.now()-S.play.start)/1000;
    resolveRound(raw, S.play.misses, false);
  }

  /* ---------- minigame: multiple choice (trivia / math) ---------- */
  function mgMcq(t){
    var order = shuffle(t.options.map(function(o,i){ return {o:o,i:i}; }));
    var flag = t.flag ? '<div style="text-align:center;font-size:88px;line-height:1;margin:2px 0 12px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))">'+t.flag+'</div>' : '';
    var html=flag+'<div class="prompt">'+esc(t.q)+'</div><div class="opts">';
    order.forEach(function(x,j){ html += '<button class="opt" data-i="'+x.i+'" data-j="'+j+'">'+esc(x.o)+'</button>'; });
    html+='</div>'; $('mg').innerHTML=html;
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){
      b.onclick=function(){
        if(S.play.done) return;
        var correct = (+b.getAttribute('data-i'))===t.a;
        if(correct){ b.classList.add('right'); sfx('correct'); S.play.done=true; setTimeout(finishTask,220); }
        else{ b.classList.add('wrong'); b.disabled=true; S.play.misses++; showMiss(); }
      };
    });
  }

  /* ---------- minigame: Zoom Reveal (name the flag as it zooms out) ---------- */
  function mgZoomReveal(t){
    var order = shuffle(t.options.map(function(o,i){ return {o:o,i:i}; }));
    var opts=''; order.forEach(function(x){ opts+='<button class="opt" data-i="'+x.i+'">'+esc(x.o)+'</button>'; });
    $('mg').innerHTML='<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div class="zoombox"><div class="zoomflag" id="zf">'+t.flag+'</div></div>'
      + '<div class="opts" style="margin-top:14px">'+opts+'</div>';
    var zf=$('zf'); if(zf){ requestAnimationFrame(function(){ if($('zf')) $('zf').style.transform='scale(1)'; }); }
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){
      b.onclick=function(){
        if(S.play.done) return;
        if((+b.getAttribute('data-i'))===t.a){ b.classList.add('right'); sfx('correct'); S.play.done=true; setTimeout(finishTask,220); }
        else{ b.classList.add('wrong'); b.disabled=true; S.play.misses++; showMiss(); }
      };
    });
  }

  /* ---------- minigame: unscramble (word) ---------- */
  function mgScramble(t){
    var answer=t.answer.toUpperCase();
    var letters=shuffle(answer.split(''));
    // guarantee it isn't already solved
    if(letters.join('')===answer && answer.length>1){ var x=letters[0];letters[0]=letters[1];letters[1]=x; }
    S.scr={ built:[], letters:letters, used:[] };
    renderScramble(t);
  }
  function renderScramble(t){
    var answer=t.answer.toUpperCase();
    var slots='';
    for(var i=0;i<answer.length;i++){ var ch=S.scr.built[i]; slots+='<div class="tileslot'+(ch?' filled':'')+'">'+(ch?esc(ch):'')+'</div>'; }
    var bank='';
    S.scr.letters.forEach(function(l,i){ bank+='<div class="ltile'+(S.scr.used[i]?' used':'')+'" data-i="'+i+'">'+esc(l)+'</div>'; });
    $('mg').innerHTML = '<div class="prompt">Unscramble · <span style="color:var(--mut);font-weight:600">'+esc(t.hint)+'</span></div>'
      + '<div class="slot">'+slots+'</div><div class="bank">'+bank+'</div>'
      + '<button class="btn ghost sm" id="undo" style="width:auto;margin:0 auto;display:block">⌫ Undo</button>';
    Array.prototype.forEach.call(document.querySelectorAll('.ltile'), function(b){
      b.onclick=function(){
        if(S.play.done) return;
        var i=+b.getAttribute('data-i'); if(S.scr.used[i]) return;
        S.scr.used[i]=1; S.scr.built.push({i:i,ch:S.scr.letters[i]});
        checkScramble(t);
      };
    });
    $('undo').onclick=function(){
      if(S.play.done||!S.scr.built.length) return;
      var last=S.scr.built.pop(); S.scr.used[last.i]=0; renderScramble(t);
    };
    // normalize built to chars for slot rendering
  }
  function builtStr(){ return S.scr.built.map(function(x){return x.ch;}).join(''); }
  function checkScramble(t){
    var answer=t.answer.toUpperCase();
    // re-render with the new letter placed
    var slots='';
    for(var i=0;i<answer.length;i++){ var e=S.scr.built[i]; slots+='<div class="tileslot'+(e?' filled':'')+'">'+(e?esc(e.ch):'')+'</div>'; }
    var slotEl=document.querySelector('.slot'); if(slotEl) slotEl.innerHTML=slots;
    var bankEls=document.querySelectorAll('.ltile');
    S.scr.built.forEach(function(x){ if(bankEls[x.i]) bankEls[x.i].classList.add('used'); });
    if(S.scr.built.length===answer.length){
      if(builtStr()===answer){ S.play.done=true; setTimeout(finishTask,200); }
      else{ S.play.misses++; showMiss();
        // clear the wrong attempt (board glides back in rather than hard-cutting)
        S.scr.built=[]; S.scr.used=[]; setTimeout(function(){ if(!S.play.done){ renderScramble(t); swapIn(document.querySelector('.slot')); } },350); }
    }
  }

  /* ---------- minigame: memory sequence (repeat it back) ----------
     The grid is built ONCE and tile elements stay put; taps only toggle classes
     and update the counter. (Rebuilding the grid on every tap dropped taps that
     landed mid-render — the "button won't click" bug.) */
  function mgSequence(t){
    var pal=t.tiles.slice();
    var len = Math.min(pal.length, 3 + Math.floor(S.round/3));   // grows slightly with stage
    var seq=[]; for(var i=0;i<len;i++){ seq.push(Math.floor(Math.random()*pal.length)); }
    S.seq={ pal:pal, seq:seq, input:[], playing:true };
    stopTimer();   // timer counts the INPUT phase only
    var tiles='';
    pal.forEach(function(em,i){ tiles+='<div class="seqtile" data-i="'+i+'">'+em+'</div>'; });
    $('mg').innerHTML='<div class="prompt">'+esc(t.prompt)+'</div>'
      + '<div class="seqstatus" id="seqst">👀 Watch the sequence…</div><div class="seqgrid">'+tiles+'</div>';
    // bind once; taps no-op while playing
    Array.prototype.forEach.call(document.querySelectorAll('.seqtile'), function(b){
      b.onclick=function(){ seqTap(t, +b.getAttribute('data-i'), b); };
    });
    playSequence(t,0);
  }
  function seqStatus(){ var e=$('seqst'); if(e) e.innerHTML = S.seq.playing ? '👀 Watch the sequence…' : 'Repeat it: <b>'+S.seq.input.length+'</b>/'+S.seq.seq.length; }
  function seqTile(i){ return document.querySelector('.seqtile[data-i="'+i+'"]'); }
  function playSequence(t,k){
    if(!$('mg')) return;
    if(k>=S.seq.seq.length){
      S.seq.playing=false; seqStatus();
      S.play.start=performance.now(); startTimer();   // start timing the input phase
      return;
    }
    var el=seqTile(S.seq.seq[k]); if(el) el.classList.add('lit');
    setTimeout(function(){ if(el) el.classList.remove('lit');
      setTimeout(function(){ playSequence(t,k+1); }, 220);
    }, 600);
  }
  function seqTap(t,i,el){
    if(S.play.done||S.seq.playing) return;
    var want=S.seq.seq[S.seq.input.length];
    if(i===want){
      S.seq.input.push(i);
      el.classList.add('tap'); setTimeout(function(){ if(el) el.classList.remove('tap'); },180);
      seqStatus();
      if(S.seq.input.length===S.seq.seq.length){ S.play.done=true; setTimeout(finishTask,220); }
    } else {
      S.play.misses++; showMiss(); S.seq.input=[];   // reset input on a wrong tile
      el.style.background='rgba(255,107,107,.35)'; setTimeout(function(){ if(el) el.style.background=''; },320);
      seqStatus();
    }
  }

  /* ---------- minigame: reaction window (reflex) ---------- */
  /* Signal Sprint — a Go/No-Go reflex test (deeper than plain "tap green" and on
     theme): tap on the TEAL "GO" signal, but HOLD on the CORAL "STOP". Measures
     reaction time on GO; misses for false starts, tapping STOP, or being too slow. */
  function mgReaction(t){
    // completion requires a fixed number of GO reps; STOP signals are traps that
    // do NOT advance completion — so the score always reflects real reaction time
    // (no "all-STOP draw = ~1s" exploit).
    S.rx={ go:0, need:5, sum:0, state:'idle', armAt:0, msg:'', sub:'', to:null };
    stopTimer();   // reaction measures its own summed reaction time, not wall clock
    $('mg').innerHTML='<div class="prompt" style="text-align:center">Signal Sprint — tap on GO, hold on STOP</div>'
      + '<div class="reps" id="rxreps"></div>'
      + '<div class="reactbox idle" id="rbox"><div class="big" id="rxbig"></div><div class="sm" id="rxsm"></div></div>';
    fastTap($('rbox'), function(){ reactTap(t); });
    renderReaction(t);
  }
  // paint the persistent box in place — state flips are class/text swaps, not re-renders
  function renderReaction(t){
    var e=$('rxreps');
    if(e){ var reps=''; for(var i=0;i<S.rx.need;i++){ reps+='<div class="rep'+(i<S.rx.go?' done':'')+'"></div>'; } e.innerHTML=reps; }
    var st=S.rx.state, cls, big, sm;
    if(st==='idle'){ cls='idle'; big='Ready?'; sm='Tap to start — then tap on 🟢 GO, but never on 🛑 STOP.'; }
    else if(st==='wait'){ cls='wait'; big='Wait…'; sm='Watch for the signal.'; }
    else if(st==='go'){ cls='go'; big='GO — TAP!'; sm='Now!'; }
    else if(st==='stop'){ cls='stop'; big='🛑 STOP'; sm="Don't tap!"; }
    else { cls='fb'; big=S.rx.msg; sm=S.rx.sub; }
    var box=$('rbox'); if(box) box.className='reactbox '+cls;
    var b=$('rxbig'); if(b) b.textContent=big;
    var s=$('rxsm'); if(s) s.textContent=sm;
  }
  function rxClear(){ if(S.rx.to){ clearTimeout(S.rx.to); S.rx.to=null; } }
  function reactBegin(t){
    S.rx.state='wait'; renderReaction(t); rxClear();
    S.rx.to=setTimeout(function(){ reactSignal(t); }, rnd(800,2000));
  }
  function reactSignal(t){
    if(S.play.done) return;
    var isGo = Math.random() > 0.4;   // ~60% GO
    S.rx.state = isGo?'go':'stop'; S.rx.armAt=performance.now(); renderReaction(t); rxClear();
    if(isGo) S.rx.to=setTimeout(function(){ if(S.rx.state==='go'&&!S.play.done) reactResolve(t,'slow'); }, 1300);
    else     S.rx.to=setTimeout(function(){ if(S.rx.state==='stop'&&!S.play.done) reactResolve(t,'held'); }, 950);
  }
  function reactTap(t){
    if(S.play.done) return;
    var s=S.rx.state;
    if(s==='idle'){ reactBegin(t); return; }
    if(s==='fb') return;                                   // feedback auto-advances
    if(s==='wait'){ rxClear(); reactResolve(t,'early'); return; }
    if(s==='go'){ rxClear(); reactResolve(t,'go', performance.now()-S.rx.armAt); return; }
    if(s==='stop'){ rxClear(); reactResolve(t,'stopTap'); return; }
  }
  // outcomes: go (tapped GO) / slow (missed GO) count a GO rep; held/stopTap/early do not
  function reactResolve(t, kind, rt){
    rxClear();
    if(kind==='go'){ S.rx.sum+=rt; S.rx.go++; sfx('correct'); S.rx.msg=Math.round(rt)+' ms ⚡'; S.rx.sub='Nice.'; }
    else if(kind==='slow'){ S.rx.sum+=1300; S.rx.go++; S.play.misses++; showMiss(); S.rx.msg='Too slow!'; S.rx.sub='+1 miss'; }
    else if(kind==='held'){ S.rx.msg='Held ✓'; S.rx.sub='Good hold.'; }
    else if(kind==='stopTap'){ S.play.misses++; showMiss(); S.rx.msg='That was STOP!'; S.rx.sub='+1 miss'; }
    else /* early */{ S.play.misses++; showMiss(); S.rx.msg='Too soon!'; S.rx.sub='+1 miss — wait for it'; }
    S.rx.state='fb'; renderReaction(t);
    if(S.rx.go>=S.rx.need){
      S.play.done=true;
      var raw = 0.8 + S.rx.sum/1000;   // small overhead + summed reaction time (incl. slow penalties)
      S.rx.to=setTimeout(function(){ resolveRound(raw, S.play.misses, false); }, 650);
    } else {
      S.rx.to=setTimeout(function(){ if(!S.play.done) reactBegin(t); }, 750);
    }
  }

  /* ---------- minigame: order-by-stat (spatial / logic) ---------- */
  function mgOrder(t){
    var target = sortedLabels(t);
    var val={}; t.items.forEach(function(it){ val[it.label]=it.value; });
    S.ord={ target:target, placed:[], val:val };
    renderOrder(t);
  }
  function sortedLabels(t){
    var dir=t.dir, items=t.items.slice();
    var asc = (dir==='asc'||dir==='south'||dir==='west'||dir==='near');   // ascending value = first
    items.sort(function(a,b){ return asc ? a.value-b.value : b.value-a.value; });
    return items.map(function(x){ return x.label; });
  }
  function dirHint(t){
    var map={ north:'northernmost → southernmost', south:'southernmost → northernmost',
      west:'westernmost → easternmost', east:'easternmost → westernmost',
      asc:'smallest → largest', desc:'largest → smallest', near:'nearest → farthest' };
    return map[t.dir] || 'in order';
  }
  function renderOrder(t){
    var rows='';
    shuffleStable(t.items).forEach(function(it){
      var pos=S.ord.placed.indexOf(it.label);
      rows += '<div class="oitem'+(pos>=0?' placed':'')+'" data-l="'+esc(it.label)+'">'
        + '<span class="num'+(pos>=0?' on':'')+'">'+(pos>=0?(pos+1):'')+'</span>'
        + '<span>'+esc(it.label)+'</span></div>';
    });
    $('mg').innerHTML='<div class="prompt">'+esc(t.q)+'</div>'
      + '<div class="ohint">Tap in order: <b style="color:var(--globe)">'+dirHint(t)+'</b></div>'
      + '<div class="orderwrap">'+rows+'</div>';
    Array.prototype.forEach.call(document.querySelectorAll('.oitem'), function(b){
      b.onclick=function(){ orderTap(t, b.getAttribute('data-l')); };
    });
  }
  function shuffleStable(items){ if(!S.ord._shuf){ S.ord._shuf=shuffle(items); } return S.ord._shuf; }
  function orderTap(t,label){
    if(S.play.done || S.ord.placed.indexOf(label)>=0) return;
    var nextCorrect = S.ord.target[S.ord.placed.length];
    var el=document.querySelector('.oitem[data-l="'+label.replace(/"/g,'')+'"]');
    // accept exact match OR a tie (equal stat value) so tied cities aren't unfair
    if(label===nextCorrect || S.ord.val[label]===S.ord.val[nextCorrect]){
      S.ord.placed.push(label);
      // update the tapped row IN PLACE (no full re-render → no dropped taps)
      if(el){ el.classList.add('placed'); var num=el.querySelector('.num'); if(num){ num.textContent=S.ord.placed.length; num.classList.add('on'); } }
      if(S.ord.placed.length===S.ord.target.length){ S.play.done=true; setTimeout(finishTask,220); }
    } else {
      S.play.misses++; showMiss();
      if(el){ el.style.borderColor='var(--bad)'; setTimeout(function(){ if(el) el.style.borderColor=''; },300); }
    }
  }

  function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }

  /* ---------- minigame: True or False rapid-fire (trivia) ----------
     Shell built ONCE; each statement glides in (swapIn) instead of the whole
     game re-rendering per answer — buttons stay put under your thumbs. */
  function mgTrueFalse(t){
    S.tf={ i:0, items:t.items };
    $('mg').innerHTML='<div class="seqstatus" id="tfst"></div>'
      + '<div class="prompt" id="tfq" style="text-align:center;min-height:56px;display:flex;align-items:center;justify-content:center"></div>'
      + '<div class="btnrow"><button class="btn ghost" id="tft" style="flex:1">✓ True</button>'
      + '<button class="btn ghost" id="tff" style="flex:1">✗ False</button></div>';
    $('tft').onclick=function(){ tfAns(t,true,this); }; $('tff').onclick=function(){ tfAns(t,false,this); };
    tfPaint();
  }
  function tfPaint(){
    var st=$('tfst'); if(st) st.innerHTML='Statement <b>'+(S.tf.i+1)+'</b>/'+S.tf.items.length;
    var q=$('tfq'); if(q){ q.textContent=S.tf.items[S.tf.i].s; swapIn(q); }
  }
  function tfAns(t,ans,btn){
    if(S.play.done || S.tf.lock) return;
    var ok = (ans===S.tf.items[S.tf.i].t);
    if(ok) sfx('tap'); else { S.play.misses++; showMiss(); }
    if(btn) btn.style.borderColor = ok?'var(--ok)':'var(--bad)';
    S.tf.lock=true;   // feedback beat — same pacing as the MCQ games' 220ms
    setTimeout(function(){
      S.tf.lock=false; if(btn) btn.style.borderColor='';
      S.tf.i++;
      if(S.tf.i>=S.tf.items.length){ S.play.done=true; finishTask(); } else tfPaint();
    },240);
  }

  /* ---------- minigame: Higher or Lower (compare a stat) ----------
     Shell built ONCE; only the two option labels swap in per round. */
  function mgHigherLower(t){
    S.hl={ round:0, rounds:t.rounds||3, items:t.items };
    $('mg').innerHTML='<div class="seqstatus" id="hlst"></div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div class="btnrow"><button class="btn ghost hlo" data-i="0" style="flex:1"></button>'
      + '<button class="btn ghost hlo" data-i="1" style="flex:1"></button></div>';
    each('.hlo', function(b){ b.onclick=function(){ hlAns(t, +b.getAttribute('data-i'), b); }; });
    hlPaint();
  }
  function hlPaint(){
    // pick two cities with a clear gap (≥4°) so the answer is knowable, not a
    // 1° coin-flip that still costs a penalty on a wrong tap
    var best=null, bestGap=-1;
    for(var tries=0;tries<24;tries++){
      var pr=shuffle(S.hl.items).slice(0,2);
      var gap=Math.abs(pr[0].value-pr[1].value);
      if(gap>bestGap){ bestGap=gap; best=pr; }
      if(gap>=4) break;
    }
    S.hl.pair=best;
    var st=$('hlst'); if(st) st.innerHTML='Round <b>'+(S.hl.round+1)+'</b>/'+S.hl.rounds;
    each('.hlo', function(b){ var i=+b.getAttribute('data-i'); b.textContent=S.hl.pair[i].label; swapIn(b); });
  }
  function hlAns(t,i,btn){
    if(S.play.done || S.hl.lock) return;
    // north/east => higher value wins; south/west => lower value wins. Ties ok.
    var lowerWins = (t.dir==='south' || t.dir==='west');
    var p=S.hl.pair, mine=p[i].value, other=p[1-i].value;
    var ok = (mine===other) || (lowerWins ? mine<=other : mine>=other);
    if(ok) sfx('tap'); else { S.play.misses++; showMiss(); }
    if(btn) btn.style.borderColor = ok?'var(--ok)':'var(--bad)';
    S.hl.lock=true;
    setTimeout(function(){
      S.hl.lock=false; if(btn) btn.style.borderColor='';
      S.hl.round++;
      if(S.hl.round>=S.hl.rounds){ S.play.done=true; finishTask(); } else hlPaint();
    },240);
  }

  /* ---------- minigame: Memory Match (concentration) ----------
     Grid built ONCE; flips update the single card in place with a pop, so
     reveals feel like card turns instead of the whole board re-rendering. */
  function mgMemoryMatch(t){
    var cards=shuffle(t.tiles.concat(t.tiles)).map(function(e,i){ return { id:i, em:e, up:false, done:false }; });
    S.mm={ cards:cards, open:[] };
    var grid=cards.map(function(c){ return '<div class="seqtile mmc" data-id="'+c.id+'">❓</div>'; }).join('');
    $('mg').innerHTML='<div class="prompt" style="text-align:center">Flip the cards, match all the pairs</div>'
      + '<div class="seqgrid" style="max-width:280px;margin:8px auto 0">'+grid+'</div>';
    each('.mmc', function(b){ b.onclick=function(){ mmFlip(+b.getAttribute('data-id')); }; });
  }
  function mmPaint(id, pop){
    var c=S.mm.cards[id], el=document.querySelector('.mmc[data-id="'+id+'"]');
    if(!c||!el) return;
    el.textContent=(c.up||c.done)?c.em:'❓';
    el.classList.toggle('lit', c.up&&!c.done);
    el.classList.toggle('tap', c.done);
    if(pop) popIn(el);
  }
  function mmFlip(id){
    if(S.play.done) return;
    var c=S.mm.cards[id]; if(!c||c.up||c.done||S.mm.open.length>=2) return;
    c.up=true; S.mm.open.push(id); mmPaint(id, true);
    if(S.mm.open.length===2){
      var a=S.mm.cards[S.mm.open[0]], b=S.mm.cards[S.mm.open[1]];
      if(a.em===b.em){
        a.done=b.done=true; S.mm.open=[]; mmPaint(a.id); mmPaint(b.id);
        var all=true; S.mm.cards.forEach(function(x){ if(!x.done) all=false; });
        if(all){ S.play.done=true; setTimeout(finishTask,260); }
      } else {
        S.play.misses++; showMiss();
        setTimeout(function(){ a.up=false; b.up=false; S.mm.open=[]; if(!S.play.done){ mmPaint(a.id); mmPaint(b.id); } }, 720);
      }
    }
  }

  /* ---------- minigame: Whack-A-Landmark (reflex) ---------- */
  // grid built ONCE; cells update via textContent so taps are never dropped mid-render
  function mgWhack(t){
    // pop rate speeds up (820→560ms) and one more hit is needed on later Stages
    var d=ramp(), tick=Math.round(820-260*d);
    S.wk={ hits:0, need:5+Math.round(d), cells:[null,null,null,null,null,null,null,null,null], timer:null };
    var cells=''; for(var i=0;i<9;i++){ cells+='<div class="seqtile wkc" data-i="'+i+'"></div>'; }
    $('mg').innerHTML='<div class="seqstatus" id="wkst"></div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div class="seqgrid" style="max-width:260px;margin:8px auto 0">'+cells+'</div>';
    each('.wkc', function(b){ fastTap(b, function(){ whackTap(t, +b.getAttribute('data-i')); }); });
    wkStatus(); S.wk.timer=setInterval(function(){ tickWhack(t); }, tick); tickWhack(t);
  }
  function wkStatus(){ var e=$('wkst'); if(e) e.innerHTML='Hits <b>'+S.wk.hits+'</b>/'+S.wk.need; }
  function wkCell(i){ return document.querySelector('.wkc[data-i="'+i+'"]'); }
  function wkPaint(){ for(var i=0;i<9;i++){ var el=wkCell(i); if(!el) continue; var v=S.wk.cells[i]||'';
    if(el.textContent!==v){ el.textContent=v; if(v) popIn(el); else el.classList.remove('pop-in'); } } }
  function tickWhack(t){
    if(S.play.done || !$('wkst')){ clearInterval(S.wk.timer); return; }
    var cells=[null,null,null,null,null,null,null,null,null];
    var idx=shuffle([0,1,2,3,4,5,6,7,8]);
    cells[idx[0]]=t.target;
    var nd=2+Math.floor(Math.random()*2);
    for(var k=1;k<=nd;k++){ cells[idx[k]]=t.decoys[(k-1)%t.decoys.length]; }
    S.wk.cells=cells; wkPaint();
  }
  function whackTap(t,i){
    if(S.play.done) return;
    var c=S.wk.cells[i]; if(!c) return;
    if(c===t.target){ S.wk.hits++; S.wk.cells[i]=null; var el=wkCell(i); if(el) el.textContent=''; wkStatus();
      if(S.wk.hits>=S.wk.need){ S.play.done=true; clearInterval(S.wk.timer); finishTask(); return; }
    } else { S.play.misses++; showMiss(); S.wk.cells[i]=null; var el2=wkCell(i); if(el2) el2.textContent=''; }
  }

  /* ---------- minigame: Quick Tap (reflex) ---------- */
  // box + target built ONCE; hits just move the existing target (no rebuild → a
  // fast follow-up tap can't accidentally land on the background as a miss)
  function mgTargetTap(t){
    S.tt={ hits:0, need:6, grace:0 };
    $('mg').innerHTML='<div class="seqstatus" id="ttst"></div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div id="ttbox" style="position:relative;height:210px;border-radius:16px;border:1px solid var(--cardb);background:rgba(255,255,255,.04);overflow:hidden">'
      + '<div id="ttgt" style="position:absolute;font-size:42px;cursor:pointer;transform:translate(-50%,-50%);transition:left .14s cubic-bezier(.25,.9,.35,1),top .14s cubic-bezier(.25,.9,.35,1)">'+t.target+'</div></div>';
    fastTap($('ttgt'), function(){ ttHit(t); }, true);
    // background tap = miss, but only after a short grace so an over-eager second
    // tap right after a hit (while the target is gliding away) isn't punished
    $('ttbox').onclick=function(){ if(S.play.done) return; if(performance.now()-S.tt.grace<220) return; S.play.misses++; showMiss(); };
    ttStatus(); ttMove();
  }
  function ttStatus(){ var e=$('ttst'); if(e) e.innerHTML='Hits <b>'+S.tt.hits+'</b>/'+S.tt.need; }
  function ttMove(){ var g=$('ttgt'); if(g){ g.style.left=(10+Math.floor(Math.random()*80))+'%'; g.style.top=(12+Math.floor(Math.random()*70))+'%'; } }
  function ttHit(t){
    if(S.play.done) return;
    S.tt.hits++; S.tt.grace=performance.now(); ttStatus();
    if(S.tt.hits>=S.tt.need){ S.play.done=true; finishTask(); return; }
    ttMove();
  }

  /* ================================================================
     KNOWLEDGE-FREE SKILL GAMES — the country skins the screen, but the
     contest is timing / aim / memory / dexterity, so a player who knows
     nothing about the destination competes evenly. All six read ramp()
     so late Stages get faster, tighter, longer. Build-once DOM rule
     applies everywhere (taps must never land mid-render).
     ================================================================ */

  /* ---------- minigame: Swing Meter (timing) ---------- */
  function mgSwingMeter(t){
    var d=ramp();
    S.sw={ hits:0, need:3, pos:0, zw:0.26-0.10*d, zc:0.5, speed:0.55+0.40*d, t0:performance.now() };
    swNewZone();
    $('mg').innerHTML='<div class="seqstatus" id="swst"></div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div id="swbar" style="position:relative;height:74px;border-radius:14px;border:1px solid var(--cardb);background:rgba(255,255,255,.05);overflow:hidden;cursor:pointer;touch-action:manipulation">'
        + '<div id="swz" style="position:absolute;top:0;bottom:0;background:rgba(53,214,160,.30);border-left:2px solid var(--ok);border-right:2px solid var(--ok)"></div>'
        + '<div id="swm" style="position:absolute;top:6px;bottom:6px;width:5px;border-radius:3px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.85)"></div>'
      + '</div>'
      + '<div class="ohint" style="margin-top:10px">Tap the bar while the marker is in the green. The zone shrinks every hit!</div>';
    swStatus(); swPaint();
    fastTap($('swbar'), swTap);
    (function loop(){
      if(S.play.done || !$('swm')) return;
      var el=(performance.now()-S.sw.t0)/1000;
      S.sw.pos=(Math.sin(el*S.sw.speed*Math.PI*2 - Math.PI/2)+1)/2;   // smooth 0..1 ping-pong
      $('swm').style.left='calc('+(S.sw.pos*100)+'% - 2px)';
      requestAnimationFrame(loop);
    })();
  }
  function swStatus(){ var e=$('swst'); if(e) e.innerHTML='Hits <b>'+S.sw.hits+'</b>/'+S.sw.need; }
  function swNewZone(){ var m=S.sw.zw/2+0.06; S.sw.zc=rnd(m,1-m); }
  function swPaint(){ var z=$('swz'); if(z){ z.style.left=((S.sw.zc-S.sw.zw/2)*100)+'%'; z.style.width=(S.sw.zw*100)+'%'; } }
  function swTap(){
    if(S.play.done) return;
    if(Math.abs(S.sw.pos-S.sw.zc)<=S.sw.zw/2){
      sfx('correct'); S.sw.hits++; swStatus(); flash($('swbar'));
      if(S.sw.hits>=S.sw.need){ S.play.done=true; setTimeout(finishTask,200); return; }
      S.sw.zw*=0.78; S.sw.speed*=1.12; swNewZone(); swPaint();
    } else { S.play.misses++; showMiss(); }
  }

  /* ---------- minigame: Eagle Eye (visual hunt — spot the imposter flag) ---------- */
  function mgEagleEye(t){
    S.ee={ round:0, rounds:3, n:12+Math.round(6*ramp()) };
    renderEagle(t);
  }
  function renderEagle(t){
    var n=Math.min(24, S.ee.n + S.ee.round*3);
    var imp=t.imposters[S.ee.round % t.imposters.length] || t.imposters[0];
    var at=Math.floor(Math.random()*n), tiles='';
    for(var i=0;i<n;i++){ tiles+='<div class="seqtile eet" data-b="'+(i===at?1:0)+'" style="width:52px;height:52px;font-size:27px">'+(i===at?imp:t.target)+'</div>'; }
    $('mg').innerHTML='<div class="seqstatus">Found <b>'+S.ee.round+'</b>/'+S.ee.rounds+'</div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div class="seqgrid swap-in" style="max-width:340px;margin:8px auto 0;gap:8px">'+tiles+'</div>';
    each('.eet', function(b){ b.onclick=function(){ eagleTap(t,b); }; });
  }
  function eagleTap(t,el){
    if(S.play.done) return;
    if(el.getAttribute('data-b')==='1'){
      sfx('correct'); el.classList.add('lit');
      S.ee.round++;
      if(S.ee.round>=S.ee.rounds){ S.play.done=true; setTimeout(finishTask,220); }
      else setTimeout(function(){ if(!S.play.done) renderEagle(t); },300);   // rebuild BETWEEN rounds only
    } else { S.play.misses++; showMiss(); el.style.opacity=.35; el.style.pointerEvents='none'; }
  }

  /* ---------- minigame: Memory Lineup (flags flash — spot the one NOT shown) ---------- */
  function mgKimsGame(t){
    var d=ramp();
    S.km={ round:0, rounds:3, k:4+Math.round(2*d), flashMs:2200-900*d };
    renderKim(t);
  }
  function renderKim(t){
    var flags=shuffle(COUNTRIES).slice(0, S.km.k+1).map(function(c){ return c.flag; });
    S.km.intruder=flags[S.km.k];
    var shown=flags.slice(0, S.km.k);
    S.km.opts=shuffle([S.km.intruder].concat(shuffle(shown).slice(0,3)));
    var tiles=shown.map(function(f){ return '<div class="seqtile" style="width:54px;height:54px;font-size:28px">'+f+'</div>'; }).join('');
    $('mg').innerHTML='<div class="seqstatus">Lineup <b>'+(S.km.round+1)+'</b>/'+S.km.rounds+'</div>'
      + '<div class="prompt" style="text-align:center">👀 Memorize the lineup…</div>'
      + '<div class="seqgrid swap-in" id="kmshow" style="max-width:340px;margin:8px auto 0">'+tiles+'</div>';
    setTimeout(function(){ if(!S.play.done && $('kmshow')) kimAsk(t); }, S.km.flashMs);
  }
  function kimAsk(t){
    var opts=S.km.opts.map(function(f){ return '<div class="seqtile kmo" data-f="'+f+'" style="width:58px;height:58px;font-size:30px">'+f+'</div>'; }).join('');
    $('mg').innerHTML='<div class="seqstatus">Lineup <b>'+(S.km.round+1)+'</b>/'+S.km.rounds+'</div>'
      + '<div class="prompt" style="text-align:center">Which flag was <b style="color:var(--bad)">NOT</b> in the lineup?</div>'
      + '<div class="seqgrid swap-in" style="margin-top:8px">'+opts+'</div>';
    each('.kmo', function(b){ b.onclick=function(){ kimTap(t,b); }; });
  }
  function kimTap(t,el){
    if(S.play.done) return;
    if(el.getAttribute('data-f')===S.km.intruder){
      sfx('correct'); el.classList.add('lit');
      S.km.round++;
      if(S.km.round>=S.km.rounds){ S.play.done=true; setTimeout(finishTask,220); }
      else setTimeout(function(){ if(!S.play.done) renderKim(t); },320);
    } else { S.play.misses++; showMiss(); el.style.opacity=.35; el.style.pointerEvents='none'; }
  }

  /* ---------- minigame: Type The Ticket (typing sprint — the word is SHOWN) ---------- */
  function mgTypeTicket(t){
    var word=t.word;
    var letters=shuffle(word.replace(/ /g,'').split(''));
    S.tk={ word:word, idx:0, letters:letters, used:[], fade:(ramp()>=0.35) };
    $('mg').innerHTML='<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div style="border:1px solid var(--cardb);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:rgba(236,181,80,.07);text-align:center">'
        + '<div style="font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--mut);text-transform:uppercase">🎫 Boarding pass · destination</div>'
        + '<div id="tkword" style="font-family:\'Bricolage Grotesque\',sans-serif;font-size:26px;letter-spacing:.08em;margin-top:4px;transition:opacity .9s">'+esc(word)+'</div>'
      + '</div>'
      + '<div class="slot" id="tkslots">'+tkSlots()+'</div>'
      + '<div class="bank">'+letters.map(function(l,i){ return '<div class="ltile tkt" data-i="'+i+'">'+esc(l)+'</div>'; }).join('')+'</div>'
      + (S.tk.fade?'<div class="ohint">The ink fades fast — read it while you can!</div>':'');
    each('.tkt', function(b){ b.onclick=function(){ tkTap(+b.getAttribute('data-i'), b); }; });
    if(S.tk.fade) setTimeout(function(){ var w=$('tkword'); if(w && !S.play.done) w.style.opacity='0.05'; }, 1500);
  }
  function tkSlots(){
    var out='';
    for(var i=0;i<S.tk.word.length;i++){
      var ch=S.tk.word[i];
      if(ch===' '){ out+='<div style="width:14px"></div>'; continue; }
      var done=i<S.tk.idx;
      out+='<div class="tileslot'+(done?' filled':'')+'">'+(done?esc(ch):'')+'</div>';
    }
    return out;
  }
  function tkTap(i, el){
    if(S.play.done || S.tk.used[i]) return;
    if(S.tk.letters[i]===S.tk.word[S.tk.idx]){
      S.tk.used[i]=1; el.classList.add('used'); sfx('tap');
      S.tk.idx++;
      while(S.tk.word[S.tk.idx]===' ') S.tk.idx++;   // spaces fill themselves
      var s=$('tkslots'); if(s) s.innerHTML=tkSlots();   // slots aren't tappable — safe to rebuild
      if(S.tk.idx>=S.tk.word.length){ S.play.done=true; setTimeout(finishTask,200); }
    } else {
      S.play.misses++; showMiss();
      el.style.borderColor='var(--bad)'; setTimeout(function(){ if(el) el.style.borderColor=''; },300);
    }
  }

  /* ---------- minigame: Baggage Claim (visual match on a moving belt) ---------- */
  function mgBaggage(t){
    var d=ramp();
    var bases=['🟥','🟦','🟩','🟨','🟪','🟧'], sticks=['⭐','🌙','⚡','🍀','🎀','🔔'];
    var tb=pick(bases), ts=pick(sticks);
    S.bg={ tb:tb, ts:ts, target:tb+ts, bases:bases, sticks:sticks, grabs:0, need:3,
           slots:[null,null,null,null], hard:d, timer:null };
    var cells=''; for(var i=0;i<4;i++){ cells+='<div class="seqtile bgc" data-i="'+i+'" style="width:74px;height:64px;font-size:23px;letter-spacing:2px"></div>'; }
    $('mg').innerHTML='<div class="seqstatus" id="bgst"></div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div style="text-align:center;margin-bottom:10px"><span class="catchip">Your bag</span> <span style="font-size:26px;letter-spacing:2px;vertical-align:middle">'+S.bg.target+'</span></div>'
      + '<div class="seqgrid" style="margin-top:2px">'+cells+'</div>'
      + '<div class="ohint">The belt keeps moving — tap only YOUR bag.</div>';
    each('.bgc', function(b){ fastTap(b, function(){ bgTap(+b.getAttribute('data-i')); }); });
    bgStatus();
    S.bg.timer=setInterval(bgTick, 1050-350*d); bgTick();
  }
  function bgStatus(){ var e=$('bgst'); if(e) e.innerHTML='Grabbed <b>'+S.bg.grabs+'</b>/'+S.bg.need; }
  function bgCell(i){ return document.querySelector('.bgc[data-i="'+i+'"]'); }
  function bgNew(){
    // decoys converge on your bag as the race ramps: same colour, wrong sticker
    var b = (Math.random() < 0.35+0.5*S.bg.hard) ? S.bg.tb : pick(S.bg.bases);
    var s = pick(S.bg.sticks);
    if(b===S.bg.tb && s===S.bg.ts) s = S.bg.sticks[(S.bg.sticks.indexOf(s)+1)%S.bg.sticks.length];
    return b+s;
  }
  function bgTick(){
    if(S.play.done || !$('bgst')){ clearInterval(S.bg.timer); return; }
    var incoming = (S.bg.slots.indexOf(S.bg.target)<0 && Math.random()<0.55) ? S.bg.target : bgNew();
    S.bg.slots.shift(); S.bg.slots.push(incoming);
    var i, el;
    for(i=0;i<4;i++){ el=bgCell(i); if(el){ el.textContent=S.bg.slots[i]||''; el.classList.remove('bg-step'); } }
    void document.body.offsetWidth;   // one reflow, then every bag slides in like the belt stepped
    for(i=0;i<4;i++){ el=bgCell(i); if(el) el.classList.add('bg-step'); }
  }
  function bgTap(i){
    if(S.play.done) return;
    var bag=S.bg.slots[i]; if(!bag) return;
    var el=bgCell(i);
    if(bag===S.bg.target){
      sfx('correct'); S.bg.grabs++; S.bg.slots[i]=null; if(el) el.textContent=''; bgStatus();
      if(S.bg.grabs>=S.bg.need){ S.play.done=true; clearInterval(S.bg.timer); finishTask(); }
    } else { S.play.misses++; showMiss(); S.bg.slots[i]=null; if(el) el.textContent=''; }
  }

  /* ---------- minigame: Rhythm Echo (audio — hear a rhythm, tap it back) ----------
     Beats are separated by SHORT (~330ms) or LONG (~950ms) gaps; the player's echo
     is judged on gap pattern, not exact timing. The pad pulses in sync with every
     beat, so the game is fully playable muted (visual rhythm). */
  function mgRhythmEcho(t){
    S.re={ round:0, rounds:2, n:4+Math.round(ramp()), state:'idle', pat:[], taps:[] };
    $('mg').innerHTML='<div class="seqstatus" id="rest">🎧 Listen…</div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div class="reps" id="redots"></div>'
      + '<div class="reactbox idle" id="repad" style="height:170px;cursor:pointer"><div class="big">🥁</div><div class="sm" id="resm">Listen to the beat…</div></div>';
    fastTap($('repad'), reTap);
    reBegin();
  }
  function reDots(fill){
    var e=$('redots'); if(!e) return; var h='';
    for(var i=0;i<S.re.n;i++){ h+='<div class="rep'+(i<fill?' done':'')+'"></div>'; }
    e.innerHTML=h;
  }
  function reBegin(){
    S.re.state='play'; S.re.taps=[]; S.re.pat=[];
    for(var i=0;i<S.re.n-1;i++){ S.re.pat.push(Math.random()<0.5?'S':'L'); }
    if(S.re.pat.indexOf('S')<0) S.re.pat[0]='S';                       // always a mix
    if(S.re.pat.indexOf('L')<0) S.re.pat[S.re.pat.length-1]='L';
    var pad=$('repad'); if(pad) pad.setAttribute('data-pat', S.re.pat.join(''));
    var st=$('rest'); if(st) st.innerHTML='🎧 Round <b>'+(S.re.round+1)+'</b>/'+S.re.rounds+' — listen…';
    var sm=$('resm'); if(sm) sm.textContent='Listen to the beat…';
    reDots(0);
    var when=420;
    rePulse(0, when);
    for(var k=0;k<S.re.pat.length;k++){ when += (S.re.pat[k]==='S'?330:950); rePulse(k+1, when); }
    setTimeout(function(){
      if(S.play.done || !$('repad')) return;
      S.re.state='echo';
      var s2=$('rest'); if(s2) s2.innerHTML='🫵 Your turn — tap the same rhythm ('+S.re.n+' taps)';
      var m2=$('resm'); if(m2) m2.textContent='Tap it back!';
      reDots(0);
    }, when+520);
  }
  function rePulse(i, delay){
    setTimeout(function(){
      var pad=$('repad'); if(!pad || S.play.done || S.re.state!=='play') return;
      beep(720,0.10,'triangle',0.14); vibe(14);
      pad.style.background='rgba(236,181,80,.45)';
      reDots(i+1);
      setTimeout(function(){ var p=$('repad'); if(p && S.re.state==='play') p.style.background=''; },150);
    }, delay);
  }
  function reTap(){
    if(S.play.done || S.re.state!=='echo') return;   // taps during playback are ignored
    S.re.taps.push(performance.now());
    beep(600,0.08,'triangle',0.12); vibe(10);
    var pad=$('repad'); if(pad){ pad.style.background='rgba(53,214,160,.4)'; setTimeout(function(){ var p=$('repad'); if(p) p.style.background=''; },120); }
    reDots(S.re.taps.length);
    if(S.re.taps.length>=S.re.n) reJudge();
  }
  function reJudge(){
    var got=[];
    for(var i=1;i<S.re.taps.length;i++){ got.push((S.re.taps[i]-S.re.taps[i-1])<620?'S':'L'); }
    if(got.join('')===S.re.pat.join('')){
      sfx('correct');
      S.re.round++;
      if(S.re.round>=S.re.rounds){ S.play.done=true; setTimeout(finishTask,250); return; }
      S.re.n++;   // next echo is one beat longer
      S.re.state='play'; setTimeout(function(){ if(!S.play.done && $('repad')) reBegin(); },600);
    } else {
      S.play.misses++; showMiss();
      var st=$('rest'); if(st) st.innerHTML='❌ Not quite — listen again…';
      S.re.state='play'; setTimeout(function(){ if(!S.play.done && $('repad')) reBegin(); },800);
    }
  }

  /* ---------- minigame: Closer or Farther (distance duel, 3 rounds) ----------
     Shell built ONCE; the two capitals swap in per round. */
  function mgCloserFar(t){
    S.cf={ i:0, rounds:t.pairs.length };
    $('mg').innerHTML='<div class="seqstatus" id="cfst"></div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div class="btnrow"><button class="btn ghost hlo" data-i="0" style="flex:1"></button>'
      + '<button class="btn ghost hlo" data-i="1" style="flex:1"></button></div>';
    each('.hlo', function(b){ b.onclick=function(){ cfAns(t, +b.getAttribute('data-i'), b); }; });
    cfPaint(t);
  }
  function cfPaint(t){
    var p=t.pairs[S.cf.i];
    var st=$('cfst'); if(st) st.innerHTML='Round <b>'+(S.cf.i+1)+'</b>/'+S.cf.rounds;
    each('.hlo', function(b){ var i=+b.getAttribute('data-i'); b.textContent=(i===0?p.a.label:p.b.label); swapIn(b); });
  }
  function cfAns(t,i,btn){
    if(S.play.done || S.cf.lock) return;
    var p=t.pairs[S.cf.i];
    var ok = (i === ((p.a.d<=p.b.d)?0:1));
    if(ok) sfx('tap'); else { S.play.misses++; showMiss(); }
    if(btn) btn.style.borderColor = ok?'var(--ok)':'var(--bad)';
    S.cf.lock=true;
    setTimeout(function(){
      S.cf.lock=false; if(btn) btn.style.borderColor='';
      S.cf.i++;
      if(S.cf.i>=S.cf.rounds){ S.play.done=true; finishTask(); } else cfPaint(t);
    },240);
  }

  /* ---------- minigame: Compass Chase (tap the direction, 2-3 rounds) ---------- */
  function mgCompass(t){
    S.cp={ i:0, rounds:t.rounds };
    var DIRS=[['N','⬆️ North'],['S','⬇️ South'],['E','➡️ East'],['W','⬅️ West']];
    $('mg').innerHTML='<div class="seqstatus" id="cpst"></div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'

      + '<div class="btnrow">'+DIRS.slice(2).map(function(d2){ return '<button class="btn ghost hlo" data-d="'+d2[0]+'" style="flex:1">'+d2[1]+'</button>'; }).join('')+'</div>';
    each('.hlo', function(b){ b.onclick=function(){ cpAns(t, b.getAttribute('data-d'), b); }; });

  function cpPaint(t){

  }
  function cpAns(t,d,btn){

    var ok = (d===S.cp.rounds[S.cp.i].dir);
    if(ok) sfx('tap'); else { S.play.misses++; showMiss(); }
    if(btn) btn.style.borderColor = ok?'var(--ok)':'var(--bad)';
    S.cp.lock=true;
    setTimeout(function(){
      S.cp.lock=false; if(btn) btn.style.borderColor='';
      S.cp.i++;
      if(S.cp.i>=S.cp.rounds.length){ S.play.done=true; finishTask(); } else cpPaint(t);
    },240);
  }

  /* ---------- minigame: Region Sort (two buckets, six countries) ---------- */
  function mgRegionSort(t){
    S.rs={ i:0, queue:t.queue };
    $('mg').innerHTML='<div class="seqstatus" id="rsst"></div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div id="rscard" style="text-align:center;margin-bottom:14px"><span style="font-size:44px;display:block" id="rsflag"></span><b id="rsname" style="font-size:18px"></b></div>'
      + '<div class="btnrow">'
        + '<button class="btn ghost hlo" data-r="'+esc(t.regA)+'" style="flex:1">'+esc(t.regA)+'</button>'
        + '<button class="btn ghost hlo" data-r="'+esc(t.regB)+'" style="flex:1">'+esc(t.regB)+'</button>'
      + '</div>';
    each('.hlo', function(b){ b.onclick=function(){ rsAns(t, b.getAttribute('data-r'), b); }; });

  function rsPaint(){

    var st=$('rsst'); if(st) st.innerHTML='Sorted <b>'+S.rs.i+'</b>/'+S.rs.queue.length;
    var f=$('rsflag'); if(f) f.textContent=q.flag;
    var n=$('rsname'); if(n) n.textContent=q.name;
