  }
  function rsAns(t,r,btn){
    if(S.play.done || S.rs.lock) return;
    var ok = (r===S.rs.queue[S.rs.i].region);
    if(ok) sfx('tap'); else { S.play.misses++; showMiss(); }
    if(btn) btn.style.borderColor = ok?'var(--ok)':'var(--bad)';
    S.rs.lock=true;
    setTimeout(function(){
      S.rs.lock=false; if(btn) btn.style.borderColor='';
      S.rs.i++;
      if(S.rs.i>=S.rs.queue.length){ S.play.done=true; finishTask(); } else rsPaint();
    },240);
  }

  /* ---------- minigame: Pitch Patrol (ears — tap HIGH, hold LOW) ----------
     With sound ON the pad flashes the SAME neutral pulse for both notes, so your
     ears decide. Muted (or no Web Audio), the pad shows ▲/▼ instead — the game
     stays fully playable as a visual reflex test. */
  function mgPitchPatrol(t){
    S.pp={ hits:0, need:4, state:'idle', to:null };
    $('mg').innerHTML='<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div class="reps" id="ppreps"></div>'
      + '<div class="reactbox idle" id="ppad" style="height:170px;cursor:pointer"><div class="big" id="ppbig">🎧 Ready?</div><div class="sm" id="ppsm">Tap to start — then tap HIGH notes, hold through LOW ones.</div></div>';
    ppReps(); fastTap($('ppad'), function(){ ppTap(); });
  }
  function ppReps(){ var e=$('ppreps'); if(!e) return; var h=''; for(var i=0;i<S.pp.need;i++){ h+='<div class="rep'+(i<S.pp.hits?' done':'')+'"></div>'; } e.innerHTML=h; }
  function ppClear(){ if(S.pp.to){ clearTimeout(S.pp.to); S.pp.to=null; } }
  function ppSet(big, sm, tone){
    var b=$('ppbig'), s=$('ppsm'), pad=$('ppad');
    if(b) b.textContent=big; if(s) s.textContent=sm;
    if(pad){ pad.setAttribute('data-tone', tone||''); }
  }
  function ppWait(){
    S.pp.state='wait'; ppSet('…','Listen…','');
    var pad=$('ppad'); if(pad) pad.style.background='';
    ppClear(); S.pp.to=setTimeout(ppTone, rnd(700,1600));
  }
  function ppTone(){
    if(S.play.done || !$('ppad')) return;
    var isHigh=Math.random()<0.6;
    S.pp.state=isHigh?'high':'low'; S.pp.armAt=performance.now();
    beep(isHigh?920:200, 0.24, 'triangle', 0.16);
    // ALWAYS show the ▲/▼ direction (with colour) so the game is fully playable
    // without sound — deaf/HoH players aren't locked out; the tone is extra juice.
    ppSet(isHigh?'▲ HIGH':'▼ LOW', isHigh?'TAP!':'hold…', isHigh?'H':'L');
    var pad=$('ppad'); if(pad){ pad.style.background=isHigh?'rgba(236,181,80,.4)':'rgba(70,90,140,.35)'; setTimeout(function(){ var p=$('ppad'); if(p) p.style.background=''; },220); }
    ppClear();
    if(isHigh) S.pp.to=setTimeout(function(){ if(S.pp.state==='high'&&!S.play.done) ppResolve('slow'); }, 1150);
    else       S.pp.to=setTimeout(function(){ if(S.pp.state==='low' &&!S.play.done) ppResolve('held'); }, 900);
  }
  function ppTap(){
    if(S.play.done) return;
    var s=S.pp.state;
    if(s==='idle'){ actx(); ppWait(); return; }
    if(s==='fb') return;
    if(s==='wait'){ ppClear(); ppResolve('early'); return; }
    if(s==='high'){ ppClear(); ppResolve('hit'); return; }
    if(s==='low'){ ppClear(); ppResolve('lowTap'); return; }
  }
  // hit/slow consume a HIGH rep; held/lowTap/early don't advance completion
  function ppResolve(kind){
    ppClear();
    if(kind==='hit'){ S.pp.hits++; sfx('correct'); ppSet('⚡ Nice!','That was the high note.',''); }
    else if(kind==='slow'){ S.pp.hits++; S.play.misses++; showMiss(); ppSet('Too slow!','+1 miss','');}
    else if(kind==='held'){ ppSet('Held ✓','Good ear.',''); }
    else if(kind==='lowTap'){ S.play.misses++; showMiss(); ppSet('That was LOW!','+1 miss',''); }
    else { S.play.misses++; showMiss(); ppSet('Too soon!','+1 miss — wait for the note',''); }
    S.pp.state='fb'; ppReps();
    if(S.pp.hits>=S.pp.need){ S.play.done=true; S.pp.to=setTimeout(finishTask, 550); }
    else S.pp.to=setTimeout(function(){ if(!S.play.done) ppWait(); }, 650);
  }

  /* ---------- minigame: Runway Landing (time the drop over a moving pass) ---------- */
  /* ---------- minigame: Pilot The Landing (controllable descent) ----------
     A side-view approach. The plane cruises in from the left; you tap "Begin
     Descent" to start a steady sink, then "Flare / Touchdown" to cushion onto the
     runway. Flare too high and you drop in too fast (hard landing); land short or
     overshoot the strip and you miss; grease it into the touchdown zone with a
     gentle flare for a clean, fast time. One landing = one experience. */
  var RW={ H:210 };
  function mgRunway(t){
    var d=ramp();
    S.rw={ phase:'cruise', alt:0.9, x:0.04, vs:0,
           cruise:0.9, cspeed:0.155+0.05*d, drate:0.42+0.12*d,
           z0:0.54, z1:0.86, flareAlt:0, slam:false, done2:false, last:performance.now() };
    $('mg').innerHTML='<div class="seqstatus" id="rwst">✈️ Cleared to land</div>'
      + '<div class="prompt" style="text-align:center;margin-bottom:8px">Bring her down smooth — <b>descend</b>, then <b>flare</b> to touch down gently.</div>'
      + '<div id="rwfield" style="position:relative;height:'+RW.H+'px;border-radius:14px;border:1px solid var(--cardb);overflow:hidden;touch-action:manipulation;'
          + 'background:linear-gradient(180deg,#20386e 0%,#3f63ad 34%,#89a7cf 60%,#b9cfe0 66%)">'
        + '<svg viewBox="0 0 360 210" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">'
          + '<polygon points="0,138 55,108 105,132 165,96 220,130 285,104 360,132 360,140 0,140" fill="rgba(40,60,96,.5)"/>'
        + '</svg>'
        + '<div style="position:absolute;left:0;right:0;bottom:0;height:'+Math.round(RW.H*0.34)+'px;background:linear-gradient(180deg,#3f7d4f,#2c6640)"></div>'
        + '<div id="rwrun" style="position:absolute;bottom:0;left:38%;right:0;height:'+Math.round(RW.H*0.20)+'px;background:#2a2f38;box-shadow:inset 0 3px 8px rgba(0,0,0,.45)">'
          + '<div style="position:absolute;left:0;right:0;top:50%;height:3px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,rgba(255,255,255,.9) 0 20px,transparent 20px 42px)"></div>'
          + '<div style="position:absolute;left:2%;top:14%;bottom:14%;width:8px;background:repeating-linear-gradient(180deg,#fff 0 6px,transparent 6px 12px)"></div>'
        + '</div>'
        + '<div id="rwz" style="position:absolute;bottom:0;height:'+Math.round(RW.H*0.20)+'px;left:'+(S.rw.z0*100)+'%;width:'+((S.rw.z1-S.rw.z0)*100)+'%;background:rgba(63,206,134,.30);border-left:3px solid var(--ok);border-right:3px solid var(--ok)"></div>'
        + '<svg viewBox="0 0 360 210" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">'
          + '<line x1="16" y1="24" x2="'+(((S.rw.z0+S.rw.z1)/2)*360)+'" y2="'+rwGroundY()+'" stroke="rgba(255,255,255,.35)" stroke-width="1.2" stroke-dasharray="4 5"/>'
        + '</svg>'
        + '<div id="rwsh" style="position:absolute;font-size:26px;opacity:.15">🛬</div>'
        + '<div id="rwp" style="position:absolute;font-size:30px;transform-origin:center;filter:drop-shadow(0 5px 6px rgba(0,0,0,.35))">🛬</div>'
        + '<div style="position:absolute;right:6px;top:8px;bottom:'+Math.round(RW.H*0.34)+'px;width:8px;background:rgba(0,0,0,.25);border-radius:4px;overflow:hidden">'
          + '<div id="rwvs" style="position:absolute;left:0;right:0;bottom:0;height:0;background:var(--ok)"></div></div>'
      + '</div>'
      + '<div id="rwmsg" style="text-align:center;margin:10px 0 8px;min-height:20px;font-weight:700;color:var(--mut)">Steady on approach…</div>'
      + '<button class="btn globe" id="rwbtn" style="width:100%">▼ Begin Descent</button>';
    rwPlace();
    fastTap($('rwbtn'), rwAction);
    S.rw.last=performance.now();
    (function loop(){
      var f=$('rwfield'); if(S.play.done || S.rw.done2 || !f) return;
      var now=performance.now(), dt=Math.min(0.05,(now-S.rw.last)/1000); S.rw.last=now;
      var r=S.rw;
      if(r.phase==='cruise'){ r.x+=r.cspeed*dt; r.vs=0; }
      else if(r.phase==='descent'){ r.x+=r.cspeed*dt; r.vs=r.drate; r.alt-=r.vs*dt;
        if(r.alt<=0){ r.alt=0; r.slam=true; return rwTouchdown(); } }
      else if(r.phase==='flare'){ r.x+=r.cspeed*0.55*dt; r.vs=Math.max(0.09,r.vs-1.6*dt); r.alt-=r.vs*dt;  // floor sink so she always settles
        if(r.alt<=0){ r.alt=0; return rwTouchdown(); } }
      if(r.x>=0.98 && r.phase!=='flare'){ return rwOvershoot(); }
      rwPlace();
      requestAnimationFrame(loop);
    })();
  }
  function rwGroundY(){ return RW.H - RW.H*0.20 - 6; }   // svg y of the touchdown surface
  function rwPlace(){
    var r=S.rw, p=$('rwp'), sh=$('rwsh'), f=$('rwfield'); if(!p||!f) return;
    var topPx = 12 + (1-r.alt)*(rwGroundY()-12);
    var leftPct = r.x*100;
    var pitch = r.phase==='descent' ? 12 : (r.phase==='flare'? -4 : 2);
    p.style.left=leftPct+'%'; p.style.top=topPx+'px'; p.style.transform='translate(-50%,-50%) rotate('+pitch+'deg)';
    if(sh){ sh.style.left=leftPct+'%'; sh.style.top=(rwGroundY()+8)+'px'; sh.style.opacity=String(0.08+0.22*(1-r.alt)); sh.style.transform='translate(-50%,-50%) scaleY(.3) scaleX('+(0.5+0.6*(1-r.alt))+')'; }
    var vs=$('rwvs'); if(vs){ var mag=Math.min(1,r.vs/0.6); vs.style.height=Math.round(mag*100)+'%'; vs.style.background = r.vs>0.5?'var(--bad)':(r.vs>0.28?'var(--globe)':'var(--ok)'); }
    f.setAttribute('data-phase',r.phase); f.setAttribute('data-alt',r.alt.toFixed(3)); f.setAttribute('data-x',r.x.toFixed(3));
  }
  function rwAction(){
    if(S.play.done || S.rw.done2) return;
    var r=S.rw, b=$('rwbtn');
    if(r.phase==='cruise'){ r.phase='descent'; sfx('tap'); if(b) b.textContent='🛬 Flare / Touchdown';
      var m=$('rwmsg'); if(m){ m.textContent='Descending — ease her onto the numbers.'; } }
    else if(r.phase==='descent'){ r.phase='flare'; r.flareAlt=r.alt; sfx('tap'); if(b){ b.disabled=true; b.style.opacity='.5'; } }
  }
  function rwOvershoot(){ if(S.rw.done2) return; S.rw.done2=true; rwResult(false,'✈️ Overshot the runway — go around!',2); }
  function rwTouchdown(){
    if(S.rw.done2) return; S.rw.done2=true;
    var r=S.rw, xc=r.x, inZone = xc>=r.z0-0.03 && xc<=r.z1+0.03;
    rwPlace();
    if(r.slam || r.flareAlt>0.34){ rwResult(false, r.slam?'💥 Slammed it — you never flared!':'💥 Hard landing — came in too fast!', inZone?2:3); }
    else if(!inZone){ rwResult(false, xc<r.z0?'⬇️ Landed short of the runway':'➡️ Floated past the zone', 2); }
    else if(r.flareAlt<=0.17){ rwResult(true,'🛬 Greased it! Textbook landing.',0,true); }
    else { rwResult(true,'🛬 Smooth landing.',0); }
  }
  function rwResult(ok, msg, miss, perfect){
    var f=$('rwfield'), m=$('rwmsg');
    if(ok){ sfx('correct'); vibe(perfect?[15,30,15]:14); if(f) flash(f); }
    else { for(var i=0;i<miss;i++){ S.play.misses++; } sfx('wrong'); vibe([25,40,25]); if(f) retrig(f,'hitflash'); }
    showMiss();
    if(m){ m.textContent=msg; m.style.color=ok?'var(--ok)':'var(--bad)'; }
    S.play.done=true;
    setTimeout(finishTask, 950);
  }

  /* ---------- minigame: Photo Snap (track a drifting subject, tap the shutter) ---------- */
  function mgPhotoSnap(t){
    var d=ramp();
    S.ps={ shots:0, need:3, fw:0.38-0.08*d, spd:0.55+0.45*d, x:0.5, y:0.5, t0:performance.now() };
    $('mg').innerHTML='<div class="seqstatus" id="psst"></div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div id="psbox" style="position:relative;height:200px;border-radius:14px;border:1px solid var(--cardb);overflow:hidden;'
          + 'background:radial-gradient(120% 120% at 50% 40%,#123, #0a1020)">'
        // viewfinder chrome: rule-of-thirds grid, corner brackets, REC dot
        + '<div style="position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:33.3% 33.3%;background-position:center"></div>'
        + '<div style="position:absolute;left:8px;top:8px;width:16px;height:16px;border-left:2px solid rgba(255,255,255,.6);border-top:2px solid rgba(255,255,255,.6)"></div>'
        + '<div style="position:absolute;right:8px;top:8px;width:16px;height:16px;border-right:2px solid rgba(255,255,255,.6);border-top:2px solid rgba(255,255,255,.6)"></div>'
        + '<div style="position:absolute;left:8px;bottom:8px;width:16px;height:16px;border-left:2px solid rgba(255,255,255,.6);border-bottom:2px solid rgba(255,255,255,.6)"></div>'
        + '<div style="position:absolute;right:8px;bottom:8px;width:16px;height:16px;border-right:2px solid rgba(255,255,255,.6);border-bottom:2px solid rgba(255,255,255,.6)"></div>'
        + '<div style="position:absolute;left:10px;top:9px;display:flex;align-items:center;gap:4px;font-size:9px;font-weight:800;color:#ff5a5a"><span style="width:7px;height:7px;border-radius:50%;background:#ff5a5a;display:inline-block"></span>REC</div>'
        + '<div id="pssub" style="position:absolute;font-size:40px;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))">'+(t.flag||'🌍')+'</div>'
        + '<div id="psframe" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid var(--goldhi);border-radius:10px;box-shadow:0 0 0 100vmax rgba(0,0,0,.28);transition:width .25s ease,height .25s ease,border-color .15s"></div>'
      + '</div>'
      + '<button class="btn globe" id="psshut" style="margin-top:12px">📸 Snap</button>';
    psStatus(); psFrame();
    fastTap($('psshut'), psSnap);
    (function loop(){
      if(S.play.done || !$('pssub')) return;
      var el=(performance.now()-S.ps.t0)/1000*S.ps.spd;
      S.ps.x=0.5+0.38*Math.sin(el*2.1);
      S.ps.y=0.5+0.34*Math.sin(el*3.3+1.2);
      var s=$('pssub'); s.style.left=(S.ps.x*100)+'%'; s.style.top=(S.ps.y*100)+'%';
      // live lock indicator: the frame glows green only when a snap would count
      var f=$('psframe'); if(f && !S.ps._flash){ f.style.borderColor = psInFrame()?'var(--ok)':'var(--goldhi)'; }
      requestAnimationFrame(loop);
    })();
  }
  function psStatus(){ var e=$('psst'); if(e) e.innerHTML='Shots <b>'+S.ps.shots+'</b>/'+S.ps.need; }
  function psFrame(){ var f=$('psframe'); if(f){ f.style.width=(S.ps.fw*100)+'%'; f.style.height=(S.ps.fw*200*0.9)+'px'; } }
  // subject centre inside the reticle: half-width = fw/2, half-height = fw*0.45
  // (frame height is fw*0.9 of the box; the old check used fw*0.9 as the HALF,
  // so a subject well outside the frame still counted — that was the bug).
  function psInFrame(){ return Math.abs(S.ps.x-0.5)<S.ps.fw/2 && Math.abs(S.ps.y-0.5)<S.ps.fw*0.45; }
  function psSnap(){
    if(S.play.done) return;
    var f=$('psframe'); S.ps._flash=true; setTimeout(function(){ S.ps._flash=false; },250);
    if(psInFrame()){
      sfx('correct'); S.ps.shots++; psStatus();
      if(f){ f.style.borderColor='var(--ok)'; setTimeout(function(){ var f2=$('psframe'); if(f2) f2.style.borderColor='var(--goldhi)'; },250); }
      if(S.ps.shots>=S.ps.need){ S.play.done=true; setTimeout(finishTask,200); return; }
      S.ps.fw*=0.82; S.ps.spd*=1.18; psFrame();
    } else {
      S.play.misses++; showMiss();
      if(f){ f.style.borderColor='var(--bad)'; setTimeout(function(){ var f2=$('psframe'); if(f2) f2.style.borderColor='var(--goldhi)'; },250); }
    }
  }

  /* ---------- minigame: Stamp It (align + pressure) ----------
     A two-part skill, not a single tap. First LINE UP the sliding stamp over the
     empty slot (tap to lock its position); then PRESS with the right force — a
     pressure needle sweeps up and down, tap to set it. Too light = a faint
     half-stamp; too hard = an over-inked smudge; aligned + firm-but-not-too-hard
     = a crisp passport stamp. Themed on the drawn destination. */
  var ST_INKS=['#b3372b','#1f5fa8','#2c7d4c','#6a4a12'];   // passport inks: red, blue, green, sepia
  function mgStampIt(t){
    var d=ramp();
    S.st2={ phase:'aim', tol:0.11-0.03*d, speed:0.5+0.35*d, pos:0.5, tx:0.5,
            press:0, pdir:1, pspeed:0.85+0.4*d, lockX:0.5, alignErr:1, done2:false, t0:performance.now(),
            city:((S.dest&&S.dest.name)||'GLOBE'), flag:((S.dest&&S.dest.flag)||'✈') };
    var m=S.st2.tol+0.05; S.st2.tx=rnd(m,1-m);
    $('mg').innerHTML='<div class="seqstatus" id="stst">Step 1 — line up the stamp</div>'
      + '<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div id="stfield" class="passport">'
        + '<div class="gutter"></div>'
        + '<div id="sttarget" class="stampslot"></div>'
        + '<div id="ststamp" class="stamphead">🔻</div>'
      + '</div>'
      // pressure gauge (revealed in step 2): green "just right" band + a sweeping needle
      + '<div id="stgauge" style="display:none;position:relative;height:26px;margin-top:12px;border-radius:8px;overflow:hidden;background:var(--card2);border:1px solid var(--cardb)">'
        + '<div style="position:absolute;top:0;bottom:0;left:60%;width:25%;background:rgba(63,206,134,.35);border-left:2px solid var(--ok);border-right:2px solid var(--ok)"></div>'
        + '<div id="stneedle" style="position:absolute;top:-2px;bottom:-2px;width:4px;background:var(--goldhi);box-shadow:0 0 8px var(--goldhi)"></div>'
        + '<div style="position:absolute;left:6px;top:5px;font-size:10px;font-weight:800;color:var(--mut)">LIGHT</div>'
        + '<div style="position:absolute;right:6px;top:5px;font-size:10px;font-weight:800;color:var(--mut)">HARD</div>'
      + '</div>'
      + '<div class="ohint" id="sthint" style="margin-top:10px">Tap when the stamp is over the empty box.</div>';
    stPaintTarget();
    fastTap($('stfield'), stTap);
    var gg=$('stgauge'); if(gg) fastTap(gg, stTap);
    (function loop(){
      var r=S.st2, field=$('stfield'); if(S.play.done || r.done2 || !field) return;
      var el=(performance.now()-r.t0)/1000;
      if(r.phase==='aim'){ r.pos=(Math.sin(el*r.speed*Math.PI*2)+1)/2; var st=$('ststamp'); if(st) st.style.left=(r.pos*100)+'%'; }
      else if(r.phase==='press'){ r.press+=r.pdir*r.pspeed*0.016; if(r.press>=1){ r.press=1; r.pdir=-1; } if(r.press<=0){ r.press=0; r.pdir=1; }
        var n=$('stneedle'); if(n) n.style.left=(r.press*100)+'%'; }
      field.setAttribute('data-phase',r.phase); field.setAttribute('data-pos',r.pos.toFixed(3)); field.setAttribute('data-tx',r.tx.toFixed(3)); field.setAttribute('data-tol',r.tol.toFixed(3)); field.setAttribute('data-press',r.press.toFixed(3));
      requestAnimationFrame(loop);
    })();
  }
  function stPaintTarget(){ var tg=$('sttarget'); if(tg){ tg.style.left=((S.st2.tx-S.st2.tol)*100)+'%'; tg.style.width=(S.st2.tol*2*100)+'%'; } }
  function stTap(){
    if(S.play.done || S.st2.done2) return;
    var r=S.st2;
    if(r.phase==='aim'){
      r.lockX=r.pos; r.alignErr=Math.abs(r.pos-r.tx); r.phase='press';
      var st=$('ststamp'); if(st){ st.style.left=(r.lockX*100)+'%'; retrig(st,'press'); }
      var gg=$('stgauge'); if(gg) gg.style.display='block';
      var stt=$('stst'); if(stt) stt.innerHTML='Step 2 — press with the right force';
      var h=$('sthint'); if(h) h.textContent='Tap when the needle is in the green band.';
      sfx('tap');
      return;
    }
    // press phase — commit the stamp
    r.done2=true;
    var head=$('ststamp'); if(head) retrig(head,'press');
    var aligned = r.alignErr<=r.tol;
    var pressGood = r.press>=0.6 && r.press<=0.85;
    var crisp = aligned && pressGood;
    var field=$('stfield');
    if(field){
      var ink=crisp?ST_INKS[Math.floor(rnd(0,ST_INKS.length))]:'rgba(90,70,40,.55)';
      var sz=crisp?70:(r.press<0.6?46:78), rot=Math.round(rnd(-12,12));
      var faint = r.press<0.6, smudge = r.press>0.85;
      var im=document.createElement('div'); im.className='imprint';
      im.style.cssText='left:calc('+(r.lockX*100)+'% - '+(sz/2)+'px);top:'+(crisp?40:52)+'px;width:'+sz+'px;height:'+sz+'px;'
        +'color:'+ink+';transform:rotate('+rot+'deg)'+(crisp?'':';opacity:'+(faint?0.4:0.7)+(smudge?';filter:blur(1.4px)':(faint?';filter:blur(.5px)':'')));
      im.innerHTML='<div class="cty">'+esc(r.city)+'</div><div class="ic">'+(aligned?r.flag:'〰')+'</div><div class="br">RUN THE GLOBE</div>';
      field.appendChild(im); popIn(im);
    }
    var stt=$('stst'), h=$('sthint');
    if(crisp){ sfx('correct'); vibe([12,24,12]); if(stt) stt.innerHTML='🛂 Crisp stamp!'; if(h){ h.textContent='Perfectly aligned and inked.'; h.style.color='var(--ok)'; } }
    else {
      var why = !aligned ? 'Off the box — smudged.' : (r.press<0.6 ? 'Too light — a faint half-stamp.' : 'Too hard — over-inked blot.');
      S.play.misses++; if(!aligned && !pressGood) S.play.misses++;   // both wrong = 2
      showMiss(); if(stt) stt.innerHTML='Smudged'; if(h){ h.textContent=why; h.style.color='var(--bad)'; }
    }
    S.play.done=true; setTimeout(finishTask, 800);
  }

  /* ---------- minigame: Find It On The Map (spatial, distance-scored) ---------- */
  function haversine(la1,lo1,la2,lo2){
    var R=6371, r=Math.PI/180, dLa=(la2-la1)*r, dLo=(lo2-lo1)*r;
    var a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)*Math.sin(dLo/2);
    return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));
  }
  // rough continent outlines ([lng,lat] vertices) — schematic, just to orient the
  // player; scoring uses real coordinates so map crudeness doesn't affect fairness.
  var CONTINENTS=[
    // North America (Alaska→Canada→US→Mexico→Central America)
    [[-168,66],[-140,69],[-96,72],[-62,62],[-52,47],[-66,44],[-81,31],[-97,26],[-92,15],[-83,9],[-78,8],[-100,17],[-106,23],[-124,34],[-138,55]],
    // Greenland
    [[-45,60],[-20,60],[-18,70],[-30,72]],
    // Caribbean (Cuba, Hispaniola, Jamaica, Puerto Rico)
    [[-85,19],[-74,17],[-65,17],[-66,19],[-79,24],[-85,23]],
    // South America
    [[-78,9],[-60,6],[-50,0],[-35,-6],[-40,-22],[-58,-35],[-71,-53],[-75,-44],[-81,-14],[-80,-3]],
    // Europe (mainland)
    [[-10,44],[-9,37],[5,40],[18,40],[28,41],[42,48],[40,60],[28,66],[10,62],[0,58],[-5,50]],
    // British Isles
    [[-11,50],[2,52],[-1,59],[-9,58]],
    // Africa
    [[-17,35],[11,34],[24,32],[33,31],[43,12],[51,11],[41,-12],[35,-26],[20,-35],[12,-16],[9,4],[-8,5],[-17,15]],
    // Madagascar
    [[43,-12],[50,-15],[50,-25],[45,-26],[43,-16]],
    // Asia (Siberia, China, Korea, SE Asia, India, Arabia, Middle East)
    [[30,66],[60,68],[100,73],[140,72],[169,66],[162,60],[143,46],[130,42],[122,30],[110,21],[106,9],[100,5],[98,12],[92,20],[88,22],[80,8],[72,20],[66,25],[57,25],[56,17],[52,13],[43,12],[40,20],[35,28],[36,37],[44,41],[30,50]],
    // Maritime SE Asia (Sumatra, Java, Borneo, New Guinea)
    [[95,8],[104,2],[119,7],[120,-2],[141,-2],[141,-9],[110,-11],[98,-6]],
    // Philippines
    [[117,6],[127,7],[127,19],[119,19]],
    // Japan
    [[129,31],[141,34],[146,44],[139,37],[132,33]],
    // Australia
    [[113,-12],[131,-11],[147,-11],[154,-20],[150,-38],[129,-32],[115,-35],[113,-25]],
    // New Zealand
    [[166,-40],[179,-37],[174,-47]],
    // Fiji
    [[176,-16],[180,-16],[180,-20],[176,-20]]
  ];
  // schematic world map (equirectangular: x=lng+180 [0..360], y=90-lat [0..180]),
  // shared by Find-It, Street Scout and the between-Stage Flight Leg.
  var LAND = (window.GLOBE_LAND && window.GLOBE_LAND.length) ? window.GLOBE_LAND : null;
  // The world map is static, so build its ~16KB SVG string once and reuse it
  // (it's drawn on every Flight Leg, Find-It, and Globe Hunt — no need to rebuild).
  var _worldSVG=null;
  function worldSVGInner(){
    if(_worldSVG!=null) return _worldSVG;
    var grid='', lo, la, x, y;
    for(lo=-150;lo<=150;lo+=30){ x=lo+180; grid+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="180" stroke="rgba(255,255,255,.05)" stroke-width="0.4"/>'; }
    for(la=-60;la<=60;la+=30){ y=90-la; grid+='<line x1="0" y1="'+y+'" x2="360" y2="'+y+'" stroke="rgba(255,255,255,.05)" stroke-width="0.4"/>'; }
    grid+='<line x1="0" y1="90" x2="360" y2="90" stroke="rgba(255,255,255,.12)" stroke-width="0.6"/>';
    var paths;
    if(LAND){
      // real coastlines (Natural Earth, projected to svg coords) — one filled path
      var d=LAND.map(function(r){ return 'M'+r.map(function(p){ return p[0]+' '+p[1]; }).join('L')+'Z'; }).join('');
      paths='<path d="'+d+'" fill="rgba(70,165,108,.32)" stroke="rgba(93,196,132,.55)" stroke-width="0.4" stroke-linejoin="round" fill-rule="evenodd"/>';
    } else {
      paths=CONTINENTS.map(function(poly){
        return '<polygon points="'+poly.map(function(p){ return (p[0]+180)+','+(90-p[1]); }).join(' ')+'" fill="rgba(70,165,108,.34)" stroke="rgba(93,196,132,.6)" stroke-width="0.6"/>';
      }).join('');
    }
    _worldSVG=grid+paths;
    return _worldSVG;
  }
  function mgMapFind(t){ runMapGuess(t.q, t.ll); }
  // shared world-map pin-drop, reused by Find-It and Street Scout. `targetLL`=[lat,lng].
  function runMapGuess(qText, targetLL){
    $('mg').innerHTML='<div class="prompt" style="text-align:center">'+esc(qText)+'</div>'
      + '<svg id="wmap" viewBox="0 0 360 180" preserveAspectRatio="none" style="width:100%;height:auto;aspect-ratio:2/1;background:radial-gradient(120% 120% at 50% 40%,rgba(26,74,134,.5),rgba(10,8,26,.92));border:1px solid var(--cardb);border-radius:12px;cursor:crosshair;touch-action:manipulation">'
      + worldSVGInner() + '</svg><div class="ohint" id="maphint">Tap the map where you think it is.</div>';
    $('wmap').addEventListener('click', function(ev){ mapGuess(ev, targetLL); });
  }
  function mapGuess(ev, targetLL){
    if(S.play.done) return;
    var svg=$('wmap'); if(!svg) return;
    S.play.done=true; stopTimer();
    var raw=(performance.now()-S.play.start)/1000;
    var b=svg.getBoundingClientRect();
    var vx=(ev.clientX-b.left)/b.width*360, vy=(ev.clientY-b.top)/b.height*180;
    var gLng=vx-180, gLat=90-vy, d=haversine(gLat,gLng,targetLL[0],targetLL[1]);
    var miss = d<600?0 : d<1800?1 : d<4500?2 : d<9000?3 : 4;
    S.play.misses=miss;
    var cx=targetLL[1]+180, cy=90-targetLL[0];
    svg.insertAdjacentHTML('beforeend',
      '<line x1="'+vx+'" y1="'+vy+'" x2="'+cx+'" y2="'+cy+'" stroke="rgba(255,255,255,.5)" stroke-width="0.7" stroke-dasharray="2 2"/>'
      + '<circle cx="'+vx+'" cy="'+vy+'" r="3" fill="#EE5A44"/>'
      + '<circle cx="'+cx+'" cy="'+cy+'" r="3.2" fill="#35d6a0" stroke="#fff" stroke-width="0.5"/>');
    var h=$('maphint'); if(h) h.innerHTML='You were <b>'+Math.round(d).toLocaleString()+' km</b> away — '+(miss===0?'bullseye! 🎯':('+'+miss+' miss'+(miss>1?'es':'')));
    setTimeout(function(){ resolveRound(raw, miss, false); }, 1500);
  }

  /* ---------- minigame: Globe Hunt (Globle-style "warmer / colder" hunt) ----------
     A country is hidden among a spread of dots. Tap a dot to take a heat reading
     (distance to the hidden country) and follow the warmth to pin it down. Par is
     4 readings; each reading over par is a small miss, so it rewards triangulation
     without punishing exploration. */
  function mgGlobeHunt(t){
    S.gh={ tgt:t.target.ll, guesses:0, best:Infinity, par:4, done:false };
    var dots=t.pins.map(function(p,i){
      var x=p.ll[1]+180, y=90-p.ll[0];
      return '<circle class="ghdot" data-i="'+i+'" cx="'+x+'" cy="'+y+'" r="3.2" '
        + 'fill="rgba(240,238,230,.30)" stroke="rgba(255,255,255,.5)" stroke-width="0.5" style="cursor:pointer;transition:r .18s ease,fill .18s ease"/>';
    }).join('');
    $('mg').innerHTML='<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<svg id="ghmap" viewBox="0 0 360 180" preserveAspectRatio="none" style="width:100%;height:auto;aspect-ratio:2/1;background:radial-gradient(120% 120% at 50% 40%,rgba(26,74,134,.5),rgba(10,8,26,.92));border:1px solid var(--cardb);border-radius:12px;touch-action:manipulation">'
      + worldSVGInner() + dots + '</svg>'
      + '<div id="ghread" style="text-align:center;margin-top:10px;font-weight:700;min-height:22px">Tap any dot to take a heat reading.</div>';
    each('.ghdot', function(el){ el.addEventListener('click', function(){ ghTap(t, +el.getAttribute('data-i'), el); }); });
  }
  function ghHeat(d){
    if(d<1200)  return { t:'Boiling 🔥', c:'#EE5A44' };
    if(d<3000)  return { t:'Hot',        c:'#F6A544' };
    if(d<6000)  return { t:'Warm',       c:'#ECB550' };
    if(d<10000) return { t:'Cool',       c:'#46A56C' };
    return              { t:'Cold ❄️',   c:'#4a86e0' };
  }
  function ghTap(t, i, el){
    if(S.play.done || S.gh.done || el.getAttribute('data-hit')) return;
    var p=t.pins[i], d=haversine(p.ll[0],p.ll[1],S.gh.tgt[0],S.gh.tgt[1]);
    S.gh.guesses++;
    el.setAttribute('data-hit','1');
    if(d<1){   // this dot IS the hidden country
      S.gh.done=true; S.play.done=true; sfx('correct');
      el.setAttribute('r','5.5'); el.setAttribute('fill','#F6D488'); el.setAttribute('stroke','#fff'); el.setAttribute('stroke-width','1');
      var svg=$('ghmap'); if(svg) svg.insertAdjacentHTML('beforeend',
        '<circle cx="'+(p.ll[1]+180)+'" cy="'+(90-p.ll[0])+'" r="3" fill="none" stroke="#F6D488" stroke-width="1.2">'
        + '<animate attributeName="r" from="3" to="18" dur="0.7s"/><animate attributeName="opacity" from="1" to="0" dur="0.7s"/></circle>');
      var extra=Math.max(0, S.gh.guesses - S.gh.par);
      S.play.misses=Math.min(4, extra);
      var r=$('ghread'); if(r) r.innerHTML='<b>'+p.flag+' '+esc(p.name)+'</b> — found it in '+S.gh.guesses+' reading'+(S.gh.guesses>1?'s':'')+(S.play.misses?' · +'+S.play.misses+' miss'+(S.play.misses>1?'es':''):' · clean 🎯');
      showMiss();
      setTimeout(function(){ finishTask(); }, 950);
      return;
    }
    var h=ghHeat(d), trend=(d<S.gh.best-50)?'warmer ↑':(d>S.gh.best+50?'colder ↓':'—');
    if(d<S.gh.best) S.gh.best=d;
    el.setAttribute('fill', h.c); el.setAttribute('r','4.2');
    sfx('tap');
    var r=$('ghread'); if(r){ r.innerHTML='<b>'+p.flag+' '+esc(p.name)+'</b> · <span style="color:'+h.c+'">'+h.t+'</span> · '+trend; swapIn(r); }
  }

  /* ---------- minigame: The Dossier (Countryle-style deduction) ----------
     Crack a hidden country from a ladder of clues. Start with one clue and
     reveal more on demand; accuse a suspect at any time. Fewer clues + no wrong
     accusations = a faster, cleaner solve. Each wrong accusation is a miss and
     auto-reveals the next clue. */
  function mgDetective(t){
    S.dt={ shown:1, done:false };
    var sus=t.suspects.map(function(s,i){
      return '<button class="dtsus" data-i="'+i+'" style="display:flex;align-items:center;gap:8px;justify-content:center;padding:12px 8px;border:1px solid var(--cardb);border-radius:12px;background:var(--card2);color:var(--ink);font-weight:800;font-size:15px;cursor:pointer">'
        + '<span style="font-size:24px">'+s.flag+'</span><span>'+esc(s.name)+'</span></button>';
    }).join('');
    $('mg').innerHTML='<div class="prompt" style="text-align:center">'+esc(t.q)+'</div>'
      + '<div id="dtfile" style="background:var(--card);border:1px dashed var(--cardb);border-radius:12px;padding:12px 14px;margin-bottom:12px">'
        + '<div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:8px">🕵 Dossier — Case File</div>'
        + '<div id="dtclues"></div></div>'
      + '<button class="btn ghost" id="dtmore" style="width:100%;margin-bottom:12px">Reveal another clue 🔍</button>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+sus+'</div>';
    each('.dtsus', function(b){ b.addEventListener('click', function(){ dtAccuse(t, +b.getAttribute('data-i'), b); }); });
    var more=$('dtmore'); if(more) more.addEventListener('click', function(){ dtReveal(t); });
    dtPaintClues(t);
  }
  function dtPaintClues(t){
    var box=$('dtclues'); if(!box) return;
    box.innerHTML=t.clues.slice(0, S.dt.shown).map(function(cl,i){
      return '<div class="dtclue" style="padding:5px 0;border-top:'+(i?'1px solid var(--cardb)':'none')+'">📌 '+esc(cl)+'</div>';
    }).join('');
    var last=box.lastElementChild; if(last) swapIn(last);
    var more=$('dtmore');
    if(more && S.dt.shown>=t.clues.length){ more.disabled=true; more.textContent='All clues revealed'; more.style.opacity='.5'; }
  }
  function dtReveal(t){
    if(S.dt.done || S.dt.shown>=t.clues.length) return;
    S.dt.shown++; sfx('tap'); dtPaintClues(t);
  }
  function dtAccuse(t, i, btn){
    if(S.play.done || S.dt.done || btn.getAttribute('data-out')) return;
    var ok = (t.suspects[i].name===t.answer);
    if(ok){
      S.dt.done=true; S.play.done=true; sfx('correct');
      btn.style.borderColor='var(--ok)'; btn.style.background='rgba(63,206,134,.18)';
      popIn(btn);
      setTimeout(function(){ finishTask(); }, 650);
    } else {
      S.play.misses++; showMiss();
      btn.setAttribute('data-out','1'); btn.style.borderColor='var(--bad)'; btn.style.opacity='.4';
      if(S.dt.shown<t.clues.length){ S.dt.shown++; dtPaintClues(t); }
      else flash($('dtfile'));
    }
  }

  /* ---------- minigame: Street Scout (Mapillary street imagery) ----------
     "Drop into a real street somewhere near the country, look around, then pin
     where in the world you are." DISABLED unless MAPILLARY_TOKEN is set, and
     fully FAIL-OPEN: any hiccup (no token, SDK/tiles blocked, no imagery nearby)
     silently falls back to the plain map pin-drop so a race can never break. */
  function streetEnabled(){ return STREET_LIVE && typeof MAPILLARY_TOKEN==='string' && MAPILLARY_TOKEN.length>10; }
  var _mly=0; // 0 unloaded · 1 loading · 2 ready · 3 failed
  function loadMapillary(cb){
    if(_mly===2) return cb(true,'cached');
    if(_mly===3) return cb(false,'previously failed to load');
    var done=false; function fin(ok,why){ if(done) return; done=true; _mly=ok?2:3; cb(ok,why); }
    try{
      var css=document.createElement('link'); css.rel='stylesheet';
      css.href='https://cdn.jsdelivr.net/npm/mapillary-js@4.1.2/dist/mapillary.css'; document.head.appendChild(css);
      var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/mapillary-js@4.1.2/dist/mapillary.js';
      s.onload=function(){ var ok=!!(window.mapillary&&window.mapillary.Viewer); fin(ok, ok?'loaded':'loaded but window.mapillary.Viewer missing'); };
      s.onerror=function(){ fin(false,'script failed to load (CDN blocked?)'); };
      _mly=1; document.head.appendChild(s);
      setTimeout(function(){ fin(false,'timed out loading SDK'); }, 5000);
    }catch(e){ fin(false,'exception: '+(e&&e.message)); }
  }
  function mapillaryNearby(ll, cb){
    var d=0.4, bbox=[ll[1]-d, ll[0]-d, ll[1]+d, ll[0]+d].join(',');
    var url='https://graph.mapillary.com/images?access_token='+encodeURIComponent(MAPILLARY_TOKEN)
      +'&bbox='+bbox+'&limit=20&fields=id,computed_geometry,geometry';
    var done=false; function fin(v,err){ if(done) return; done=true; cb(v,err); }
    setTimeout(function(){ fin(null,'imagery request timed out'); }, 6000);
    try{
      fetch(url).then(function(r){ if(!r.ok) { fin(null,'API HTTP '+r.status); return null; } return r.json(); }).then(function(j){
        if(!j) return;
        var arr=(j&&j.data)||[]; if(!arr.length) return fin(null,'0 images within bbox of '+ll[0]+','+ll[1]);
        var im=arr[Math.floor(Math.random()*arr.length)];
        var g=(im.computed_geometry&&im.computed_geometry.coordinates)||(im.geometry&&im.geometry.coordinates);   // [lng,lat]
        fin({ id:im.id, ll:[ g?g[1]:ll[0], g?g[0]:ll[1] ] });
      }).catch(function(e){ fin(null,'fetch error: '+(e&&e.message)); });
    }catch(e){ fin(null,'exception: '+(e&&e.message)); }
  }
  function mgStreetScout(t){
    var dbg = !!FORCE_STREET_FIRST;   // verbose diagnostics only while force-testing
    $('mg').innerHTML='<div class="prompt" style="text-align:center">🛰️ Finding a street to scout…</div>'
      + (dbg?'<div id="sslog" class="ohint" style="white-space:pre-line;text-align:left;font-family:monospace;font-size:11px"></div>':'')
      + '<button class="btn ghost sm" id="ssskip" style="width:auto;margin:12px auto 0;display:block">Skip to the map ›</button>';
    if($('ssskip')) $('ssskip').onclick=function(){ if(!S.play.done){ ssKill(); mgMapFind(t); } };
    function log(m){ var e=$('sslog'); if(e) e.textContent=(e.textContent?e.textContent+'\n':'')+m; }
    function fail(m){ log('⚠️ '+m); if(!dbg){ ssKill(); mgMapFind(t); } else { log('→ tap "Skip to the map" to continue.'); } }
    log('1) loading Mapillary viewer…');
    loadMapillary(function(ok,why){
      log('   '+(ok?'✓ ':'✗ ')+why);
      if(!ok) return fail('viewer SDK unavailable');
      log('2) searching imagery near '+t.name+'…');
      mapillaryNearby(t.ll, function(loc,err){
        if(!loc) return fail(err||'no imagery');
        log('   ✓ found image '+String(loc.id).slice(0,10)+'…');
        $('mg').innerHTML='<div class="prompt" style="text-align:center;font-size:15px">Look around this street — then pin where in the world you are.</div>'
          + '<div id="pano" style="width:100%;height:250px;border-radius:12px;overflow:hidden;border:1px solid var(--cardb);background:#000"></div>'
          + '<div style="text-align:center;font-size:10.5px;color:var(--mut);margin-top:5px">Street imagery © <a href="https://www.mapillary.com" target="_blank" rel="noopener" style="color:var(--mut)">Mapillary</a> contributors, CC BY-SA</div>'
          + '<button class="btn globe" id="ssguess" style="margin-top:10px">📍 Make my guess ›</button>';
        try{
          S.ssViewer=new window.mapillary.Viewer({ accessToken:MAPILLARY_TOKEN, container:'pano', imageId:loc.id });
        }catch(e){ ssKill(); return mgMapFind(t); }
        $('ssguess').onclick=function(){ ssKill(); runMapGuess('Where in the world was that street? Tap the map.', loc.ll); };
      });
    });
  }
  function ssKill(){ try{ if(S.ssViewer&&S.ssViewer.remove) S.ssViewer.remove(); }catch(e){} S.ssViewer=null; }

  /* -------------------------------------------------- Skip Pass (field median) */
  function useSkipPass(){
    S.skipUsed=true;
    var ghosts = simulateGhosts();       // pace the field first
    var med = median(ghosts.map(function(x){ return x.eff; }));
    resolveRound(med, 0, true, ghosts);  // player checks in at the median
  }

  /* --------------------------------------------------------- round resolve */
  // GDD §4/§8: player's effective time is real; the AI ghost field is paced by
  // per-team skill and this stage's task kind, with fresh per-stage noise. As
  // weaker ghosts are Grounded, the surviving field is naturally faster — the
  // difficulty ramps without a hand-tuned curve.
  function simulateGhosts(){
    var kind = (S.chosen&&taskKind(S.chosen)) || 'mcq';
    var base = BASE[kind] || 8;
    var pen  = PENALTY[(S.chosen&&S.chosen.cat) || 'trivia'];
    return aliveTeams().filter(function(t){ return t.isGhost; }).map(function(t){
      var misses = (Math.random() < clampP(t.skill)) ? 1 : 0;
      if(Math.random() < clampP(t.skill)*0.4) misses++;
      // challenge time + the City Run to the Checkpoint (every team runs it)
      var eff = base * t.skill * rnd(0.9,1.12) + misses*pen + RUN_BASE * t.skill * rnd(0.85,1.15);
      return { team:t, eff:eff };
    });
  }
  function clampP(skill){ var p=(skill-0.8)*0.45; return Math.max(0, Math.min(0.55, p)); }

  function resolveRound(playerRaw, playerMisses, skipped, preGhosts){
    // Amazing-Race beat: after the challenge you still have to SPRINT THE CITY to
    // the Checkpoint mat, and that run counts. Intercept the first resolve, play
    // the City Run, then come back through here with the combined time.
    if(!skipped && !S._runDone){
      S._runPend={ raw:playerRaw, misses:playerMisses, ghosts:preGhosts||null };
      stopTimer(); S.phase='run'; renderStage(); return;
    }
    var act = S._runPend ? S._runPend.raw : playerRaw;      // challenge-only time
    var runT = Math.max(0, playerRaw - act);                 // city-run time
    S._runDone=false; S._runPend=null;
    if(onlineActive()){ return duoSubmit(playerRaw, playerMisses, act, runT); }   // two-devices duo: post my time, combine on the leaderboard
    var pen = PENALTY[(S.chosen&&S.chosen.cat) || 'trivia'];
    var playerEff = skipped ? playerRaw : (playerRaw + playerMisses*pen);
    S.lastResult = { raw:playerRaw, act:act, runT:runT, misses:playerMisses, eff:playerEff, skipped:!!skipped, pen:pen };

    var ghosts = preGhosts || simulateGhosts();
    // stamp this round's effective time onto every alive team
    S.teams.forEach(function(t){ if(t.alive) t.eff = t.isGhost ? null : playerEff; });
    ghosts.forEach(function(g){ g.team.eff = g.eff; });

    // retention metrics (badges)
    var st=statsDefault(); st.stagesPlayed++;
    if(!skipped){
      // fastest-stage only counts FLAWLESS real wall-clock games; reaction/sequence
      // report synthetic time, and mapfind is distance-scored (a deliberately wrong
      // pin is fast) — requiring 0 misses closes that Speed-Demon badge exploit.
      // Uses the CHALLENGE time only (the City Run is a separate skill).
      var k=taskKind(S.chosen||{});
      if(playerMisses===0 && k!=='reaction' && k!=='sequence' && k!=='mapfind'
         && (!st.fastestStage || act<st.fastestStage)) st.fastestStage=act;
      if(playerMisses===0) st.perfectStages++;
    }
    saveStats(st);

    S.phase='checkpoint';
    renderStage();
  }

  /* =====================================================================
     CITY RUN — the Amazing-Race finish. After the challenge you touch down
     in a CARTOON VERSION OF THE CITY (procedurally drawn + seeded per
     country, so every city always has its own skyline, in its region's
     palette) and sprint to the Checkpoint. Mash-tap to run; at the plaza,
     FIND the mat flying the destination's flag among three landmark gates
     and tap it — wrong mat costs +2.5s. The whole run counts toward your
     effective time; the ghost field runs it too (RUN_BASE pacing).
     ===================================================================== */
  var RUN_BASE = 6;   // expected seconds for an average team's City Run
  var CITY_PAL = {
    'Europe':        { sky:['#2b2f63','#7a5a8f'], back:'#3a3160', front:['#8a5d52','#a97456','#6e5d8e'], roof:'#5b3d4f', win:'#ffd98a' },
    'Asia':          { sky:['#1f2a5c','#c96a6a'], back:'#35284f', front:['#7a4b56','#9c6249','#585085'], roof:'#43304f', win:'#ffe08d' },
    'Africa':        { sky:['#3a2a52','#c98a4b'], back:'#4a3350', front:['#a06a44','#b98955','#7d5a4a'], roof:'#5d4038', win:'#ffe6a1' },
    'North America': { sky:['#1c2350','#5a5f9e'], back:'#2c2f5c', front:['#4e5678','#5f6b91','#3f4a70'], roof:'#333a5c', win:'#cfe4ff' },
    'South America': { sky:['#28224f','#b0648a'], back:'#3c2d55', front:['#8f5a63','#a5714f','#645a8a'], roof:'#4d3a55', win:'#ffd98a' },
    'Oceania':       { sky:['#1d2d55','#4a7d9e'], back:'#2e3a5e', front:['#54688a','#6b7a95','#47597d'], roof:'#3a4a66', win:'#d8ecff' }
  };
  var CITY_LM = {
    'Europe':['🏰','🗼','⛪'], 'Asia':['🏯','⛩️','🕌'], 'Africa':['🕌','🗿','🏛️'],
    'North America':['🗽','🌉','🎡'], 'South America':['🗿','⛪','🏟️'], 'Oceania':['🌉','🎡','🏟️']
  };
  function cityHash(s){ s=String(s||'X'); var h=9; for(var i=0;i<s.length;i++) h=Math.imul(h^s.charCodeAt(i),387420489)>>>0; return h||7; }

  function viewRun(){
    var pend=S._runPend||{ raw:0, misses:0 };
    var cc=S.dest&&S.dest.country;
    var region=String((S.dest&&S.dest.region)||'Europe').split('/')[0];
    var pal=CITY_PAL[region]||CITY_PAL['Europe'];
    var rng=_mulberry32(cityHash((cc&&cc.id)||(S.dest&&S.dest.name)));
    // decoy flags for the two wrong mats (seeded; never the destination's)
    var pool=COUNTRIES.filter(function(x){ return !cc||x.id!==cc.id; });
    var d1=pool[Math.floor(rng()*pool.length)], d2=pool[Math.floor(rng()*pool.length)];
    if(d2===d1) d2=pool[(pool.indexOf(d1)+7)%pool.length];
    var okIdx=Math.floor(rng()*3);
    var flags=[]; flags[okIdx]=S.dest.flag;
    var dec=[d1.flag,d2.flag], di=0;
    for(var i2=0;i2<3;i2++){ if(flags[i2]==null) flags[i2]=dec[di++]; }
    var lms=(CITY_LM[region]||CITY_LM['Europe']).slice();
    for(var s1=lms.length-1;s1>0;s1--){ var j1=Math.floor(rng()*(s1+1)); var tv=lms[s1]; lms[s1]=lms[j1]; lms[j1]=tv; }

    // ---- draw the cartoon skyline (SVG world, 800×230) ----
    var W=800, H=230, GY=192, sb=[];
    sb.push('<defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+pal.sky[0]+'"/><stop offset="1" stop-color="'+pal.sky[1]+'"/></linearGradient></defs>');
    sb.push('<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="url(#skyg)"/>');
    sb.push('<text x="'+Math.round(60+rng()*640)+'" y="'+Math.round(34+rng()*18)+'" font-size="20" opacity=".92">'+(rng()<0.5?'☀️':'🌙')+'</text>');
    for(var cl2=0;cl2<3;cl2++) sb.push('<text x="'+Math.round(rng()*710)+'" y="'+Math.round(24+rng()*36)+'" font-size="'+Math.round(13+rng()*8)+'" opacity=".5">☁️</text>');
    for(var bx=0;bx<W;){ var bw=34+rng()*44, bh=52+rng()*86;
      sb.push('<rect x="'+bx.toFixed(1)+'" y="'+(GY-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+pal.back+'"/>'); bx+=bw+2+rng()*10; }
    for(var fx=4;fx<560;){ var fw=44+rng()*46, fh=46+rng()*78, col=pal.front[Math.floor(rng()*pal.front.length)];   // keep the checkpoint plaza clear
      sb.push('<rect x="'+fx.toFixed(1)+'" y="'+(GY-fh).toFixed(1)+'" width="'+fw.toFixed(1)+'" height="'+fh.toFixed(1)+'" rx="2" fill="'+col+'"/>');
      sb.push('<rect x="'+fx.toFixed(1)+'" y="'+(GY-fh).toFixed(1)+'" width="'+fw.toFixed(1)+'" height="6" fill="'+pal.roof+'"/>');
      for(var wy=GY-fh+13; wy<GY-12; wy+=15){ for(var wx=fx+7; wx<fx+fw-9; wx+=13){ if(rng()<0.6) sb.push('<rect x="'+wx.toFixed(1)+'" y="'+wy.toFixed(1)+'" width="6" height="8" rx="1" fill="'+pal.win+'" opacity=".9"/>'); } }
      fx+=fw+6+rng()*16;
    }
    sb.push('<rect x="0" y="'+GY+'" width="'+W+'" height="'+(H-GY)+'" fill="#171230"/>');
    sb.push('<rect x="0" y="'+GY+'" width="'+W+'" height="3" fill="rgba(255,255,255,.14)"/>');
    for(var rx=8;rx<W;rx+=34) sb.push('<rect x="'+rx+'" y="'+(GY+18)+'" width="16" height="2.5" rx="1" fill="rgba(255,255,255,.22)"/>');
    // checkpoint plaza: three landmark gates, each with a flag + mat
    var GX=[648,716,784];
    for(var gi=0;gi<3;gi++){
      var gx=GX[gi];
      sb.push('<g class="gate" data-gi="'+gi+'" data-ok="'+(gi===okIdx?1:0)+'" style="pointer-events:all;cursor:pointer">'
        +'<text x="'+gx+'" y="'+(GY-10)+'" font-size="30" text-anchor="middle">'+lms[gi]+'</text>'
        +'<line x1="'+(gx-22)+'" y1="'+GY+'" x2="'+(gx-22)+'" y2="'+(GY-48)+'" stroke="#c9b998" stroke-width="2"/>'
        +'<text x="'+(gx-12)+'" y="'+(GY-38)+'" font-size="14" text-anchor="middle">'+flags[gi]+'</text>'
        +'<rect class="matp" x="'+(gx-19)+'" y="'+(GY+5)+'" width="42" height="10" rx="2" fill="#E24632" opacity=".6"/>'
        +'<rect x="'+(gx-19)+'" y="'+(GY+8)+'" width="42" height="3.5" fill="#F6D488" opacity=".85"/>'
        +'</g>');
    }
    sb.push('<text id="rnr" font-size="21" text-anchor="middle">🏃</text>');

    var cap=(cc&&cc.capital)||(S.dest&&S.dest.name)||'';
    app.innerHTML = topbar() + hud()
      + '<div class="card">'
        + '<div class="stagetype">🏁 Run to the Checkpoint — '+esc(S.dest?S.dest.name:'')+'</div>'
        + '<div id="runscene" data-state="intro">'
          + '<svg id="citysvg" viewBox="360 0 440 '+H+'" preserveAspectRatio="xMidYMid slice" style="display:block;width:100%;height:auto;aspect-ratio:440/230">'+sb.join('')+'</svg>'
          + '<div class="runbanner">📍 '+esc(String(cap).toUpperCase())+'</div>'
          + '<div class="runtmr" id="rtmr"></div>'
          + '<div class="runhint" id="rhint">Touching down…</div>'
        + '</div>'
        + '<div class="ohint" style="margin-top:10px">Tap fast to sprint. The Checkpoint mat flies '+(S.dest?S.dest.flag:'🚩')+' — wrong mat +2.5s.</div>'
      + '</div>' + foot();

    // ---- run loop ----
    var svg=$('citysvg'), scene=$('runscene'), rnr=document.getElementById('rnr');
    var st={ state:'intro', x:26, v:0, pen:0, t0:performance.now(), last:performance.now(), done:false };
    var PLAZA=612, VIEW=440;
    function setVB(cx){ svg.setAttribute('viewBox', cx.toFixed(1)+' 0 '+VIEW+' '+H); }
    function paintRunner(){
      var bob=(st.v>10)?Math.abs(Math.sin(performance.now()/70))*4:0;
      rnr.setAttribute('transform','translate('+st.x.toFixed(1)+','+(GY-2-bob).toFixed(1)+') scale(-1,1)');
      rnr.setAttribute('x',0); rnr.setAttribute('y',0);
    }
    paintRunner();
    var tmrIv=setInterval(function(){ var e=$('rtmr'); if(!e){ clearInterval(tmrIv); return; }
      var run=(st.state==='intro')?0:Math.max(0,(performance.now()-st.t0)/1000+st.pen);
      e.textContent='⏱ '+fmtTime(pend.raw+run)+'s'; },100);
    function beginRun(){
      if(st.done||!$('runscene')) return;
      st.state='run'; st.t0=performance.now(); st.last=performance.now();
      scene.setAttribute('data-state','run'); setVB(0);
      var h=$('rhint'); if(h) h.textContent='Tap fast to sprint →';
    }
    if(reduceMotion()) beginRun();
    else{
      // establishing shot: start on the checkpoint plaza (see the mats!), then a
      // quick cinematic pan back to your runner — and go.
      var it0=performance.now(), IDUR=950;
      (function introPan(){
        if(st.state!=='intro'||!$('citysvg')) return;
        var t=Math.min(1,(performance.now()-it0)/IDUR);
        var e2=1-Math.pow(1-t,3);
        setVB((W-VIEW)*(1-e2));
        if(t>=1){ beginRun(); return; }
        requestAnimationFrame(introPan);
      })();
    }
    fastTap(scene, function(){ if(st.state!=='run') return; st.v=Math.min(300, st.v+92); });
    each('#runscene .gate', function(g){
      g.addEventListener('click', function(ev){ if(ev.stopPropagation) ev.stopPropagation(); gateTap(g); });
    });
    function gateTap(g){
      if(st.state!=='pick'||st.done) return;
      if(g.getAttribute('data-ok')==='1'){
        st.done=true; st.state='done'; scene.setAttribute('data-state','done');
        sfx('correct'); vibe(20);
        rnr.textContent='🙌'; st.x=GX[+g.getAttribute('data-gi')]; paintRunner();
        var runT=Math.max(0,(performance.now()-st.t0)/1000+st.pen);
        clearInterval(tmrIv);
        setTimeout(function(){ finishRunPhase(runT); }, 430);
      } else {
        st.pen+=2.5; sfx('wrong'); vibe([16,40,16]); retrig(scene,'runshake');
        var h=$('rhint'); if(h) h.innerHTML='Wrong mat! +2.5s — find '+(S.dest?S.dest.flag:'the flag');
      }
    }
    (function loop(){
      if(st.done||!$('runscene')||S.phase!=='run') return;
      var now=performance.now(), dt=Math.min(0.05,(now-st.last)/1000); st.last=now;
      if(st.state==='run'){
        st.x+=st.v*dt; st.v*=Math.pow(0.14,dt);
        if(st.x>=PLAZA){
          st.x=PLAZA; st.v=0; st.state='pick'; scene.setAttribute('data-state','pick');
          each('#runscene .gate',function(g){ g.classList.add('pick'); });
          var h=$('rhint'); if(h) h.innerHTML='You\'re here! Tap the mat flying '+(S.dest?S.dest.flag:'the flag');
        }
        setVB(Math.max(0,Math.min(W-VIEW, st.x-130)));
        paintRunner();
      } else if(st.state==='pick'){ setVB(W-VIEW); paintRunner(); }
      requestAnimationFrame(loop);
    })();
    renderAcct();
  }
  function finishRunPhase(runT){
    S._runDone=true;
    var p=S._runPend||{ raw:0, misses:0, ghosts:null };
    resolveRound(p.raw+Math.max(0,runT), p.misses, false, p.ghosts);
  }

  /* --- phase: checkpoint (lock the time) --- */
  function viewCheckpoint(){
    if(S._cpSfx!==S.round){ S._cpSfx=S.round; sfx('checkpoint'); }   // one sting per stage, not per re-render
    var r=S.lastResult;
    var body;
    if(r.skipped){
      body = '<p class="lede" style="text-align:center">⏩ <b>Skip Pass used.</b> You checked in at the field\'s median time.</p>';
    } else {
      body = '<div class="breakdown"><span>Challenge <b>'+fmtTime(r.act!=null?r.act:r.raw)+'s</b></span>'
        + (r.runT?'<span>City Run <b>'+fmtTime(r.runT)+'s</b></span>':'')
        + '<span>Misses <b>'+r.misses+'</b> (+'+(r.misses*r.pen)+'s)</span></div>';
    }
    app.innerHTML = topbar() + hud()
      + '<div class="card center">'
        + '<h3 style="font-size:15px;letter-spacing:.1em;color:var(--teal)">✅ Checkpoint</h3>'
        + '<div class="bigtime" style="margin-top:8px">'+fmtTime(r.eff)+'<span class="u">s</span></div>'
        + '<div class="muted" style="font-size:12px;margin-top:4px">your effective time</div>'
        + body
        + '<button class="btn globe" id="lb" style="margin-top:16px">See the leaderboard ›</button>'
      + '</div>' + foot();
    $('lb').onclick=function(){
      if(onlineActive()) duoShowLeaderboard(); else { S.phase='leaderboard'; renderStage(); }
    };
    renderAcct();
  }

  /* --- phase: leaderboard + grounding --- */
  function viewLeaderboard(){
    var ranked = aliveTeams().slice().sort(function(a,b){ return a.eff-b.eff; });
    var final = isFinal();
    // determine who is Grounded this stage (slowest), or the winner on the Final
    var groundedTeam = ranked[ranked.length-1];
    var youRank = ranked.findIndex(function(t){ return t.id==='you'; }) + 1;

    var rowsHtml='';
    ranked.forEach(function(t,i){
      var out = (!final && t===groundedTeam);
      var win = (final && i===0);
      var cls='lbrow'+(t.id==='you'?' you':'')+(out?' out':'')+(win?' win':'');
      var place = win?'🏆':(i+1);
      rowsHtml += '<div class="'+cls+'">'
        + '<span class="p">'+place+'</span>'
        + '<span class="nm">'+esc(t.name)+''+'</span>'
        + '<span class="tm">'+fmtTime(t.eff)+'s'+(out?' · Grounded':'')+'</span></div>';
    });

    var banner;
    if(final){
      var youWon = ranked[0].id==='you';
      banner = youWon
        ? '<div class="banner win"><h2>🏆 You win RunTheGlobe!</h2><p>First across the finish at '+esc(S.dest.landmark||S.dest.name)+'. The whole race is yours.</p></div>'
        : '<div class="banner grounded"><h2>So close.</h2><p>You finished #'+youRank+' in the Final at '+esc(S.dest.name)+'. '+esc(ranked[0].name)+' took the race.</p></div>';
    } else if(groundedTeam.id==='you'){
      banner = '<div class="banner grounded"><h2>✈️ You\'ve been Grounded</h2><p>Slowest at '+esc(S.dest.name)+' this Stage. Your race ends here.</p></div>';
    } else {
      banner = '<div class="banner safe"><h2>You advance ›</h2><p>#'+youRank+' of '+ranked.length+' at '+esc(S.dest.name)+'. '+esc(groundedTeam.name)+' is Grounded.</p></div>';
    }

    app.innerHTML = topbar() + hud()
      + '<div class="card">'
        + banner
        + '<div class="lb">'+rowsHtml+'</div>'
        + '<div id="lbbtns"></div>'
      + '</div>' + foot();

    var btns=$('lbbtns');
    if(final){
      var youWon2 = ranked[0].id==='you';
      sfx(youWon2?'win':'lose');
      recordRaceEnd(ranked);
      btns.innerHTML='<div class="btnrow"><button class="btn ghost" id="home">Home</button><button class="btn ghost" id="share">📋 Share</button><button class="btn globe" id="again">Race again 🌍</button></div>';
      $('home').onclick=function(){ S.screen='home'; render(); };
      $('again').onclick=function(){ S.screen='setup'; render(); };
      $('share').onclick=function(){
        shareResult(youWon2
          ? ('🌍 I just WON RunTheGlobe — first across the finish at '+(S.dest.landmark||S.dest.name)+', beating '+(FIELD_SIZE-1)+' teams! Play at runthe.gg/globe')
          : ('🌍 I finished #'+youRank+' of '+FIELD_SIZE+' in RunTheGlobe\'s Final at '+S.dest.name+'. Can you do better? runthe.gg/globe'));
      };
    } else if(groundedTeam.id==='you'){
      sfx('lose');
      recordRaceEnd(ranked);   // record now (idempotent) so an abandon still counts
      // GDD §10: binary Grounded choice — watch live, or return home. No reward for watching.
      btns.innerHTML='<div class="btnrow"><button class="btn ghost" id="home">Home</button><button class="btn globe" id="watch">Watch the rest ▶</button></div>';
      $('home').onclick=function(){ S.screen='home'; render(); };
      $('watch').onclick=function(){ S.phase='grounded'; S.spectating=true; groundAndAdvance(groundedTeam); render(); };
    } else {
      btns.innerHTML='<button class="btn globe" id="next" style="margin-top:14px">Next Stage ›</button>';
      $('next').onclick=function(){ groundAndAdvance(groundedTeam); S.round++; drawStage(); };
    }
    renderAcct();
  }

  function groundAndAdvance(team){ team.alive=false; team.grounded=true; }

  /* --- phase: spectate (player Grounded, watching the field finish) --- */
  function viewGrounded(){
    // auto-simulate the remaining stages among the ghost field, quick summary.
    while(S.round < ROUNDS && aliveTeams().length > 3){
      S.round++;
      simSpectatorStage();
    }
    // Final among the last 3
    S.round = ROUNDS;
    var last3 = aliveTeams().slice();
    // pace a final and rank
    var kind='mcq', base=BASE.mcq;
    var res = last3.map(function(t){ return { team:t, eff: (base+RUN_BASE)*t.skill*rnd(0.9,1.12) }; });
    res.sort(function(a,b){ return a.eff-b.eff; });

    var rows='';
    res.forEach(function(x,i){
      rows+='<div class="lbrow'+(i===0?' win':'')+'"><span class="p">'+(i===0?'🏆':(i+1))+'</span>'
        + '<span class="nm">'+esc(x.team.name)+'</span>'
        + '<span class="tm">'+fmtTime(x.eff)+'s</span></div>';
    });
    app.innerHTML = topbar()
      + '<div class="card">'
        + '<div class="banner"><h2 style="color:var(--globe)">🏁 The Final · '+esc(S.finishLine.city)+'</h2>'
        + '<p>You were Grounded, but here\'s how the race finished at '+esc(S.finishLine.landmark)+'.</p></div>'
        + '<div class="lb">'+rows+'</div>'
        + '<div class="btnrow"><button class="btn ghost" id="home">Home</button><button class="btn globe" id="again">Race again 🌍</button></div>'
      + '</div>' + foot();
    $('home').onclick=function(){ S.screen='home'; render(); };
    $('again').onclick=function(){ S.screen='setup'; render(); };
    renderAcct();
  }
  function simSpectatorStage(){
    var ghosts=aliveTeams().filter(function(t){return t.isGhost;});
    var base=BASE.mcq;
    var res=ghosts.map(function(t){ return {team:t, eff: (base+RUN_BASE)*t.skill*rnd(0.9,1.12)}; });
    res.sort(function(a,b){ return a.eff-b.eff; });
    var slow=res[res.length-1]; if(slow) slow.team.alive=false;
  }

  /* --------------------------------------------------------- record a race */
  function recordRaceEnd(ranked){
    if(S._recorded) return; S._recorded=true;
    var st=statsDefault();
    var before=badgeTiers(st);
    st.races++;
    var youRank = ranked.findIndex(function(t){ return t.id==='you'; }) + 1;
    var won = isFinal() && ranked[0] && ranked[0].id==='you';
    // finishing place: on the Final it's the rank; if Grounded mid-race it's the
    // number still in the race at that stage (the player was slowest of them).
    var place = isFinal() ? youRank : aliveTeams().length;
    if(!st.bestPlace || place<st.bestPlace) st.bestPlace=place;
    if(won) st.wins++;
    if(isFinal() && youRank<=3) st.top3++;
    if(won){ st.winStreak=(st.winStreak||0)+1; if(st.winStreak>st.longestStreak) st.longestStreak=st.winStreak; }
    else { st.winStreak=0; }
    saveStats(st);
    announceNewBadges(before);
  }
  // reset the per-race guard whenever a new race starts
  var _startRace = startRace;
  startRace = function(){ S._recorded=false; _startRace(); };

  /* ======================================================================
     TWO-DEVICES DUO (Beta) — host-less, deterministic — GDD §3/§6-9
     Two players pair into ONE team via a short code. The duo shares a SEED, so
     BOTH devices run the exact same race locally: identical country order,
     finish line, AI opponent field and eliminations. There is no "host of the
     game" and the field always finishes, because every device computes the same
     outcome. Each Stage BOTH partners play — and they're forced onto DIFFERENT
     challenges (one each of the two Split-Path options), so they can't both grab
     the fast one. The team's Stage time is the two partners' effective times
     ADDED together. Each device posts its own time; realtime pushes the
     partner's. Refresh-safe: the pairing is stored and the whole race is rebuilt
     from the seed + posted times. Requires supabase/43_globe_duo.sql.
     ====================================================================== */
  function onlineActive(){ return !!(S.online && S.online.active); }
  function finishById(id){ for(var i=0;i<FINISH.length;i++){ if(FINISH[i].id===id) return FINISH[i]; } return null; }
  function toast(msg){
    var t=document.createElement('div'); t.textContent=msg;
    t.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;'
      +'background:#1c1740;border:1px solid var(--cardb);color:var(--ink);font-weight:700;font-size:13px;'
      +'padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.7);max-width:90%;text-align:center;'
      +'animation:rtgToast .28s cubic-bezier(.22,.9,.32,1);transition:opacity .35s ease;';
    document.body.appendChild(t);
    setTimeout(function(){ t.style.opacity='0'; }, 2800);
    setTimeout(function(){ t.remove(); }, 3200);
  }
  function rpc(fn, args){ return sb.rpc(fn, args); }

  /* ---- duo entry: pair with a partner (the race is always "already there") ---- */
  function renderDuoMenu(){
