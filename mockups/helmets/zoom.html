<!doctype html>
<!-- A dozen helmets, large, for judging the pixels rather than the page. Edit the list. -->
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Helmets, close up</title>
<body style="margin:0;background:#0b1220;padding:16px;display:flex;flex-wrap:wrap;gap:14px;
  font:11px system-ui;color:#9fb3c8">
<script src="helmet.js"></script><script src="kits.js"></script>
<script>
(async function () {
  const schools = await KITS.load('../../cfb/data/cfb_team_seasons.json');
  const want = ['Alabama','Michigan','Ohio State','Notre Dame','Texas','Oregon','Georgia',
    'Penn State','LSU','Clemson','Miami','Nebraska'];
  for (const name of want) {
    const k = schools.find((x) => x.name === name);
    if (!k) continue;
    const d = document.createElement('div');
    const c = document.createElement('canvas');
    PixelHelmet.render(c, k, 6);
    c.style.imageRendering = 'pixelated';
    d.appendChild(c);
    d.insertAdjacentHTML('beforeend', '<div>' + k.name + '</div>');
    document.body.appendChild(d);
  }
})();
</script>
