<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Internal build asset (renders the 1200x630 share image). Never a reader-facing page,
     so keep it out of search and out of any AdSense crawl. -->
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* 1200x630, the size every platform crops a share preview from.
     The game's own language: the dark card stock, the orange the doors wear, Anton on
     the wordmark because that is what the front page sets its headings in, and the five
     slots in the position colours the draft board paints its pills with. No Graduate
     here: the collegiate face belongs to the college game and would say the wrong sport.

     THE FLOOR, NOT A FIELD. The other two cards draw yard lines because their games are
     played on one. This one draws the boards of a hardwood floor and the arc of a three
     point line, which is the same restructure the game's own court went through: a flat
     brown rectangle with four white outlines is a DIAGRAM of a court, and a floor is
     what the sport is played on. */
  *{margin:0;padding:0;box-sizing:border-box}
  /* THE CARD IS THE LOGO'S OWN SCREEN: the navy tile, the scanlines, the pixel ball with
     its hard one cell shadow, and the name set the way the lockup sets it. The ball is
     hoops/logo.png at exactly half size, so each of its 22 pixel cells lands on 11 and
     none falls between two. The paragraph and the eyebrow stay in Archivo, because the
     pixel face is for the name and a paragraph set in it is hard to read in a feed. */
  body{width:1200px;height:630px;overflow:hidden;background:#10131f;color:#eef2f9;
    font-family:'Archivo',system-ui,sans-serif;position:relative;
    background-image:
      radial-gradient(760px 480px at 82% 30%, rgba(240,120,45,.16), transparent 70%),
      radial-gradient(720px 460px at 0% 110%, rgba(58,68,102,.35), transparent 70%);}
  .scan{position:absolute;inset:0;z-index:5;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px)}
  .wrap{position:relative;height:100%;display:flex;flex-direction:column;
    justify-content:center;padding:0 74px 40px}
  .eyebrow{font-weight:800;font-size:22px;letter-spacing:.2em;text-transform:uppercase;
    color:#94a3b8;margin-bottom:26px}
  .eyebrow b{color:#ffae3d}
  h1{font-family:'Press Start 2P',Anton,sans-serif;font-weight:400;text-transform:uppercase;line-height:1}
  h1 span{display:block}
  h1 .one{font-size:40px;color:#e8edf7;text-shadow:4px 4px 0 #3a4466}
  h1 .two{font-size:80px;color:#ffae3d;margin-top:14px;
    text-shadow:0 6px 0 #e8632a,0 12px 0 #a8341f,8px 18px 0 #05060b}
  p{font-size:27px;line-height:1.34;color:#cbd5e1;margin-top:36px;max-width:700px}
  p b{color:#eef2f9;font-weight:700}
  /* The five spots, in the draft board's own position colours, as pixel buttons. */
  .slots{display:flex;gap:12px;margin-top:30px}
  .slot{font-family:'Press Start 2P',sans-serif;font-size:16px;padding:14px 16px;color:#fff;
    box-shadow:4px 4px 0 #05060b;border:3px solid rgba(0,0,0,.35)}
  .pg{background:#3b82f6}.sg{background:#0891b2}.sf{background:#16a34a}.pf{background:#d97706}.c{background:#dc2626}
  .url{position:absolute;right:74px;bottom:50px;text-align:right;
    font-family:'Press Start 2P',sans-serif;font-size:16px;color:#64748b}
  .url b{color:#e8edf7;font-weight:400}
  .url b i{color:#ffae3d;font-style:normal}
  .ball{position:absolute;right:92px;top:74px;width:256px;height:256px;image-rendering:pixelated}
</style></head>
<body>
  <div class="wrap">
    <img class="ball" src="logo.png" alt="">
    <div class="eyebrow">Free &middot; No download &middot; Five spins, <b>one season</b></div>
    <h1><span class="one">Run The</span><span class="two">Floor</span></h1>
    <p>Spin for a season and a club. Sign one player off each of five draws, under a
       <b>$120M cap</b>. Then play all 82 games and chase a ring.</p>
    <div class="slots">
      <span class="slot pg">PG</span><span class="slot sg">SG</span>
      <span class="slot sf">SF</span><span class="slot pf">PF</span>
      <span class="slot c">C</span>
    </div>
  </div>
  <div class="url"><b>RUNTHE<i>.GG</i></b>/HOOPS</div>
  <div class="scan"></div>
</body></html>
