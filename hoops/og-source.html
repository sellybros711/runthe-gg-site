<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Internal build asset (renders the 1200x630 share image). Never a reader-facing page,
     so keep it out of search and out of any AdSense crawl. -->
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* 1200x630, the size every platform crops a share preview from.
     The game's own language: the dark card stock, the orange the doors wear, Anton on
     the wordmark because that is what the front page sets its headings in, and the five
     slots in the position colours the draft board paints its pills with. No Graduate
     here: the collegiate face belongs to the college game and would say the wrong sport.

     THE FLOOR, NOT A FIELD. The other two cards draw yard lines because their games are
     played on one. This one draws the boards of a hardwood floor and the arc of a three
     point line, which is the same restructure the game's own court went through: a flat
     brown rectangle with four white outlines is a DIAGRAM of a court, and a floor is
     what the sport is played on. */
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#0d1117;color:#eef2f9;
    font-family:'Archivo',system-ui,sans-serif;position:relative;
    background-image:
      radial-gradient(880px 520px at 50% -14%, rgba(240,120,45,.20), transparent 70%),
      radial-gradient(720px 460px at 102% 112%, rgba(242,193,78,.14), transparent 70%);}
  /* The boards, running away from the reader the way a floor is laid, at a period that
     divides into nothing else on the card so the eye never finds the repeat. */
  .floor{position:absolute;inset:0;opacity:.5;
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 61px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.20) 0 2px, transparent 2px 217px);}
  /* The arc, bottom left, off the corner of the card: the one line that says basketball
     without drawing a whole half court nobody can read at thumbnail size. */
  .arc{position:absolute;left:-190px;bottom:-330px;width:660px;height:660px;
    border:3px solid rgba(255,255,255,.07);border-radius:50%;}
  .wrap{position:relative;height:100%;display:flex;flex-direction:column;
    justify-content:center;padding:0 74px 46px}
  .eyebrow{font-family:'Archivo',sans-serif;font-weight:800;font-size:22px;
    letter-spacing:.2em;text-transform:uppercase;color:#94a3b8;margin-bottom:16px}
  .eyebrow b{color:#f0782d}
  h1{font-family:'Anton',Impact,sans-serif;font-weight:400;
    text-transform:uppercase;font-size:118px;line-height:.86;letter-spacing:.008em}
  h1 span{display:block}
  h1 .two{background:linear-gradient(135deg,#f9a35f 0%,#c25916 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  p{font-size:28px;line-height:1.34;color:#cbd5e1;margin-top:24px;max-width:720px}
  p b{color:#eef2f9;font-weight:700}
  /* The five spots, in the draft board's own position colours. */
  .slots{display:flex;gap:11px;margin-top:32px}
  .slot{font-family:'Anton',sans-serif;font-weight:400;font-size:26px;
    letter-spacing:.1em;padding:12px 22px;border-radius:12px;color:#fff;
    box-shadow:0 10px 26px -10px rgba(0,0,0,.85)}
  .pg{background:linear-gradient(160deg,#3b82f6,rgba(0,0,0,.42))}
  .sg{background:linear-gradient(160deg,#06b6d4,rgba(0,0,0,.42))}
  .sf{background:linear-gradient(160deg,#22c55e,rgba(0,0,0,.42))}
  .pf{background:linear-gradient(160deg,#f59e0b,rgba(0,0,0,.42))}
  .c {background:linear-gradient(160deg,#ef4444,rgba(0,0,0,.42))}
  .url{position:absolute;right:74px;bottom:52px;text-align:right;
    font-family:'Anton',sans-serif;font-weight:400;font-size:30px;
    letter-spacing:.14em;color:#64748b}
  .url b{color:#eef2f9}
  .url b i{color:#f0782d;font-style:normal}
  /* The ball, top right, clear of the type. Drawn rather than an image file, because
     this game ships no logo and a card that waited on one would not exist. The seams
     are the two things a ball needs to read as one at thumbnail size: the vertical
     meridian and the two hooks off it. */
  .ball{position:absolute;right:86px;top:84px;width:208px;height:208px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%, #f2914a 0%, #e0722a 46%, #a8480f 100%);
    box-shadow:0 26px 60px -22px rgba(0,0,0,.9), inset 0 0 0 3px rgba(0,0,0,.22)}
  .ball i{position:absolute;display:block;border:3px solid rgba(0,0,0,.42)}
  .ball .v{left:50%;top:0;bottom:0;width:0;margin-left:-1.5px;border-width:0 0 0 3px}
  .ball .h{left:0;right:0;top:50%;height:0;margin-top:-1.5px;border-width:3px 0 0 0}
  .ball .l{left:-34%;top:0;bottom:0;width:100%;border-radius:50%;border-width:0 3px 0 0}
  .ball .r{right:-34%;top:0;bottom:0;width:100%;border-radius:50%;border-width:0 0 0 3px}
</style></head>
<body>
  <div class="floor"></div>
  <div class="arc"></div>
  <div class="wrap">
    <div class="ball"><i class="v"></i><i class="h"></i><i class="l"></i><i class="r"></i></div>
    <div class="eyebrow">Free &middot; No download &middot; Five spins, <b>one season</b></div>
    <h1><span>Run The</span><span class="two">Floor</span></h1>
    <p>Spin for a season and a club. Sign one player off each of five draws, under a
       <b>$120M cap</b>. Then play all 82 games and chase a ring.</p>
    <div class="slots">
      <span class="slot pg">PG</span><span class="slot sg">SG</span>
      <span class="slot sf">SF</span><span class="slot pf">PF</span>
      <span class="slot c">C</span>
    </div>
  </div>
  <div class="url"><b>RUNTHE<i>.GG</i></b>/HOOPS</div>
</body></html>
