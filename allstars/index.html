     plus the short segments behind the plate. The originals only ran
     down off the bottom of the screen, so the field had no fair
     territory drawn on it at all. */
  const grassTop = grassY + 10;
  const foulTo = (bx, by) => {
    const t = (grassTop - plateY) / (by - plateY);
    return [cx + (bx - cx) * t, grassTop];
  };
  const [flx, fly] = foulTo(cx - rx, midY);
  const [frx, fry] = foulTo(cx + rx, midY);
  ctx.strokeStyle = 'rgba(234,234,234,.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, plateY); ctx.lineTo(flx, fly);
  ctx.moveTo(cx, plateY); ctx.lineTo(frx, fry);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(234,234,234,.85)';
  ctx.beginPath();
  ctx.moveTo(cx, plateY);
  ctx.lineTo(cx - w, plateY + w);   /* down-left */
  ctx.moveTo(cx, plateY);
  ctx.lineTo(cx + w, plateY + w);   /* down-right */
  ctx.stroke();
  /* No foul poles: with the wide camera both corners sit off frame, so
     the chalk lines exit the sides of the picture, as they should. */

  /* Batter's boxes: soft chalk, sized for the bigger plate area. */
  ctx.strokeStyle = 'rgba(255,255,255,.30)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(cx - 44, plateY - 12, 30, 36);
  ctx.strokeRect(cx + 14, plateY - 12, 30, 36);

  /* Bases: flattened diamonds (perspective again), second drawn a touch
     smaller because it is the farthest away. */
  const bases = [
    [cx + rx, midY],
    [cx, topY],
    [cx - rx, midY],
  ];
  bases.forEach(([bx, by], i) => {
    const s = i === 1 ? 8 : 10;
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath();
    ctx.moveTo(bx, by - s * 0.6 + 1); ctx.lineTo(bx + s, by + 1); ctx.lineTo(bx, by + s * 0.6 + 1); ctx.lineTo(bx - s, by + 1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#eaeaea';
    ctx.beginPath();
    ctx.moveTo(bx, by - s * 0.6); ctx.lineTo(bx + s, by); ctx.lineTo(bx, by + s * 0.6); ctx.lineTo(bx - s, by);
    ctx.closePath(); ctx.fill();
  });

  /* Home plate: pentagon */
  ctx.fillStyle = '#eaeaea';
  ctx.beginPath();
  ctx.moveTo(cx - 10, plateY);
  ctx.lineTo(cx + 10, plateY);
  ctx.lineTo(cx + 10, plateY + 6);
  ctx.lineTo(cx, plateY + 12);
  ctx.lineTo(cx - 10, plateY + 6);
  ctx.closePath();
  ctx.fill();

  /* Pitcher's rubber on the mound circle drawn above. */
  ctx.fillStyle = '#eaeaea';
  ctx.fillRect(cx - 9, moundY - 2, 18, 4);

  /* Fielders and defense are always drawn. The batter and base runners
     get drawn either statically at their bases (no active play) or as
     animated waypoints along their paths (a play is in flight). */
  const g = State.game;
  const field = G;

  if (g) {
    /* Catcher behind plate */
    /* (This once gated on catcher.pal, a field the old sprite system
       carried and the rewrite removed, so no catcher drew at all.) */
    /* The catcher and the on deck circle belong to the WIDE shot. In the
       close one the camera is standing about where the catcher is, so
       drawing him puts a man between the player and the plate he is
       trying to read, and the on deck circle lands underneath the
       foreground batter. Both fade out as the camera comes in. */
    const plateCrowd = 1 - cam.t;
    if (plateCrowd > 0.02) {
      ctx.save();
      ctx.globalAlpha = plateCrowd;
      const catcher = currentFieldingTeam().batters[8] || currentFieldingTeam().batters[1];
      if (catcher) drawRunner(ctx, cx + 18, plateY + 38, catcher, 2.3, 'back');
    /* On-deck circle: the next batter waits in it, bat on shoulder is
       implied by the back view. Gives the bottom corner life and tells
       the player who is up next without reading the log. */
    const bt2 = currentBattingTeam();
    const onDeck = bt2.batters[(bt2.idx + 1) % 9];
    if (onDeck) {
      const ox = cx - rx * 0.62, oy = plateY + 30;
      ctx.fillStyle = 'rgba(0,0,0,.18)';
      ctx.beginPath(); ctx.ellipse(ox, oy, 20, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(234,234,234,.25)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(ox, oy, 20, 9, 0, 0, Math.PI * 2); ctx.stroke();
      drawRunner(ctx, ox, oy + 2, onDeck, 2.2);
      }
      ctx.restore();
    }
    /* Pitcher on the mound: windup for the first 65% of the pitch's
       travel, release for the last 35%, then idle. */
    const pit = currentPitcher();
    let pitcherPose = null;
    if (pitch && !inWindup) {
      pitcherPose = t < 0.35 ? 'release' : null;
    } else if (pitch && inWindup) {
      pitcherPose = 'windup';
    }
    if (pit) drawRunner(ctx, cx, moundY - 6, pit, 2.6, pitcherPose);
    /* During the windup the ball shows raised at the pitcher's hand, so
       the eye is already on the spot the pitch will leave from. */
    if (pitch && inWindup) drawBaseball(ctx, cx + 10, moundY - 58);
    /* Fielder cluster, on the foreshortened diamond. Depth scaling:
       outfielders are FARTHER away, so they draw smaller than the
       infield corners, which is what sells the camera angle. */
    const fs = currentFieldingTeam().batters;
    /* The man chasing the ball is drawn on his path below, not here, or
       he appears twice: once sprinting and once still at his post. */
    const chasing = (g.play && g.play.ball) ? chaseFor(g.play, G, w, r).i : -1;
    for (const q of fielderPosts(G, w)) {
      if (q.i === chasing) continue;
      if (fs[q.i]) drawRunner(ctx, q.x, q.y, fs[q.i], q.sc);
    }

    if (g.play) {
      /* A contact play is animating. Draw the pre-play runners along
         their paths, and the batter as another runner along their own
         path. The bases themselves are only rewritten when the play's
         apply timer fires. */
      const p = g.play;
      const now = performance.now();
      /* RUNNERS LEAD. They used to start at p.runnerStart, most of the
         ball's flight AFTER the batter left the box, so with a man on
         first the batter sprinted past a runner who had not moved yet.
         Everyone is on the batter's clock now and the runners are ahead
         on it: they were already on base and moving at the crack. */
      const bt0 = clamp((now - p.startedAt) / Math.max(300, p.ball.duration - 100), 0, 1);
      const rt = clamp(bt0 * 1.35, 0, 1);
      const beatAB = Math.floor(now / 130) % 2 === 0;
      /* A runner moving up the screen is running away from the camera,
         so they get the back frames. Sampled from the path itself. */
      const runFrameFor = (path, t) => {
        const [, y0] = pathPointAt(field, path, Math.max(0, t - 0.04));
        const [, y1] = pathPointAt(field, path, Math.min(1, t + 0.04));
        const away = y1 < y0 - 0.5;
        return away ? (beatAB ? 'back-run-a' : 'back-run-b')
                    : (beatAB ? 'run-a' : 'run-b');
      };
      p.preBases.forEach((runner, i) => {
        if (!runner || !p.runnerPaths[i]) return;
        const [wx, wy] = pathPointAt(field, p.runnerPaths[i], rt);
        drawRunner(ctx, wx, wy - 4, runner, 2.6,
                   rt > 0 && rt < 1 ? runFrameFor(p.runnerPaths[i], rt) : null);
      });
      /* Batter as runner: same clock, a step behind the men in front. */
      const bt = bt0;
      const [bx, by] = pathPointAt(field, p.batterPath, bt);
      const fgb = FG.at(1 - bt);
      drawRunner(ctx, bx + fgb.dx, by - 4 + fgb.dy, p.batter, 3 + (fgb.sc - 3.2),
                 bt > 0.05 && bt < 0.98 ? runFrameFor(p.batterPath, bt) : null);
      /* Bat swing arc, first 240ms of the play */
      if (now < p.swingUntil) {
        const st = clamp((now - p.startedAt) / (p.swingUntil - p.startedAt), 0, 1);
        const f = FG.at(1 - bt);
        drawBatSwing(ctx, cx - 28 + f.dx, plateY + 4 + f.dy, st, f.sc / 3.2);
      }
      /* THE CHASE. He leaves as the ball does and closes on where it is
         going to land; whether he is there when it arrives is the entire
         readout. On a catch the glove flashes at the moment of arrival. */
      const ch = chaseFor(p, G, w, r);
      const fielder = fs[ch.i];
      if (fielder) {
        const ct = clamp((now - p.startedAt) / (p.ball.duration * ch.arrive), 0, 1);
        const fx = ch.x0 + (ch.x1 - ch.x0) * ct;
        const fy = ch.y0 + (ch.y1 - ch.y0) * ct;
        const away = ch.y1 < ch.y0 - 2;      /* running up screen: show his back */
        const moving = ct > 0.02 && ct < 0.995;
        const frame = !moving ? null
          : away ? (beatAB ? 'back-run-a' : 'back-run-b')
                 : (beatAB ? 'run-a' : 'run-b');
        drawRunner(ctx, fx, fy, fielder, ch.sc, frame);
        /* No glove flash fired from here. The play already spawns one at
           ball arrival, on a timer set when the play was built; a second
           one from the draw loop is the same catch celebrated twice. All
           this has to do is put the man there when it happens. */
      }

      /* Ball trajectory: plate to landing spot, with a ground shadow so
         the arc height reads. */
      if (now < p.ballUntil) {
        const bt2 = clamp((now - p.startedAt) / p.ball.duration, 0, 1);
        /* Batted balls leave from the bat's contact point, just off the
           batter's box, not from the middle of the plate. */
        const startX = cx - 14, startY = plateY - 4;
        const endX = startX + p.ball.dx * r;
        const endY = cy + p.ball.dy * r;
        const arc = 4 * p.ball.arcH * bt2 * (1 - bt2);
        const bxx = startX + (endX - startX) * bt2;
        const byy = startY + (endY - startY) * bt2 - arc;
        /* Ground level for the shadow: the ball's own linear path (no arc). */
        const gy = startY + (endY - startY) * bt2;
        drawBaseball(ctx, bxx, byy, gy);
      }
    } else {
      /* No play in flight: runners are static on their bases, batter
         stands in the batter's box. */
      const bs = g.bases;
      if (bs[0]) drawRunner(ctx, bases[0][0], bases[0][1] - 6, bs[0], 2.6);
      if (bs[1]) drawRunner(ctx, bases[1][0], bases[1][1] - 6, bs[1], 2.45);
      if (bs[2]) drawRunner(ctx, bases[2][0], bases[2][1] - 6, bs[2], 2.6);
      const batter = currentBatter();
      if (batter) {
        const f = FG.at(1);
        drawRunner(ctx, cx - 28 + f.dx, plateY + 6 + f.dy, batter, f.sc, 'batting');
      }
    }
  }

  /* Pitch ball moving from mound to plate. Only when no contact-play is
     in flight (so the ball isn't drawn twice).

     TIMING CONTRACT: the ball must ARRIVE AT THE PLATE exactly when the
     meter cursor crosses the pitch's ideal spot, so swinging when the
     ball reaches the hitter is the same thing as swinging in the green
     zone. The meter runs 0..1 over the pitch duration; the ball's own
     travel is therefore remapped to finish at t = ideal. Past that
     point the ball sits in the catcher's mitt. */
  if (pitch && !inWindup && !(g && g.play)) {
    const bx = cx;
    const by = moundY - 22;    /* release point, out of the pitcher's hand */
    const px = cx;
    const py = plateY - 8;
    const arrive = Math.max(0.22, pitch.ideal);
    let e = clamp(t / arrive, 0, 1);
    /* Per-pitch flight character: fastball rides straight and hard, the
       curveball bends late and big, the changeup floats then dies. */
    if (pitch.pt === 'changeup') e = Math.pow(e, 1.45);
    let ballX = bx + (px - bx) * e;
    let ballY = by + (py - by) * e;
    if (pitch.pt === 'curveball') {
      /* Late break: barely moves early, sweeps hard in the last third. */
      const bend = Math.pow(e, 2.2) * Math.sin(e * Math.PI);
      ballX += bend * 34 * (pitch.ideal < 0.5 ? -1 : 1);
    } else if (pitch.pt === 'screwball') {
      /* The curveball's mirror: it breaks the other way. */
      const bend = Math.pow(e, 2.2) * Math.sin(e * Math.PI);
      ballX -= bend * 34 * (pitch.ideal < 0.5 ? -1 : 1);
    } else if (pitch.pt === 'changeup') {
      /* Small fade plus a visible dip at the end. */
      ballX += Math.sin(e * Math.PI) * 8;
      ballY += Math.pow(e, 3) * 10;
    } else if (pitch.pt === 'slowball') {
      /* Floats up on a rainbow, drops in lazily. */
      ballY -= Math.sin(e * Math.PI) * 14;
    } else if (pitch.pt === 'knuckler') {
      /* It flutters. Even the pitcher does not know. */
      ballX += Math.sin(e * 17) * 4 + Math.sin(e * 7) * 3;
      ballY += Math.sin(e * 11) * 2;
    }
    /* Trail: three ghosts behind the ball so speed reads. */
    for (let gi = 1; gi <= 3; gi++) {
      const ge = clamp(e - gi * 0.05, 0, 1);
      const gx = bx + (px - bx) * ge;
      let gyy = by + (py - by) * ge;
      ctx.fillStyle = `rgba(255,255,255,${0.22 - gi * 0.06})`;
      ctx.beginPath(); ctx.arc(gx, gyy, 4 - gi, 0, Math.PI*2); ctx.fill();
    }
    drawBaseball(ctx, ballX, ballY);
  }
  if (pitch && !(g && g.play)) {
    drawTimingRing(ctx, G, t, pitch, inWindup);
  }

  /* Instant replay: re-runs the stored highlight's flight over the live
     field, with a broadcast style badge. Purely cosmetic; it reads no
     game state and changes none. */
  if (g && g.replay) {
    const R = g.replay;
    const now = performance.now();
    const rt = clamp((now - R.startedAt) / R.h.ball.duration, 0, 1);
    /* Dim the field slightly so the replay reads as a cutaway. */
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.fillRect(0, 0, w, h);
    if (rt < 1) {
      const startX = cx - 14, startY = plateY - 4;
      const endX = startX + R.h.ball.dx * r;
      const endY = cy + R.h.ball.dy * r;
      const arc = 4 * R.h.ball.arcH * rt * (1 - rt);
      /* Trailing arc so the whole flight path is visible at once. */
      ctx.strokeStyle = 'rgba(244,194,90,.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i <= 40; i++) {
        const e = (i / 40) * rt;
        const px2 = startX + (endX - startX) * e;
        const py2 = startY + (endY - startY) * e - 4 * R.h.ball.arcH * e * (1 - e);
        if (i === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
      }
      ctx.stroke();
      drawBaseball(ctx, startX + (endX - startX) * rt, startY + (endY - startY) * rt - arc);
    }
    /* Badge */
    const blink = Math.floor(now / 400) % 2 === 0;
    ctx.fillStyle = blink ? '#c94b1a' : '#8a2b10';
    ctx.fillRect(cx - 92, 30, 184, 30);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('REPLAY', cx, 45);
    ctx.fillStyle = '#f4c25a';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(`${R.h.batterName} · ${R.h.kind.toUpperCase()}`, cx, 74);
  }

  ctx.restore();
  /* --------------------------- screen pass ---------------------------- */

  /* Signature moment overlays: character-specific spectacle that lands
     on top of the field during a big at bat. Each one runs for its
     own window and clears itself. */
  if (g && g.signature) {
    const sig = g.signature;
    const now = performance.now();
    if (now < sig.until) {
      const rem = (sig.until - now) / 1600;
      const alpha = clamp(rem * 1.4, 0, 1);
      if (sig.kind === 'chest') {
        /* KONG chest beat: darken the field, thump text scales in. */
        ctx.fillStyle = `rgba(0,0,0,${0.35 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = `bold ${Math.floor(84 - rem * 30)}px monospace`;
        ctx.fillStyle = `rgba(255,220,140,${alpha})`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('THUMP!', cx, cy - 40);
        ctx.font = 'bold 36px monospace';
        ctx.fillText('THUMP!', cx + 90, cy + 40);
      } else if (sig.kind === 'bats') {
        /* DRACULA bat swarm: scattered black bats fluttering across. */
        for (let i = 0; i < 22; i++) {
          const off = (i * 137 + Math.floor(now / 30)) % 360;
          const bx = ((off * 3) % w);
          const by = ((off * 5) % h);
          ctx.fillStyle = `rgba(20,10,20,${alpha})`;
          ctx.fillRect(bx, by, 6, 2);
          ctx.fillRect(bx - 3, by + 2, 12, 2);
        }
        ctx.font = 'bold 40px serif';
        ctx.fillStyle = `rgba(196,50,50,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('~ NIGHT FALLS ~', cx, cy - 60);
      } else if (sig.kind === 'flex') {
        /* FRANKY flex: green flash + bolts */
        ctx.fillStyle = `rgba(126,168,106,${0.28 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = 'bold 48px monospace';
        ctx.fillStyle = `rgba(201,162,86,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('IT LIVES', cx, cy - 20);
      } else if (sig.kind === 'anchor') {
        /* POPEYE anchor: forearm silhouette + horn */
        ctx.fillStyle = `rgba(198,57,44,${0.22 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = 'bold 44px monospace';
        ctx.fillStyle = `rgba(255,235,180,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('AH-GA-GA-GA-GA!', cx, cy - 20);
      } else if (sig.kind === 'arrow') {
        /* ROBIN HOOD arrow zips across the field. */
        const p = 1 - rem;
        const ax = w * p;
        const ay = cy - 30 + Math.sin(p * Math.PI) * 40;
        ctx.strokeStyle = `rgba(244,194,90,${alpha})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(ax - 40, ay); ctx.lineTo(ax, ay); ctx.stroke();
        ctx.fillStyle = `rgba(90,50,20,${alpha})`;
        ctx.fillRect(ax, ay - 3, 6, 6);
        ctx.font = 'bold 32px serif';
        ctx.fillStyle = `rgba(90,140,80,${alpha})`;
        ctx.fillText('BULLSEYE', cx, cy - 60);
      } else if (sig.kind === 'flies') {
        /* PETER PAN takes off */
        const p = 1 - rem;
        ctx.font = 'bold 40px monospace';
        ctx.fillStyle = `rgba(244,194,90,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('FLIES AWAY', cx, cy - 80 - p * 60);
        /* Fairy dust trail */
        for (let i = 0; i < 20; i++) {
          const dx = cx + (Math.random() - 0.5) * 120;
          const dy = cy - p * 100 + Math.random() * 60;
          ctx.fillStyle = `rgba(244,194,90,${alpha * Math.random()})`;
          ctx.fillRect(dx, dy, 2, 2);
        }
      } else if (sig.kind === 'gallop') {
        /* CENTAUR gallops with motion lines */
        ctx.strokeStyle = `rgba(240,220,180,${alpha * 0.7})`;
        ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          const y = cy + (i - 3) * 8;
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w * (1 - rem), y); ctx.stroke();
        }
        ctx.font = 'bold 36px monospace';
        ctx.fillStyle = `rgba(240,220,180,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('THUNDERING HOOVES', cx, cy - 50);
      } else if (sig.kind === 'drain') {
        /* CHUPACABRA drains: violet-green haze */
        ctx.fillStyle = `rgba(90,180,120,${0.28 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = 'bold 40px monospace';
        ctx.fillStyle = `rgba(244,220,90,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('DRAINED', cx, cy - 20);
      } else if (sig.kind === 'snarl') {
        /* RABID DOG snarl: quick red streaks */
        for (let i = 0; i < 12; i++) {
          const rx = Math.random() * w;
          const ry = Math.random() * h;
          ctx.fillStyle = `rgba(201,75,26,${alpha * 0.35})`;
          ctx.fillRect(rx, ry, 40, 2);
        }
        ctx.font = 'bold 36px monospace';
        ctx.fillStyle = `rgba(201,75,26,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('SNARL!', cx, cy - 20);
      } else if (sig.kind === 'sleigh') {
        /* SANTA sleigh across the sky */
        const p = 1 - rem;
        const sx = w * (1 - p);
        ctx.fillStyle = `rgba(201,48,48,${alpha})`;
        ctx.fillRect(sx, 40, 30, 8);
        ctx.fillStyle = `rgba(240,220,180,${alpha})`;
        ctx.fillRect(sx - 8, 44, 40, 2);
        ctx.font = 'bold 32px serif';
        ctx.fillStyle = `rgba(201,48,48,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('HO HO HO', cx, cy - 40);
      } else if (sig.kind === 'torch') {
        /* LADY LIBERTY torch flash */
        ctx.fillStyle = `rgba(244,194,90,${0.25 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = 'bold 40px serif';
        ctx.fillStyle = `rgba(109,184,162,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('LIBERTY LEVELED', cx, cy - 20);
      }
    } else {
      g.signature = null;
    }
  }

  /* Catch minigame overlay: appears when a fly ball is coming down toward
     an outfielder. A small ring shrinks around the landing spot; nail
     the tightest ring for a catch. */
  if (g && g.play && g.play.catchActive && g.play.catchWindow) {
    const cw = g.play.catchWindow;
    const now = performance.now();
    const t = clamp((now - cw.startedAt) / cw.duration, 0, 1);
    const [lx, ly] = [cw.landingX, cw.landingY];
    /* Green target ring: shrinks as t moves through the middle, widens
       past the sweet spot. Radius drives visual read of when to click. */
    const shrink = 1 - 4 * Math.abs(t - 0.5) * (1 - Math.abs(t - 0.5));
    const rBig = 46;
    const rSmall = 12;
    const rNow = rSmall + (rBig - rSmall) * shrink;
    ctx.strokeStyle = '#0f6b39';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(lx, ly, rNow, 0, Math.PI * 2); ctx.stroke();
    /* Inner sweet ring */
    ctx.strokeStyle = 'rgba(232,150,12,.95)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(lx, ly, rSmall, 0, Math.PI * 2); ctx.stroke();
    /* Label */
    ctx.fillStyle = '#f4c25a';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('CATCH IT!', lx, ly - rBig - 12);
    ctx.fillText('SPACE / CLICK', lx, ly + rBig + 12);
  }

  /* Throw minigame overlay: appears when a grounder is in the field and
     the player has a window to complete the throw. */
  if (g && g.play && g.play.throwActive && g.play.throwWindow) {
    const win = g.play.throwWindow;
    const now = performance.now();
    const t = clamp((now - win.startedAt) / win.duration, 0, 1);
    const barW = w * 0.5;
    const barX = cx - barW/2;
    const barY = h * 0.90;
    const barH = 22;
    /* Background */
    ctx.fillStyle = 'rgba(11,16,21,.92)';
    ctx.fillRect(barX - 6, barY - 6, barW + 12, barH + 34);
    /* Yellow zone */
    ctx.fillStyle = 'rgba(244,194,90,.36)';
    ctx.fillRect(barX + (win.ideal - win.yellowHalf) * barW, barY,
                 win.yellowHalf * 2 * barW, barH);
    /* Green zone */
    ctx.fillStyle = 'rgba(91,176,131,.72)';
    ctx.fillRect(barX + (win.ideal - win.greenHalf) * barW, barY,
                 win.greenHalf * 2 * barW, barH);
    /* Cursor */
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(barX + t * barW - 2, barY - 3, 4, barH + 6);
    /* Label */
    ctx.fillStyle = '#f4c25a';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('THROW TO FIRST · SPACE OR CLICK', cx, barY + barH + 12);
  }

  /* Pitcher fatigue chip in the top strip so a player can see it. */
  if (g && !g.play) {
    const fat = pitcherFatigue();
    if (fat.level > 0) {
      const label = fat.level >= 3 ? 'GASSED' : fat.level === 2 ? 'TIRING' : 'WARM';
      const color = fat.level >= 3 ? '#c94b1a' : fat.level === 2 ? '#e3b04c' : '#5bb083';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = color;
      ctx.fillText(label, cx, cy - 26);
    }
  }

  /* Particles fire on top of everything, but they were spawned at field
     coordinates (dust at a base, confetti over the plate), so they go
     back through the camera to land where they were thrown. */
  if (g) {
    ctx.save();
    camApply(ctx, cam, w, h);
    updateAndDrawFx(ctx, g);
    ctx.restore();
  }

  /* Soft vignette: darkens the corners so the diamond glows in the
     middle, same framing trick the golf tracer uses. */
  const vg = ctx.createRadialGradient(cx, cy, r * 0.8, cx, cy, w * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, theme.night ? 'rgba(0,0,0,.30)' : 'rgba(0,0,0,.12)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, w, h);

  ctx.restore();
}

function drawBaseball(ctx, x, y, groundY) {
  /* Optional ground shadow: pass the y of the ground plane and we drop a
     small shadow there, so a high arc reads as high. */
  let rad = 5;
  if (typeof groundY === 'number') {
    const drop = Math.max(0, groundY - y);
    const alpha = clamp(0.35 - drop * 0.0015, 0.05, 0.35);
    const rx = 5 + drop * 0.02;
    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
    ctx.beginPath();
    ctx.ellipse(x, groundY, rx, 2, 0, 0, Math.PI * 2);
    ctx.fill();
    /* The ball swells as it climbs toward the camera: a pop fly at its
       peak is nearer the viewer than the grass under it, and the size
       change is what makes the arc read as UP rather than away. */
    rad = 5 + Math.min(4, drop * 0.022);
  }
  ctx.fillStyle = '#eaeaea';
  ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#c94b1a';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, rad - 1, -Math.PI*0.2, Math.PI*0.3); ctx.stroke();
}

function drawBatSwing(ctx, x, y, t, sc) {
  /* A wooden bat sweeping horizontally at the plate. t goes 0 to 1 over
     the swing window, so the bat rotates from behind the batter to in
     front. sc tracks the batter's own scale: in the close shot he is
     drawn half again as big and a fixed length bat reads as a pencil. */
  sc = sc || 1;
  const cx = x + 6 * sc, cy = y - 12 * sc;
  const angle = -Math.PI * 0.6 + Math.PI * 1.2 * t;
  const len = 22 * sc;
  const bx = cx + Math.cos(angle) * len;
  const by = cy + Math.sin(angle) * len;
  ctx.strokeStyle = '#8b6a3a';
  ctx.lineWidth = 4 * sc;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(bx, by); ctx.stroke();
  ctx.strokeStyle = '#5a3a1c';
  ctx.lineWidth = 2 * sc;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(angle) * 6 * sc, cy + Math.sin(angle) * 6 * sc); ctx.stroke();
}


const runnerCache = new Map();
function drawRunner(ctx, x, y, character, scale, pose) {
  scale = scale || 3;
  const hero = hasHero(character.k);

  /* Hero characters use their own animated frames on the field. The run
     poses drive the run cycle; everything else shows the idle frame with
     a gentle bob. */
  if (hero) {
    /* The camera stands behind home plate, so anything facing the
       pitcher shows the viewer its back: the batter in the box, the
       catcher, and any runner whose path is carrying them up-screen. */
    let frame = 'idle';
    if (pose === 'run-a') frame = 'run1';
    else if (pose === 'run-b') frame = 'run2';
    else if (pose === 'batting' || pose === 'back') frame = 'back';
    else if (pose === 'back-run-a') frame = 'backrun1';
    else if (pose === 'back-run-b') frame = 'backrun2';
    const hkey = character.k + '@h' + scale + frame;
    let hcv = runnerCache.get(hkey);
    if (!hcv) { hcv = heroSpriteCanvas(character.k, Math.round(HERO_W * scale * 0.9), frame); runnerCache.set(hkey, hcv); }
    /* Ground shadow */
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath();
    ctx.ellipse(x, y + 1, hcv.width * 0.34, hcv.width * 0.10, 0, 0, Math.PI * 2);
    ctx.fill();
    /* Idle bob when standing still */
    let dy = 0;
    if (pose == null || pose === 'batting' || pose === 'back') {
      dy = Math.floor(((performance.now() / 420) + (character.k.charCodeAt(0) % 5) * 0.2) % 2) === 0 ? 0 : -1;
    }
    ctx.drawImage(hcv, Math.round(x - hcv.width/2), Math.round(y - hcv.height + dy));
    /* A batter waits with the bat UP. The swing arc only exists for the
       240ms of contact, so without this the player at the plate stood
       empty handed all at bat, which no baseball game survives. */
    if (pose === 'batting') {
      const bl = hcv.width * 0.58;
      ctx.save();
      ctx.translate(x + hcv.width * 0.30, y - hcv.height * 0.55 + dy);
      ctx.rotate(-0.75);
      ctx.fillStyle = '#6b4a24';                       /* grip */
      ctx.fillRect(-1.5, 0, 3, -bl * 0.35);
      ctx.fillStyle = '#a97f46';                       /* barrel */
      ctx.fillRect(-2.5, -bl * 0.30, 5, -bl * 0.62);
      ctx.fillStyle = '#c9a06a';                       /* barrel light edge */
      ctx.fillRect(-2.5, -bl * 0.30, 2, -bl * 0.62);
      ctx.restore();
    }
    return;
  }

}

/* The timing read lives ON THE FIELD now: a ring that shrinks onto a
   green target circle at the contact point as the pitch flies in. The
   ball arrives exactly when the ring closes on the target, so watching
   the ball and watching the ring are the same act, which is the whole
   Backyard trick the old bottom bar never managed. */
function drawTimingRing(ctx, G, t, pitch, inWindup) {
  /* Centered where the pitch actually arrives, sized to read from a
     couch: the first cut was 62px on the batter's knee and vanished. */
  const cxp = G.cx - 2, cyp = G.plateY - 8;
  const R0 = 84;
  const diff = DIFF[State.difficulty];
  let half = diff.sweetWidth / 2;
  const mode = (State.game && State.game.swingMode) || 'contact';
  if (playerIsBatting()) {
    if (mode === 'contact') half *= 1.25;
    if (mode === 'power') half *= 0.75;
    if (mode === 'bunt') half = 0.30;
  }
  const sweetR = Math.max(17, R0 * Math.min(0.55, half / pitch.ideal));
  const foulR = Math.min(R0 - 6, sweetR * 1.7);
  const ring = (r, color, wdt) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = wdt;
    ctx.beginPath();
    ctx.ellipse(cxp, cyp, r, r * 0.62, 0, 0, Math.PI * 2);
    ctx.stroke();
  };
  /* The target: yellow ok band, green sweet circle. */
  ctx.fillStyle = 'rgba(244,194,90,.22)';
  ctx.beginPath(); ctx.ellipse(cxp, cyp, foulR, foulR * 0.62, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(91,176,131,.45)';
  ctx.beginPath(); ctx.ellipse(cxp, cyp, sweetR, sweetR * 0.62, 0, 0, Math.PI * 2); ctx.fill();
  ring(sweetR, 'rgba(140,235,175,.95)', 3);
  if (inWindup) {
    /* Windup: the full ring pulses in place, showing where the swing
       window will start from. */
    const pulse = 0.35 + 0.3 * Math.sin(performance.now() / 140);
    ring(R0, `rgba(27,58,92,${0.35 + pulse * 0.5})`, 3);
    /* On a daylight field white text at 75 percent is a smudge. It goes
       on a plate, like everything else that has to be read over grass. */
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const gy = cyp - R0 * 0.62 - 12;
    const gw = ctx.measureText('GET READY').width + 14;
    ctx.fillStyle = 'rgba(255,252,242,.94)';
    ctx.fillRect(cxp - gw / 2, gy - 9, gw, 18);
    ctx.strokeStyle = '#1b3a5c';
    ctx.lineWidth = 2;
    ctx.strokeRect(cxp - gw / 2, gy - 9, gw, 18);
    ctx.fillStyle = '#cf3229';
    ctx.fillText('GET READY', cxp, gy);
    return;
  }
  const rel = (pitch.ideal - t) / pitch.ideal;
  if (rel > 0) {
    /* Inbound: the white ring closes on the target with the pitch. */
    /* Inbound. On grass in daylight a white ring with a dark halo is
       the wrong way round: the halo goes light and the ring goes INK,
       turning hot as it crosses into the good band. */
    const r = sweetR + (R0 - sweetR) * rel;
    ring(r + 1, 'rgba(255,252,242,.70)', 5);
    ring(r, r < foulR ? '#cf3229' : '#1b3a5c', 3);
  } else if (t - pitch.ideal <= half) {
    /* In the sweet window past center: the target flashes hot. */
    const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 60);
    ring(sweetR + 1, 'rgba(255,252,242,.75)', 5);
    ring(sweetR, `rgba(232,150,12,${pulse})`, 3);
  }
}

/* ============================================================================
   HUD
   ============================================================================ */
function renderGame() {
  const g = State.game;
  const s = el('div','screen');

  /* Line score above the field, real ballpark style. */
  const ls = el('div','linescore');
  ls.id = 'linescore';
  renderLineScore(ls);
  s.appendChild(ls);

  const arena = el('div','arena');
  const cv = document.createElement('canvas');
  cv.id = 'field'; cv.width = 960; cv.height = 660;
  arena.appendChild(cv);

  /* Score and inning overlaid on the field's corners so nothing steals room
     from the diamond. Names inside color chips read at a glance without
     needing a label. */
  const theme = currentTheme();
  /* The park name was tinted with the park's own wall colour, which was
     a bright accent against a dark field. On a cream placard that is
     cream on cream, so the sign was blank in every stadium with a pale
     wall. It takes the marquee red instead. */
  const parkLbl = el('div','corner park', `<span class="lbl">${theme.park}</span>`);
  parkLbl.style.top = '8px'; parkLbl.style.left = '50%';
  parkLbl.style.transform = 'translateX(-50%)';
  parkLbl.style.textAlign = 'center';
  arena.appendChild(parkLbl);

  const tl = el('div','corner tl',
    `<span class="lbl">${g.away.name}${g.away.isYou?' (you)':''}</span>`
    + `<span class="val ${g.away.isYou?'gold':''}" id="hud-away">${g.away.score}</span>`
  );
  const tr = el('div','corner tr',
    `<span class="lbl">${g.home.name}${g.home.isYou?' (you)':''}</span>`
    + `<span class="val ${g.home.isYou?'gold':''}" id="hud-home">${g.home.score}</span>`
  );
  const bl = el('div','corner bl',
    `<span class="lbl">Inning</span>`
    + `<span class="val" id="hud-inning">${g.half==='top'?'Top':'Bot'} ${g.inning}/${g.innings}</span>`
  );
  const br = el('div','corner br',
    `<span class="val" id="hud-count">Outs ${g.outs} · ${g.balls}-${g.strikes}</span>`
  );
  arena.append(tl, tr, bl, br);

  const callout = el('div','callout'); callout.id = 'callout';
  arena.appendChild(callout);
  s.appendChild(arena);

  const meter = el('div','meter-wrap');
  meter.innerHTML = `<div class="label">`
    + `<span><b class="pt" id="pt-name">Get ready</b></span>`
    + `<span id="meter-side">Click anywhere or press Space</span></div>`;
  /* Swing selection, Backyard style: pick HOW you swing before the
     pitch arrives. Contact is wide and safe, Power is narrow and loud,
     Bunt lays it down. Keys 1/2/3 work too. */
  const modes = el('div','swing-modes');
  modes.id = 'swing-modes';
  modes.innerHTML = `<span class="lbl">Swing (1/2/3)</span>`
    + `<button class="mode-btn selected" data-mode="contact">Contact</button>`
    + `<button class="mode-btn" data-mode="power">Power</button>`
    + `<button class="mode-btn" data-mode="bunt">Bunt</button>`;
  for (const b of modes.querySelectorAll('button')) {
    b.onclick = (e) => {
      e.stopPropagation();
      if (State.game) State.game.swingMode = b.dataset.mode;
      syncSwingModeButtons();
    };
  }
  meter.appendChild(modes);
  const hint = el('div','hint', 'Swing when the shrinking ring reaches the <b>green circle</b> at the plate.');
  hint.id = 'meter-hint';
  meter.appendChild(hint);

  /* Pitch-selection strip: hidden by default, shown only during the CPU's
     at bat windup by offerPitchSelection(). Two picks: pitch type and
     target location on a 3 by 3 strike zone grid. Center pitches are
     easier for the CPU to square up but always strikes; corner and edge
     pitches are harder to hit but can turn into balls if you miss. */
  const psel = el('div','pitch-select');
  psel.id = 'pitch-select';
  psel.style.display = 'none';
  const zoneGridCells = [
    'corner','mid','corner',
    'mid','center','mid',
    'corner','mid','corner',
  ];
  const zoneHtml = zoneGridCells.map((cls,i) => `<button class="${cls}" data-zone="${i}" title="Aim here"></button>`).join('');
  psel.innerHTML =
      `<div class="col"><span class="lbl">Pitch</span><div class="type-row">`
    + `<button class="btn ghost" data-pt="fastball">Fastball</button>`
    + `<button class="btn ghost" data-pt="curveball">Curveball</button>`
    + `<button class="btn ghost" data-pt="changeup">Changeup</button>`
    + `</div></div>`
    + `<div class="col"><span class="lbl">Location</span>`
    + `<div class="zone-grid" id="zone-grid">${zoneHtml}</div></div>`
    + `<div class="col"><span class="lbl">Deliver</span>`
    + `<button class="btn" id="throw-btn" disabled>Throw It</button>`
    + `<span class="throw-hint" id="throw-hint">Pick a pitch.</span></div>`;
  meter.appendChild(psel);

  /* Big touch-friendly SWING button under the meter, for phones and
     anyone who prefers a target to a click-anywhere. */
  const swingBtn = el('button','btn swing-btn','SWING');
  swingBtn.id = 'swing-btn';
  swingBtn.onmousedown = swingBtn.ontouchstart = (e) => {
    e.preventDefault();
    /* Route through the same swing path a click would use. */
    const g2 = State.game;
    if (!g2 || !g2.pitch || g2.pitch.swung || !playerIsBatting()) return;
    const now = performance.now();
    if (now < g2.pitch.windupUntil) return;
    const t = clamp((now - g2.pitch.start) / (g2.pitch.speed * 1000), 0, 1);
    g2.pitch.swung = true;
    resolveSwing(t);
  };
  meter.appendChild(swingBtn);
  s.appendChild(meter);

  /* Steal button, only visible when there is a runner who can advance. */
  const stealRow = el('div', 'controls');
  const stealBtn = el('button','btn ghost','Steal 2nd');
  stealBtn.id = 'steal-btn';
  stealBtn.style.display = 'none';
  stealBtn.onclick = attemptSteal;
  stealRow.appendChild(stealBtn);

  const replayBtn = el('button','btn ghost','Replay');
  replayBtn.id = 'replay-btn';
  replayBtn.style.display = 'none';
  replayBtn.onclick = (e) => { e.stopPropagation(); playHighlight(); };
  stealRow.appendChild(replayBtn);
  s.appendChild(stealRow);

  const atbat = el('div','atbat');
  atbat.id = 'atbat';
  refreshAtBatCard(atbat);
  s.appendChild(atbat);

  const log = el('div','log');
  log.id = 'log';
  for (const line of g.log.slice(-14)) {
    const d = el('div', 'line' + (line.big?' big':''), line.text);
    log.appendChild(d);
  }
  s.appendChild(log);

  const ctrl = el('div','controls');
  const abort = el('button','btn ghost','End Game');
  abort.onclick = () => {
    if (!abandonGame()) return;
    if (!State.game) { State.screen = 'menu'; render(); }
  };
  ctrl.appendChild(abort);
  s.appendChild(ctrl);

  app.appendChild(s);
  /* Start the always-on field paint loop as soon as the canvas is in the DOM. */
  startFieldLoop();
}

/* One flavor callout at a time. Overlays the field for 1.4s, fades out.
   `kind` picks a color: default gold, plus homer, hit, strike, ball, sub. */
let calloutTimer = 0;
function showCallout(text, kind) {
  const node = document.getElementById('callout');
  if (!node) return;
  node.textContent = text;
  node.className = 'callout on ' + (kind || '');
  clearTimeout(calloutTimer);
  calloutTimer = setTimeout(() => { node.classList.remove('on'); }, 1400);
}

function refreshAtBatCard(node) {
  const g = State.game;
  const b = currentBatter();
  const p = currentPitcher();
  node.innerHTML = '';
  const avatar = spriteCanvas(b, 48);
  avatar.className = 'avatar';
  node.appendChild(avatar);
  const info = el('div', null,
    `<div class="who"><b>${b.n}</b> at bat</div>`
    + `<div class="vs">vs ${p.n} pitching · POW ${b.pow} · CON ${b.con} · SPD ${b.spd}</div>`
  );
  node.appendChild(info);
  const count = el('div','count', `${g.balls}-${g.strikes}`);
  node.appendChild(count);
}

function renderLineScore(node) {
  const g = State.game;
  if (!g) return;
  /* Extra innings grow the board. It used to stop at the scheduled count,
     so a tenth inning was played on a nine column board. */
  const innings = Math.max(g.innings, g.inning, g.lineScore.away.length, g.lineScore.home.length);
  const rowFor = (label, arr, score, isYou) => {
    let html = `<td class="team">${label}${isYou?' *':''}</td>`;
    for (let i = 0; i < innings; i++) {
      const cell = arr[i];
      const isCur = (i + 1) === g.inning;
      const cls = isCur ? 'cur' : '';
      html += `<td class="${cls}">${cell == null ? '' : cell}</td>`;
    }
    html += `<td class="r">${score}</td>`;
    return html;
  };
  let header = '<th>&nbsp;</th>';
  for (let i = 1; i <= innings; i++) header += `<th>${i}</th>`;
  header += '<th>R</th>';
  node.innerHTML = `<table><thead><tr>${header}</tr></thead><tbody>`
    + `<tr>${rowFor(g.away.name.slice(0,10), g.lineScore.away, g.away.score, g.away.isYou)}</tr>`
    + `<tr>${rowFor(g.home.name.slice(0,10), g.lineScore.home, g.home.score, g.home.isYou)}</tr>`
    + `</tbody></table>`;
}

function refreshHud() {
  if (State.screen !== 'game') return;
  const g = State.game;
  const ls = document.getElementById('linescore');
  if (ls) renderLineScore(ls);
  const hudAway = document.getElementById('hud-away');
  const hudHome = document.getElementById('hud-home');
  const hudInn = document.getElementById('hud-inning');
  const hudCount = document.getElementById('hud-count');
  if (hudAway) hudAway.textContent = g.away.score;
  if (hudHome) hudHome.textContent = g.home.score;
  if (hudInn) hudInn.textContent = `${g.half==='top'?'Top':'Bot'} ${g.inning}/${g.innings}`;
  if (hudCount) hudCount.textContent = `Outs ${g.outs} · ${g.balls}-${g.strikes}`;
  const ab = document.getElementById('atbat');
  if (ab) refreshAtBatCard(ab);
  const log = document.getElementById('log');
  if (log) {
    log.innerHTML = '';
    for (const line of g.log.slice(-14)) {
      const d = el('div','line' + (line.big?' big':''), line.text);
      log.appendChild(d);
    }
    log.scrollTop = log.scrollHeight;
  }
  const ptName = document.getElementById('pt-name');
  if (ptName && g.pitch) {
    const info = PITCHES[g.pitch.pt];
    ptName.textContent = (info ? info.label : g.pitch.pt).toUpperCase();
  }
  refreshStealButton();
  /* Show swing controls only when the player is batting; show the
     "you're pitching" hint when the CPU is at the plate. */
  const side = document.getElementById('meter-side');
  const hint = document.getElementById('meter-hint');
  const swingBtn = document.getElementById('swing-btn');
  const youBat = playerIsBatting();
  if (side) side.textContent = youBat ? 'Click anywhere or press Space' : 'You are pitching · call a pitch each windup';
  if (hint) hint.style.display = youBat ? '' : 'none';
  const modesRow = document.getElementById('swing-modes');
  if (modesRow) modesRow.style.display = youBat ? '' : 'none';
  if (swingBtn) swingBtn.style.display = youBat ? '' : 'none';
  /* Replay is offered whenever a highlight is stored and nothing is
     already animating. */
  const rb = document.getElementById('replay-btn');
  if (rb) {
    const can = !!(g.highlight && !g.play && !g.replay && !g.over);
    rb.style.display = can ? '' : 'none';
    if (can) rb.textContent = `Replay ${g.highlight.kind}`;
  }
}

function syncSwingModeButtons() {
  const row = document.getElementById('swing-modes');
  if (!row) return;
  const mode = (State.game && State.game.swingMode) || 'contact';
  for (const b of row.querySelectorAll('button')) {
    b.classList.toggle('selected', b.dataset.mode === mode);
  }
}
document.addEventListener('keydown', (e) => {
  if (State.screen !== 'game' || !State.game || !playerIsBatting()) return;
  const map = { '1': 'contact', '2': 'power', '3': 'bunt' };
  if (!map[e.key]) return;
  State.game.swingMode = map[e.key];
  syncSwingModeButtons();
});

function refreshStealButton() {
  const btn = document.getElementById('steal-btn');
  if (!btn) return;
  const g = State.game;
  if (!g || g.over || g.play) { btn.style.display = 'none'; return; }
  /* Only offer a straight steal: runner on 1st going to 2nd, when 2nd is
     empty. Available only during the windup, before the meter starts. */
  const canSteal = playerIsBatting() && g.bases[0] && !g.bases[1] && g.pitch && !g.pitch.swung
                 && performance.now() < g.pitch.windupUntil;
  btn.style.display = canSteal ? '' : 'none';
  if (canSteal) btn.textContent = `Steal 2nd · ${g.bases[0].n}`;
}

function attemptSteal() {
  const g = State.game;
  if (!g || !g.bases[0] || g.bases[1]) return;
  if (!g.pitch || g.pitch.swung || g.play) return;
  const runner = g.bases[0];
  const pitcher = currentPitcher();
  g.pitch.swung = true;
  endAtBatCleanup();
  addLog(`${runner.n} breaks for 2nd.`);
  showCallout('STEAL ATTEMPT', 'sub');
  const odds = clamp(0.35 + (runner.spd - 60)/200 - (pitcher.con - 55)/300, 0.15, 0.9);
  const success = Math.random() < odds;
  setTimeout(() => {
    if (success) {
      g.bases[0] = null;
      g.bases[1] = runner;
      g.stats.sb[runner.k] = (g.stats.sb[runner.k] || 0) + 1;
      addLog(`SAFE. ${runner.n} takes 2nd.`);
      showCallout('STOLEN BASE', 'hit');
    } else {
      g.bases[0] = null;
      g.outs++;
      addLog(`CAUGHT STEALING. ${runner.n} tagged out. ${g.outs} out.`);
      showCallout('CAUGHT STEALING', 'strike');
    }
    refreshHud();
    if (g.outs >= 3) return setTimeout(endHalfInning, 1200);
    setTimeout(nextPitch, 1400);
  }, 900);
}

function addLog(text, big=false) {
  const g = State.game;
  g.log.push({ text, big });
}

/* ============================================================================
   RESULT SCREEN
   ============================================================================ */
function renderResult() {
  const g = State.game;
  const you = g.away.isYou ? g.away : g.home;
  const foe = g.away.isYou ? g.home : g.away;
  const win = you.score > foe.score;

  const s = el('div','screen');
  s.appendChild(el('h2', null, g.forfeit ? 'Game abandoned.' : win ? 'You win.' : 'You lose.'));

  /* Headline: final score, with a note when the ending had a name. */
  const head = el('div','card');
  const note = g.forfeit
    ? `Left in the ${ordinal(g.inning)} inning. It counts as a loss.`
    : g.walkoff ? 'Walk-off win.'
    : g.mercy ? `Mercy rule: a lead of ${MERCY_RUNS} from the ${ordinal(mercyFrom(g))} inning on ends the game.`
    : g.inning > g.innings ? `Decided in ${g.inning} innings.`
    : '';
  head.innerHTML =
    `<h3>Final</h3>`
    + `<p style="font-size:18px;color:var(--text)">${you.name} <b style="color:var(--gold)">${you.score}</b>`
    + ` &nbsp;·&nbsp; ${foe.name} <b>${foe.score}</b></p>`
    + (note ? `<p style="color:var(--gold)">${note}</p>` : '');
  s.appendChild(head);

  /* Anything unlocked by this game gets its own celebration card. */
  if (g.freshUnlocks && g.freshUnlocks.length) {
    const uc = el('div','card');
    uc.style.borderColor = 'var(--gold)';
    uc.appendChild(el('h3', null, g.freshUnlocks.length > 1 ? 'New characters unlocked' : 'New character unlocked'));
    const grid = el('div','roster');
    for (const k of g.freshUnlocks) {
      const c = ROSTER_BY_KEY[k];
      if (!c) continue;
      const cc = el('div','charcard');
      cc.style.cursor = 'default';
      cc.appendChild(spriteCanvas(c, 64));
      cc.appendChild(el('div','name', c.n));
      cc.appendChild(el('div','role', c.role));
      if (c.note) cc.appendChild(el('div','quirk', c.note));
      grid.appendChild(cc);
    }
    uc.appendChild(grid);
    s.appendChild(uc);
  }

  /* Line score: runs per inning for both sides, the way a real board reads. */
  const lsCard = el('div','card');
  lsCard.appendChild(el('h3', null, 'Line score'));
  const innCount = Math.max(g.innings, g.lineScore.away.length, g.lineScore.home.length);
  const lsWrap = el('div','linescore');
  const lsT = document.createElement('table');
  let head1 = '<thead><tr><th></th>';
  for (let i = 1; i <= innCount; i++) head1 += `<th>${i}</th>`;
  head1 += '<th>R</th></tr></thead>';
  let body = '<tbody>';
  for (const side of ['away','home']) {
    const team = g[side];
    body += `<tr><td class="team">${team.name}${team.isYou ? ' *' : ''}</td>`;
    for (let i = 0; i < innCount; i++) {
      const v = g.lineScore[side][i];
      body += `<td>${v == null ? '' : v}</td>`;
    }
    body += `<td class="r">${team.score}</td></tr>`;
  }
  body += '</tbody>';
  lsT.innerHTML = head1 + body;
  lsWrap.appendChild(lsT);
  lsCard.appendChild(lsWrap);
  s.appendChild(lsCard);

  /* Batting lines for BOTH lineups, so the box score is a real box score. */
  const batTable = (team) => {
    const t = el('table','table');
    t.innerHTML = '<thead><tr><th>Batter</th><th class="n">AB</th><th class="n">H</th>'
                + '<th class="n">HR</th><th class="n">K</th><th class="n">SB</th><th class="n">AVG</th></tr></thead>';
    const tb = el('tbody');
    let any = false;
    for (const b of team.batters) {
      const ab = g.stats.ab[b.k] || 0;
      const h  = g.stats.hits[b.k] || 0;
      const hr = g.stats.hr[b.k] || 0;
      const so = g.stats.so[b.k] || 0;
      const sb = (g.stats.sb && g.stats.sb[b.k]) || 0;
      if (!ab && !h && !sb) continue;
      any = true;
      const avg = ab ? (h/ab).toFixed(3).replace(/^0/,'') : '.000';
      const tr = el('tr');
      tr.innerHTML = `<td>${b.n}</td><td class="n">${ab}</td><td class="n">${h}</td>`
                   + `<td class="n">${hr}</td><td class="n">${so}</td><td class="n">${sb}</td>`
                   + `<td class="n">${avg}</td>`;
      tb.appendChild(tr);
    }
    if (!any) {
      const tr = el('tr');
      tr.innerHTML = '<td colspan="7" style="color:var(--text-dim)">No plate appearances recorded.</td>';
      tb.appendChild(tr);
    }
    t.appendChild(tb);
    return t;
  };

  for (const team of [you, foe]) {
    const c = el('div','card');
    c.appendChild(el('h3', null, `${team.name} batting`));
    c.appendChild(batTable(team));
    /* Pitching line: the first pick on each roster takes the mound. */
    const opp = team === you ? foe : you;
    const p = team.batters[0];
    const oppK = opp.batters.reduce((a,b) => a + (g.stats.so[b.k] || 0), 0);
    const oppH = opp.batters.reduce((a,b) => a + (g.stats.hits[b.k] || 0), 0);
    c.appendChild(el('p', null,
      `<b style="color:var(--gold)">${p.n}</b> pitching: ${opp.score} runs, ${oppH} hits, ${oppK} strikeouts.`));
    s.appendChild(c);
  }

  const row = el('div','btn-row');
  if (State.mode === 'exhibition') {
    const again = el('button','btn','Play Again');
    again.onclick = () => { State.opponent = randomOpponent(null); startGame({ mode:'exhibition' }); };
    const menu = el('button','btn ghost','Main Menu');
    menu.onclick = () => { State.game = null; State.screen='menu'; render(); };
    row.append(again, menu);
  } else if (State.mode === 'season') {
    const hub = el('button','btn','Continue');
    hub.onclick = () => { State.game = null; State.screen='season-hub'; render(); };
    row.append(hub);
  } else if (State.mode === 'playoff') {
    const b = el('button','btn','Back to Bracket');
    b.onclick = () => { State.game = null; State.screen='bracket'; render(); };
    row.append(b);
  } else if (State.mode === 'cup') {
    const b = el('button','btn','Back to Bracket');
    b.onclick = () => { State.game = null; State.screen='cup'; render(); };
    row.append(b);
  }
  s.appendChild(row);

  app.appendChild(s);
}

/* ============================================================================
   HOW TO PLAY
   Everything a first-time player needs: what the meter does, what the two
   picks mean when they are pitching, the two fielding minigames, base
   running, and how a season is shaped.
   ============================================================================ */
function renderHowTo() {
  const s = el('div','screen');
  s.appendChild(el('h2', null, 'How to play'));

  const bat = el('div','card');
  bat.innerHTML =
      '<h3>Batting</h3>'
    + '<p>A marker sweeps left to right across the meter under the field. '
    + 'Click anywhere, press <b>Space</b>, or tap the big SWING button to swing.</p>'
    + '<p><b>Green zone:</b> solid contact. The closer to the middle, the better '
    + 'the ball is struck. <b>Yellow band:</b> a piece of it, usually a foul or '
    + 'weak contact. <b>Outside both:</b> a swing and a miss.</p>'
    + '<p>The pitch reaches the plate exactly when the marker crosses the green, '
    + 'so you can watch the ball or watch the meter. During GET READY the pitcher '
    + 'is still winding up and swings are ignored.</p>'
    + '<p>Before each pitch, choose your swing with the buttons or keys <b>1/2/3</b>: '
    + '<b>Contact</b> widens the green zone but trades power away, <b>Power</b> '
    + 'narrows it and swings for the fences, and <b>Bunt</b> lays one down: runners '
    + 'move up a base, a fast batter can beat the throw, and a badly timed bunt '
    + 'goes foul (with two strikes, that is a strikeout).</p>'
    + '<p>Pitches behave differently: a <b>fastball</b> comes in hard and straight, '
    + 'a <b>curveball</b> breaks late, a <b>screwball</b> breaks the other way, '
    + 'a <b>changeup</b> floats and dies, a <b>slowball</b> drops in on a rainbow, '
    + 'the <b>knuckler</b> flutters so hard even the pitcher cannot say where the '
    + 'zone sits, and <b>The Heat</b> is simply faster than everything else.</p>';
  s.appendChild(bat);

  const pitch = el('div','card');
  pitch.innerHTML =
      '<h3>Pitching</h3>'
    + '<p>When the other team bats, you are on the mound. Each windup you make '
    + 'two picks: the <b>pitch type</b> and the <b>location</b> on a three by three '
    + 'strike zone grid. Every pitcher owns a personal three pitch repertoire, so '
    + 'the buttons change with whoever you put on the mound, and so does what the '
    + 'other team throws at you.</p>'
    + '<p><b>Middle:</b> always a strike, but easy for the hitter to square up. '
    + '<b>Edges and corners:</b> much harder to hit, but your pitcher can miss the '
    + 'spot and the umpire calls a ball. Better control means you hit your spot '
    + 'more often.</p>'
    + '<p>Every batter has a hidden weak pitch. Find it and their timing falls apart. '
    + 'No pick within five seconds and the pitcher shakes off the sign and throws '
    + 'his own choice.</p>'
    + '<p>Pitchers tire. Past the third inning the chip above the mound reads WARM, '
    + 'then TIRING, then GASSED, and a tired arm loses the plate.</p>';
  s.appendChild(pitch);

  const field = el('div','card');
  field.innerHTML =
      '<h3>Fielding</h3>'
    + '<p><b>Ground balls:</b> a timing bar appears at the bottom of the field. '
    + 'Hit the green for the out, the yellow lets the batter beat the throw for an '
    + 'infield single, and a miss is a throwing error that lets every runner take '
    + 'an extra base.</p>'
    + '<p><b>Fly balls:</b> a ring shrinks over the landing spot. Click or press '
    + 'Space when it is tightest to make the catch. Slightly off and the ball drops '
    + 'in for a single; badly off and it sails over the fielder for a triple.</p>'
    + '<p>Your fielders\' defense ratings widen both safe windows, so a strong '
    + 'defensive lineup is easier to play.</p>';
  s.appendChild(field);

  const run = el('div','card');
  run.innerHTML =
      '<h3>Base running</h3>'
    + '<p>With a runner on first and second base empty, a <b>Steal 2nd</b> button '
    + 'appears during the windup. Success depends on the runner\'s speed against the '
    + 'pitcher\'s control.</p>'
    + '<p>Fast runners are aggressive on hits: a quick runner on second will try to '
    + 'score on a single rather than stop at third. Sometimes they get thrown out '
    + 'at the plate. Speed lineups score more and risk more.</p>';
  s.appendChild(run);

  const chars = el('div','card');
  chars.innerHTML =
      '<h3>Characters</h3>'
    + '<p>Every character has Power, Speed, Contact, and Defense, and many carry a '
    + 'quirk that genuinely changes how they play. A few examples:</p>'
    + '<p><b>Lady Liberty</b> never runs: every real swing is a home run or a '
    + 'strikeout. <b>Mr. Hyde</b> transforms in about one at bat in six. '
    + '<b>Popeye</b> eats his spinach on his third trip to the plate. '
    + '<b>Father Time</b> slows the meter down. <b>The Phoenix</b> turns her first '
    + 'strikeout of the game into a walk. <b>Black Cat</b> makes fielders bobble. '
    + '<b>Dracula</b> and the <b>Werewolf</b> get stronger in late innings.</p>';
  s.appendChild(chars);

  const season = el('div','card');
  season.innerHTML =
      '<h3>Season</h3>'
    + '<p>Pick nine characters and play seven games against a rotating cast of '
    + 'opponent teams, each with its own park and its own batting personality: some '
    + 'hack at everything, some are patient.</p>'
    + '<p>The top four records make a single elimination playoff bracket. The higher '
    + 'seed hosts, and home teams get a small crowd boost. Your season saves to this '
    + 'browser automatically, so you can close the tab and come back.</p>'
    + '<h3>The Cup</h3>'
    + '<p>A short, high stakes alternative: eight teams, single elimination, three '
    + 'rounds. Quarterfinal, semifinal, final. Lose once and you are out. It has its '
    + 'own save, so a cup run never disturbs a season in progress.</p>'
    + '<h3>Unlocks</h3>'
    + '<p>A few characters start locked. Their card says exactly what to do to earn '
    + 'them, and progress carries across every game you play in any mode.</p>';
  s.appendChild(season);

  const row = el('div','btn-row');
  const back = el('button','btn','Back to Menu');
  back.onclick = () => { State.screen='menu'; render(); };
  row.appendChild(back);
  s.appendChild(row);

  app.appendChild(s);
}

function renderSeasonEnd() {
  const S = State.season;
  const P = S.playoffs;
  const champ = (P && P.final && P.final.result)
    ? P.seeds[P.final.result.winner]
    : null;
  const youWon = champ && champ.you;

  const s = el('div','screen');
  s.appendChild(el('h2', null, youWon ? 'Champions.' : 'Season complete.'));
  const card = el('div','card');
  card.innerHTML = `<p>${finishLine(S)}</p>`;
  if (champ) card.innerHTML += `<p>Champion: <b style="color:var(--gold)">${champ.name}</b></p>`;
  const ps = S.playerStats;
  card.innerHTML +=
    `<h3>Season totals</h3>`
    + `<p>Hits ${ps.hits} · HR ${ps.hr} · K ${ps.so} · AB ${ps.ab}</p>`;
  s.appendChild(card);

  const row = el('div','btn-row');
  const restart = el('button','btn','Play Again');
  restart.onclick = () => {
    clearSeason(); State.season = null; State.screen='menu'; render();
  };
  const menu = el('button','btn ghost','Main Menu');
  menu.onclick = () => {
    clearSeason(); State.season = null; State.screen='menu'; render();
  };
  row.append(restart, menu);
  s.appendChild(row);

  app.appendChild(s);
}

/* ============================================================================
   UTIL
   ============================================================================ */
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

/* Boot. The saved season is brought up to the current shape here, at the
   bottom, because the migration reads tables declared above this line and
   below the State object. Anything that throws here takes the whole page
   down with it, so a save this build cannot read is dropped rather than
   allowed to blank the app. */
try {
  State.season = migrateSeason(State.season);
} catch (e) {
  State.season = null;
}
render();
</script>
</body>
</html>
