<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Run The All-Stars</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0b1015" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1015'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle'%3E%E2%9A%BE%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    /* A 1980s baseball cabinet, not a dashboard. Scorecard cream, navy
       ink, arcade red. Every border is a real 2px line in the ink colour
       and every shadow is a HARD offset, because the whole retro read is
       flat colour and hard edges: a soft blurred shadow on a translucent
       hairline is the look this is getting away from. */
    --ink:#f1e2bb;        /* the page: warm card stock */
    --panel:#fffcf2;      /* a panel is a card laid on it */
    --panel-2:#ffeec0;    /* the same card, selected */
    --line:#1b3a5c;       /* navy. There are no hairlines here */
    --text:#14283f;
    --text-dim:#4d5f75;
    --gold:#cf3229;       /* the accent, and it is RED: gold on cream is
                             invisible, which is the whole reason the old
                             palette needed a dark ground under it */
    --red:#9e1e18;
    --green:#1b8a4a;
    --blue:#1566ae;
    --purple:#6b4296;
    --navy:#1b3a5c;
    --shadow:3px 3px 0 #1b3a5c;
    --shadow-sm:2px 2px 0 #1b3a5c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text);
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    min-height:100vh;overscroll-behavior-y:none;}
  body{
    background:
      repeating-linear-gradient(90deg, rgba(27,58,92,.05) 0 2px, transparent 2px 24px),
      radial-gradient(900px 520px at 50% -8%, #ffeaa8, transparent 62%),
      var(--ink);
  }
  /* The CRT. One overlay of scanlines across everything, and it is the
     single cheapest thing on this page that says arcade. */
  body::after{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
    background:repeating-linear-gradient(180deg,
      rgba(20,40,63,.055) 0 1px, transparent 1px 3px);
  }
  img.pico{image-rendering:pixelated;image-rendering:crisp-edges;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;}

  .wrap{max-width:920px;margin:0 auto;padding:14px 14px 60px;}
  .swing-modes{display:flex;align-items:center;gap:8px;margin:8px 0 2px;}
  .swing-modes .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);}
  .mode-btn{font:inherit;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:0;
    padding:6px 14px;cursor:pointer;font-weight:700;box-shadow:var(--shadow-sm);}
  .mode-btn:active{transform:translate(2px,2px);box-shadow:none;}
  .mode-btn.selected{background:var(--gold);color:#fff;}
  /* On the game screen the box opens up: the field is the point. */
  body.ingame .wrap{max-width:min(1560px, 98vw);}
  body.ingame #field{max-height:min(80vh, 900px);}
  .brand{display:flex;align-items:center;gap:10px;padding:8px 0 12px;
    border-bottom:3px solid var(--line);margin-bottom:4px;}
  .brand h1{margin:0;font-size:24px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold);font-weight:900;text-shadow:2px 2px 0 var(--navy);}
  .brand .tag{color:var(--text-dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;}
  .brand .spacer{flex:1;}
  .brand button{background:var(--panel);color:var(--text);border:2px solid var(--line);
    padding:5px 10px;font-family:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    cursor:pointer;border-radius:0;margin-left:6px;box-shadow:var(--shadow-sm);font-weight:700;}
  .brand button:hover{background:var(--panel-2);}
  .brand button:active{transform:translate(2px,2px);box-shadow:none;}

  .screen{padding:18px 0;}
  h2{margin:0 0 12px;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
  h3{margin:14px 0 6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);}
  p{margin:0 0 10px;color:var(--text-dim);line-height:1.5;font-size:13px;}

  .btn{display:inline-block;background:var(--gold);color:#fff6ea;border:2px solid var(--line);
    padding:10px 16px;font-family:inherit;font-size:13px;letter-spacing:.12em;
    text-transform:uppercase;cursor:pointer;border-radius:0;font-weight:900;
    box-shadow:var(--shadow);}
  .btn:hover{filter:brightness(1.08);}
  /* A cabinet button goes DOWN when you hit it: it travels onto its own
     shadow. Nothing else here says arcade for one line of CSS. */
  .btn:active{transform:translate(3px,3px);box-shadow:none;}
  .btn.ghost{background:var(--panel);color:var(--text);}
  .btn.ghost:hover{background:var(--panel-2);}
  .btn.red{background:var(--red);color:#fff;}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;box-shadow:var(--shadow);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

  .card{background:var(--panel);border:2px solid var(--line);border-radius:0;padding:14px;
    box-shadow:var(--shadow);}
  .card + .card{margin-top:12px;}

  .roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;}
  .charcard{background:var(--panel);border:2px solid var(--line);border-radius:0;padding:10px;
    cursor:pointer;transition:transform .08s;text-align:center;position:relative;
    box-shadow:var(--shadow-sm);}
  .charcard:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--navy);}
  .charcard.picked{background:var(--panel-2);box-shadow:3px 3px 0 var(--gold);}
  .charcard canvas{width:64px;height:auto;background:#bfe4f7;border:2px solid var(--line);
    border-radius:0;image-rendering:pixelated;}
  .charcard .name{margin-top:6px;font-size:12px;color:var(--text);letter-spacing:.06em;}
  .charcard .role{font-size:10px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;}
  .charcard .pickno{position:absolute;top:5px;right:5px;background:var(--gold);color:#fff;
    font-size:10px;padding:2px 5px;border-radius:0;font-weight:900;border:1px solid var(--line);}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px;font-size:10px;color:var(--text-dim);}
  .statgrid span b{color:var(--text);}
  .quirk{margin-top:6px;padding-top:6px;border-top:2px dashed rgba(27,58,92,.35);font-size:10px;color:var(--purple);line-height:1.4;}
  .charcard.locked{opacity:.55;cursor:not-allowed;}
  .charcard.locked canvas{filter:grayscale(1) brightness(.7);}
  .charcard.locked:hover{transform:none;box-shadow:var(--shadow-sm);}
  .quirk.lockhint{color:var(--gold);}

  .toggle-row{display:flex;gap:6px;flex-wrap:wrap;}
  .toggle{padding:8px 12px;background:var(--panel);border:2px solid var(--line);border-radius:0;
    cursor:pointer;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text);
    font-weight:700;box-shadow:var(--shadow-sm);}
  .toggle:active{transform:translate(2px,2px);box-shadow:none;}
  .toggle.on{background:var(--gold);color:#fff;}

  /* Game.
     The field takes as much room as possible and the meter, HUD, and stat
     rail sit around it. On desktop the field is a wide inset panel that
     centers the diamond; on mobile it stacks. A single callout overlay
     hangs above the field for hit and inning events (READY, STRIKE, HOME
     RUN, and so on). */

  .arena{
    position:relative;
    background:#7fc9ea;
    border:4px solid var(--line);
    border-radius:0;
    padding:0;
    overflow:hidden;
    margin-bottom:12px;
    box-shadow:5px 5px 0 var(--navy);
  }
  #field{
    display:block;
    width:100%;
    aspect-ratio:16/11;
    max-height:min(72vh, 720px);
    background:transparent;
  }
  /* Each corner is a PLACARD bolted to the screen, not floating text.
     Dark text with a light halo reads on grass and disappears on a red
     outfield wall, and which wall a park has is the park's business. */
  .arena .corner{position:absolute;pointer-events:none;padding:6px 10px;
    font-family:inherit;text-transform:uppercase;letter-spacing:.12em;font-size:12px;
    font-weight:700;color:#0f2237;background:rgba(255,252,242,.94);
    border:2px solid var(--navy);}
  .arena .corner.park .lbl{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.2em;}
  .arena .corner.tl{top:8px;left:8px;text-align:left;}
  .arena .corner.tr{top:8px;right:8px;text-align:right;}
  .arena .corner.bl{bottom:8px;left:8px;text-align:left;}
  .arena .corner.br{bottom:8px;right:8px;text-align:right;}
  .arena .corner .lbl{display:block;color:#4d5f75;font-size:9px;letter-spacing:.16em;}
  .arena .corner .val{color:#0f2237;font-size:20px;font-weight:900;line-height:1.05;}
  .arena .corner .val.gold{color:var(--gold);}
  .arena .corner.br .val{color:#0f2237;font-size:14px;}

  .callout{
    position:absolute;
    top:38%;
    left:50%;
    transform:translate(-50%,-50%) scale(.9);
    padding:14px 30px;
    background:var(--panel);
    border:3px solid var(--line);
    border-radius:0;
    color:var(--gold);
    font-family:inherit;
    font-size:26px;
    font-weight:900;
    letter-spacing:.16em;
    text-transform:uppercase;
    pointer-events:none;
    opacity:0;
    transition:opacity .18s ease-out, transform .28s cubic-bezier(.2,.9,.2,1.2);
    box-shadow:5px 5px 0 var(--navy);
    white-space:nowrap;
    z-index:6;
  }
  .callout.on{opacity:1;transform:translate(-50%,-50%) scale(1);}
  /* No inset ring. At this plaque's size a 6px inset eats most of the
     fill, so HOME RUN came out as pale text on gold, which is the one
     callout that has to be readable from across the room. */
  .callout.homer{color:#fff6ea;background:var(--gold);font-size:32px;
    text-shadow:2px 2px 0 var(--navy);border-width:4px;}
  .callout.hit{color:#fff6ea;background:var(--green);text-shadow:2px 2px 0 var(--navy);}
  .callout.strike{color:#fff6ea;background:var(--red);text-shadow:2px 2px 0 var(--navy);}
  .callout.ball{color:#fff6ea;background:var(--blue);text-shadow:2px 2px 0 var(--navy);}
  .callout.sub{color:var(--text);font-size:18px;background:var(--panel);}

  @media (max-width:600px){
    .callout{font-size:18px;padding:10px 18px;}
    .callout.homer{font-size:22px;}
    .arena .corner{padding:4px 6px;font-size:10px;}
    .arena .corner .val{font-size:16px;}
    .arena .corner.br .val{font-size:11px;}
  }

  .plate-row{
    display:grid;grid-template-columns:1fr;gap:10px;align-items:stretch;
  }
  .meter-wrap{background:var(--panel);border:2px solid var(--line);border-radius:0;padding:10px 14px;
    box-shadow:var(--shadow);}
  .meter-wrap .label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);
    letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
  .meter-wrap .label b.pt{color:var(--gold);letter-spacing:.14em;}
  #meter{width:100%;height:44px;display:block;background:#0f2237;border:2px solid var(--line);
    border-radius:0;}
  .meter-wrap .hint{margin-top:6px;font-size:11px;color:var(--text-dim);
    letter-spacing:.08em;text-align:center;text-transform:uppercase;}
  .meter-wrap .hint b{color:var(--gold);}
  .pitch-select{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap;
    justify-content:center;}
  .pitch-select .lbl{color:var(--gold);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    display:block;margin-bottom:4px;text-align:center;}
  .pitch-select .btn{padding:8px 12px;font-size:11px;letter-spacing:.14em;}
  .pitch-select .col{display:flex;flex-direction:column;gap:4px;align-items:center;}
  .pitch-select .throw-hint{font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--text-dim);}
  .pitch-select .type-row{display:flex;gap:6px;}
  .zone-grid{display:grid;grid-template-columns:repeat(3,32px);grid-template-rows:repeat(3,32px);
    gap:2px;background:var(--navy);padding:3px;border:2px solid var(--line);
    border-radius:0;box-shadow:var(--shadow-sm);}
  .zone-grid button{background:#eadfc0;border:0;cursor:pointer;padding:0;transition:background .1s;}
  .zone-grid button:hover{background:#ffd44a;}
  .zone-grid button.corner{background:#d7c9a8;}
  .zone-grid button.mid{background:#bfe0c4;}
  .zone-grid button.center{background:#8fd0a0;}
  .zone-grid button.selected{background:var(--gold);}
  .swing-btn{display:none;width:100%;margin-top:10px;padding:16px;font-size:16px;
    background:var(--gold);color:#fff6ea;border:3px solid var(--line);border-radius:0;
    font-weight:900;letter-spacing:.28em;cursor:pointer;font-family:inherit;
    text-transform:uppercase;box-shadow:var(--shadow);}
  .swing-btn:active{transform:translate(3px,3px);box-shadow:none;}
  @media (max-width:900px){.swing-btn{display:block;}}

  .atbat{background:var(--panel);border:2px solid var(--line);border-radius:0;padding:10px 14px;
    display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);}
  .atbat .avatar{width:36px;height:auto;image-rendering:pixelated;}
  .atbat .who{font-size:14px;letter-spacing:.06em;}
  .atbat .who b{color:var(--gold);}
  .atbat .vs{font-size:11px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
  .atbat .count{margin-left:auto;font-size:16px;color:var(--text);letter-spacing:.14em;font-weight:700;}

  .log{background:var(--panel);border:2px solid var(--line);border-radius:0;padding:10px 14px;
    max-height:110px;overflow-y:auto;font-size:12px;line-height:1.6;color:var(--text-dim);
    box-shadow:var(--shadow);}
  .log .line{padding:1px 0;}
  .log .line.big{color:var(--gold);font-weight:700;letter-spacing:.05em;}

  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

  /* Line score: the classic ballpark board, one column per inning plus runs. */
  .linescore{display:flex;justify-content:center;margin-bottom:10px;overflow-x:auto;}
  .linescore table{border-collapse:collapse;background:var(--panel);border:2px solid var(--line);
    border-radius:0;overflow:hidden;font-size:13px;box-shadow:var(--shadow);}
  .linescore th,.linescore td{padding:4px 9px;text-align:center;
    font-variant-numeric:tabular-nums;border-left:1px solid rgba(27,58,92,.3);}
  .linescore th{color:var(--text-dim);font-weight:500;font-size:10px;letter-spacing:.1em;}
  .linescore td.team{text-align:left;color:var(--text-dim);letter-spacing:.08em;
    text-transform:uppercase;font-size:10px;border-left:0;white-space:nowrap;}
  .linescore td.r{color:var(--gold);font-weight:700;}
  .linescore td.cur{background:rgba(207,50,41,.16);}

  /* Result / hub */
  .table{width:100%;border-collapse:collapse;font-size:13px;}
  .table th,.table td{padding:6px 8px;text-align:left;border-bottom:1px solid rgba(27,58,92,.3);}
  .table th{color:var(--text-dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;}
  .table tr.you td{color:var(--gold);}
  .table td.n{text-align:right;font-variant-numeric:tabular-nums;}

  .bracket{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;}
  .bracket .col{display:flex;flex-direction:column;gap:10px;}
  .bracket .match{background:var(--panel);border:2px solid var(--line);border-radius:0;padding:8px 10px;
    font-size:12px;box-shadow:var(--shadow-sm);}
  .bracket .match .row{display:flex;justify-content:space-between;padding:2px 0;}
  .bracket .match .row.win{color:var(--gold);}
  .bracket .match .row.you{font-weight:700;}
  .bracket .arrow{color:var(--text-dim);font-size:18px;text-align:center;}

  /* Cup bracket: one column per round, matches spaced to fan outward. */
  .cupbracket{display:flex;gap:14px;align-items:stretch;overflow-x:auto;padding-bottom:4px;}
  .cupbracket .col{display:flex;flex-direction:column;justify-content:space-around;
    gap:10px;min-width:170px;flex:1;}
  .cupbracket .roundlbl{color:var(--text-dim);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;text-align:center;margin-bottom:2px;}
  .cupbracket .match{background:var(--panel);border:2px solid var(--line);
    border-radius:0;padding:7px 9px;font-size:12px;box-shadow:var(--shadow-sm);}
  .cupbracket .match .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;}
  .cupbracket .match .row.win{color:var(--gold);font-weight:700;}
  .cupbracket .match .row.you{text-decoration:underline;text-underline-offset:3px;}

  .banner{background:var(--panel-2);
    border:2px solid var(--line);border-radius:0;padding:10px 12px;margin-bottom:10px;
    font-size:13px;box-shadow:var(--shadow-sm);}
  .banner b{color:var(--gold);}

  /* The press room. A portrait, a name plate, and a line that types itself
     out: the whole screen is one plaque so it reads as a cut AWAY from the
     game rather than another panel on the same page. */
  .press{max-width:760px;margin:0 auto;cursor:pointer;user-select:none;}
  .press-stage{background:var(--panel);border:3px solid var(--line);box-shadow:5px 5px 0 var(--navy);}
  .press-portrait{background:linear-gradient(180deg,#bfe4f7,#8fd0e8);
    border-bottom:3px solid var(--line);display:flex;justify-content:center;
    align-items:flex-end;overflow:hidden;}
  .press-portrait canvas{display:block;image-rendering:pixelated;}
  .press-box{padding:12px 16px 14px;position:relative;min-height:132px;}
  .press-name{font-size:20px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;}
  .press-outlet{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-dim);
    padding-bottom:8px;margin-bottom:10px;border-bottom:2px solid rgba(27,58,92,.25);}
  .press-text{font-size:15px;line-height:1.65;color:var(--text);min-height:52px;}
  .press-more{position:absolute;right:14px;bottom:10px;color:var(--gold);font-size:14px;
    animation:pressblink 1s steps(2,start) infinite;}
  @keyframes pressblink{0%,60%{opacity:1}61%,100%{opacity:.15}}
  .press-choices{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .press-choices .btn{text-align:left;text-transform:none;letter-spacing:.04em;font-size:13px;}
  .press-bar{display:flex;justify-content:flex-end;margin-top:12px;}
  @media (max-width:600px){
    .press-portrait canvas{max-width:100%;}
    .press-name{font-size:16px;}
    .press-text{font-size:14px;}
  }

  /* Park cards: a three band mock of the park's own palette above the
     name, so the choice reads visually before it reads numerically. */
  .park-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
  .park-card{border:2px solid var(--line);background:var(--panel);cursor:pointer;
    box-shadow:var(--shadow-sm);padding:0 0 10px;transition:transform .08s;}
  .park-card:hover{transform:translate(-1px,-1px);}
  .park-card.on{background:var(--panel-2);box-shadow:3px 3px 0 var(--gold);}
  .park-card .pk-sky{height:48px;position:relative;border-bottom:2px solid var(--line);}
  .park-card .pk-wall{position:absolute;left:0;right:0;top:22px;height:9px;}
  .park-card .pk-grass{position:absolute;left:0;right:0;top:31px;bottom:0;}
  .park-card .pk-name{font-size:13px;font-weight:900;letter-spacing:.1em;
    text-transform:uppercase;padding:8px 10px 2px;}
  .park-card .pk-blurb{font-size:11px;line-height:1.45;color:var(--text-dim);padding:0 10px 6px;}
  .park-card .pk-effect{font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--gold);font-weight:700;padding:0 10px;}

  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:640px){
    .row-2{grid-template-columns:1fr;}
    .plate-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>Run The All-Stars</h1>
    <span class="tag">Public domain baseball</span>
    <span class="spacer"></span>
    <button id="btn-mute" title="Toggle sound"></button>
    <button id="btn-home">Main Menu</button>
  </div>
  <div id="app"></div>
</div>

<script>
"use strict";

/* ============================================================================
   ROSTER
   Twenty-three public domain characters. Stat scale 1 to 100.

   Sprites are generated, not stored here: see allstars/gen_sprites_v2.py
   and the V2_SPRITES table below. A roster row carries only what the GAME
   needs (name, role, stats, quirk, flavour note); what a character LOOKS
   like is a spec in the generator.

   A `quirk` field, when present, hooks a mechanic in the sim engine
   (see startAtBat, throwPitch, and resolveSwing). Everyone else plays by
   the same rules.
   ============================================================================ */


const ROSTER = [
  /* ---------------- POWER HITTERS ---------------- */

  { k:'kong', n:'King Kong', role:'Power', pow:99, spd:8, con:45, def:40, quirk:null,
    note:'Legendary long ball, cannot run to save his life.',
  },

  { k:'franky', n:'Frankenstein', role:'Power', pow:97, spd:20, con:40, def:55, quirk:null,

    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g); g.connect(bus);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  },
  noise(dur, opts = {}) {
    const ctx = this.ensure(); const bus = this.bus();
    if (!ctx || !bus) return;
    const t0 = ctx.currentTime + (opts.delay || 0);
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filt = ctx.createBiquadFilter();
    filt.type = opts.filter || 'highpass';
    filt.frequency.value = opts.freq || 2000;
    const g = ctx.createGain();
    const vol = opts.vol || 0.3;
    g.gain.setValueAtTime(vol, t0);
    if (opts.swell) {
      g.gain.setValueAtTime(0.001, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + dur * 0.3);
    }
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(filt); filt.connect(g); g.connect(bus);
    src.start(t0); src.stop(t0 + dur + 0.05);
  },
  play(name) {
    if (this.muted) return;
    try {
      switch (name) {
        case 'crack':
          this.noise(0.08, { filter:'highpass', freq: 1800, vol: 0.5 });
          this.tone(180, 0.06, { type:'triangle', vol: 0.25 });
          break;
        case 'foul':
          this.noise(0.05, { filter:'highpass', freq: 2400, vol: 0.3 });
          break;
        case 'whiff':
          this.tone(320, 0.16, { type:'sawtooth', slideTo: 90, vol: 0.10 });
          break;
        case 'strike':
          this.tone(220, 0.10, { vol: 0.14 });
          this.tone(175, 0.16, { vol: 0.14, delay: 0.10 });
          break;
        case 'ball':
          this.tone(440, 0.07, { type:'sine', vol: 0.12 });
          break;
        case 'catch':
          this.tone(880, 0.05, { type:'sine', vol: 0.16 });
          this.noise(0.04, { filter:'lowpass', freq: 900, vol: 0.25 });
          break;
        case 'cheer':
          this.noise(0.7, { filter:'bandpass', freq: 1000, vol: 0.22, swell: true });
          break;
        case 'aww':
          this.tone(300, 0.28, { type:'sine', slideTo: 200, vol: 0.10 });
          break;
        case 'homer': {
          /* an original little triad fanfare, composed here */
          const seq = [ [523, 0.00], [659, 0.11], [784, 0.22], [1047, 0.35] ];
          for (const [f, d] of seq) this.tone(f, 0.16, { vol: 0.16, delay: d });
          this.tone(1047, 0.5, { vol: 0.12, delay: 0.52 });
          this.noise(1.4, { filter:'bandpass', freq: 1000, vol: 0.26, swell: true, delay: 0.1 });
          break;
        }
        case 'inning':
          this.tone(392, 0.10, { vol: 0.10 });
          this.tone(494, 0.10, { vol: 0.10, delay: 0.11 });
          this.tone(587, 0.16, { vol: 0.10, delay: 0.22 });
          break;
      }
    } catch (e) { /* audio unavailable: stay silent */ }
  },
  /* -------- 8-bit ambient background loop --------
     A pentatonic sequence in the key of D that loops indefinitely
     while the game screen is up. Uses a low square-wave bass and a
     tinkling triangle melody. Volume ducks against action sounds by
     living on its own gain. Mute stops it; toggling on restarts it. */
  music: {
    ctx: null,
    bus: null,
    playing: false,
    stopper: null,
    start(sound) {
      if (this.playing) return;
      const ctx = sound.ensure();
      if (!ctx || sound.muted) return;
      this.ctx = ctx;
      this.bus = ctx.createGain();
      this.bus.gain.value = 0.06;   /* quieter than SFX */
      this.bus.connect(sound.bus());
      /* Notes in the D pentatonic (D E F# A B) */
      const melody = [ 587, 660, 740, 880, 660, 587, 740, 880,   /* eight beats */
                       988, 880, 740, 660, 587, 740, 880, 988 ];
      const bass = [ 147, 147, 220, 220, 165, 165, 147, 147 ];
      let step = 0;
      const beatSec = 0.35;
      const schedule = () => {
        if (!sound.muted && this.playing) {
          const t = ctx.currentTime;
          /* melody: eight beats per bar */
          for (let i = 0; i < 8; i++) {
            const note = melody[(step + i) % melody.length];
            this.playNote(note, t + i * beatSec, beatSec * 0.75, 'triangle', 0.5);
          }
          for (let i = 0; i < 8; i++) {
            const note = bass[(Math.floor(step / 2) + i) % bass.length];
            this.playNote(note, t + i * beatSec, beatSec * 0.9, 'square', 0.35);
          }
          step += 8;
        }
      };
      schedule();
      this.stopper = setInterval(schedule, beatSec * 8 * 1000);
      this.playing = true;
    },
    stop() {
      if (this.stopper) { clearInterval(this.stopper); this.stopper = null; }
      if (this.bus) { try { this.bus.disconnect(); } catch(e){} this.bus = null; }
      this.playing = false;
    },
    playNote(freq, when, dur, type, vol) {
      const ctx = this.ctx;
      if (!ctx || !this.bus) return;
      const osc = ctx.createOscillator();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, when);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, when);
      g.gain.linearRampToValueAtTime(vol, when + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, when + dur);
      osc.connect(g); g.connect(this.bus);
      osc.start(when); osc.stop(when + dur + 0.02);
    },
  },
};

const UNLOCKS = {
  kong:      { how:'Hit 6 home runs in a season.',        check:(p)=> (p.seasonHR|0) >= 6 },
  liberty:   { how:'Win a playoff game.',                  check:(p)=> (p.playoffWins|0) >= 1 },
  dragon:    { how:'Win the championship.',                check:(p)=> (p.titles|0) >= 1 },

  fathertime:{ how:'Play a full 9 inning game.',           check:(p)=> (p.nineInningGames|0) >= 1 },
};
const PROGRESS = Object.assign(
  { seasonHR:0, playoffWins:0, titles:0, comebacks:0, blowouts:0, nineInningGames:0, unlocked:[] },
  PREFS.progress || {}
);
function saveProgress() {
  PREFS.progress = PROGRESS;
  try {
    const cur = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
    cur.progress = PROGRESS;
    localStorage.setItem(PREFS_KEY, JSON.stringify(cur));
  } catch (e) {}
}
function isUnlocked(k) {
  if (!UNLOCKS[k]) return true;              /* not a locked character */
  return PROGRESS.unlocked.indexOf(k) !== -1;
}
/* Re-evaluate every locked character against current progress. Returns the
   list of keys newly unlocked by this call, so the caller can celebrate. */
function refreshUnlocks() {
  const fresh = [];
  for (const k of Object.keys(UNLOCKS)) {
    if (PROGRESS.unlocked.indexOf(k) === -1 && UNLOCKS[k].check(PROGRESS)) {
      PROGRESS.unlocked.push(k);
      fresh.push(k);
    }
  }
  if (fresh.length) saveProgress();
  return fresh;
}

/* Leaving a live game. An exhibition is a pick up game and just stops. A
   season, playoff or cup game COUNTS: it is filed as a loss at the score it
   stood at, and the confirm says so, because the old behaviour recorded
   nothing and "End Game" was a free replay of any afternoon going badly.
   Returns false if the player changed their mind. */
function abandonGame() {
  const g = State.game;
  if (!g || !g.live) { State.game = null; return true; }
  const counts = State.mode !== 'exhibition';
  const you = g.away.isYou ? g.away : g.home;
  const foe = g.away.isYou ? g.home : g.away;
  const msg = counts
    ? `End this game? It counts as a loss, ${you.score} to ${foe.score} as it stands.`
    : 'End this game and return to the menu?';
  if (!confirm(msg)) return false;
  endAtBatCleanup();
  Sound.music.stop();
  if (!counts) { State.game = null; return true; }
  g.forfeit = true;
  finishGame();
  return true;
}

/* A speaker is a pundit or one of your own nine. Roster players get their
   own name, their position on YOUR club as the outlet, and a colour off
   their role, so the clubhouse reads as a different room to the press box. */
function pressSpeaker(key) {
  if (PRESS_CAST[key]) return PRESS_CAST[key];
  const c = ROSTER.find(r => r.k === key);
  if (!c) return PRESS_CAST.tracy;

/* ------------------------------------------------------------------ rivalry
   Opponents do not repeat inside a seven game schedule, so a rivalry that
   only remembered this season would never once fire. It reads the playoff
   rematch first, which is the common case, then a lifetime record kept in
   PROGRESS, which is what makes a fourth straight loss to the same club land
   the way it should. Null when there is no story, and lines that use it are
   filtered out on null rather than dressing up a first meeting as history. */
function pressRival(foeName) {
  const S = State.season;
  if (S && S.results) {
    const prior = S.results.filter(r => r.opponent === foeName);
    if (prior.length) {
      const p = prior[prior.length - 1];
      return p.win
        ? `you took them ${p.you} to ${p.them} in the regular season`
        : `they took you ${p.them} to ${p.you} in the regular season`;
    }
  }
  const v = (PROGRESS.vs || {})[foeName];
  if (v && (v.w + v.l) >= 3) {
    if (v.w === 0) return `you have never beaten this club, ${v.w} and ${v.l} all time`;
    if (v.l === 0) return `you have never lost to this club, ${v.w} and ${v.l} all time`;
    return `you are ${v.w} and ${v.l} against them all time`;
  }
  return null;
}
function pressBumpRival(foeName, win) {
  PROGRESS.vs = PROGRESS.vs || {};
  const v = PROGRESS.vs[foeName] || (PROGRESS.vs[foeName] = { w:0, l:0 });
  if (win) v.w++; else v.l++;
}

/* A portrait is the sprite's own head, blown up. The head is rows 1 to 25
   of the fifty row sprite, so the panel scales to those and crops the rest;
   drawing the whole figure in a bust frame gives you a full body the size
   of a thumbnail, which is not a portrait. */
function pressPortrait(key, w, h) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const scale = h / 24;
  const sw = Math.max(8, Math.round(32 * scale));
  const spr = heroSpriteCanvas(key, sw, 'idle');
  ctx.drawImage(spr, Math.round(w / 2 - sw / 2), Math.round(-1.5 * scale));
  return cv;
}

/* The press REMEMBERS. Every answer is stored on the season and the next
   scene can open on it, which is the entire reason a choice is worth having
   here: it does not need to change the baseball to change the story. */
const PRESS_CALLBACK = {
  brash:  [["tracy", "Last time we spoke you talked a big game. The tape is still on my desk."],
           ["medusa", "You said something bold to a reporter recently. Bold is a bill that arrives later."]],
  humble: [["tracy", "You gave me nothing last time. I respect it and I resent it."],
           ["mrsclaus", "You were very gracious the other day. I have not stopped thinking about it."]],
  silent: [["tracy", "You said no comment. So I wrote the piece myself. You loved it. I said so in the piece."]],
  petty:  [["lupin", "You made an enemy in the press room. I collect those. Yours is very good."],
           ["krampus", "You were unkind to somebody recently. I have added you to a different list. A nicer list."]],
};

function pressPick(pool, n) {
  const a = pool.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, n);
}
function pressFill(t, c) {
  /* A slot with nothing behind it is stripped, never printed. Showing a
     player the literal text {star} is the single most immersion breaking
     thing a system like this can do. */
  return String(t).replace(/\{(\w+)\}/g, (m, k) => (c[k] != null ? c[k] : ''))
                  .replace(/\s{2,}/g, ' ').trim();
}

/* A line may only be chosen if the context can fill every slot it uses.
   This is the real guard: one of the blowout lines names {star}, and on a
   night when nobody had two hits there is no star, so without this the
   pundit says "was the difference" about nobody. Gating the star POOL was
   not enough, because the slot also appears outside it. */
function pressUsable(pool, c) {
  return pool.filter((entry) => {
    const text = Array.isArray(entry) ? entry[1] : entry.text;
    const slots = String(text).match(/\{(\w+)\}/g) || [];
    return slots.every(m => c[m.slice(1, -1)] != null);
  });
}

/* Build the cast of beats for a moment. ctx carries what happened. */
function pressScene(kind, c) {
  const beats = [];
  const add = (arr) => { for (const [who, text] of arr) beats.push({ who, text: pressFill(text, c) }); };
  const pick = (pool, n) => pressPick(pressUsable(pool, c), n);
  /* A voice from your own dugout. It takes a roster key rather than a cast
     key, which is why pressSpeaker exists: the clubhouse and the press box
     are the same screen with different name plates. */
  const clubhouse = (key, mood) => {
    if (!key) return;
    const line = mood ? mood[Math.floor(Math.random() * mood.length)] : PLAYER_LINES[key];
    if (line) beats.push({ who: key, text: pressFill(line, c) });
  };
  const myNine = (State.team || []).slice();
  const someone = () => myNine.length
    ? myNine[Math.floor(Math.random() * myNine.length)] : null;
  if (kind === 'mediaDay') {
    add(pick(PRESS.mediaDay, 3));
    const a = PRESS.openerAsk;
    beats.push({ who:a.who, text:pressFill(a.text, c), choices:a.choices.map(o => ({
      label: pressFill(o.label, c), tag:o.tag, reply: pressFill(o.reply, c) })) });
  } else if (kind === 'pregame') {
    const cb = c.lastTag && PRESS_CALLBACK[c.lastTag];
    if (cb && Math.random() < 0.6) add(pick(cb, 1));
    add(pick(PRESS.pregame[c.slot] || PRESS.pregame.mid, cb ? 1 : 2));
    if (Math.random() < 0.75) clubhouse(someone());
  } else if (kind === 'postgame') {
    add(pick(PRESS.postgame[c.slot] || PRESS.postgame.closeWin, 2));
    if (c.rivalNote) add(pick(PRESS.postgame.rival, 1));
    if (c.starKey) {
      /* The player who did it speaks BEFORE the analysis of what they did.
         The other way round is a press release. */
      clubhouse(c.starKey, PLAYER_MOOD.star);
      add(pick(PRESS.postgame.star, 1));
    } else if (Math.random() < 0.6) {
      clubhouse(someone(), c.won ? PLAYER_MOOD.win : PLAYER_MOOD.loss);
    }
    if (c.ask) {
      const asks = PRESS.askPool.filter(q => pressUsable(
        [q].concat(q.choices.map(o => ({ text: o.label + ' ' + o.reply }))), c
      ).length === q.choices.length + 1);
      const a = asks.length ? asks[Math.floor(Math.random() * asks.length)] : null;
      if (a)
      beats.push({ who:a.who, text:pressFill(a.text, c), choices:a.choices.map(o => ({
        label: pressFill(o.label, c), tag:o.tag, reply: pressFill(o.reply, c) })) });
    }
  } else if (kind === 'seasonEnd') {
    add(pick(PRESS.seasonEnd[c.slot] || PRESS.seasonEnd.good, 2));
  }
  return beats;
}


/* One place builds the slot values, so every line in every pool is talking
   about the same game. Split across the call sites they drift, and a pundit
   ends up quoting a score from the game before. */
function pressCtx(extra) {
  const S = State.season;
  const rec = S ? seasonRecord(S) : null;
  return Object.assign({
    team: State.teamName || 'your club',
    foe: (State.opponent && State.opponent.name) || 'the opposition',
    park: (currentTheme() || {}).park || 'the yard',
    city: (State.franchise && State.franchise.city) || null,
    rec: rec ? `${rec.w}-${rec.l}` : '0-0',
    gameNo: S ? S.results.length + 1 : 1,
    lastTag: S && S.press && S.press.lastTag,
    rivalNote: State.opponent ? pressRival(State.opponent.name) : null,
  }, extra || {});
}

/* Which postgame pool the result belongs in, most specific first: a walk
   off that is also a blowout is a walk off, and a shutout you lost is just
   a loss. Ordering this wrong is how you get a pundit calling a one run
   thriller a demolition. */
function pressResultSlot(g, win, margin) {
  if (win && g.walkoff) return 'walkoffWin';
  if (win && g.comeback) return 'comebackWin';
  const foe = g.away.isYou ? g.home : g.away;
  if (win && foe.score === 0) return 'shutoutWin';
  if (win) return margin >= 6 ? 'blowoutWin' : 'closeWin';
  return margin >= 6 ? 'blowoutLoss' : 'closeLoss';
}

/* The night's best bat on your side, by hits then home runs. Null when
   nobody did anything, because "{star} was the story" over an 0 for 4 is
   the kind of line that makes a whole system feel fake. */
function pressStar(g, you) {
  let best = null, bestScore = 0;
  for (const b of you.batters) {
    const hr = (g.stats.hr[b.k] || 0), h = (g.stats.hits[b.k] || 0);
    const sc = h + hr * 2;
    if (sc > bestScore) { bestScore = sc; best = b; }
  }
  /* The key comes back with the name because the star gets to answer for
     themselves in the clubhouse, and that needs the roster key, not a
     display string. */
  return bestScore >= 2 ? { name: best.n || best.k, key: best.k } : null;
}

/* Where the press is allowed to speak. Exhibition is a pick up game. */
function pressActive() { return State.mode === 'season' || State.mode === 'playoff' || State.mode === 'cup'; }

function pressPlay(kind, ctx, then) {
  if (!PREFS.cutscenes) { then(); return; }
  const beats = pressScene(kind, ctx);
  if (!beats.length) { then(); return; }
  State.cutscene = { beats, i: 0, then, ctx };
  State.screen = 'cutscene';
  render();
}

let pressTimer = 0;
function renderCutscene() {
  const C = State.cutscene;
  clearInterval(pressTimer);
  /* renderCutscene is only ever reached through render(), which empties the
     app node first. Advancing by calling it directly appends the next beat
     UNDER the last one and the conversation grows down the page, so every
     step below goes back through render(). */
  if (!C || C.i >= C.beats.length) {
    const then = C && C.then;
    State.cutscene = null;
    if (then) then(); else { State.screen = 'menu'; render(); }
    return;
  }
  const beat = C.beats[C.i];
  const cast = pressSpeaker(beat.who);
  const s = el('div','screen press');

  const stage = el('div','press-stage');
  const port = el('div','press-portrait');
  port.appendChild(pressPortrait(beat.who, 260, 200));
  stage.appendChild(port);

  const box = el('div','press-box');
  const nm = el('div','press-name', cast.name);
  nm.style.color = cast.color;
  box.appendChild(nm);
  box.appendChild(el('div','press-outlet', cast.outlet));
  const body = el('div','press-text');
  box.appendChild(body);
  const more = el('div','press-more', '&#9660;');
  box.appendChild(more);
  stage.appendChild(box);
  s.appendChild(stage);

  const bar = el('div','press-bar');
  const skip = el('button','btn ghost','Skip');
  skip.onclick = (e) => { e.stopPropagation(); clearInterval(pressTimer);
    C.i = C.beats.length; render(); };
  bar.appendChild(skip);
  s.appendChild(bar);
  app.appendChild(s);

  /* The typewriter. It is the whole feel of the thing: a line that simply
     appears is a label, and a line that arrives one character at a time is
     somebody talking. A click part way through finishes it rather than
     skipping it, because being made to wait for text you can already read
     is the fastest way to make a player hate a cutscene. */
  const full = beat.text;
  let n = 0, done = false;
  more.style.visibility = 'hidden';
  const finish = () => {
    clearInterval(pressTimer);
    body.textContent = full;
    done = true;
    if (beat.choices) showChoices(); else more.style.visibility = 'visible';
  };
  pressTimer = setInterval(() => {
    n += 1;
    body.textContent = full.slice(0, n);
    if (n >= full.length) finish();
  }, 18);

  function showChoices() {
    const wrap = el('div','press-choices');
    for (const opt of beat.choices) {
      const b = el('button','btn', opt.label);
      b.onclick = (e) => {
        e.stopPropagation();
        if (State.season) {
          State.season.press = State.season.press || { tags: [] };
          State.season.press.lastTag = opt.tag;
          State.season.press.tags.push(opt.tag);
          saveSeason(State.season);
        }
        Sound.play('ball');
        /* The reply becomes the next beat, so the answer lands in the same
           conversation instead of the screen simply ending on your line. */
        C.beats.splice(C.i + 1, 0, { who: beat.who, text: opt.reply });
        C.i += 1;
        render();
      };
      wrap.appendChild(b);
    }
    box.appendChild(wrap);
  }

  const advance = () => {
    if (!done) { finish(); return; }
    if (beat.choices) return;              /* a question waits for an answer */
    C.i += 1;
    render();
  };
  s.onclick = advance;
  s.tabIndex = 0;
  pressKeyHandler = (e) => {
    if (State.screen !== 'cutscene') return;
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); advance(); }
  };
}
let pressKeyHandler = null;
document.addEventListener('keydown', (e) => { if (pressKeyHandler) pressKeyHandler(e); });

/* The franchise's own park, as a full theme the field renderer can use. */
function franchiseTheme(F) {
  const P = PARKS[F && F.park] || PARKS.sandlot;
  return Object.assign({ park: F && F.parkName ? F.parkName : P.name, landmark(){} }, P.theme);
}
/* The factors in force for the game being played: your park when you are
   home, otherwise none. A visiting club does not carry its fences with it. */
function parkFactors() {
  const g = State.game;
  const F = State.franchise;
  if (!g || !F || !g.home || !g.home.isYou) return { hr:1, xbh:1, crowd:0 };
  const P = PARKS[F.park];
  return P ? { hr:P.hr, xbh:P.xbh, crowd:P.crowd } : { hr:1, xbh:1, crowd:0 };
}

function teamKitColor() {
  const F = State.franchise;
  return (F && KITS[F.kit]) ? KITS[F.kit].a : '#f4c25a';
}

function randomFranchise() {
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const city = pick(CITIES);
  return {
    city: city.n, nickname: pick(NICKNAMES), kit: Math.floor(Math.random() * KITS.length),
    park: pick(PARK_KEYS),
  };
}
function franchiseName(F) {
  return F ? `${F.city} ${F.nickname}` : 'Your Team';
}

function renderRoster() {
  const picked = new Set();
  const s = el('div','screen');
  s.appendChild(el('h2', null, State.mode === 'season' ? 'Build your season team' : 'Pick your lineup'));
  s.appendChild(el('p', null, 'Choose nine characters. First pick bats first and pitches.'));

  const card = el('div','card');
  const grid = el('div','roster');
  const cards = new Map();
  ROSTER.forEach(c => {
    const cc = el('div','charcard');
    const cv = spriteCanvas(c, 56);
    cc.appendChild(cv);
    cc.appendChild(el('div','name', c.n));
    cc.appendChild(el('div','role', `${c.role}`));
    const st = el('div','statgrid');
    st.innerHTML = `<span>POW <b>${c.pow}</b></span><span>SPD <b>${c.spd}</b></span>`
                 + `<span>CON <b>${c.con}</b></span><span>DEF <b>${c.def}</b></span>`;
    cc.appendChild(st);
    if (c.note) {
      const nt = el('div','quirk', c.note);
      cc.appendChild(nt);
    }
    /* Locked characters can't be drafted; the card says how to earn them. */
    const locked = !isUnlocked(c.k);
    if (locked) {
      cc.classList.add('locked');
      const lk = el('div','quirk lockhint', 'LOCKED: ' + UNLOCKS[c.k].how);
      cc.appendChild(lk);
    }
    cc.onclick = () => {
      if (locked) return;
      if (picked.has(c.k)) {
        picked.delete(c.k);
      } else if (picked.size < 9) {
        picked.add(c.k);
      }
      redraw();
      /* Ninth pick rolls straight into settings, per the design ask. The
         Continue button stays for the case where a player rearranges picks
         and it never fires. */
      if (picked.size === 9) {
        setTimeout(() => {
          State.team = [...picked];
          State.teamName = (nameInput.value || 'Your Team').slice(0,32);
          savePrefs();
          State.screen = 'settings';
          render();
        }, 220);
      }
    };
    grid.appendChild(cc);
    cards.set(c.k, cc);
  });
  card.appendChild(grid);
  s.appendChild(card);

  const foot = el('div','card');
  const counter = el('div', null);
  const founded = State.mode === 'season' && State.franchise;
  const nameLabel = el('label', null, founded ? '' : 'Team name: ');
  const nameInput = el('input', null);
  nameInput.type='text'; nameInput.maxLength = 32;
  nameInput.value = State.teamName || 'Your Team';
  if (founded) {
    /* The name was settled at the founding. A second box for it here is a
       second source of truth for the same string. */
    nameInput.type = 'hidden';
    nameLabel.innerHTML = `<span style="font-size:12px;letter-spacing:.1em;`
      + `text-transform:uppercase;color:var(--text-dim)">Drafting for</span> `
      + `<b style="letter-spacing:.06em">${State.teamName}</b>`;
  }
  Object.assign(nameInput.style, {
    background:'#fffcf2', border:'2px solid var(--line)', color:'var(--text)',
    padding:'6px 8px', borderRadius:'4px', fontFamily:'inherit', fontSize:'13px', marginLeft:'6px', width:'180px'
  });
  nameLabel.appendChild(nameInput);
  foot.appendChild(nameLabel);
  foot.appendChild(el('div', null, '<br>'));
  foot.appendChild(counter);
  const row = el('div','btn-row');
  const rand = el('button','btn ghost','Randomize');
  rand.onclick = () => {
    picked.clear();
    const bag = ROSTER.filter(c => isUnlocked(c.k)).sort(() => Math.random() - 0.5);
    bag.slice(0,9).forEach(c => picked.add(c.k));
    redraw();
    /* Same auto advance as the ninth click: nine is nine. */
    setTimeout(() => {
      State.team = [...picked];
      State.teamName = (nameInput.value || 'Your Team').slice(0,32);
      savePrefs();
      State.screen = 'settings';
      render();
    }, 300);
  };
  const go = el('button','btn','Continue');
  go.onclick = () => {
    if (picked.size !== 9) return;
    State.team = [...picked];
    State.teamName = (nameInput.value || 'Your Team').slice(0,32);
    State.screen = 'settings';
    render();
  };
  const back = el('button','btn ghost','Back');
  back.onclick = () => { State.screen = 'menu'; render(); };
  row.append(back, rand, go);
  foot.appendChild(row);
  s.appendChild(foot);

  app.appendChild(s);

  function redraw() {
    let n = 0;
    for (const c of ROSTER) {
      const cc = cards.get(c.k);
      if (picked.has(c.k)) { n++; cc.classList.add('picked'); cc.querySelector('.pickno')?.remove(); const b = el('div','pickno', [...picked].indexOf(c.k)+1); cc.appendChild(b); }
      else { cc.classList.remove('picked'); cc.querySelector('.pickno')?.remove(); }
    }
    counter.textContent = `${picked.size} of 9 selected`;
    go.disabled = picked.size !== 9;
  }
  redraw();
}

/* ============================================================================
   SEASON
   ============================================================================ */
function seasonRecord(season) {
  const w = season.results.filter(r => r.win).length;
  const l = season.results.filter(r => !r.win).length;
  return { w, l };
}
function randomOpponent(exclude) {
  const pool = OPPONENTS.filter(o => !exclude || o.name !== exclude);
  return pool[Math.floor(Math.random() * pool.length)];
}
function buildSchedule() {
  const bag = [...OPPONENTS].sort(() => Math.random() - 0.5);
  return bag.slice(0,7).map(o => o.name);
}
/* Four of the seven at home, alternating from the opener, so the park you
   chose is the one you see most. Before this every season game was played
   on the road: youHome was never passed and the franchise had a home park
   it never once played in. */
function buildHomeDates() {
  return [true, false, true, false, true, false, true];
}
function opponentByName(name) {
  return OPPONENTS.find(o => o.name === name);
}
/* ============================================================================
   THE CUP
   A standalone eight team single elimination tournament: quarterfinals,
   semifinals, final. No standings, no schedule, no regular season. Lose
   once and it is over, which makes it the short high stakes counterpart
   to the seven game season. Its own save slot so it never disturbs a
   season in progress.
   ============================================================================ */
function startCup() {
  const field = [...OPPONENTS].sort(() => Math.random() - 0.5).slice(0, 7);
  /* Seed the player first, then the seven drawn opponents. */
  const entrants = [{ name: State.teamName, roster: State.team, you: true }]
    .concat(field.map(o => ({ name: o.name, roster: o.roster })));
  State.cup = {
    team: State.team,
    teamName: State.teamName,
    innings: State.innings,
    difficulty: State.difficulty,
    entrants,
    /* Round of eight: 0v7, 1v6, 2v5, 3v4. Winners collapse upward. */
    rounds: [
      [ {a:0,b:7,result:null}, {a:1,b:6,result:null}, {a:2,b:5,result:null}, {a:3,b:4,result:null} ],
      [ {a:null,b:null,result:null}, {a:null,b:null,result:null} ],
      [ {a:null,b:null,result:null} ],
    ],
    done: false,
    champion: null,
  };
  saveCup(State.cup);
  State.screen = 'cup';
  render();
}

/* Fill in the next round's slots from the previous round's winners. */
function cupPropagate(C) {
  for (let r = 1; r < C.rounds.length; r++) {
    const prev = C.rounds[r-1];
    const cur = C.rounds[r];
    for (let i = 0; i < cur.length; i++) {
      const m1 = prev[i*2], m2 = prev[i*2+1];
      if (m1 && m1.result) cur[i].a = m1.result.winner;
      if (m2 && m2.result) cur[i].b = m2.result.winner;
    }
  }
  const fin = C.rounds[C.rounds.length-1][0];
  if (fin.result) { C.done = true; C.champion = fin.result.winner; }
}

/* The next match that still needs playing, and whether the player is in it. */
function nextCupMatch(C) {
  for (let r = 0; r < C.rounds.length; r++) {
    for (let i = 0; i < C.rounds[r].length; i++) {
      const m = C.rounds[r][i];
      if (m.result) continue;
      if (m.a == null || m.b == null) continue;   /* waiting on a feeder */
      const you = C.entrants[m.a].you || C.entrants[m.b].you;
      return { r, i, match: m, playerInvolved: you };
    }
  }
  return null;
}

function simulateCupMatch(C, nm) {
  const m = nm.match;
  const A = C.entrants[m.a], B = C.entrants[m.b];
  const ar = teamRating(A.roster), br = teamRating(B.roster);
  let as = Math.max(0, Math.round(4 + (ar - br)*0.06 + (Math.random()-0.5)*3));
  let bs = Math.max(0, Math.round(4 + (br - ar)*0.06 + (Math.random()-0.5)*3));
  if (as === bs) as += 1;   /* no ties in a knockout */
  m.result = { aScore: as, bScore: bs, winner: as > bs ? m.a : m.b };
}

function startCupMatch(C, nm) {
  const m = nm.match;
  const A = C.entrants[m.a], B = C.entrants[m.b];
  const youIsA = !!A.you;
  const you = youIsA ? A : B;
  const foe = youIsA ? B : A;
  State.team = you.roster;
  State.teamName = you.name;
  State.opponent = { name: foe.name, color: (opponentByName(foe.name)||{}).color || '#8a1a1a', roster: foe.roster };
  State.innings = C.innings;
  State.difficulty = C.difficulty;
  /* Higher seed (lower index) hosts. */
  const youHome = (youIsA ? m.a : m.b) < (youIsA ? m.b : m.a);
  State.mode = 'cup';
  const slot = nm.r >= C.rounds.length - 1 ? 'final' : 'playoff';
  pressPlay('pregame', pressCtx({ slot }),
            () => startGame({ mode:'cup', cupR: nm.r, cupI: nm.i, youHome }));
}

function startSeason() {
  State.season = {
    team: State.team,
    teamName: State.teamName,
    franchise: State.franchise || randomFranchise(),
    homeAt: buildHomeDates(),
    innings: State.innings,
    difficulty: State.difficulty,
    schedule: buildSchedule(),
    results: [],
    playoffs: null,
    playerStats: { hr:0, so:0, sb:0, hits:0, ab:0 },
    perPlayer: {},   /* per character running totals across the season */
    league: emptyLeague(),
    leagueSchedule: null,   /* filled below: it needs the schedule */
    leagueDone: 0,

  };

/* THE LEAGUE PLAYS WHEN YOU DO.
   These records used to be rolled out in full the moment a season started:
   every other club arrived at day one already 5-2, already finished, while
   you sat at 0-0 and worked through seven games to catch a table that had
   stopped moving. It reads as broken because it is: a standings table is a
   claim that these teams are in a season together.

   So the league gets a real schedule instead. Eighteen clubs, seven rounds,
   and on the day you play your opponent the other sixteen pair off and play
   each other. One round is simulated per game you finish, so the table below
   your record always shows the same number of games played as your own. */
function buildLeagueSchedule(mySchedule) {
  const rounds = [];
  for (let r = 0; r < 7; r++) {
    const pool = OPPONENTS.map(o => o.name).filter(n => n !== mySchedule[r]);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const pairs = [];
    for (let i = 0; i + 1 < pool.length; i += 2) pairs.push([pool[i], pool[i + 1]]);
    rounds.push(pairs);
  }
  return rounds;
}
function emptyLeague() {
  const out = {};
  for (const o of OPPONENTS) out[o.name] = { w: 0, l: 0, rd: 0 };
  return out;
}
/* One CPU game. A logistic on the rating gap rather than a threshold, so the
   better club is favoured without the worse one being unable to win. Comes
   back with a scoreline, because run differential is the second tiebreak and
   a table that breaks ties on a number nobody generated is a coin flip with
   a column header. */
function simulateLeagueGame(a, b) {
  const ra = teamRating((opponentByName(a) || {}).roster || []);
  const rb = teamRating((opponentByName(b) || {}).roster || []);
  const p = 1 / (1 + Math.exp(-(ra - rb) / 6));
  const winner = Math.random() < p ? a : b;
  const loser = winner === a ? b : a;
  const ls = Math.floor(Math.random() * 5);                 /* 0-4 */
  const ws = ls + 1 + Math.floor(Math.random() * 6);        /* by 1-6 */
  return { winner, loser, ws, ls };
}
/* Advance the league through one round. Guarded on leagueDone so a double
   call, a reload part way through, or a replayed save cannot run the same
   round twice and inflate the table. The player's own score comes in so the
   opponent's run differential is the real one. */
function advanceLeague(S, roundIdx, myFoe, iWon, myScore, foeScore) {
  if (!S.leagueSchedule || roundIdx < 0) return;
  if ((S.leagueDone | 0) > roundIdx) return;
  const bump = (n, win, rd) => {
    const t = S.league[n];
    if (!t) return;
    if (win) t.w++; else t.l++;
    t.rd = (t.rd | 0) + (rd | 0);
  };
  const haveScore = typeof myScore === 'number' && typeof foeScore === 'number';
  bump(myFoe, !iWon, haveScore ? foeScore - myScore : (iWon ? -3 : 3));
  for (const [a, b] of (S.leagueSchedule[roundIdx] || [])) {
    const r = simulateLeagueGame(a, b);
    bump(r.winner, true, r.ws - r.ls);
    bump(r.loser, false, r.ls - r.ws);
  }
  S.leagueDone = roundIdx + 1;
}

/* ONE ORDER FOR THE TABLE AND THE BRACKET.
   The hub sorted wins then losses; the seeding sorted wins then a fresh
   Math.random(). Two orders for the same eighteen clubs, so the hub could
   show you fourth and the bracket could leave you out, and the coin was
   tossed again every time the screen drew. Everything that ranks clubs now
   asks this, and the last resort is a coin stored on the season so it
   lands the same way on every screen.

   Order: wins, then run differential, then the stored coin. Head to head
   settles a TWO way tie only, after the sort: as a sort key it makes cycles
   (you beat X, Y out-scores you, X out-coins Y) and a comparator with a
   cycle in it hands back whatever order the engine felt like. Only the
   player's games are recorded, so it only ever separates you from one club. */
function standingsOrder(S) {
  const rec = seasonRecord(S);
  const myRd = S.results.reduce((a, r) => a + ((r.you | 0) - (r.them | 0)), 0);
  const rows = [{ name: S.teamName, roster: S.team, w: rec.w, l: rec.l, rd: myRd, you: true }];
  for (const o of OPPONENTS) {
    const t = S.league[o.name] || { w: 0, l: 0, rd: 0 };
    rows.push({ name: o.name, roster: o.roster, w: t.w, l: t.l, rd: t.rd | 0, you: false });
  }
  const coin = S.tiebreak || {};
  const h2h = (a, b) => {
    /* Positive when a beat b more than b beat a, over the games recorded. */
    const me = a.you ? a : (b.you ? b : null);
    if (!me) return 0;
    const other = me === a ? b : a;
    let d = 0;
    for (const r of S.results) if (r.opponent === other.name) d += r.win ? 1 : -1;
    return me === a ? d : -d;
  };
  rows.sort((a, b) =>
    (b.w - a.w) || (a.l - b.l) || (b.rd - a.rd)
    || ((coin[b.name] || 0) - (coin[a.name] || 0)));
  /* Two way ties go to the head to head result. */
  for (let i = 0; i + 1 < rows.length; i++) {
    const a = rows[i], b = rows[i + 1];
    const tiedPair = a.w === b.w && a.l === b.l
      && !(i > 0 && rows[i - 1].w === a.w && rows[i - 1].l === a.l)
      && !(i + 2 < rows.length && rows[i + 2].w === a.w && rows[i + 2].l === a.l);
    if (tiedPair && h2h(b, a) > 0) { rows[i] = b; rows[i + 1] = a; }
  }
  rows.forEach((r, i) => { r.rank = i + 1; });
  return rows;
}
/* The stored coin: one number per club, drawn once per season. */
function drawTiebreaks() {
  const out = {};
  for (const o of OPPONENTS) out[o.name] = Math.random();
  out[State.teamName] = Math.random();
  return out;
}
/* Where the player finished, and how far off the bracket. */
function seasonFinish(S) {
  const rows = standingsOrder(S);
  const me = rows.find(r => r.you);
  const fourth = rows[3];
  const short = fourth ? Math.max(0, fourth.w - me.w) : 0;
  return { rank: me.rank, of: rows.length, w: me.w, l: me.l, madeIt: me.rank <= 4,
           short, onTiebreak: me.rank > 4 && short === 0 };
}
/* "5th of 18" and the like, for the banners. */
function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
/* One sentence on where a finished regular season left the player. */
function finishLine(S) {
  const f = seasonFinish(S);
  if (f.madeIt) return `You finished ${ordinal(f.rank)} of ${f.of} at ${f.w}-${f.l}: in the bracket.`;
  const why = f.onTiebreak ? 'out on the tiebreak (head to head in a two way tie, then run differential)'
            : `${f.short} game${f.short === 1 ? '' : 's'} short of the bracket`;
  return `You finished ${ordinal(f.rank)} of ${f.of} at ${f.w}-${f.l}, ${why}.`;
}
/* A season saved before the league had a schedule carries a finished table
   and no way to know which games produced it. Rebuild one from the results
   it does have, so an in progress save comes back consistent rather than
   keeping a table that never matched. */
function migrateSeason(S) {
  if (!S) return S;
  /* A season saved before franchises existed has a name and nothing else,
     so it gets one built round the name it already has rather than being
     handed a city it never chose. */
  if (!S.franchise) {
    S.franchise = Object.assign(randomFranchise(), { nickname: S.teamName || 'Nine' });
    S.franchise.parkName = PARKS[S.franchise.park].name;
  }
  if (!S.homeAt) S.homeAt = buildHomeDates();
  if (!S.tiebreak) {
    /* Drawn once and kept, so the order never changes between screens. */
    S.tiebreak = {};
    for (const o of OPPONENTS) S.tiebreak[o.name] = Math.random();
    S.tiebreak[S.teamName] = Math.random();
  }
  if (S.league) for (const n of Object.keys(S.league)) if (S.league[n].rd == null) S.league[n].rd = 0;
  if (S.leagueSchedule) return S;
  S.leagueSchedule = buildLeagueSchedule(S.schedule || []);
  S.league = emptyLeague();
  S.leagueDone = 0;
  (S.results || []).forEach((r, i) => advanceLeague(S, i, r.opponent, r.win, r.you, r.them));
  return S;
}
function teamRating(keys) {
  const chars = keys.map(k => ROSTER_BY_KEY[k]);
  const off = chars.reduce((a,c) => a + c.pow*0.4 + c.con*0.4 + c.spd*0.2, 0) / 9;
  const def = chars.reduce((a,c) => a + c.def, 0) / 9;
  return off * 0.65 + def * 0.35;
}

function seedPlayoffs(S) {
  /* The same order the hub shows. If the table says fourth, the bracket
     says fourth. */
  const top4 = standingsOrder(S).slice(0, 4)
    .map(r => ({ name: r.name, roster: r.roster, w: r.w, you: r.you }));

    seeds: top4,

function nextPlayoffMatch(P) {
  for (let i=0;i<P.semis.length;i++) {
    const m = P.semis[i];
    if (!m.result) {
      const you = P.seeds[m.home].you || P.seeds[m.away].you;
      return { round:'semi', idx:i, match:m, playerInvolved: you };
    }
  }
  if (!P.final) {
    const winners = P.semis.map(m => m.result.winner);
    P.final = { home:winners[0], away:winners[1], result:null };
  }
  if (P.final && !P.final.result) {
    const you = P.seeds[P.final.home].you || P.seeds[P.final.away].you;
    return { round:'final', idx:0, match:P.final, playerInvolved: you };
  }
  return null;
}

function simulateCpuMatch(nm) {
  const P = State.season.playoffs;
  const m = nm.match;
  const home = P.seeds[m.home];
  const away = P.seeds[m.away];
  const hr = teamRating(home.roster);
  const ar = teamRating(away.roster);
  const homeAdv = 3;
  const hs = Math.max(0, Math.round(4 + (hr - ar)*0.06 + homeAdv*0.3 + (Math.random()-0.5)*3));
  const as = Math.max(0, Math.round(4 + (ar - hr)*0.06 + (Math.random()-0.5)*3));
  const finalHome = hs === as ? hs + 1 : hs;
  m.result = { homeScore:finalHome, awayScore:as, winner: finalHome > as ? m.home : m.away };
}

function startPlayoffMatch(nm) {
  const S = State.season;
  const P = S.playoffs;
  const m = nm.match;
  const home = P.seeds[m.home];
  const away = P.seeds[m.away];
  /* Home field advantage: the higher seed always hosts (the bracket
     puts home in the higher slot already). Player is home when their
     seed made them home. */
  const youHome = home.you;
  const you = youHome ? home : away;
  const foe = youHome ? away : home;
  State.team = you.roster;
  State.teamName = you.name;
  State.opponent = { name: foe.name, color: (opponentByName(foe.name)?.color) || '#8a1a1a', roster: foe.roster };
  State.innings = S.innings;
  State.difficulty = S.difficulty;
  State.mode = 'playoff';
  pressPlay('pregame', pressCtx({ slot: nm.round === 'final' ? 'final' : 'playoff' }),
            () => startGame({ mode:'playoff', round: nm.round, matchIdx: nm.idx, youHome }));
}

/* ============================================================================
   GAME
   ============================================================================ */
function startGame(opts) {
  resetCamera();
  const battersAway = State.team.map(k => ROSTER_BY_KEY[k]);
  const battersHome = State.opponent.roster.map(k => ROSTER_BY_KEY[k]);
  /* User bats AWAY (visitor), opponent home. In playoffs the flag flips. */
  const youHome = !!opts.youHome;
  State.game = {
    live: true,
    mode: opts.mode,
    round: opts.round, matchIdx: opts.matchIdx,
    innings: State.innings,
    half: 'top',       /* 'top' means away batting */
    inning: 1,
    outs: 0,
    balls: 0, strikes: 0,
    bases: [null,null,null],
    away: { name: youHome ? State.opponent.name : State.teamName, batters: youHome ? battersHome : battersAway, idx:0, score:0, isYou: !youHome, color: youHome ? State.opponent.color : teamKitColor() },
    home: { name: youHome ? State.teamName : State.opponent.name, batters: youHome ? battersAway : battersHome, idx:0, score:0, isYou: youHome, color: youHome ? teamKitColor() : State.opponent.color },
    stats: { hr:{}, so:{}, sb:{}, hits:{}, ab:{} },
    lineScore: { away:[0], home:[] },   /* runs per inning, per side */
    fx: [],           /* live particles: dust, confetti, glove flashes */
    shakeUntil: 0,    /* camera shake deadline (home runs) */
    log: [],
    pitch: null,      /* the current pitch animation */
    over: false,
    winner: null,
  };
  State.screen = 'game';
  render();
  Sound.music.start(Sound);
  setTimeout(startAtBat, 400);
}

function currentBattingTeam() {
  const g = State.game;
  return g.half === 'top' ? g.away : g.home;
}
function currentFieldingTeam() {
  const g = State.game;
  return g.half === 'top' ? g.home : g.away;
}
function currentBatter() {
  const t = currentBattingTeam();
  return t.batters[t.idx % 9];
}
function currentPitcher() {
  return currentFieldingTeam().batters[0];  /* first pick pitches */
}
function playerIsBatting() {
  return currentBattingTeam().isYou;
}
function statBump(k, key) {
  const g = State.game;
  g.stats[key][k] = (g.stats[key][k] || 0) + 1;
}

/* Difficulty tunings.
   ideal[a,b] = the fraction-of-meter window that produces solid contact.
   speed = seconds for the meter cursor to sweep across.
   pitcherSkill = multiplier on pitcher CON that shifts the meter's ideal spot. */
/* Every pitch type the game knows. `speed` multiplies the meter sweep
   (lower = faster pitch), `ideal` is where the sweet spot sits, `wob`
   adds per pitch randomness to it (the knuckler's whole personality).
   Modeled on Backyard Baseball's arsenal: every pitcher OWNS a three
   pitch repertoire below, so facing a new team means learning a new
   pitcher rather than the same three pitches forever. */
const PITCHES = {
  fastball:  { label: 'Fastball',  speed: 0.85, ideal: 0.50 },
  curveball: { label: 'Curveball', speed: 1.15, ideal: 0.60 },
  changeup:  { label: 'Changeup',  speed: 1.00, ideal: 0.62 },
  slowball:  { label: 'Slowball',  speed: 1.48, ideal: 0.58 },
  heat:      { label: 'The Heat',  speed: 0.70, ideal: 0.48 },
  knuckler:  { label: 'Knuckler',  speed: 1.25, ideal: 0.55, wob: 0.10 },
  screwball: { label: 'Screwball', speed: 1.12, ideal: 0.58 },
};
const DEFAULT_PITCHES = ['fastball', 'curveball', 'changeup'];
const PITCH_BOOK = {
  kong:       ['heat', 'fastball', 'slowball'],
  franky:     ['fastball', 'slowball', 'changeup'],
  popeye:     ['heat', 'fastball', 'curveball'],
  dracula:    ['curveball', 'knuckler', 'changeup'],
  liberty:    ['fastball', 'slowball', 'curveball'],
  peter:      ['screwball', 'fastball', 'curveball'],
  felix:      ['screwball', 'knuckler', 'changeup'],
  sherlock:   ['curveball', 'changeup', 'screwball'],
  witch:      ['knuckler', 'curveball', 'slowball'],
  medusa:     ['knuckler', 'screwball', 'changeup'],
  cyclops:    ['heat', 'fastball', 'changeup'],
  dragon:     ['heat', 'curveball', 'changeup'],
  phoenix:    ['heat', 'screwball', 'fastball'],
  santa:      ['slowball', 'changeup', 'curveball'],
  krampus:    ['heat', 'knuckler', 'fastball'],
  fathertime: ['slowball', 'knuckler', 'changeup'],
  horseman:   ['knuckler', 'heat', 'curveball'],
  nessie:     ['slowball', 'curveball', 'changeup'],
  strongman:  ['heat', 'fastball', 'changeup'],
  zombie:     ['slowball', 'knuckler', 'changeup'],
};
function pitcherRepertoire(p) {
  return PITCH_BOOK[p.k] || DEFAULT_PITCHES;
}

const DIFF = {
  easy:   { speed: 2.7, sweetWidth: 0.26, pitcherSkill: 0.85 },
  medium: { speed: 2.3, sweetWidth: 0.20, pitcherSkill: 1.00 },
  hard:   { speed: 1.9, sweetWidth: 0.16, pitcherSkill: 1.12 },
};

/* Pitcher fatigue: each inning past the third, the pitcher tires. The
   effect grows the wobble on the ideal spot and drops the strike rate.
   Returns a scaling context resolveSwing and throwPitch consult per pitch. */
function pitcherFatigue() {
  const g = State.game;
  const past = Math.max(0, g.inning - 3);
  return {
    wobbleMult: 1 + past * 0.25,
    strikeDrop: past * 0.03,
    level: past,   /* 0 fresh, 1 tiring, 2 gassed, 3+ cooked */
  };
}

/* Pause lengths in ms. Named so nothing tunes one number without seeing what
   the others are set to; the game's pacing lives here more than anywhere
   else. These are the authored NORMAL values; the live BEAT below is these
   scaled by the player's game speed setting. */
const BASE_BEAT = {
  /* Tuned to Backyard Baseball's rhythm: every pitch is a deliberate
     event with air around it, not a stream. The playtest verdict was
     "slow down a lot", and these are the numbers that did it. */
  windup:    1150,  /* pitcher into set, meter shows but does not sweep yet */
  betweenPitches: 1700,  /* after ball/called strike/foul */
  afterWhiff: 1500,
  afterOut:   2100,
  afterWalk:  2000,
  afterHit:   2600,
  afterHomer: 3200,
  betweenHalfInnings: 3000,
  intoAtBat: 1200,  /* new batter walks up */
};

/* Game speed. A full five inning game at NORMAL runs past ten minutes,
   which overshoots the quick arcade loop this game is meant to have, so
   the player can trade ceremony for pace. `beat` scales the dead time
   between events; `meter` scales the pitch sweep, kept mild because it
   also changes how hard the timing is. */
const SPEEDS = {
  relaxed: { beat: 1.30, meter: 1.20, label:'Relaxed' },
  normal:  { beat: 1.00, meter: 1.00, label:'Normal' },
  fast:    { beat: 0.60, meter: 0.85, label:'Fast' },
};
const BEAT = Object.assign({}, BASE_BEAT);
function applyGameSpeed() {
  const s = SPEEDS[State.gameSpeed] || SPEEDS.normal;
  for (const k of Object.keys(BASE_BEAT)) BEAT[k] = Math.round(BASE_BEAT[k] * s.beat);
}
function meterScale() {
  const s = SPEEDS[State.gameSpeed] || SPEEDS.normal;
  return s.meter;
}
/* Seed BEAT from the saved preference now that SPEEDS exists. */
applyGameSpeed();

let atBatCleanup = null;
function endAtBatCleanup() {
  if (atBatCleanup) { atBatCleanup(); atBatCleanup = null; }
}

/* A single, always-on animation loop paints the field and the meter every
   frame while the game screen is up. Individual pitches only own the click
   listener and the "no swing = called pitch" trigger; the drawing lives
   here so the diamond stays visible between pitches, half innings, and
   result callouts. */
let fieldRafId = 0;
function startFieldLoop() {
  cancelAnimationFrame(fieldRafId);
  const paint = () => {
    if (State.screen !== 'game' || !State.game) {
      fieldRafId = 0;
      return;
    }
    const fCv = document.getElementById('field');
    if (fCv) {
      const g = State.game;
      const p = g.pitch;
      let t = 0, inWindup = true;
      if (p) {
        const now = performance.now();
        if (now < p.windupUntil) { t = 0; inWindup = true; }
        else {
          const durMs = p.speed * 1000;
          t = clamp((now - p.start) / durMs, 0, 1);
          inWindup = false;
          /* No swing by pitch end. Trigger the called pitch once. */
          if (t >= 1 && !p.swung && !p.resolved) {
            p.resolved = true;
            resolveCalledPitch();
          }
        }
      }
      drawField(fCv.getContext('2d'), fCv.width, fCv.height, t, p || null, inWindup);
      refreshStealButton();
    }
    fieldRafId = requestAnimationFrame(paint);
  };
  fieldRafId = requestAnimationFrame(paint);
}
function stopFieldLoop() {
  cancelAnimationFrame(fieldRafId);
  fieldRafId = 0;
}

function startAtBat() {
  const g = State.game;
  if (g.over) return;
  /* Belt and braces: nothing starts an at bat after a walk-off, whichever
     path scored the run. */
  if (g.walkoff) { g.over = true; g.winner = 'home'; return finishGame(); }
  g.balls = 0; g.strikes = 0;
  /* Open this half inning's bucket on the line score so the board shows a
     zero for an inning in progress and stays blank for ones not reached. */
  const lsKey = g.half === 'top' ? 'away' : 'home';
  while (g.lineScore[lsKey].length < g.inning) g.lineScore[lsKey].push(0);
  const b = currentBatter();
  g.swingMode = 'contact';
  syncSwingModeButtons();
  g.batterCtx = batterContext(b);
  for (const note of g.batterCtx.notes) addLog(note, true);
  if (g.batterCtx.flags.spinach) {
    showCallout('SPINACH TIME', 'homer');
    g.signature = { kind: 'anchor', until: performance.now() + 1400 };
    Sound.play('homer');
  } else if (g.batterCtx.flags.transformed) {
    showCallout('HYDE TRANSFORMS', 'strike');
  } else {
    showCallout(`${b.n} steps in`, 'sub');
  }
  refreshHud();
  if (playerIsBatting()) {
    /* CPU calls its own pitch. */
    setTimeout(() => {
      const pick = cpuCallPitch();
      throwPitch(pick.pt, pick.zone);
    }, BEAT.intoAtBat);
  } else {
    /* Your defense is on the field: you call the pitch. */
    setTimeout(offerPitchSelection, BEAT.intoAtBat);
  }
}

/* CPU pitching AI. Decides pitch type and zone against the current
   batter and count. Reads:
     - batter's CON: attack corners on high-CON hitters (avoid squaring up)
     - count: 0-2 wastes off the plate; 3-0 grooves down the middle
     - pitcher fatigue: gassed pitchers throw more fastballs, aim center more
     - last pitch: mix things up on repeat calls
   Returns { pt, zone } consumed by throwPitch. */
function cpuCallPitch() {
  const g = State.game;
  const batter = currentBatter();
  const pitcher = currentPitcher();
  const fat = pitcherFatigue();
  const rep = pitcherRepertoire(pitcher);

  /* Type choice from HIS repertoire: mix, but repeat rarely. */
  let pt;
  if (g.lastCpuPitchType && Math.random() < 0.65) {
    const alts = rep.filter(x => x !== g.lastCpuPitchType);
    pt = alts[Math.floor(Math.random() * alts.length)] || rep[0];
  } else {
    pt = rep[Math.floor(Math.random() * rep.length)];
  }
  /* Gassed pitcher: he leans on his straightest, hardest pitch. */
  if (fat.level >= 2) {
    pt = rep.reduce((a, b) => (PITCHES[a].speed <= PITCHES[b].speed ? a : b));
  }
  g.lastCpuPitchType = pt;

  /* Zone choice: 3x3 grid indices 0..8, 4 = center. */
  let zone;
  const wasteRoll = g.strikes >= 2 && Math.random() < 0.35;
  const grooveRoll = g.balls >= 3 && Math.random() < 0.55;
  if (grooveRoll) {
    zone = 4;   /* dead center on 3-0 */
  } else if (wasteRoll) {
    /* Chase pitch: pick one of the four corners. */
    const corners = [0, 2, 6, 8];
    zone = corners[Math.floor(Math.random() * 4)];
  } else {
    /* Contact hitters get cornered; power hitters get sinkers low. */
    const hitContact = batter.con >= 75;
    const hitPower = batter.pow >= 80;
    if (hitContact) {
      const cornersOrEdges = [0, 2, 6, 8, 1, 3, 5, 7];
      zone = cornersOrEdges[Math.floor(Math.random() * cornersOrEdges.length)];
    } else if (hitPower) {
      /* Low pitches to power hitters */
      zone = [6, 7, 8][Math.floor(Math.random() * 3)];
    } else {
      /* Balanced: random */
      zone = Math.floor(Math.random() * 9);
    }
  }
  return { pt, zone };
}

/* When the CPU bats, the player picks the pitch type and the target zone
   and then throws it. Nothing fires on its own. The selected type matters
   (each CPU batter has a hidden weak pitch), and the zone shifts both the
   ideal meter spot and the CPU batter's read: corners are hard to square
   up but risk a ball. */
/* EVERY pitch after the first went through setTimeout(throwPitch), which
   throws immediately with whatever defaults it can find. Only the first
   pitch of an at bat ever went through the selection screen, so you called
   one pitch and then watched the other five get thrown for you.

   One router now decides who is pitching, and every next pitch site calls
   it instead of calling throwPitch directly. */
function nextPitch() {
  const g = State.game;
  if (!g || g.over) return;
  if (playerIsBatting()) {
    const pick = cpuCallPitch();
    throwPitch(pick.pt, pick.zone);
  } else {
    offerPitchSelection();
  }
}

function offerPitchSelection() {
  const g = State.game;
  if (!g || g.over) return;
  const row = document.getElementById('pitch-select');
  if (!row) return throwPitch();
  /* The buttons are THIS pitcher's own pitches, rebuilt per windup. */
  const rep = pitcherRepertoire(currentPitcher());
  const typeRow = row.querySelector('.type-row');
  if (typeRow) {
    typeRow.innerHTML = rep.map(pt =>
      `<button class="btn ghost" data-pt="${pt}">${PITCHES[pt].label}</button>`).join('');
  }
  row.style.display = '';
  let chosenPt = null, chosenZone = null;
  let done = false;
  const throwBtn = row.querySelector('#throw-btn');
  const hint = row.querySelector('#throw-hint');

  /* No clock. There was a five second timer that threw the pitch for you
     with defaults, which means the half you are supposed to be MANAGING
     ran itself if you thought about it too long. The pitcher waits. */
  const fire = () => {
    if (done || !chosenPt || chosenZone == null) return;
    done = true;
    row.style.display = 'none';
    for (const btn of row.querySelectorAll('button')) btn.onclick = null;
    throwPitch(chosenPt, chosenZone);
  };
  const refresh = () => {
    const ready = chosenPt && chosenZone != null;
    if (throwBtn) throwBtn.disabled = !ready;
    if (hint) {
      hint.textContent = ready ? 'Ready.'
        : !chosenPt ? 'Pick a pitch.'
        : 'Pick a spot.';
    }
  };
  for (const btn of row.querySelectorAll('button[data-pt]')) {
    btn.onclick = (e) => {
      e.stopPropagation();
      chosenPt = btn.dataset.pt;
      for (const b of row.querySelectorAll('button[data-pt]')) b.classList.remove('selected');
      btn.classList.add('selected');
      refresh();
    };
  }
  for (const btn of row.querySelectorAll('button[data-zone]')) {
    btn.onclick = (e) => {
      e.stopPropagation();
      chosenZone = parseInt(btn.dataset.zone, 10);
      for (const b of row.querySelectorAll('button[data-zone]')) b.classList.remove('selected');
      btn.classList.add('selected');
      refresh();
    };
  }
  if (throwBtn) throwBtn.onclick = (e) => { e.stopPropagation(); fire(); };
  refresh();
}

/* Quirk hook. Called once per at bat. Returns a stat snapshot the swing
   resolver reads, so per at bat modifiers (Hyde's transformation, etc.)
   never mutate the underlying ROSTER entry. */
function batterContext(b) {
  const g = State.game;
  const ctx = { pow: b.pow, con: b.con, spd: b.spd, notes: [], flags: {} };
  /* Home field advantage: the home team's batters get a small crowd
     bump. Only in playoff games, so the regular season stays flat. */
  if (g.half === 'bottom' && (State.mode === 'playoff' || State.mode === 'cup')) {
    ctx.pow = Math.min(100, ctx.pow + 3);
    ctx.con = Math.min(100, ctx.con + 2);
  }
  /* A park built to be loud gives its own hitters the same kind of bump in
     any round, which is the Thunder Bowl's whole reason to exist. */
  const pfc = parkFactors().crowd;
  if (pfc && g.half === 'bottom' && g.home && g.home.isYou) {
    ctx.pow = Math.min(100, ctx.pow + pfc);
    ctx.con = Math.min(100, ctx.con + Math.round(pfc * 0.6));
  }
  if (b.quirk === 'transform' && Math.random() < 0.16) {
    ctx.pow = Math.max(ctx.pow, 96);
    ctx.con = Math.max(ctx.con, 78);
    ctx.notes.push(`${b.n} transforms. All power, no manners.`);
    ctx.flags.transformed = true;
  }
  /* Popeye eats his spinach once per game, on his third plate appearance.
     Roman announces it with a callout, and his POW/CON spike for that
     at bat only. Big signature moment. */
  if (b.k === 'popeye') {
