<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Run The All-Stars</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0b1015" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1015'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle'%3E%E2%9A%BE%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --ink:#0b1015;
    --panel:#141c24;
    --panel-2:#1c2732;
    --line:rgba(255,255,255,.10);
    --text:#f3ecdc;
    --text-dim:#a89d86;
    --gold:#f4c25a;
    --red:#d24949;
    --green:#5bb083;
    --blue:#6aa7c4;
    --purple:#b08ac6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text);
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    min-height:100vh;overscroll-behavior-y:none;}
  body{
    background:
      radial-gradient(900px 500px at 50% 0%, rgba(91,176,131,.09), transparent 60%),
      radial-gradient(700px 500px at 50% 110%, rgba(244,194,90,.05), transparent 66%),
      var(--ink);
  }
  img.pico{image-rendering:pixelated;image-rendering:crisp-edges;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;}

  .wrap{max-width:920px;margin:0 auto;padding:14px 14px 60px;}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 0 14px;border-bottom:1px solid var(--line);}
  .brand h1{margin:0;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
  .brand .tag{color:var(--text-dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;}
  .brand .spacer{flex:1;}
  .brand button{background:transparent;color:var(--text-dim);border:1px solid var(--line);
    padding:6px 10px;font-family:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    cursor:pointer;border-radius:4px;}
  .brand button:hover{color:var(--text);border-color:var(--gold);}

  .screen{padding:18px 0;}
  h2{margin:0 0 12px;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
  h3{margin:14px 0 6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);}
  p{margin:0 0 10px;color:var(--text-dim);line-height:1.5;font-size:13px;}

  .btn{display:inline-block;background:var(--gold);color:#1a1108;border:0;padding:10px 16px;
    font-family:inherit;font-size:13px;letter-spacing:.12em;text-transform:uppercase;
    cursor:pointer;border-radius:4px;font-weight:700;}
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--gold);color:var(--gold);}
  .btn.red{background:var(--red);color:#fff;}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;}
  .card + .card{margin-top:12px;}

  .roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;}
  .charcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;
    cursor:pointer;transition:border-color .1s,transform .1s;text-align:center;position:relative;}
  .charcard:hover{border-color:var(--gold);}
  .charcard.picked{border-color:var(--gold);background:var(--panel-2);}
  .charcard canvas{width:64px;height:auto;background:#0c1218;border-radius:4px;image-rendering:pixelated;}
  .charcard .name{margin-top:6px;font-size:12px;color:var(--text);letter-spacing:.06em;}
  .charcard .role{font-size:10px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;}
  .charcard .pickno{position:absolute;top:6px;right:6px;background:var(--gold);color:#1a1108;
    font-size:10px;padding:2px 5px;border-radius:3px;font-weight:700;}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px;font-size:10px;color:var(--text-dim);}
  .statgrid span b{color:var(--text);}
  .quirk{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:10px;color:var(--purple);line-height:1.4;}

  .toggle-row{display:flex;gap:6px;flex-wrap:wrap;}
  .toggle{padding:8px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;
    cursor:pointer;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);}
  .toggle.on{border-color:var(--gold);color:var(--gold);}

  /* Game.
     The field takes as much room as possible and the meter, HUD, and stat
     rail sit around it. On desktop the field is a wide inset panel that
     centers the diamond; on mobile it stacks. A single callout overlay
     hangs above the field for hit and inning events (READY, STRIKE, HOME
     RUN, and so on). */

  .arena{
    position:relative;
    background:radial-gradient(700px 400px at 50% 30%, #17301f, #08110a 68%);
    border:1px solid var(--line);
    border-radius:8px;
    padding:0;
    overflow:hidden;
    margin-bottom:12px;
  }
  #field{
    display:block;
    width:100%;
    aspect-ratio:16/11;
    max-height:min(72vh, 720px);
    background:transparent;
  }
  .arena .corner{position:absolute;pointer-events:none;padding:10px 14px;
    font-family:inherit;text-transform:uppercase;letter-spacing:.14em;font-size:12px;
    color:var(--text-dim);text-shadow:0 1px 2px rgba(0,0,0,.7);}
  .arena .corner.tl{top:0;left:0;text-align:left;}
  .arena .corner.tr{top:0;right:0;text-align:right;}
  .arena .corner.bl{bottom:0;left:0;text-align:left;}
  .arena .corner.br{bottom:0;right:0;text-align:right;}
  .arena .corner .lbl{display:block;color:var(--text-dim);font-size:10px;letter-spacing:.16em;}
  .arena .corner .val{color:var(--text);font-size:20px;font-weight:700;line-height:1;}
  .arena .corner .val.gold{color:var(--gold);}
  .arena .corner.br .val{color:var(--text);font-size:14px;}

  .callout{
    position:absolute;
    top:38%;
    left:50%;
    transform:translate(-50%,-50%) scale(.9);
    padding:14px 30px;
    background:rgba(11,16,21,.86);
    border:2px solid var(--gold);
    border-radius:6px;
    color:var(--gold);
    font-family:inherit;
    font-size:26px;
    font-weight:900;
    letter-spacing:.16em;
    text-transform:uppercase;
    text-shadow:0 2px 0 rgba(0,0,0,.5);
    pointer-events:none;
    opacity:0;
    transition:opacity .18s ease-out, transform .28s cubic-bezier(.2,.9,.2,1.2);
    box-shadow:0 8px 32px rgba(0,0,0,.5);
    white-space:nowrap;
    z-index:6;
  }
  .callout.on{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .callout.homer{border-color:var(--gold);color:var(--gold);font-size:32px;
    background:linear-gradient(180deg,rgba(60,30,10,.9),rgba(11,16,21,.9));}
  .callout.hit{border-color:var(--green);color:var(--green);}
  .callout.strike{border-color:var(--red);color:#f4a4a4;}
  .callout.ball{border-color:var(--blue);color:var(--blue);}
  .callout.sub{border-color:var(--text-dim);color:var(--text);font-size:18px;background:rgba(11,16,21,.7);}

  @media (max-width:600px){
    .callout{font-size:18px;padding:10px 18px;}
    .callout.homer{font-size:22px;}
    .arena .corner{padding:6px 8px;font-size:10px;}
    .arena .corner .val{font-size:16px;}
    .arena .corner.br .val{font-size:11px;}
  }

  .plate-row{
    display:grid;grid-template-columns:1fr;gap:10px;align-items:stretch;
  }
  .meter-wrap{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;}
  .meter-wrap .label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);
    letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
  .meter-wrap .label b.pt{color:var(--gold);letter-spacing:.14em;}
  #meter{width:100%;height:44px;display:block;background:#0c1218;border-radius:3px;}
  .meter-wrap .hint{margin-top:6px;font-size:11px;color:var(--text-dim);
    letter-spacing:.08em;text-align:center;text-transform:uppercase;}
  .meter-wrap .hint b{color:var(--gold);}

  .atbat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;
    display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .atbat .avatar{width:36px;height:auto;image-rendering:pixelated;}
  .atbat .who{font-size:14px;letter-spacing:.06em;}
  .atbat .who b{color:var(--gold);}
  .atbat .vs{font-size:11px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
  .atbat .count{margin-left:auto;font-size:16px;color:var(--text);letter-spacing:.14em;font-weight:700;}

  .log{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;
    max-height:110px;overflow-y:auto;font-size:12px;line-height:1.6;color:var(--text-dim);}
  .log .line{padding:1px 0;}
  .log .line.big{color:var(--gold);font-weight:700;letter-spacing:.05em;}

  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

  /* Result / hub */
  .table{width:100%;border-collapse:collapse;font-size:13px;}
  .table th,.table td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);}
  .table th{color:var(--text-dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;}
  .table tr.you td{color:var(--gold);}
  .table td.n{text-align:right;font-variant-numeric:tabular-nums;}

  .bracket{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;}
  .bracket .col{display:flex;flex-direction:column;gap:10px;}
  .bracket .match{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;}
  .bracket .match .row{display:flex;justify-content:space-between;padding:2px 0;}
  .bracket .match .row.win{color:var(--gold);}
  .bracket .match .row.you{font-weight:700;}
  .bracket .arrow{color:var(--text-dim);font-size:18px;text-align:center;}

  .banner{background:linear-gradient(90deg,rgba(244,194,90,.14),transparent);
    border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:10px;font-size:13px;}
  .banner b{color:var(--gold);}

  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:640px){
    .row-2{grid-template-columns:1fr;}
    .plate-row{grid-template-columns:1fr;}
  }
</style>
</head>

  </div>
  <div id="app"></div>
</div>

/* ============================================================================
   PIXEL SPRITE
   Each character's art field is eighteen rows of sixteen characters, where
   every character is either `.` for transparent or a key into that
   character's `pal`. drawSprite reads that grid and paints one square per
   cell into `size` wide. Total sprite height is size * SPRITE_H / SPRITE_W.
   ============================================================================ */
function drawSpriteGrid(ctx, c, size) {
  const px = size / SPRITE_W;
  const totalH = size * SPRITE_H / SPRITE_W;
  ctx.clearRect(0, 0, size, totalH);
  const pal = c.pal || {};
  const rows = c.art || [];
  for (let y = 0; y < SPRITE_H; y++) {
    const row = rows[y] || '';
    for (let x = 0; x < SPRITE_W; x++) {
      const ch = row[x];
      if (!ch || ch === '.') continue;
      const color = pal[ch];
      if (!color) continue;
      ctx.fillStyle = color;
      ctx.fillRect(Math.floor(x*px), Math.floor(y*px), Math.ceil(px), Math.ceil(px));
    }
  }
}
/* The rest of the module still calls drawSprite; keep the name pointing at
   the grid renderer. The old procedural fallback was removed with the
   handpainted roster; every character now has a `pal` + `art` field. */
function drawSprite(ctx, c, size) { drawSpriteGrid(ctx, c, size); }


function spriteCanvas(c, size) {
  const cv = document.createElement('canvas');
  cv.width = size;
  cv.height = Math.round(size * SPRITE_H / SPRITE_W);
  drawSprite(cv.getContext('2d'), c, size);
  return cv;
}

const SAVE_KEY = 'allstars.season.v1';

  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); }
  catch(e) { return null; }
};

  try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); }

};

};

  foot.appendChild(el('div', null, '<br>'));
  foot.appendChild(counter);

    picked.clear();
    const bag = [...ROSTER].sort(() => Math.random() - 0.5);
    bag.slice(0,9).forEach(c => picked.add(c.k));
    redraw();
    /* Same auto advance as the ninth click: nine is nine. */
    setTimeout(() => {
      State.team = [...picked];
      State.teamName = (nameInput.value || 'Your Team').slice(0,20);
      State.screen = 'settings';
      render();
    }, 300);
  };
  const go = el('button','btn','Continue');
  go.onclick = () => {
    if (picked.size !== 9) return;
    State.team = [...picked];
    State.teamName = (nameInput.value || 'Your Team').slice(0,20);
    State.screen = 'settings';
    render();
  };
  const back = el('button','btn ghost','Back');
  back.onclick = () => { State.screen = 'menu'; render(); };
  row.append(back, rand, go);
  foot.appendChild(row);
  s.appendChild(foot);

  app.appendChild(s);

  function redraw() {
    let n = 0;
    for (const c of ROSTER) {
      const cc = cards.get(c.k);
      if (picked.has(c.k)) { n++; cc.classList.add('picked'); cc.querySelector('.pickno')?.remove(); const b = el('div','pickno', [...picked].indexOf(c.k)+1); cc.appendChild(b); }
      else { cc.classList.remove('picked'); cc.querySelector('.pickno')?.remove(); }
    }
    counter.textContent = `${picked.size} of 9 selected`;
    go.disabled = picked.size !== 9;
  }
  redraw();
}

/* ============================================================================
   SEASON
   ============================================================================ */
function seasonRecord(season) {
  const w = season.results.filter(r => r.win).length;
  const l = season.results.filter(r => !r.win).length;
  return { w, l };
}
function randomOpponent(exclude) {
  const pool = OPPONENTS.filter(o => !exclude || o.name !== exclude);
  return pool[Math.floor(Math.random() * pool.length)];
}
function buildSchedule() {
  const bag = [...OPPONENTS].sort(() => Math.random() - 0.5);
  return bag.slice(0,7).map(o => o.name);
}
function opponentByName(name) {
  return OPPONENTS.find(o => o.name === name);
}
function startSeason() {
  State.season = {
    team: State.team,
    teamName: State.teamName,
    innings: State.innings,
    difficulty: State.difficulty,
    schedule: buildSchedule(),
    results: [],
    playoffs: null,
    playerStats: { hr:0, so:0, sb:0, hits:0, ab:0 },
    league: simulateLeagueSeasons(),
  };
  saveSeason(State.season);
  State.screen = 'season-hub';
  render();
}

/* The other eight teams need records so a playoff picture exists. Rather than
   simulate every game the league plays behind the scenes, generate a plausible
   seven game record for each opponent up front. The user's own results get
   subbed in as their games are played. */
function simulateLeagueSeasons() {
  const out = {};
  for (const o of OPPONENTS) {
    const rating = teamRating(o.roster);
    const winRate = 0.35 + (rating - 60) * 0.008;   /* soft curve around .500 */
    let w = 0;
    for (let i=0;i<7;i++) if (Math.random() < winRate) w++;
    out[o.name] = { w, l: 7 - w };
  }
  return out;
}
function teamRating(keys) {
  const chars = keys.map(k => ROSTER_BY_KEY[k]);
  const off = chars.reduce((a,c) => a + c.pow*0.4 + c.con*0.4 + c.spd*0.2, 0) / 9;
  const def = chars.reduce((a,c) => a + c.def, 0) / 9;
  return off * 0.65 + def * 0.35;
}

function seedPlayoffs(S) {
  const rows = [];
  rows.push({ name: S.teamName, roster: S.team, w: seasonRecord(S).w, you:true });
  for (const o of OPPONENTS) rows.push({ name:o.name, roster:o.roster, w: S.league[o.name].w });
  rows.sort((a,b) => b.w - a.w || Math.random() - 0.5);
  const top4 = rows.slice(0,4);
  return {
    seeds: top4,
    semis: [
      { home:0, away:3, result:null },
      { home:1, away:2, result:null },
    ],
    final: null,
    stage: 'semi',
  };
}

      `<span>${i+1}. ${home.name}</span><span>${m.result?m.result.homeScore:''}</span>`);
    const awayRow = el('div', 'row' + (away.you?' you':'') + (m.result && m.result.winner===m.away?' win':''),
      `<span>${4-i}. ${away.name}</span><span>${m.result?m.result.awayScore:''}</span>`);
    matchDiv.append(homeRow, awayRow);
    semiCol.appendChild(matchDiv);
  });
  const arrow = el('div','arrow', '&raquo;');
  const finCol = el('div','col');
  if (P.final) {
    const home = P.seeds[P.final.home];
    const away = P.seeds[P.final.away];
    const m = P.final;
    const matchDiv = el('div','match');
    const homeRow = el('div','row' + (home.you?' you':'') + (m.result && m.result.winner===m.home?' win':''),
      `<span>${home.name}</span><span>${m.result?m.result.homeScore:''}</span>`);
    const awayRow = el('div','row' + (away.you?' you':'') + (m.result && m.result.winner===m.away?' win':''),
      `<span>${away.name}</span><span>${m.result?m.result.awayScore:''}</span>`);
    matchDiv.append(homeRow, awayRow);
    finCol.appendChild(matchDiv);
  } else {
    finCol.appendChild(el('div','match', '<span>Final</span>'));
  }
  grid.append(semiCol, arrow, finCol);
  brac.appendChild(grid);
  s.appendChild(brac);

  /* Next action button */
  const row = el('div','btn-row');
  const nextMatch = nextPlayoffMatch(P);
  if (nextMatch) {
    if (nextMatch.playerInvolved) {
      const b = el('button','btn','Play Your Match');
      b.onclick = () => startPlayoffMatch(nextMatch);
      row.appendChild(b);
    } else {
      const b = el('button','btn','Simulate CPU Match');
      b.onclick = () => { simulateCpuMatch(nextMatch); saveSeason(S); render(); };
      row.appendChild(b);
    }
  } else {
    /* All matches done */
    const b = el('button','btn','View Season Summary');
    b.onclick = () => { State.screen='season-end'; render(); };
    row.appendChild(b);
  }
  const hub = el('button','btn ghost','Back to Hub');
  hub.onclick = () => { State.screen='season-hub'; render(); };
  row.appendChild(hub);
  s.appendChild(row);

  app.appendChild(s);
}

function nextPlayoffMatch(P) {
  for (let i=0;i<P.semis.length;i++) {
    const m = P.semis[i];
    if (!m.result) {
      const you = P.seeds[m.home].you || P.seeds[m.away].you;
      return { round:'semi', idx:i, match:m, playerInvolved: you };
    }
  }
  if (!P.final) {
    const winners = P.semis.map(m => m.result.winner);
    P.final = { home:winners[0], away:winners[1], result:null };
  }
  if (P.final && !P.final.result) {
    const you = P.seeds[P.final.home].you || P.seeds[P.final.away].you;
    return { round:'final', idx:0, match:P.final, playerInvolved: you };
  }
  return null;
}

function simulateCpuMatch(nm) {
  const P = State.season.playoffs;
  const m = nm.match;
  const home = P.seeds[m.home];
  const away = P.seeds[m.away];
  const hr = teamRating(home.roster);
  const ar = teamRating(away.roster);
  const homeAdv = 3;
  const hs = Math.max(0, Math.round(4 + (hr - ar)*0.06 + homeAdv*0.3 + (Math.random()-0.5)*3));
  const as = Math.max(0, Math.round(4 + (ar - hr)*0.06 + (Math.random()-0.5)*3));
  const finalHome = hs === as ? hs + 1 : hs;
  m.result = { homeScore:finalHome, awayScore:as, winner: finalHome > as ? m.home : m.away };
}

function startPlayoffMatch(nm) {
  const S = State.season;
  const P = S.playoffs;
  const m = nm.match;
  const home = P.seeds[m.home];
  const away = P.seeds[m.away];
  const youHome = home.you;
  const you = youHome ? home : away;
  const foe = youHome ? away : home;
  State.team = you.roster;
  State.teamName = you.name;
  State.opponent = { name: foe.name, color: (opponentByName(foe.name)?.color) || '#8a1a1a', roster: foe.roster };
  State.innings = S.innings;
  State.difficulty = S.difficulty;
  startGame({ mode:'playoff', round: nm.round, matchIdx: nm.idx, youHome });
}

/* ============================================================================
   GAME
   ============================================================================ */
function startGame(opts) {
  const battersAway = State.team.map(k => ROSTER_BY_KEY[k]);
  const battersHome = State.opponent.roster.map(k => ROSTER_BY_KEY[k]);
  /* User bats AWAY (visitor), opponent home. In playoffs the flag flips. */
  const youHome = !!opts.youHome;
  State.game = {
    live: true,
    mode: opts.mode,
    round: opts.round, matchIdx: opts.matchIdx,
    innings: State.innings,
    half: 'top',       /* 'top' means away batting */
    inning: 1,
    outs: 0,
    balls: 0, strikes: 0,
    bases: [null,null,null],
    away: { name: youHome ? State.opponent.name : State.teamName, batters: youHome ? battersHome : battersAway, idx:0, score:0, isYou: !youHome, color: youHome ? State.opponent.color : '#f4c25a' },
    home: { name: youHome ? State.teamName : State.opponent.name, batters: youHome ? battersAway : battersHome, idx:0, score:0, isYou: youHome, color: youHome ? '#f4c25a' : State.opponent.color },
    stats: { hr:{}, so:{}, sb:{}, hits:{}, ab:{} },
    log: [],
    pitch: null,      /* the current pitch animation */
    over: false,
    winner: null,
  };
  State.screen = 'game';
  render();
  setTimeout(startAtBat, 400);
}

function currentBattingTeam() {
  const g = State.game;
  return g.half === 'top' ? g.away : g.home;
}
function currentFieldingTeam() {
  const g = State.game;
  return g.half === 'top' ? g.home : g.away;
}
function currentBatter() {
  const t = currentBattingTeam();
  return t.batters[t.idx % 9];
}
function currentPitcher() {
  return currentFieldingTeam().batters[0];  /* first pick pitches */
}
function statBump(k, key) {
  const g = State.game;
  g.stats[key][k] = (g.stats[key][k] || 0) + 1;
}

/* Difficulty tunings.
   ideal[a,b] = the fraction-of-meter window that produces solid contact.
   speed = seconds for the meter cursor to sweep across.
   pitcherSkill = multiplier on pitcher CON that shifts the meter's ideal spot. */
const DIFF = {
  easy:   { speed: 2.1, sweetWidth: 0.26, pitcherSkill: 0.85 },
  medium: { speed: 1.7, sweetWidth: 0.20, pitcherSkill: 1.00 },
  hard:   { speed: 1.35, sweetWidth: 0.16, pitcherSkill: 1.12 },
};

/* Pause lengths in ms. Named so nothing tunes one number without seeing what
   the others are set to; the game's pacing lives here more than anywhere
   else. */
const BEAT = {
  windup:    700,   /* pitcher into set, meter shows but does not sweep yet */
  betweenPitches: 900,   /* after ball/called strike/foul */
  afterWhiff: 950,
  afterOut:   1500,
  afterWalk:  1600,
  afterHit:   2000,
  afterHomer: 2600,
  betweenHalfInnings: 2600,
  intoAtBat: 700,   /* new batter walks up */
};

let atBatCleanup = null;
function endAtBatCleanup() {
  if (atBatCleanup) { atBatCleanup(); atBatCleanup = null; }
}

/* A single, always-on animation loop paints the field and the meter every
   frame while the game screen is up. Individual pitches only own the click
   listener and the "no swing = called pitch" trigger; the drawing lives
   here so the diamond stays visible between pitches, half innings, and
   result callouts. */
let fieldRafId = 0;
function startFieldLoop() {
  cancelAnimationFrame(fieldRafId);
  const paint = () => {
    if (State.screen !== 'game' || !State.game) {
      fieldRafId = 0;
      return;
    }
    const fCv = document.getElementById('field');
    const mCv = document.getElementById('meter');
    if (fCv && mCv) {
      const g = State.game;
      const p = g.pitch;
      let t = 0, inWindup = true;
      if (p) {
        const now = performance.now();
        if (now < p.windupUntil) { t = 0; inWindup = true; }
        else {
          const durMs = p.speed * 1000;
          t = clamp((now - p.start) / durMs, 0, 1);
          inWindup = false;
          /* No swing by pitch end. Trigger the called pitch once. */
          if (t >= 1 && !p.swung && !p.resolved) {
            p.resolved = true;
            resolveCalledPitch();
          }
        }
      }
      drawField(fCv.getContext('2d'), fCv.width, fCv.height, t, p || null, inWindup);
      drawMeter(mCv.getContext('2d'), mCv.width, mCv.height, t, p || { ideal: 0.5, pt: 'fastball' }, inWindup);
    }
    fieldRafId = requestAnimationFrame(paint);
  };
  fieldRafId = requestAnimationFrame(paint);
}
function stopFieldLoop() {
  cancelAnimationFrame(fieldRafId);
  fieldRafId = 0;
}

function startAtBat() {
  const g = State.game;
  if (g.over) return;
  g.balls = 0; g.strikes = 0;
  const b = currentBatter();
  g.batterCtx = batterContext(b);
  for (const note of g.batterCtx.notes) addLog(note, true);
  showCallout(`${b.n} steps in`, 'sub');
  refreshHud();
  setTimeout(throwPitch, BEAT.intoAtBat);
}

/* Quirk hook. Called once per at bat. Returns a stat snapshot the swing
   resolver reads, so per at bat modifiers (Hyde's transformation, etc.)
   never mutate the underlying ROSTER entry. */
function batterContext(b) {
  const ctx = { pow: b.pow, con: b.con, spd: b.spd, notes: [], flags: {} };
  if (b.quirk === 'transform' && Math.random() < 0.16) {
    ctx.pow = Math.max(ctx.pow, 96);
    ctx.con = Math.max(ctx.con, 78);
    ctx.notes.push(`${b.n} transforms. All power, no manners.`);
    ctx.flags.transformed = true;
  }
  return ctx;
}

function throwPitch() {
  const g = State.game;
  if (g.over) return;
  const diff = DIFF[State.difficulty];
  const batter = currentBatter();
  const pitcher = currentPitcher();
  /* pick a pitch type */
  const pitchTypes = ['fastball','curveball','changeup'];
  const pt = pitchTypes[Math.floor(Math.random()*3)];
  /* speed multiplier: fastball fast, curve normal, change starts fast slows down */
  const baseSpeed = diff.speed
    * (pt === 'fastball' ? 0.85 : pt === 'curveball' ? 1.15 : 1.0)
    / (0.85 + pitcher.pow / 400);
  /* ideal timing sweet spot centered around 0.55, shifted by pitcher control */
  const idealBase = pt === 'fastball' ? 0.5 : pt === 'curveball' ? 0.60 : 0.62;
  let wobble = (Math.random() - 0.5) * 0.06 * diff.pitcherSkill;
  /* Scarecrow rattles the pitcher. His ideal spot swings wider than anyone
     else's on the roster, so timing him takes reading the meter, not muscle
     memory. */
  if (batter.quirk === 'confuse') {
    wobble += (Math.random() - 0.5) * 0.14;
  }
  const ideal = clamp(idealBase + wobble, 0.28, 0.78);
  /* Ball is a strike or a ball. The pitcher's control determines it. */
  const strikeProb = 0.55 + (pitcher.con || pitcher.def*0.4) / 300;
  const isStrike = Math.random() < clamp(strikeProb, 0.45, 0.85);
  /* Windup: the meter is on screen but does not sweep for a beat. This is
     the player's chance to see the pitcher, the pitch type, the ideal spot,
     and settle. `start` gets set when the sweep actually begins. */
  g.pitch = {
    pt, speed: baseSpeed, ideal, isStrike,
    start: performance.now() + BEAT.windup,
    windupUntil: performance.now() + BEAT.windup,
    swung: false,
    hit: false,
  };
  refreshHud();
  runPitchAnimation();
}

/* Install the swing click and space listeners for this pitch. The field
   loop (startFieldLoop) handles all the painting and the "no swing = called
   pitch" transition. */
function runPitchAnimation() {
  const g = State.game;
  const p = g.pitch;
  const durMs = p.speed * 1000;
  const onClick = (e) => {
    if (p.swung) return;
    const now = performance.now();
    if (now < p.windupUntil) return;
    const t = clamp((now - p.start) / durMs, 0, 1);
    p.swung = true;
    resolveSwing(t);
  };
  const onKey = (e) => {
    if (e.code === 'Space') { e.preventDefault(); onClick(e); }
  };
  const teardown = () => {
    document.removeEventListener('keydown', onKey);
    document.removeEventListener('click', onClick, true);
  };
  atBatCleanup = teardown;
  document.addEventListener('keydown', onKey);
  document.addEventListener('click', onClick, true);
}

function resolveCalledPitch() {
  const g = State.game;
  const p = g.pitch;
  if (p.isStrike) { g.strikes++; addLog('Called strike.'); showCallout('STRIKE', 'strike'); }
  else            { g.balls++;   addLog('Ball.'); showCallout('BALL', 'ball'); }
  refreshHud();
  if (g.strikes >= 3) return recordOut('called strikeout', true);
  if (g.balls >= 4) return recordWalk();
  setTimeout(throwPitch, BEAT.betweenPitches);
}

function resolveSwing(cursorT) {
  endAtBatCleanup();
  const g = State.game;
  const p = g.pitch;
  const batter = currentBatter();
  const pitcher = currentPitcher();
  const ctx = g.batterCtx || { pow: batter.pow, con: batter.con, spd: batter.spd, flags:{} };
  const diff = DIFF[State.difficulty];
  const half = diff.sweetWidth / 2;
  const perfectDist = Math.abs(cursorT - p.ideal);
  /* contact quality in [0,1]. 1 means dead-center of sweet zone. */
  const contactRaw = 1 - perfectDist / 0.5;
  const contactBoost = (ctx.con - 50) / 200;   /* +/- 0.25 */
  let contact = clamp(contactRaw + contactBoost, 0, 1);
  let inZone = perfectDist <= half;

  /* Lady Liberty is the joke and the mechanic. She is stone: on any real
     contact the ball leaves the yard, on anything else she strikes out
     looking like a statue would. Nothing in between. */
  if (batter.quirk === 'monument') {
    if (inZone && contact > 0.55) {
      return recordHit('home run', batter);
    }
    g.strikes = 3;
    addLog(`${batter.n} does not move. Strike three.`);
    refreshHud();
    return recordOut('called strikeout', true);
  }

  /* Cowardly Lion bails on borderline pitches. His whiff rate on close ones
     is high, but when the pitch is right in the middle he uncorks. */
  if (batter.quirk === 'skittish' && inZone && contact < 0.65 && Math.random() < 0.35) {
    inZone = false;
    contact *= 0.4;
    addLog(`${batter.n} flinches away from the pitch.`);
  }

  /* Whiff. The swing missed entirely. */
  if (!inZone && contact < 0.4) {
    g.strikes++;
    addLog(`${batter.n} swings and misses.`);
    showCallout('SWING AND MISS', 'strike');
    refreshHud();
    if (g.strikes >= 3) return recordOut('swinging strikeout', true);
    return setTimeout(throwPitch, BEAT.afterWhiff);
  }

  /* Foul: near miss on strike, count strike (but never third strike) */
  if (!inZone) {
    if (g.strikes < 2) g.strikes++;
    addLog(`${batter.n} fouls it off.`);
    showCallout('FOUL BALL', 'sub');
    refreshHud();
    return setTimeout(throwPitch, BEAT.betweenPitches);
  }

  /* Cowardly Lion who did commit gets a burst of nerve on the swing. */
  let powForRoll = ctx.pow;
  if (batter.quirk === 'skittish' && contact > 0.7) powForRoll = Math.min(100, powForRoll + 15);

  /* In zone: resolve to a batted ball outcome. */
  const power = (powForRoll - 50) / 100;   /* +/- .5 */
  const hrChance = 0.02 + contact * 0.20 + Math.max(0, power) * 0.14;
  if (Math.random() < hrChance) return recordHit('home run', batter);

  /* Extra base */
  if (Math.random() < 0.05 + contact * 0.08 + Math.max(0, power) * 0.06) {
    return recordHit(Math.random() < 0.35 ? 'triple' : 'double', batter);
  }
  /* Single vs out. The Invisible Man is genuinely hard to find in the field:
     an extra chance to sneak a grounder through when he swings. */
  let hitOdds = 0.28 + contact * 0.45 + (ctx.spd - 50)/300;
  if (batter.k === 'invisible') hitOdds += 0.05;
  if (Math.random() < hitOdds) return recordHit('single', batter);
  /* Out on contact */
  const out = Math.random() < 0.55 ? 'ground out' : 'fly out';
  addLog(`${batter.n} ${out}s to the ${randPos(out)}.`);
  showCallout(out === 'ground out' ? 'GROUND OUT' : 'FLY OUT', 'sub');
  refreshHud();
  return recordOut(out, false);
}

function randPos(out) {
  if (out === 'ground out') return ['pitcher','shortstop','second','third','first'][Math.floor(Math.random()*5)];
  return ['left','center','right'][Math.floor(Math.random()*3)];
}

function recordHit(kind, batter) {
  const g = State.game;
  statBump(batter.k,'ab');
  statBump(batter.k,'hits');
  const bases = { 'single':1,'double':2,'triple':3,'home run':4 }[kind];
  if (kind === 'home run') {
    statBump(batter.k,'hr');
    let scored = 1;   /* the batter */
    for (let i=0;i<3;i++) if (g.bases[i]) scored++;
    g.bases = [null,null,null];
    scoreRuns(scored);
    addLog(`${batter.n} crushes it. HOME RUN. ${scored} run${scored>1?'s':''} score.`, true);
    showCallout(`HOME RUN · ${scored} RUN${scored>1?'S':''}`, 'homer');
  } else {
    /* Advance existing runners by `bases`, then place batter */
    let scored = 0;
    const newBases = [null,null,null];
    for (let i=2;i>=0;i--) {
      const runner = g.bases[i];
      if (!runner) continue;
      const dest = i + bases;   /* 0=first, 1=second, 2=third; dest>=3 scores */
      if (dest >= 3) scored++;
      else newBases[dest] = runner;
    }
    if (bases < 4) newBases[bases-1] = batter;
    g.bases = newBases;
    if (scored) scoreRuns(scored);
    addLog(`${batter.n} lines a ${kind}${scored ? `, ${scored} run${scored>1?'s':''} score` : ''}.`);
    showCallout(kind.toUpperCase() + (scored ? ` · ${scored} IN` : ''), scored ? 'homer' : 'hit');
  }
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, kind === 'home run' ? BEAT.afterHomer : BEAT.afterHit);
}

function recordWalk() {
  const g = State.game;
  const batter = currentBatter();
  addLog(`${batter.n} walks.`);
  showCallout('WALK', 'sub');
  const bases = g.bases;
  let scored = 0;
  if (bases[0] && bases[1] && bases[2]) { scored = 1; g.bases = [batter, bases[0], bases[1]]; }
  else if (bases[0] && bases[1]) { g.bases = [batter, bases[0], bases[1]]; }
  else if (bases[0]) { g.bases = [batter, bases[0], bases[2]]; }
  else { g.bases = [batter, bases[1], bases[2]]; }
  if (scored) scoreRuns(scored);
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, BEAT.afterWalk);
}

function recordOut(reason, isStrikeout) {
  const g = State.game;
  const batter = currentBatter();
  statBump(batter.k,'ab');
  if (isStrikeout) statBump(batter.k,'so');
  g.outs++;
  addLog(`${batter.n} out (${reason}). ${g.outs} out.`);
  if (isStrikeout) showCallout('STRIKEOUT', 'strike');
  if (g.outs >= 3) return endHalfInning();
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, BEAT.afterOut);
}

function nextBatter() {
  const t = currentBattingTeam();
  t.idx = (t.idx + 1) % 9;
  const g = State.game;
  g.balls = 0; g.strikes = 0;
}

function scoreRuns(n) {
  const t = currentBattingTeam();
  t.score += n;
}

function endHalfInning() {
  const g = State.game;
  addLog(`Side retired. End of ${g.half === 'top' ? 'top' : 'bottom'} of ${g.inning}.`, true);
  showCallout('SIDE RETIRED', 'homer');
  g.bases = [null,null,null];
  g.outs = 0;
  g.balls = 0; g.strikes = 0;
  if (g.half === 'top') {
    g.half = 'bottom';
  } else {
    g.half = 'top';
    g.inning++;
  }
  const done = checkGameOver();
  refreshHud();
  if (done) return finishGame();
  setTimeout(startAtBat, BEAT.betweenHalfInnings);
}

function checkGameOver() {
  const g = State.game;
  /* After 9 (or configured) full innings, tied continues; unless capped for arcade. */
  if (g.inning > g.innings) {
    if (g.away.score !== g.home.score) {
      g.over = true;
      g.winner = g.home.score > g.away.score ? 'home' : 'away';
      return true;
    }
  }
  /* Walk off: home leads at end of top after regulation */
  if (g.inning > g.innings && g.half === 'bottom' && g.home.score > g.away.score) {
    g.over = true; g.winner = 'home'; return true;
  }
  /* If we're in bottom of last inning and home leads, skip */
  if (g.inning === g.innings && g.half === 'top' && g.home.score > g.away.score && g.outs === 0 && g.away.idx === 0) {
    /* We just wrapped, home already leads, no need to bat bottom */
    /* Not triggered normally; the natural flow handles this */
  }
  /* End of top of final inning: if home is ahead, home does not bat */
  if (g.inning > g.innings && g.half === 'bottom') {
    /* We flipped past regulation with home leading or tied is handled above */
  }
  /* Skip bottom half if home leads after top of final inning */
  if (g.half === 'bottom' && g.inning === g.innings && g.home.score > g.away.score) {
    g.over = true; g.winner = 'home'; return true;
  }
  /* Cap arcade blowouts at 25 to prevent slog */
  if (g.away.score - g.home.score >= 15 && g.inning >= Math.max(3, g.innings - 1)) {
    g.over = true; g.winner = 'away'; return true;
  }
  if (g.home.score - g.away.score >= 15 && g.inning >= Math.max(3, g.innings - 1)) {
    g.over = true; g.winner = 'home'; return true;
  }
  return false;
}

function finishGame() {
  const g = State.game;
  g.live = false;
  stopFieldLoop();
  const you = g.away.isYou ? g.away : g.home;
  const foe = g.away.isYou ? g.home : g.away;
  const win = you.score > foe.score;

  if (State.mode === 'season' && State.season && !State.season.playoffs) {
    State.season.results.push({
      opponent: foe.name, win, you: you.score, them: foe.score,
    });
    /* Roll individual stats forward */
    const ps = State.season.playerStats;
    for (const k of Object.keys(g.stats.hr)) ps.hr += g.stats.hr[k];
    for (const k of Object.keys(g.stats.so)) ps.so += g.stats.so[k];
    for (const k of Object.keys(g.stats.sb || {})) ps.sb += g.stats.sb[k];
    for (const k of Object.keys(g.stats.hits)) ps.hits += g.stats.hits[k];
    for (const k of Object.keys(g.stats.ab)) ps.ab += g.stats.ab[k];
    saveSeason(State.season);
  } else if (State.mode === 'playoff' && State.season) {
    /* Record playoff result */
    const P = State.season.playoffs;
    const match = g.mode === 'playoff' && g.round === 'semi' ? P.semis[g.matchIdx] : P.final;
    const winner = win
      ? (g.away.isYou ? match.away : match.home)
      : (g.away.isYou ? match.home : match.away);
    match.result = { homeScore: g.home.score, awayScore: g.away.score, winner };
    /* If any CPU semis remain, they will sim next when the bracket page shows */
    saveSeason(State.season);
  }
  State.screen = 'result';
  render();
}

/* ============================================================================
   FIELD AND METER RENDERING
   ============================================================================ */
function drawField(ctx, w, h, t, pitch, inWindup) {
  /* Sky above, then dirt warning track, then outfield grass, then the
     infield dirt diamond. Everything sized to the field's own w and h so
     the canvas can be resized. */
  ctx.fillStyle = '#0b1015';
  ctx.fillRect(0,0,w,h);

  const skyH = h * 0.12;
  ctx.fillStyle = '#132434';
  ctx.fillRect(0,0,w,skyH);
  /* stadium seats hatched */
  ctx.fillStyle = '#0d1a25';
  for (let x = 0; x < w; x += 6) ctx.fillRect(x, skyH - 14, 3, 14);
  ctx.fillStyle = '#1a2a3a';
  for (let x = 3; x < w; x += 6) ctx.fillRect(x, skyH - 8, 3, 8);

  /* Outfield grass with mowed stripe pattern */
  const grassY = skyH;
  ctx.fillStyle = '#245a2c';
  ctx.fillRect(0, grassY, w, h - grassY);
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,.03)' : 'rgba(0,0,0,.05)';
    const stripeH = (h - grassY) / 8;
    ctx.fillRect(0, grassY + i * stripeH, w, stripeH);
  }
  /* Warning track along the wall */
  ctx.fillStyle = '#8a5a2c';
  ctx.fillRect(0, grassY, w, 12);

  /* Home-plate camera: put the plate in the lower portion, mound up. */
  const cx = w/2;
  const cy = h * 0.58;
  const r = Math.min(w, h) * 0.30;

  /* Infield dirt diamond */
  ctx.fillStyle = '#8b5a24';
  ctx.beginPath();
  ctx.moveTo(cx, cy - r);
  ctx.lineTo(cx + r, cy);
  ctx.lineTo(cx, cy + r);
  ctx.lineTo(cx - r, cy);
  ctx.closePath();
  ctx.fill();

  /* Infield grass */
  ctx.fillStyle = '#2b6a30';
  const rInner = r * 0.62;
  ctx.beginPath();
  ctx.moveTo(cx, cy - rInner);
  ctx.lineTo(cx + rInner, cy);
  ctx.lineTo(cx, cy + rInner);
  ctx.lineTo(cx - rInner, cy);
  ctx.closePath();
  ctx.fill();

  /* Foul lines */
  ctx.strokeStyle = '#eaeaea';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy + r);
  ctx.lineTo(cx - w, cy + r + w);   /* down-left */
  ctx.moveTo(cx, cy + r);
  ctx.lineTo(cx + w, cy + r + w);   /* down-right */
  ctx.stroke();

  /* Batter's box */
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(cx - 34, cy + r - 8, 26, 32);
  ctx.strokeRect(cx + 8, cy + r - 8, 26, 32);

  /* Bases */
  const bases = [
    [cx + r, cy],
    [cx, cy - r],
    [cx - r, cy],
  ];
  ctx.fillStyle = '#eaeaea';
  bases.forEach(([bx,by]) => { ctx.fillRect(bx-7, by-7, 14, 14); });

  /* Home plate: pentagon */
  ctx.beginPath();
  ctx.moveTo(cx - 10, cy + r);
  ctx.lineTo(cx + 10, cy + r);
  ctx.lineTo(cx + 10, cy + r + 6);
  ctx.lineTo(cx, cy + r + 12);
  ctx.lineTo(cx - 10, cy + r + 6);
  ctx.closePath();
  ctx.fill();

  /* Pitcher's mound */
  ctx.fillStyle = '#a66a2c';
  ctx.beginPath(); ctx.arc(cx, cy, 18, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#eaeaea';
  ctx.fillRect(cx - 8, cy - 2, 16, 4);

  /* Runners on base */
  const g = State.game;
  if (g) {
    const bs = g.bases;
    if (bs[0]) drawRunner(ctx, bases[0][0], bases[0][1] - 4, bs[0]);
    if (bs[1]) drawRunner(ctx, bases[1][0], bases[1][1] - 4, bs[1]);
    if (bs[2]) drawRunner(ctx, bases[2][0], bases[2][1] - 4, bs[2]);
    /* Batter next to the plate, offset into the left batter's box */
    const batter = currentBatter();
    if (batter) drawRunner(ctx, cx - 22, cy + r + 6, batter, 3);
    /* Catcher behind plate */
    const catcher = { ...(currentFieldingTeam().batters[8] || currentFieldingTeam().batters[1]) };
    if (catcher && catcher.pal) drawRunner(ctx, cx, cy + r + 22, catcher, 2.4);
    /* Pitcher on the mound */
    const pit = currentPitcher();
    if (pit) drawRunner(ctx, cx, cy - 6, pit, 3);
    /* A little fielder cluster behind the mound so the field isn't empty */
    const fs = currentFieldingTeam().batters;
    if (fs[2]) drawRunner(ctx, cx - r*0.55, cy - r*0.15, fs[2], 2.2);   /* shortstop */
    if (fs[3]) drawRunner(ctx, cx + r*0.55, cy - r*0.15, fs[3], 2.2);   /* second */
    if (fs[4]) drawRunner(ctx, cx + r*0.85, cy + r*0.10, fs[4], 2.2);   /* first */
    if (fs[5]) drawRunner(ctx, cx - r*0.85, cy + r*0.10, fs[5], 2.2);   /* third */
    if (fs[6]) drawRunner(ctx, cx - w*0.28, cy - h*0.14, fs[6], 2.4);   /* left field */
    if (fs[7]) drawRunner(ctx, cx,           cy - h*0.20, fs[7], 2.4);  /* center */
    if (fs[1]) drawRunner(ctx, cx + w*0.28, cy - h*0.14, fs[1], 2.4);   /* right */
  }

  /* Pitch ball moving from mound to plate */
  if (pitch && !inWindup) {
    const bx = cx;
    const by = cy;
    const px = cx;
    const py = cy + r - 4;
    let e = t;
    if (pitch.pt === 'changeup') e = t*t;
    let ballX = bx + (px - bx) * e;
    let ballY = by + (py - by) * e;
    if (pitch.pt === 'curveball') {
      ballX += Math.sin(e * Math.PI) * 12 * (pitch.ideal < 0.5 ? -1 : 1);
    }
    /* trail */
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.arc(ballX - (px-bx)*.06, ballY - (py-by)*.06, 3, 0, Math.PI*2); ctx.fill();
    /* ball */
    ctx.fillStyle = '#eaeaea';
    ctx.beginPath(); ctx.arc(ballX, ballY, 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#c94b1a';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(ballX, ballY, 4, -Math.PI*0.2, Math.PI*0.3); ctx.stroke();
  }
}

const runnerCache = new Map();
function drawRunner(ctx, x, y, character, scale) {
  scale = scale || 3;
  const key = character.k + '@' + scale;
  let cv = runnerCache.get(key);
  if (!cv) { cv = spriteCanvas(character, Math.round(SPRITE_W * scale)); runnerCache.set(key, cv); }
  /* Anchor at the feet: shift up by the sprite's full height. */
  ctx.drawImage(cv, Math.round(x - cv.width/2), Math.round(y - cv.height));
}

function drawMeter(ctx, w, h, t, pitch, inWindup) {
  ctx.fillStyle = '#0c1218';
  ctx.fillRect(0,0,w,h);
  const diff = DIFF[State.difficulty];
  const half = diff.sweetWidth / 2;
  const ideal = pitch.ideal;
  /* Ok zones (wider yellow band around the green) */
  ctx.fillStyle = 'rgba(244,194,90,.28)';
  ctx.fillRect((ideal - half*1.8) * w, 0, half*3.6*w, h);
  /* Perfect zone */
  ctx.fillStyle = 'rgba(91,176,131,.65)';
  ctx.fillRect((ideal - half) * w, 0, half*2 * w, h);
  /* Cursor: brighter and thicker so it reads through the gradient */
  if (!inWindup) {
    const x = t * w;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x - 2, 0, 4, h);
    ctx.fillStyle = '#f4c25a';
    ctx.fillRect(x - 1, 0, 2, h);
  } else {
    /* windup: dim the whole meter and pulse a hint at the ideal spot */
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(0, 0, w, h);
    const pulse = 0.5 + 0.5 * Math.sin(performance.now()/140);
    ctx.fillStyle = `rgba(244,194,90,${0.35 + pulse*0.4})`;
    ctx.fillRect(ideal*w - 2, 0, 4, h);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('GET READY', w/2, h/2);
  }
  /* Ticks along the bottom */
  ctx.fillStyle = 'rgba(255,255,255,.20)';
  for (let i=1;i<10;i++) ctx.fillRect(i*w/10, h-5, 1, 5);
}

/* ============================================================================
   HUD
   ============================================================================ */
function renderGame() {
  const g = State.game;
  const s = el('div','screen');

  const arena = el('div','arena');
  const cv = document.createElement('canvas');
  cv.id = 'field'; cv.width = 960; cv.height = 660;
  arena.appendChild(cv);

  /* Score and inning overlaid on the field's corners so nothing steals room
     from the diamond. Names inside color chips read at a glance without
     needing a label. */
  const tl = el('div','corner tl',
    `<span class="lbl">${g.away.name}${g.away.isYou?' (you)':''}</span>`
    + `<span class="val ${g.away.isYou?'gold':''}" id="hud-away">${g.away.score}</span>`
  );
  const tr = el('div','corner tr',
    `<span class="lbl">${g.home.name}${g.home.isYou?' (you)':''}</span>`
    + `<span class="val ${g.home.isYou?'gold':''}" id="hud-home">${g.home.score}</span>`
  );
  const bl = el('div','corner bl',
    `<span class="lbl">Inning</span>`
    + `<span class="val" id="hud-inning">${g.half==='top'?'Top':'Bot'} ${g.inning}/${g.innings}</span>`
  );
  const br = el('div','corner br',
    `<span class="val" id="hud-count">Outs ${g.outs} · ${g.balls}-${g.strikes}</span>`
  );
  arena.append(tl, tr, bl, br);

  const callout = el('div','callout'); callout.id = 'callout';
  arena.appendChild(callout);
  s.appendChild(arena);

  const meter = el('div','meter-wrap');
  const b = currentBatter(), p = currentPitcher();
  meter.innerHTML = `<div class="label">`
    + `<span><b class="pt" id="pt-name">Get ready</b></span>`
    + `<span>Click anywhere or press Space</span></div>`;
  const m = document.createElement('canvas'); m.id='meter'; m.width=720; m.height=52;
  meter.appendChild(m);
  meter.appendChild(el('div','hint', 'Land the marker on the <b>green zone</b> to make solid contact.'));
  s.appendChild(meter);

  const atbat = el('div','atbat');
  atbat.id = 'atbat';
  refreshAtBatCard(atbat);
  s.appendChild(atbat);

  const log = el('div','log');
  log.id = 'log';
  for (const line of g.log.slice(-14)) {
    const d = el('div', 'line' + (line.big?' big':''), line.text);
    log.appendChild(d);
  }
  s.appendChild(log);

  const ctrl = el('div','controls');
  const abort = el('button','btn ghost','End Game');
  abort.onclick = () => {
    if (confirm('End this game and return to the menu?')) {
      endAtBatCleanup();
      State.game = null; State.screen = State.mode==='exhibition' ? 'menu' : 'season-hub';
      render();
    }
  };
  ctrl.appendChild(abort);
  s.appendChild(ctrl);

  app.appendChild(s);
  /* Start the always-on field paint loop as soon as the canvas is in the DOM. */
  startFieldLoop();
}

/* One flavor callout at a time. Overlays the field for 1.4s, fades out.
   `kind` picks a color: default gold, plus homer, hit, strike, ball, sub. */
let calloutTimer = 0;
function showCallout(text, kind) {
  const node = document.getElementById('callout');
  if (!node) return;
  node.textContent = text;
  node.className = 'callout on ' + (kind || '');
  clearTimeout(calloutTimer);
  calloutTimer = setTimeout(() => { node.classList.remove('on'); }, 1400);
}

function refreshAtBatCard(node) {
  const g = State.game;
  const b = currentBatter();
  const p = currentPitcher();
  node.innerHTML = '';
  const avatar = spriteCanvas(b, 48);
  avatar.className = 'avatar';
  node.appendChild(avatar);
  const info = el('div', null,
    `<div class="who"><b>${b.n}</b> at bat</div>`
    + `<div class="vs">vs ${p.n} pitching · POW ${b.pow} · CON ${b.con} · SPD ${b.spd}</div>`
  );
  node.appendChild(info);
  const count = el('div','count', `${g.balls}-${g.strikes}`);
  node.appendChild(count);
}

function refreshHud() {
  if (State.screen !== 'game') return;
  const g = State.game;
  const hudAway = document.getElementById('hud-away');
  const hudHome = document.getElementById('hud-home');
  const hudInn = document.getElementById('hud-inning');
  const hudCount = document.getElementById('hud-count');
  if (hudAway) hudAway.textContent = g.away.score;
  if (hudHome) hudHome.textContent = g.home.score;
  if (hudInn) hudInn.textContent = `${g.half==='top'?'Top':'Bot'} ${g.inning}/${g.innings}`;
  if (hudCount) hudCount.textContent = `Outs ${g.outs} · ${g.balls}-${g.strikes}`;
  const ab = document.getElementById('atbat');
  if (ab) refreshAtBatCard(ab);
  const log = document.getElementById('log');
  if (log) {
    log.innerHTML = '';
    for (const line of g.log.slice(-14)) {
      const d = el('div','line' + (line.big?' big':''), line.text);
      log.appendChild(d);
    }
    log.scrollTop = log.scrollHeight;
  }
  const ptName = document.getElementById('pt-name');
  if (ptName && g.pitch) ptName.textContent = g.pitch.pt.toUpperCase();
}

function addLog(text, big=false) {
  const g = State.game;
  g.log.push({ text, big });
}

/* ============================================================================
   RESULT SCREEN
   ============================================================================ */
function renderResult() {
  const g = State.game;
  const you = g.away.isYou ? g.away : g.home;
  const foe = g.away.isYou ? g.home : g.away;
  const win = you.score > foe.score;

  const s = el('div','screen');
  s.appendChild(el('h2', null, win ? 'You win.' : 'You lose.'));

  const card = el('div','card');
  card.innerHTML =
    `<h3>Final</h3>`
    + `<p style="font-size:16px;color:var(--text)">${you.name} <b>${you.score}</b> · ${foe.name} ${foe.score}</p>`;
  const games = el('h3', null, 'Your batting');
  card.appendChild(games);
  const stats = el('table','table');
  stats.innerHTML = '<thead><tr><th>Batter</th><th class="n">AB</th><th class="n">H</th><th class="n">HR</th><th class="n">K</th></tr></thead>';
  const tb = el('tbody');
  const yourTeam = State.team.map(k => ROSTER_BY_KEY[k]);
  for (const b of yourTeam) {
    const ab = g.stats.ab[b.k] || 0;
    const h = g.stats.hits[b.k] || 0;
    const hr = g.stats.hr[b.k] || 0;
    const so = g.stats.so[b.k] || 0;
    if (!ab && !h) continue;
    const tr = el('tr');
    tr.innerHTML = `<td>${b.n}</td><td class="n">${ab}</td><td class="n">${h}</td><td class="n">${hr}</td><td class="n">${so}</td>`;
    tb.appendChild(tr);
  }
  stats.appendChild(tb);
  card.appendChild(stats);
  s.appendChild(card);

  const row = el('div','btn-row');
  if (State.mode === 'exhibition') {
    const again = el('button','btn','Play Again');
    again.onclick = () => { State.opponent = randomOpponent(null); startGame({ mode:'exhibition' }); };
    const menu = el('button','btn ghost','Main Menu');
    menu.onclick = () => { State.game = null; State.screen='menu'; render(); };
    row.append(again, menu);
  } else if (State.mode === 'season') {
    const hub = el('button','btn','Continue');
    hub.onclick = () => { State.game = null; State.screen='season-hub'; render(); };
    row.append(hub);
  } else if (State.mode === 'playoff') {
    const b = el('button','btn','Back to Bracket');
    b.onclick = () => { State.game = null; State.screen='bracket'; render(); };
    row.append(b);
  }
  s.appendChild(row);

  app.appendChild(s);
}

/* ============================================================================
   SEASON END
   ============================================================================ */
function renderSeasonEnd() {
  const S = State.season;
  const P = S.playoffs;
  const champ = (P && P.final && P.final.result)
    ? P.seeds[P.final.result.winner]
    : null;
  const youWon = champ && champ.you;

  const s = el('div','screen');
  s.appendChild(el('h2', null, youWon ? 'Champions.' : 'Season complete.'));
  const card = el('div','card');
  const rec = seasonRecord(S);
  card.innerHTML = `<p>Regular season ${rec.w}-${rec.l}.</p>`;
  if (champ) card.innerHTML += `<p>Champion: <b style="color:var(--gold)">${champ.name}</b></p>`;
  const ps = S.playerStats;
  card.innerHTML +=
    `<h3>Season totals</h3>`
    + `<p>Hits ${ps.hits} · HR ${ps.hr} · K ${ps.so} · AB ${ps.ab}</p>`;
  s.appendChild(card);

  const row = el('div','btn-row');
  const restart = el('button','btn','Play Again');
  restart.onclick = () => {
    clearSeason(); State.season = null; State.screen='menu'; render();
  };
  const menu = el('button','btn ghost','Main Menu');
  menu.onclick = () => {
    clearSeason(); State.season = null; State.screen='menu'; render();
  };
  row.append(restart, menu);
  s.appendChild(row);

  app.appendChild(s);
}

/* ============================================================================
   UTIL
   ============================================================================ */
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

render();
</script>
