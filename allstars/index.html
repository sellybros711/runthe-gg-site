function nextPlayoffMatch(P) {
  for (let i=0;i<P.semis.length;i++) {
    const m = P.semis[i];
    if (!m.result) {
      const you = P.seeds[m.home].you || P.seeds[m.away].you;
      return { round:'semi', idx:i, match:m, playerInvolved: you };
    }
  }
  if (!P.final) {
    const winners = P.semis.map(m => m.result.winner);
    P.final = { home:winners[0], away:winners[1], result:null };
  }
  if (P.final && !P.final.result) {
    const you = P.seeds[P.final.home].you || P.seeds[P.final.away].you;
    return { round:'final', idx:0, match:P.final, playerInvolved: you };
  }
  return null;
}

function simulateCpuMatch(nm) {
  const P = State.season.playoffs;
  const m = nm.match;
  const home = P.seeds[m.home];
  const away = P.seeds[m.away];
  const hr = teamRating(home.roster);
  const ar = teamRating(away.roster);
  const homeAdv = 3;
  const hs = Math.max(0, Math.round(4 + (hr - ar)*0.06 + homeAdv*0.3 + (Math.random()-0.5)*3));
  const as = Math.max(0, Math.round(4 + (ar - hr)*0.06 + (Math.random()-0.5)*3));
  const finalHome = hs === as ? hs + 1 : hs;
  m.result = { homeScore:finalHome, awayScore:as, winner: finalHome > as ? m.home : m.away };
}

function startPlayoffMatch(nm) {
  const S = State.season;
  const P = S.playoffs;
  const m = nm.match;
  const home = P.seeds[m.home];
  const away = P.seeds[m.away];
  const youHome = home.you;
  const you = youHome ? home : away;
  const foe = youHome ? away : home;
  State.team = you.roster;
  State.teamName = you.name;
  State.opponent = { name: foe.name, color: (opponentByName(foe.name)?.color) || '#8a1a1a', roster: foe.roster };
  State.innings = S.innings;
  State.difficulty = S.difficulty;
  startGame({ mode:'playoff', round: nm.round, matchIdx: nm.idx, youHome });
}

/* ============================================================================
   GAME
   ============================================================================ */
function startGame(opts) {
  const battersAway = State.team.map(k => ROSTER_BY_KEY[k]);
  const battersHome = State.opponent.roster.map(k => ROSTER_BY_KEY[k]);
  /* User bats AWAY (visitor), opponent home. In playoffs the flag flips. */
  const youHome = !!opts.youHome;
  State.game = {
    live: true,
    mode: opts.mode,
    round: opts.round, matchIdx: opts.matchIdx,
    innings: State.innings,
    half: 'top',       /* 'top' means away batting */
    inning: 1,
    outs: 0,
    balls: 0, strikes: 0,
    bases: [null,null,null],
    away: { name: youHome ? State.opponent.name : State.teamName, batters: youHome ? battersHome : battersAway, idx:0, score:0, isYou: !youHome, color: youHome ? State.opponent.color : '#f4c25a' },
    home: { name: youHome ? State.teamName : State.opponent.name, batters: youHome ? battersAway : battersHome, idx:0, score:0, isYou: youHome, color: youHome ? '#f4c25a' : State.opponent.color },
    stats: { hr:{}, so:{}, sb:{}, hits:{}, ab:{} },
    lineScore: { away:[0], home:[] },   /* runs per inning, per side */
    fx: [],           /* live particles: dust, confetti, glove flashes */
    shakeUntil: 0,    /* camera shake deadline (home runs) */
    log: [],
    pitch: null,      /* the current pitch animation */
    over: false,
    winner: null,
  };
  State.screen = 'game';
  render();
  setTimeout(startAtBat, 400);
}

function currentBattingTeam() {
  const g = State.game;
  return g.half === 'top' ? g.away : g.home;
}
function currentFieldingTeam() {
  const g = State.game;
  return g.half === 'top' ? g.home : g.away;
}
function currentBatter() {
  const t = currentBattingTeam();
  return t.batters[t.idx % 9];
}
function currentPitcher() {
  return currentFieldingTeam().batters[0];  /* first pick pitches */
}
function playerIsBatting() {
  return currentBattingTeam().isYou;
}
function statBump(k, key) {
  const g = State.game;
  g.stats[key][k] = (g.stats[key][k] || 0) + 1;
}

/* Difficulty tunings.
   ideal[a,b] = the fraction-of-meter window that produces solid contact.
   speed = seconds for the meter cursor to sweep across.
   pitcherSkill = multiplier on pitcher CON that shifts the meter's ideal spot. */
const DIFF = {
  easy:   { speed: 2.1, sweetWidth: 0.26, pitcherSkill: 0.85 },
  medium: { speed: 1.7, sweetWidth: 0.20, pitcherSkill: 1.00 },
  hard:   { speed: 1.35, sweetWidth: 0.16, pitcherSkill: 1.12 },
};

/* Pitcher fatigue: each inning past the third, the pitcher tires. The
   effect grows the wobble on the ideal spot and drops the strike rate.
   Returns a scaling context resolveSwing and throwPitch consult per pitch. */
function pitcherFatigue() {
  const g = State.game;
  const past = Math.max(0, g.inning - 3);
  return {
    wobbleMult: 1 + past * 0.25,
    strikeDrop: past * 0.03,
    level: past,   /* 0 fresh, 1 tiring, 2 gassed, 3+ cooked */
  };
}

/* Pause lengths in ms. Named so nothing tunes one number without seeing what
   the others are set to; the game's pacing lives here more than anywhere
   else. */
const BEAT = {
  windup:    700,   /* pitcher into set, meter shows but does not sweep yet */
  betweenPitches: 900,   /* after ball/called strike/foul */
  afterWhiff: 950,
  afterOut:   1500,
  afterWalk:  1600,
  afterHit:   2000,
  afterHomer: 2600,
  betweenHalfInnings: 2600,
  intoAtBat: 700,   /* new batter walks up */
};

let atBatCleanup = null;
function endAtBatCleanup() {
  if (atBatCleanup) { atBatCleanup(); atBatCleanup = null; }
}

/* A single, always-on animation loop paints the field and the meter every
   frame while the game screen is up. Individual pitches only own the click
   listener and the "no swing = called pitch" trigger; the drawing lives
   here so the diamond stays visible between pitches, half innings, and
   result callouts. */
let fieldRafId = 0;
function startFieldLoop() {
  cancelAnimationFrame(fieldRafId);
  const paint = () => {
    if (State.screen !== 'game' || !State.game) {
      fieldRafId = 0;
      return;
    }
    const fCv = document.getElementById('field');
    const mCv = document.getElementById('meter');
    if (fCv && mCv) {
      const g = State.game;
      const p = g.pitch;
      let t = 0, inWindup = true;
      if (p) {
        const now = performance.now();
        if (now < p.windupUntil) { t = 0; inWindup = true; }
        else {
          const durMs = p.speed * 1000;
          t = clamp((now - p.start) / durMs, 0, 1);
          inWindup = false;
          /* No swing by pitch end. Trigger the called pitch once. */
          if (t >= 1 && !p.swung && !p.resolved) {
            p.resolved = true;
            resolveCalledPitch();
          }
        }
      }
      drawField(fCv.getContext('2d'), fCv.width, fCv.height, t, p || null, inWindup);
      drawMeter(mCv.getContext('2d'), mCv.width, mCv.height, t, p || { ideal: 0.5, pt: 'fastball' }, inWindup);
      refreshStealButton();
    }
    fieldRafId = requestAnimationFrame(paint);
  };
  fieldRafId = requestAnimationFrame(paint);
}
function stopFieldLoop() {
  cancelAnimationFrame(fieldRafId);
  fieldRafId = 0;
}

function startAtBat() {
  const g = State.game;
  if (g.over) return;
  g.balls = 0; g.strikes = 0;
  /* Open this half inning's bucket on the line score so the board shows a
     zero for an inning in progress and stays blank for ones not reached. */
  const lsKey = g.half === 'top' ? 'away' : 'home';
  while (g.lineScore[lsKey].length < g.inning) g.lineScore[lsKey].push(0);
  const b = currentBatter();
  g.batterCtx = batterContext(b);
  for (const note of g.batterCtx.notes) addLog(note, true);
  if (g.batterCtx.flags.spinach) {
    showCallout('SPINACH TIME', 'homer');
    g.signature = { kind: 'anchor', until: performance.now() + 1400 };
    Sound.play('homer');
  } else if (g.batterCtx.flags.transformed) {
    showCallout('HYDE TRANSFORMS', 'strike');
  } else {
    showCallout(`${b.n} steps in`, 'sub');
  }
  refreshHud();
  if (playerIsBatting()) {
    setTimeout(throwPitch, BEAT.intoAtBat);
  } else {
    /* Your defense is on the field: you call the pitch. */
    setTimeout(offerPitchSelection, BEAT.intoAtBat);
  }
}

/* When the CPU bats, the player picks the pitch and the target zone. Two
   picks needed; the pitch fires as soon as both are chosen, or after
   five seconds with default values so the game never stalls. The
   selected pitch type matters (each CPU batter has a hidden weak
   pitch), and the target zone shifts both the ideal meter spot and
   the CPU batter's read: corners are hard to square up but risk a
   ball. */
function offerPitchSelection() {
  const g = State.game;
  if (!g || g.over) return;
  const row = document.getElementById('pitch-select');
  if (!row) return throwPitch();
  row.style.display = '';
  let chosenPt = null, chosenZone = null;
  let done = false;
  const fire = () => {
    if (done) return;
    done = true;
    row.style.display = 'none';
    clearTimeout(timer);
    for (const btn of row.querySelectorAll('button')) btn.onclick = null;
    /* Sensible defaults so the game never stalls: fastball down the middle. */
    throwPitch(chosenPt || 'fastball', chosenZone == null ? 4 : chosenZone);
  };
  const timer = setTimeout(fire, 5000);
  for (const btn of row.querySelectorAll('button[data-pt]')) {
    btn.onclick = (e) => {
      e.stopPropagation();
      chosenPt = btn.dataset.pt;
      for (const b of row.querySelectorAll('button[data-pt]')) b.classList.remove('selected');
      btn.classList.add('selected');
      if (chosenZone != null) fire();
    };
  }
  for (const btn of row.querySelectorAll('button[data-zone]')) {
    btn.onclick = (e) => {
      e.stopPropagation();
      chosenZone = parseInt(btn.dataset.zone, 10);
      for (const b of row.querySelectorAll('button[data-zone]')) b.classList.remove('selected');
      btn.classList.add('selected');
      if (chosenPt) fire();
    };
  }
}

/* Quirk hook. Called once per at bat. Returns a stat snapshot the swing
   resolver reads, so per at bat modifiers (Hyde's transformation, etc.)
   never mutate the underlying ROSTER entry. */
function batterContext(b) {
  const g = State.game;
  const ctx = { pow: b.pow, con: b.con, spd: b.spd, notes: [], flags: {} };
  if (b.quirk === 'transform' && Math.random() < 0.16) {
    ctx.pow = Math.max(ctx.pow, 96);
    ctx.con = Math.max(ctx.con, 78);
    ctx.notes.push(`${b.n} transforms. All power, no manners.`);
    ctx.flags.transformed = true;
  }
  /* Popeye eats his spinach once per game, on his third plate appearance.
     Roman announces it with a callout, and his POW/CON spike for that
     at bat only. Big signature moment. */
  if (b.k === 'popeye') {
    g.popeyeApps = (g.popeyeApps || 0) + 1;
    if (g.popeyeApps === 3 && !g.popeyeSpinach) {
      g.popeyeSpinach = true;
      ctx.pow = 100;
      ctx.con = Math.max(ctx.con, 88);
      ctx.notes.push('Popeye eats his spinach!');
      ctx.flags.spinach = true;
    }
  }
  /* Dracula bats at night: he tunes up as innings pile on (his stats
     rise a hair per inning past the third, mirroring pitcher fatigue). */
  if (b.k === 'dracula' && g.inning >= 4) {
    ctx.pow = Math.min(100, ctx.pow + (g.inning - 3) * 2);
  }
  return ctx;
}

function throwPitch(chosenPt, chosenZone) {
  const g = State.game;
  if (g.over) return;
  const diff = DIFF[State.difficulty];
  const batter = currentBatter();
  const pitcher = currentPitcher();
  /* Pick a pitch type: player choice when they're calling, else random. */
  const pitchTypes = ['fastball','curveball','changeup'];
  const pt = chosenPt && pitchTypes.includes(chosenPt) ? chosenPt : pitchTypes[Math.floor(Math.random()*3)];
  /* Each CPU at bat has a hidden weak pitch. Hitting it costs the batter
     a chunk of contact quality, which the swing AI reads. */
  if (!g.batterCtx.weakPitch) {
    g.batterCtx.weakPitch = pitchTypes[Math.floor(Math.random()*3)];
  }
  /* speed multiplier: fastball fast, curve normal, change starts fast slows down */
  const baseSpeed = diff.speed
    * (pt === 'fastball' ? 0.85 : pt === 'curveball' ? 1.15 : 1.0)
    / (0.85 + pitcher.pow / 400);
  /* ideal timing sweet spot centered around 0.55, shifted by pitcher control */
  const idealBase = pt === 'fastball' ? 0.5 : pt === 'curveball' ? 0.60 : 0.62;
  const fatigue = pitcherFatigue();
  let wobble = (Math.random() - 0.5) * 0.06 * diff.pitcherSkill * fatigue.wobbleMult;
  /* Scarecrow rattles the pitcher. His ideal spot swings wider than anyone
     else's on the roster, so timing him takes reading the meter, not muscle
     memory. */
  if (batter.quirk === 'confuse') {
    wobble += (Math.random() - 0.5) * 0.14;
  }
  let ideal = clamp(idealBase + wobble, 0.28, 0.78);
  /* Ball is a strike or a ball. The pitcher's control determines it, minus
     any accumulated fatigue for this pitcher over the game. */
  const strikeProb = 0.55 + (pitcher.con || pitcher.def*0.4) / 300 - fatigue.strikeDrop;
  let isStrike = Math.random() < clamp(strikeProb, 0.4, 0.85);

  /* Aim: player-chosen 3x3 zone (0..8; 4 = center) shifts the ideal meter
     spot horizontally and lowers the CPU batter's contact against corners.
     A pitcher's CON stat determines whether they land the pitch in the
     called zone or miss (which flips it to a ball on corner calls). */
  let zoneAim = null;
  if (chosenZone != null && chosenZone >= 0 && chosenZone < 9) {
    const col = chosenZone % 3;         /* 0 in, 1 mid, 2 out */
    const row = Math.floor(chosenZone / 3);  /* 0 high, 1 mid, 2 low */
    const isCorner = col !== 1 && row !== 1;
    const isEdge = !isCorner && chosenZone !== 4;
    zoneAim = { col, row, isCorner, isEdge };
    /* Push the ideal spot toward the corner: inside high shifts one way,
       outside low the other, so the meter target isn't always centered. */
    ideal += (col - 1) * 0.06 + (row - 1) * 0.02;
    ideal = clamp(ideal, 0.18, 0.86);
    /* The pitcher's control decides if the pitch lands in the called
       zone. Miss the corner and it's a ball. */
    const landRoll = Math.random();
    const controlChance = 0.55 + (pitcher.con || 50) / 250 - fatigue.strikeDrop
                       - (isCorner ? 0.20 : isEdge ? 0.08 : 0);
    if (landRoll > clamp(controlChance, 0.30, 0.95)) {
      /* Missed the spot: center pitches still land for strikes, corner
         and edge misses become balls. */
      if (isCorner || isEdge) isStrike = false;
    } else {
      isStrike = true;
    }
  }
  /* Windup: the meter is on screen but does not sweep for a beat. This is
     the player's chance to see the pitcher, the pitch type, the ideal spot,
     and settle. `start` gets set when the sweep actually begins. */
  g.pitch = {
    pt, speed: baseSpeed, ideal, isStrike,
    zoneAim,
    start: performance.now() + BEAT.windup,
    windupUntil: performance.now() + BEAT.windup,
    swung: false,
    hit: false,
  };
  refreshHud();
  runPitchAnimation();
}

/* Install the swing click and space listeners for this pitch. The field
   loop (startFieldLoop) handles all the painting and the "no swing = called
   pitch" transition. When the CPU is batting instead of the player,
   nothing listens for a click; a scheduled CPU swing takes its shot. */
function runPitchAnimation() {
  const g = State.game;
  const p = g.pitch;
  const durMs = p.speed * 1000;
  if (playerIsBatting()) {
    const onClick = (e) => {
      if (p.swung) return;
      const now = performance.now();
      if (now < p.windupUntil) return;
      const t = clamp((now - p.start) / durMs, 0, 1);
      p.swung = true;
      resolveSwing(t);
    };
    const onKey = (e) => {
      if (e.code === 'Space') { e.preventDefault(); onClick(e); }
    };
    const teardown = () => {
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('click', onClick, true);
    };
    atBatCleanup = teardown;
    document.addEventListener('keydown', onKey);
    document.addEventListener('click', onClick, true);
    return;
  }
  scheduleCpuSwing();
}

/* CPU batting AI. Reads the pitch's ideal spot, the batter's contact
   stat, and the current count to decide (a) whether to swing at all,
   and (b) how close to the ideal spot to land. Better contact hitters
   land closer; a batter down 0-2 protects the plate. */
function scheduleCpuSwing() {
  const g = State.game;
  const p = g.pitch;
  const batter = currentBatter();
  const diff = DIFF[State.difficulty];
  const durMs = p.speed * 1000;

  /* Swing decision: strikes get swung at more often, balls left alone,
     0-2 counts see the batter foul most anything close. */
  const twoStrikes = g.strikes >= 2;
  const isStrike = p.isStrike;
  let swingProb = isStrike ? 0.68 : 0.20;
  if (twoStrikes) swingProb = isStrike ? 0.92 : 0.55;
  if (g.balls >= 3 && !isStrike) swingProb = 0.10;
  /* Contact hitters swing selectively; hackers hack. */
  swingProb += (batter.con - 60) * 0.001;
  const willSwing = Math.random() < swingProb;

  if (!willSwing) {
    /* Let the pitch pass; the field loop's called-pitch trigger fires. */
    return;
  }

  /* Where the CPU lands the cursor: closer to ideal with better CON, wider
     spread on hard difficulty (harder to hit their sweet timing). */
  const conJitter = (110 - batter.con) / 900;   /* .01 to .12 range */
  const diffJitter = { easy: 0.20, medium: 0.13, hard: 0.09 }[State.difficulty];
  let jitter = conJitter + diffJitter;
  /* Weak pitch: CPU whiffs badly on their weak pitch. */
  if (p.pt === g.batterCtx.weakPitch) jitter += 0.14;
  /* Corner / edge pitches are harder to square up. */
  if (p.zoneAim) {
    if (p.zoneAim.isCorner) jitter += 0.12;
    else if (p.zoneAim.isEdge) jitter += 0.06;
  }
  /* Fresh pitcher vs gassed pitcher moves the needle the other way. */
  const fat = pitcherFatigue();
  jitter -= fat.level * 0.02;
  jitter = clamp(jitter, 0.03, 0.35);

  const dir = Math.random() < 0.5 ? -1 : 1;
  const t = clamp(p.ideal + dir * jitter * Math.random(), 0.02, 0.98);
  /* Time the swing to match that cursor position (fires after the meter
     reaches it). Add the windup so it happens in real time. */
  const fireAt = p.windupUntil + t * durMs;
  const wait = Math.max(0, fireAt - performance.now());
  setTimeout(() => {
    if (!g.pitch || g.pitch !== p || p.swung) return;
    p.swung = true;
    resolveSwing(t);
  }, wait);
}

function resolveCalledPitch() {
  const g = State.game;
  const p = g.pitch;
  if (p.isStrike) { g.strikes++; addLog('Called strike.'); showCallout('STRIKE', 'strike'); Sound.play('strike'); }
  else            { g.balls++;   addLog('Ball.'); showCallout('BALL', 'ball'); Sound.play('ball'); }
  refreshHud();
  if (g.strikes >= 3) return recordOut('called strikeout', true);
  if (g.balls >= 4) return recordWalk();
  setTimeout(throwPitch, BEAT.betweenPitches);
}

function resolveSwing(cursorT) {
  endAtBatCleanup();
  const g = State.game;
  const p = g.pitch;
  const batter = currentBatter();
  const pitcher = currentPitcher();
  const ctx = g.batterCtx || { pow: batter.pow, con: batter.con, spd: batter.spd, flags:{} };
  const diff = DIFF[State.difficulty];
  const half = diff.sweetWidth / 2;
  const perfectDist = Math.abs(cursorT - p.ideal);
  /* contact quality in [0,1]. 1 means dead-center of sweet zone. */
  const contactRaw = 1 - perfectDist / 0.5;
  const contactBoost = (ctx.con - 50) / 200;   /* +/- 0.25 */
  let contact = clamp(contactRaw + contactBoost, 0, 1);
  let inZone = perfectDist <= half;

  /* Lady Liberty is the joke and the mechanic. She is stone: on any real
     contact the ball leaves the yard, on anything else she strikes out
     looking like a statue would. Nothing in between. */
  if (batter.quirk === 'monument') {
    if (inZone && contact > 0.55) {
      return scheduleContactPlay('home run', batter);
    }
    g.strikes = 3;
    addLog(`${batter.n} does not move. Strike three.`);
    refreshHud();
    return recordOut('called strikeout', true);
  }

  /* Cowardly Lion bails on borderline pitches. His whiff rate on close ones
     is high, but when the pitch is right in the middle he uncorks. */
  if (batter.quirk === 'skittish' && inZone && contact < 0.65 && Math.random() < 0.35) {
    inZone = false;
    contact *= 0.4;
    addLog(`${batter.n} flinches away from the pitch.`);
  }

  /* Whiff. The swing missed entirely. */
  if (!inZone && contact < 0.4) {
    g.strikes++;
    addLog(`${batter.n} swings and misses.`);
    showCallout('SWING AND MISS', 'strike');
    Sound.play('whiff');
    refreshHud();
    if (g.strikes >= 3) return recordOut('swinging strikeout', true);
    return setTimeout(throwPitch, BEAT.afterWhiff);
  }

  /* Foul: near miss on strike, count strike (but never third strike) */
  if (!inZone) {
    if (g.strikes < 2) g.strikes++;
    addLog(`${batter.n} fouls it off.`);
    showCallout('FOUL BALL', 'sub');
    Sound.play('foul');
    refreshHud();
    return setTimeout(throwPitch, BEAT.betweenPitches);
  }

  /* Cowardly Lion who did commit gets a burst of nerve on the swing. */
  let powForRoll = ctx.pow;
  if (batter.quirk === 'skittish' && contact > 0.7) powForRoll = Math.min(100, powForRoll + 15);

  /* In zone: resolve to a batted ball outcome. Rather than mutating the
     bases and firing the callout instantly, we stage the play: bat swing
     then ball trajectory then runners then callout. All of that happens
     in scheduleContactPlay below. */
  const power = (powForRoll - 50) / 100;
  const hrChance = 0.02 + contact * 0.20 + Math.max(0, power) * 0.14;
  if (Math.random() < hrChance) return scheduleContactPlay('home run', batter);

  if (Math.random() < 0.05 + contact * 0.08 + Math.max(0, power) * 0.06) {
    return scheduleContactPlay(Math.random() < 0.35 ? 'triple' : 'double', batter);
  }
  let hitOdds = 0.28 + contact * 0.45 + (ctx.spd - 50)/300;
  if (batter.k === 'invisible') hitOdds += 0.05;
  if (Math.random() < hitOdds) return scheduleContactPlay('single', batter);
  /* Out on contact: same staging, the callout fires when the fielder gets
     the ball. */
  const out = Math.random() < 0.55 ? 'ground out' : 'fly out';
  return scheduleContactPlay(out, batter);
}

/* -------- Play staging: bat, ball, runners, callout --------
   scheduleContactPlay is what resolveSwing calls after it decides what a
   contacted pitch turns into. It records the outcome onto g.play, kicks
   off a bat swing, then a ball trajectory animation, then applies the
   mutation to the bases with an animated runner tween, then fires the
   callout and moves on. All the timing lives in BEAT. */

function ballTrajectory(kind) {
  const rand = (a,b) => a + Math.random() * (b - a);
  const sign = () => Math.random() < 0.5 ? -1 : 1;
  switch (kind) {
    case 'home run':   return { dx: rand(0.55, 1.05)*sign(), dy: -2.4, arcH: 260, duration: 1500 };
    case 'triple':     return { dx: rand(0.75, 1.2)*sign(),  dy: -1.4, arcH: 150, duration: 1250 };
    case 'double':     return { dx: rand(0.5, 1.0)*sign(),   dy: -1.1, arcH: 110, duration: 1050 };
    case 'single':     return { dx: rand(0.3, 0.7)*sign(),   dy: -0.7, arcH: 60,  duration: 850 };
    case 'fly out':    return { dx: rand(0.15,0.5)*sign(),   dy: -1.3, arcH: 170, duration: 1200, caught: true };
    case 'ground out': return { dx: rand(0.35,0.8)*sign(),   dy: -0.15,arcH: 18,  duration: 700,  caught: true };
  }
  return { dx: 0, dy: 0, arcH: 0, duration: 700 };
}

/* How many bases the batter travels for this outcome. -1 means back to
   home (a HR); -2 means the batter is out (ground/fly out). */
function batterEndBase(kind) {
  return { 'single':0, 'double':1, 'triple':2, 'home run':-1,
           'ground out':-2, 'fly out':-2 }[kind];
}

/* Named waypoints on the diamond, keyed by an integer index. drawField
   converts each index to a pixel position from the current cx/cy/r.
   -1 = home (batter box); 0/1/2 = 1st/2nd/3rd; 3 = home again (a run
   scored, runner is done). */
function waypointForBase(field, idx) {
  const { cx, cy, r } = field;
  if (idx === -1) return [cx - 22, cy + r + 8];
  if (idx === 0)  return [cx + r, cy];
  if (idx === 1)  return [cx, cy - r];
  if (idx === 2)  return [cx - r, cy];
  if (idx === 3)  return [cx + 2, cy + r + 8];
  return [cx, cy];
}

function batterPathIndices(kind) {
  const end = batterEndBase(kind);
  if (end === -2) return [-1, 0];   /* out, runs to first anyway */
  const arr = [-1];
  const target = end === -1 ? 3 : end;
  for (let i = 0; i <= target; i++) arr.push(i);
  return arr;
}
function existingRunnerPathIndices(startBase, kind) {
  const advance = { 'single':1, 'double':2, 'triple':3, 'home run':4 }[kind] || 0;
  const arr = [];
  const end = startBase + advance;
  for (let b = startBase; b <= Math.min(end, 3); b++) arr.push(b);
  return arr;
}
function pathPointAt(field, path, t) {
  if (path.length === 1) return waypointForBase(field, path[0]);
  const scaled = t * (path.length - 1);
  const seg = Math.min(Math.floor(scaled), path.length - 2);
  const frac = scaled - seg;
  const a = waypointForBase(field, path[seg]);
  const b = waypointForBase(field, path[seg + 1]);
  return [a[0] + (b[0] - a[0]) * frac, a[1] + (b[1] - a[1]) * frac];
}

function scheduleContactPlay(kind, batter) {
  const g = State.game;
  /* Bat meets ball. The crack fires immediately, before the ball travels. */
  Sound.play('crack');
  const throwable = kind === 'ground out' && !playerIsBatting();
  if (throwable) return scheduleThrowMinigame(kind, batter);
  /* Errors: on a ground or fly out, roll against the fielding team's DEF.
     A low-defense team lets the batter reach on a mishandled ball. */
  let effective = kind;
  let onError = false;
  if (kind === 'ground out' || kind === 'fly out') {
    const fielding = currentFieldingTeam().batters;
    const avgDef = fielding.reduce((a,c) => a + (c.def || 60), 0) / fielding.length;
    const errChance = clamp(0.08 - (avgDef - 60) / 400, 0.02, 0.14);
    if (Math.random() < errChance) {
      effective = 'single';       /* reached on error, treated as a single */
      onError = true;
    }
  }
  const traj = ballTrajectory(effective);
  const isOut = effective === 'ground out' || effective === 'fly out';
  const preBases = [...g.bases];

  /* Double play: ground out with a runner on 1st and less than 2 outs. */
  let doublePlay = false;
  if (isOut && effective === 'ground out' && preBases[0] && g.outs < 2) {
    const fielding = currentFieldingTeam().batters;
    const avgDef = fielding.reduce((a,c) => a + (c.def || 60), 0) / fielding.length;
    const runnerSpd = preBases[0].spd;
    const dpChance = clamp(0.40 + (avgDef - 60) / 250 - (runnerSpd - 60) / 220, 0.10, 0.75);
    if (Math.random() < dpChance) doublePlay = true;
  }

  g.play = {
    kind: effective, batter, isOut, onError, doublePlay,
    ball: traj,
    startedAt: performance.now(),
    swingUntil: performance.now() + 240,
    ballUntil: performance.now() + traj.duration,
    runnerStart: performance.now() + Math.max(180, traj.duration - 400),
    runnerUntil: performance.now() + traj.duration + 600,
    preBases,
    batterPath: batterPathIndices(effective),
    runnerPaths: preBases.map((r, i) => r ? existingRunnerPathIndices(i, effective) : null),
    applied: false,
  };

  const applyMs = traj.duration;   /* apply mutation when ball arrives */
  setTimeout(() => {
    if (!g.play || g.play.applied) return;
    g.play.applied = true;
    /* Landing FX: dust on the ground where the ball comes down, glove
       flash on a caught fly ball, confetti + shake on a home run. */
    const geo = fieldGeom();
    const landingX = geo.cx + g.play.ball.dx * geo.r;
    const landingY = geo.cy + g.play.ball.dy * geo.r;
    if (g.play.kind === 'home run') {
      confettiBurst(g, geo.cx, geo.cy);
      g.shakeUntil = performance.now() + 500;
      Sound.play('homer');
      /* Signature moments per character. Trigger a stronger celebration
         for the marquees: Kong shakes the yard longer, Dracula's swarm
         darkens the crowd, Franky flexes hard on the way to home. */
      const who = g.play.batter && g.play.batter.k;
      if (who === 'kong') {
        g.shakeUntil = performance.now() + 900;
        g.signature = { kind: 'chest', until: performance.now() + 1600 };
        Sound.play('crack');   /* double-thump */
        setTimeout(() => Sound.play('crack'), 180);
      } else if (who === 'dracula') {
        g.signature = { kind: 'bats', until: performance.now() + 1400 };
      } else if (who === 'franky') {
        g.signature = { kind: 'flex', until: performance.now() + 1200 };
      } else if (who === 'popeye') {
        g.signature = { kind: 'anchor', until: performance.now() + 1200 };
      }
    } else if (g.play.kind === 'fly out') {
      gloveFlash(g, landingX, landingY);
      dustPuff(g, landingX, landingY);
      Sound.play('catch');
    } else {
      dustPuff(g, landingX, landingY);
      if (g.play.kind === 'single' || g.play.kind === 'double' || g.play.kind === 'triple') Sound.play('cheer');
      else Sound.play('aww');
    }
    if (onError) {
      applyHitMutation('single', batter, { onError: true });
    } else if (doublePlay) {
      applyDoublePlayMutation(batter);
    } else if (isOut) {
      applyOutMutation(effective, batter);
    } else {
      applyHitMutation(effective, batter);
    }
    refreshHud();
  }, applyMs);

  const finishMs = traj.duration + 700;
  setTimeout(() => {
    if (!g.play) return;
    const wasOut = g.play.isOut && !g.play.onError;
    const wasDP = g.play.doublePlay;
    g.play = null;
    /* Check for a walk-off: home team leads at the end of a play in the
       bottom of the final inning or later. */
    if (checkWalkOff()) return finishGame();
    if (wasDP && g.outs >= 3) return endHalfInning();
    if (wasOut) afterOutTransition();
    else        afterHitTransition(g && g.away && g.home ? kind : kind);
  }, finishMs);
}

function applyDoublePlayMutation(batter) {
  const g = State.game;
  statBump(batter.k, 'ab');
  const preRunner = g.bases[0];
  g.bases[0] = null;
  g.outs += 2;
  addLog(`Double play. ${batter.n} and ${preRunner.n} both out. ${g.outs} out.`);
  showCallout('DOUBLE PLAY', 'strike');
  /* Kick up dust at both bases for the play. */
  const geo = fieldGeom();
  dustPuff(g, geo.cx + geo.r, geo.cy);
  dustPuff(g, geo.cx + (batter.spd > 70 ? geo.r * 0.9 : geo.r), geo.cy + geo.r * 0.3);
}

function checkWalkOff() {
  const g = State.game;
  if (g.half !== 'bottom') return false;
  if (g.inning < g.innings) return false;
  if (g.home.score > g.away.score) {
    g.over = true;
    g.winner = 'home';
    return true;
  }
  return false;
}

function applyHitMutation(kind, batter, opts) {
  const g = State.game;
  const onError = opts && opts.onError;
  statBump(batter.k,'ab');
  if (!onError) statBump(batter.k,'hits');
  if (kind === 'home run') {
    statBump(batter.k,'hr');
    let scored = 1;
    for (let i=0;i<3;i++) if (g.bases[i]) scored++;
    g.bases = [null,null,null];
    scoreRuns(scored);
    addLog(`${batter.n} crushes it. HOME RUN. ${scored} run${scored>1?'s':''} score.`, true);
    showCallout(`HOME RUN · ${scored} RUN${scored>1?'S':''}`, 'homer');
    return;
  }
  const bases = { 'single':1,'double':2,'triple':3 }[kind];
  let scored = 0;
  const newBases = [null,null,null];
  for (let i=2;i>=0;i--) {
    const runner = g.bases[i];
    if (!runner) continue;
    const dest = i + bases;
    if (dest >= 3) scored++;
    else newBases[dest] = runner;
  }
  newBases[bases-1] = batter;
  g.bases = newBases;
  if (scored) scoreRuns(scored);
  if (onError) {
    addLog(`${batter.n} reaches on an error${scored ? `, ${scored} score` : ''}.`);
    showCallout('REACHED ON ERROR', 'sub');
  } else {
    addLog(`${batter.n} lines a ${kind}${scored ? `, ${scored} run${scored>1?'s':''} score` : ''}.`);
    showCallout(kind.toUpperCase() + (scored ? ` · ${scored} IN` : ''), scored ? 'homer' : 'hit');
  }
}

function applyOutMutation(kind, batter) {
  const g = State.game;
  statBump(batter.k,'ab');
  g.outs++;
  addLog(`${batter.n} out (${kind}) to the ${randPos(kind)}. ${g.outs} out.`);
  showCallout(kind === 'ground out' ? 'GROUND OUT' : 'FLY OUT', 'sub');
}

/* -------- Throw minigame --------
   Grounders when the player is fielding play out in two stages: the ball
   goes to a fielder, then the player has a small window to time a throw
   to first. The meter is a moving cursor against a green zone (safe out),
   a wider yellow zone (infield single, batter reaches on a slow play),
   and everything outside (error, batter safe and any runners take an
   extra base). Fielder DEF widens the green zone. */

function scheduleThrowMinigame(kind, batter) {
  const g = State.game;
  const traj = ballTrajectory(kind);
  const isOut = true;
  const preBases = [...g.bases];
  g.play = {
    kind, batter, isOut,
    ball: traj,
    startedAt: performance.now(),
    swingUntil: performance.now() + 240,
    ballUntil: performance.now() + traj.duration,
    runnerStart: performance.now() + Math.max(180, traj.duration - 400),
    runnerUntil: performance.now() + traj.duration + 600,
    preBases,
    batterPath: batterPathIndices(kind),
    runnerPaths: preBases.map((r, i) => r ? existingRunnerPathIndices(i, kind) : null),
    applied: false,
    throwActive: false,
  };

  const geo = fieldGeom();
  const angle = Math.atan2(traj.dy * geo.r, traj.dx * geo.r);
  const landingX = geo.cx + Math.cos(angle) * geo.r * 0.9;
  const landingY = geo.cy + Math.sin(angle) * geo.r * 0.9;

  /* At ball-arrival time, spawn dust and open the throw window. */
  setTimeout(() => {
    if (!g.play || g.play.applied) return;
    dustPuff(g, landingX, landingY, 'rgba(205,170,120,.9)');
    Sound.play('catch');
    startThrowWindow(kind, batter);
  }, traj.duration);
}

function startThrowWindow(kind, batter) {
  const g = State.game;
  if (!g.play) return;
  /* Overall fielding rating for the team's infield (average of DEF for
     four infielders): better fielders = wider safe zone. */
  const fs = currentFieldingTeam().batters;
  const infield = [fs[2], fs[3], fs[4], fs[5]].filter(Boolean);
  const avgDef = infield.reduce((a, c) => a + c.def, 0) / (infield.length || 1);
  const window = {
    ideal: 0.55 + (Math.random() - 0.5) * 0.2,   /* wobbly target each throw */
    greenHalf: 0.06 + (avgDef - 50) / 800,
    yellowHalf: 0.14,
    duration: 1600,
    startedAt: performance.now(),
    resolved: false,
  };
  g.play.throwActive = true;
  g.play.throwWindow = window;

  const finish = (t) => {
    if (window.resolved) return;
    window.resolved = true;
    g.play.throwActive = false;
    document.removeEventListener('keydown', onKey);
    document.removeEventListener('click', onClick, true);
    const d = Math.abs(t - window.ideal);
    let outcome;
    if (d <= window.greenHalf) outcome = 'out';
    else if (d <= window.yellowHalf) outcome = 'single';
    else outcome = 'error';
    resolveThrow(outcome, kind, batter);
  };
  const onClick = (e) => {
    if (window.resolved) return;
    const t = clamp((performance.now() - window.startedAt) / window.duration, 0, 1);
    finish(t);
  };
  const onKey = (e) => {
    if (e.code === 'Space') { e.preventDefault(); onClick(e); }
  };
  document.addEventListener('keydown', onKey);
  document.addEventListener('click', onClick, true);
  /* If the player doesn't throw in time, fielder holds it: batter safe. */
  setTimeout(() => finish(-1), window.duration + 20);
}

function resolveThrow(outcome, kind, batter) {
  const g = State.game;
  if (!g.play || g.play.applied) return;
  g.play.applied = true;
  if (outcome === 'out') {
    applyOutMutation('ground out', batter);
  } else if (outcome === 'single') {
    /* Batter reaches on a slow play; runners advance one. */
    addLog(`${batter.n} beats the throw. Infield single.`);
    showCallout('INFIELD SINGLE', 'hit');
    Sound.play('cheer');
    applyHitMutation('single', batter);
  } else {
    /* Error: batter to first, everyone else advances an extra base. */
    addLog(`Throwing error. ${batter.n} safe, runners advance.`);
    showCallout('ERROR', 'strike');
    Sound.play('aww');
    applyErrorMutation(batter);
  }
  refreshHud();
}

function applyErrorMutation(batter) {
  const g = State.game;
  statBump(batter.k, 'ab');
  /* All runners advance two, batter to first. */
  let scored = 0;
  const newBases = [null, null, null];
  for (let i = 2; i >= 0; i--) {
    const runner = g.bases[i];
    if (!runner) continue;
    const dest = i + 2;
    if (dest >= 3) scored++;
    else newBases[dest] = runner;
  }
  newBases[0] = batter;
  g.bases = newBases;
  if (scored) scoreRuns(scored);
}

function afterHitTransition(kind) {
  const g = State.game;
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, kind === 'home run' ? BEAT.afterHomer : BEAT.afterHit);
}

function afterOutTransition() {
  const g = State.game;
  if (g.outs >= 3) return endHalfInning();
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, BEAT.afterOut);
}

function randPos(out) {
  if (out === 'ground out') return ['pitcher','shortstop','second','third','first'][Math.floor(Math.random()*5)];
  return ['left','center','right'][Math.floor(Math.random()*3)];
}

function recordHit(kind, batter) {
  const g = State.game;
  statBump(batter.k,'ab');
  statBump(batter.k,'hits');
  const bases = { 'single':1,'double':2,'triple':3,'home run':4 }[kind];
  if (kind === 'home run') {
    statBump(batter.k,'hr');
    let scored = 1;   /* the batter */
    for (let i=0;i<3;i++) if (g.bases[i]) scored++;
    g.bases = [null,null,null];
    scoreRuns(scored);
    addLog(`${batter.n} crushes it. HOME RUN. ${scored} run${scored>1?'s':''} score.`, true);
    showCallout(`HOME RUN · ${scored} RUN${scored>1?'S':''}`, 'homer');
  } else {
    /* Advance existing runners by `bases`, then place batter */
    let scored = 0;
    const newBases = [null,null,null];
    for (let i=2;i>=0;i--) {
      const runner = g.bases[i];
      if (!runner) continue;
      const dest = i + bases;   /* 0=first, 1=second, 2=third; dest>=3 scores */
      if (dest >= 3) scored++;
      else newBases[dest] = runner;
    }
    if (bases < 4) newBases[bases-1] = batter;
    g.bases = newBases;
    if (scored) scoreRuns(scored);
    addLog(`${batter.n} lines a ${kind}${scored ? `, ${scored} run${scored>1?'s':''} score` : ''}.`);
    showCallout(kind.toUpperCase() + (scored ? ` · ${scored} IN` : ''), scored ? 'homer' : 'hit');
  }
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, kind === 'home run' ? BEAT.afterHomer : BEAT.afterHit);
}

function recordWalk() {
  const g = State.game;
  const batter = currentBatter();
  addLog(`${batter.n} walks.`);
  showCallout('WALK', 'sub');
  const bases = g.bases;
  let scored = 0;
  if (bases[0] && bases[1] && bases[2]) { scored = 1; g.bases = [batter, bases[0], bases[1]]; }
  else if (bases[0] && bases[1]) { g.bases = [batter, bases[0], bases[1]]; }
  else if (bases[0]) { g.bases = [batter, bases[0], bases[2]]; }
  else { g.bases = [batter, bases[1], bases[2]]; }
  if (scored) scoreRuns(scored);
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, BEAT.afterWalk);
}

function recordOut(reason, isStrikeout) {
  const g = State.game;
  const batter = currentBatter();
  statBump(batter.k,'ab');
  if (isStrikeout) statBump(batter.k,'so');
  g.outs++;
  addLog(`${batter.n} out (${reason}). ${g.outs} out.`);
  if (isStrikeout) showCallout('STRIKEOUT', 'strike');
  if (g.outs >= 3) return endHalfInning();
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, BEAT.afterOut);
}

function nextBatter() {
  const t = currentBattingTeam();
  t.idx = (t.idx + 1) % 9;
  const g = State.game;
  g.balls = 0; g.strikes = 0;
}

function scoreRuns(n) {
  const g = State.game;
  const t = currentBattingTeam();
  t.score += n;
  /* File the runs on the line score under the current inning. */
  const key = g.half === 'top' ? 'away' : 'home';
  while (g.lineScore[key].length < g.inning) g.lineScore[key].push(0);
  g.lineScore[key][g.inning - 1] += n;
}

function endHalfInning() {
  const g = State.game;
  addLog(`Side retired. End of ${g.half === 'top' ? 'top' : 'bottom'} of ${g.inning}.`, true);
  showCallout('SIDE RETIRED', 'homer');
  Sound.play('inning');
  g.bases = [null,null,null];
  g.outs = 0;
  g.balls = 0; g.strikes = 0;
  if (g.half === 'top') {
    g.half = 'bottom';
  } else {
    g.half = 'top';
    g.inning++;
  }
  const done = checkGameOver();
  refreshHud();
  if (done) return finishGame();
  /* Also fire a walk-off check right after flipping to the bottom of the
     final inning, in case the home team is already ahead. */
  if (checkWalkOff()) return finishGame();
  setTimeout(startAtBat, BEAT.betweenHalfInnings);
}

function checkGameOver() {
  const g = State.game;
  /* After 9 (or configured) full innings, tied continues; unless capped for arcade. */
  if (g.inning > g.innings) {
    if (g.away.score !== g.home.score) {
      g.over = true;
      g.winner = g.home.score > g.away.score ? 'home' : 'away';
      return true;
    }
  }
  /* Walk off: home leads at end of top after regulation */
  if (g.inning > g.innings && g.half === 'bottom' && g.home.score > g.away.score) {
    g.over = true; g.winner = 'home'; return true;
  }
  /* If we're in bottom of last inning and home leads, skip */
  if (g.inning === g.innings && g.half === 'top' && g.home.score > g.away.score && g.outs === 0 && g.away.idx === 0) {
    /* We just wrapped, home already leads, no need to bat bottom */
    /* Not triggered normally; the natural flow handles this */
  }
  /* End of top of final inning: if home is ahead, home does not bat */
  if (g.inning > g.innings && g.half === 'bottom') {
    /* We flipped past regulation with home leading or tied is handled above */
  }
  /* Skip bottom half if home leads after top of final inning */
  if (g.half === 'bottom' && g.inning === g.innings && g.home.score > g.away.score) {
    g.over = true; g.winner = 'home'; return true;
  }
  /* Cap arcade blowouts at 25 to prevent slog */
  if (g.away.score - g.home.score >= 15 && g.inning >= Math.max(3, g.innings - 1)) {
    g.over = true; g.winner = 'away'; return true;
  }
  if (g.home.score - g.away.score >= 15 && g.inning >= Math.max(3, g.innings - 1)) {
    g.over = true; g.winner = 'home'; return true;
  }
  return false;
}

function finishGame() {
  const g = State.game;
  g.live = false;
  stopFieldLoop();
  const you = g.away.isYou ? g.away : g.home;
  const foe = g.away.isYou ? g.home : g.away;
  const win = you.score > foe.score;

  if (State.mode === 'season' && State.season && !State.season.playoffs) {
    State.season.results.push({
      opponent: foe.name, win, you: you.score, them: foe.score,
    });
    /* Roll individual stats forward */
    const ps = State.season.playerStats;
    for (const k of Object.keys(g.stats.hr)) ps.hr += g.stats.hr[k];
    for (const k of Object.keys(g.stats.so)) ps.so += g.stats.so[k];
    for (const k of Object.keys(g.stats.sb || {})) ps.sb += g.stats.sb[k];
    for (const k of Object.keys(g.stats.hits)) ps.hits += g.stats.hits[k];
    for (const k of Object.keys(g.stats.ab)) ps.ab += g.stats.ab[k];
    saveSeason(State.season);
  } else if (State.mode === 'playoff' && State.season) {
    /* Record playoff result */
    const P = State.season.playoffs;
    const match = g.mode === 'playoff' && g.round === 'semi' ? P.semis[g.matchIdx] : P.final;
    const winner = win
      ? (g.away.isYou ? match.away : match.home)
      : (g.away.isYou ? match.home : match.away);
    match.result = { homeScore: g.home.score, awayScore: g.away.score, winner };
    /* If any CPU semis remain, they will sim next when the bracket page shows */
    saveSeason(State.season);
  }
  State.screen = 'result';
  render();
}

/* ============================================================================
   FIELD AND METER RENDERING
   ============================================================================ */

/* The field canvas has a fixed internal size, so play staging code can
   compute the same geometry drawField uses without holding a context. */
function fieldGeom() {
  const w = 960, h = 660;
  return { w, h, cx: w/2, cy: h*0.58, r: Math.min(w, h) * 0.30 };
}

/* -------- Particles --------
   One flat array on the game. Everything is a square that moves, falls,
   and fades. Dust for slides and landings, confetti for homers, a white
   flash for catches. Updated and drawn once per frame inside drawField. */
function spawnFx(g, p) {
  if (!g.fx) g.fx = [];
  if (g.fx.length > 400) return;   /* hard cap, keeps a confetti spam sane */
  g.fx.push(p);
}
function dustPuff(g, x, y, color) {
  for (let i = 0; i < 9; i++) {
    spawnFx(g, {
      x, y, size: 3,
      vx: (Math.random() - 0.5) * 80,
      vy: -20 - Math.random() * 50,
      grav: 160,
      color: color || 'rgba(205,170,120,.9)',
      life: 450 + Math.random() * 300,
    });
  }
}
function gloveFlash(g, x, y) {
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2;
    spawnFx(g, {
      x, y, size: 2,
      vx: Math.cos(a) * 90, vy: Math.sin(a) * 90,
      grav: 0, color: '#eaeaea', life: 300,
    });
  }
}
function confettiBurst(g, x, y) {
  const cols = ['#f4c25a','#d24949','#5bb083','#6aa7c4','#b08ac6','#eaeaea'];
  for (let i = 0; i < 46; i++) {
    spawnFx(g, {
      x: x + (Math.random() - 0.5) * 120, y,
      size: 4,
      vx: (Math.random() - 0.5) * 220,
      vy: -40 - Math.random() * 180,
      grav: 210,
      color: cols[i % cols.length],
      life: 1100 + Math.random() * 700,
    });
  }
}
function updateAndDrawFx(ctx, g) {
  if (!g.fx || !g.fx.length) { g.fxTime = performance.now(); return; }
  const now = performance.now();
  const dt = Math.min(50, now - (g.fxTime || now));
  g.fxTime = now;
  g.fx = g.fx.filter(p => (p.life -= dt) > 0);
  for (const p of g.fx) {
    p.x += p.vx * dt / 1000;
    p.y += p.vy * dt / 1000;
    p.vy += (p.grav || 0) * dt / 1000;
    ctx.globalAlpha = clamp(p.life / 400, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawField(ctx, w, h, t, pitch, inWindup) {
  /* Night sky, crowd, light towers, outfield wall, grass, diamond.
     Everything sized to the field's own w and h so the canvas can be
     resized. A home run shakes the whole camera for half a second. */
  ctx.save();
  const gShake = State.game;
  if (gShake && gShake.shakeUntil && performance.now() < gShake.shakeUntil) {
    const mag = 6 * (gShake.shakeUntil - performance.now()) / 500;
    ctx.translate((Math.random() - 0.5) * mag * 2, (Math.random() - 0.5) * mag * 2);
  }

  const theme = currentTheme();

  ctx.fillStyle = '#0b1015';
  ctx.fillRect(-8, -8, w + 16, h + 16);

  const skyH = h * 0.13;
  ctx.fillStyle = theme.sky;
  ctx.fillRect(0, 0, w, skyH);
  /* a few stars, dimmed on daytime themes */
  if (theme.sky !== '#5aa0d0') {
    ctx.fillStyle = 'rgba(234,234,234,.5)';
    for (let x = 13; x < w; x += 61) ctx.fillRect(x, 6 + (x * 7) % 18, 2, 2);
  }

  /* Landmark: theme-specific silhouette in the sky area. */
  if (theme.landmark) theme.landmark(ctx, w, h);

  /* Light towers, glowing */
  const tower = (tx) => {
    ctx.fillStyle = '#2a3644';
    ctx.fillRect(tx - 2, 14, 4, skyH - 14);
    ctx.fillStyle = '#1a2430';
    ctx.fillRect(tx - 16, 6, 32, 12);
    for (let row = 0; row < 2; row++) {
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = '#f5ecc8';
        ctx.fillRect(tx - 13 + i * 8, 8 + row * 5, 4, 3);
      }
    }
    const glow = ctx.createRadialGradient(tx, 12, 2, tx, 12, 60);
    glow.addColorStop(0, 'rgba(245,236,200,.20)');
    glow.addColorStop(1, 'rgba(245,236,200,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(tx - 60, 0, 120, 80);
  };
  tower(w * 0.14);
  tower(w * 0.86);

  /* Crowd: three rows of colored dots in the stands, with a slow wave of
     brighter fans rolling through so the place feels alive. */
  const crowdCols = theme.crowd;
  const tick = Math.floor(performance.now() / 350);
  for (let row = 0; row < 3; row++) {
    const y = skyH - 17 + row * 5;
    for (let x = 4; x < w; x += 7) {
      const v = (x * 7 + row * 13) % 10;
      if (v >= 8) continue;
      const lively = ((x * 31 + row * 17 + tick) % 47) === 0;
      ctx.fillStyle = lively ? '#e8d8b0' : crowdCols[v % 5];
      ctx.fillRect(x, lively ? y - 2 : y, 3, 3);
    }
  }

  /* Outfield wall: themed color and yellow line at the top. */
  const wallY = skyH;
  const wallH = 20;
  ctx.fillStyle = theme.wall;
  ctx.fillRect(0, wallY, w, wallH);
  ctx.fillStyle = theme.wallLine;
  ctx.fillRect(0, wallY, w, 2);
  ctx.fillStyle = theme.marker;
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('342', w * 0.12, wallY + wallH / 2 + 1);
  ctx.fillText('408', w * 0.50, wallY + wallH / 2 + 1);
  ctx.fillText('342', w * 0.88, wallY + wallH / 2 + 1);

  /* Outfield grass, themed. */
  const grassY = wallY + wallH;
  ctx.fillStyle = theme.grass;
  ctx.fillRect(0, grassY, w, h - grassY);
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,.03)' : 'rgba(0,0,0,.05)';
    const stripeH = (h - grassY) / 8;
    ctx.fillRect(0, grassY + i * stripeH, w, stripeH);
  }
  /* Warning track along the wall, themed. */
  ctx.fillStyle = theme.track;
  ctx.fillRect(0, grassY, w, 10);

  /* Home-plate camera: put the plate in the lower portion, mound up. */
  const cx = w/2;
  const cy = h * 0.58;
  const r = Math.min(w, h) * 0.30;

  /* Infield dirt diamond */
  ctx.fillStyle = '#8b5a24';
  ctx.beginPath();
  ctx.moveTo(cx, cy - r);
  ctx.lineTo(cx + r, cy);
  ctx.lineTo(cx, cy + r);
  ctx.lineTo(cx - r, cy);
  ctx.closePath();
  ctx.fill();

  /* Infield grass */
  ctx.fillStyle = '#2b6a30';
  const rInner = r * 0.62;
  ctx.beginPath();
  ctx.moveTo(cx, cy - rInner);
  ctx.lineTo(cx + rInner, cy);
  ctx.lineTo(cx, cy + rInner);
  ctx.lineTo(cx - rInner, cy);
  ctx.closePath();
  ctx.fill();

  /* Foul lines */
  ctx.strokeStyle = '#eaeaea';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy + r);
  ctx.lineTo(cx - w, cy + r + w);   /* down-left */
  ctx.moveTo(cx, cy + r);
  ctx.lineTo(cx + w, cy + r + w);   /* down-right */
  ctx.stroke();

  /* Batter's box */
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(cx - 34, cy + r - 8, 26, 32);
  ctx.strokeRect(cx + 8, cy + r - 8, 26, 32);

  /* Bases */
  const bases = [
    [cx + r, cy],
    [cx, cy - r],
    [cx - r, cy],
  ];
  ctx.fillStyle = '#eaeaea';
  bases.forEach(([bx,by]) => { ctx.fillRect(bx-7, by-7, 14, 14); });

  /* Home plate: pentagon */
  ctx.beginPath();
  ctx.moveTo(cx - 10, cy + r);
  ctx.lineTo(cx + 10, cy + r);
  ctx.lineTo(cx + 10, cy + r + 6);
  ctx.lineTo(cx, cy + r + 12);
  ctx.lineTo(cx - 10, cy + r + 6);
  ctx.closePath();
  ctx.fill();

  /* Pitcher's mound */
  ctx.fillStyle = '#a66a2c';
  ctx.beginPath(); ctx.arc(cx, cy, 18, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#eaeaea';
  ctx.fillRect(cx - 8, cy - 2, 16, 4);

  /* Fielders and defense are always drawn. The batter and base runners
     get drawn either statically at their bases (no active play) or as
     animated waypoints along their paths (a play is in flight). */
  const g = State.game;
  const field = { cx, cy, r };

  if (g) {
    /* Catcher behind plate */
    const catcher = currentFieldingTeam().batters[8] || currentFieldingTeam().batters[1];
    if (catcher && catcher.pal) drawRunner(ctx, cx, cy + r + 22, catcher, 2.4);
    /* Pitcher on the mound: windup for the first 65% of the pitch's
       travel, release for the last 35%, then idle. */
    const pit = currentPitcher();
    let pitcherPose = null;
    if (pitch && !inWindup) {
      pitcherPose = t < 0.35 ? 'release' : null;
    } else if (pitch && inWindup) {
      pitcherPose = 'windup';
    }
    if (pit) drawRunner(ctx, cx, cy - 6, pit, 3, pitcherPose);
    /* Fielder cluster */
    const fs = currentFieldingTeam().batters;
    if (fs[2]) drawRunner(ctx, cx - r*0.55, cy - r*0.15, fs[2], 2.2);
    if (fs[3]) drawRunner(ctx, cx + r*0.55, cy - r*0.15, fs[3], 2.2);
    if (fs[4]) drawRunner(ctx, cx + r*0.85, cy + r*0.10, fs[4], 2.2);
    if (fs[5]) drawRunner(ctx, cx - r*0.85, cy + r*0.10, fs[5], 2.2);
    if (fs[6]) drawRunner(ctx, cx - w*0.28, cy - h*0.14, fs[6], 2.4);
    if (fs[7]) drawRunner(ctx, cx,           cy - h*0.20, fs[7], 2.4);
    if (fs[1]) drawRunner(ctx, cx + w*0.28, cy - h*0.14, fs[1], 2.4);

    if (g.play) {
      /* A contact play is animating. Draw the pre-play runners along
         their paths, and the batter as another runner along their own
         path. The bases themselves are only rewritten when the play's
         apply timer fires. */
      const p = g.play;
      const now = performance.now();
      const rt = clamp((now - p.runnerStart) / (p.runnerUntil - p.runnerStart), 0, 1);
      const runFrame = Math.floor(now / 130) % 2 === 0 ? 'run-a' : 'run-b';
      p.preBases.forEach((runner, i) => {
        if (!runner || !p.runnerPaths[i]) return;
        const [rx, ry] = pathPointAt(field, p.runnerPaths[i], rt);
        drawRunner(ctx, rx, ry - 4, runner, 2.6, rt > 0 && rt < 1 ? runFrame : null);
      });
      /* Batter as runner: starts moving at the same time as the ball is */
      const bt = clamp((now - p.startedAt) / Math.max(300, p.ball.duration - 100), 0, 1);
      const [bx, by] = pathPointAt(field, p.batterPath, bt);
      drawRunner(ctx, bx, by - 4, p.batter, 3, bt > 0.05 && bt < 0.98 ? runFrame : null);
      /* Bat swing arc, first 240ms of the play */
      if (now < p.swingUntil) {
        const st = clamp((now - p.startedAt) / (p.swingUntil - p.startedAt), 0, 1);
        drawBatSwing(ctx, cx - 22, cy + r + 8, st);
      }
      /* Ball trajectory: plate to landing spot, with a ground shadow so
         the arc height reads. */
      if (now < p.ballUntil) {
        const bt2 = clamp((now - p.startedAt) / p.ball.duration, 0, 1);
        const startX = cx, startY = cy + r + 6;
        const endX = startX + p.ball.dx * r;
        const endY = cy + p.ball.dy * r;
        const arc = 4 * p.ball.arcH * bt2 * (1 - bt2);
        const bxx = startX + (endX - startX) * bt2;
        const byy = startY + (endY - startY) * bt2 - arc;
        /* Ground level for the shadow: the ball's own linear path (no arc). */
        const gy = startY + (endY - startY) * bt2;
        drawBaseball(ctx, bxx, byy, gy);
      }
    } else {
      /* No play in flight: runners are static on their bases, batter
         stands in the batter's box. */
      const bs = g.bases;
      if (bs[0]) drawRunner(ctx, bases[0][0], bases[0][1] - 4, bs[0], 2.6);
      if (bs[1]) drawRunner(ctx, bases[1][0], bases[1][1] - 4, bs[1], 2.6);
      if (bs[2]) drawRunner(ctx, bases[2][0], bases[2][1] - 4, bs[2], 2.6);
      const batter = currentBatter();
      if (batter) drawRunner(ctx, cx - 22, cy + r + 6, batter, 3, 'batting');
    }
  }

  /* Pitch ball moving from mound to plate. Only when no contact-play is
     in flight (so the ball isn't drawn twice). */
  if (pitch && !inWindup && !(g && g.play)) {
    const bx = cx;
    const by = cy;
    const px = cx;
    const py = cy + r - 4;
    let e = t;
    if (pitch.pt === 'changeup') e = t*t;
    let ballX = bx + (px - bx) * e;
    let ballY = by + (py - by) * e;
    if (pitch.pt === 'curveball') {
      ballX += Math.sin(e * Math.PI) * 12 * (pitch.ideal < 0.5 ? -1 : 1);
    }
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.arc(ballX - (px-bx)*.06, ballY - (py-by)*.06, 3, 0, Math.PI*2); ctx.fill();
    drawBaseball(ctx, ballX, ballY);
  }

  /* Signature moment overlays: character-specific spectacle that lands
     on top of the field during a big at bat. Each one runs for its
     own window and clears itself. */
  if (g && g.signature) {
    const sig = g.signature;
    const now = performance.now();
    if (now < sig.until) {
      const rem = (sig.until - now) / 1600;
      const alpha = clamp(rem * 1.4, 0, 1);
      if (sig.kind === 'chest') {
        /* KONG chest beat: darken the field, thump text scales in. */
        ctx.fillStyle = `rgba(0,0,0,${0.35 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = `bold ${Math.floor(84 - rem * 30)}px monospace`;
        ctx.fillStyle = `rgba(255,220,140,${alpha})`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('THUMP!', cx, cy - 40);
        ctx.font = 'bold 36px monospace';
        ctx.fillText('THUMP!', cx + 90, cy + 40);
      } else if (sig.kind === 'bats') {
        /* DRACULA bat swarm: scattered black bats fluttering across. */
        for (let i = 0; i < 22; i++) {
          const off = (i * 137 + Math.floor(now / 30)) % 360;
          const bx = ((off * 3) % w);
          const by = ((off * 5) % h);
          ctx.fillStyle = `rgba(20,10,20,${alpha})`;
          ctx.fillRect(bx, by, 6, 2);
          ctx.fillRect(bx - 3, by + 2, 12, 2);
        }
        ctx.font = 'bold 40px serif';
        ctx.fillStyle = `rgba(196,50,50,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('~ NIGHT FALLS ~', cx, cy - 60);
      } else if (sig.kind === 'flex') {
        /* FRANKY flex: green flash + bolts */
        ctx.fillStyle = `rgba(126,168,106,${0.28 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = 'bold 48px monospace';
        ctx.fillStyle = `rgba(201,162,86,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('IT LIVES', cx, cy - 20);
      } else if (sig.kind === 'anchor') {
        /* POPEYE anchor: forearm silhouette + horn */
        ctx.fillStyle = `rgba(198,57,44,${0.22 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = 'bold 44px monospace';
        ctx.fillStyle = `rgba(255,235,180,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('AH-GA-GA-GA-GA!', cx, cy - 20);
      }
    } else {
      g.signature = null;
    }
  }

  /* Throw minigame overlay: appears when a grounder is in the field and
     the player has a window to complete the throw. */
  if (g && g.play && g.play.throwActive && g.play.throwWindow) {
    const win = g.play.throwWindow;
    const now = performance.now();
    const t = clamp((now - win.startedAt) / win.duration, 0, 1);
    const barW = w * 0.5;
    const barX = cx - barW/2;
    const barY = h * 0.90;
    const barH = 22;
    /* Background */
    ctx.fillStyle = 'rgba(11,16,21,.92)';
    ctx.fillRect(barX - 6, barY - 6, barW + 12, barH + 34);
    /* Yellow zone */
    ctx.fillStyle = 'rgba(244,194,90,.36)';
    ctx.fillRect(barX + (win.ideal - win.yellowHalf) * barW, barY,
                 win.yellowHalf * 2 * barW, barH);
    /* Green zone */
    ctx.fillStyle = 'rgba(91,176,131,.72)';
    ctx.fillRect(barX + (win.ideal - win.greenHalf) * barW, barY,
                 win.greenHalf * 2 * barW, barH);
    /* Cursor */
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(barX + t * barW - 2, barY - 3, 4, barH + 6);
    /* Label */
    ctx.fillStyle = '#f4c25a';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('THROW TO FIRST · SPACE OR CLICK', cx, barY + barH + 12);
  }

  /* Pitcher fatigue chip in the top strip so a player can see it. */
  if (g && !g.play) {
    const fat = pitcherFatigue();
    if (fat.level > 0) {
      const label = fat.level >= 3 ? 'GASSED' : fat.level === 2 ? 'TIRING' : 'WARM';
      const color = fat.level >= 3 ? '#c94b1a' : fat.level === 2 ? '#e3b04c' : '#5bb083';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = color;
      ctx.fillText(label, cx, cy - 26);
    }
  }

  /* Particles fire on top of everything. */
  if (g) updateAndDrawFx(ctx, g);
  ctx.restore();
}

function drawBaseball(ctx, x, y, groundY) {
  /* Optional ground shadow: pass the y of the ground plane and we drop a
     small shadow there, so a high arc reads as high. */
  if (typeof groundY === 'number') {
    const drop = Math.max(0, groundY - y);
    const alpha = clamp(0.35 - drop * 0.0015, 0.05, 0.35);
    const rx = 5 + drop * 0.02;
    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
    ctx.beginPath();
    ctx.ellipse(x, groundY, rx, 2, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#eaeaea';
  ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#c94b1a';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, 4, -Math.PI*0.2, Math.PI*0.3); ctx.stroke();
}

function drawBatSwing(ctx, x, y, t) {
  /* A wooden bat sweeping horizontally at the plate. t goes 0 to 1 over
     the swing window, so the bat rotates from behind the batter to in
     front. */
  const cx = x + 6, cy = y - 12;
  const angle = -Math.PI * 0.6 + Math.PI * 1.2 * t;
  const len = 22;
  const bx = cx + Math.cos(angle) * len;
  const by = cy + Math.sin(angle) * len;
  ctx.strokeStyle = '#8b6a3a';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(bx, by); ctx.stroke();
  ctx.strokeStyle = '#5a3a1c';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(angle) * 6, cy + Math.sin(angle) * 6); ctx.stroke();
}

const runnerCache = new Map();
function drawRunner(ctx, x, y, character, scale, pose) {
  scale = scale || 3;
  const key = character.k + '@' + scale;
  let cv = runnerCache.get(key);
  if (!cv) { cv = spriteCanvas(character, Math.round(SPRITE_W * scale)); runnerCache.set(key, cv); }
  /* Ellipse shadow under the sprite so it feels planted on the field. */
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath();
  ctx.ellipse(x, y + 1, cv.width * 0.35, cv.width * 0.10, 0, 0, Math.PI * 2);
  ctx.fill();

  const drawX = Math.round(x - cv.width/2);
  const drawY = Math.round(y - cv.height);
  /* Pose-driven micro-animation: idle-bob shifts a pixel every 400ms,
     run alternates a small skew, windup crouches, and release throws
     the whole sprite forward for a beat. Every character on the field
     picks up an idle bob so nothing looks frozen. */
  const t = performance.now();
  let dy = 0, sx = 1, rot = 0;
  if (pose === 'run-a') { dy = -1; }
  else if (pose === 'run-b') { dy = 0; sx = -1; }
  else if (pose === 'windup') { dy = -2; rot = -0.10; }
  else if (pose === 'release') { dy = 1; rot = 0.14; }
  else if (pose === 'batting') { dy = 0; rot = -0.06; }
  else {
    dy = Math.floor(((t / 420) + (character.k.charCodeAt(0) % 5) * 0.2) % 2) === 0 ? 0 : -1;
  }
  if (rot || sx !== 1) {
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    if (sx !== 1) ctx.scale(sx, 1);
    ctx.drawImage(cv, -cv.width/2, -cv.height + dy);
    ctx.restore();
  } else {
    ctx.drawImage(cv, drawX, drawY + dy);
  }
}

function drawMeter(ctx, w, h, t, pitch, inWindup) {
  ctx.fillStyle = '#0c1218';
  ctx.fillRect(0,0,w,h);
  const diff = DIFF[State.difficulty];
  const half = diff.sweetWidth / 2;
  const ideal = pitch.ideal;
  /* Ok zones (wider yellow band around the green) */
  ctx.fillStyle = 'rgba(244,194,90,.28)';
  ctx.fillRect((ideal - half*1.8) * w, 0, half*3.6*w, h);
  /* Perfect zone */
  ctx.fillStyle = 'rgba(91,176,131,.65)';
  ctx.fillRect((ideal - half) * w, 0, half*2 * w, h);
  /* Cursor: brighter and thicker so it reads through the gradient */
  if (!inWindup) {
    const x = t * w;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x - 2, 0, 4, h);
    ctx.fillStyle = '#f4c25a';
    ctx.fillRect(x - 1, 0, 2, h);
  } else {
    /* windup: dim the whole meter and pulse a hint at the ideal spot */
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(0, 0, w, h);
    const pulse = 0.5 + 0.5 * Math.sin(performance.now()/140);
    ctx.fillStyle = `rgba(244,194,90,${0.35 + pulse*0.4})`;
    ctx.fillRect(ideal*w - 2, 0, 4, h);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('GET READY', w/2, h/2);
  }
  /* Ticks along the bottom */
  ctx.fillStyle = 'rgba(255,255,255,.20)';
  for (let i=1;i<10;i++) ctx.fillRect(i*w/10, h-5, 1, 5);
}

/* ============================================================================
   HUD
   ============================================================================ */
function renderGame() {
  const g = State.game;
  const s = el('div','screen');

  /* Line score above the field, real ballpark style. */
  const ls = el('div','linescore');
  ls.id = 'linescore';
  renderLineScore(ls);
  s.appendChild(ls);

  const arena = el('div','arena');
  const cv = document.createElement('canvas');
  cv.id = 'field'; cv.width = 960; cv.height = 660;
  arena.appendChild(cv);

  /* Score and inning overlaid on the field's corners so nothing steals room
     from the diamond. Names inside color chips read at a glance without
     needing a label. */
  const theme = currentTheme();
  const parkLbl = el('div','corner',
    `<span class="lbl" style="color:${theme.wallLine}">${theme.park}</span>`
  );
  parkLbl.style.top = '0'; parkLbl.style.left = '50%'; parkLbl.style.transform = 'translateX(-50%)';
  parkLbl.style.textAlign = 'center';
  arena.appendChild(parkLbl);

  const tl = el('div','corner tl',
    `<span class="lbl">${g.away.name}${g.away.isYou?' (you)':''}</span>`
    + `<span class="val ${g.away.isYou?'gold':''}" id="hud-away">${g.away.score}</span>`
  );
  const tr = el('div','corner tr',
    `<span class="lbl">${g.home.name}${g.home.isYou?' (you)':''}</span>`
    + `<span class="val ${g.home.isYou?'gold':''}" id="hud-home">${g.home.score}</span>`
  );
  const bl = el('div','corner bl',
    `<span class="lbl">Inning</span>`
    + `<span class="val" id="hud-inning">${g.half==='top'?'Top':'Bot'} ${g.inning}/${g.innings}</span>`
  );
  const br = el('div','corner br',
    `<span class="val" id="hud-count">Outs ${g.outs} · ${g.balls}-${g.strikes}</span>`
  );
  arena.append(tl, tr, bl, br);

  const callout = el('div','callout'); callout.id = 'callout';
  arena.appendChild(callout);
  s.appendChild(arena);

  const meter = el('div','meter-wrap');
  meter.innerHTML = `<div class="label">`
    + `<span><b class="pt" id="pt-name">Get ready</b></span>`
    + `<span id="meter-side">Click anywhere or press Space</span></div>`;
  const m = document.createElement('canvas'); m.id='meter'; m.width=720; m.height=52;
  meter.appendChild(m);
  const hint = el('div','hint', 'Land the marker on the <b>green zone</b> to make solid contact.');
  hint.id = 'meter-hint';
  meter.appendChild(hint);

  /* Pitch-selection strip: hidden by default, shown only during the CPU's
     at bat windup by offerPitchSelection(). Two picks: pitch type and
     target location on a 3 by 3 strike zone grid. Center pitches are
     easier for the CPU to square up but always strikes; corner and edge
     pitches are harder to hit but can turn into balls if you miss. */
  const psel = el('div','pitch-select');
  psel.id = 'pitch-select';
  psel.style.display = 'none';
  const zoneGridCells = [
    'corner','mid','corner',
    'mid','center','mid',
    'corner','mid','corner',
  ];
  const zoneHtml = zoneGridCells.map((cls,i) => `<button class="${cls}" data-zone="${i}" title="Aim here"></button>`).join('');
  psel.innerHTML =
      `<div class="col"><span class="lbl">Pitch</span><div class="type-row">`
    + `<button class="btn ghost" data-pt="fastball">Fastball</button>`
    + `<button class="btn ghost" data-pt="curveball">Curveball</button>`
    + `<button class="btn ghost" data-pt="changeup">Changeup</button>`
    + `</div></div>`
    + `<div class="col"><span class="lbl">Location</span>`
    + `<div class="zone-grid" id="zone-grid">${zoneHtml}</div></div>`;
  meter.appendChild(psel);

  /* Big touch-friendly SWING button under the meter, for phones and
     anyone who prefers a target to a click-anywhere. */
  const swingBtn = el('button','btn swing-btn','SWING');
  swingBtn.id = 'swing-btn';
  swingBtn.onmousedown = swingBtn.ontouchstart = (e) => {
    e.preventDefault();
    /* Route through the same swing path a click would use. */
    const g2 = State.game;
    if (!g2 || !g2.pitch || g2.pitch.swung || !playerIsBatting()) return;
    const now = performance.now();
    if (now < g2.pitch.windupUntil) return;
    const t = clamp((now - g2.pitch.start) / (g2.pitch.speed * 1000), 0, 1);
    g2.pitch.swung = true;
    resolveSwing(t);
  };
  meter.appendChild(swingBtn);
  s.appendChild(meter);

  /* Steal button, only visible when there is a runner who can advance. */
  const stealRow = el('div', 'controls');
  const stealBtn = el('button','btn ghost','Steal 2nd');
  stealBtn.id = 'steal-btn';
  stealBtn.style.display = 'none';
  stealBtn.onclick = attemptSteal;
  stealRow.appendChild(stealBtn);
  s.appendChild(stealRow);

  const atbat = el('div','atbat');
  atbat.id = 'atbat';
  refreshAtBatCard(atbat);
  s.appendChild(atbat);

  const log = el('div','log');
  log.id = 'log';
  for (const line of g.log.slice(-14)) {
    const d = el('div', 'line' + (line.big?' big':''), line.text);
    log.appendChild(d);
  }
  s.appendChild(log);

  const ctrl = el('div','controls');
  const abort = el('button','btn ghost','End Game');
  abort.onclick = () => {
    if (confirm('End this game and return to the menu?')) {
      endAtBatCleanup();
      State.game = null; State.screen = State.mode==='exhibition' ? 'menu' : 'season-hub';
      render();
    }
  };
  ctrl.appendChild(abort);
  s.appendChild(ctrl);

  app.appendChild(s);
  /* Start the always-on field paint loop as soon as the canvas is in the DOM. */
  startFieldLoop();
}

/* One flavor callout at a time. Overlays the field for 1.4s, fades out.
   `kind` picks a color: default gold, plus homer, hit, strike, ball, sub. */
let calloutTimer = 0;
function showCallout(text, kind) {
  const node = document.getElementById('callout');
  if (!node) return;
  node.textContent = text;
  node.className = 'callout on ' + (kind || '');
  clearTimeout(calloutTimer);
  calloutTimer = setTimeout(() => { node.classList.remove('on'); }, 1400);
}

function refreshAtBatCard(node) {
  const g = State.game;
  const b = currentBatter();
  const p = currentPitcher();
  node.innerHTML = '';
  const avatar = spriteCanvas(b, 48);
  avatar.className = 'avatar';
  node.appendChild(avatar);
  const info = el('div', null,
    `<div class="who"><b>${b.n}</b> at bat</div>`
    + `<div class="vs">vs ${p.n} pitching · POW ${b.pow} · CON ${b.con} · SPD ${b.spd}</div>`
  );
  node.appendChild(info);
  const count = el('div','count', `${g.balls}-${g.strikes}`);
  node.appendChild(count);
}

function renderLineScore(node) {
  const g = State.game;
  if (!g) return;
  const innings = g.innings;
  const rowFor = (label, arr, score, isYou) => {
    let html = `<td class="team">${label}${isYou?' *':''}</td>`;
    for (let i = 0; i < innings; i++) {
      const cell = arr[i];
      const isCur = (i + 1) === g.inning;
      const cls = isCur ? 'cur' : '';
      html += `<td class="${cls}">${cell == null ? '' : cell}</td>`;
    }
    html += `<td class="r">${score}</td>`;
    return html;
  };
  let header = '<th>&nbsp;</th>';
  for (let i = 1; i <= innings; i++) header += `<th>${i}</th>`;
  header += '<th>R</th>';
  node.innerHTML = `<table><thead><tr>${header}</tr></thead><tbody>`
    + `<tr>${rowFor(g.away.name.slice(0,10), g.lineScore.away, g.away.score, g.away.isYou)}</tr>`
    + `<tr>${rowFor(g.home.name.slice(0,10), g.lineScore.home, g.home.score, g.home.isYou)}</tr>`
    + `</tbody></table>`;
}

function refreshHud() {
  if (State.screen !== 'game') return;
  const g = State.game;
  const ls = document.getElementById('linescore');
  if (ls) renderLineScore(ls);
  const hudAway = document.getElementById('hud-away');
  const hudHome = document.getElementById('hud-home');
  const hudInn = document.getElementById('hud-inning');
  const hudCount = document.getElementById('hud-count');
  if (hudAway) hudAway.textContent = g.away.score;
  if (hudHome) hudHome.textContent = g.home.score;
  if (hudInn) hudInn.textContent = `${g.half==='top'?'Top':'Bot'} ${g.inning}/${g.innings}`;
  if (hudCount) hudCount.textContent = `Outs ${g.outs} · ${g.balls}-${g.strikes}`;
  const ab = document.getElementById('atbat');
  if (ab) refreshAtBatCard(ab);
  const log = document.getElementById('log');
  if (log) {
    log.innerHTML = '';
    for (const line of g.log.slice(-14)) {
      const d = el('div','line' + (line.big?' big':''), line.text);
      log.appendChild(d);
    }
    log.scrollTop = log.scrollHeight;
  }
  const ptName = document.getElementById('pt-name');
  if (ptName && g.pitch) ptName.textContent = g.pitch.pt.toUpperCase();
  refreshStealButton();
  /* Show swing controls only when the player is batting; show the
     "you're pitching" hint when the CPU is at the plate. */
  const side = document.getElementById('meter-side');
  const hint = document.getElementById('meter-hint');
  const swingBtn = document.getElementById('swing-btn');
  const youBat = playerIsBatting();
  if (side) side.textContent = youBat ? 'Click anywhere or press Space' : 'You are pitching · call a pitch each windup';
  if (hint) hint.style.display = youBat ? '' : 'none';
  if (swingBtn) swingBtn.style.display = youBat ? '' : 'none';
}

function refreshStealButton() {
  const btn = document.getElementById('steal-btn');
  if (!btn) return;
  const g = State.game;
  if (!g || g.over || g.play) { btn.style.display = 'none'; return; }
  /* Only offer a straight steal: runner on 1st going to 2nd, when 2nd is
     empty. Available only during the windup, before the meter starts. */
  const canSteal = playerIsBatting() && g.bases[0] && !g.bases[1] && g.pitch && !g.pitch.swung
                 && performance.now() < g.pitch.windupUntil;
  btn.style.display = canSteal ? '' : 'none';
  if (canSteal) btn.textContent = `Steal 2nd · ${g.bases[0].n}`;
}

function attemptSteal() {
  const g = State.game;
  if (!g || !g.bases[0] || g.bases[1]) return;
  if (!g.pitch || g.pitch.swung || g.play) return;
  const runner = g.bases[0];
  const pitcher = currentPitcher();
  g.pitch.swung = true;
  endAtBatCleanup();
  addLog(`${runner.n} breaks for 2nd.`);
  showCallout('STEAL ATTEMPT', 'sub');
  const odds = clamp(0.35 + (runner.spd - 60)/200 - (pitcher.con - 55)/300, 0.15, 0.9);
  const success = Math.random() < odds;
  setTimeout(() => {
    if (success) {
      g.bases[0] = null;
      g.bases[1] = runner;
      g.stats.sb[runner.k] = (g.stats.sb[runner.k] || 0) + 1;
      addLog(`SAFE. ${runner.n} takes 2nd.`);
      showCallout('STOLEN BASE', 'hit');
    } else {
      g.bases[0] = null;
      g.outs++;
      addLog(`CAUGHT STEALING. ${runner.n} tagged out. ${g.outs} out.`);
      showCallout('CAUGHT STEALING', 'strike');
    }
    refreshHud();
    if (g.outs >= 3) return setTimeout(endHalfInning, 1200);
    setTimeout(throwPitch, 1400);
  }, 900);
}

function addLog(text, big=false) {
  const g = State.game;
  g.log.push({ text, big });
}

/* ============================================================================
   RESULT SCREEN
   ============================================================================ */
function renderResult() {
  const g = State.game;
  const you = g.away.isYou ? g.away : g.home;
  const foe = g.away.isYou ? g.home : g.away;
  const win = you.score > foe.score;

  const s = el('div','screen');
  s.appendChild(el('h2', null, win ? 'You win.' : 'You lose.'));

  const card = el('div','card');
  card.innerHTML =
    `<h3>Final</h3>`
    + `<p style="font-size:16px;color:var(--text)">${you.name} <b>${you.score}</b> · ${foe.name} ${foe.score}</p>`;
  const games = el('h3', null, 'Your batting');
  card.appendChild(games);
  const stats = el('table','table');
  stats.innerHTML = '<thead><tr><th>Batter</th><th class="n">AB</th><th class="n">H</th><th class="n">HR</th><th class="n">K</th></tr></thead>';
  const tb = el('tbody');
  const yourTeam = State.team.map(k => ROSTER_BY_KEY[k]);
  for (const b of yourTeam) {
    const ab = g.stats.ab[b.k] || 0;
    const h = g.stats.hits[b.k] || 0;
    const hr = g.stats.hr[b.k] || 0;
    const so = g.stats.so[b.k] || 0;
    if (!ab && !h) continue;
    const tr = el('tr');
    tr.innerHTML = `<td>${b.n}</td><td class="n">${ab}</td><td class="n">${h}</td><td class="n">${hr}</td><td class="n">${so}</td>`;
    tb.appendChild(tr);
  }
  stats.appendChild(tb);
  card.appendChild(stats);
  s.appendChild(card);

  const row = el('div','btn-row');
  if (State.mode === 'exhibition') {
    const again = el('button','btn','Play Again');
    again.onclick = () => { State.opponent = randomOpponent(null); startGame({ mode:'exhibition' }); };
    const menu = el('button','btn ghost','Main Menu');
    menu.onclick = () => { State.game = null; State.screen='menu'; render(); };
    row.append(again, menu);
  } else if (State.mode === 'season') {
    const hub = el('button','btn','Continue');
    hub.onclick = () => { State.game = null; State.screen='season-hub'; render(); };
    row.append(hub);
  } else if (State.mode === 'playoff') {
    const b = el('button','btn','Back to Bracket');
    b.onclick = () => { State.game = null; State.screen='bracket'; render(); };
    row.append(b);
  }
  s.appendChild(row);

  app.appendChild(s);
}

/* ============================================================================
   SEASON END
   ============================================================================ */
function renderSeasonEnd() {
  const S = State.season;
  const P = S.playoffs;
  const champ = (P && P.final && P.final.result)
    ? P.seeds[P.final.result.winner]
    : null;
  const youWon = champ && champ.you;

  const s = el('div','screen');
  s.appendChild(el('h2', null, youWon ? 'Champions.' : 'Season complete.'));
  const card = el('div','card');
  const rec = seasonRecord(S);
  card.innerHTML = `<p>Regular season ${rec.w}-${rec.l}.</p>`;
  if (champ) card.innerHTML += `<p>Champion: <b style="color:var(--gold)">${champ.name}</b></p>`;
  const ps = S.playerStats;
  card.innerHTML +=
    `<h3>Season totals</h3>`
    + `<p>Hits ${ps.hits} · HR ${ps.hr} · K ${ps.so} · AB ${ps.ab}</p>`;
  s.appendChild(card);

  const row = el('div','btn-row');
  const restart = el('button','btn','Play Again');
  restart.onclick = () => {
    clearSeason(); State.season = null; State.screen='menu'; render();
  };
  const menu = el('button','btn ghost','Main Menu');
  menu.onclick = () => {
    clearSeason(); State.season = null; State.screen='menu'; render();
  };
  row.append(restart, menu);
  s.appendChild(row);

  app.appendChild(s);
}

/* ============================================================================
   UTIL
   ============================================================================ */
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

render();
</script>
