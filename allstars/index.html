  let hrChance = (0.018 + 0.155 * contact * contact) * (0.45 + powForRoll / 110);
  let xbhChance = (0.045 + 0.115 * contact) * (0.55 + powForRoll / 150);
  if (mode === 'power') { hrChance *= 1.75; xbhChance *= 1.45; }
  if (mode === 'contact') { hrChance *= 0.45; xbhChance *= 0.8; }
  if (Math.random() < hrChance) return scheduleContactPlay('home run', batter);

  if (Math.random() < xbhChance) {
    return scheduleContactPlay(Math.random() < 0.35 ? 'triple' : 'double', batter);
  }
  let hitOdds = 0.13 + contact * 0.36 + (ctx.spd - 50)/450;
  if (mode === 'contact') hitOdds += 0.09;
  if (mode === 'power') hitOdds -= 0.04;
  if (batter.k === 'invisible') hitOdds += 0.05;
  if (Math.random() < hitOdds) return scheduleContactPlay('single', batter);
  /* Out on contact: same staging, the callout fires when the fielder gets
     the ball. */
  const out = Math.random() < 0.55 ? 'ground out' : 'fly out';
  return scheduleContactPlay(out, batter);
}

/* -------- Play staging: bat, ball, runners, callout --------
   scheduleContactPlay is what resolveSwing calls after it decides what a
   contacted pitch turns into. It records the outcome onto g.play, kicks
   off a bat swing, then a ball trajectory animation, then applies the
   mutation to the bases with an animated runner tween, then fires the
   callout and moves on. All the timing lives in BEAT. */

function ballTrajectory(kind) {
  const rand = (a,b) => a + Math.random() * (b - a);
  const sign = () => Math.random() < 0.5 ? -1 : 1;
  switch (kind) {
    /* A home run LANDS IN THE CROWD rather than exiting the top of the
       frame: dy -1.55 puts the touchdown in the stands band, and the
       taller arc keeps the flight majestic on the way there. */
    case 'home run':   return { dx: rand(0.55, 1.05)*sign(), dy: -1.55, arcH: 320, duration: 1700 };
    case 'triple':     return { dx: rand(0.75, 1.2)*sign(),  dy: -1.4, arcH: 150, duration: 1250 };
    case 'double':     return { dx: rand(0.5, 1.0)*sign(),   dy: -1.1, arcH: 110, duration: 1050 };
    case 'single':     return { dx: rand(0.3, 0.7)*sign(),   dy: -0.7, arcH: 60,  duration: 850 };
    case 'fly out':    return { dx: rand(0.15,0.5)*sign(),   dy: -1.3, arcH: 170, duration: 1200, caught: true };
    case 'ground out': return { dx: rand(0.35,0.8)*sign(),   dy: -0.15,arcH: 18,  duration: 700,  caught: true };
    case 'bunt single':
    case 'bunt out':   return { dx: rand(0.06,0.28)*sign(),  dy: -0.22,arcH: 10,  duration: 650,  caught: kind === 'bunt out' };
  }
  return { dx: 0, dy: 0, arcH: 0, duration: 700 };
}

/* How many bases the batter travels for this outcome. -1 means back to
   home (a HR); -2 means the batter is out (ground/fly out). */
function batterEndBase(kind) {
  return { 'single':0, 'double':1, 'triple':2, 'home run':-1,
           'ground out':-2, 'fly out':-2,
           'bunt single':0, 'bunt out':-2 }[kind];
}

/* Named waypoints on the diamond, keyed by an integer index. drawField
   converts each index to a pixel position from the current cx/cy/r.
   -1 = home (batter box); 0/1/2 = 1st/2nd/3rd; 3 = home again (a run
   scored, runner is done). */
function waypointForBase(field, idx) {
  const { cx, rx, midY, topY, plateY } = field;
  if (idx === -1) return [cx - 30, plateY + 8];
  if (idx === 0)  return [cx + rx, midY];
  if (idx === 1)  return [cx, topY];
  if (idx === 2)  return [cx - rx, midY];
  if (idx === 3)  return [cx + 2, plateY + 8];
  return [cx, midY];
}

function batterPathIndices(kind) {
  const end = batterEndBase(kind);
  if (end === -2) return [-1, 0];   /* out, runs to first anyway */
  const arr = [-1];
  const target = end === -1 ? 3 : end;
  for (let i = 0; i <= target; i++) arr.push(i);
  return arr;
}
function existingRunnerPathIndices(startBase, kind) {
  const advance = { 'single':1, 'double':2, 'triple':3, 'home run':4 }[kind] || 0;
  const arr = [];
  const end = startBase + advance;
  for (let b = startBase; b <= Math.min(end, 3); b++) arr.push(b);
  return arr;
}
function pathPointAt(field, path, t) {
  if (path.length === 1) return waypointForBase(field, path[0]);
  const scaled = t * (path.length - 1);
  const seg = Math.min(Math.floor(scaled), path.length - 2);
  const frac = scaled - seg;
  const a = waypointForBase(field, path[seg]);
  const b = waypointForBase(field, path[seg + 1]);
  return [a[0] + (b[0] - a[0]) * frac, a[1] + (b[1] - a[1]) * frac];
}

/* Remember the last notable batted ball so it can be replayed. Only real
   highlights are worth keeping: extra base hits and home runs. */
function rememberHighlight(kind, batter, traj) {
  if (kind !== 'home run' && kind !== 'triple' && kind !== 'double') return;
  const g = State.game;
  g.highlight = {
    kind, batterName: batter.n, batterKey: batter.k,
    ball: Object.assign({}, traj),
    inning: g.inning, half: g.half,
  };
}

/* Replay the stored highlight: re-run its ball trajectory over the live
   field with a REPLAY badge, without touching any game state. */
function playHighlight() {
  const g = State.game;
  if (!g || !g.highlight || g.replay) return;
  g.replay = {
    startedAt: performance.now(),
    duration: g.highlight.ball.duration + 500,
    h: g.highlight,
  };
  Sound.play('crack');
  setTimeout(() => { if (State.game) State.game.replay = null; refreshHud(); },
             g.highlight.ball.duration + 600);
  refreshHud();
}

function scheduleContactPlay(kind, batter) {
  const g = State.game;
  /* Bat meets ball. The crack fires immediately, before the ball travels,
     and a gold impact burst pops at the contact point so the hit visibly
     comes OFF THE BAT rather than materializing mid-field. */
  Sound.play('crack');
  {
    const geo = fieldGeom();
    const hitX = geo.cx - 14, hitY = geo.plateY - 4;
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      spawnFx(g, {
        x: hitX, y: hitY, size: 3,
        vx: Math.cos(a) * 140, vy: Math.sin(a) * 140 - 40,
        grav: 200, color: i % 2 ? '#f4c25a' : '#ffffff', life: 340,
      });
    }
  }
  const throwable = kind === 'ground out' && !playerIsBatting();
  if (throwable) return scheduleThrowMinigame(kind, batter);
  const catchable = kind === 'fly out' && !playerIsBatting();
  if (catchable) return scheduleFlyCatchMinigame(kind, batter);
  /* Errors: on a ground or fly out, roll against the fielding team's DEF.
     A low-defense team lets the batter reach on a mishandled ball. */
  let effective = kind;
  let onError = false;
  if (kind === 'ground out' || kind === 'fly out') {
    const fielding = currentFieldingTeam().batters;
    const avgDef = fielding.reduce((a,c) => a + (c.def || 60), 0) / fielding.length;
    let errChance = clamp(0.08 - (avgDef - 60) / 400, 0.02, 0.14);
    /* Black Cat's bad luck: fielders bobble the ball far more often when
       she's the batter. Superstition, weaponized. */
    if (batter.quirk === 'unlucky') errChance = clamp(errChance + 0.22, 0, 0.4);
    if (Math.random() < errChance) {
      effective = 'single';       /* reached on error, treated as a single */
      onError = true;
    }
  }
  const traj = ballTrajectory(effective);
  rememberHighlight(effective, batter, traj);
  const isOut = effective === 'ground out' || effective === 'fly out'
             || effective === 'bunt out';
  const preBases = [...g.bases];

  /* Double play: ground out with a runner on 1st and less than 2 outs. */
  let doublePlay = false;
  if (isOut && effective === 'ground out' && preBases[0] && g.outs < 2) {
    const fielding = currentFieldingTeam().batters;
    const avgDef = fielding.reduce((a,c) => a + (c.def || 60), 0) / fielding.length;
    const runnerSpd = preBases[0].spd;
    const dpChance = clamp(0.40 + (avgDef - 60) / 250 - (runnerSpd - 60) / 220, 0.10, 0.75);
    if (Math.random() < dpChance) doublePlay = true;
  }

  g.play = {
    kind: effective, batter, isOut, onError, doublePlay,
    ball: traj,
    startedAt: performance.now(),
    swingUntil: performance.now() + 240,
    ballUntil: performance.now() + traj.duration,
    runnerStart: performance.now() + Math.max(180, traj.duration - 400),
    runnerUntil: performance.now() + traj.duration + 600,
    preBases,
    batterPath: batterPathIndices(effective),
    runnerPaths: preBases.map((r, i) => r ? existingRunnerPathIndices(i, effective) : null),
    applied: false,
  };

  const applyMs = traj.duration;   /* apply mutation when ball arrives */
  setTimeout(() => {
    if (!g.play || g.play.applied) return;
    g.play.applied = true;
    /* Landing FX: dust on the ground where the ball comes down, glove
       flash on a caught fly ball, confetti + shake on a home run. */
    const geo = fieldGeom();
    const landingX = geo.cx + g.play.ball.dx * geo.r;
    const landingY = geo.cy + g.play.ball.dy * geo.r;
    if (g.play.kind === 'home run') {
      confettiBurst(g, geo.cx, geo.cy);
      /* A white pop where the ball splashes down in the seats, so the
         crowd catches the souvenir instead of the ball just vanishing. */
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * Math.PI * 2;
        spawnFx(g, { x: landingX, y: landingY,
                     vx: Math.cos(a) * (40 + Math.random() * 50),
                     vy: Math.sin(a) * (30 + Math.random() * 40) - 40,
                     grav: 150, life: 500 + Math.random() * 250,
                     size: 2 + (i % 2), color: i % 3 ? '#f5ecc8' : '#f4c25a' });
      }
      g.shakeUntil = performance.now() + 500;
      Sound.play('homer');
      /* Signature moments per character. Trigger a stronger celebration
         for the marquees: Kong shakes the yard longer, Dracula's swarm
         darkens the crowd, Franky flexes hard on the way to home. */
      const who = g.play.batter && g.play.batter.k;
      if (who === 'kong') {
        g.shakeUntil = performance.now() + 900;
        g.signature = { kind: 'chest', until: performance.now() + 1600 };
        Sound.play('crack');   /* double-thump */
        setTimeout(() => Sound.play('crack'), 180);
      } else if (who === 'dracula') {
        g.signature = { kind: 'bats', until: performance.now() + 1400 };
      } else if (who === 'franky') {
        g.signature = { kind: 'flex', until: performance.now() + 1200 };
      } else if (who === 'popeye') {
        g.signature = { kind: 'anchor', until: performance.now() + 1200 };
      } else if (who === 'chupacabra') {
        g.signature = { kind: 'drain', until: performance.now() + 1400 };
      } else if (who === 'raboddog') {
        g.signature = { kind: 'snarl', until: performance.now() + 1200 };
      } else if (who === 'santa') {
        g.signature = { kind: 'sleigh', until: performance.now() + 1400 };
      } else if (who === 'liberty') {
        g.signature = { kind: 'torch', until: performance.now() + 1400 };
      }
    } else if (g.play.kind === 'triple') {
      /* Triples get their own smaller flourishes for chars whose vibe fits. */
      const who = g.play.batter && g.play.batter.k;
      if (who === 'robin') g.signature = { kind: 'arrow', until: performance.now() + 1100 };
      else if (who === 'peter') g.signature = { kind: 'flies', until: performance.now() + 1200 };
      else if (who === 'centaur') g.signature = { kind: 'gallop', until: performance.now() + 1100 };
    } else if (g.play.kind === 'fly out') {
      gloveFlash(g, landingX, landingY);
      dustPuff(g, landingX, landingY);
      Sound.play('catch');
    } else {
      dustPuff(g, landingX, landingY);
      if (g.play.kind === 'single' || g.play.kind === 'double' || g.play.kind === 'triple') Sound.play('cheer');
      else Sound.play('aww');
    }
    if (onError) {
      applyHitMutation('single', batter, { onError: true });
    } else if (doublePlay) {
      applyDoublePlayMutation(batter);
    } else if (isOut) {
      applyOutMutation(effective, batter);
    } else {
      applyHitMutation(effective, batter);
    }
    refreshHud();
  }, applyMs);

  const finishMs = traj.duration + 700;
  setTimeout(() => {
    if (!g.play) return;
    const wasOut = g.play.isOut && !g.play.onError;
    const wasDP = g.play.doublePlay;
    g.play = null;
    /* Check for a walk-off: home team leads at the end of a play in the
       bottom of the final inning or later. */
    if (checkWalkOff()) return finishGame();
    if (wasDP && g.outs >= 3) return endHalfInning();
    if (wasOut) afterOutTransition();
    else        afterHitTransition(g && g.away && g.home ? kind : kind);
  }, finishMs);
}

function applyDoublePlayMutation(batter) {
  const g = State.game;
  statBump(batter.k, 'ab');
  const preRunner = g.bases[0];
  g.bases[0] = null;
  g.outs += 2;
  addLog(`Double play. ${batter.n} and ${preRunner.n} both out. ${g.outs} out.`);
  showCallout('DOUBLE PLAY', 'strike');
  /* Kick up dust at both bases for the play. */
  const geo = fieldGeom();
  dustPuff(g, geo.cx + geo.rx, geo.midY);
  dustPuff(g, geo.cx + geo.rx * 0.5, geo.midY - geo.ry * 0.5);
}

function checkWalkOff() {
  const g = State.game;
  if (g.half !== 'bottom') return false;
  if (g.inning < g.innings) return false;
  if (g.home.score > g.away.score) {
    g.over = true;
    g.winner = 'home';
    return true;
  }
  return false;
}

function applyHitMutation(kind, batter, opts) {
  const g = State.game;
  const onError = opts && opts.onError;
  statBump(batter.k,'ab');
  if (!onError) statBump(batter.k,'hits');
  if (kind === 'home run') {
    statBump(batter.k,'hr');
    let scored = 1;
    for (let i=0;i<3;i++) if (g.bases[i]) scored++;
    g.bases = [null,null,null];
    scoreRuns(scored);
    addLog(`${batter.n} crushes it. HOME RUN. ${scored} run${scored>1?'s':''} score.`, true);
    showCallout(`HOME RUN · ${scored} RUN${scored>1?'S':''}`, 'homer');
    return;
  }
  const bases = { 'single':1,'double':2,'triple':3 }[kind];
  let scored = 0;
  let thrownOut = 0;
  const newBases = [null,null,null];
  for (let i=2;i>=0;i--) {
    const runner = g.bases[i];
    if (!runner) continue;
    let dest = i + bases;
    /* Aggressive send: on singles, a fast runner on 2nd rounds third
       and heads for home. Speed-based chance to score; otherwise thrown
       out at the plate. On doubles a very fast runner from 1st tries
       the same. Only kicks in for real hits, not errors. */
    if (!onError && kind === 'single' && i === 1 && runner.spd >= 75) {
      const scoreChance = 0.35 + (runner.spd - 75) / 100;
      if (Math.random() < scoreChance) dest = 3;
      else { thrownOut++; g.outs++; addLog(`${runner.n} thrown out at the plate.`); continue; }
    } else if (!onError && kind === 'double' && i === 0 && runner.spd >= 85) {
      const scoreChance = 0.30 + (runner.spd - 85) / 120;
      if (Math.random() < scoreChance) dest = 3;
      else { thrownOut++; g.outs++; addLog(`${runner.n} thrown out at the plate.`); continue; }
    }
    if (dest >= 3) scored++;
    else newBases[dest] = runner;
  }
  newBases[bases-1] = batter;
  g.bases = newBases;
  if (scored) scoreRuns(scored);
  if (onError) {
    addLog(`${batter.n} reaches on an error${scored ? `, ${scored} score` : ''}.`);
    showCallout('REACHED ON ERROR', 'sub');
  } else {
    const parts = [`${batter.n} lines a ${kind}`];
    if (scored) parts.push(`, ${scored} run${scored>1?'s':''} score`);
    if (thrownOut) parts.push(', runner thrown out at the plate');
    addLog(parts.join('') + '.');
    const outNote = thrownOut ? ' · OUT AT HOME' : (scored ? ` · ${scored} IN` : '');
    showCallout(kind.toUpperCase() + outNote, scored ? 'homer' : (thrownOut ? 'strike' : 'hit'));
  }
}

function applyOutMutation(kind, batter) {
  const g = State.game;
  statBump(batter.k,'ab');
  noteFragileOut(batter);
  if (kind === 'bunt out') {
    /* The sacrifice: the batter is out, everybody else moves up. */
    const fromThird = g.bases[2];
    g.bases = [null, g.bases[0], g.bases[1]];
    g.outs++;
    if (fromThird) scoreRuns(1);
    addLog(`${batter.n} lays down a sacrifice bunt${fromThird ? ', a run scores' : ''}. ${g.outs} out.`);
    showCallout(fromThird ? 'SQUEEZE! RUN SCORES' : 'SACRIFICE BUNT', fromThird ? 'homer' : 'sub');
    return;
  }
  g.outs++;
  addLog(`${batter.n} out (${kind}) to the ${randPos(kind)}. ${g.outs} out.`);
  showCallout(kind === 'ground out' ? 'GROUND OUT' : 'FLY OUT', 'sub');
}

/* -------- Throw minigame --------
   Grounders when the player is fielding play out in two stages: the ball
   goes to a fielder, then the player has a small window to time a throw
   to first. The meter is a moving cursor against a green zone (safe out),
   a wider yellow zone (infield single, batter reaches on a slow play),
   and everything outside (error, batter safe and any runners take an
   extra base). Fielder DEF widens the green zone. */

function scheduleThrowMinigame(kind, batter) {
  const g = State.game;
  const traj = ballTrajectory(kind);
  const isOut = true;
  const preBases = [...g.bases];
  g.play = {
    kind, batter, isOut,
    ball: traj,
    startedAt: performance.now(),
    swingUntil: performance.now() + 240,
    ballUntil: performance.now() + traj.duration,
    runnerStart: performance.now() + Math.max(180, traj.duration - 400),
    runnerUntil: performance.now() + traj.duration + 600,
    preBases,
    batterPath: batterPathIndices(kind),
    runnerPaths: preBases.map((r, i) => r ? existingRunnerPathIndices(i, kind) : null),
    applied: false,
    throwActive: false,
  };

  const geo = fieldGeom();
  const angle = Math.atan2(traj.dy * geo.r, traj.dx * geo.r);
  const landingX = geo.cx + Math.cos(angle) * geo.r * 0.9;
  const landingY = geo.cy + Math.sin(angle) * geo.r * 0.9;

  /* At ball-arrival time, spawn dust and open the throw window. */
  setTimeout(() => {
    if (!g.play || g.play.applied) return;
    dustPuff(g, landingX, landingY, 'rgba(205,170,120,.9)');
    Sound.play('catch');
    startThrowWindow(kind, batter);
  }, traj.duration);
}

function startThrowWindow(kind, batter) {
  const g = State.game;
  if (!g.play) return;
  /* Overall fielding rating for the team's infield (average of DEF for
     four infielders): better fielders = wider safe zone. */
  const fs = currentFieldingTeam().batters;
  const infield = [fs[2], fs[3], fs[4], fs[5]].filter(Boolean);
  const avgDef = infield.reduce((a, c) => a + c.def, 0) / (infield.length || 1);
  const window = {
    ideal: 0.55 + (Math.random() - 0.5) * 0.2,   /* wobbly target each throw */
    greenHalf: 0.06 + (avgDef - 50) / 800,
    yellowHalf: 0.14,
    duration: 1600,
    startedAt: performance.now(),
    resolved: false,
  };
  g.play.throwActive = true;
  g.play.throwWindow = window;

  const finish = (t) => {
    if (window.resolved) return;
    window.resolved = true;
    g.play.throwActive = false;
    document.removeEventListener('keydown', onKey);
    document.removeEventListener('click', onClick, true);
    const d = Math.abs(t - window.ideal);
    let outcome;
    if (d <= window.greenHalf) outcome = 'out';
    else if (d <= window.yellowHalf) outcome = 'single';
    else outcome = 'error';
    resolveThrow(outcome, kind, batter);
  };
  const onClick = (e) => {
    if (window.resolved) return;
    const t = clamp((performance.now() - window.startedAt) / window.duration, 0, 1);
    finish(t);
  };
  const onKey = (e) => {
    if (e.code === 'Space') { e.preventDefault(); onClick(e); }
  };
  document.addEventListener('keydown', onKey);
  document.addEventListener('click', onClick, true);
  /* If the player doesn't throw in time, fielder holds it: batter safe. */
  setTimeout(() => finish(-1), window.duration + 20);
}

function resolveThrow(outcome, kind, batter) {
  const g = State.game;
  if (!g.play || g.play.applied) return;
  g.play.applied = true;
  if (outcome === 'out') {
    applyOutMutation('ground out', batter);
  } else if (outcome === 'single') {
    /* Batter reaches on a slow play; runners advance one. */
    addLog(`${batter.n} beats the throw. Infield single.`);
    showCallout('INFIELD SINGLE', 'hit');
    Sound.play('cheer');
    applyHitMutation('single', batter);
  } else {
    /* Error: batter to first, everyone else advances an extra base. */
    addLog(`Throwing error. ${batter.n} safe, runners advance.`);
    showCallout('ERROR', 'strike');
    Sound.play('aww');
    applyErrorMutation(batter);
  }
  refreshHud();
  /* Complete the play: clear the animation state and advance to the next
     batter (or end the half). Without this the game freezes right here,
     which is exactly what shipped once. */
  const wasOut = outcome === 'out';
  setTimeout(() => {
    if (!State.game) return;
    State.game.play = null;
    if (wasOut) afterOutTransition();
    else afterHitTransition('single');
  }, 900);
}

/* -------- Fly-ball catch minigame --------
   When the player is fielding and the batter puts one up, the outfielder
   camps under it. A different meter appears: the ball drops into a
   catch window that shrinks toward the middle (mimics glove tracking).
   Nail the green center to catch; ok yellow band is a single that
   drops in; a miss is a triple over the fielder's head. */

function scheduleFlyCatchMinigame(kind, batter) {
  const g = State.game;
  const traj = ballTrajectory(kind);
  const preBases = [...g.bases];
  g.play = {
    kind, batter, isOut: true,
    ball: traj,
    startedAt: performance.now(),
    swingUntil: performance.now() + 240,
    ballUntil: performance.now() + traj.duration,
    runnerStart: performance.now() + Math.max(180, traj.duration - 400),
    runnerUntil: performance.now() + traj.duration + 600,
    preBases,
    batterPath: batterPathIndices(kind),
    runnerPaths: preBases.map((r, i) => r ? existingRunnerPathIndices(i, kind) : null),
    applied: false,
    catchActive: false,
  };
  const geo = fieldGeom();
  const angle = Math.atan2(traj.dy * geo.r, traj.dx * geo.r);
  const landingX = geo.cx + Math.cos(angle) * geo.r * 0.9;
  const landingY = geo.cy + Math.sin(angle) * geo.r * 0.9;
  /* When the ball starts descending, the catch window opens. */
  const openAt = traj.duration * 0.6;
  setTimeout(() => {
    if (!g.play || g.play.applied) return;
    startCatchWindow(kind, batter, landingX, landingY);
  }, openAt);
}

function startCatchWindow(kind, batter, landingX, landingY) {
  const g = State.game;
  if (!g.play) return;
  const fs = currentFieldingTeam().batters;
  const of = [fs[6], fs[7], fs[1]].filter(Boolean);
  const avgDef = of.reduce((a, c) => a + c.def, 0) / (of.length || 1);
  /* A catch bar with a shrinking green center. Not held-still-hard: the
     time window is short (900 ms) and the fielder DEF widens the safe
     zone. */
  const window = {
    duration: 900,
    startedAt: performance.now(),
    greenHalf: 0.10 + (avgDef - 50) / 900,
    yellowHalf: 0.24,
    landingX, landingY,
    resolved: false,
  };
  g.play.catchActive = true;
  g.play.catchWindow = window;

  const finish = (t) => {
    if (window.resolved) return;
    window.resolved = true;
    g.play.catchActive = false;
    document.removeEventListener('keydown', onKey);
    document.removeEventListener('click', onClick, true);
    /* t < 0 means the window expired. */
    let outcome;
    if (t < 0) outcome = 'miss';
    else {
      const d = Math.abs(t - 0.5);
      if (d <= window.greenHalf) outcome = 'catch';
      else if (d <= window.yellowHalf) outcome = 'single';
      else outcome = 'miss';
    }
    resolveCatch(outcome, kind, batter, landingX, landingY);
  };
  const onClick = (e) => {
    if (window.resolved) return;
    const t = clamp((performance.now() - window.startedAt) / window.duration, 0, 1);
    finish(t);
  };
  const onKey = (e) => { if (e.code === 'Space') { e.preventDefault(); onClick(e); } };
  document.addEventListener('keydown', onKey);
  document.addEventListener('click', onClick, true);
  setTimeout(() => finish(-1), window.duration + 20);
}

function resolveCatch(outcome, kind, batter, landingX, landingY) {
  const g = State.game;
  if (!g.play || g.play.applied) return;
  g.play.applied = true;
  if (outcome === 'catch') {
    gloveFlash(g, landingX, landingY);
    Sound.play('catch');
    applyOutMutation('fly out', batter);
  } else if (outcome === 'single') {
    addLog(`${batter.n} bloops it in front of the fielder. Single.`);
    showCallout('DROPS IN', 'hit');
    Sound.play('cheer');
    applyHitMutation('single', batter);
  } else {
    addLog(`Ball drops over the fielder's head. Triple.`);
    showCallout('OVER HIS HEAD', 'strike');
    Sound.play('aww');
    applyHitMutation('triple', batter);
  }
  refreshHud();
  /* Complete the play: same freeze guard as the throw minigame. */
  const wasOut = outcome === 'catch';
  const hitKind = outcome === 'single' ? 'single' : 'triple';
  setTimeout(() => {
    if (!State.game) return;
    State.game.play = null;
    if (wasOut) afterOutTransition();
    else afterHitTransition(hitKind);
  }, 900);
}

function applyErrorMutation(batter) {
  const g = State.game;
  statBump(batter.k, 'ab');
  /* All runners advance two, batter to first. */
  let scored = 0;
  const newBases = [null, null, null];
  for (let i = 2; i >= 0; i--) {
    const runner = g.bases[i];
    if (!runner) continue;
    const dest = i + 2;
    if (dest >= 3) scored++;
    else newBases[dest] = runner;
  }
  newBases[0] = batter;
  g.bases = newBases;
  if (scored) scoreRuns(scored);
}

function afterHitTransition(kind) {
  const g = State.game;
  if (g.walkoff) {
    g.over = true; g.winner = 'home';
    return setTimeout(finishGame, BEAT.afterHomer);
  }
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, kind === 'home run' ? BEAT.afterHomer : BEAT.afterHit);
}

function afterOutTransition() {
  const g = State.game;
  if (g.outs >= 3) return endHalfInning();
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, BEAT.afterOut);
}

function randPos(out) {
  if (out === 'ground out') return ['pitcher','shortstop','second','third','first'][Math.floor(Math.random()*5)];
  return ['left','center','right'][Math.floor(Math.random()*3)];
}

function recordHit(kind, batter) {
  const g = State.game;
  statBump(batter.k,'ab');
  statBump(batter.k,'hits');
  const bases = { 'single':1,'double':2,'triple':3,'home run':4,'bunt single':1 }[kind];
  if (kind === 'home run') {
    statBump(batter.k,'hr');
    let scored = 1;   /* the batter */
    for (let i=0;i<3;i++) if (g.bases[i]) scored++;
    g.bases = [null,null,null];
    scoreRuns(scored);
    addLog(`${batter.n} crushes it. HOME RUN. ${scored} run${scored>1?'s':''} score.`, true);
    showCallout(`HOME RUN · ${scored} RUN${scored>1?'S':''}`, 'homer');
  } else {
    /* Advance existing runners by `bases`, then place batter */
    let scored = 0;
    const newBases = [null,null,null];
    for (let i=2;i>=0;i--) {
      const runner = g.bases[i];
      if (!runner) continue;
      const dest = i + bases;   /* 0=first, 1=second, 2=third; dest>=3 scores */
      if (dest >= 3) scored++;
      else newBases[dest] = runner;
    }
    if (bases < 4) newBases[bases-1] = batter;
    g.bases = newBases;
    if (scored) scoreRuns(scored);
    const verb = kind === 'bunt single' ? 'drops a bunt and beats it out'
               : `lines a ${kind}`;
    addLog(`${batter.n} ${verb}${scored ? `, ${scored} run${scored>1?'s':''} score` : ''}.`);
    showCallout(kind.toUpperCase() + (scored ? ` · ${scored} IN` : ''), scored ? 'homer' : 'hit');
  }
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, kind === 'home run' ? BEAT.afterHomer : BEAT.afterHit);
}

function recordWalk() {
  const g = State.game;
  const batter = currentBatter();
  addLog(`${batter.n} walks.`);
  showCallout('WALK', 'sub');
  const bases = g.bases;
  let scored = 0;
  if (bases[0] && bases[1] && bases[2]) { scored = 1; g.bases = [batter, bases[0], bases[1]]; }
  else if (bases[0] && bases[1]) { g.bases = [batter, bases[0], bases[1]]; }
  else if (bases[0]) { g.bases = [batter, bases[0], bases[2]]; }
  else { g.bases = [batter, bases[1], bases[2]]; }
  if (scored) scoreRuns(scored);
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, BEAT.afterWalk);
}

function recordOut(reason, isStrikeout) {
  const g = State.game;
  const batter = currentBatter();
  /* Phoenix rebirth: the first strikeout she'd take in a game becomes a
     walk to first instead. She rises from the ashes. */
  if (isStrikeout && g.batterCtx && g.batterCtx.flags && g.batterCtx.flags.rebirth && !g.phoenixUsed) {
    g.phoenixUsed = true;
    addLog(`${batter.n} rises from the ashes. Reaches first.`, true);
    showCallout('REBIRTH', 'homer');
    g.signature = { kind: 'torch', until: performance.now() + 1200 };
    Sound.play('cheer');
    return recordWalk();
  }
  statBump(batter.k,'ab');
  if (isStrikeout) statBump(batter.k,'so');
  noteFragileOut(batter);
  g.outs++;
  addLog(`${batter.n} out (${reason}). ${g.outs} out.`);
  if (isStrikeout) showCallout('STRIKEOUT', 'strike');
  if (g.outs >= 3) return endHalfInning();
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, BEAT.afterOut);
}

function nextBatter() {
  const t = currentBattingTeam();
  t.idx = (t.idx + 1) % 9;
  const g = State.game;
  g.balls = 0; g.strikes = 0;
}

function scoreRuns(n) {
  const g = State.game;
  const t = currentBattingTeam();
  t.score += n;
  /* File the runs on the line score under the current inning. */
  const key = g.half === 'top' ? 'away' : 'home';
  while (g.lineScore[key].length < g.inning) g.lineScore[key].push(0);
  g.lineScore[key][g.inning - 1] += n;
  /* Walk-off: if the HOME team is batting in the bottom of the final
     inning (or extra) and their score exceeds the away score, the game
     ends right here, mid-inning. Trigger a special callout and let the
     transition timers wind down before firing the result screen. */
  if (g.half === 'bottom' && g.inning >= g.innings && g.home.score > g.away.score) {
    g.walkoff = true;
    showCallout('WALK-OFF!', 'homer');
  }
}

function endHalfInning() {
  const g = State.game;
  addLog(`Side retired. End of ${g.half === 'top' ? 'top' : 'bottom'} of ${g.inning}.`, true);
  showCallout('SIDE RETIRED', 'homer');
  Sound.play('inning');
  g.bases = [null,null,null];
  g.outs = 0;
  g.balls = 0; g.strikes = 0;
  if (g.half === 'top') {
    g.half = 'bottom';
  } else {
    g.half = 'top';
    g.inning++;
  }
  const done = checkGameOver();
  refreshHud();
  if (done) return finishGame();
  /* Also fire a walk-off check right after flipping to the bottom of the
     final inning, in case the home team is already ahead. */
  if (checkWalkOff()) return finishGame();
  setTimeout(startAtBat, BEAT.betweenHalfInnings);
}

function checkGameOver() {
  const g = State.game;
  /* Walk-off in real time: home team is batting in the bottom of the
     final (or later) inning and takes the lead, the game ends on the
     spot. checkForWalkoff runs after every scoring play so the game can
     end mid-inning. */
  /* After 9 (or configured) full innings, tied continues; unless capped for arcade. */
  if (g.inning > g.innings) {
    if (g.away.score !== g.home.score) {
      g.over = true;
      g.winner = g.home.score > g.away.score ? 'home' : 'away';
      return true;
    }
  }
  /* Walk off: home leads at end of top after regulation */
  if (g.inning > g.innings && g.half === 'bottom' && g.home.score > g.away.score) {
    g.over = true; g.winner = 'home'; return true;
  }
  /* If we're in bottom of last inning and home leads, skip */
  if (g.inning === g.innings && g.half === 'top' && g.home.score > g.away.score && g.outs === 0 && g.away.idx === 0) {
    /* We just wrapped, home already leads, no need to bat bottom */
    /* Not triggered normally; the natural flow handles this */
  }
  /* End of top of final inning: if home is ahead, home does not bat */
  if (g.inning > g.innings && g.half === 'bottom') {
    /* We flipped past regulation with home leading or tied is handled above */
  }
  /* Skip bottom half if home leads after top of final inning */
  if (g.half === 'bottom' && g.inning === g.innings && g.home.score > g.away.score) {
    g.over = true; g.winner = 'home'; return true;
  }
  /* Cap arcade blowouts at 25 to prevent slog */
  if (g.away.score - g.home.score >= 15 && g.inning >= Math.max(3, g.innings - 1)) {
    g.over = true; g.winner = 'away'; return true;
  }
  if (g.home.score - g.away.score >= 15 && g.inning >= Math.max(3, g.innings - 1)) {
    g.over = true; g.winner = 'home'; return true;
  }
  return false;
}

function finishGame() {
  const g = State.game;
  g.live = false;
  stopFieldLoop();
  Sound.music.stop();
  const you = g.away.isYou ? g.away : g.home;
  const foe = g.away.isYou ? g.home : g.away;
  const win = you.score > foe.score;

  if (State.mode === 'season' && State.season && !State.season.playoffs) {
    State.season.results.push({
      opponent: foe.name, win, you: you.score, them: foe.score,
    });
    /* Roll individual stats forward */
    const ps = State.season.playerStats;
    for (const k of Object.keys(g.stats.hr)) ps.hr += g.stats.hr[k];
    for (const k of Object.keys(g.stats.so)) ps.so += g.stats.so[k];
    for (const k of Object.keys(g.stats.sb || {})) ps.sb += g.stats.sb[k];
    for (const k of Object.keys(g.stats.hits)) ps.hits += g.stats.hits[k];
    for (const k of Object.keys(g.stats.ab)) ps.ab += g.stats.ab[k];
    /* Per-character season stats for the leaderboard. */
    const per = State.season.perPlayer || (State.season.perPlayer = {});
    const bumpPer = (k, key, n) => {
      if (!per[k]) per[k] = { hr:0, hits:0, ab:0, so:0, sb:0 };
      per[k][key] += n;
    };
    for (const [k, v] of Object.entries(g.stats.hr || {})) bumpPer(k, 'hr', v);
    for (const [k, v] of Object.entries(g.stats.so || {})) bumpPer(k, 'so', v);
    for (const [k, v] of Object.entries(g.stats.sb || {})) bumpPer(k, 'sb', v);
    for (const [k, v] of Object.entries(g.stats.hits || {})) bumpPer(k, 'hits', v);
    for (const [k, v] of Object.entries(g.stats.ab || {})) bumpPer(k, 'ab', v);
    saveSeason(State.season);
  } else if (State.mode === 'playoff' && State.season) {
    /* Record playoff result */
    const P = State.season.playoffs;
    const match = g.mode === 'playoff' && g.round === 'semi' ? P.semis[g.matchIdx] : P.final;
    const winner = win
      ? (g.away.isYou ? match.away : match.home)
      : (g.away.isYou ? match.home : match.away);
    match.result = { homeScore: g.home.score, awayScore: g.away.score, winner };
    /* If any CPU semis remain, they will sim next when the bracket page shows */
    saveSeason(State.season);
    if (win) PROGRESS.playoffWins = (PROGRESS.playoffWins|0) + 1;
    if (win && g.round === 'final') PROGRESS.titles = (PROGRESS.titles|0) + 1;
  } else if (State.mode === 'cup' && State.cup) {
    const C = State.cup;
    const m = C.rounds[g.cupR][g.cupI];
    const A = C.entrants[m.a];
    const youIsA = !!A.you;
    /* Map the game's home/away scores back onto the bracket's a/b slots. */
    const youScore = you.score, foeScore = foe.score;
    m.result = {
      aScore: youIsA ? youScore : foeScore,
      bScore: youIsA ? foeScore : youScore,
      winner: win ? (youIsA ? m.a : m.b) : (youIsA ? m.b : m.a),
    };
    cupPropagate(C);
    saveCup(C);
    if (win) PROGRESS.playoffWins = (PROGRESS.playoffWins|0) + 1;
    if (C.done && C.champion != null && C.entrants[C.champion].you) {
      PROGRESS.titles = (PROGRESS.titles|0) + 1;
    }
  }

  /* Achievement progress from any game, whatever the mode. */
  const yourHR = you.batters.reduce((a,b) => a + (g.stats.hr[b.k] || 0), 0);
  if (State.mode === 'season' && State.season) {
    PROGRESS.seasonHR = Math.max(PROGRESS.seasonHR|0, State.season.playerStats.hr|0);
  } else {
    PROGRESS.seasonHR = Math.max(PROGRESS.seasonHR|0, yourHR);
  }
  if (win && (you.score - foe.score) >= 10) PROGRESS.blowouts = (PROGRESS.blowouts|0) + 1;
  if (g.innings >= 9) PROGRESS.nineInningGames = (PROGRESS.nineInningGames|0) + 1;
  /* Comeback: you trailed at some point on the line score and still won. */
  if (win) {
    let aw = 0, hm = 0, trailed = false;
    const n = Math.max(g.lineScore.away.length, g.lineScore.home.length);
    for (let i = 0; i < n; i++) {
      aw += g.lineScore.away[i] || 0;
      hm += g.lineScore.home[i] || 0;
      const mine = you === g.away ? aw : hm;
      const theirs = you === g.away ? hm : aw;
      if (mine < theirs) trailed = true;
    }
    if (trailed) PROGRESS.comebacks = (PROGRESS.comebacks|0) + 1;
  }
  saveProgress();
  g.freshUnlocks = refreshUnlocks();

  State.screen = 'result';
  render();
}

/* ============================================================================
   FIELD AND METER RENDERING
   ============================================================================ */

/* The field canvas has a fixed internal size, so play staging code can
   compute the same geometry drawField uses without holding a context. */
function fieldGeom() {
  /* The Backyard Baseball camera: home plate LARGE at the bottom of the
     frame, first and third pushed way out to the sides, second base
     compressed upward. The diamond is a square seen along the ground,
     so it draws about twice as wide as it is tall; drawing it with one
     radius made it read as a shape pinned to a wall, and rounding its
     corners made that shape a circle.

       rx      half width of the diamond (plate to first, horizontally)
       ry      ONE hop of vertical depth (plate up to the corner bases)
       plateY  home plate; midY first and third; topY second base

     cy and r are the legacy aliases the ball flight, landing and FX
     code aim with; they approximate the diamond's center and scale. */
  const w = 960, h = 660;
  const cx = w / 2;
  const plateY = h * 0.86;
  const rx = w * 0.315;
  const ry = h * 0.255;
  const midY = plateY - ry;
  const topY = plateY - 2 * ry;
  const moundY = plateY - ry * 0.92;
  return { w, h, cx, rx, ry, plateY, midY, topY, moundY, cy: midY, r: 210 };
}

/* -------- Particles --------
   One flat array on the game. Everything is a square that moves, falls,
   and fades. Dust for slides and landings, confetti for homers, a white
   flash for catches. Updated and drawn once per frame inside drawField. */
function spawnFx(g, p) {
  if (!g.fx) g.fx = [];
  if (g.fx.length > 400) return;   /* hard cap, keeps a confetti spam sane */
  g.fx.push(p);
}
function dustPuff(g, x, y, color) {
  for (let i = 0; i < 9; i++) {
    spawnFx(g, {
      x, y, size: 3,
      vx: (Math.random() - 0.5) * 80,
      vy: -20 - Math.random() * 50,
      grav: 160,
      color: color || 'rgba(205,170,120,.9)',
      life: 450 + Math.random() * 300,
    });
  }
}
function gloveFlash(g, x, y) {
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2;
    spawnFx(g, {
      x, y, size: 2,
      vx: Math.cos(a) * 90, vy: Math.sin(a) * 90,
      grav: 0, color: '#eaeaea', life: 300,
    });
  }
}
function confettiBurst(g, x, y) {
  const cols = ['#f4c25a','#d24949','#5bb083','#6aa7c4','#b08ac6','#eaeaea'];
  for (let i = 0; i < 46; i++) {
    spawnFx(g, {
      x: x + (Math.random() - 0.5) * 120, y,
      size: 4,
      vx: (Math.random() - 0.5) * 220,
      vy: -40 - Math.random() * 180,
      grav: 210,
      color: cols[i % cols.length],
      life: 1100 + Math.random() * 700,
    });
  }
}
function updateAndDrawFx(ctx, g) {
  if (!g.fx || !g.fx.length) { g.fxTime = performance.now(); return; }
  const now = performance.now();
  const dt = Math.min(50, now - (g.fxTime || now));
  g.fxTime = now;
  g.fx = g.fx.filter(p => (p.life -= dt) > 0);
  for (const p of g.fx) {
    p.x += p.vx * dt / 1000;
    p.y += p.vy * dt / 1000;
    p.vy += (p.grav || 0) * dt / 1000;
    ctx.globalAlpha = clamp(p.life / 400, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawField(ctx, w, h, t, pitch, inWindup) {
  /* Night sky, crowd, light towers, outfield wall, grass, diamond.
     Everything sized to the field's own w and h so the canvas can be
     resized. A home run shakes the whole camera for half a second. */
  ctx.save();
  const gShake = State.game;
  if (gShake && gShake.shakeUntil && performance.now() < gShake.shakeUntil) {
    const mag = 6 * (gShake.shakeUntil - performance.now()) / 500;
    ctx.translate((Math.random() - 0.5) * mag * 2, (Math.random() - 0.5) * mag * 2);
  }

  const theme = currentTheme();

  ctx.fillStyle = '#0b1015';
  ctx.fillRect(-8, -8, w + 16, h + 16);

  const skyH = h * 0.105;
  /* Sky with depth: darker at the zenith, a warm stadium-light glow low
     over the stands, instead of one flat slab of color. */
  ctx.fillStyle = theme.sky;
  ctx.fillRect(0, 0, w, skyH + 64);
  const horizon = ctx.createLinearGradient(0, 0, 0, skyH + 50);
  horizon.addColorStop(0, 'rgba(0,0,0,.30)');
  horizon.addColorStop(0.65, 'rgba(0,0,0,.05)');
  horizon.addColorStop(1, 'rgba(255,206,130,.10)');
  ctx.fillStyle = horizon;
  ctx.fillRect(0, 0, w, skyH + 50);
  /* a few stars, dimmed on daytime themes */
  if (theme.sky !== '#5aa0d0') {
    ctx.fillStyle = 'rgba(234,234,234,.5)';
    for (let x = 13; x < w; x += 61) ctx.fillRect(x, 6 + (x * 7) % 18, 2, 2);
  }

  /* Landmark: theme-specific silhouette in the sky area. */
  if (theme.landmark) theme.landmark(ctx, w, h);

  /* Light towers, glowing */
  const tower = (tx) => {
    ctx.fillStyle = '#2a3644';
    ctx.fillRect(tx - 2, 14, 4, skyH - 14);
    ctx.fillStyle = '#1a2430';
    ctx.fillRect(tx - 16, 6, 32, 12);
    for (let row = 0; row < 2; row++) {
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = '#f5ecc8';
        ctx.fillRect(tx - 13 + i * 8, 8 + row * 5, 4, 3);
      }
    }
    const glow = ctx.createRadialGradient(tx, 12, 2, tx, 12, 60);
    glow.addColorStop(0, 'rgba(245,236,200,.20)');
    glow.addColorStop(1, 'rgba(245,236,200,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(tx - 60, 0, 120, 80);
  };
  tower(w * 0.14);
  tower(w * 0.86);

  /* THE WALL IS AN ARC. From behind the plate the fence is deepest in
     dead center and sweeps toward the camera at the foul lines, so its
     top edge is a curve, not a horizontal band. The crowd, the padding,
     the warning track and the top of the grass all follow the same
     curve, which is most of what makes the top of the frame read as a
     ballpark instead of a wallpaper strip. */
  const wallH = 24, trackH = 13, crowdH = 34;
  const wallTopAt = (x) => {
    const u = (x / w) * 2 - 1;
    return skyH + 4 + u * u * 56;
  };
  /* Stands: tiered rows of fans stepping down toward the wall, riding
     the wall's curve. A wave rolls through, and during a home run's
     camera shake the whole crowd is on its feet. */
  const crowdCols = theme.crowd;
  const tick = Math.floor(performance.now() / 350);
  const bigPlay = gShake && gShake.shakeUntil && performance.now() < gShake.shakeUntil + 1600;
  ctx.fillStyle = 'rgba(10,14,20,.55)';
  for (let x = 0; x < w; x += 4) ctx.fillRect(x, wallTopAt(x) - crowdH, 4, crowdH);
  /* Batter's eye: the dark hedge block behind dead center that every
     park has so hitters can pick up the ball. No fans sit there. */
  const eyeL = w * 0.44, eyeR = w * 0.56;
  ctx.fillStyle = '#10231a';
  for (let x = eyeL; x < eyeR; x += 4) ctx.fillRect(x, wallTopAt(x) - crowdH + 2, 4, crowdH - 2);
  for (let row = 0; row < 5; row++) {
    const sz = 3 + (row >= 3 ? 1 : 0);
    for (let x = 3 + (row % 2) * 3; x < w; x += 7) {
      if (x > eyeL - 4 && x < eyeR) continue;     /* the batter's eye */
      const v = (x * 7 + row * 13) % 10;
      if (v >= 9) continue;                       /* an empty seat */
      const y = wallTopAt(x) - 30 + row * 6;
      const wave = ((x * 31 + row * 17 + tick) % 41) < 2;
      const up = bigPlay || wave;
      ctx.fillStyle = up && (x + row) % 3 === 0 ? '#e8d8b0' : crowdCols[v % 5];
      ctx.fillRect(x, up ? y - 2 : y, sz, sz + (up ? 2 : 0));
    }
  }

  /* Outfield wall: padded panels with seams and the yellow home run
     line on top, column by column along the curve. */
  for (let x = 0; x < w; x += 4) {
    const wy = wallTopAt(x);
    ctx.fillStyle = theme.wall;
    ctx.fillRect(x, wy, 4, wallH);
    if (x % 46 < 4) {
      ctx.fillStyle = 'rgba(0,0,0,.22)';
      ctx.fillRect(x, wy + 2, 2, wallH - 2);
    }
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.fillRect(x, wy + wallH - 4, 4, 4);
    ctx.fillStyle = theme.wallLine;
    ctx.fillRect(x, wy, 4, 3);
    /* Warning track hugging the wall's foot. */
    ctx.fillStyle = theme.track;
    ctx.fillRect(x, wy + wallH, 4, trackH);
    ctx.fillStyle = 'rgba(0,0,0,.14)';
    ctx.fillRect(x, wy + wallH + trackH - 2, 4, 2);
  }
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const [dist, fx] of [['342', 0.14], ['408', 0.50], ['342', 0.86]]) {
    const my = wallTopAt(w * fx) + wallH / 2;
    ctx.fillStyle = 'rgba(0,0,0,.30)';
    ctx.beginPath(); ctx.arc(w * fx, my + 1, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = theme.marker;
    ctx.fillText(dist, w * fx, my + 2);
  }

  /* Outfield grass from the track's foot down, themed, with a vertical
     light-to-dark gradient so the field recedes rather than sitting
     flat. grassPath is reused to clip the mow pattern below. */
  const grassTopAt = (x) => wallTopAt(x) + wallH + trackH;
  const grassY = grassTopAt(w / 2);            /* shallowest point */
  const grassPath = () => {
    ctx.beginPath();
    ctx.moveTo(0, h);
    ctx.lineTo(0, grassTopAt(0));
    for (let x = 0; x <= w; x += 8) ctx.lineTo(x, grassTopAt(x));
    ctx.lineTo(w, h);
    ctx.closePath();
  };
  grassPath();
  ctx.fillStyle = theme.grass;
  ctx.fill();
  const gGrad = ctx.createLinearGradient(0, grassY, 0, h);
  gGrad.addColorStop(0, 'rgba(255,255,255,.08)');
  gGrad.addColorStop(0.5, 'rgba(0,0,0,0)');
  gGrad.addColorStop(1, 'rgba(0,0,0,.22)');
  grassPath();
  ctx.fillStyle = gGrad;
  ctx.fill();
  /* Light pools: each tower throws a soft warm wash onto the outfield
     below it, which is what stitches the lights at the top of the frame
     to the grass they are supposedly lighting. */
  for (const fx of [0.14, 0.86]) {
    const lx = w * fx, lyTop = grassTopAt(lx);
    const pool = ctx.createRadialGradient(lx, lyTop + 70, 8, lx, lyTop + 70, 190);
    pool.addColorStop(0, 'rgba(245,236,200,.07)');
    pool.addColorStop(1, 'rgba(245,236,200,0)');
    grassPath();
    ctx.fillStyle = pool;
    ctx.fill();
  }

  /* Home-plate camera. All of the diamond's numbers come from
     fieldGeom(), the single geometry the runner paths, ball flights and
     FX aim with, so the picture and the play can never disagree. */
  const G = fieldGeom();
  const { cx, rx, ry, plateY, midY, topY, moundY, cy, r } = G;

  /* Checkerboard mowing: arc bands radiating from home plate crossed
     with pie wedges from the same origin, which is the classic mowed
     checker seen from behind the plate. The alphas look timid in the
     code and are not: both layers stack where light meets light. */
  ctx.save();
  grassPath();
  ctx.clip();
  const bandW = (h - grassY) / 5.2;
  for (let band = 0; band < 8; band++) {
    const r0 = r * 0.55 + band * bandW;
    ctx.strokeStyle = band % 2 === 0 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.06)';
    ctx.lineWidth = bandW;
    ctx.beginPath();
    ctx.arc(cx, plateY, r0, Math.PI * 1.05, Math.PI * 1.95);
    ctx.stroke();
  }
  for (let wedge = 0; wedge < 8; wedge++) {
    if (wedge % 2) continue;
    const a0 = Math.PI * (1.05 + wedge * 0.1125);
    const a1 = a0 + Math.PI * 0.1125;
    ctx.fillStyle = 'rgba(255,255,255,.035)';
    ctx.beginPath();
    ctx.moveTo(cx, plateY);
    ctx.arc(cx, plateY, w, a0, a1);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  /* Grass speckle: deterministic hash dots, two tones, kept below the
     curved grass line. */
  for (let i = 0; i < 240; i++) {
    const sx = (i * 227 + 53) % w;
    const top = grassTopAt(sx);
    const sy = top + ((i * 157 + 31) % (h - top));
    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.045)' : 'rgba(0,0,0,.06)';
    ctx.fillRect(sx, sy, 2, 2);
  }

  const DIRT = '#8b5a24';
  const DIRT_DARK = '#6e451c';

  /* THE INFIELD. This is the shape that makes a baseball field read as a
     baseball field: straight dirt edges running along the foul lines
     from home past first and third, closed by the arc that bulges out
     behind second base. The previous version stroked a rounded loop
     through the bases, which is why the diamond looked like a circle. */
  const dirtOut = 26;                       /* dirt runs past the bases */
  const p1x = cx + rx + dirtOut, p3x = cx - rx - dirtOut;
  const pOutY = midY + dirtOut * 0.35;
  ctx.beginPath();
  ctx.moveTo(cx, plateY + 20);
  ctx.lineTo(p1x, pOutY);
  ctx.quadraticCurveTo(cx + rx * 0.72, topY - 40, cx, topY - 44);
  ctx.quadraticCurveTo(cx - rx * 0.72, topY - 40, p3x, pOutY);
  ctx.closePath();
  const dGrad = ctx.createLinearGradient(0, topY - 44, 0, plateY + 20);
  dGrad.addColorStop(0, DIRT_DARK);
  dGrad.addColorStop(0.55, DIRT);
  dGrad.addColorStop(1, '#9a6428');
  ctx.fillStyle = dGrad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.20)';
  ctx.lineWidth = 2;
  ctx.stroke();

  /* Grass interior: a straight edged diamond inset from the bases, so
     the dirt reads as basepaths with corners rather than a ring. */
  const inset = 30;
  ctx.beginPath();
  ctx.moveTo(cx, plateY - inset * 1.4);
  ctx.lineTo(cx + rx - inset * 1.7, midY);
  ctx.lineTo(cx, topY + inset);
  ctx.lineTo(cx - rx + inset * 1.7, midY);
  ctx.closePath();
  ctx.fillStyle = theme.grass;
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.10)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.18)';
  ctx.lineWidth = 2;
  ctx.stroke();
  /* Mow stripes across the infield grass: diagonal bands clipped to the
     diamond, the groundskeeper's touch that makes it read manicured. */
  ctx.save();
  ctx.clip();          /* the diamond path is still current */
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  for (let s = -6; s < 7; s += 2) {
    ctx.beginPath();
    ctx.moveTo(cx + s * 34, topY);
    ctx.lineTo(cx + (s + 1) * 34, topY);
    ctx.lineTo(cx + (s + 1) * 34 - 60, plateY);
    ctx.lineTo(cx + s * 34 - 60, plateY);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  /* Mound and home plate circle, as ground ellipses (a circle on the
     ground is an ellipse from this camera, another perspective tell). */
  const dirtOval = (x, y, ox, oy) => {
    const grd = ctx.createRadialGradient(x, y - oy * 0.4, 2, x, y, ox);
    grd.addColorStop(0, '#a06a30');
    grd.addColorStop(1, DIRT_DARK);
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.ellipse(x, y, ox, oy, 0, 0, Math.PI * 2); ctx.fill();
  };
  dirtOval(cx, moundY, 30, 15);
  dirtOval(cx, plateY, 40, 19);
  /* Dirt speckle on the mound and plate circles. */
  for (let i = 0; i < 60; i++) {
    const a = (i * 2.399963);   /* golden angle scatter */
    const rad = 26 * Math.sqrt((i % 30) / 30);
    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.08)';
    ctx.fillRect(cx + Math.cos(a) * rad, plateY + Math.sin(a) * rad * 0.45, 2, 2);
    ctx.fillRect(cx + Math.cos(a + 1) * rad * 0.8, moundY + Math.sin(a + 1) * rad * 0.4, 2, 2);
  }

  /* Foul lines: from the plate THROUGH first and third out to the wall,
     plus the short segments behind the plate. The originals only ran
     down off the bottom of the screen, so the field had no fair
     territory drawn on it at all. */
  const grassTop = grassY + 10;
  const foulTo = (bx, by) => {
    const t = (grassTop - plateY) / (by - plateY);
    return [cx + (bx - cx) * t, grassTop];
  };
  const [flx, fly] = foulTo(cx - rx, midY);
  const [frx, fry] = foulTo(cx + rx, midY);
  ctx.strokeStyle = 'rgba(234,234,234,.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, plateY); ctx.lineTo(flx, fly);
  ctx.moveTo(cx, plateY); ctx.lineTo(frx, fry);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(234,234,234,.85)';
  ctx.beginPath();
  ctx.moveTo(cx, plateY);
  ctx.lineTo(cx - w, plateY + w);   /* down-left */
  ctx.moveTo(cx, plateY);
  ctx.lineTo(cx + w, plateY + w);   /* down-right */
  ctx.stroke();
  /* No foul poles: with the wide camera both corners sit off frame, so
     the chalk lines exit the sides of the picture, as they should. */

  /* Batter's boxes: soft chalk, sized for the bigger plate area. */
  ctx.strokeStyle = 'rgba(255,255,255,.30)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(cx - 44, plateY - 12, 30, 36);
  ctx.strokeRect(cx + 14, plateY - 12, 30, 36);

  /* Bases: flattened diamonds (perspective again), second drawn a touch
     smaller because it is the farthest away. */
  const bases = [
    [cx + rx, midY],
    [cx, topY],
    [cx - rx, midY],
  ];
  bases.forEach(([bx, by], i) => {
    const s = i === 1 ? 8 : 10;
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath();
    ctx.moveTo(bx, by - s * 0.6 + 1); ctx.lineTo(bx + s, by + 1); ctx.lineTo(bx, by + s * 0.6 + 1); ctx.lineTo(bx - s, by + 1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#eaeaea';
    ctx.beginPath();
    ctx.moveTo(bx, by - s * 0.6); ctx.lineTo(bx + s, by); ctx.lineTo(bx, by + s * 0.6); ctx.lineTo(bx - s, by);
    ctx.closePath(); ctx.fill();
  });

  /* Home plate: pentagon */
  ctx.fillStyle = '#eaeaea';
  ctx.beginPath();
  ctx.moveTo(cx - 10, plateY);
  ctx.lineTo(cx + 10, plateY);
  ctx.lineTo(cx + 10, plateY + 6);
  ctx.lineTo(cx, plateY + 12);
  ctx.lineTo(cx - 10, plateY + 6);
  ctx.closePath();
  ctx.fill();

  /* Pitcher's rubber on the mound circle drawn above. */
  ctx.fillStyle = '#eaeaea';
  ctx.fillRect(cx - 9, moundY - 2, 18, 4);

  /* Fielders and defense are always drawn. The batter and base runners
     get drawn either statically at their bases (no active play) or as
     animated waypoints along their paths (a play is in flight). */
  const g = State.game;
  const field = G;

  if (g) {
    /* Catcher behind plate */
    /* (This once gated on catcher.pal, a field the old sprite system
       carried and the rewrite removed, so no catcher drew at all.) */
    const catcher = currentFieldingTeam().batters[8] || currentFieldingTeam().batters[1];
    if (catcher) drawRunner(ctx, cx + 18, plateY + 38, catcher, 2.3, 'back');
    /* On-deck circle: the next batter waits in it, bat on shoulder is
       implied by the back view. Gives the bottom corner life and tells
       the player who is up next without reading the log. */
    const bt2 = currentBattingTeam();
    const onDeck = bt2.batters[(bt2.idx + 1) % 9];
    if (onDeck) {
      const ox = cx - rx * 0.62, oy = plateY + 30;
      ctx.fillStyle = 'rgba(0,0,0,.18)';
      ctx.beginPath(); ctx.ellipse(ox, oy, 20, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(234,234,234,.25)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(ox, oy, 20, 9, 0, 0, Math.PI * 2); ctx.stroke();
      drawRunner(ctx, ox, oy + 2, onDeck, 2.2);
    }
    /* Pitcher on the mound: windup for the first 65% of the pitch's
       travel, release for the last 35%, then idle. */
    const pit = currentPitcher();
    let pitcherPose = null;
    if (pitch && !inWindup) {
      pitcherPose = t < 0.35 ? 'release' : null;
    } else if (pitch && inWindup) {
      pitcherPose = 'windup';
    }
    if (pit) drawRunner(ctx, cx, moundY - 6, pit, 2.6, pitcherPose);
    /* During the windup the ball shows raised at the pitcher's hand, so
       the eye is already on the spot the pitch will leave from. */
    if (pitch && inWindup) drawBaseball(ctx, cx + 10, moundY - 58);
    /* Fielder cluster, on the foreshortened diamond. Depth scaling:
       outfielders are FARTHER away, so they draw smaller than the
       infield corners, which is what sells the camera angle. */
    const fs = currentFieldingTeam().batters;
    if (fs[2]) drawRunner(ctx, cx - rx*0.42, midY - ry*0.52, fs[2], 2.45);
    if (fs[3]) drawRunner(ctx, cx + rx*0.42, midY - ry*0.52, fs[3], 2.45);
    if (fs[4]) drawRunner(ctx, cx + rx*0.90, midY + 24, fs[4], 2.6);
    if (fs[5]) drawRunner(ctx, cx - rx*0.90, midY + 24, fs[5], 2.6);
    if (fs[6]) drawRunner(ctx, cx - w*0.33, topY - 48, fs[6], 2.15);
    if (fs[7]) drawRunner(ctx, cx,           topY - 74, fs[7], 2.05);
    if (fs[1]) drawRunner(ctx, cx + w*0.33, topY - 48, fs[1], 2.15);

    if (g.play) {
      /* A contact play is animating. Draw the pre-play runners along
         their paths, and the batter as another runner along their own
         path. The bases themselves are only rewritten when the play's
         apply timer fires. */
      const p = g.play;
      const now = performance.now();
      const rt = clamp((now - p.runnerStart) / (p.runnerUntil - p.runnerStart), 0, 1);
      const beatAB = Math.floor(now / 130) % 2 === 0;
      /* A runner moving up the screen is running away from the camera,
         so they get the back frames. Sampled from the path itself. */
      const runFrameFor = (path, t) => {
        const [, y0] = pathPointAt(field, path, Math.max(0, t - 0.04));
        const [, y1] = pathPointAt(field, path, Math.min(1, t + 0.04));
        const away = y1 < y0 - 0.5;
        return away ? (beatAB ? 'back-run-a' : 'back-run-b')
                    : (beatAB ? 'run-a' : 'run-b');
      };
      p.preBases.forEach((runner, i) => {
        if (!runner || !p.runnerPaths[i]) return;
        const [wx, wy] = pathPointAt(field, p.runnerPaths[i], rt);
        drawRunner(ctx, wx, wy - 4, runner, 2.6,
                   rt > 0 && rt < 1 ? runFrameFor(p.runnerPaths[i], rt) : null);
      });
      /* Batter as runner: starts moving at the same time as the ball is */
      const bt = clamp((now - p.startedAt) / Math.max(300, p.ball.duration - 100), 0, 1);
      const [bx, by] = pathPointAt(field, p.batterPath, bt);
      drawRunner(ctx, bx, by - 4, p.batter, 3,
                 bt > 0.05 && bt < 0.98 ? runFrameFor(p.batterPath, bt) : null);
      /* Bat swing arc, first 240ms of the play */
      if (now < p.swingUntil) {
        const st = clamp((now - p.startedAt) / (p.swingUntil - p.startedAt), 0, 1);
        drawBatSwing(ctx, cx - 28, plateY + 4, st);
      }
      /* Ball trajectory: plate to landing spot, with a ground shadow so
         the arc height reads. */
      if (now < p.ballUntil) {
        const bt2 = clamp((now - p.startedAt) / p.ball.duration, 0, 1);
        /* Batted balls leave from the bat's contact point, just off the
           batter's box, not from the middle of the plate. */
        const startX = cx - 14, startY = plateY - 4;
        const endX = startX + p.ball.dx * r;
        const endY = cy + p.ball.dy * r;
        const arc = 4 * p.ball.arcH * bt2 * (1 - bt2);
        const bxx = startX + (endX - startX) * bt2;
        const byy = startY + (endY - startY) * bt2 - arc;
        /* Ground level for the shadow: the ball's own linear path (no arc). */
        const gy = startY + (endY - startY) * bt2;
        drawBaseball(ctx, bxx, byy, gy);
      }
    } else {
      /* No play in flight: runners are static on their bases, batter
         stands in the batter's box. */
      const bs = g.bases;
      if (bs[0]) drawRunner(ctx, bases[0][0], bases[0][1] - 6, bs[0], 2.6);
      if (bs[1]) drawRunner(ctx, bases[1][0], bases[1][1] - 6, bs[1], 2.45);
      if (bs[2]) drawRunner(ctx, bases[2][0], bases[2][1] - 6, bs[2], 2.6);
      const batter = currentBatter();
      if (batter) drawRunner(ctx, cx - 28, plateY + 6, batter, 3.2, 'batting');
    }
  }

  /* Pitch ball moving from mound to plate. Only when no contact-play is
     in flight (so the ball isn't drawn twice).

     TIMING CONTRACT: the ball must ARRIVE AT THE PLATE exactly when the
     meter cursor crosses the pitch's ideal spot, so swinging when the
     ball reaches the hitter is the same thing as swinging in the green
     zone. The meter runs 0..1 over the pitch duration; the ball's own
     travel is therefore remapped to finish at t = ideal. Past that
     point the ball sits in the catcher's mitt. */
  if (pitch && !inWindup && !(g && g.play)) {
    const bx = cx;
    const by = moundY - 22;    /* release point, out of the pitcher's hand */
    const px = cx;
    const py = plateY - 8;
    const arrive = Math.max(0.22, pitch.ideal);
    let e = clamp(t / arrive, 0, 1);
    /* Per-pitch flight character: fastball rides straight and hard, the
       curveball bends late and big, the changeup floats then dies. */
    if (pitch.pt === 'changeup') e = Math.pow(e, 1.45);
    let ballX = bx + (px - bx) * e;
    let ballY = by + (py - by) * e;
    if (pitch.pt === 'curveball') {
      /* Late break: barely moves early, sweeps hard in the last third. */
      const bend = Math.pow(e, 2.2) * Math.sin(e * Math.PI);
      ballX += bend * 34 * (pitch.ideal < 0.5 ? -1 : 1);
    } else if (pitch.pt === 'screwball') {
      /* The curveball's mirror: it breaks the other way. */
      const bend = Math.pow(e, 2.2) * Math.sin(e * Math.PI);
      ballX -= bend * 34 * (pitch.ideal < 0.5 ? -1 : 1);
    } else if (pitch.pt === 'changeup') {
      /* Small fade plus a visible dip at the end. */
      ballX += Math.sin(e * Math.PI) * 8;
      ballY += Math.pow(e, 3) * 10;
    } else if (pitch.pt === 'slowball') {
      /* Floats up on a rainbow, drops in lazily. */
      ballY -= Math.sin(e * Math.PI) * 14;
    } else if (pitch.pt === 'knuckler') {
      /* It flutters. Even the pitcher does not know. */
      ballX += Math.sin(e * 17) * 4 + Math.sin(e * 7) * 3;
      ballY += Math.sin(e * 11) * 2;
    }
    /* Trail: three ghosts behind the ball so speed reads. */
    for (let gi = 1; gi <= 3; gi++) {
      const ge = clamp(e - gi * 0.05, 0, 1);
      const gx = bx + (px - bx) * ge;
      let gyy = by + (py - by) * ge;
      ctx.fillStyle = `rgba(255,255,255,${0.22 - gi * 0.06})`;
      ctx.beginPath(); ctx.arc(gx, gyy, 4 - gi, 0, Math.PI*2); ctx.fill();
    }
    drawBaseball(ctx, ballX, ballY);
  }
  if (pitch && !(g && g.play)) {
    drawTimingRing(ctx, G, t, pitch, inWindup);
  }

  /* Instant replay: re-runs the stored highlight's flight over the live
     field, with a broadcast style badge. Purely cosmetic; it reads no
     game state and changes none. */
  if (g && g.replay) {
    const R = g.replay;
    const now = performance.now();
    const rt = clamp((now - R.startedAt) / R.h.ball.duration, 0, 1);
    /* Dim the field slightly so the replay reads as a cutaway. */
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.fillRect(0, 0, w, h);
    if (rt < 1) {
      const startX = cx - 14, startY = plateY - 4;
      const endX = startX + R.h.ball.dx * r;
      const endY = cy + R.h.ball.dy * r;
      const arc = 4 * R.h.ball.arcH * rt * (1 - rt);
      /* Trailing arc so the whole flight path is visible at once. */
      ctx.strokeStyle = 'rgba(244,194,90,.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i <= 40; i++) {
        const e = (i / 40) * rt;
        const px2 = startX + (endX - startX) * e;
        const py2 = startY + (endY - startY) * e - 4 * R.h.ball.arcH * e * (1 - e);
        if (i === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
      }
      ctx.stroke();
      drawBaseball(ctx, startX + (endX - startX) * rt, startY + (endY - startY) * rt - arc);
    }
    /* Badge */
    const blink = Math.floor(now / 400) % 2 === 0;
    ctx.fillStyle = blink ? '#c94b1a' : '#8a2b10';
    ctx.fillRect(cx - 92, 30, 184, 30);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('REPLAY', cx, 45);
    ctx.fillStyle = '#f4c25a';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(`${R.h.batterName} · ${R.h.kind.toUpperCase()}`, cx, 74);
  }

  /* Signature moment overlays: character-specific spectacle that lands
     on top of the field during a big at bat. Each one runs for its
     own window and clears itself. */
  if (g && g.signature) {
    const sig = g.signature;
    const now = performance.now();
    if (now < sig.until) {
      const rem = (sig.until - now) / 1600;
      const alpha = clamp(rem * 1.4, 0, 1);
      if (sig.kind === 'chest') {
        /* KONG chest beat: darken the field, thump text scales in. */
        ctx.fillStyle = `rgba(0,0,0,${0.35 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = `bold ${Math.floor(84 - rem * 30)}px monospace`;
        ctx.fillStyle = `rgba(255,220,140,${alpha})`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('THUMP!', cx, cy - 40);
        ctx.font = 'bold 36px monospace';
        ctx.fillText('THUMP!', cx + 90, cy + 40);
      } else if (sig.kind === 'bats') {
        /* DRACULA bat swarm: scattered black bats fluttering across. */
        for (let i = 0; i < 22; i++) {
          const off = (i * 137 + Math.floor(now / 30)) % 360;
          const bx = ((off * 3) % w);
          const by = ((off * 5) % h);
          ctx.fillStyle = `rgba(20,10,20,${alpha})`;
          ctx.fillRect(bx, by, 6, 2);
          ctx.fillRect(bx - 3, by + 2, 12, 2);
        }
        ctx.font = 'bold 40px serif';
        ctx.fillStyle = `rgba(196,50,50,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('~ NIGHT FALLS ~', cx, cy - 60);
      } else if (sig.kind === 'flex') {
        /* FRANKY flex: green flash + bolts */
        ctx.fillStyle = `rgba(126,168,106,${0.28 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = 'bold 48px monospace';
        ctx.fillStyle = `rgba(201,162,86,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('IT LIVES', cx, cy - 20);
      } else if (sig.kind === 'anchor') {
        /* POPEYE anchor: forearm silhouette + horn */
        ctx.fillStyle = `rgba(198,57,44,${0.22 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = 'bold 44px monospace';
        ctx.fillStyle = `rgba(255,235,180,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('AH-GA-GA-GA-GA!', cx, cy - 20);
      } else if (sig.kind === 'arrow') {
        /* ROBIN HOOD arrow zips across the field. */
        const p = 1 - rem;
        const ax = w * p;
        const ay = cy - 30 + Math.sin(p * Math.PI) * 40;
        ctx.strokeStyle = `rgba(244,194,90,${alpha})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(ax - 40, ay); ctx.lineTo(ax, ay); ctx.stroke();
        ctx.fillStyle = `rgba(90,50,20,${alpha})`;
        ctx.fillRect(ax, ay - 3, 6, 6);
        ctx.font = 'bold 32px serif';
        ctx.fillStyle = `rgba(90,140,80,${alpha})`;
        ctx.fillText('BULLSEYE', cx, cy - 60);
      } else if (sig.kind === 'flies') {
        /* PETER PAN takes off */
        const p = 1 - rem;
        ctx.font = 'bold 40px monospace';
        ctx.fillStyle = `rgba(244,194,90,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('FLIES AWAY', cx, cy - 80 - p * 60);
        /* Fairy dust trail */
        for (let i = 0; i < 20; i++) {
          const dx = cx + (Math.random() - 0.5) * 120;
          const dy = cy - p * 100 + Math.random() * 60;
          ctx.fillStyle = `rgba(244,194,90,${alpha * Math.random()})`;
          ctx.fillRect(dx, dy, 2, 2);
        }
      } else if (sig.kind === 'gallop') {
        /* CENTAUR gallops with motion lines */
        ctx.strokeStyle = `rgba(240,220,180,${alpha * 0.7})`;
        ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          const y = cy + (i - 3) * 8;
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w * (1 - rem), y); ctx.stroke();
        }
        ctx.font = 'bold 36px monospace';
        ctx.fillStyle = `rgba(240,220,180,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('THUNDERING HOOVES', cx, cy - 50);
      } else if (sig.kind === 'drain') {
        /* CHUPACABRA drains: violet-green haze */
        ctx.fillStyle = `rgba(90,180,120,${0.28 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = 'bold 40px monospace';
        ctx.fillStyle = `rgba(244,220,90,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('DRAINED', cx, cy - 20);
      } else if (sig.kind === 'snarl') {
        /* RABID DOG snarl: quick red streaks */
        for (let i = 0; i < 12; i++) {
          const rx = Math.random() * w;
          const ry = Math.random() * h;
          ctx.fillStyle = `rgba(201,75,26,${alpha * 0.35})`;
          ctx.fillRect(rx, ry, 40, 2);
        }
        ctx.font = 'bold 36px monospace';
        ctx.fillStyle = `rgba(201,75,26,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('SNARL!', cx, cy - 20);
      } else if (sig.kind === 'sleigh') {
        /* SANTA sleigh across the sky */
        const p = 1 - rem;
        const sx = w * (1 - p);
        ctx.fillStyle = `rgba(201,48,48,${alpha})`;
        ctx.fillRect(sx, 40, 30, 8);
        ctx.fillStyle = `rgba(240,220,180,${alpha})`;
        ctx.fillRect(sx - 8, 44, 40, 2);
        ctx.font = 'bold 32px serif';
        ctx.fillStyle = `rgba(201,48,48,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('HO HO HO', cx, cy - 40);
      } else if (sig.kind === 'torch') {
        /* LADY LIBERTY torch flash */
        ctx.fillStyle = `rgba(244,194,90,${0.25 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = 'bold 40px serif';
        ctx.fillStyle = `rgba(109,184,162,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('LIBERTY LEVELED', cx, cy - 20);
      }
    } else {
      g.signature = null;
    }
  }

  /* Catch minigame overlay: appears when a fly ball is coming down toward
     an outfielder. A small ring shrinks around the landing spot; nail
     the tightest ring for a catch. */
  if (g && g.play && g.play.catchActive && g.play.catchWindow) {
    const cw = g.play.catchWindow;
    const now = performance.now();
    const t = clamp((now - cw.startedAt) / cw.duration, 0, 1);
    const [lx, ly] = [cw.landingX, cw.landingY];
    /* Green target ring: shrinks as t moves through the middle, widens
       past the sweet spot. Radius drives visual read of when to click. */
    const shrink = 1 - 4 * Math.abs(t - 0.5) * (1 - Math.abs(t - 0.5));
    const rBig = 46;
    const rSmall = 12;
    const rNow = rSmall + (rBig - rSmall) * shrink;
    ctx.strokeStyle = '#5bb083';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(lx, ly, rNow, 0, Math.PI * 2); ctx.stroke();
    /* Inner sweet ring */
    ctx.strokeStyle = 'rgba(244,194,90,.9)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(lx, ly, rSmall, 0, Math.PI * 2); ctx.stroke();
    /* Label */
    ctx.fillStyle = '#f4c25a';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('CATCH IT!', lx, ly - rBig - 12);
    ctx.fillText('SPACE / CLICK', lx, ly + rBig + 12);
  }

  /* Throw minigame overlay: appears when a grounder is in the field and
     the player has a window to complete the throw. */
  if (g && g.play && g.play.throwActive && g.play.throwWindow) {
    const win = g.play.throwWindow;
    const now = performance.now();
    const t = clamp((now - win.startedAt) / win.duration, 0, 1);
    const barW = w * 0.5;
    const barX = cx - barW/2;
    const barY = h * 0.90;
    const barH = 22;
    /* Background */
    ctx.fillStyle = 'rgba(11,16,21,.92)';
    ctx.fillRect(barX - 6, barY - 6, barW + 12, barH + 34);
    /* Yellow zone */
    ctx.fillStyle = 'rgba(244,194,90,.36)';
    ctx.fillRect(barX + (win.ideal - win.yellowHalf) * barW, barY,
                 win.yellowHalf * 2 * barW, barH);
    /* Green zone */
    ctx.fillStyle = 'rgba(91,176,131,.72)';
    ctx.fillRect(barX + (win.ideal - win.greenHalf) * barW, barY,
                 win.greenHalf * 2 * barW, barH);
    /* Cursor */
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(barX + t * barW - 2, barY - 3, 4, barH + 6);
    /* Label */
    ctx.fillStyle = '#f4c25a';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('THROW TO FIRST · SPACE OR CLICK', cx, barY + barH + 12);
  }

  /* Pitcher fatigue chip in the top strip so a player can see it. */
  if (g && !g.play) {
    const fat = pitcherFatigue();
    if (fat.level > 0) {
      const label = fat.level >= 3 ? 'GASSED' : fat.level === 2 ? 'TIRING' : 'WARM';
      const color = fat.level >= 3 ? '#c94b1a' : fat.level === 2 ? '#e3b04c' : '#5bb083';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = color;
      ctx.fillText(label, cx, cy - 26);
    }
  }

  /* Particles fire on top of everything. */
  if (g) updateAndDrawFx(ctx, g);

  /* Soft vignette: darkens the corners so the diamond glows in the
     middle, same framing trick the golf tracer uses. */
  const vg = ctx.createRadialGradient(cx, cy, r * 0.8, cx, cy, w * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.30)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, w, h);

  ctx.restore();
}

function drawBaseball(ctx, x, y, groundY) {
  /* Optional ground shadow: pass the y of the ground plane and we drop a
     small shadow there, so a high arc reads as high. */
  let rad = 5;
  if (typeof groundY === 'number') {
    const drop = Math.max(0, groundY - y);
    const alpha = clamp(0.35 - drop * 0.0015, 0.05, 0.35);
    const rx = 5 + drop * 0.02;
    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
    ctx.beginPath();
    ctx.ellipse(x, groundY, rx, 2, 0, 0, Math.PI * 2);
    ctx.fill();
    /* The ball swells as it climbs toward the camera: a pop fly at its
       peak is nearer the viewer than the grass under it, and the size
       change is what makes the arc read as UP rather than away. */
    rad = 5 + Math.min(4, drop * 0.022);
  }
  ctx.fillStyle = '#eaeaea';
  ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#c94b1a';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, rad - 1, -Math.PI*0.2, Math.PI*0.3); ctx.stroke();
}

function drawBatSwing(ctx, x, y, t) {
  /* A wooden bat sweeping horizontally at the plate. t goes 0 to 1 over
     the swing window, so the bat rotates from behind the batter to in
     front. */
  const cx = x + 6, cy = y - 12;
  const angle = -Math.PI * 0.6 + Math.PI * 1.2 * t;
  const len = 22;
  const bx = cx + Math.cos(angle) * len;
  const by = cy + Math.sin(angle) * len;
  ctx.strokeStyle = '#8b6a3a';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(bx, by); ctx.stroke();
  ctx.strokeStyle = '#5a3a1c';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(angle) * 6, cy + Math.sin(angle) * 6); ctx.stroke();
}


const runnerCache = new Map();
function drawRunner(ctx, x, y, character, scale, pose) {
  scale = scale || 3;
  const hero = hasHero(character.k);

  /* Hero characters use their own animated frames on the field. The run
     poses drive the run cycle; everything else shows the idle frame with
     a gentle bob. */
  if (hero) {
    /* The camera stands behind home plate, so anything facing the
       pitcher shows the viewer its back: the batter in the box, the
       catcher, and any runner whose path is carrying them up-screen. */
    let frame = 'idle';
    if (pose === 'run-a') frame = 'run1';
    else if (pose === 'run-b') frame = 'run2';
    else if (pose === 'batting' || pose === 'back') frame = 'back';
    else if (pose === 'back-run-a') frame = 'backrun1';
    else if (pose === 'back-run-b') frame = 'backrun2';
    const hkey = character.k + '@h' + scale + frame;
    let hcv = runnerCache.get(hkey);
    if (!hcv) { hcv = heroSpriteCanvas(character.k, Math.round(HERO_W * scale * 0.9), frame); runnerCache.set(hkey, hcv); }
    /* Ground shadow */
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath();
    ctx.ellipse(x, y + 1, hcv.width * 0.34, hcv.width * 0.10, 0, 0, Math.PI * 2);
    ctx.fill();
    /* Idle bob when standing still */
    let dy = 0;
    if (pose == null || pose === 'batting' || pose === 'back') {
      dy = Math.floor(((performance.now() / 420) + (character.k.charCodeAt(0) % 5) * 0.2) % 2) === 0 ? 0 : -1;
    }
    ctx.drawImage(hcv, Math.round(x - hcv.width/2), Math.round(y - hcv.height + dy));
    /* A batter waits with the bat UP. The swing arc only exists for the
       240ms of contact, so without this the player at the plate stood
       empty handed all at bat, which no baseball game survives. */
    if (pose === 'batting') {
      const bl = hcv.width * 0.58;
      ctx.save();
      ctx.translate(x + hcv.width * 0.30, y - hcv.height * 0.55 + dy);
      ctx.rotate(-0.75);
      ctx.fillStyle = '#6b4a24';                       /* grip */
      ctx.fillRect(-1.5, 0, 3, -bl * 0.35);
      ctx.fillStyle = '#a97f46';                       /* barrel */
      ctx.fillRect(-2.5, -bl * 0.30, 5, -bl * 0.62);
      ctx.fillStyle = '#c9a06a';                       /* barrel light edge */
      ctx.fillRect(-2.5, -bl * 0.30, 2, -bl * 0.62);
      ctx.restore();
    }
    return;
  }

}

/* The timing read lives ON THE FIELD now: a ring that shrinks onto a
   green target circle at the contact point as the pitch flies in. The
   ball arrives exactly when the ring closes on the target, so watching
   the ball and watching the ring are the same act, which is the whole
   Backyard trick the old bottom bar never managed. */
function drawTimingRing(ctx, G, t, pitch, inWindup) {
  /* Centered where the pitch actually arrives, sized to read from a
     couch: the first cut was 62px on the batter's knee and vanished. */
  const cxp = G.cx - 2, cyp = G.plateY - 8;
  const R0 = 84;
  const diff = DIFF[State.difficulty];
  let half = diff.sweetWidth / 2;
  const mode = (State.game && State.game.swingMode) || 'contact';
  if (playerIsBatting()) {
    if (mode === 'contact') half *= 1.25;
    if (mode === 'power') half *= 0.75;
    if (mode === 'bunt') half = 0.30;
  }
  const sweetR = Math.max(17, R0 * Math.min(0.55, half / pitch.ideal));
  const foulR = Math.min(R0 - 6, sweetR * 1.7);
  const ring = (r, color, wdt) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = wdt;
    ctx.beginPath();
    ctx.ellipse(cxp, cyp, r, r * 0.62, 0, 0, Math.PI * 2);
    ctx.stroke();
  };
  /* The target: yellow ok band, green sweet circle. */
  ctx.fillStyle = 'rgba(244,194,90,.22)';
  ctx.beginPath(); ctx.ellipse(cxp, cyp, foulR, foulR * 0.62, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(91,176,131,.45)';
  ctx.beginPath(); ctx.ellipse(cxp, cyp, sweetR, sweetR * 0.62, 0, 0, Math.PI * 2); ctx.fill();
  ring(sweetR, 'rgba(140,235,175,.95)', 3);
  if (inWindup) {
    /* Windup: the full ring pulses in place, showing where the swing
       window will start from. */
    const pulse = 0.35 + 0.3 * Math.sin(performance.now() / 140);
    ring(R0, `rgba(234,234,238,${pulse})`, 2);
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('GET READY', cxp, cyp - R0 * 0.62 - 12);
    return;
  }
  const rel = (pitch.ideal - t) / pitch.ideal;
  if (rel > 0) {
    /* Inbound: the white ring closes on the target with the pitch. */
    const r = sweetR + (R0 - sweetR) * rel;
    ring(r + 1, 'rgba(20,16,24,.55)', 4);
    ring(r, r < foulR ? '#f4c25a' : '#eaeaee', 3);
  } else if (t - pitch.ideal <= half) {
    /* In the sweet window past center: the target flashes hot. */
    const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 60);
    ring(sweetR, `rgba(140,240,180,${pulse})`, 3);
  }
}

/* ============================================================================
   HUD
   ============================================================================ */
function renderGame() {
  const g = State.game;
  const s = el('div','screen');

  /* Line score above the field, real ballpark style. */
  const ls = el('div','linescore');
  ls.id = 'linescore';
  renderLineScore(ls);
  s.appendChild(ls);

  const arena = el('div','arena');
