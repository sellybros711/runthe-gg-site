<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Run The All-Stars</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0b1015" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1015'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle'%3E%E2%9A%BE%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --ink:#0b1015;
    --panel:#141c24;
    --panel-2:#1c2732;
    --line:rgba(255,255,255,.10);
    --text:#f3ecdc;
    --text-dim:#a89d86;
    --gold:#f4c25a;
    --red:#d24949;
    --green:#5bb083;
    --blue:#6aa7c4;
    --purple:#b08ac6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text);
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    min-height:100vh;overscroll-behavior-y:none;}
  body{
    background:
      radial-gradient(900px 500px at 50% 0%, rgba(91,176,131,.09), transparent 60%),
      radial-gradient(700px 500px at 50% 110%, rgba(244,194,90,.05), transparent 66%),
      var(--ink);
  }
  img.pico{image-rendering:pixelated;image-rendering:crisp-edges;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;}

  .wrap{max-width:920px;margin:0 auto;padding:14px 14px 60px;}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 0 14px;border-bottom:1px solid var(--line);}
  .brand h1{margin:0;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
  .brand .tag{color:var(--text-dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;}
  .brand .spacer{flex:1;}
  .brand button{background:transparent;color:var(--text-dim);border:1px solid var(--line);
    padding:6px 10px;font-family:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    cursor:pointer;border-radius:4px;margin-left:6px;}
  .brand button:hover{color:var(--text);border-color:var(--gold);}

  .screen{padding:18px 0;}
  h2{margin:0 0 12px;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
  h3{margin:14px 0 6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);}
  p{margin:0 0 10px;color:var(--text-dim);line-height:1.5;font-size:13px;}

  .btn{display:inline-block;background:var(--gold);color:#1a1108;border:0;padding:10px 16px;
    font-family:inherit;font-size:13px;letter-spacing:.12em;text-transform:uppercase;
    cursor:pointer;border-radius:4px;font-weight:700;}
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--gold);color:var(--gold);}
  .btn.red{background:var(--red);color:#fff;}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;}
  .card + .card{margin-top:12px;}

  .roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;}
  .charcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;
    cursor:pointer;transition:border-color .1s,transform .1s;text-align:center;position:relative;}
  .charcard:hover{border-color:var(--gold);}
  .charcard.picked{border-color:var(--gold);background:var(--panel-2);}
  .charcard canvas{width:64px;height:auto;background:#0c1218;border-radius:4px;image-rendering:pixelated;}
  .charcard .name{margin-top:6px;font-size:12px;color:var(--text);letter-spacing:.06em;}
  .charcard .role{font-size:10px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;}
  .charcard .pickno{position:absolute;top:6px;right:6px;background:var(--gold);color:#1a1108;
    font-size:10px;padding:2px 5px;border-radius:3px;font-weight:700;}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px;font-size:10px;color:var(--text-dim);}
  .statgrid span b{color:var(--text);}
  .quirk{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:10px;color:var(--purple);line-height:1.4;}
  .charcard.locked{opacity:.55;cursor:not-allowed;}
  .charcard.locked canvas{filter:grayscale(1) brightness(.7);}
  .charcard.locked:hover{border-color:var(--line);}
  .quirk.lockhint{color:var(--gold);}

  .toggle-row{display:flex;gap:6px;flex-wrap:wrap;}
  .toggle{padding:8px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;
    cursor:pointer;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);}
  .toggle.on{border-color:var(--gold);color:var(--gold);}

  /* Game.
     The field takes as much room as possible and the meter, HUD, and stat
     rail sit around it. On desktop the field is a wide inset panel that
     centers the diamond; on mobile it stacks. A single callout overlay
     hangs above the field for hit and inning events (READY, STRIKE, HOME
     RUN, and so on). */

  .arena{
    position:relative;
    background:radial-gradient(700px 400px at 50% 30%, #17301f, #08110a 68%);
    border:1px solid var(--line);
    border-radius:8px;
    padding:0;
    overflow:hidden;
    margin-bottom:12px;
  }
  #field{
    display:block;
    width:100%;
    aspect-ratio:16/11;
    max-height:min(72vh, 720px);
    background:transparent;
  }
  .arena .corner{position:absolute;pointer-events:none;padding:10px 14px;
    font-family:inherit;text-transform:uppercase;letter-spacing:.14em;font-size:12px;
    color:var(--text-dim);text-shadow:0 1px 2px rgba(0,0,0,.7);}
  .arena .corner.tl{top:0;left:0;text-align:left;}
  .arena .corner.tr{top:0;right:0;text-align:right;}
  .arena .corner.bl{bottom:0;left:0;text-align:left;}
  .arena .corner.br{bottom:0;right:0;text-align:right;}
  .arena .corner .lbl{display:block;color:var(--text-dim);font-size:10px;letter-spacing:.16em;}
  .arena .corner .val{color:var(--text);font-size:20px;font-weight:700;line-height:1;}
  .arena .corner .val.gold{color:var(--gold);}
  .arena .corner.br .val{color:var(--text);font-size:14px;}

  .callout{
    position:absolute;
    top:38%;
    left:50%;
    transform:translate(-50%,-50%) scale(.9);
    padding:14px 30px;
    background:rgba(11,16,21,.86);
    border:2px solid var(--gold);
    border-radius:6px;
    color:var(--gold);
    font-family:inherit;
    font-size:26px;
    font-weight:900;
    letter-spacing:.16em;
    text-transform:uppercase;
    text-shadow:0 2px 0 rgba(0,0,0,.5);
    pointer-events:none;
    opacity:0;
    transition:opacity .18s ease-out, transform .28s cubic-bezier(.2,.9,.2,1.2);
    box-shadow:0 8px 32px rgba(0,0,0,.5);
    white-space:nowrap;
    z-index:6;
  }
  .callout.on{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .callout.homer{border-color:var(--gold);color:var(--gold);font-size:32px;
    background:linear-gradient(180deg,rgba(60,30,10,.9),rgba(11,16,21,.9));}
  .callout.hit{border-color:var(--green);color:var(--green);}
  .callout.strike{border-color:var(--red);color:#f4a4a4;}
  .callout.ball{border-color:var(--blue);color:var(--blue);}
  .callout.sub{border-color:var(--text-dim);color:var(--text);font-size:18px;background:rgba(11,16,21,.7);}

  @media (max-width:600px){
    .callout{font-size:18px;padding:10px 18px;}
    .callout.homer{font-size:22px;}
    .arena .corner{padding:6px 8px;font-size:10px;}
    .arena .corner .val{font-size:16px;}
    .arena .corner.br .val{font-size:11px;}
  }

  .plate-row{
    display:grid;grid-template-columns:1fr;gap:10px;align-items:stretch;
  }
  .meter-wrap{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;}
  .meter-wrap .label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);
    letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
  .meter-wrap .label b.pt{color:var(--gold);letter-spacing:.14em;}
  #meter{width:100%;height:44px;display:block;background:#0c1218;border-radius:3px;}
  .meter-wrap .hint{margin-top:6px;font-size:11px;color:var(--text-dim);
    letter-spacing:.08em;text-align:center;text-transform:uppercase;}
  .meter-wrap .hint b{color:var(--gold);}
  .pitch-select{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap;
    justify-content:center;}
  .pitch-select .lbl{color:var(--gold);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    display:block;margin-bottom:4px;text-align:center;}
  .pitch-select .btn{padding:8px 12px;font-size:11px;letter-spacing:.14em;}
  .pitch-select .col{display:flex;flex-direction:column;gap:4px;align-items:center;}
  .pitch-select .type-row{display:flex;gap:6px;}
  .zone-grid{display:grid;grid-template-columns:repeat(3,32px);grid-template-rows:repeat(3,32px);
    gap:2px;background:rgba(255,255,255,.06);padding:3px;border:1px solid var(--line);
    border-radius:4px;}
  .zone-grid button{background:rgba(11,16,21,.6);border:1px solid rgba(255,255,255,.10);
    cursor:pointer;padding:0;transition:background .1s;}
  .zone-grid button:hover{background:rgba(244,194,90,.35);border-color:var(--gold);}
  .zone-grid button.corner{background:rgba(11,16,21,.85);}
  .zone-grid button.mid{background:rgba(91,176,131,.15);}
  .zone-grid button.center{background:rgba(91,176,131,.30);}
  .zone-grid button.selected{background:var(--gold);border-color:var(--gold);}
  .swing-btn{display:none;width:100%;margin-top:10px;padding:16px;font-size:16px;
    background:var(--gold);color:#1a1108;border:0;border-radius:6px;font-weight:900;
    letter-spacing:.28em;cursor:pointer;font-family:inherit;text-transform:uppercase;}
  .swing-btn:active{transform:translateY(1px);filter:brightness(1.06);}
  @media (max-width:900px){.swing-btn{display:block;}}

  .atbat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;
    display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .atbat .avatar{width:36px;height:auto;image-rendering:pixelated;}
  .atbat .who{font-size:14px;letter-spacing:.06em;}
  .atbat .who b{color:var(--gold);}
  .atbat .vs{font-size:11px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
  .atbat .count{margin-left:auto;font-size:16px;color:var(--text);letter-spacing:.14em;font-weight:700;}

  .log{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;
    max-height:110px;overflow-y:auto;font-size:12px;line-height:1.6;color:var(--text-dim);}
  .log .line{padding:1px 0;}
  .log .line.big{color:var(--gold);font-weight:700;letter-spacing:.05em;}

  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

  /* Line score: the classic ballpark board, one column per inning plus runs. */
  .linescore{display:flex;justify-content:center;margin-bottom:10px;overflow-x:auto;}
  .linescore table{border-collapse:collapse;background:var(--panel);border:1px solid var(--line);
    border-radius:6px;overflow:hidden;font-size:13px;}
  .linescore th,.linescore td{padding:4px 9px;text-align:center;
    font-variant-numeric:tabular-nums;border-left:1px solid var(--line);}
  .linescore th{color:var(--text-dim);font-weight:500;font-size:10px;letter-spacing:.1em;}
  .linescore td.team{text-align:left;color:var(--text-dim);letter-spacing:.08em;
    text-transform:uppercase;font-size:10px;border-left:0;white-space:nowrap;}
  .linescore td.r{color:var(--gold);font-weight:700;}
  .linescore td.cur{background:rgba(244,194,90,.14);}

  /* Result / hub */
  .table{width:100%;border-collapse:collapse;font-size:13px;}
  .table th,.table td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);}
  .table th{color:var(--text-dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;}
  .table tr.you td{color:var(--gold);}
  .table td.n{text-align:right;font-variant-numeric:tabular-nums;}

  .bracket{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;}
  .bracket .col{display:flex;flex-direction:column;gap:10px;}
  .bracket .match{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;}
  .bracket .match .row{display:flex;justify-content:space-between;padding:2px 0;}
  .bracket .match .row.win{color:var(--gold);}
  .bracket .match .row.you{font-weight:700;}
  .bracket .arrow{color:var(--text-dim);font-size:18px;text-align:center;}

  /* Cup bracket: one column per round, matches spaced to fan outward. */
  .cupbracket{display:flex;gap:14px;align-items:stretch;overflow-x:auto;padding-bottom:4px;}
  .cupbracket .col{display:flex;flex-direction:column;justify-content:space-around;
    gap:10px;min-width:170px;flex:1;}
  .cupbracket .roundlbl{color:var(--text-dim);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;text-align:center;margin-bottom:2px;}
  .cupbracket .match{background:var(--panel);border:1px solid var(--line);
    border-radius:6px;padding:7px 9px;font-size:12px;}
  .cupbracket .match .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;}
  .cupbracket .match .row.win{color:var(--gold);font-weight:700;}
  .cupbracket .match .row.you{text-decoration:underline;text-underline-offset:3px;}

  .banner{background:linear-gradient(90deg,rgba(244,194,90,.14),transparent);
    border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:10px;font-size:13px;}
  .banner b{color:var(--gold);}

  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:640px){
    .row-2{grid-template-columns:1fr;}
    .plate-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>Run The All-Stars</h1>
    <span class="tag">Public domain baseball</span>
    <span class="spacer"></span>
    <button id="btn-mute" title="Toggle sound"></button>
    <button id="btn-home">Main Menu</button>
  </div>
  <div id="app"></div>
</div>

<script>
"use strict";

/* ============================================================================
   ROSTER
   Twenty-three public domain characters. Stat scale 1 to 100.

   Sprites are generated, not stored here: see allstars/gen_sprites_v2.py
   and the V2_SPRITES table below. A roster row carries only what the GAME
   needs (name, role, stats, quirk, flavour note); what a character LOOKS
   like is a spec in the generator.

   A `quirk` field, when present, hooks a mechanic in the sim engine
   (see startAtBat, throwPitch, and resolveSwing). Everyone else plays by
   the same rules.
   ============================================================================ */


const ROSTER = [
  /* ---------------- POWER HITTERS ---------------- */

  { k:'kong', n:'King Kong', role:'Power', pow:99, spd:8, con:45, def:40, quirk:null,
    note:'Legendary long ball, cannot run to save his life.',
  },

  { k:'franky', n:'Frankenstein', role:'Power', pow:97, spd:20, con:40, def:55, quirk:null,
    note:'Two run homer or two called strikes. Nothing in between.',
  },

  { k:'popeye', n:'Popeye', role:'Power', pow:88, spd:55, con:60, def:65, quirk:null,
    note:'Skips leg day. Never skips forearm day.',
  },

  { k:'dracula', n:'Dracula', role:'Power', pow:86, spd:58, con:58, def:60, quirk:null,
    note:'Night games only. Wakes up in the third inning.',
  },

  { k:'liberty', n:'Lady Liberty', role:'Power', pow:100, spd:1, con:22, def:30,
    quirk:'monument',
    note:'Immobile. But every hit clears the wall.',
  },

  /* ---------------- SPEED DEMONS ---------------- */

  { k:'peter', n:'Peter Pan', role:'Speed', pow:40, spd:96, con:62, def:72, quirk:null,
    note:'Fastest kid on the roster. Also technically the oldest.',
  },

  { k:'felix', n:'Felix', role:'Speed', pow:38, spd:92, con:68, def:70, quirk:null,
    note:'Always lands on his feet. Ninth life still on the bench.',
  },

  { k:'jack', n:'Jack', role:'Speed', pow:52, spd:88, con:48, def:60, quirk:null,
    note:'Steals bases like he stole from a giant. Uphill.',
  },

  { k:'tom', n:'Tom Sawyer', role:'Speed', pow:50, spd:84, con:68, def:65, quirk:null,
    note:'Talked the third baseman into painting the fence.',
  },

  { k:'huck', n:'Huck Finn', role:'Speed', pow:44, spd:86, con:58, def:62, quirk:null,
    note:'Barefoot on purpose. Sprints on principle.',
  },

  { k:'flash', n:'Flash Gordon', role:'Speed', pow:62, spd:80, con:64, def:68, quirk:null,
    note:'Faster than the pitch. Not faster than the count.',
  },

  { k:'invisible', n:'Invisible Man', role:'Defense', pow:38, spd:82, con:56, def:92, quirk:null,
    note:'Fielders lose him in the dust.',
  },

  /* ---------------- CONTACT SPECIALISTS ---------------- */

  { k:'sherlock', n:'Sherlock', role:'Contact', pow:45, spd:55, con:88, def:78, quirk:null,
    note:'Reads pitch tips like a case file. Elementary, my dear count.',
  },

  { k:'tracy', n:'Dick Tracy', role:'Contact', pow:60, spd:60, con:85, def:72, quirk:null,
    note:'The strike zone is exactly where he says it is.',
  },

  { k:'alice', n:'Alice', role:'Contact', pow:45, spd:68, con:82, def:65, quirk:null,
    note:'Curiouser and curiouser. Also very hard to strike out.',
  },

  { k:'dorothy', n:'Dorothy', role:'Contact', pow:52, spd:64, con:78, def:70, quirk:null,
    note:'Three taps of the slippers, safe at home.',
  },

  { k:'lupin', n:'Arsène Lupin', role:'Contact', pow:55, spd:78, con:84, def:68, quirk:null,
    note:'Steals a base and leaves a calling card in the dugout.',
  },

  /* ---------------- WILD CARDS ---------------- */

  { k:'hyde', n:'Mr. Hyde', role:'Wild', pow:55, spd:60, con:52, def:55, quirk:'transform',
    note:'One in six at bats he transforms. All power, no manners.',
  },

  { k:'scarecrow', n:'Scarecrow', role:'Wild', pow:38, spd:55, con:78, def:60, quirk:'confuse',
    note:'Pitchers lose the plate. Meter wobbles harder against him.',
  },

  { k:'lion', n:'Cowardly Lion', role:'Wild', pow:82, spd:50, con:52, def:55, quirk:'skittish',
    note:'Enormous power. Bails on tough pitches.',
  },

  { k:'pooh', n:'Pooh', role:'Underdog', pow:42, spd:30, con:65, def:50, quirk:null,
    note:'Waits for the sweet pitch. Sometimes the pitch is honey.',
  },

  { k:'robin', n:'Robin Hood', role:'Balanced', pow:65, spd:78, con:70, def:78, quirk:null,
    note:'Takes hits from the rich outfielders, gives them to the middle innings.',
  },

  { k:'tintin', n:'Tintin', role:'Balanced', pow:58, spd:75, con:70, def:72, quirk:null,
    note:'Files a story on every at bat. Never on deadline.',
  },

  /* ---------------- HOLIDAY AND FOLKLORE PACK ---------------- */

  { k:'santa', n:'Santa', role:'Power', pow:82, spd:30, con:65, def:60, quirk:null,
    note:'Delivers big even in the dead of night. Chimney speed.',
  },

  { k:'mrsclaus', n:'Mrs. Claus', role:'Contact', pow:52, spd:40, con:84, def:70, quirk:null,
    note:'Knits between innings. Reads the pitcher like a good book.',
  },

  { k:'bunny', n:'Easter Bunny', role:'Speed', pow:42, spd:96, con:65, def:72, quirk:null,
    note:'Hops between bases faster than you can spot him.',
  },

  { k:'fairy', n:'Tooth Fairy', role:'Contact', pow:40, spd:88, con:78, def:65, quirk:null,
    note:'Sneaks in during your at-bat and swaps a strike for a quarter.',
  },

  { k:'vampire', n:'Vampire', role:'Power', pow:78, spd:68, con:56, def:60, quirk:null,
    note:'Colder than Dracula, cheaper cape, still bites.',
  },

  { k:'pirate', n:'Pirate', role:'Balanced', pow:70, spd:55, con:60, def:60, quirk:null,
    note:'Arrr. That will do for a swing.',
  },

  { k:'witch', n:'Witch', role:'Wild', pow:60, spd:78, con:70, def:62, quirk:'hex',
    note:'Hexes the pitcher. Odds go strange against her.',
  },

  { k:'centaur', n:'Centaur', role:'Speed', pow:76, spd:96, con:60, def:70, quirk:null,
    note:'Half rider, half horse, entirely uncatchable in the gap.',
  },

  { k:'krampus', n:'Krampus', role:'Power', pow:92, spd:50, con:48, def:55, quirk:'naughty',
    note:'Files a naughty list against the pitcher. He remembers everything.',
  },

  { k:'fathertime', n:'Father Time', role:'Contact', pow:45, spd:20, con:88, def:92, quirk:'stall',
    note:'Slows the meter down. Every at bat feels like nine.',
  },

  { k:'mothernature', n:'Mother Nature', role:'Balanced', pow:65, spd:70, con:74, def:78, quirk:null,
    note:'Grows a rally. Watch the vines climb the outfield fence.',
  },

  { k:'raboddog', n:'Rabid Dog', role:'Wild', pow:72, spd:92, con:38, def:40, quirk:'frenzy',
    note:'Does not care about outs. Never picks up a walk.',

/* Per-team style tuning applied to the CPU batting AI. `swing` shifts the
   base probability of taking a hack (positive = free swingers), `patience`
   trims swings on balls (positive = disciplined), `jitter` scales the
   contact spread (positive = wilder swings, more whiffs). */
const TEAM_STYLE = {

  'Storybook Nine':     { swing: 0.00, patience:+0.02, jitter:+0.00, label:'Balanced' },

};
const DEFAULT_STYLE = { swing:0, patience:0, jitter:0, label:'Balanced' };

/* -------- Season difficulty ramp --------
   A seven game season that plays identically from game one to game seven
   has no arc. Opponents sharpen as the season goes on: early games are a
   warm up, the last games bite, and the playoffs and the final bite
   hardest. Returns 0 (opening day) to 1 (championship game). Exhibition
   games sit in the middle so a one off is neither trivial nor brutal. */
function opponentSharpness() {
  if (State.mode === 'season' && State.season) {
    const played = State.season.results.length;   /* 0..6 going in */
    return clamp(played / 8, 0, 1);
  }
  if (State.mode === 'playoff') {
    return State.game && State.game.round === 'final' ? 1.0 : 0.85;
  }
  if (State.mode === 'cup' && State.game) {
    /* Round 0 quarters, 1 semis, 2 final. */
    return clamp(0.55 + (State.game.cupR || 0) * 0.225, 0, 1);
  }
  return 0.45;
}
/* A short label so the player can see what they are walking into. */
function sharpnessLabel(v) {
  if (v >= 0.95) return 'Championship form';
  if (v >= 0.8) return 'Playoff sharp';
  if (v >= 0.6) return 'Locked in';
  if (v >= 0.35) return 'Warming up';
  return 'Early season rust';
}
function currentBattingTeamStyle() {
  const t = currentBattingTeam();
  if (t.isYou) return DEFAULT_STYLE;
  const oppName = State.opponent && State.opponent.name;
  return TEAM_STYLE[oppName] || DEFAULT_STYLE;
}

function drawHeroSprite(ctx, key, size, frame) {
  const spr = V2_SPRITES[key];
  const rows = (spr.f && spr.f[frame]) || spr.f.idle;
  const pal = spr.p;
  const px = size / V2_W;
  ctx.clearRect(0, 0, size, size * V2_H / V2_W);
  for (let y = 0; y < V2_H; y++) {
    const row = rows[y] || '';
    for (let x = 0; x < V2_W; x++) {
      const ch = row[x];
      if (!ch || ch === '.') continue;
      const color = pal[ch];
      if (!color) continue;
      ctx.fillStyle = color;
      ctx.fillRect(Math.floor(x*px), Math.floor(y*px), Math.ceil(px), Math.ceil(px));
    }
  }
}
function heroSpriteCanvas(key, size, frame) {
  const cv = document.createElement('canvas');
  cv.width = size;
  cv.height = Math.round(size * V2_H / V2_W);
  drawHeroSprite(cv.getContext('2d'), key, size, frame || 'idle');
  return cv;
}
const hasHero = (k) => Object.prototype.hasOwnProperty.call(V2_SPRITES, k);
const HERO_W = V2_W, HERO_H = V2_H;

function spriteCanvas(c, size) {
  /* Every character has a generated sprite, so this is the only path. */
  return heroSpriteCanvas(c.k, size, 'idle');
}

/* ============================================================================
   SOUND
   All synthesized with WebAudio at call time: oscillators and filtered
   noise, no audio files. The context is created lazily on the first user
   gesture (autoplay policy), and the mute choice persists in prefs.
   ============================================================================ */
const Sound = {
  ctx: null,
  muted: false,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  /* one master gain so everything mixes politely */
  bus() {
    const ctx = this.ensure();
    if (!ctx) return null;
    if (!this._bus) {
      this._bus = ctx.createGain();
      this._bus.gain.value = 0.5;
      this._bus.connect(ctx.destination);
    }
    return this._bus;
  },
  tone(freq, dur, opts = {}) {
    const ctx = this.ensure(); const bus = this.bus();
    if (!ctx || !bus) return;
    const t0 = ctx.currentTime + (opts.delay || 0);
    const osc = ctx.createOscillator();
    osc.type = opts.type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    if (opts.slideTo) osc.frequency.exponentialRampToValueAtTime(opts.slideTo, t0 + dur);
    const g = ctx.createGain();
    const vol = opts.vol || 0.18;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g); g.connect(bus);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  },
  noise(dur, opts = {}) {
    const ctx = this.ensure(); const bus = this.bus();
    if (!ctx || !bus) return;
    const t0 = ctx.currentTime + (opts.delay || 0);
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filt = ctx.createBiquadFilter();
    filt.type = opts.filter || 'highpass';
    filt.frequency.value = opts.freq || 2000;
    const g = ctx.createGain();
    const vol = opts.vol || 0.3;
    g.gain.setValueAtTime(vol, t0);
    if (opts.swell) {
      g.gain.setValueAtTime(0.001, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + dur * 0.3);
    }
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(filt); filt.connect(g); g.connect(bus);
    src.start(t0); src.stop(t0 + dur + 0.05);
  },
  play(name) {
    if (this.muted) return;
    try {
      switch (name) {
        case 'crack':
          this.noise(0.08, { filter:'highpass', freq: 1800, vol: 0.5 });
          this.tone(180, 0.06, { type:'triangle', vol: 0.25 });
          break;
        case 'foul':
          this.noise(0.05, { filter:'highpass', freq: 2400, vol: 0.3 });
          break;
        case 'whiff':
          this.tone(320, 0.16, { type:'sawtooth', slideTo: 90, vol: 0.10 });
          break;
        case 'strike':
          this.tone(220, 0.10, { vol: 0.14 });
          this.tone(175, 0.16, { vol: 0.14, delay: 0.10 });
          break;
        case 'ball':
          this.tone(440, 0.07, { type:'sine', vol: 0.12 });
          break;
        case 'catch':
          this.tone(880, 0.05, { type:'sine', vol: 0.16 });
          this.noise(0.04, { filter:'lowpass', freq: 900, vol: 0.25 });
          break;
        case 'cheer':
          this.noise(0.7, { filter:'bandpass', freq: 1000, vol: 0.22, swell: true });
          break;
        case 'aww':
          this.tone(300, 0.28, { type:'sine', slideTo: 200, vol: 0.10 });
          break;
        case 'homer': {
          /* an original little triad fanfare, composed here */
          const seq = [ [523, 0.00], [659, 0.11], [784, 0.22], [1047, 0.35] ];
          for (const [f, d] of seq) this.tone(f, 0.16, { vol: 0.16, delay: d });
          this.tone(1047, 0.5, { vol: 0.12, delay: 0.52 });
          this.noise(1.4, { filter:'bandpass', freq: 1000, vol: 0.26, swell: true, delay: 0.1 });
          break;
        }
        case 'inning':
          this.tone(392, 0.10, { vol: 0.10 });
          this.tone(494, 0.10, { vol: 0.10, delay: 0.11 });
          this.tone(587, 0.16, { vol: 0.10, delay: 0.22 });
          break;
      }
    } catch (e) { /* audio unavailable: stay silent */ }
  },
  /* -------- 8-bit ambient background loop --------
     A pentatonic sequence in the key of D that loops indefinitely
     while the game screen is up. Uses a low square-wave bass and a
     tinkling triangle melody. Volume ducks against action sounds by
     living on its own gain. Mute stops it; toggling on restarts it. */
  music: {
    ctx: null,
    bus: null,
    playing: false,
    stopper: null,
    start(sound) {
      if (this.playing) return;
      const ctx = sound.ensure();
      if (!ctx || sound.muted) return;
      this.ctx = ctx;
      this.bus = ctx.createGain();
      this.bus.gain.value = 0.06;   /* quieter than SFX */
      this.bus.connect(sound.bus());
      /* Notes in the D pentatonic (D E F# A B) */
      const melody = [ 587, 660, 740, 880, 660, 587, 740, 880,   /* eight beats */
                       988, 880, 740, 660, 587, 740, 880, 988 ];
      const bass = [ 147, 147, 220, 220, 165, 165, 147, 147 ];
      let step = 0;
      const beatSec = 0.35;
      const schedule = () => {
        if (!sound.muted && this.playing) {
          const t = ctx.currentTime;
          /* melody: eight beats per bar */
          for (let i = 0; i < 8; i++) {
            const note = melody[(step + i) % melody.length];
            this.playNote(note, t + i * beatSec, beatSec * 0.75, 'triangle', 0.5);
          }
          for (let i = 0; i < 8; i++) {
            const note = bass[(Math.floor(step / 2) + i) % bass.length];
            this.playNote(note, t + i * beatSec, beatSec * 0.9, 'square', 0.35);
          }
          step += 8;
        }
      };
      schedule();
      this.stopper = setInterval(schedule, beatSec * 8 * 1000);
      this.playing = true;
    },
    stop() {
      if (this.stopper) { clearInterval(this.stopper); this.stopper = null; }
      if (this.bus) { try { this.bus.disconnect(); } catch(e){} this.bus = null; }
      this.playing = false;
    },
    playNote(freq, when, dur, type, vol) {
      const ctx = this.ctx;
      if (!ctx || !this.bus) return;
      const osc = ctx.createOscillator();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, when);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, when);
      g.gain.linearRampToValueAtTime(vol, when + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, when + dur);
      osc.connect(g); g.connect(this.bus);
      osc.start(when); osc.stop(when + dur + 0.02);
    },
  },
};

  kong:      { how:'Hit 6 home runs in a season.',        check:(p)=> (p.seasonHR|0) >= 6 },
  liberty:   { how:'Win a playoff game.',                  check:(p)=> (p.playoffWins|0) >= 1 },
  dragon:    { how:'Win the championship.',                check:(p)=> (p.titles|0) >= 1 },
  phoenix:   { how:'Come back and win after trailing.',    check:(p)=> (p.comebacks|0) >= 1 },
  chupacabra:{ how:'Win a game by 10 or more runs.',       check:(p)=> (p.blowouts|0) >= 1 },
  fathertime:{ how:'Play a full 9 inning game.',           check:(p)=> (p.nineInningGames|0) >= 1 },
};
const PROGRESS = Object.assign(
  { seasonHR:0, playoffWins:0, titles:0, comebacks:0, blowouts:0, nineInningGames:0, unlocked:[] },
  PREFS.progress || {}
);
function saveProgress() {
  PREFS.progress = PROGRESS;
  try {
    const cur = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
    cur.progress = PROGRESS;
    localStorage.setItem(PREFS_KEY, JSON.stringify(cur));
  } catch (e) {}
}
function isUnlocked(k) {
  if (!UNLOCKS[k]) return true;              /* not a locked character */
  return PROGRESS.unlocked.indexOf(k) !== -1;
}
/* Re-evaluate every locked character against current progress. Returns the
   list of keys newly unlocked by this call, so the caller can celebrate. */
function refreshUnlocks() {
  const fresh = [];
  for (const k of Object.keys(UNLOCKS)) {
    if (PROGRESS.unlocked.indexOf(k) === -1 && UNLOCKS[k].check(PROGRESS)) {
      PROGRESS.unlocked.push(k);
      fresh.push(k);
    }
  }
  if (fresh.length) saveProgress();
  return fresh;
}

    st.innerHTML = `<span>POW <b>${c.pow}</b></span><span>SPD <b>${c.spd}</b></span>`
                 + `<span>CON <b>${c.con}</b></span><span>DEF <b>${c.def}</b></span>`;

    if (c.note) {
      const nt = el('div','quirk', c.note);

        setTimeout(() => {
          State.team = [...picked];

          savePrefs();
          State.screen = 'settings';
          render();
        }, 220);
      }
    };
    grid.appendChild(cc);
    cards.set(c.k, cc);
  });
  card.appendChild(grid);
  s.appendChild(card);

  const foot = el('div','card');
  const counter = el('div', null);
  const nameLabel = el('label', null, 'Team name: ');

    padding:'6px 8px', borderRadius:'4px', fontFamily:'inherit', fontSize:'13px', marginLeft:'6px', width:'180px'
  });
  nameLabel.appendChild(nameInput);
  foot.appendChild(nameLabel);
  foot.appendChild(el('div', null, '<br>'));
  foot.appendChild(counter);
  const row = el('div','btn-row');
  const rand = el('button','btn ghost','Randomize');
  rand.onclick = () => {
    picked.clear();
    const bag = ROSTER.filter(c => isUnlocked(c.k)).sort(() => Math.random() - 0.5);
    bag.slice(0,9).forEach(c => picked.add(c.k));
    redraw();
    /* Same auto advance as the ninth click: nine is nine. */
    setTimeout(() => {
      State.team = [...picked];
      State.teamName = (nameInput.value || 'Your Team').slice(0,20);
      savePrefs();
      State.screen = 'settings';
      render();
    }, 300);
  };
  const go = el('button','btn','Continue');
  go.onclick = () => {
    if (picked.size !== 9) return;
    State.team = [...picked];
    State.teamName = (nameInput.value || 'Your Team').slice(0,20);
    State.screen = 'settings';
    render();
  };
  const back = el('button','btn ghost','Back');
  back.onclick = () => { State.screen = 'menu'; render(); };
  row.append(back, rand, go);
  foot.appendChild(row);
  s.appendChild(foot);

  app.appendChild(s);

  function redraw() {
    let n = 0;
    for (const c of ROSTER) {
      const cc = cards.get(c.k);
      if (picked.has(c.k)) { n++; cc.classList.add('picked'); cc.querySelector('.pickno')?.remove(); const b = el('div','pickno', [...picked].indexOf(c.k)+1); cc.appendChild(b); }

    }

    go.disabled = picked.size !== 9;
  }
  redraw();

/* ============================================================================
   SEASON
   ============================================================================ */
function seasonRecord(season) {
  const w = season.results.filter(r => r.win).length;
  const l = season.results.filter(r => !r.win).length;
  return { w, l };
}
function randomOpponent(exclude) {
  const pool = OPPONENTS.filter(o => !exclude || o.name !== exclude);
  return pool[Math.floor(Math.random() * pool.length)];
}
function buildSchedule() {
  const bag = [...OPPONENTS].sort(() => Math.random() - 0.5);
  return bag.slice(0,7).map(o => o.name);
}
function opponentByName(name) {
  return OPPONENTS.find(o => o.name === name);
}
/* ============================================================================
   THE CUP
   A standalone eight team single elimination tournament: quarterfinals,
   semifinals, final. No standings, no schedule, no regular season. Lose
   once and it is over, which makes it the short high stakes counterpart
   to the seven game season. Its own save slot so it never disturbs a
   season in progress.
   ============================================================================ */
function startCup() {
  const field = [...OPPONENTS].sort(() => Math.random() - 0.5).slice(0, 7);
  /* Seed the player first, then the seven drawn opponents. */
  const entrants = [{ name: State.teamName, roster: State.team, you: true }]
    .concat(field.map(o => ({ name: o.name, roster: o.roster })));
  State.cup = {
    team: State.team,
    teamName: State.teamName,
    innings: State.innings,
    difficulty: State.difficulty,
    entrants,
    /* Round of eight: 0v7, 1v6, 2v5, 3v4. Winners collapse upward. */
    rounds: [
      [ {a:0,b:7,result:null}, {a:1,b:6,result:null}, {a:2,b:5,result:null}, {a:3,b:4,result:null} ],
      [ {a:null,b:null,result:null}, {a:null,b:null,result:null} ],
      [ {a:null,b:null,result:null} ],
    ],
    done: false,
    champion: null,
  };
  saveCup(State.cup);
  State.screen = 'cup';
  render();
}

/* Fill in the next round's slots from the previous round's winners. */
function cupPropagate(C) {
  for (let r = 1; r < C.rounds.length; r++) {
    const prev = C.rounds[r-1];
    const cur = C.rounds[r];
    for (let i = 0; i < cur.length; i++) {
      const m1 = prev[i*2], m2 = prev[i*2+1];
      if (m1 && m1.result) cur[i].a = m1.result.winner;
      if (m2 && m2.result) cur[i].b = m2.result.winner;
    }
  }
  const fin = C.rounds[C.rounds.length-1][0];
  if (fin.result) { C.done = true; C.champion = fin.result.winner; }
}

/* The next match that still needs playing, and whether the player is in it. */
function nextCupMatch(C) {
  for (let r = 0; r < C.rounds.length; r++) {
    for (let i = 0; i < C.rounds[r].length; i++) {
      const m = C.rounds[r][i];
      if (m.result) continue;
      if (m.a == null || m.b == null) continue;   /* waiting on a feeder */
      const you = C.entrants[m.a].you || C.entrants[m.b].you;
      return { r, i, match: m, playerInvolved: you };
    }
  }
  return null;
}

function simulateCupMatch(C, nm) {
  const m = nm.match;
  const A = C.entrants[m.a], B = C.entrants[m.b];
  const ar = teamRating(A.roster), br = teamRating(B.roster);
  let as = Math.max(0, Math.round(4 + (ar - br)*0.06 + (Math.random()-0.5)*3));
  let bs = Math.max(0, Math.round(4 + (br - ar)*0.06 + (Math.random()-0.5)*3));
  if (as === bs) as += 1;   /* no ties in a knockout */
  m.result = { aScore: as, bScore: bs, winner: as > bs ? m.a : m.b };
}

function startCupMatch(C, nm) {
  const m = nm.match;
  const A = C.entrants[m.a], B = C.entrants[m.b];
  const youIsA = !!A.you;
  const you = youIsA ? A : B;
  const foe = youIsA ? B : A;
  State.team = you.roster;
  State.teamName = you.name;
  State.opponent = { name: foe.name, color: (opponentByName(foe.name)||{}).color || '#8a1a1a', roster: foe.roster };
  State.innings = C.innings;
  State.difficulty = C.difficulty;
  /* Higher seed (lower index) hosts. */
  const youHome = (youIsA ? m.a : m.b) < (youIsA ? m.b : m.a);
  startGame({ mode:'cup', cupR: nm.r, cupI: nm.i, youHome });
}

const CUP_ROUND_NAMES = ['Quarterfinals','Semifinals','Final'];

function renderCup() {
  const C = State.cup;
  const s = el('div','screen');
  s.appendChild(el('h2', null, 'The All-Stars Cup'));

  cupPropagate(C);
  saveCup(C);

  const banner = el('div','banner');
  if (C.done) {
    const champ = C.entrants[C.champion];
    banner.innerHTML = champ.you
      ? `<b>You win the Cup.</b> Eight teams in, one left standing.`
      : `<b>${champ.name} wins the Cup.</b> Better luck next draw.`;
  } else {
    const nm = nextCupMatch(C);
    banner.innerHTML = nm
      ? `<b>${CUP_ROUND_NAMES[nm.r]}.</b> Single elimination: lose and you are out.`
      : '<b>Cup in progress.</b>';
  }
  s.appendChild(banner);

  /* Bracket: one column per round. */
  const brac = el('div','card');
  const cols = el('div','cupbracket');
  C.rounds.forEach((round, r) => {
    const col = el('div','col');
    col.appendChild(el('div','roundlbl', CUP_ROUND_NAMES[r]));
    round.forEach((m) => {
      const box = el('div','match');
      const side = (idx, score, isWinner) => {
        const e = idx == null ? null : C.entrants[idx];
        const cls = 'row' + (e && e.you ? ' you' : '') + (isWinner ? ' win' : '');
        return `<div class="${cls}"><span>${e ? e.name : 'TBD'}</span><span>${score == null ? '' : score}</span></div>`;
      };
      const res = m.result;
      box.innerHTML =
          side(m.a, res ? res.aScore : null, res && res.winner === m.a)
        + side(m.b, res ? res.bScore : null, res && res.winner === m.b);
      col.appendChild(box);
    });
    cols.appendChild(col);
  });
  brac.appendChild(cols);
  s.appendChild(brac);

  const row = el('div','btn-row');
  if (!C.done) {
    const nm = nextCupMatch(C);
    if (nm && nm.playerInvolved) {
      const b = el('button','btn','Play Your Match');
      b.onclick = () => startCupMatch(C, nm);
      row.appendChild(b);
    } else if (nm) {
      const b = el('button','btn','Simulate Next Match');
      b.onclick = () => { simulateCupMatch(C, nm); cupPropagate(C); saveCup(C); render(); };
      row.appendChild(b);
    }
  } else {
    const b = el('button','btn','New Cup');
    b.onclick = () => { clearCup(); State.cup = null; State.mode='cup'; State.screen='roster'; render(); };
    row.appendChild(b);
  }
  const quit = el('button','btn ghost','Quit Cup');
  quit.onclick = () => {
    if (confirm('Quit and delete this cup run?')) {
      clearCup(); State.cup = null; State.screen='menu'; render();
    }
  };
  row.appendChild(quit);
  s.appendChild(row);

  app.appendChild(s);
}

function startSeason() {
  State.season = {
    team: State.team,
    teamName: State.teamName,
    innings: State.innings,
    difficulty: State.difficulty,
    schedule: buildSchedule(),
    results: [],
    playoffs: null,
    playerStats: { hr:0, so:0, sb:0, hits:0, ab:0 },
    perPlayer: {},   /* per character running totals across the season */
    league: simulateLeagueSeasons(),
  };
  saveSeason(State.season);
  State.screen = 'season-hub';
  render();
}

/* The other eight teams need records so a playoff picture exists. Rather than
   simulate every game the league plays behind the scenes, generate a plausible
   seven game record for each opponent up front. The user's own results get
   subbed in as their games are played. */
function simulateLeagueSeasons() {
  const out = {};
  for (const o of OPPONENTS) {
    const rating = teamRating(o.roster);
    const winRate = 0.35 + (rating - 60) * 0.008;   /* soft curve around .500 */
    let w = 0;
    for (let i=0;i<7;i++) if (Math.random() < winRate) w++;
    out[o.name] = { w, l: 7 - w };
  }
  return out;
}
function teamRating(keys) {
  const chars = keys.map(k => ROSTER_BY_KEY[k]);
  const off = chars.reduce((a,c) => a + c.pow*0.4 + c.con*0.4 + c.spd*0.2, 0) / 9;
  const def = chars.reduce((a,c) => a + c.def, 0) / 9;
  return off * 0.65 + def * 0.35;
}

function renderSeasonHub() {
  const S = State.season;
  const s = el('div','screen');
  s.appendChild(el('h2', null, S.teamName + ' · Season'));

  const rec = seasonRecord(S);
  const games = S.results.length;
  const banner = el('div','banner');
  if (S.playoffs) {
    banner.innerHTML = `<b>Playoffs.</b> Regular season done at ${rec.w}-${rec.l}.`;
  } else {
    banner.innerHTML = `<b>Regular season.</b> ${rec.w}-${rec.l} through ${games} game${games===1?'':'s'} of 7.`;
  }
  s.appendChild(banner);

  if (!S.playoffs) {
    const nextCard = el('div','card');
    if (games < 7) {
      const next = opponentByName(S.schedule[games]);
      nextCard.appendChild(el('h3', null, 'Next game'));
      const style = TEAM_STYLE[next.name] || DEFAULT_STYLE;
      const sharp = clamp(games / 8, 0, 1);
      nextCard.appendChild(el('p', null,
        `vs ${next.name} · ${style.label} · ${sharpnessLabel(sharp)}`));
      const play = el('button','btn','Play Next Game');
      play.onclick = () => {
        State.team = S.team;
        State.teamName = S.teamName;
        State.innings = S.innings;
        State.difficulty = S.difficulty;
        State.opponent = next;

function seedPlayoffs(S) {
  const rows = [];
  rows.push({ name: S.teamName, roster: S.team, w: seasonRecord(S).w, you:true });
  for (const o of OPPONENTS) rows.push({ name:o.name, roster:o.roster, w: S.league[o.name].w });
  rows.sort((a,b) => b.w - a.w || Math.random() - 0.5);
  const top4 = rows.slice(0,4);
  return {
    seeds: top4,
    semis: [
      { home:0, away:3, result:null },
      { home:1, away:2, result:null },
    ],
    final: null,
    stage: 'semi',
  };
}

function nextPlayoffMatch(P) {
  for (let i=0;i<P.semis.length;i++) {
    const m = P.semis[i];
    if (!m.result) {
      const you = P.seeds[m.home].you || P.seeds[m.away].you;
      return { round:'semi', idx:i, match:m, playerInvolved: you };
    }
  }
  if (!P.final) {
    const winners = P.semis.map(m => m.result.winner);
    P.final = { home:winners[0], away:winners[1], result:null };
  }
  if (P.final && !P.final.result) {
    const you = P.seeds[P.final.home].you || P.seeds[P.final.away].you;
    return { round:'final', idx:0, match:P.final, playerInvolved: you };
  }
  return null;
}

function simulateCpuMatch(nm) {
  const P = State.season.playoffs;
  const m = nm.match;
  const home = P.seeds[m.home];
  const away = P.seeds[m.away];
  const hr = teamRating(home.roster);
  const ar = teamRating(away.roster);
  const homeAdv = 3;
  const hs = Math.max(0, Math.round(4 + (hr - ar)*0.06 + homeAdv*0.3 + (Math.random()-0.5)*3));
  const as = Math.max(0, Math.round(4 + (ar - hr)*0.06 + (Math.random()-0.5)*3));
  const finalHome = hs === as ? hs + 1 : hs;
  m.result = { homeScore:finalHome, awayScore:as, winner: finalHome > as ? m.home : m.away };
}

function startPlayoffMatch(nm) {
  const S = State.season;
  const P = S.playoffs;
  const m = nm.match;
  const home = P.seeds[m.home];
  const away = P.seeds[m.away];
  /* Home field advantage: the higher seed always hosts (the bracket
     puts home in the higher slot already). Player is home when their
     seed made them home. */
  const youHome = home.you;
  const you = youHome ? home : away;
  const foe = youHome ? away : home;
  State.team = you.roster;
  State.teamName = you.name;
  State.opponent = { name: foe.name, color: (opponentByName(foe.name)?.color) || '#8a1a1a', roster: foe.roster };
  State.innings = S.innings;
  State.difficulty = S.difficulty;
  startGame({ mode:'playoff', round: nm.round, matchIdx: nm.idx, youHome });
}

/* ============================================================================
   GAME
   ============================================================================ */
function startGame(opts) {
  const battersAway = State.team.map(k => ROSTER_BY_KEY[k]);
  const battersHome = State.opponent.roster.map(k => ROSTER_BY_KEY[k]);
  /* User bats AWAY (visitor), opponent home. In playoffs the flag flips. */
  const youHome = !!opts.youHome;
  State.game = {
    live: true,
    mode: opts.mode,
    round: opts.round, matchIdx: opts.matchIdx,
    innings: State.innings,
    half: 'top',       /* 'top' means away batting */
    inning: 1,
    outs: 0,
    balls: 0, strikes: 0,
    bases: [null,null,null],
    away: { name: youHome ? State.opponent.name : State.teamName, batters: youHome ? battersHome : battersAway, idx:0, score:0, isYou: !youHome, color: youHome ? State.opponent.color : '#f4c25a' },
    home: { name: youHome ? State.teamName : State.opponent.name, batters: youHome ? battersAway : battersHome, idx:0, score:0, isYou: youHome, color: youHome ? '#f4c25a' : State.opponent.color },
    stats: { hr:{}, so:{}, sb:{}, hits:{}, ab:{} },
    lineScore: { away:[0], home:[] },   /* runs per inning, per side */
    fx: [],           /* live particles: dust, confetti, glove flashes */
    shakeUntil: 0,    /* camera shake deadline (home runs) */
    log: [],
    pitch: null,      /* the current pitch animation */
    over: false,
    winner: null,
  };
  State.screen = 'game';
  render();
  Sound.music.start(Sound);
  setTimeout(startAtBat, 400);
}

function currentBattingTeam() {
  const g = State.game;
  return g.half === 'top' ? g.away : g.home;
}
function currentFieldingTeam() {
  const g = State.game;
  return g.half === 'top' ? g.home : g.away;
}
function currentBatter() {
  const t = currentBattingTeam();
  return t.batters[t.idx % 9];
}
function currentPitcher() {
  return currentFieldingTeam().batters[0];  /* first pick pitches */
}
function playerIsBatting() {
  return currentBattingTeam().isYou;
}
function statBump(k, key) {
  const g = State.game;
  g.stats[key][k] = (g.stats[key][k] || 0) + 1;
}

/* Difficulty tunings.
   ideal[a,b] = the fraction-of-meter window that produces solid contact.
   speed = seconds for the meter cursor to sweep across.
   pitcherSkill = multiplier on pitcher CON that shifts the meter's ideal spot. */
const DIFF = {
  easy:   { speed: 2.1, sweetWidth: 0.26, pitcherSkill: 0.85 },
  medium: { speed: 1.7, sweetWidth: 0.20, pitcherSkill: 1.00 },
  hard:   { speed: 1.35, sweetWidth: 0.16, pitcherSkill: 1.12 },
};

/* Pitcher fatigue: each inning past the third, the pitcher tires. The
   effect grows the wobble on the ideal spot and drops the strike rate.
   Returns a scaling context resolveSwing and throwPitch consult per pitch. */
function pitcherFatigue() {
  const g = State.game;
  const past = Math.max(0, g.inning - 3);
  return {
    wobbleMult: 1 + past * 0.25,
    strikeDrop: past * 0.03,
    level: past,   /* 0 fresh, 1 tiring, 2 gassed, 3+ cooked */
  };
}

/* Pause lengths in ms. Named so nothing tunes one number without seeing what
   the others are set to; the game's pacing lives here more than anywhere
   else. These are the authored NORMAL values; the live BEAT below is these
   scaled by the player's game speed setting. */
const BASE_BEAT = {
  windup:    700,   /* pitcher into set, meter shows but does not sweep yet */
  betweenPitches: 900,   /* after ball/called strike/foul */
  afterWhiff: 950,
  afterOut:   1500,
  afterWalk:  1600,
  afterHit:   2000,
  afterHomer: 2600,
  betweenHalfInnings: 2600,
  intoAtBat: 700,   /* new batter walks up */
};

/* Game speed. A full five inning game at NORMAL runs past ten minutes,
   which overshoots the quick arcade loop this game is meant to have, so
   the player can trade ceremony for pace. `beat` scales the dead time
   between events; `meter` scales the pitch sweep, kept mild because it
   also changes how hard the timing is. */
const SPEEDS = {
  relaxed: { beat: 1.25, meter: 1.15, label:'Relaxed' },
  normal:  { beat: 1.00, meter: 1.00, label:'Normal' },
  fast:    { beat: 0.55, meter: 0.85, label:'Fast' },
};
const BEAT = Object.assign({}, BASE_BEAT);
function applyGameSpeed() {
  const s = SPEEDS[State.gameSpeed] || SPEEDS.normal;
  for (const k of Object.keys(BASE_BEAT)) BEAT[k] = Math.round(BASE_BEAT[k] * s.beat);
}
function meterScale() {
  const s = SPEEDS[State.gameSpeed] || SPEEDS.normal;
  return s.meter;
}
/* Seed BEAT from the saved preference now that SPEEDS exists. */
applyGameSpeed();

let atBatCleanup = null;
function endAtBatCleanup() {
  if (atBatCleanup) { atBatCleanup(); atBatCleanup = null; }
}

/* A single, always-on animation loop paints the field and the meter every
   frame while the game screen is up. Individual pitches only own the click
   listener and the "no swing = called pitch" trigger; the drawing lives
   here so the diamond stays visible between pitches, half innings, and
   result callouts. */
let fieldRafId = 0;
function startFieldLoop() {
  cancelAnimationFrame(fieldRafId);
  const paint = () => {
    if (State.screen !== 'game' || !State.game) {
      fieldRafId = 0;
      return;
    }
    const fCv = document.getElementById('field');
    const mCv = document.getElementById('meter');
    if (fCv && mCv) {
      const g = State.game;
      const p = g.pitch;
      let t = 0, inWindup = true;
      if (p) {
        const now = performance.now();
        if (now < p.windupUntil) { t = 0; inWindup = true; }
        else {
          const durMs = p.speed * 1000;
          t = clamp((now - p.start) / durMs, 0, 1);
          inWindup = false;
          /* No swing by pitch end. Trigger the called pitch once. */
          if (t >= 1 && !p.swung && !p.resolved) {
            p.resolved = true;
            resolveCalledPitch();
          }
        }
      }
      drawField(fCv.getContext('2d'), fCv.width, fCv.height, t, p || null, inWindup);
      drawMeter(mCv.getContext('2d'), mCv.width, mCv.height, t, p || { ideal: 0.5, pt: 'fastball' }, inWindup);
      refreshStealButton();
    }
    fieldRafId = requestAnimationFrame(paint);
  };
  fieldRafId = requestAnimationFrame(paint);
}
function stopFieldLoop() {
  cancelAnimationFrame(fieldRafId);
  fieldRafId = 0;
}

function startAtBat() {
  const g = State.game;
  if (g.over) return;
  g.balls = 0; g.strikes = 0;
  /* Open this half inning's bucket on the line score so the board shows a
     zero for an inning in progress and stays blank for ones not reached. */
  const lsKey = g.half === 'top' ? 'away' : 'home';
  while (g.lineScore[lsKey].length < g.inning) g.lineScore[lsKey].push(0);
  const b = currentBatter();
  g.batterCtx = batterContext(b);
  for (const note of g.batterCtx.notes) addLog(note, true);
  if (g.batterCtx.flags.spinach) {
    showCallout('SPINACH TIME', 'homer');
    g.signature = { kind: 'anchor', until: performance.now() + 1400 };
    Sound.play('homer');
  } else if (g.batterCtx.flags.transformed) {
    showCallout('HYDE TRANSFORMS', 'strike');
  } else {
    showCallout(`${b.n} steps in`, 'sub');
  }
  refreshHud();
  if (playerIsBatting()) {
    /* CPU calls its own pitch. */
    setTimeout(() => {
      const pick = cpuCallPitch();
      throwPitch(pick.pt, pick.zone);
    }, BEAT.intoAtBat);
  } else {
    /* Your defense is on the field: you call the pitch. */
    setTimeout(offerPitchSelection, BEAT.intoAtBat);
  }
}

/* CPU pitching AI. Decides pitch type and zone against the current
   batter and count. Reads:
     - batter's CON: attack corners on high-CON hitters (avoid squaring up)
     - count: 0-2 wastes off the plate; 3-0 grooves down the middle
     - pitcher fatigue: gassed pitchers throw more fastballs, aim center more
     - last pitch: mix things up on repeat calls
   Returns { pt, zone } consumed by throwPitch. */
function cpuCallPitch() {
  const g = State.game;
  const batter = currentBatter();
  const pitcher = currentPitcher();
  const fat = pitcherFatigue();
  const pitchTypes = ['fastball','curveball','changeup'];

  /* Type choice: mix, but repeat rarely. */
  let pt;
  if (g.lastCpuPitchType && Math.random() < 0.65) {
    pt = pitchTypes.filter(x => x !== g.lastCpuPitchType)[Math.floor(Math.random()*2)];
  } else {
    pt = pitchTypes[Math.floor(Math.random()*3)];
  }
  /* Gassed pitcher: fastballs only, he can't spin the ball. */
  if (fat.level >= 2) pt = 'fastball';
  g.lastCpuPitchType = pt;

  /* Zone choice: 3x3 grid indices 0..8, 4 = center. */
  let zone;
  const wasteRoll = g.strikes >= 2 && Math.random() < 0.35;
  const grooveRoll = g.balls >= 3 && Math.random() < 0.55;
  if (grooveRoll) {
    zone = 4;   /* dead center on 3-0 */
  } else if (wasteRoll) {
    /* Chase pitch: pick one of the four corners. */
    const corners = [0, 2, 6, 8];
    zone = corners[Math.floor(Math.random() * 4)];
  } else {
    /* Contact hitters get cornered; power hitters get sinkers low. */
    const hitContact = batter.con >= 75;
    const hitPower = batter.pow >= 80;
    if (hitContact) {
      const cornersOrEdges = [0, 2, 6, 8, 1, 3, 5, 7];
      zone = cornersOrEdges[Math.floor(Math.random() * cornersOrEdges.length)];
    } else if (hitPower) {
      /* Low pitches to power hitters */
      zone = [6, 7, 8][Math.floor(Math.random() * 3)];
    } else {
      /* Balanced: random */
      zone = Math.floor(Math.random() * 9);
    }
  }
  return { pt, zone };
}

/* When the CPU bats, the player picks the pitch and the target zone. Two
   picks needed; the pitch fires as soon as both are chosen, or after
   five seconds with default values so the game never stalls. The
   selected pitch type matters (each CPU batter has a hidden weak
   pitch), and the target zone shifts both the ideal meter spot and
   the CPU batter's read: corners are hard to square up but risk a
   ball. */
function offerPitchSelection() {
  const g = State.game;
  if (!g || g.over) return;
  const row = document.getElementById('pitch-select');
  if (!row) return throwPitch();
  row.style.display = '';
  let chosenPt = null, chosenZone = null;
  let done = false;
  const fire = () => {
    if (done) return;
    done = true;
    row.style.display = 'none';
    clearTimeout(timer);
    for (const btn of row.querySelectorAll('button')) btn.onclick = null;
    /* Sensible defaults so the game never stalls: fastball down the middle. */
    throwPitch(chosenPt || 'fastball', chosenZone == null ? 4 : chosenZone);
  };
  const timer = setTimeout(fire, 5000);
  for (const btn of row.querySelectorAll('button[data-pt]')) {
    btn.onclick = (e) => {
      e.stopPropagation();
      chosenPt = btn.dataset.pt;
      for (const b of row.querySelectorAll('button[data-pt]')) b.classList.remove('selected');
      btn.classList.add('selected');
      if (chosenZone != null) fire();
    };
  }
  for (const btn of row.querySelectorAll('button[data-zone]')) {
    btn.onclick = (e) => {
      e.stopPropagation();
      chosenZone = parseInt(btn.dataset.zone, 10);
      for (const b of row.querySelectorAll('button[data-zone]')) b.classList.remove('selected');
      btn.classList.add('selected');
      if (chosenPt) fire();
    };
  }
}

/* Quirk hook. Called once per at bat. Returns a stat snapshot the swing
   resolver reads, so per at bat modifiers (Hyde's transformation, etc.)
   never mutate the underlying ROSTER entry. */
function batterContext(b) {
  const g = State.game;
  const ctx = { pow: b.pow, con: b.con, spd: b.spd, notes: [], flags: {} };
  /* Home field advantage: the home team's batters get a small crowd
     bump. Only in playoff games, so the regular season stays flat. */
  if (g.half === 'bottom' && (State.mode === 'playoff' || State.mode === 'cup')) {
    ctx.pow = Math.min(100, ctx.pow + 3);
    ctx.con = Math.min(100, ctx.con + 2);
  }
  if (b.quirk === 'transform' && Math.random() < 0.16) {
    ctx.pow = Math.max(ctx.pow, 96);
    ctx.con = Math.max(ctx.con, 78);
    ctx.notes.push(`${b.n} transforms. All power, no manners.`);
    ctx.flags.transformed = true;
  }
  /* Popeye eats his spinach once per game, on his third plate appearance.
     Roman announces it with a callout, and his POW/CON spike for that
     at bat only. Big signature moment. */
  if (b.k === 'popeye') {
    g.popeyeApps = (g.popeyeApps || 0) + 1;
    if (g.popeyeApps === 3 && !g.popeyeSpinach) {
      g.popeyeSpinach = true;
      ctx.pow = 100;
      ctx.con = Math.max(ctx.con, 88);
      ctx.notes.push('Popeye eats his spinach!');
      ctx.flags.spinach = true;
    }
  }
  /* Dracula bats at night: he tunes up as innings pile on (his stats
     rise a hair per inning past the third, mirroring pitcher fatigue). */
  if (b.k === 'dracula' && g.inning >= 4) {
    ctx.pow = Math.min(100, ctx.pow + (g.inning - 3) * 2);
  }
  /* Chupacabra drains fatigue: his POW rises with pitcher fatigue level. */
  if (b.quirk === 'drain') {
    const fat = pitcherFatigue();
    ctx.pow = Math.min(100, ctx.pow + fat.level * 5);
    if (fat.level >= 1) ctx.notes.push(`${b.n} feeds on the tiring pitcher.`);
  }
  /* Father Time slows the meter for this at bat. Marked on the context;
     throwPitch multiplies its own speed on stall at bats. */
  if (b.quirk === 'stall') {
    ctx.flags.stall = true;
  }
  /* Rabid Dog always swings: locked into frenzy for the CPU AI. */
  if (b.quirk === 'frenzy') {
    ctx.flags.frenzy = true;
  }
  /* Werewolf rises with the moon: like Dracula, powers up in late innings. */
  if (b.quirk === 'moonrise' && g.inning >= 4) {
    ctx.pow = Math.min(100, ctx.pow + (g.inning - 3) * 3);
    ctx.con = Math.min(100, ctx.con + (g.inning - 3) * 1);
    if (g.inning >= 5) ctx.notes.push(`${b.n} howls at the rising moon.`);
  }
  /* Phoenix rebirth: the first time she would strike out in a game, she
     rises from the ashes and reaches first instead. Flag armed here,
     spent in recordOut. */
  if (b.quirk === 'rebirth' && !g.phoenixUsed) {
    ctx.flags.rebirth = true;
  }
  /* Humpty is fragile. He starts enormous and every out he makes cracks
     him a little further, and nothing puts him together again before the
     next game. High risk, high reward: get him on early. */
  if (b.quirk === 'fragile') {
    const cracks = g.humptyCracks | 0;
    ctx.pow = Math.max(35, ctx.pow - cracks * 14);
    ctx.con = Math.max(25, ctx.con - cracks * 6);
    ctx.flags.cracks = cracks;
    if (cracks === 1) ctx.notes.push(`${b.n} is showing a crack.`);
    else if (cracks === 2) ctx.notes.push(`${b.n} is badly cracked.`);
    else if (cracks >= 3) ctx.notes.push(`All the king's men could not put ${b.n} together again.`);
  }
  return ctx;
}

/* Any out charged to Humpty cracks him for the rest of the game. Called
   from both out paths (the strikeout/called path and the fielded path). */
function noteFragileOut(batter) {
  const g = State.game;
  if (!g || !batter || batter.quirk !== 'fragile') return;
  g.humptyCracks = (g.humptyCracks | 0) + 1;
  if (g.humptyCracks <= 3) {
    showCallout('CRACK!', 'strike');
    Sound.play('foul');
  }
}

function throwPitch(chosenPt, chosenZone) {
  const g = State.game;
  if (g.over) return;
  const diff = DIFF[State.difficulty];
  const batter = currentBatter();
  const pitcher = currentPitcher();
  /* Pick a pitch type: player choice when they're calling, else random. */
  const pitchTypes = ['fastball','curveball','changeup'];
  const pt = chosenPt && pitchTypes.includes(chosenPt) ? chosenPt : pitchTypes[Math.floor(Math.random()*3)];
  /* Each CPU at bat has a hidden weak pitch. Hitting it costs the batter
     a chunk of contact quality, which the swing AI reads. */
  if (!g.batterCtx.weakPitch) {
    g.batterCtx.weakPitch = pitchTypes[Math.floor(Math.random()*3)];
  }
  /* speed multiplier: fastball fast, curve normal, change starts fast slows down */
  let baseSpeed = diff.speed * meterScale()
    * (pt === 'fastball' ? 0.85 : pt === 'curveball' ? 1.15 : 1.0)
    / (0.85 + pitcher.pow / 400);
  /* Father Time drags out every at bat; his stall quirk multiplies the
     meter duration, making pitches read easier for him and everyone
     else who watches him. */
  if (g.batterCtx && g.batterCtx.flags && g.batterCtx.flags.stall) baseSpeed *= 1.4;
  /* ideal timing sweet spot centered around 0.55, shifted by pitcher control */
  const idealBase = pt === 'fastball' ? 0.5 : pt === 'curveball' ? 0.60 : 0.62;
  const fatigue = pitcherFatigue();
  let wobble = (Math.random() - 0.5) * 0.06 * diff.pitcherSkill * fatigue.wobbleMult;
  /* Season ramp, felt from the batter's box: a sharper opponent's pitcher
     works the edges of the meter, so the sweet spot sits further from the
     middle and the timing is less forgiving. Only when the player bats;
     the CPU already reads the ramp through its own jitter. */
  if (playerIsBatting()) {
    const sharp = opponentSharpness();
    wobble *= 1 + sharp * 0.9;
  }
  /* Scarecrow rattles the pitcher. His ideal spot swings wider than anyone
     else's on the roster, so timing him takes reading the meter, not muscle
     memory. */
  if (batter.quirk === 'confuse') {
    wobble += (Math.random() - 0.5) * 0.14;
  }
  /* Medusa petrifies the pitcher: one look and he loses the plate even
     harder than the Scarecrow rattles him. */
  if (batter.quirk === 'petrify') {
    wobble += (Math.random() - 0.5) * 0.20;
  }
  let ideal = clamp(idealBase + wobble, 0.28, 0.78);
  /* Ball is a strike or a ball. The pitcher's control determines it, minus
     any accumulated fatigue for this pitcher over the game. */
  const strikeProb = 0.55 + (pitcher.con || pitcher.def*0.4) / 300 - fatigue.strikeDrop;
  let isStrike = Math.random() < clamp(strikeProb, 0.4, 0.85);

  /* Aim: player-chosen 3x3 zone (0..8; 4 = center) shifts the ideal meter
     spot horizontally and lowers the CPU batter's contact against corners.
     A pitcher's CON stat determines whether they land the pitch in the
     called zone or miss (which flips it to a ball on corner calls). */
  let zoneAim = null;
  if (chosenZone != null && chosenZone >= 0 && chosenZone < 9) {
    const col = chosenZone % 3;         /* 0 in, 1 mid, 2 out */
    const row = Math.floor(chosenZone / 3);  /* 0 high, 1 mid, 2 low */
    const isCorner = col !== 1 && row !== 1;
    const isEdge = !isCorner && chosenZone !== 4;
    zoneAim = { col, row, isCorner, isEdge };
    /* Push the ideal spot toward the corner: inside high shifts one way,
       outside low the other, so the meter target isn't always centered. */
    ideal += (col - 1) * 0.06 + (row - 1) * 0.02;
    ideal = clamp(ideal, 0.18, 0.86);
    /* The pitcher's control decides if the pitch lands in the called
       zone. Miss the corner and it's a ball. */
    const landRoll = Math.random();
    const controlChance = 0.55 + (pitcher.con || 50) / 250 - fatigue.strikeDrop
                       - (isCorner ? 0.20 : isEdge ? 0.08 : 0);
    if (landRoll > clamp(controlChance, 0.30, 0.95)) {
      /* Missed the spot: center pitches still land for strikes, corner
         and edge misses become balls. */
      if (isCorner || isEdge) isStrike = false;
    } else {
      isStrike = true;
    }
  }
  /* Windup: the meter is on screen but does not sweep for a beat. This is
     the player's chance to see the pitcher, the pitch type, the ideal spot,
     and settle. `start` gets set when the sweep actually begins. */
  g.pitch = {
    pt, speed: baseSpeed, ideal, isStrike,
    zoneAim,
    start: performance.now() + BEAT.windup,
    windupUntil: performance.now() + BEAT.windup,
    swung: false,
    hit: false,
  };
  refreshHud();
  runPitchAnimation();
}

/* Install the swing click and space listeners for this pitch. The field
   loop (startFieldLoop) handles all the painting and the "no swing = called
   pitch" transition. When the CPU is batting instead of the player,
   nothing listens for a click; a scheduled CPU swing takes its shot. */
function runPitchAnimation() {
  const g = State.game;
  const p = g.pitch;
  const durMs = p.speed * 1000;
  if (playerIsBatting()) {
    const onClick = (e) => {
      if (p.swung) return;
      /* Clicks on the game's own buttons (Replay, Steal, End Game, the
         pitch picker) are commands, not swings. This handler runs in the
         capture phase, so it has to check the target itself. */
      if (e.target && e.target.closest && e.target.closest('button')) return;
      const now = performance.now();
      if (now < p.windupUntil) return;
      const t = clamp((now - p.start) / durMs, 0, 1);
      p.swung = true;
      resolveSwing(t);
    };
    const onKey = (e) => {
      if (e.code === 'Space') { e.preventDefault(); onClick(e); }
    };
    const teardown = () => {
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('click', onClick, true);
    };
    atBatCleanup = teardown;
    document.addEventListener('keydown', onKey);
    document.addEventListener('click', onClick, true);
    return;
  }
  scheduleCpuSwing();
}

/* CPU batting AI. Reads the pitch's ideal spot, the batter's contact
   stat, and the current count to decide (a) whether to swing at all,
   and (b) how close to the ideal spot to land. Better contact hitters
   land closer; a batter down 0-2 protects the plate. */
function scheduleCpuSwing() {
  const g = State.game;
  const p = g.pitch;
  const batter = currentBatter();
  const diff = DIFF[State.difficulty];
  const durMs = p.speed * 1000;

  /* Swing decision: strikes get swung at more often, balls left alone,
     0-2 counts see the batter foul most anything close. */
  const twoStrikes = g.strikes >= 2;
  const isStrike = p.isStrike;
  let swingProb = isStrike ? 0.68 : 0.20;
  if (twoStrikes) swingProb = isStrike ? 0.92 : 0.55;
  if (g.balls >= 3 && !isStrike) swingProb = 0.10;
  /* Contact hitters swing selectively; hackers hack. */
  swingProb += (batter.con - 60) * 0.001;
  /* Team style: some teams are patient, some hack away. */
  const style = currentBattingTeamStyle();
  if (isStrike) swingProb += style.swing;
  else          swingProb -= style.patience;
  /* Rabid Dog is frenzied: he swings at nearly everything. */
  if (g.batterCtx && g.batterCtx.flags && g.batterCtx.flags.frenzy) swingProb = 0.95;
  const willSwing = Math.random() < clamp(swingProb, 0.05, 0.98);

  if (!willSwing) {
    /* Let the pitch pass; the field loop's called-pitch trigger fires. */
    return;
  }

  /* Where the CPU lands the cursor: closer to ideal with better CON, wider
     spread on hard difficulty (harder to hit their sweet timing). */
  /* Retuned with the zone-keyed contact curve above: the CPU's error is
     now measured against the same sweet zone the player's is, so these
     are wider than they look. Easy opponents miss a lot; hard ones sit
     close enough to the zone to punish a hanging center-cut pitch. */
  const conJitter = (110 - batter.con) / 1400;
  const diffJitter = { easy: 0.30, medium: 0.185, hard: 0.125 }[State.difficulty];
  let jitter = conJitter + diffJitter;
  /* Weak pitch: CPU whiffs badly on their weak pitch. */
  if (p.pt === g.batterCtx.weakPitch) jitter += 0.14;
  /* Corner / edge pitches are harder to square up. */
  if (p.zoneAim) {
    if (p.zoneAim.isCorner) jitter += 0.12;
    else if (p.zoneAim.isEdge) jitter += 0.06;
  }
  /* Team style: wild swingers spread more, disciplined bats less. */
  jitter += style.jitter;
  /* Season ramp: a sharper opponent squares the ball up more often. */
  jitter -= opponentSharpness() * 0.055;
  /* Fresh pitcher vs gassed pitcher moves the needle the other way. */
  const fat = pitcherFatigue();
  jitter -= fat.level * 0.02;
  jitter = clamp(jitter, 0.03, 0.40);

  const dir = Math.random() < 0.5 ? -1 : 1;
  const t = clamp(p.ideal + dir * jitter * Math.random(), 0.02, 0.98);
  /* Time the swing to match that cursor position (fires after the meter
     reaches it). Add the windup so it happens in real time. */
  const fireAt = p.windupUntil + t * durMs;
  const wait = Math.max(0, fireAt - performance.now());
  setTimeout(() => {
    if (!g.pitch || g.pitch !== p || p.swung) return;
    p.swung = true;
    resolveSwing(t);
  }, wait);
}

function resolveCalledPitch() {
  const g = State.game;
  const p = g.pitch;
  if (p.isStrike) { g.strikes++; addLog('Called strike.'); showCallout('STRIKE', 'strike'); Sound.play('strike'); }
  else            { g.balls++;   addLog('Ball.'); showCallout('BALL', 'ball'); Sound.play('ball'); }
  refreshHud();
  if (g.strikes >= 3) return recordOut('called strikeout', true);
  if (g.balls >= 4) return recordWalk();
  setTimeout(throwPitch, BEAT.betweenPitches);
}

function resolveSwing(cursorT) {
  endAtBatCleanup();
  const g = State.game;
  const p = g.pitch;
  const batter = currentBatter();
  const pitcher = currentPitcher();
  const ctx = g.batterCtx || { pow: batter.pow, con: batter.con, spd: batter.spd, flags:{} };
  const diff = DIFF[State.difficulty];
  const half = diff.sweetWidth / 2;
  const perfectDist = Math.abs(cursorT - p.ideal);
  /* Contact quality in [0,1], measured against the SWEET ZONE, not the
     whole meter. The first version used 1 - dist/0.5, and a Monte Carlo
     of that curve showed why the game felt samey: a player with sloppy
     timing (error 0.18) batted .836 against .852 for perfect timing, on
     hard. When the denominator is the full meter, everything within a
     third of the bar is "good contact" and the minigame decides nothing.
     Keyed to the zone, q falls from 1 to 0 across the zone's own width,
     so the difficulty setting (which sets that width) finally matters. */
  const contactBoost = (ctx.con - 50) / 350;
  let contact = perfectDist <= half
    ? clamp(1 - Math.pow(perfectDist / half, 1.6) + contactBoost, 0, 1)
    : 0;
  let inZone = perfectDist <= half;
  /* Near misses foul the ball off; wide misses whiff. Contact hitters get
     a slightly wider foul band, which is what CON feels like in play. */
  const foulBand = half * (1.45 + ctx.con / 350);

  /* Lady Liberty is the joke and the mechanic. She is stone: on any real
     contact the ball leaves the yard, on anything else she strikes out
     looking like a statue would. Nothing in between. */
  if (batter.quirk === 'monument') {
    if (inZone && contact > 0.55) {
      return scheduleContactPlay('home run', batter);
    }
    g.strikes = 3;
    addLog(`${batter.n} does not move. Strike three.`);
    refreshHud();
    return recordOut('called strikeout', true);
  }

  /* Cowardly Lion bails on borderline pitches. His whiff rate on close ones
     is high, but when the pitch is right in the middle he uncorks. */
  if (batter.quirk === 'skittish' && inZone && contact < 0.65 && Math.random() < 0.35) {
    inZone = false;
    contact *= 0.4;
    addLog(`${batter.n} flinches away from the pitch.`);
  }

  /* Whiff. The swing missed entirely. */
  if (!inZone && perfectDist > foulBand) {
    g.strikes++;
    addLog(`${batter.n} swings and misses.`);
    showCallout('SWING AND MISS', 'strike');
    Sound.play('whiff');
    refreshHud();
    if (g.strikes >= 3) return recordOut('swinging strikeout', true);
    return setTimeout(throwPitch, BEAT.afterWhiff);
  }

  /* Foul: near miss on strike, count strike (but never third strike) */
  if (!inZone) {
    if (g.strikes < 2) g.strikes++;
    addLog(`${batter.n} fouls it off.`);
    showCallout('FOUL BALL', 'sub');
    Sound.play('foul');
    refreshHud();
    return setTimeout(throwPitch, BEAT.betweenPitches);
  }

  /* Cowardly Lion who did commit gets a burst of nerve on the swing. */
  let powForRoll = ctx.pow;
  if (batter.quirk === 'skittish' && contact > 0.7) powForRoll = Math.min(100, powForRoll + 15);

  /* In zone: resolve to a batted ball outcome. Rather than mutating the
     bases and firing the callout instantly, we stage the play: bat swing
     then ball trajectory then runners then callout. All of that happens
     in scheduleContactPlay below. */
  /* The homer is gated on q SQUARED: dead-center contact is what clears
     the wall, and power scales it. These constants were tuned against a
     simulation of full plate appearances (scratch tune.mjs): a perfect
     player hits about .67 with 18% homers, a sloppy one about .50, a
     careless one about .30, which is the arcade band this game wants. */
  const hrChance = (0.018 + 0.155 * contact * contact) * (0.45 + powForRoll / 110);
  if (Math.random() < hrChance) return scheduleContactPlay('home run', batter);

  if (Math.random() < (0.045 + 0.115 * contact) * (0.55 + powForRoll / 150)) {
    return scheduleContactPlay(Math.random() < 0.35 ? 'triple' : 'double', batter);
  }
  let hitOdds = 0.13 + contact * 0.36 + (ctx.spd - 50)/450;
  if (batter.k === 'invisible') hitOdds += 0.05;
  if (Math.random() < hitOdds) return scheduleContactPlay('single', batter);
  /* Out on contact: same staging, the callout fires when the fielder gets
     the ball. */
  const out = Math.random() < 0.55 ? 'ground out' : 'fly out';
  return scheduleContactPlay(out, batter);
}

/* -------- Play staging: bat, ball, runners, callout --------
   scheduleContactPlay is what resolveSwing calls after it decides what a
   contacted pitch turns into. It records the outcome onto g.play, kicks
   off a bat swing, then a ball trajectory animation, then applies the
   mutation to the bases with an animated runner tween, then fires the
   callout and moves on. All the timing lives in BEAT. */

function ballTrajectory(kind) {
  const rand = (a,b) => a + Math.random() * (b - a);
  const sign = () => Math.random() < 0.5 ? -1 : 1;
  switch (kind) {
    case 'home run':   return { dx: rand(0.55, 1.05)*sign(), dy: -2.4, arcH: 260, duration: 1500 };
    case 'triple':     return { dx: rand(0.75, 1.2)*sign(),  dy: -1.4, arcH: 150, duration: 1250 };
    case 'double':     return { dx: rand(0.5, 1.0)*sign(),   dy: -1.1, arcH: 110, duration: 1050 };
    case 'single':     return { dx: rand(0.3, 0.7)*sign(),   dy: -0.7, arcH: 60,  duration: 850 };
    case 'fly out':    return { dx: rand(0.15,0.5)*sign(),   dy: -1.3, arcH: 170, duration: 1200, caught: true };
    case 'ground out': return { dx: rand(0.35,0.8)*sign(),   dy: -0.15,arcH: 18,  duration: 700,  caught: true };
  }
  return { dx: 0, dy: 0, arcH: 0, duration: 700 };
}

/* How many bases the batter travels for this outcome. -1 means back to
   home (a HR); -2 means the batter is out (ground/fly out). */
function batterEndBase(kind) {
  return { 'single':0, 'double':1, 'triple':2, 'home run':-1,
           'ground out':-2, 'fly out':-2 }[kind];
}

/* Named waypoints on the diamond, keyed by an integer index. drawField
   converts each index to a pixel position from the current cx/cy/r.
   -1 = home (batter box); 0/1/2 = 1st/2nd/3rd; 3 = home again (a run
   scored, runner is done). */
function waypointForBase(field, idx) {
  const { cx, rx, midY, topY, plateY } = field;
  if (idx === -1) return [cx - 30, plateY + 8];
  if (idx === 0)  return [cx + rx, midY];
  if (idx === 1)  return [cx, topY];
  if (idx === 2)  return [cx - rx, midY];
  if (idx === 3)  return [cx + 2, plateY + 8];
  return [cx, midY];
}

function batterPathIndices(kind) {
  const end = batterEndBase(kind);
  if (end === -2) return [-1, 0];   /* out, runs to first anyway */
  const arr = [-1];
  const target = end === -1 ? 3 : end;
  for (let i = 0; i <= target; i++) arr.push(i);
  return arr;
}
function existingRunnerPathIndices(startBase, kind) {
  const advance = { 'single':1, 'double':2, 'triple':3, 'home run':4 }[kind] || 0;
  const arr = [];
  const end = startBase + advance;
  for (let b = startBase; b <= Math.min(end, 3); b++) arr.push(b);
  return arr;
}
function pathPointAt(field, path, t) {
  if (path.length === 1) return waypointForBase(field, path[0]);
  const scaled = t * (path.length - 1);
  const seg = Math.min(Math.floor(scaled), path.length - 2);
  const frac = scaled - seg;
  const a = waypointForBase(field, path[seg]);
  const b = waypointForBase(field, path[seg + 1]);
  return [a[0] + (b[0] - a[0]) * frac, a[1] + (b[1] - a[1]) * frac];
}

/* Remember the last notable batted ball so it can be replayed. Only real
   highlights are worth keeping: extra base hits and home runs. */
function rememberHighlight(kind, batter, traj) {
  if (kind !== 'home run' && kind !== 'triple' && kind !== 'double') return;
  const g = State.game;
  g.highlight = {
    kind, batterName: batter.n, batterKey: batter.k,
    ball: Object.assign({}, traj),
    inning: g.inning, half: g.half,
  };
}

/* Replay the stored highlight: re-run its ball trajectory over the live
   field with a REPLAY badge, without touching any game state. */
function playHighlight() {
  const g = State.game;
  if (!g || !g.highlight || g.replay) return;
  g.replay = {
    startedAt: performance.now(),
    duration: g.highlight.ball.duration + 500,
    h: g.highlight,
  };
  Sound.play('crack');
  setTimeout(() => { if (State.game) State.game.replay = null; refreshHud(); },
             g.highlight.ball.duration + 600);
  refreshHud();
}

function scheduleContactPlay(kind, batter) {
  const g = State.game;
  /* Bat meets ball. The crack fires immediately, before the ball travels,
     and a gold impact burst pops at the contact point so the hit visibly
     comes OFF THE BAT rather than materializing mid-field. */
  Sound.play('crack');
  {
    const geo = fieldGeom();
    const hitX = geo.cx - 14, hitY = geo.plateY - 4;
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      spawnFx(g, {
        x: hitX, y: hitY, size: 3,
        vx: Math.cos(a) * 140, vy: Math.sin(a) * 140 - 40,
        grav: 200, color: i % 2 ? '#f4c25a' : '#ffffff', life: 340,
      });
    }
  }
  const throwable = kind === 'ground out' && !playerIsBatting();
  if (throwable) return scheduleThrowMinigame(kind, batter);
  const catchable = kind === 'fly out' && !playerIsBatting();
  if (catchable) return scheduleFlyCatchMinigame(kind, batter);
