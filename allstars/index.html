    addLog(`${batter.n} beats the throw. Infield single.`);
    showCallout('INFIELD SINGLE', 'hit');
    Sound.play('cheer');
    applyHitMutation('single', batter);
  } else {
    /* Error: batter to first, everyone else advances an extra base. */
    addLog(`Throwing error. ${batter.n} safe, runners advance.`);
    showCallout('ERROR', 'strike');
    Sound.play('aww');
    applyErrorMutation(batter);
  }
  refreshHud();
  /* Complete the play: clear the animation state and advance to the next
     batter (or end the half). Without this the game freezes right here,
     which is exactly what shipped once. */
  const wasOut = outcome === 'out';
  setTimeout(() => {
    if (!State.game) return;
    State.game.play = null;
    if (wasOut) afterOutTransition();
    else afterHitTransition('single');
  }, 900);
}

/* -------- Fly-ball catch minigame --------
   When the player is fielding and the batter puts one up, the outfielder
   camps under it. A different meter appears: the ball drops into a
   catch window that shrinks toward the middle (mimics glove tracking).
   Nail the green center to catch; ok yellow band is a single that
   drops in; a miss is a triple over the fielder's head. */

function scheduleFlyCatchMinigame(kind, batter) {
  const g = State.game;
  const traj = ballTrajectory(kind);
  const preBases = [...g.bases];
  g.play = {
    kind, batter, isOut: true,
    ball: traj,
    startedAt: performance.now(),
    swingUntil: performance.now() + 240,
    ballUntil: performance.now() + traj.duration,
    runnerStart: performance.now() + Math.max(180, traj.duration - 400),
    runnerUntil: performance.now() + traj.duration + 600,
    preBases,
    batterPath: batterPathIndices(kind),
    runnerPaths: preBases.map((r, i) => r ? existingRunnerPathIndices(i, kind) : null),
    applied: false,
    catchActive: false,
  };
  const geo = fieldGeom();
  const angle = Math.atan2(traj.dy * geo.r, traj.dx * geo.r);
  const landingX = geo.cx + Math.cos(angle) * geo.r * 0.9;
  const landingY = geo.cy + Math.sin(angle) * geo.r * 0.9;
  /* When the ball starts descending, the catch window opens. */
  const openAt = traj.duration * 0.6;
  setTimeout(() => {
    if (!g.play || g.play.applied) return;
    startCatchWindow(kind, batter, landingX, landingY);
  }, openAt);
}

function startCatchWindow(kind, batter, landingX, landingY) {
  const g = State.game;
  if (!g.play) return;
  const fs = currentFieldingTeam().batters;
  const of = [fs[6], fs[7], fs[1]].filter(Boolean);
  const avgDef = of.reduce((a, c) => a + c.def, 0) / (of.length || 1);
  /* A catch bar with a shrinking green center. Not held-still-hard: the
     time window is short (900 ms) and the fielder DEF widens the safe
     zone. */
  const window = {
    duration: 900,
    startedAt: performance.now(),
    greenHalf: 0.10 + (avgDef - 50) / 900,
    yellowHalf: 0.24,
    landingX, landingY,
    resolved: false,
  };
  g.play.catchActive = true;
  g.play.catchWindow = window;

  const finish = (t) => {
    if (window.resolved) return;
    window.resolved = true;
    g.play.catchActive = false;
    document.removeEventListener('keydown', onKey);
    document.removeEventListener('click', onClick, true);
    /* t < 0 means the window expired. */
    let outcome;
    if (t < 0) outcome = 'miss';
    else {
      const d = Math.abs(t - 0.5);
      if (d <= window.greenHalf) outcome = 'catch';
      else if (d <= window.yellowHalf) outcome = 'single';
      else outcome = 'miss';
    }
    resolveCatch(outcome, kind, batter, landingX, landingY);
  };
  const onClick = (e) => {
    if (window.resolved) return;
    const t = clamp((performance.now() - window.startedAt) / window.duration, 0, 1);
    finish(t);
  };
  const onKey = (e) => { if (e.code === 'Space') { e.preventDefault(); onClick(e); } };
  document.addEventListener('keydown', onKey);
  document.addEventListener('click', onClick, true);
  setTimeout(() => finish(-1), window.duration + 20);
}

function resolveCatch(outcome, kind, batter, landingX, landingY) {
  const g = State.game;
  if (!g.play || g.play.applied) return;
  g.play.applied = true;
  if (outcome === 'catch') {
    gloveFlash(g, landingX, landingY);
    Sound.play('catch');
    applyOutMutation('fly out', batter);
  } else if (outcome === 'single') {
    addLog(`${batter.n} bloops it in front of the fielder. Single.`);
    showCallout('DROPS IN', 'hit');
    Sound.play('cheer');
    applyHitMutation('single', batter);
  } else {
    addLog(`Ball drops over the fielder's head. Triple.`);
    showCallout('OVER HIS HEAD', 'strike');
    Sound.play('aww');
    applyHitMutation('triple', batter);
  }
  refreshHud();
  /* Complete the play: same freeze guard as the throw minigame. */
  const wasOut = outcome === 'catch';
  const hitKind = outcome === 'single' ? 'single' : 'triple';
  setTimeout(() => {
    if (!State.game) return;
    State.game.play = null;
    if (wasOut) afterOutTransition();
    else afterHitTransition(hitKind);
  }, 900);
}

function applyErrorMutation(batter) {
  const g = State.game;
  statBump(batter.k, 'ab');
  /* All runners advance two, batter to first. */
  let scored = 0;
  const newBases = [null, null, null];
  for (let i = 2; i >= 0; i--) {
    const runner = g.bases[i];
    if (!runner) continue;
    const dest = i + 2;
    if (dest >= 3) scored++;
    else newBases[dest] = runner;
  }
  newBases[0] = batter;
  g.bases = newBases;
  if (scored) scoreRuns(scored);
}

function afterHitTransition(kind) {
  const g = State.game;
  if (g.walkoff) {
    g.over = true; g.winner = 'home';
    return setTimeout(finishGame, BEAT.afterHomer);
  }
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, kind === 'home run' ? BEAT.afterHomer : BEAT.afterHit);
}

function afterOutTransition() {
  const g = State.game;
  if (g.outs >= 3) return endHalfInning();
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, BEAT.afterOut);
}

function randPos(out) {
  if (out === 'ground out') return ['pitcher','shortstop','second','third','first'][Math.floor(Math.random()*5)];
  return ['left','center','right'][Math.floor(Math.random()*3)];
}

function recordHit(kind, batter) {
  const g = State.game;
  statBump(batter.k,'ab');
  statBump(batter.k,'hits');
  const bases = { 'single':1,'double':2,'triple':3,'home run':4 }[kind];
  if (kind === 'home run') {
    statBump(batter.k,'hr');
    let scored = 1;   /* the batter */
    for (let i=0;i<3;i++) if (g.bases[i]) scored++;
    g.bases = [null,null,null];
    scoreRuns(scored);
    addLog(`${batter.n} crushes it. HOME RUN. ${scored} run${scored>1?'s':''} score.`, true);
    showCallout(`HOME RUN · ${scored} RUN${scored>1?'S':''}`, 'homer');
  } else {
    /* Advance existing runners by `bases`, then place batter */
    let scored = 0;
    const newBases = [null,null,null];
    for (let i=2;i>=0;i--) {
      const runner = g.bases[i];
      if (!runner) continue;
      const dest = i + bases;   /* 0=first, 1=second, 2=third; dest>=3 scores */
      if (dest >= 3) scored++;
      else newBases[dest] = runner;
    }
    if (bases < 4) newBases[bases-1] = batter;
    g.bases = newBases;
    if (scored) scoreRuns(scored);
    addLog(`${batter.n} lines a ${kind}${scored ? `, ${scored} run${scored>1?'s':''} score` : ''}.`);
    showCallout(kind.toUpperCase() + (scored ? ` · ${scored} IN` : ''), scored ? 'homer' : 'hit');
  }
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, kind === 'home run' ? BEAT.afterHomer : BEAT.afterHit);
}

function recordWalk() {
  const g = State.game;
  const batter = currentBatter();
  addLog(`${batter.n} walks.`);
  showCallout('WALK', 'sub');
  const bases = g.bases;
  let scored = 0;
  if (bases[0] && bases[1] && bases[2]) { scored = 1; g.bases = [batter, bases[0], bases[1]]; }
  else if (bases[0] && bases[1]) { g.bases = [batter, bases[0], bases[1]]; }
  else if (bases[0]) { g.bases = [batter, bases[0], bases[2]]; }
  else { g.bases = [batter, bases[1], bases[2]]; }
  if (scored) scoreRuns(scored);
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, BEAT.afterWalk);
}

function recordOut(reason, isStrikeout) {
  const g = State.game;
  const batter = currentBatter();
  /* Phoenix rebirth: the first strikeout she'd take in a game becomes a
     walk to first instead. She rises from the ashes. */
  if (isStrikeout && g.batterCtx && g.batterCtx.flags && g.batterCtx.flags.rebirth && !g.phoenixUsed) {
    g.phoenixUsed = true;
    addLog(`${batter.n} rises from the ashes. Reaches first.`, true);
    showCallout('REBIRTH', 'homer');
    g.signature = { kind: 'torch', until: performance.now() + 1200 };
    Sound.play('cheer');
    return recordWalk();
  }
  statBump(batter.k,'ab');
  if (isStrikeout) statBump(batter.k,'so');
  g.outs++;
  addLog(`${batter.n} out (${reason}). ${g.outs} out.`);
  if (isStrikeout) showCallout('STRIKEOUT', 'strike');
  if (g.outs >= 3) return endHalfInning();
  nextBatter();
  refreshHud();
  setTimeout(startAtBat, BEAT.afterOut);
}

function nextBatter() {
  const t = currentBattingTeam();
  t.idx = (t.idx + 1) % 9;
  const g = State.game;
  g.balls = 0; g.strikes = 0;
}

function scoreRuns(n) {
  const g = State.game;
  const t = currentBattingTeam();
  t.score += n;
  /* File the runs on the line score under the current inning. */
  const key = g.half === 'top' ? 'away' : 'home';
  while (g.lineScore[key].length < g.inning) g.lineScore[key].push(0);
  g.lineScore[key][g.inning - 1] += n;
  /* Walk-off: if the HOME team is batting in the bottom of the final
     inning (or extra) and their score exceeds the away score, the game
     ends right here, mid-inning. Trigger a special callout and let the
     transition timers wind down before firing the result screen. */
  if (g.half === 'bottom' && g.inning >= g.innings && g.home.score > g.away.score) {
    g.walkoff = true;
    showCallout('WALK-OFF!', 'homer');
  }
}

function endHalfInning() {
  const g = State.game;
  addLog(`Side retired. End of ${g.half === 'top' ? 'top' : 'bottom'} of ${g.inning}.`, true);
  showCallout('SIDE RETIRED', 'homer');
  Sound.play('inning');
  g.bases = [null,null,null];
  g.outs = 0;
  g.balls = 0; g.strikes = 0;
  if (g.half === 'top') {
    g.half = 'bottom';
  } else {
    g.half = 'top';
    g.inning++;
  }
  const done = checkGameOver();
  refreshHud();
  if (done) return finishGame();
  /* Also fire a walk-off check right after flipping to the bottom of the
     final inning, in case the home team is already ahead. */
  if (checkWalkOff()) return finishGame();
  setTimeout(startAtBat, BEAT.betweenHalfInnings);
}

function checkGameOver() {
  const g = State.game;
  /* Walk-off in real time: home team is batting in the bottom of the
     final (or later) inning and takes the lead, the game ends on the
     spot. checkForWalkoff runs after every scoring play so the game can
     end mid-inning. */
  /* After 9 (or configured) full innings, tied continues; unless capped for arcade. */
  if (g.inning > g.innings) {
    if (g.away.score !== g.home.score) {
      g.over = true;
      g.winner = g.home.score > g.away.score ? 'home' : 'away';
      return true;
    }
  }
  /* Walk off: home leads at end of top after regulation */
  if (g.inning > g.innings && g.half === 'bottom' && g.home.score > g.away.score) {
    g.over = true; g.winner = 'home'; return true;
  }
  /* If we're in bottom of last inning and home leads, skip */
  if (g.inning === g.innings && g.half === 'top' && g.home.score > g.away.score && g.outs === 0 && g.away.idx === 0) {
    /* We just wrapped, home already leads, no need to bat bottom */
    /* Not triggered normally; the natural flow handles this */
  }
  /* End of top of final inning: if home is ahead, home does not bat */
  if (g.inning > g.innings && g.half === 'bottom') {
    /* We flipped past regulation with home leading or tied is handled above */
  }
  /* Skip bottom half if home leads after top of final inning */
  if (g.half === 'bottom' && g.inning === g.innings && g.home.score > g.away.score) {
    g.over = true; g.winner = 'home'; return true;
  }
  /* Cap arcade blowouts at 25 to prevent slog */
  if (g.away.score - g.home.score >= 15 && g.inning >= Math.max(3, g.innings - 1)) {
    g.over = true; g.winner = 'away'; return true;
  }
  if (g.home.score - g.away.score >= 15 && g.inning >= Math.max(3, g.innings - 1)) {
    g.over = true; g.winner = 'home'; return true;
  }
  return false;
}

function finishGame() {
  const g = State.game;
  g.live = false;
  stopFieldLoop();
  Sound.music.stop();
  const you = g.away.isYou ? g.away : g.home;
  const foe = g.away.isYou ? g.home : g.away;
  const win = you.score > foe.score;

  if (State.mode === 'season' && State.season && !State.season.playoffs) {
    State.season.results.push({
      opponent: foe.name, win, you: you.score, them: foe.score,
    });
    /* Roll individual stats forward */
    const ps = State.season.playerStats;
    for (const k of Object.keys(g.stats.hr)) ps.hr += g.stats.hr[k];
    for (const k of Object.keys(g.stats.so)) ps.so += g.stats.so[k];
    for (const k of Object.keys(g.stats.sb || {})) ps.sb += g.stats.sb[k];
    for (const k of Object.keys(g.stats.hits)) ps.hits += g.stats.hits[k];
    for (const k of Object.keys(g.stats.ab)) ps.ab += g.stats.ab[k];
    /* Per-character season stats for the leaderboard. */
    const per = State.season.perPlayer || (State.season.perPlayer = {});
    const bumpPer = (k, key, n) => {
      if (!per[k]) per[k] = { hr:0, hits:0, ab:0, so:0, sb:0 };
      per[k][key] += n;
    };
    for (const [k, v] of Object.entries(g.stats.hr || {})) bumpPer(k, 'hr', v);
    for (const [k, v] of Object.entries(g.stats.so || {})) bumpPer(k, 'so', v);
    for (const [k, v] of Object.entries(g.stats.sb || {})) bumpPer(k, 'sb', v);
    for (const [k, v] of Object.entries(g.stats.hits || {})) bumpPer(k, 'hits', v);
    for (const [k, v] of Object.entries(g.stats.ab || {})) bumpPer(k, 'ab', v);
    saveSeason(State.season);
  } else if (State.mode === 'playoff' && State.season) {
    /* Record playoff result */
    const P = State.season.playoffs;
    const match = g.mode === 'playoff' && g.round === 'semi' ? P.semis[g.matchIdx] : P.final;
    const winner = win
      ? (g.away.isYou ? match.away : match.home)
      : (g.away.isYou ? match.home : match.away);
    match.result = { homeScore: g.home.score, awayScore: g.away.score, winner };
    /* If any CPU semis remain, they will sim next when the bracket page shows */
    saveSeason(State.season);
    if (win) PROGRESS.playoffWins = (PROGRESS.playoffWins|0) + 1;
    if (win && g.round === 'final') PROGRESS.titles = (PROGRESS.titles|0) + 1;
  }

  /* Achievement progress from any game, whatever the mode. */
  const yourHR = you.batters.reduce((a,b) => a + (g.stats.hr[b.k] || 0), 0);
  if (State.mode === 'season' && State.season) {
    PROGRESS.seasonHR = Math.max(PROGRESS.seasonHR|0, State.season.playerStats.hr|0);
  } else {
    PROGRESS.seasonHR = Math.max(PROGRESS.seasonHR|0, yourHR);
  }
  if (win && (you.score - foe.score) >= 10) PROGRESS.blowouts = (PROGRESS.blowouts|0) + 1;
  if (g.innings >= 9) PROGRESS.nineInningGames = (PROGRESS.nineInningGames|0) + 1;
  /* Comeback: you trailed at some point on the line score and still won. */
  if (win) {
    let aw = 0, hm = 0, trailed = false;
    const n = Math.max(g.lineScore.away.length, g.lineScore.home.length);
    for (let i = 0; i < n; i++) {
      aw += g.lineScore.away[i] || 0;
      hm += g.lineScore.home[i] || 0;
      const mine = you === g.away ? aw : hm;
      const theirs = you === g.away ? hm : aw;
      if (mine < theirs) trailed = true;
    }
    if (trailed) PROGRESS.comebacks = (PROGRESS.comebacks|0) + 1;
  }
  saveProgress();
  g.freshUnlocks = refreshUnlocks();

  State.screen = 'result';
  render();
}

/* ============================================================================
   FIELD AND METER RENDERING
   ============================================================================ */

/* The field canvas has a fixed internal size, so play staging code can
   compute the same geometry drawField uses without holding a context. */
function fieldGeom() {
  const w = 960, h = 660;
  return { w, h, cx: w/2, cy: h*0.58, r: Math.min(w, h) * 0.30 };
}

/* -------- Particles --------
   One flat array on the game. Everything is a square that moves, falls,
   and fades. Dust for slides and landings, confetti for homers, a white
   flash for catches. Updated and drawn once per frame inside drawField. */
function spawnFx(g, p) {
  if (!g.fx) g.fx = [];
  if (g.fx.length > 400) return;   /* hard cap, keeps a confetti spam sane */
  g.fx.push(p);
}
function dustPuff(g, x, y, color) {
  for (let i = 0; i < 9; i++) {
    spawnFx(g, {
      x, y, size: 3,
      vx: (Math.random() - 0.5) * 80,
      vy: -20 - Math.random() * 50,
      grav: 160,
      color: color || 'rgba(205,170,120,.9)',
      life: 450 + Math.random() * 300,
    });
  }
}
function gloveFlash(g, x, y) {
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2;
    spawnFx(g, {
      x, y, size: 2,
      vx: Math.cos(a) * 90, vy: Math.sin(a) * 90,
      grav: 0, color: '#eaeaea', life: 300,
    });
  }
}
function confettiBurst(g, x, y) {
  const cols = ['#f4c25a','#d24949','#5bb083','#6aa7c4','#b08ac6','#eaeaea'];
  for (let i = 0; i < 46; i++) {
    spawnFx(g, {
      x: x + (Math.random() - 0.5) * 120, y,
      size: 4,
      vx: (Math.random() - 0.5) * 220,
      vy: -40 - Math.random() * 180,
      grav: 210,
      color: cols[i % cols.length],
      life: 1100 + Math.random() * 700,
    });
  }
}
function updateAndDrawFx(ctx, g) {
  if (!g.fx || !g.fx.length) { g.fxTime = performance.now(); return; }
  const now = performance.now();
  const dt = Math.min(50, now - (g.fxTime || now));
  g.fxTime = now;
  g.fx = g.fx.filter(p => (p.life -= dt) > 0);
  for (const p of g.fx) {
    p.x += p.vx * dt / 1000;
    p.y += p.vy * dt / 1000;
    p.vy += (p.grav || 0) * dt / 1000;
    ctx.globalAlpha = clamp(p.life / 400, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawField(ctx, w, h, t, pitch, inWindup) {
  /* Night sky, crowd, light towers, outfield wall, grass, diamond.
     Everything sized to the field's own w and h so the canvas can be
     resized. A home run shakes the whole camera for half a second. */
  ctx.save();
  const gShake = State.game;
  if (gShake && gShake.shakeUntil && performance.now() < gShake.shakeUntil) {
    const mag = 6 * (gShake.shakeUntil - performance.now()) / 500;
    ctx.translate((Math.random() - 0.5) * mag * 2, (Math.random() - 0.5) * mag * 2);
  }

  const theme = currentTheme();

  ctx.fillStyle = '#0b1015';
  ctx.fillRect(-8, -8, w + 16, h + 16);

  const skyH = h * 0.13;
  ctx.fillStyle = theme.sky;
  ctx.fillRect(0, 0, w, skyH);
  /* a few stars, dimmed on daytime themes */
  if (theme.sky !== '#5aa0d0') {
    ctx.fillStyle = 'rgba(234,234,234,.5)';
    for (let x = 13; x < w; x += 61) ctx.fillRect(x, 6 + (x * 7) % 18, 2, 2);
  }

  /* Landmark: theme-specific silhouette in the sky area. */
  if (theme.landmark) theme.landmark(ctx, w, h);

  /* Light towers, glowing */
  const tower = (tx) => {
    ctx.fillStyle = '#2a3644';
    ctx.fillRect(tx - 2, 14, 4, skyH - 14);
    ctx.fillStyle = '#1a2430';
    ctx.fillRect(tx - 16, 6, 32, 12);
    for (let row = 0; row < 2; row++) {
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = '#f5ecc8';
        ctx.fillRect(tx - 13 + i * 8, 8 + row * 5, 4, 3);
      }
    }
    const glow = ctx.createRadialGradient(tx, 12, 2, tx, 12, 60);
    glow.addColorStop(0, 'rgba(245,236,200,.20)');
    glow.addColorStop(1, 'rgba(245,236,200,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(tx - 60, 0, 120, 80);
  };
  tower(w * 0.14);
  tower(w * 0.86);

  /* Crowd: three rows of colored dots in the stands, with a slow wave of
     brighter fans rolling through so the place feels alive. */
  const crowdCols = theme.crowd;
  const tick = Math.floor(performance.now() / 350);
  for (let row = 0; row < 3; row++) {
    const y = skyH - 17 + row * 5;
    for (let x = 4; x < w; x += 7) {
      const v = (x * 7 + row * 13) % 10;
      if (v >= 8) continue;
      const lively = ((x * 31 + row * 17 + tick) % 47) === 0;
      ctx.fillStyle = lively ? '#e8d8b0' : crowdCols[v % 5];
      ctx.fillRect(x, lively ? y - 2 : y, 3, 3);
    }
  }

  /* Outfield wall: themed color and yellow line at the top. */
  const wallY = skyH;
  const wallH = 20;
  ctx.fillStyle = theme.wall;
  ctx.fillRect(0, wallY, w, wallH);
  ctx.fillStyle = theme.wallLine;
  ctx.fillRect(0, wallY, w, 2);
  ctx.fillStyle = theme.marker;
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('342', w * 0.12, wallY + wallH / 2 + 1);
  ctx.fillText('408', w * 0.50, wallY + wallH / 2 + 1);
  ctx.fillText('342', w * 0.88, wallY + wallH / 2 + 1);

  /* Outfield grass, themed, with a vertical light-to-dark gradient so the
     field recedes rather than sitting flat. */
  const grassY = wallY + wallH;
  ctx.fillStyle = theme.grass;
  ctx.fillRect(0, grassY, w, h - grassY);
  const gGrad = ctx.createLinearGradient(0, grassY, 0, h);
  gGrad.addColorStop(0, 'rgba(255,255,255,.08)');
  gGrad.addColorStop(0.5, 'rgba(0,0,0,0)');
  gGrad.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = gGrad;
  ctx.fillRect(0, grassY, w, h - grassY);

  /* Home-plate camera: put the plate in the lower portion, mound up. */
  const cx = w/2;
  const cy = h * 0.58;
  const r = Math.min(w, h) * 0.30;
  const plateY = cy + r;

  /* Fan-mowed grass: alternating arc bands radiating from home plate,
     the way a real crew mows an outfield. Far more organic than flat
     horizontal stripes. */
  for (let band = 0; band < 7; band++) {
    const r0 = r * 0.8 + band * ((h - grassY) / 5.2);
    ctx.strokeStyle = band % 2 === 0 ? 'rgba(255,255,255,.035)' : 'rgba(0,0,0,.05)';
    ctx.lineWidth = (h - grassY) / 5.2;
    ctx.beginPath();
    ctx.arc(cx, plateY, r0, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
  }
  /* Grass speckle: deterministic hash dots, two tones. */
  for (let i = 0; i < 240; i++) {
    const sx = (i * 227 + 53) % w;
    const sy = grassY + ((i * 157 + 31) % (h - grassY));
    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.045)' : 'rgba(0,0,0,.06)';
    ctx.fillRect(sx, sy, 2, 2);
  }
  /* Warning track along the wall, themed. */
  ctx.fillStyle = theme.track;
  ctx.fillRect(0, grassY, w, 10);

  /* Rounded-organic path helper: quadratic-curve blob through points,
     borrowed from the golf tracer's shape language. */
  const blobPath = (pts) => {
    const n = pts.length;
    const mid = (a, b) => [(a[0]+b[0])/2, (a[1]+b[1])/2];
    let m = mid(pts[n-1], pts[0]);
    ctx.beginPath();
    ctx.moveTo(m[0], m[1]);
    for (let i = 0; i < n; i++) {
      const p = pts[i], q = pts[(i+1)%n];
      const mm = mid(p, q);
      ctx.quadraticCurveTo(p[0], p[1], mm[0], mm[1]);
    }
    ctx.closePath();
  };

  const DIRT = '#8b5a24';
  const DIRT_DARK = '#6e451c';
  const basePts = [
    [cx, cy - r],        /* second */
    [cx + r, cy],        /* first */
    [cx, plateY],        /* home */
    [cx - r, cy],        /* third */
  ];

  /* Dirt basepaths: a wide stroked loop through the four bases, with
     rounded corners. The infield interior stays grass, like a modern
     park, which reads far less geometric than a filled diamond. */
  blobPath([
    [cx, cy - r], [cx + r*0.55, cy - r*0.55],
    [cx + r, cy], [cx + r*0.55, cy + r*0.55],
    [cx, plateY], [cx - r*0.55, cy + r*0.55],
    [cx - r, cy], [cx - r*0.55, cy - r*0.55],
  ]);
  ctx.strokeStyle = DIRT;
  ctx.lineWidth = 17;
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.12)';
  ctx.lineWidth = 3;
  ctx.stroke();

  /* Dirt cutout circles at each base, home plate area, and the mound. */
  const dirtCircle = (x, y, rad) => {
    const grd = ctx.createRadialGradient(x, y - rad*0.3, rad*0.2, x, y, rad);
    grd.addColorStop(0, '#a06a30');
    grd.addColorStop(1, DIRT_DARK);
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI*2); ctx.fill();
  };
  dirtCircle(cx + r, cy, 17);       /* first */
  dirtCircle(cx, cy - r, 17);       /* second */
  dirtCircle(cx - r, cy, 17);       /* third */
  dirtCircle(cx, plateY, 24);       /* home plate circle */
  dirtCircle(cx, cy, 21);           /* mound */
  /* Dirt speckle inside the circles and paths. */
  for (let i = 0; i < 60; i++) {
    const a = (i * 2.399963);   /* golden angle scatter */
    const rad = 20 * Math.sqrt((i % 30) / 30);
    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.08)';
    ctx.fillRect(cx + Math.cos(a) * rad, plateY + Math.sin(a) * rad * 0.7, 2, 2);
    ctx.fillRect(cx + Math.cos(a + 1) * rad, cy + Math.sin(a + 1) * rad * 0.7, 2, 2);
  }

  /* Foul lines */
  ctx.strokeStyle = 'rgba(234,234,234,.85)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, plateY);
  ctx.lineTo(cx - w, plateY + w);   /* down-left */
  ctx.moveTo(cx, plateY);
  ctx.lineTo(cx + w, plateY + w);   /* down-right */
  ctx.stroke();

  /* Batter's boxes: soft chalk */
  ctx.strokeStyle = 'rgba(255,255,255,.30)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(cx - 34, plateY - 8, 26, 32);
  ctx.strokeRect(cx + 8, plateY - 8, 26, 32);

  /* Bases: diamonds rather than squares, with a shadow edge. */
  const bases = [
    [cx + r, cy],
    [cx, cy - r],
    [cx - r, cy],
  ];
  for (const [bx, by] of bases) {
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath();
    ctx.moveTo(bx, by - 7); ctx.lineTo(bx + 8, by + 1); ctx.lineTo(bx, by + 9); ctx.lineTo(bx - 8, by + 1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#eaeaea';
    ctx.beginPath();
    ctx.moveTo(bx, by - 8); ctx.lineTo(bx + 8, by); ctx.lineTo(bx, by + 8); ctx.lineTo(bx - 8, by);
    ctx.closePath(); ctx.fill();
  }

  /* Home plate: pentagon */
  ctx.fillStyle = '#eaeaea';
  ctx.beginPath();
  ctx.moveTo(cx - 10, plateY);
  ctx.lineTo(cx + 10, plateY);
  ctx.lineTo(cx + 10, plateY + 6);
  ctx.lineTo(cx, plateY + 12);
  ctx.lineTo(cx - 10, plateY + 6);
  ctx.closePath();
  ctx.fill();

  /* Pitcher's rubber on the mound circle drawn above. */
  ctx.fillStyle = '#eaeaea';
  ctx.fillRect(cx - 8, cy - 2, 16, 4);

  /* Fielders and defense are always drawn. The batter and base runners
     get drawn either statically at their bases (no active play) or as
     animated waypoints along their paths (a play is in flight). */
  const g = State.game;
  const field = { cx, cy, r };

  if (g) {
    /* Catcher behind plate */
    const catcher = currentFieldingTeam().batters[8] || currentFieldingTeam().batters[1];
    if (catcher && catcher.pal) drawRunner(ctx, cx, cy + r + 22, catcher, 2.4);
    /* Pitcher on the mound: windup for the first 65% of the pitch's
       travel, release for the last 35%, then idle. */
    const pit = currentPitcher();
    let pitcherPose = null;
    if (pitch && !inWindup) {
      pitcherPose = t < 0.35 ? 'release' : null;
    } else if (pitch && inWindup) {
      pitcherPose = 'windup';
    }
    if (pit) drawRunner(ctx, cx, cy - 6, pit, 3, pitcherPose);
    /* Fielder cluster */
    const fs = currentFieldingTeam().batters;
    if (fs[2]) drawRunner(ctx, cx - r*0.55, cy - r*0.15, fs[2], 2.2);
    if (fs[3]) drawRunner(ctx, cx + r*0.55, cy - r*0.15, fs[3], 2.2);
    if (fs[4]) drawRunner(ctx, cx + r*0.85, cy + r*0.10, fs[4], 2.2);
    if (fs[5]) drawRunner(ctx, cx - r*0.85, cy + r*0.10, fs[5], 2.2);
    if (fs[6]) drawRunner(ctx, cx - w*0.28, cy - h*0.14, fs[6], 2.4);
    if (fs[7]) drawRunner(ctx, cx,           cy - h*0.20, fs[7], 2.4);
    if (fs[1]) drawRunner(ctx, cx + w*0.28, cy - h*0.14, fs[1], 2.4);

    if (g.play) {
      /* A contact play is animating. Draw the pre-play runners along
         their paths, and the batter as another runner along their own
         path. The bases themselves are only rewritten when the play's
         apply timer fires. */
      const p = g.play;
      const now = performance.now();
      const rt = clamp((now - p.runnerStart) / (p.runnerUntil - p.runnerStart), 0, 1);
      const runFrame = Math.floor(now / 130) % 2 === 0 ? 'run-a' : 'run-b';
      p.preBases.forEach((runner, i) => {
        if (!runner || !p.runnerPaths[i]) return;
        const [rx, ry] = pathPointAt(field, p.runnerPaths[i], rt);
        drawRunner(ctx, rx, ry - 4, runner, 2.6, rt > 0 && rt < 1 ? runFrame : null);
      });
      /* Batter as runner: starts moving at the same time as the ball is */
      const bt = clamp((now - p.startedAt) / Math.max(300, p.ball.duration - 100), 0, 1);
      const [bx, by] = pathPointAt(field, p.batterPath, bt);
      drawRunner(ctx, bx, by - 4, p.batter, 3, bt > 0.05 && bt < 0.98 ? runFrame : null);
      /* Bat swing arc, first 240ms of the play */
      if (now < p.swingUntil) {
        const st = clamp((now - p.startedAt) / (p.swingUntil - p.startedAt), 0, 1);
        drawBatSwing(ctx, cx - 22, cy + r + 8, st);
      }
      /* Ball trajectory: plate to landing spot, with a ground shadow so
         the arc height reads. */
      if (now < p.ballUntil) {
        const bt2 = clamp((now - p.startedAt) / p.ball.duration, 0, 1);
        /* Batted balls leave from the bat's contact point, just off the
           batter's box, not from the middle of the plate. */
        const startX = cx - 12, startY = cy + r - 2;
        const endX = startX + p.ball.dx * r;
        const endY = cy + p.ball.dy * r;
        const arc = 4 * p.ball.arcH * bt2 * (1 - bt2);
        const bxx = startX + (endX - startX) * bt2;
        const byy = startY + (endY - startY) * bt2 - arc;
        /* Ground level for the shadow: the ball's own linear path (no arc). */
        const gy = startY + (endY - startY) * bt2;
        drawBaseball(ctx, bxx, byy, gy);
      }
    } else {
      /* No play in flight: runners are static on their bases, batter
         stands in the batter's box. */
      const bs = g.bases;
      if (bs[0]) drawRunner(ctx, bases[0][0], bases[0][1] - 4, bs[0], 2.6);
      if (bs[1]) drawRunner(ctx, bases[1][0], bases[1][1] - 4, bs[1], 2.6);
      if (bs[2]) drawRunner(ctx, bases[2][0], bases[2][1] - 4, bs[2], 2.6);
      const batter = currentBatter();
      if (batter) drawRunner(ctx, cx - 22, cy + r + 6, batter, 3, 'batting');
    }
  }

  /* Pitch ball moving from mound to plate. Only when no contact-play is
     in flight (so the ball isn't drawn twice).

     TIMING CONTRACT: the ball must ARRIVE AT THE PLATE exactly when the
     meter cursor crosses the pitch's ideal spot, so swinging when the
     ball reaches the hitter is the same thing as swinging in the green
     zone. The meter runs 0..1 over the pitch duration; the ball's own
     travel is therefore remapped to finish at t = ideal. Past that
     point the ball sits in the catcher's mitt. */
  if (pitch && !inWindup && !(g && g.play)) {
    const bx = cx;
    const by = cy;
    const px = cx;
    const py = cy + r - 4;
    const arrive = Math.max(0.22, pitch.ideal);
    let e = clamp(t / arrive, 0, 1);
    /* Per-pitch flight character: fastball rides straight and hard, the
       curveball bends late and big, the changeup floats then dies. */
    if (pitch.pt === 'changeup') e = Math.pow(e, 1.45);
    let ballX = bx + (px - bx) * e;
    let ballY = by + (py - by) * e;
    if (pitch.pt === 'curveball') {
      /* Late break: barely moves early, sweeps hard in the last third. */
      const bend = Math.pow(e, 2.2) * Math.sin(e * Math.PI);
      ballX += bend * 34 * (pitch.ideal < 0.5 ? -1 : 1);
    } else if (pitch.pt === 'changeup') {
      /* Small fade plus a visible dip at the end. */
      ballX += Math.sin(e * Math.PI) * 8;
      ballY += Math.pow(e, 3) * 10;
    }
    /* Trail: three ghosts behind the ball so speed reads. */
    for (let gi = 1; gi <= 3; gi++) {
      const ge = clamp(e - gi * 0.05, 0, 1);
      const gx = bx + (px - bx) * ge;
      let gyy = by + (py - by) * ge;
      ctx.fillStyle = `rgba(255,255,255,${0.22 - gi * 0.06})`;
      ctx.beginPath(); ctx.arc(gx, gyy, 4 - gi, 0, Math.PI*2); ctx.fill();
    }
    drawBaseball(ctx, ballX, ballY);
  }

  /* Signature moment overlays: character-specific spectacle that lands
     on top of the field during a big at bat. Each one runs for its
     own window and clears itself. */
  if (g && g.signature) {
    const sig = g.signature;
    const now = performance.now();
    if (now < sig.until) {
      const rem = (sig.until - now) / 1600;
      const alpha = clamp(rem * 1.4, 0, 1);
      if (sig.kind === 'chest') {
        /* KONG chest beat: darken the field, thump text scales in. */
        ctx.fillStyle = `rgba(0,0,0,${0.35 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = `bold ${Math.floor(84 - rem * 30)}px monospace`;
        ctx.fillStyle = `rgba(255,220,140,${alpha})`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('THUMP!', cx, cy - 40);
        ctx.font = 'bold 36px monospace';
        ctx.fillText('THUMP!', cx + 90, cy + 40);
      } else if (sig.kind === 'bats') {
        /* DRACULA bat swarm: scattered black bats fluttering across. */
        for (let i = 0; i < 22; i++) {
          const off = (i * 137 + Math.floor(now / 30)) % 360;
          const bx = ((off * 3) % w);
          const by = ((off * 5) % h);
          ctx.fillStyle = `rgba(20,10,20,${alpha})`;
          ctx.fillRect(bx, by, 6, 2);
          ctx.fillRect(bx - 3, by + 2, 12, 2);
        }
        ctx.font = 'bold 40px serif';
        ctx.fillStyle = `rgba(196,50,50,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('~ NIGHT FALLS ~', cx, cy - 60);
      } else if (sig.kind === 'flex') {
        /* FRANKY flex: green flash + bolts */
        ctx.fillStyle = `rgba(126,168,106,${0.28 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = 'bold 48px monospace';
        ctx.fillStyle = `rgba(201,162,86,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('IT LIVES', cx, cy - 20);
      } else if (sig.kind === 'anchor') {
        /* POPEYE anchor: forearm silhouette + horn */
        ctx.fillStyle = `rgba(198,57,44,${0.22 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = 'bold 44px monospace';
        ctx.fillStyle = `rgba(255,235,180,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('AH-GA-GA-GA-GA!', cx, cy - 20);
      } else if (sig.kind === 'arrow') {
        /* ROBIN HOOD arrow zips across the field. */
        const p = 1 - rem;
        const ax = w * p;
        const ay = cy - 30 + Math.sin(p * Math.PI) * 40;
        ctx.strokeStyle = `rgba(244,194,90,${alpha})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(ax - 40, ay); ctx.lineTo(ax, ay); ctx.stroke();
        ctx.fillStyle = `rgba(90,50,20,${alpha})`;
        ctx.fillRect(ax, ay - 3, 6, 6);
        ctx.font = 'bold 32px serif';
        ctx.fillStyle = `rgba(90,140,80,${alpha})`;
        ctx.fillText('BULLSEYE', cx, cy - 60);
      } else if (sig.kind === 'flies') {
        /* PETER PAN takes off */
        const p = 1 - rem;
        ctx.font = 'bold 40px monospace';
        ctx.fillStyle = `rgba(244,194,90,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('FLIES AWAY', cx, cy - 80 - p * 60);
        /* Fairy dust trail */
        for (let i = 0; i < 20; i++) {
          const dx = cx + (Math.random() - 0.5) * 120;
          const dy = cy - p * 100 + Math.random() * 60;
          ctx.fillStyle = `rgba(244,194,90,${alpha * Math.random()})`;
          ctx.fillRect(dx, dy, 2, 2);
        }
      } else if (sig.kind === 'gallop') {
        /* CENTAUR gallops with motion lines */
        ctx.strokeStyle = `rgba(240,220,180,${alpha * 0.7})`;
        ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          const y = cy + (i - 3) * 8;
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w * (1 - rem), y); ctx.stroke();
        }
        ctx.font = 'bold 36px monospace';
        ctx.fillStyle = `rgba(240,220,180,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('THUNDERING HOOVES', cx, cy - 50);
      } else if (sig.kind === 'drain') {
        /* CHUPACABRA drains: violet-green haze */
        ctx.fillStyle = `rgba(90,180,120,${0.28 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = 'bold 40px monospace';
        ctx.fillStyle = `rgba(244,220,90,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('DRAINED', cx, cy - 20);
      } else if (sig.kind === 'snarl') {
        /* RABID DOG snarl: quick red streaks */
        for (let i = 0; i < 12; i++) {
          const rx = Math.random() * w;
          const ry = Math.random() * h;
          ctx.fillStyle = `rgba(201,75,26,${alpha * 0.35})`;
          ctx.fillRect(rx, ry, 40, 2);
        }
        ctx.font = 'bold 36px monospace';
        ctx.fillStyle = `rgba(201,75,26,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('SNARL!', cx, cy - 20);
      } else if (sig.kind === 'sleigh') {
        /* SANTA sleigh across the sky */
        const p = 1 - rem;
        const sx = w * (1 - p);
        ctx.fillStyle = `rgba(201,48,48,${alpha})`;
        ctx.fillRect(sx, 40, 30, 8);
        ctx.fillStyle = `rgba(240,220,180,${alpha})`;
        ctx.fillRect(sx - 8, 44, 40, 2);
        ctx.font = 'bold 32px serif';
        ctx.fillStyle = `rgba(201,48,48,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('HO HO HO', cx, cy - 40);
      } else if (sig.kind === 'torch') {
        /* LADY LIBERTY torch flash */
        ctx.fillStyle = `rgba(244,194,90,${0.25 * alpha})`;
        ctx.fillRect(0, 0, w, h);
        ctx.font = 'bold 40px serif';
        ctx.fillStyle = `rgba(109,184,162,${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText('LIBERTY LEVELED', cx, cy - 20);
      }
    } else {
      g.signature = null;
    }
  }

  /* Catch minigame overlay: appears when a fly ball is coming down toward
     an outfielder. A small ring shrinks around the landing spot; nail
     the tightest ring for a catch. */
  if (g && g.play && g.play.catchActive && g.play.catchWindow) {
    const cw = g.play.catchWindow;
    const now = performance.now();
    const t = clamp((now - cw.startedAt) / cw.duration, 0, 1);
    const [lx, ly] = [cw.landingX, cw.landingY];
    /* Green target ring: shrinks as t moves through the middle, widens
       past the sweet spot. Radius drives visual read of when to click. */
    const shrink = 1 - 4 * Math.abs(t - 0.5) * (1 - Math.abs(t - 0.5));
    const rBig = 46;
    const rSmall = 12;
    const rNow = rSmall + (rBig - rSmall) * shrink;
    ctx.strokeStyle = '#5bb083';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(lx, ly, rNow, 0, Math.PI * 2); ctx.stroke();
    /* Inner sweet ring */
    ctx.strokeStyle = 'rgba(244,194,90,.9)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(lx, ly, rSmall, 0, Math.PI * 2); ctx.stroke();
    /* Label */
    ctx.fillStyle = '#f4c25a';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('CATCH IT!', lx, ly - rBig - 12);
    ctx.fillText('SPACE / CLICK', lx, ly + rBig + 12);
  }

  /* Throw minigame overlay: appears when a grounder is in the field and
     the player has a window to complete the throw. */
  if (g && g.play && g.play.throwActive && g.play.throwWindow) {
    const win = g.play.throwWindow;
    const now = performance.now();
    const t = clamp((now - win.startedAt) / win.duration, 0, 1);
    const barW = w * 0.5;
    const barX = cx - barW/2;
    const barY = h * 0.90;
    const barH = 22;
    /* Background */
    ctx.fillStyle = 'rgba(11,16,21,.92)';
    ctx.fillRect(barX - 6, barY - 6, barW + 12, barH + 34);
    /* Yellow zone */
    ctx.fillStyle = 'rgba(244,194,90,.36)';
    ctx.fillRect(barX + (win.ideal - win.yellowHalf) * barW, barY,
                 win.yellowHalf * 2 * barW, barH);
    /* Green zone */
    ctx.fillStyle = 'rgba(91,176,131,.72)';
    ctx.fillRect(barX + (win.ideal - win.greenHalf) * barW, barY,
                 win.greenHalf * 2 * barW, barH);
    /* Cursor */
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(barX + t * barW - 2, barY - 3, 4, barH + 6);
    /* Label */
    ctx.fillStyle = '#f4c25a';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('THROW TO FIRST · SPACE OR CLICK', cx, barY + barH + 12);
  }

  /* Pitcher fatigue chip in the top strip so a player can see it. */
  if (g && !g.play) {
    const fat = pitcherFatigue();
    if (fat.level > 0) {
      const label = fat.level >= 3 ? 'GASSED' : fat.level === 2 ? 'TIRING' : 'WARM';
      const color = fat.level >= 3 ? '#c94b1a' : fat.level === 2 ? '#e3b04c' : '#5bb083';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = color;
      ctx.fillText(label, cx, cy - 26);
    }
  }

  /* Particles fire on top of everything. */
  if (g) updateAndDrawFx(ctx, g);

  /* Soft vignette: darkens the corners so the diamond glows in the
     middle, same framing trick the golf tracer uses. */
  const vg = ctx.createRadialGradient(cx, cy, r * 0.8, cx, cy, w * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.30)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, w, h);

  ctx.restore();
}

function drawBaseball(ctx, x, y, groundY) {
  /* Optional ground shadow: pass the y of the ground plane and we drop a
     small shadow there, so a high arc reads as high. */
  if (typeof groundY === 'number') {
    const drop = Math.max(0, groundY - y);
    const alpha = clamp(0.35 - drop * 0.0015, 0.05, 0.35);
    const rx = 5 + drop * 0.02;
    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
    ctx.beginPath();
    ctx.ellipse(x, groundY, rx, 2, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#eaeaea';
  ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#c94b1a';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, 4, -Math.PI*0.2, Math.PI*0.3); ctx.stroke();
}

function drawBatSwing(ctx, x, y, t) {
  /* A wooden bat sweeping horizontally at the plate. t goes 0 to 1 over
     the swing window, so the bat rotates from behind the batter to in
     front. */
  const cx = x + 6, cy = y - 12;
  const angle = -Math.PI * 0.6 + Math.PI * 1.2 * t;
  const len = 22;
  const bx = cx + Math.cos(angle) * len;
  const by = cy + Math.sin(angle) * len;
  ctx.strokeStyle = '#8b6a3a';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(bx, by); ctx.stroke();
  ctx.strokeStyle = '#5a3a1c';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(angle) * 6, cy + Math.sin(angle) * 6); ctx.stroke();
}

/* -------- 3/4 field view --------
   On the field the camera looks diagonally down at the players, so the
   sprites are foreshortened: the head stays at full size and the body
   and legs compress vertically. Each character's own art is used (so
   Kong stays an ape and Felix stays a cat); only the proportions change.
   The head boundary is found per character from the eye row in their
   art, so tall hats and short bodies both foreshorten correctly. */
const fieldSpriteCache = new Map();
function fieldSpriteCanvas(c, size) {
  const full = spriteCanvas(c, size);
  /* Head ends a few rows below the eyes. */
  let eyeRow = 7;
  for (let y = 0; y < (c.art || []).length; y++) {
    if ((c.art[y] || '').includes('e')) { eyeRow = y; break; }
  }
  const headFrac = clamp((eyeRow + 5) / SPRITE_H, 0.3, 0.62);
  const headPx = Math.round(full.height * headFrac);
  const bodyPx = full.height - headPx;
  const squash = 0.55;
  const cv = document.createElement('canvas');
  cv.width = full.width;
  cv.height = headPx + Math.round(bodyPx * squash);
  const g2 = cv.getContext('2d');
  g2.imageSmoothingEnabled = false;
  g2.drawImage(full, 0, 0, full.width, headPx, 0, 0, full.width, headPx);
  g2.drawImage(full, 0, headPx, full.width, bodyPx,
               0, headPx, full.width, Math.round(bodyPx * squash));
  return cv;
}

const runnerCache = new Map();
function drawRunner(ctx, x, y, character, scale, pose) {
  scale = scale || 3;
  const hero = hasHero(character.k);

  /* Hero characters use their own animated frames on the field. The run
     poses drive the run cycle; everything else shows the idle frame with
     a gentle bob. */
  if (hero) {
    let frame = 'idle';
    if (pose === 'run-a') frame = 'run1';
    else if (pose === 'run-b') frame = 'run2';
    const hkey = character.k + '@h' + scale + frame;
    let hcv = runnerCache.get(hkey);
    if (!hcv) { hcv = heroSpriteCanvas(character.k, Math.round(HERO_W * scale * 0.9), frame); runnerCache.set(hkey, hcv); }
    /* Ground shadow */
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath();
    ctx.ellipse(x, y + 1, hcv.width * 0.34, hcv.width * 0.10, 0, 0, Math.PI * 2);
    ctx.fill();
    /* Idle bob when standing still */
    let dy = 0;
    if (pose == null || pose === 'batting') {
      dy = Math.floor(((performance.now() / 420) + (character.k.charCodeAt(0) % 5) * 0.2) % 2) === 0 ? 0 : -1;
    }
    ctx.drawImage(hcv, Math.round(x - hcv.width/2), Math.round(y - hcv.height + dy));
    return;
  }

  const key = character.k + '@' + scale;
  let cv = runnerCache.get(key);
  if (!cv) { cv = fieldSpriteCanvas(character, Math.round(SPRITE_W * scale)); runnerCache.set(key, cv); }
  /* Ellipse shadow under the sprite so it feels planted on the field. */
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath();
  ctx.ellipse(x, y + 1, cv.width * 0.35, cv.width * 0.10, 0, 0, Math.PI * 2);
  ctx.fill();

  const drawX = Math.round(x - cv.width/2);
  const drawY = Math.round(y - cv.height);
  /* Pose-driven micro-animation: idle-bob shifts a pixel every 400ms,
     run alternates a small skew, windup crouches, and release throws
     the whole sprite forward for a beat. Every character on the field
     picks up an idle bob so nothing looks frozen. */
  const t = performance.now();
  let dy = 0, sx = 1, rot = 0;
  if (pose === 'run-a') { dy = -1; }
  else if (pose === 'run-b') { dy = 0; sx = -1; }
  else if (pose === 'windup') { dy = -2; rot = -0.10; }
  else if (pose === 'release') { dy = 1; rot = 0.14; }
  else if (pose === 'batting') { dy = 0; rot = -0.06; }
  else {
    dy = Math.floor(((t / 420) + (character.k.charCodeAt(0) % 5) * 0.2) % 2) === 0 ? 0 : -1;
  }
  if (rot || sx !== 1) {
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    if (sx !== 1) ctx.scale(sx, 1);
    ctx.drawImage(cv, -cv.width/2, -cv.height + dy);
    ctx.restore();
  } else {
    ctx.drawImage(cv, drawX, drawY + dy);
  }
}

function drawMeter(ctx, w, h, t, pitch, inWindup) {
  ctx.fillStyle = '#0c1218';
  ctx.fillRect(0,0,w,h);
  const diff = DIFF[State.difficulty];
  const half = diff.sweetWidth / 2;
  const ideal = pitch.ideal;
  /* Ok zones (wider yellow band around the green) */
  ctx.fillStyle = 'rgba(244,194,90,.28)';
  ctx.fillRect((ideal - half*1.8) * w, 0, half*3.6*w, h);
  /* Perfect zone */
  ctx.fillStyle = 'rgba(91,176,131,.65)';
  ctx.fillRect((ideal - half) * w, 0, half*2 * w, h);
  /* Cursor: brighter and thicker so it reads through the gradient */
  if (!inWindup) {
    const x = t * w;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x - 2, 0, 4, h);
    ctx.fillStyle = '#f4c25a';
    ctx.fillRect(x - 1, 0, 2, h);
  } else {
    /* windup: dim the whole meter and pulse a hint at the ideal spot */
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(0, 0, w, h);
    const pulse = 0.5 + 0.5 * Math.sin(performance.now()/140);
    ctx.fillStyle = `rgba(244,194,90,${0.35 + pulse*0.4})`;
    ctx.fillRect(ideal*w - 2, 0, 4, h);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('GET READY', w/2, h/2);
  }
  /* Ticks along the bottom */
  ctx.fillStyle = 'rgba(255,255,255,.20)';
  for (let i=1;i<10;i++) ctx.fillRect(i*w/10, h-5, 1, 5);
}

/* ============================================================================
   HUD
   ============================================================================ */
function renderGame() {
  const g = State.game;
  const s = el('div','screen');

  /* Line score above the field, real ballpark style. */
  const ls = el('div','linescore');
  ls.id = 'linescore';
  renderLineScore(ls);
  s.appendChild(ls);

  const arena = el('div','arena');
  const cv = document.createElement('canvas');
  cv.id = 'field'; cv.width = 960; cv.height = 660;
  arena.appendChild(cv);

  /* Score and inning overlaid on the field's corners so nothing steals room
     from the diamond. Names inside color chips read at a glance without
     needing a label. */
  const theme = currentTheme();
  const parkLbl = el('div','corner',
    `<span class="lbl" style="color:${theme.wallLine}">${theme.park}</span>`
  );
  parkLbl.style.top = '0'; parkLbl.style.left = '50%'; parkLbl.style.transform = 'translateX(-50%)';
  parkLbl.style.textAlign = 'center';
  arena.appendChild(parkLbl);

  const tl = el('div','corner tl',
    `<span class="lbl">${g.away.name}${g.away.isYou?' (you)':''}</span>`
    + `<span class="val ${g.away.isYou?'gold':''}" id="hud-away">${g.away.score}</span>`
  );
  const tr = el('div','corner tr',
    `<span class="lbl">${g.home.name}${g.home.isYou?' (you)':''}</span>`
    + `<span class="val ${g.home.isYou?'gold':''}" id="hud-home">${g.home.score}</span>`
  );
  const bl = el('div','corner bl',
    `<span class="lbl">Inning</span>`
    + `<span class="val" id="hud-inning">${g.half==='top'?'Top':'Bot'} ${g.inning}/${g.innings}</span>`
  );
  const br = el('div','corner br',
    `<span class="val" id="hud-count">Outs ${g.outs} · ${g.balls}-${g.strikes}</span>`
  );
  arena.append(tl, tr, bl, br);

  const callout = el('div','callout'); callout.id = 'callout';
  arena.appendChild(callout);
  s.appendChild(arena);

  const meter = el('div','meter-wrap');
  meter.innerHTML = `<div class="label">`
    + `<span><b class="pt" id="pt-name">Get ready</b></span>`
    + `<span id="meter-side">Click anywhere or press Space</span></div>`;
  const m = document.createElement('canvas'); m.id='meter'; m.width=720; m.height=52;
  meter.appendChild(m);
  const hint = el('div','hint', 'Land the marker on the <b>green zone</b> to make solid contact.');
  hint.id = 'meter-hint';
  meter.appendChild(hint);

  /* Pitch-selection strip: hidden by default, shown only during the CPU's
     at bat windup by offerPitchSelection(). Two picks: pitch type and
     target location on a 3 by 3 strike zone grid. Center pitches are
     easier for the CPU to square up but always strikes; corner and edge
     pitches are harder to hit but can turn into balls if you miss. */
  const psel = el('div','pitch-select');
  psel.id = 'pitch-select';
  psel.style.display = 'none';
  const zoneGridCells = [
    'corner','mid','corner',
    'mid','center','mid',
    'corner','mid','corner',
  ];
  const zoneHtml = zoneGridCells.map((cls,i) => `<button class="${cls}" data-zone="${i}" title="Aim here"></button>`).join('');
  psel.innerHTML =
      `<div class="col"><span class="lbl">Pitch</span><div class="type-row">`
    + `<button class="btn ghost" data-pt="fastball">Fastball</button>`
    + `<button class="btn ghost" data-pt="curveball">Curveball</button>`
    + `<button class="btn ghost" data-pt="changeup">Changeup</button>`
    + `</div></div>`
    + `<div class="col"><span class="lbl">Location</span>`
    + `<div class="zone-grid" id="zone-grid">${zoneHtml}</div></div>`;
  meter.appendChild(psel);

  /* Big touch-friendly SWING button under the meter, for phones and
     anyone who prefers a target to a click-anywhere. */
  const swingBtn = el('button','btn swing-btn','SWING');
  swingBtn.id = 'swing-btn';
  swingBtn.onmousedown = swingBtn.ontouchstart = (e) => {
    e.preventDefault();
    /* Route through the same swing path a click would use. */
    const g2 = State.game;
    if (!g2 || !g2.pitch || g2.pitch.swung || !playerIsBatting()) return;
    const now = performance.now();
    if (now < g2.pitch.windupUntil) return;
    const t = clamp((now - g2.pitch.start) / (g2.pitch.speed * 1000), 0, 1);
    g2.pitch.swung = true;
    resolveSwing(t);
  };
  meter.appendChild(swingBtn);
  s.appendChild(meter);

  /* Steal button, only visible when there is a runner who can advance. */
  const stealRow = el('div', 'controls');
  const stealBtn = el('button','btn ghost','Steal 2nd');
  stealBtn.id = 'steal-btn';
  stealBtn.style.display = 'none';
  stealBtn.onclick = attemptSteal;
  stealRow.appendChild(stealBtn);
  s.appendChild(stealRow);

  const atbat = el('div','atbat');
  atbat.id = 'atbat';
  refreshAtBatCard(atbat);
  s.appendChild(atbat);

  const log = el('div','log');
  log.id = 'log';
  for (const line of g.log.slice(-14)) {
    const d = el('div', 'line' + (line.big?' big':''), line.text);
    log.appendChild(d);
  }
  s.appendChild(log);

  const ctrl = el('div','controls');
  const abort = el('button','btn ghost','End Game');
  abort.onclick = () => {
    if (confirm('End this game and return to the menu?')) {
      endAtBatCleanup();
      Sound.music.stop();
      State.game = null; State.screen = State.mode==='exhibition' ? 'menu' : 'season-hub';
      render();
    }
  };
  ctrl.appendChild(abort);
  s.appendChild(ctrl);

  app.appendChild(s);
  /* Start the always-on field paint loop as soon as the canvas is in the DOM. */
  startFieldLoop();
}

/* One flavor callout at a time. Overlays the field for 1.4s, fades out.
   `kind` picks a color: default gold, plus homer, hit, strike, ball, sub. */
let calloutTimer = 0;
function showCallout(text, kind) {
  const node = document.getElementById('callout');
  if (!node) return;
  node.textContent = text;
  node.className = 'callout on ' + (kind || '');
  clearTimeout(calloutTimer);
  calloutTimer = setTimeout(() => { node.classList.remove('on'); }, 1400);
}

function refreshAtBatCard(node) {
  const g = State.game;
  const b = currentBatter();
  const p = currentPitcher();
  node.innerHTML = '';
  const avatar = spriteCanvas(b, 48);
  avatar.className = 'avatar';
  node.appendChild(avatar);
  const info = el('div', null,
    `<div class="who"><b>${b.n}</b> at bat</div>`
    + `<div class="vs">vs ${p.n} pitching · POW ${b.pow} · CON ${b.con} · SPD ${b.spd}</div>`
  );
  node.appendChild(info);
  const count = el('div','count', `${g.balls}-${g.strikes}`);
  node.appendChild(count);
}

function renderLineScore(node) {
  const g = State.game;
  if (!g) return;
  const innings = g.innings;
  const rowFor = (label, arr, score, isYou) => {
    let html = `<td class="team">${label}${isYou?' *':''}</td>`;
    for (let i = 0; i < innings; i++) {
      const cell = arr[i];
      const isCur = (i + 1) === g.inning;
      const cls = isCur ? 'cur' : '';
      html += `<td class="${cls}">${cell == null ? '' : cell}</td>`;
    }
    html += `<td class="r">${score}</td>`;
    return html;
  };
  let header = '<th>&nbsp;</th>';
  for (let i = 1; i <= innings; i++) header += `<th>${i}</th>`;
  header += '<th>R</th>';
  node.innerHTML = `<table><thead><tr>${header}</tr></thead><tbody>`
    + `<tr>${rowFor(g.away.name.slice(0,10), g.lineScore.away, g.away.score, g.away.isYou)}</tr>`
    + `<tr>${rowFor(g.home.name.slice(0,10), g.lineScore.home, g.home.score, g.home.isYou)}</tr>`
    + `</tbody></table>`;
}

function refreshHud() {
  if (State.screen !== 'game') return;
  const g = State.game;
  const ls = document.getElementById('linescore');
  if (ls) renderLineScore(ls);
  const hudAway = document.getElementById('hud-away');
  const hudHome = document.getElementById('hud-home');
  const hudInn = document.getElementById('hud-inning');
  const hudCount = document.getElementById('hud-count');
  if (hudAway) hudAway.textContent = g.away.score;
  if (hudHome) hudHome.textContent = g.home.score;
  if (hudInn) hudInn.textContent = `${g.half==='top'?'Top':'Bot'} ${g.inning}/${g.innings}`;
  if (hudCount) hudCount.textContent = `Outs ${g.outs} · ${g.balls}-${g.strikes}`;
  const ab = document.getElementById('atbat');
  if (ab) refreshAtBatCard(ab);
  const log = document.getElementById('log');
  if (log) {
    log.innerHTML = '';
    for (const line of g.log.slice(-14)) {
      const d = el('div','line' + (line.big?' big':''), line.text);
      log.appendChild(d);
    }
    log.scrollTop = log.scrollHeight;
  }
  const ptName = document.getElementById('pt-name');
  if (ptName && g.pitch) ptName.textContent = g.pitch.pt.toUpperCase();
  refreshStealButton();
  /* Show swing controls only when the player is batting; show the
     "you're pitching" hint when the CPU is at the plate. */
  const side = document.getElementById('meter-side');
  const hint = document.getElementById('meter-hint');
  const swingBtn = document.getElementById('swing-btn');
  const youBat = playerIsBatting();
  if (side) side.textContent = youBat ? 'Click anywhere or press Space' : 'You are pitching · call a pitch each windup';
  if (hint) hint.style.display = youBat ? '' : 'none';
  if (swingBtn) swingBtn.style.display = youBat ? '' : 'none';
}

function refreshStealButton() {
  const btn = document.getElementById('steal-btn');
  if (!btn) return;
  const g = State.game;
  if (!g || g.over || g.play) { btn.style.display = 'none'; return; }
  /* Only offer a straight steal: runner on 1st going to 2nd, when 2nd is
     empty. Available only during the windup, before the meter starts. */
  const canSteal = playerIsBatting() && g.bases[0] && !g.bases[1] && g.pitch && !g.pitch.swung
                 && performance.now() < g.pitch.windupUntil;
  btn.style.display = canSteal ? '' : 'none';
  if (canSteal) btn.textContent = `Steal 2nd · ${g.bases[0].n}`;
}

function attemptSteal() {
  const g = State.game;
  if (!g || !g.bases[0] || g.bases[1]) return;
  if (!g.pitch || g.pitch.swung || g.play) return;
  const runner = g.bases[0];
  const pitcher = currentPitcher();
  g.pitch.swung = true;
  endAtBatCleanup();
  addLog(`${runner.n} breaks for 2nd.`);
  showCallout('STEAL ATTEMPT', 'sub');
  const odds = clamp(0.35 + (runner.spd - 60)/200 - (pitcher.con - 55)/300, 0.15, 0.9);
  const success = Math.random() < odds;
  setTimeout(() => {
    if (success) {
      g.bases[0] = null;
      g.bases[1] = runner;
      g.stats.sb[runner.k] = (g.stats.sb[runner.k] || 0) + 1;
      addLog(`SAFE. ${runner.n} takes 2nd.`);
      showCallout('STOLEN BASE', 'hit');
    } else {
      g.bases[0] = null;
      g.outs++;
      addLog(`CAUGHT STEALING. ${runner.n} tagged out. ${g.outs} out.`);
      showCallout('CAUGHT STEALING', 'strike');
    }
    refreshHud();
    if (g.outs >= 3) return setTimeout(endHalfInning, 1200);
    setTimeout(throwPitch, 1400);
  }, 900);
}

function addLog(text, big=false) {
  const g = State.game;
  g.log.push({ text, big });
}

/* ============================================================================
   RESULT SCREEN
   ============================================================================ */
function renderResult() {
  const g = State.game;
  const you = g.away.isYou ? g.away : g.home;
  const foe = g.away.isYou ? g.home : g.away;
  const win = you.score > foe.score;

  const s = el('div','screen');
  s.appendChild(el('h2', null, win ? 'You win.' : 'You lose.'));

  /* Headline: final score, with a walk-off note when it earned one. */
  const head = el('div','card');
  head.innerHTML =
    `<h3>Final</h3>`
    + `<p style="font-size:18px;color:var(--text)">${you.name} <b style="color:var(--gold)">${you.score}</b>`
    + ` &nbsp;·&nbsp; ${foe.name} <b>${foe.score}</b></p>`
    + (g.walkoff ? `<p style="color:var(--gold)">Walk-off win.</p>` : '');
  s.appendChild(head);

  /* Anything unlocked by this game gets its own celebration card. */
  if (g.freshUnlocks && g.freshUnlocks.length) {
    const uc = el('div','card');
    uc.style.borderColor = 'var(--gold)';
    uc.appendChild(el('h3', null, g.freshUnlocks.length > 1 ? 'New characters unlocked' : 'New character unlocked'));
    const grid = el('div','roster');
    for (const k of g.freshUnlocks) {
      const c = ROSTER_BY_KEY[k];
      if (!c) continue;
      const cc = el('div','charcard');
      cc.style.cursor = 'default';
      cc.appendChild(spriteCanvas(c, 64));
      cc.appendChild(el('div','name', c.n));
      cc.appendChild(el('div','role', c.role));
      if (c.note) cc.appendChild(el('div','quirk', c.note));
      grid.appendChild(cc);
    }
    uc.appendChild(grid);
    s.appendChild(uc);
  }

  /* Line score: runs per inning for both sides, the way a real board reads. */
  const lsCard = el('div','card');
  lsCard.appendChild(el('h3', null, 'Line score'));
  const innCount = Math.max(g.innings, g.lineScore.away.length, g.lineScore.home.length);
  const lsWrap = el('div','linescore');
  const lsT = document.createElement('table');
  let head1 = '<thead><tr><th></th>';
  for (let i = 1; i <= innCount; i++) head1 += `<th>${i}</th>`;
  head1 += '<th>R</th></tr></thead>';
  let body = '<tbody>';
  for (const side of ['away','home']) {
    const team = g[side];
    body += `<tr><td class="team">${team.name}${team.isYou ? ' *' : ''}</td>`;
    for (let i = 0; i < innCount; i++) {
      const v = g.lineScore[side][i];
      body += `<td>${v == null ? '' : v}</td>`;
    }
    body += `<td class="r">${team.score}</td></tr>`;
  }
  body += '</tbody>';
  lsT.innerHTML = head1 + body;
  lsWrap.appendChild(lsT);
  lsCard.appendChild(lsWrap);
  s.appendChild(lsCard);

  /* Batting lines for BOTH lineups, so the box score is a real box score. */
  const batTable = (team) => {
    const t = el('table','table');
    t.innerHTML = '<thead><tr><th>Batter</th><th class="n">AB</th><th class="n">H</th>'
                + '<th class="n">HR</th><th class="n">K</th><th class="n">SB</th><th class="n">AVG</th></tr></thead>';
    const tb = el('tbody');
    let any = false;
    for (const b of team.batters) {
      const ab = g.stats.ab[b.k] || 0;
      const h  = g.stats.hits[b.k] || 0;
      const hr = g.stats.hr[b.k] || 0;
      const so = g.stats.so[b.k] || 0;
      const sb = (g.stats.sb && g.stats.sb[b.k]) || 0;
      if (!ab && !h && !sb) continue;
      any = true;
      const avg = ab ? (h/ab).toFixed(3).replace(/^0/,'') : '.000';
      const tr = el('tr');
      tr.innerHTML = `<td>${b.n}</td><td class="n">${ab}</td><td class="n">${h}</td>`
                   + `<td class="n">${hr}</td><td class="n">${so}</td><td class="n">${sb}</td>`
                   + `<td class="n">${avg}</td>`;
      tb.appendChild(tr);
    }
    if (!any) {
      const tr = el('tr');
      tr.innerHTML = '<td colspan="7" style="color:var(--text-dim)">No plate appearances recorded.</td>';
      tb.appendChild(tr);
    }
    t.appendChild(tb);
    return t;
  };

  for (const team of [you, foe]) {
    const c = el('div','card');
    c.appendChild(el('h3', null, `${team.name} batting`));
    c.appendChild(batTable(team));
    /* Pitching line: the first pick on each roster takes the mound. */
    const opp = team === you ? foe : you;
    const p = team.batters[0];
    const oppK = opp.batters.reduce((a,b) => a + (g.stats.so[b.k] || 0), 0);
    const oppH = opp.batters.reduce((a,b) => a + (g.stats.hits[b.k] || 0), 0);
    c.appendChild(el('p', null,
      `<b style="color:var(--gold)">${p.n}</b> pitching: ${opp.score} runs, ${oppH} hits, ${oppK} strikeouts.`));
    s.appendChild(c);
  }

  const row = el('div','btn-row');
  if (State.mode === 'exhibition') {
    const again = el('button','btn','Play Again');
    again.onclick = () => { State.opponent = randomOpponent(null); startGame({ mode:'exhibition' }); };
    const menu = el('button','btn ghost','Main Menu');
    menu.onclick = () => { State.game = null; State.screen='menu'; render(); };
    row.append(again, menu);
  } else if (State.mode === 'season') {
    const hub = el('button','btn','Continue');
    hub.onclick = () => { State.game = null; State.screen='season-hub'; render(); };
    row.append(hub);
  } else if (State.mode === 'playoff') {
    const b = el('button','btn','Back to Bracket');
    b.onclick = () => { State.game = null; State.screen='bracket'; render(); };
    row.append(b);
  }
  s.appendChild(row);

  app.appendChild(s);
}

/* ============================================================================
   SEASON END
   ============================================================================ */
/* ============================================================================
   HOW TO PLAY
   Everything a first-time player needs: what the meter does, what the two
   picks mean when they are pitching, the two fielding minigames, base
   running, and how a season is shaped.
   ============================================================================ */
function renderHowTo() {
  const s = el('div','screen');
  s.appendChild(el('h2', null, 'How to play'));

  const bat = el('div','card');
  bat.innerHTML =
      '<h3>Batting</h3>'
    + '<p>A marker sweeps left to right across the meter under the field. '
    + 'Click anywhere, press <b>Space</b>, or tap the big SWING button to swing.</p>'
    + '<p><b>Green zone:</b> solid contact. The closer to the middle, the better '
    + 'the ball is struck. <b>Yellow band:</b> a piece of it, usually a foul or '
    + 'weak contact. <b>Outside both:</b> a swing and a miss.</p>'
    + '<p>The pitch reaches the plate exactly when the marker crosses the green, '
    + 'so you can watch the ball or watch the meter. During GET READY the pitcher '
    + 'is still winding up and swings are ignored.</p>'
    + '<p>Pitches behave differently: a <b>fastball</b> comes in hard and straight, '
    + 'a <b>curveball</b> breaks late and sharply, and a <b>changeup</b> floats, '
    + 'fades, and dies at the end.</p>';
  s.appendChild(bat);

  const pitch = el('div','card');
  pitch.innerHTML =
      '<h3>Pitching</h3>'
    + '<p>When the other team bats, you are on the mound. Each windup you make '
    + 'two picks: the <b>pitch type</b> and the <b>location</b> on a three by three '
    + 'strike zone grid.</p>'
    + '<p><b>Middle:</b> always a strike, but easy for the hitter to square up. '
    + '<b>Edges and corners:</b> much harder to hit, but your pitcher can miss the '
    + 'spot and the umpire calls a ball. Better control means you hit your spot '
    + 'more often.</p>'
    + '<p>Every batter has a hidden weak pitch. Find it and their timing falls apart. '
    + 'No pick within five seconds and the pitcher shakes off the sign and throws '
    + 'his own choice.</p>'
    + '<p>Pitchers tire. Past the third inning the chip above the mound reads WARM, '
    + 'then TIRING, then GASSED, and a tired arm loses the plate.</p>';
  s.appendChild(pitch);

  const field = el('div','card');
  field.innerHTML =
      '<h3>Fielding</h3>'
    + '<p><b>Ground balls:</b> a timing bar appears at the bottom of the field. '
    + 'Hit the green for the out, the yellow lets the batter beat the throw for an '
    + 'infield single, and a miss is a throwing error that lets every runner take '
    + 'an extra base.</p>'
    + '<p><b>Fly balls:</b> a ring shrinks over the landing spot. Click or press '
    + 'Space when it is tightest to make the catch. Slightly off and the ball drops '
    + 'in for a single; badly off and it sails over the fielder for a triple.</p>'
    + '<p>Your fielders\' defense ratings widen both safe windows, so a strong '
    + 'defensive lineup is easier to play.</p>';
  s.appendChild(field);

  const run = el('div','card');
  run.innerHTML =
      '<h3>Base running</h3>'
    + '<p>With a runner on first and second base empty, a <b>Steal 2nd</b> button '
    + 'appears during the windup. Success depends on the runner\'s speed against the '
    + 'pitcher\'s control.</p>'
    + '<p>Fast runners are aggressive on hits: a quick runner on second will try to '
    + 'score on a single rather than stop at third. Sometimes they get thrown out '
    + 'at the plate. Speed lineups score more and risk more.</p>';
  s.appendChild(run);

  const chars = el('div','card');
  chars.innerHTML =
      '<h3>Characters</h3>'
    + '<p>Every character has Power, Speed, Contact, and Defense, and many carry a '
    + 'quirk that genuinely changes how they play. A few examples:</p>'
    + '<p><b>Lady Liberty</b> never runs: every real swing is a home run or a '
    + 'strikeout. <b>Mr. Hyde</b> transforms in about one at bat in six. '
    + '<b>Popeye</b> eats his spinach on his third trip to the plate. '
    + '<b>Father Time</b> slows the meter down. <b>The Phoenix</b> turns her first '
    + 'strikeout of the game into a walk. <b>Black Cat</b> makes fielders bobble. '
    + '<b>Dracula</b> and the <b>Werewolf</b> get stronger in late innings.</p>';
  s.appendChild(chars);

  const season = el('div','card');
  season.innerHTML =
      '<h3>Season</h3>'
    + '<p>Pick nine characters and play seven games against a rotating cast of '
    + 'opponent teams, each with its own park and its own batting personality: some '
    + 'hack at everything, some are patient.</p>'
    + '<p>The top four records make a single elimination playoff bracket. The higher '
    + 'seed hosts, and home teams get a small crowd boost. Your season saves to this '
    + 'browser automatically, so you can close the tab and come back.</p>';
  s.appendChild(season);

  const row = el('div','btn-row');
  const back = el('button','btn','Back to Menu');
  back.onclick = () => { State.screen='menu'; render(); };
  row.appendChild(back);
  s.appendChild(row);

  app.appendChild(s);
}

function renderSeasonEnd() {
  const S = State.season;
  const P = S.playoffs;
  const champ = (P && P.final && P.final.result)
    ? P.seeds[P.final.result.winner]
    : null;
  const youWon = champ && champ.you;

  const s = el('div','screen');
  s.appendChild(el('h2', null, youWon ? 'Champions.' : 'Season complete.'));
  const card = el('div','card');
  const rec = seasonRecord(S);
  card.innerHTML = `<p>Regular season ${rec.w}-${rec.l}.</p>`;
  if (champ) card.innerHTML += `<p>Champion: <b style="color:var(--gold)">${champ.name}</b></p>`;
  const ps = S.playerStats;
  card.innerHTML +=
    `<h3>Season totals</h3>`
    + `<p>Hits ${ps.hits} · HR ${ps.hr} · K ${ps.so} · AB ${ps.ab}</p>`;
  s.appendChild(card);

  const row = el('div','btn-row');
  const restart = el('button','btn','Play Again');
  restart.onclick = () => {
    clearSeason(); State.season = null; State.screen='menu'; render();
  };
  const menu = el('button','btn ghost','Main Menu');
  menu.onclick = () => {
    clearSeason(); State.season = null; State.screen='menu'; render();
  };
  row.append(restart, menu);
  s.appendChild(row);

  app.appendChild(s);
}

/* ============================================================================
   UTIL
   ============================================================================ */
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

render();
</script>
