<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="UTF-8" />
<title>RunTheGames: OG preview image (1200×630)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  body{
    font-family:'Archivo',system-ui,sans-serif;
    background:
      radial-gradient(1100px 580px at 50% -6%, rgba(102,211,222,.22), transparent 60%),
      radial-gradient(900px 480px at 88% 4%, rgba(248,88,88,.14), transparent 55%),
      linear-gradient(180deg,#0b1a2c 0%, #0a1626 48%, #081120 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;
    color:#eaf1f8;
  }
  .wordmark{
    width:680px;
    height:auto;
    display:block;
    filter:drop-shadow(0 8px 32px rgba(0,0,0,.55));
    margin-bottom:20px;
    margin-top:-18px;
  }
  .tagline{
    font-size:26px;
    font-weight:600;
    color:#b8d0e8;
    text-align:center;
    line-height:1.4;
    max-width:820px;
    margin-bottom:0;
  }
  .tagline em{
    color:#66D3DE;
    font-style:normal;
    font-weight:700;
  }
  .url{
    position:absolute;
    bottom:38px;
    left:0;right:0;
    text-align:center;
    font-family:'Archivo',sans-serif;
    font-weight:900;
    font-size:22px;
    letter-spacing:3px;
    color:#66D3DE;
    text-transform:uppercase;
  }
</style>
</head>
<body>
  <img class="wordmark" src="../assets/wm-stacked.png" alt="Run The Games">
  <p class="tagline">Free, data-driven <em>sports simulation games</em> you play right in your browser.</p>
  <div class="url">RUNTHE.GG</div>
</body>
</html>
