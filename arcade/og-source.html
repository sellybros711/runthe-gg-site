<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Internal build asset: renders arcade/assets/arcade-share.png (1200x630, the
     link-share card). Never a reader-facing page. Render with
     scripts/make-arcade-brand.mjs. Arcade voice: pixel-type headline, the mark
     top-right, a "featuring" row of all nine games in their hub colors. -->
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Anton&family=Archivo:wght@600;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#071426;color:#F4F7FB;
    font-family:'Inter',system-ui,sans-serif;position:relative;
    background-image:
      radial-gradient(900px 560px at 12% -10%, rgba(242,182,50,.18), transparent 70%),
      radial-gradient(820px 520px at 100% 115%, rgba(240,106,95,.16), transparent 72%);}
  .lines{position:absolute;inset:0;
    background-image:repeating-linear-gradient(90deg,
      rgba(255,255,255,.045) 0 1px, transparent 1px 104px);}
  .wrap{position:relative;height:100%;display:flex;flex-direction:column;
    justify-content:center;padding:0 74px 40px}
  .eyebrow{font-family:'Anton',sans-serif;font-weight:400;
    font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:#A9B8CB;
    margin-bottom:22px}
  .eyebrow b{color:#F2B632}
  /* arcade pixel-type headline */
  h1{font-family:'Press Start 2P',monospace;font-weight:400;text-transform:uppercase;
    font-size:66px;line-height:1.16;letter-spacing:.01em;
    text-shadow:0 5px 0 rgba(0,0,0,.35)}
  h1 .two{background:linear-gradient(135deg,#FDB33A 0%,#F0653A 55%,#EC4899 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-family:'Archivo',sans-serif;font-weight:800;font-size:38px;
    color:#E4ECF5;margin-top:26px;letter-spacing:.01em}
  .feat{font-family:'Anton',sans-serif;font-weight:400;font-size:22px;
    letter-spacing:.22em;text-transform:uppercase;color:#8AA0B8;margin:26px 0 12px}
  .slots{display:flex;gap:10px;flex-wrap:wrap;max-width:1010px}
  .slot{font-family:'Archivo',sans-serif;font-weight:800;font-size:23px;
    letter-spacing:.02em;padding:11px 17px;border-radius:11px;color:#fff;
    box-shadow:0 9px 22px -10px rgba(0,0,0,.8)}
  .c1{background:linear-gradient(180deg,#F58174,#C43B2C)}
  .c2{background:linear-gradient(180deg,#4E8BFF,#1B54C4)}
  .c3{background:linear-gradient(180deg,#33e66e,#178943)}
  .c4{background:linear-gradient(180deg,#C88BF7,#7C1BAB)}
  .c5{background:linear-gradient(180deg,#37C5D5,#0E7C89)}
  .c6{background:linear-gradient(180deg,#FFAB1F,#A35F00)}
  .c7{background:linear-gradient(180deg,#EC4899,#9D174D)}
  .c8{background:linear-gradient(180deg,#9FB3C8,#556579)}
  .c9{background:linear-gradient(180deg,#FDB33A,#E0730F)}
  .url{position:absolute;right:74px;bottom:44px;text-align:right;
    font-family:'Anton',sans-serif;font-weight:400;font-size:29px;
    letter-spacing:.12em;color:#7C8DA3}
  .url b{color:#F4F7FB}
  .url b i{color:#F0653A;font-style:normal}
  .mark{position:absolute;right:60px;top:48px;width:224px;height:224px;display:block;
    object-fit:contain;filter:drop-shadow(0 18px 40px rgba(0,0,0,.55))}
</style></head>
<body>
  <div class="lines"></div>
  <img class="mark" src="/arcade/assets/arcade-logo.png" alt="">
  <div class="wrap">
    <div class="eyebrow">Free &middot; No download &middot; <b>Nine daily games</b></div>
    <h1>Run The <span class="two">Arcade</span></h1>
    <div class="sub">Daily sports puzzles</div>
    <div class="feat">Featuring</div>
    <div class="slots">
      <span class="slot c1">NUMBER</span><span class="slot c2">MATCH</span>
      <span class="slot c3">CAREER</span><span class="slot c4">ODD ONE OUT</span>
      <span class="slot c5">RANK IT</span><span class="slot c6">ALMA MATER</span>
      <span class="slot c7">GUESS</span><span class="slot c8">CROSSWORD</span>
      <span class="slot c9">WORD SEARCH</span>
    </div>
  </div>
  <div class="url"><b>RUNTHE<i>.GG</i></b>/ARCADE</div>
</body></html>
