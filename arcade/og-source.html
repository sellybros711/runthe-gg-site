<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Internal build asset: renders arcade/assets/arcade-share.png (1200x630, the
     link-share card). Never a reader-facing page. Render with
     scripts/make-arcade-brand.mjs. Same visual language as the Perfect Season
     card: dark field, a wash in the brand color, big Anton headline, a row of
     colored chips, the mark top-right, the URL bottom-right. -->
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@600;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#071426;color:#F4F7FB;
    font-family:'Inter',system-ui,sans-serif;position:relative;
    background-image:
      radial-gradient(900px 560px at 12% -10%, rgba(242,182,50,.18), transparent 70%),
      radial-gradient(820px 520px at 100% 115%, rgba(240,106,95,.16), transparent 72%);}
  /* faint arcade scanlines */
  .lines{position:absolute;inset:0;
    background-image:repeating-linear-gradient(90deg,
      rgba(255,255,255,.045) 0 1px, transparent 1px 104px);}
  .wrap{position:relative;height:100%;display:flex;flex-direction:column;
    justify-content:center;padding:0 74px 46px}
  .eyebrow{font-family:'Anton',sans-serif;font-weight:400;
    font-size:25px;letter-spacing:.22em;text-transform:uppercase;color:#A9B8CB;
    margin-bottom:14px}
  .eyebrow b{color:#F2B632}
  h1{font-family:'Anton',Impact,sans-serif;font-weight:400;
    text-transform:uppercase;font-size:140px;line-height:.82;letter-spacing:.006em}
  h1 span{display:block}
  h1 .two{background:linear-gradient(135deg,#FDB33A 0%,#F0653A 55%,#EC4899 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  p{font-size:29px;line-height:1.34;color:#CBD5E1;margin-top:26px;max-width:740px}
  p b{color:#F4F7FB;font-weight:700}
  /* the games, as chips in their own accent colors (echoes the hub cards) */
  .slots{display:flex;gap:11px;margin-top:34px;flex-wrap:wrap;max-width:820px}
  .slot{font-family:'Anton',sans-serif;font-weight:400;font-size:25px;
    letter-spacing:.06em;padding:12px 19px;border-radius:12px;color:#fff;
    box-shadow:0 10px 26px -10px rgba(0,0,0,.8)}
  .c1{background:linear-gradient(180deg,#F58174,#C43B2C)}
  .c2{background:linear-gradient(180deg,#4E8BFF,#1B54C4)}
  .c3{background:linear-gradient(180deg,#33e66e,#178943)}
  .c4{background:linear-gradient(180deg,#C88BF7,#7C1BAB)}
  .c5{background:linear-gradient(180deg,#37C5D5,#0E7C89)}
  .c6{background:linear-gradient(180deg,#FFAB1F,#A35F00)}
  .url{position:absolute;right:74px;bottom:52px;text-align:right;
    font-family:'Anton',sans-serif;font-weight:400;font-size:31px;
    letter-spacing:.12em;color:#7C8DA3}
  .url b{color:#F4F7FB}
  .url b i{color:#F0653A;font-style:normal}
  /* the mark, top-right, clear of the type */
  .mark{position:absolute;right:64px;top:52px;width:250px;height:250px;display:block;
    object-fit:contain;filter:drop-shadow(0 18px 40px rgba(0,0,0,.55))}
</style></head>
<body>
  <div class="lines"></div>
  <img class="mark" src="/arcade/assets/arcade-logo.png" alt="">
  <div class="wrap">
    <div class="eyebrow">Free &middot; No download &middot; <b>Nine daily games</b></div>
    <h1><span>Run The</span><span class="two">Arcade</span></h1>
    <p>Nine daily sports puzzles across the NBA, NFL and MLB. New boards every
       day &mdash; <b>build your streak</b> and challenge your friends.</p>
    <div class="slots">
      <span class="slot c1">NUMBER</span><span class="slot c2">MATCH</span>
      <span class="slot c3">CAREER</span><span class="slot c4">GUESS</span>
      <span class="slot c5">CROSSWORD</span><span class="slot c6">+4 MORE</span>
    </div>
  </div>
  <div class="url"><b>RUNTHE<i>.GG</i></b>/ARCADE</div>
</body></html>
