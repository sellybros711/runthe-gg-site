<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Internal build asset: renders arcade/assets/arcade-share.png (1200x630, the
     link-share card). Never a reader-facing page. Render with
     scripts/make-arcade-brand.mjs. Retro-arcade voice: neon pixel headline,
     CRT scanlines, a synthwave grid floor, the mark top-right. Structure taken
     from football/og-source.html (eyebrow / headline / line / mark / url). -->
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Anton&family=Archivo:wght@600;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#05060f;color:#EAF6FF;
    font-family:'Inter',system-ui,sans-serif;position:relative;
    background-image:
      radial-gradient(760px 460px at 22% -8%, rgba(255,45,149,.22), transparent 68%),
      radial-gradient(820px 520px at 92% 8%, rgba(33,230,255,.16), transparent 70%),
      radial-gradient(900px 600px at 50% 128%, rgba(124,58,237,.30), transparent 66%);}
  /* synthwave grid floor, receding to a neon horizon */
  .floor{position:absolute;left:-20%;right:-20%;bottom:-6px;height:170px;transform:perspective(420px) rotateX(64deg);transform-origin:bottom center;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 86px, rgba(33,230,255,.5) 86px 88px),
      repeating-linear-gradient(0deg,  transparent 0 44px, rgba(255,45,149,.4) 44px 46px);
    mask-image:linear-gradient(transparent, #000 40%);-webkit-mask-image:linear-gradient(transparent, #000 40%)}
  .horizon{position:absolute;left:0;right:0;bottom:150px;height:3px;background:#21E6FF;
    box-shadow:0 0 18px 4px rgba(33,230,255,.7),0 0 42px 10px rgba(33,230,255,.35)}
  /* CRT scanlines */
  .scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.26) 0 2px, transparent 2px 4px)}
  .wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 74px 92px}
  .eyebrow{font-family:'Press Start 2P',monospace;font-weight:400;font-size:19px;
    letter-spacing:.06em;text-transform:uppercase;color:#FFC03A;margin-bottom:30px;
    text-shadow:0 0 10px rgba(255,176,32,.6)}
  .eyebrow b{color:#21E6FF;text-shadow:0 0 10px rgba(33,230,255,.7)}
  h1{font-family:'Press Start 2P',monospace;font-weight:400;text-transform:uppercase;
    font-size:80px;line-height:1.0;letter-spacing:.01em}
  h1 .one{color:#EAF6FF;text-shadow:0 0 12px rgba(33,230,255,.55),0 4px 0 #0a3a52;word-spacing:-.22em}
  h1 .two{display:inline-block;margin-top:14px;color:#FF2D95;
    text-shadow:0 0 14px rgba(255,45,149,.75),0 0 34px rgba(255,45,149,.5),0 4px 0 #5a0b34}
  .sub{font-family:'Archivo',sans-serif;font-weight:800;font-size:34px;color:#CFE8F5;
    margin-top:20px;max-width:720px;line-height:1.3}
  .sub b{color:#FFC03A}
  .url{position:absolute;right:74px;bottom:50px;text-align:right;
    font-family:'Press Start 2P',monospace;font-weight:400;font-size:20px;letter-spacing:.02em;color:#7FA9C4}
  .url b{color:#EAF6FF}
  .url b i{color:#FF2D95;font-style:normal}
  .mark{position:absolute;right:112px;top:48px;width:236px;height:236px;display:block;object-fit:contain;
    filter:drop-shadow(0 0 26px rgba(33,230,255,.45)) drop-shadow(0 14px 30px rgba(0,0,0,.6))}
</style></head>
<body>
  <div class="floor"></div>
  <div class="horizon"></div>
  <img class="mark" src="/arcade/assets/arcade-logo.png" alt="">
  <div class="wrap">
    <div class="eyebrow">Free play &middot; <b>New boards daily</b></div>
    <h1><span class="one">Run The</span><br><span class="two">Arcade</span></h1>
    <div class="sub">Nine daily sports puzzles.
       <b>Build your streak</b> and challenge your friends.</div>
  </div>
  <div class="scan"></div>
  <div class="url"><b>RUNTHE<i>.GG</i></b>/ARCADE</div>
</body></html>
