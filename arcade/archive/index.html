<style>
  :root{
    --bg:#071426; --card:#10233A; --card2:#162B44; --card3:#1A3350;
    --ink:#F4F7FB; --mut:#A9B8CB; --dim:#7C8DA3;
    --line:rgba(244,247,251,.08); --line2:rgba(244,247,251,.15);
    --coral:#F06A5F; --blue:#2F6BFF; --violet:#A982F3; --gold:#F2B632; --teal:#37C5D5; --green:#48D17A; --pink:#F65C9C; --gray:#AAB6C4;
    --coralT:#F06A5F; --brand:#FF8A3D; --brandT:#FF8A3D; --brand2:#FF5A4E; --brand2T:#FF5A4E; --onAccent:#160B02; --moss:#96B93C; --mossT:#96B93C; --goldT:#F2B632; --tealT:#37C5D5; --greenT:#48D17A; --violetT:#B79BF6; --pinkT:#F778AE; --blueT:#5C8CFF;
    --shadow:0 6px 18px -10px rgba(0,0,0,.55);
    --f:'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --hero:'Anton', Impact, sans-serif; --pix:'Press Start 2P', monospace;
  }
  :root[data-theme="light"]{
    --bg:#EEF2F7; --card:#FFFFFF; --card2:#F1F5FA; --card3:#E3EDF8;
    --ink:#0D1B2C; --mut:#51637A; --dim:#8B98A6;
    --line:rgba(13,27,44,.10); --line2:rgba(13,27,44,.18);
    --coralT:#D8452F; --brandT:#B4530A; --brand2T:#C4372C; --mossT:#5F7A12; --goldT:#A87508; --tealT:#0E7C89; --greenT:#17A34A;
    --shadow:0 6px 18px -12px rgba(13,27,44,.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{font-family:var(--f); color:var(--ink); background:var(--bg); min-height:100dvh; -webkit-font-smoothing:antialiased;}
  a{color:inherit; text-decoration:none;}
  :focus-visible{outline:2px solid var(--teal); outline-offset:2px; border-radius:4px;}
  .wrap{width:100%; max-width:760px; margin:0 auto; padding:calc(10px + env(safe-area-inset-top,0)) 14px 20px;}
  /* The page used to carry its own header row: a back chevron, a second logo,
     a PRO pill and the theme button. topbanner.js then started injecting the
     sticky arcade banner above it, which already holds the logo (home), the
     entitlement chip and the account chip, so the page was wearing two hats.
     What is left is the one control the banner does not have. */
  .top{display:flex; justify-content:flex-end; padding:4px 2px 10px;}
  .themeBtn{width:36px; height:36px; border-radius:9px; border:1px solid var(--line2); background:var(--card); color:var(--mut); display:inline-flex; align-items:center; justify-content:center; box-shadow:var(--shadow); cursor:pointer; padding:0; flex:0 0 auto;}
  .themeBtn:hover{color:var(--ink);}
  .themeBtn .ic-moon{display:none;} .themeBtn .ic-sun{display:block;}
  :root[data-theme="light"] .themeBtn .ic-moon{display:block;}
  :root[data-theme="light"] .themeBtn .ic-sun{display:none;}

  /* ---- page head: the hub's zone-head, so the two pages read as one product ---- */
  .zone-head{display:flex; align-items:baseline; gap:12px; margin:2px 2px 15px; flex-wrap:wrap;}
  .zone-head .day{font-family:var(--hero); font-weight:400; font-size:26px; letter-spacing:.02em; color:var(--ink); line-height:1;}
  .zone-head .kicker{flex:0 0 100%; display:flex; align-items:center; gap:7px;
    font-size:11px; font-weight:900; letter-spacing:.1em; text-transform:uppercase;
    color:var(--mut); margin-bottom:7px;}
  .zone-head .kicker b{font-weight:900; color:var(--brandT,var(--coralT));}
  .zone-head .kicker svg{width:15px; height:15px; display:block; color:var(--goldT); flex:0 0 auto;}
  @media (max-width:640px){ .zone-head .kicker{font-size:10px; letter-spacing:.08em; gap:6px;} }
  /* The hub prints ten pips because ten is a countable number of things. The
     vault holds hundreds of puzzles, so the same slot takes a bar instead:
     same position, same typography, a mark that suits the scale. */
  .vprog{margin-left:auto; display:inline-flex; align-items:center; gap:9px; font-size:11px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:var(--mut);}
  /* a class with display beats the UA rule for [hidden], and the gate was
     showing an empty track next to the title */
  .vprog[hidden]{display:none;}
  .vprog .track{width:74px; height:7px; border-radius:999px; background:var(--card2); border:1px solid var(--line2); overflow:hidden;}
  .vprog .fill{display:block; height:100%; border-radius:999px; background:var(--goldT); transition:width .5s ease;}
  .vprog.all{color:var(--greenT);} .vprog.all .fill{background:var(--greenT);}

  /* ---- the vault at a glance: what is in here, and how much of it is yours ---- */
  .vstats{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin:0 0 18px;}
  .vstats .s{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 13px; box-shadow:var(--shadow);}
  .vstats .s .n{display:block; font-family:var(--hero); font-weight:400; font-size:27px; line-height:1; color:var(--ink); font-variant-numeric:tabular-nums;}
  .vstats .s .c{display:block; font-size:9.5px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:var(--mut); margin-top:5px;}
  .vstats .s.gold .n{color:var(--goldT);}
  @media (max-width:640px){ .vstats{gap:8px;} .vstats .s{padding:10px; border-radius:12px;} .vstats .s .n{font-size:22px;} .vstats .s .c{font-size:8.5px; letter-spacing:.07em;} }
  @media (max-width:360px){ .vstats .s .c{font-size:8px;} }

  /* ---- resume: the one thing a returning member most likely wants ---- */
  .resume{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid color-mix(in srgb, var(--gold) 34%, var(--line2));
    border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); margin:0 0 18px; cursor:pointer; width:100%; text-align:left; font:inherit; color:inherit;}
  .resume:hover{border-color:var(--goldT);}
  .resume .ic{flex:0 0 auto; width:38px; height:38px; border-radius:11px; display:grid; place-items:center; color:var(--goldT);
    background:color-mix(in srgb, var(--gold) 15%, var(--card)); border:1px solid color-mix(in srgb, var(--gold) 34%, transparent);}
  .resume .t{min-width:0; flex:1;}
  .resume .t b{display:block; font-size:13.5px; font-weight:900; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .resume .t span{display:block; font-size:11.5px; color:var(--mut); font-weight:700; margin-top:2px;}
  .resume .arw{flex:0 0 auto; color:var(--goldT); font-size:19px; font-weight:900;}

  /* pro upsell */
  .gate{background:var(--card); border:1px solid var(--line2); border-radius:18px; box-shadow:var(--shadow); padding:24px 20px; text-align:center; max-width:460px; margin:8px auto;}
  .gate .crown{width:56px; height:56px; border-radius:16px; margin:0 auto 14px; display:flex; align-items:center; justify-content:center; background:linear-gradient(150deg,var(--coral),#D8452F); box-shadow:0 10px 26px -10px rgba(240,106,95,.8);}
  .gate h2{font-family:var(--hero); font-weight:400; letter-spacing:.02em; text-transform:uppercase; font-size:22px; margin:0 0 6px;}
  .gate p{font-size:13px; color:var(--mut); margin:0 0 16px; line-height:1.55;}
  .gate ul{list-style:none; padding:0; margin:0 0 20px; text-align:left; display:inline-block;}
  .gate li{font-size:13.5px; font-weight:700; color:var(--ink); margin:9px 0; display:flex; gap:9px; align-items:flex-start;}
  .gate li svg{flex:0 0 auto; margin-top:1px; color:var(--greenT);}
  .btn{appearance:none; border:0; cursor:pointer; font-family:var(--f); font-weight:900; font-size:15px; border-radius:13px; padding:15px 20px; min-height:52px; width:100%; background:var(--coral); color:#fff; box-shadow:var(--shadow);}
  .btn:hover{filter:brightness(1.06);}
  .gate .fine{font-size:11px; color:var(--dim); margin:12px 0 0; font-weight:600;}

  /* game tiles - mirror the home-page grid so the vault reads as the same product */
  .tiles{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px;}
  @media (min-width:640px){ .tiles{grid-template-columns:repeat(3, minmax(0,1fr));} }
  @media (max-width:640px){ .tiles{gap:11px;} }
  /* Same two groups as the hub, in the same order, minus High Low: an endless
     streak game has no daily puzzle, so it has no past days to keep. */
  .tsec{grid-column:1 / -1; margin:6px 0 -4px;}
  .tsec:first-child{margin-top:0;}
  .tsec b{display:block; font-family:var(--hero); font-weight:400; letter-spacing:.07em; text-transform:uppercase; font-size:14px; color:var(--ink);}
  .tsec span{display:block; font-size:12px; color:var(--mut); margin-top:2px;}
  button.tile{font:inherit; text-align:left; padding:0; width:100%; color:inherit;}
  .tile{--c:var(--blue); --onC:#fff; position:relative; display:flex; flex-direction:column; border-radius:18px; overflow:hidden; cursor:pointer;
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); transition:transform .16s ease, box-shadow .16s ease;}
  .tile:hover{transform:translateY(-4px); box-shadow:0 26px 50px -26px rgba(0,0,0,.6);}
  .tile.table{--c:var(--gold); --onC:#160B02;} .tile.match{--c:var(--blue); --onC:#fff;} .tile.career{--c:var(--green); --onC:#160B02;} .tile.oddone{--c:var(--violet); --onC:#160B02;}
  .tile.rankit{--c:var(--pink); --onC:#160B02;} .tile.alma{--c:var(--moss); --onC:#160B02;} .tile.guess{--c:var(--brand2); --onC:#160B02;} .tile.cross{--c:#AAB6C4; --onC:#160B02;}
  .tile.match .nm{color:var(--blueT);} .tile.cross .nm{color:var(--ink);}
  .tile.guess .nm{color:var(--coralT);} .tile.table .nm{color:var(--goldT);} .tile.oddone .nm{color:var(--violetT);}
  .tile.career .nm{color:var(--greenT);} .tile.rankit .nm{color:var(--pinkT);} .tile.alma .nm{color:var(--goldT);}
  .tile .cap{position:relative; height:112px; display:grid; place-items:center; overflow:hidden;
    background:color-mix(in srgb, var(--c) 14%, var(--card)); border-bottom:1px solid color-mix(in srgb, var(--c) 22%, transparent);}
  .tile .cap svg{width:60px; height:60px; position:relative; z-index:1; filter:drop-shadow(0 4px 10px rgba(0,0,0,.18));}
  /* The hub's status chip, carrying the vault's own fact: how many of this
     game's past days you have already cleared. Nine tiles that all said "Pick
     a day" were nine identical tiles; this is the only thing that tells them
     apart, and the only thing that says you have been here before. */
  .tile .status{position:absolute; top:9px; right:9px; z-index:2; font-size:9px; font-weight:900; letter-spacing:.08em;
    text-transform:uppercase; border-radius:999px; padding:4px 8px; color:var(--mut); background:var(--card);
    border:1px solid var(--line2); font-variant-numeric:tabular-nums;}
  .tile .status.some{color:var(--goldT); border-color:color-mix(in srgb, var(--gold) 45%, transparent);}
  .tile .status.all{color:var(--greenT); border-color:color-mix(in srgb, var(--green) 45%, transparent);}
  .tile .body{display:flex; flex-direction:column; flex:1; padding:15px;}
  .tile .nm{font-weight:900; font-style:italic; font-size:21px; line-height:1; letter-spacing:-.01em; color:var(--ink);}
  .tile .desc{color:var(--mut); font-size:13px; line-height:1.5; margin:9px 0 0;}
  .tile .foot{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:auto; padding-top:13px;}
  .tile .tmeta{font-size:10px; font-weight:900; letter-spacing:.07em; text-transform:uppercase; color:var(--dim); margin-right:auto;}
  .tile .play{border-radius:999px; min-height:46px; padding:0 18px; display:flex; align-items:center; justify-content:center; gap:8px;
    font-weight:900; font-style:italic; font-size:16px; letter-spacing:.02em; color:var(--onC,#160B02); background:var(--c); transition:filter .12s; flex:1 0 auto;}
  .tile:hover .play{filter:brightness(1.08);}
  .tile .play .arw{font-size:19px; transition:transform .16s;}
  .tile:hover .play .arw{transform:translateX(4px);}
  /* Mobile: the hub's row layout, for the hub's reason. A 2-up grid leaves each
     card too narrow for a sentence, so the description was switched off, and
     nine abstract icons with names like "Alma Mater" and "Odd One Out" told a
     player nothing. A full-width row has room for the blurb that is already
     written, so it shows it. */
  @media (max-width:640px){
    .tiles{grid-template-columns:1fr; gap:10px;}
    .tile{flex-direction:row; align-items:stretch; border-radius:14px;}
    .tile:hover{transform:none;}
    .tile .cap{flex:0 0 86px; height:auto; position:static;}
    .tile .cap svg{width:50px; height:50px;}
    .tile .status{top:9px; right:10px; font-size:8.5px; padding:3px 7px;}
    .tile .body{padding:11px 12px 11px 13px; justify-content:center; min-width:0;}
    .tile .nm{font-size:16.5px; padding-right:60px;}
    .tile .desc{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
      font-size:12.5px; line-height:1.42; margin:4px 0 0;}
    .tile .foot{padding-top:8px;}
    /* margin-left:auto as well as the meta's margin-right:auto, so the button
       still sits right when a long "3 played, last Fri Aug 14" wraps it onto
       its own line instead of leaving it stranded at the left edge. */
    .tile .play{min-height:33px; padding:0 15px; font-size:12.5px; flex:0 0 auto; margin-left:auto;}
  }
  @media (max-width:360px){
    .tile .cap{flex:0 0 68px;} .tile .cap svg{width:42px; height:42px;}
    .tile .body{padding:11px 10px 11px 11px;}
    .tile .nm{font-size:15.5px; padding-right:54px;}
    .tile .desc{font-size:12px;}
    .tile .tmeta{font-size:9.5px; letter-spacing:.05em;}
    .tile .play{padding:0 13px; font-size:12px;}
  }
  .arch-note{text-align:center; color:var(--dim); font-size:11.5px; margin:18px 0 4px; line-height:1.5;}
  .foot{text-align:center; color:var(--dim); font-size:11.5px; padding:14px 0 2px;}
  .foot a{color:var(--coralT);}
</style>

<script>
(function(){
  // days of archive since launch; drives the gate's concrete pitch
  var VAULTD = (function(){ try{ var L=(window.RTGArchive&&RTGArchive.LAUNCH)||'2026-07-22';
    return Math.max(0, Math.floor((Date.now()-Date.parse(L))/864e5)); }catch(e){ return 0; } })();
  'use strict';
  var LS=window.localStorage;
  var content=document.getElementById('content');
  var LAUNCH=(window.RTGArchive&&RTGArchive.LAUNCH)||'2026-06-01';

  function isPro(){ return !!(window.RTGTokens && RTGTokens.isPro && RTGTokens.isPro()); }
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function pretty(s){ try{ var d=new Date(s+'T00:00:00'); return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric', year:'numeric'}); }catch(e){ return s; } }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function renderGate(){
    content.innerHTML =
      '<div class="gate">'+
        '<div class="crown"><svg width="28" height="28" viewBox="0 0 24 24" fill="#20140a" aria-hidden="true"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-1.6 11H4.6L3 7z"/></svg></div>'+
        // the day count is live: an abstract perk becomes a specific pile
        '<h2>' + (VAULTD > 0 ? (VAULTD + ' days are waiting') : 'The Vault is an Arcade Card perk') + '</h2>'+
        '<p>' + (VAULTD > 0
          ? ('That’s ' + (VAULTD * 9) + ' puzzles you can still play, across all nine games.')
          : 'Go back and play any puzzle you missed, from any game.') + '</p>'+
        '<ul>'+
          '<li><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg><span>Replay every past day, every game</span></li>'+
          '<li><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg><span>All ten games, unlimited, every day</span></li>'+
          '<li><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg><span>Your streak and today’s leaderboard stay untouched</span></li>'+
        '</ul>'+
        '<button class="btn" id="goPro">Get Arcade Card</button>'+
        '<p class="fine" id="gateFine">$4.17/mo billed annually (save 30%) or $5.99/month. Cancel anytime.</p>'+
      '</div>';
    // Open the shared Arcade Card paywall (handles plan choice and
    // sign-in-first if needed). Falls back to the old inline checkout only if
    // card.js somehow isn't present.
    document.getElementById('goPro').addEventListener('click', function(){
      if(window.RTGCard){ RTGCard.paywall({ reason:'archive' }); return; }
      var st=(window.RTG_BOARD && RTG_BOARD.state()) || {};
      if(!st.signedIn){ if(window.RTGAuthUI) RTGAuthUI.open('signin'); return; }
      fetch('/api/stripe/checkout', { method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ user_id: st.userId, plan:'annual' }) })
        .then(function(r){ return r.json(); }).then(function(d){ if(d && d.url) location.href=d.url; });
    });
  }

  /* The two groups the hub uses, in the hub's order. High Low is absent on
     purpose: an endless streak game has no daily puzzle, so it keeps no past
     days. Anything the calendar adds later that is not listed here still shows,
     under "Daily puzzles", rather than vanishing. */
  var SECTIONS=[
    { title:'Daily puzzles', sub:'One past day at a time, as many as you like.',
      keys:['match','sportegories','crossword','rankit','guess'] },
    { title:'Streak games', sub:'That day’s run, replayed until you beat it.',
      keys:['almamater','career','table','oddone'] }
  ];

  // Every past day the vault holds, oldest first.
  function vaultDays(){
    var out=[], t=iso(new Date());
    var d=new Date(LAUNCH+'T00:00:00');
    for(var i=0;i<4000;i++){
      var s=iso(d); if(s>=t) break;
      out.push(s); d.setDate(d.getDate()+1);
    }
    return out;
  }

  /* What this member has actually done in here. doneDates() reads the same
     rtg:<game>:done:<date> log the calendar puts its checkmarks from, so a tile
     and the calendar behind it can never disagree. */
  function progress(list, days){
    var byGame={}, played=0, latest=null;
    for(var i=0;i<list.length;i++){
      var g=list[i];
      var done=(window.RTGArchive && RTGArchive.doneDates) ? RTGArchive.doneDates(g.key) : {};
      var n=0, last=null;
      for(var j=0;j<days.length;j++){
        if(done[days[j]]){ n++; if(!last || days[j]>last) last=days[j]; }
      }
      byGame[g.key]={ n:n, last:last };
      played+=n;
      if(last && (!latest || last>latest.date)) latest={ date:last, game:g };
    }
    return { byGame:byGame, played:played, total:days.length*list.length, latest:latest };
  }

  function statusChip(n, of){
    if(!of) return '';
    if(n===0)  return '<span class="status">'+of+' day'+(of===1?'':'s')+'</span>';
    if(n>=of)  return '<span class="status all">All '+of+'</span>';
    return '<span class="status some">'+n+' / '+of+'</span>';
  }
  function metaLine(n, last){
    if(n===0) return 'Not started';
    return n+' played · last '+pretty(last).replace(/,? \d{4}$/,'');
  }

  // Home-page-style grid: one tile per game, carrying that game's own vault
  // progress. Clicking a tile opens its calendar via the shared RTGCalendar.
  function renderList(){
    var list=(window.RTGCalendar && RTGCalendar.GAMES) || [];
    var days=vaultDays(), of=days.length;
    var p=progress(list, days);

    // headline progress, in the slot the hub gives its pips
    var bar=document.getElementById('vprog');
    if(bar && p.total){
      var pct=Math.round((p.played/p.total)*100);
      bar.hidden=false;
      bar.classList.toggle('all', p.played>=p.total);
      document.getElementById('vfill').style.width=Math.max(pct?3:0, pct)+'%';
      document.getElementById('vprogT').textContent=p.played+' / '+p.total+' played';
    }

    var html='<div class="vstats">'+
      '<div class="s"><span class="n">'+of+'</span><span class="c">Days in the vault</span></div>'+
      '<div class="s gold"><span class="n">'+p.played+'</span><span class="c">Puzzles played</span></div>'+
      '<div class="s"><span class="n">'+Math.max(0, p.total-p.played)+'</span><span class="c">Still to play</span></div>'+
    '</div>';

    /* A member who has been here before almost always wants the day they were
       last on, and the old page made them pick a game, then find the date in a
       calendar, every single time. */
    if(p.latest){
      html+='<button class="resume" type="button" id="resume" data-k="'+esc(p.latest.game.key)+'">'+
        '<span class="ic" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></svg></span>'+
        '<span class="t"><b>Pick up where you left off</b><span>'+esc(p.latest.game.name)+' · '+esc(pretty(p.latest.date))+'</span></span>'+
        '<span class="arw" aria-hidden="true">→</span>'+
      '</button>';
    }

    var seen={}, s, i, g;
    html+='<div class="tiles">';
    for(s=0;s<SECTIONS.length;s++){
      var sec=SECTIONS[s], rows='';
      for(i=0;i<sec.keys.length;i++){
        g=byKey(list, sec.keys[i]); if(!g) continue;
        seen[g.key]=1; rows+=tileHTML(g, p.byGame[g.key], of);
      }
      if(!rows) continue;
      html+='<div class="tsec"><b>'+esc(sec.title)+'</b><span>'+esc(sec.sub)+'</span></div>'+rows;
    }
    var extra='';
    for(i=0;i<list.length;i++){ if(!seen[list[i].key]) extra+=tileHTML(list[i], p.byGame[list[i].key], of); }
    if(extra) html+=extra;
    html+='</div>';

    html+='<div class="arch-note">Every day back to launch, on every game above.<br>Vault runs chase your personal best. Today’s streak and leaderboard belong to today’s game.</div>';
    content.innerHTML=html;

    [].forEach.call(content.querySelectorAll('[data-k]'), function(btn){
      btn.addEventListener('click', function(){
        var k=btn.getAttribute('data-k');
        if(window.RTGCalendar) RTGCalendar.open(k);
      });
    });
  }

  function byKey(list, k){ for(var i=0;i<list.length;i++){ if(list[i].key===k) return list[i]; } return null; }

  function tileHTML(g, st, of){
    st=st||{n:0,last:null};
    /* The mark comes from gamemarks.js, the same definition the daily page
       renders, animations included. calendar.js used to carry a second, static
       set of its own, which is how the two pages drifted apart. */
    var mark = (window.RTGGameMarks && RTGGameMarks.svg(g.key)) || '';
    return '<button class="tile '+g.cls+'" type="button" data-k="'+esc(g.key)+'">'+
      '<span class="cap" data-mark="'+esc(g.key)+'" aria-hidden="true">'+statusChip(st.n, of)+mark+'</span>'+
      '<span class="body">'+
        '<span class="nm">'+esc(g.name)+'</span>'+
        '<span class="desc">'+esc(g.desc)+'</span>'+
        '<span class="foot">'+
          '<span class="tmeta">'+esc(metaLine(st.n, st.last))+'</span>'+
          '<span class="play">Pick a day <span class="arw">→</span></span>'+
        '</span>'+
      '</span>'+
    '</button>';
  }

  // First paint from whatever we know synchronously (localStorage). The Stripe
  // entitlement is mirrored asynchronously by board.js (reads the subscriptions
  // row → localStorage 'runthegrid_pro'), so when a player lands here straight
  // back from Checkout the flag may not be set yet. Re-check on every board
  // change and flip the gate to the list the moment the card is confirmed - no
  // manual refresh required.
  var proShown=false, gateShown=false;
  function paint(){
    if(isPro()){ if(!proShown){ proShown=true; renderList(); } return; }
    if(!proShown && !gateShown){ gateShown=true; renderGate(); }
  }
  paint();
  if(window.RTG_BOARD && RTG_BOARD.onChange){ RTG_BOARD.onChange(paint); }

  // theme toggle
  function applyThemeMeta(){ var t=document.documentElement.getAttribute('data-theme'); var m=document.getElementById('themeMeta'); if(m) m.setAttribute('content', t==='light'?'#EEF2F7':'#071426'); }
  applyThemeMeta();
  document.getElementById('themeBtn').addEventListener('click', function(){ var next=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'; document.documentElement.setAttribute('data-theme',next); try{ LS.setItem('runthegrid_theme',next); }catch(e){} applyThemeMeta(); });
})();
</script>
</body>
</html>
