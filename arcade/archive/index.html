<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Run The Arcade: Archive | RunThe.GG</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#071426" id="themeMeta" />
<script>
(function(){ var t; try{ t=localStorage.getItem('runthegrid_theme'); }catch(e){}
  if(t!=='light'&&t!=='dark'){ t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'; }
  document.documentElement.setAttribute('data-theme',t); })();
</script>
<meta name="description" content="Play any past day's Run The Arcade puzzles, a Pro feature." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23071426'/%3E%3Crect x='7' y='7' width='7' height='7' rx='1.5' fill='%232F6BFF'/%3E%3Crect x='18' y='7' width='7' height='7' rx='1.5' fill='%23F06A5F'/%3E%3Crect x='7' y='18' width='7' height='7' rx='1.5' fill='%23F2B632'/%3E%3Crect x='18' y='18' width='7' height='7' rx='1.5' fill='%23A982F3'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=Press+Start+2P&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/arcade/arcade.css?v=1" />
<script src="/arcade/icons.js?v=1"></script>
<style>
  :root{
    --bg:#071426; --card:#10233A; --card2:#162B44; --card3:#1A3350;
    --ink:#F4F7FB; --mut:#A9B8CB; --dim:#7C8DA3;
    --line:rgba(244,247,251,.08); --line2:rgba(244,247,251,.15);
    --coral:#F06A5F; --blue:#2F6BFF; --violet:#A982F3; --gold:#F2B632; --teal:#37C5D5; --green:#48D17A; --pink:#F65C9C; --gray:#AAB6C4;
    --coralT:#F06A5F; --goldT:#F2B632; --tealT:#37C5D5; --greenT:#48D17A;
    --shadow:0 6px 18px -10px rgba(0,0,0,.55);
    --f:'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --hero:'Anton', Impact, sans-serif; --pix:'Press Start 2P', monospace;
  }
  :root[data-theme="light"]{
    --bg:#EEF2F7; --card:#FFFFFF; --card2:#F1F5FA; --card3:#E3EDF8;
    --ink:#0D1B2C; --mut:#51637A; --dim:#8B98A6;
    --line:rgba(13,27,44,.10); --line2:rgba(13,27,44,.18);
    --coralT:#D8452F; --goldT:#A87508; --tealT:#0E7C89; --greenT:#17A34A;
    --shadow:0 6px 18px -12px rgba(13,27,44,.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{font-family:var(--f); color:var(--ink); background:var(--bg); min-height:100dvh; -webkit-font-smoothing:antialiased;}
  a{color:inherit; text-decoration:none;}
  :focus-visible{outline:2px solid var(--teal); outline-offset:2px; border-radius:4px;}
  .wrap{width:100%; max-width:760px; margin:0 auto; padding:calc(10px + env(safe-area-inset-top,0)) 14px 48px;}
  .topbar{display:flex; align-items:center; gap:8px; padding:6px 2px 14px;}
  .icon-btn{width:30px; height:36px; display:inline-flex; align-items:center; justify-content:center; font-size:24px; color:var(--mut); flex:0 0 auto;}
  .brand.logo{display:inline-flex; flex-direction:column; align-items:flex-start; line-height:0; min-width:0;}
  .brand.logo img{height:44px; width:auto; display:block;}
  .brand.logo .sub{display:block; font-family:var(--pix); font-size:8px; letter-spacing:2px; color:var(--mut); margin-top:4px; margin-left:2px; white-space:nowrap;}
  .spacer{flex:1;}
  .themeBtn{width:36px; height:36px; border-radius:9px; border:1px solid var(--line2); background:var(--card); color:var(--mut); display:inline-flex; align-items:center; justify-content:center; box-shadow:var(--shadow); cursor:pointer; padding:0; flex:0 0 auto;}
  .themeBtn:hover{color:var(--ink);}
  .themeBtn .ic-moon{display:none;} .themeBtn .ic-sun{display:block;}
  :root[data-theme="light"] .themeBtn .ic-moon{display:block;}
  :root[data-theme="light"] .themeBtn .ic-sun{display:none;}
  .pill{font-size:9px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; color:#20140a; background:var(--gold); border-radius:999px; padding:4px 9px; flex:0 0 auto;}

  .hero{text-align:left; margin:2px 0 18px;}
  .hero h1{font-family:var(--hero); font-weight:400; letter-spacing:.02em; text-transform:uppercase; font-size:30px; margin:0 0 4px; color:var(--ink);}
  .hero p{margin:0; font-size:13.5px; color:var(--mut); font-weight:600; line-height:1.5;}

  /* pro upsell */
  .gate{background:var(--card); border:1px solid var(--line2); border-radius:18px; box-shadow:var(--shadow); padding:24px 20px; text-align:center; max-width:460px; margin:8px auto;}
  .gate .crown{width:56px; height:56px; border-radius:16px; margin:0 auto 14px; display:flex; align-items:center; justify-content:center; background:linear-gradient(150deg,var(--coral),#D8452F); box-shadow:0 10px 26px -10px rgba(240,106,95,.8);}
  .gate h2{font-family:var(--hero); font-weight:400; letter-spacing:.02em; text-transform:uppercase; font-size:22px; margin:0 0 6px;}
  .gate p{font-size:13px; color:var(--mut); margin:0 0 16px; line-height:1.55;}
  .gate ul{list-style:none; padding:0; margin:0 0 20px; text-align:left; display:inline-block;}
  .gate li{font-size:13.5px; font-weight:700; color:var(--ink); margin:9px 0; display:flex; gap:9px; align-items:flex-start;}
  .gate li svg{flex:0 0 auto; margin-top:1px; color:var(--greenT);}
  .btn{appearance:none; border:0; cursor:pointer; font-family:var(--f); font-weight:900; font-size:15px; border-radius:13px; padding:15px 20px; min-height:52px; width:100%; background:var(--coral); color:#fff; box-shadow:var(--shadow);}
  .btn:hover{filter:brightness(1.06);}
  .gate .fine{font-size:11px; color:var(--dim); margin:12px 0 0; font-weight:600;}

  /* pro bar */
  .probar{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line2); border-radius:12px; padding:10px 14px; box-shadow:var(--shadow); margin-bottom:16px;}
  .probar b{color:var(--goldT); font-family:var(--hero); font-weight:400; letter-spacing:.04em; font-size:15px;}
  .probar span{font-size:12px; color:var(--mut); font-weight:600;}
  .probar .off{margin-left:auto; font-size:11px; font-weight:800; color:var(--mut); border:1px solid var(--line2); border-radius:999px; padding:5px 11px; cursor:pointer; background:var(--card2);}
  .probar .off:hover{color:var(--ink);}

  /* day cards */
  .day{background:var(--card); border:1px solid var(--line2); border-radius:14px; box-shadow:var(--shadow); padding:13px 15px; margin-bottom:11px;}
  .day .dh{display:flex; align-items:baseline; gap:9px; margin-bottom:11px;}
  .day .dh .d{font-family:var(--hero); font-weight:400; font-size:17px; color:var(--ink); letter-spacing:.01em;}
  .day .dh .ago{font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--dim);}
  .games{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  @media(min-width:560px){ .games{grid-template-columns:repeat(4,1fr);} }
  .gm{display:flex; align-items:center; gap:8px; border:1px solid var(--line2); border-left:4px solid var(--c,var(--mut)); border-radius:10px; background:var(--card2); padding:9px 11px; font-weight:800; font-size:12.5px; color:var(--ink); transition:transform .08s, border-color .15s;}
  .gm:hover{border-color:var(--c,var(--mut)); transform:translateY(-1px);}
  .gm .dot{width:9px; height:9px; border-radius:3px; background:var(--c,var(--mut)); flex:0 0 auto;}
  .arch-note{text-align:center; color:var(--dim); font-size:11.5px; margin:18px 0 4px;}
  .foot{text-align:center; color:var(--dim); font-size:11.5px; padding:14px 0 2px;}
  .foot a{color:var(--coralT);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="icon-btn" href="/arcade/" aria-label="Back to Run The Arcade">‹</a>
    <a class="brand logo" href="/arcade/" aria-label="Run The Arcade home"><img src="/arcade/assets/runthearcade-logo.png" alt="Run The Arcade" width="900" height="521" /><span class="sub">ARCHIVE</span></a>
    <div class="spacer"></div>
    <span class="pill" id="proPill" hidden>PRO</span>
    <button class="themeBtn" id="themeBtn" type="button" aria-label="Toggle light or dark theme" title="Light / dark">
      <svg class="ic-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ic-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
    </button>
  </div>

  <div class="hero">
    <h1>The Archive</h1>
    <p>Missed a day? Replay any past Run The Arcade puzzle. Archive runs are just for fun. They don't touch your streak or the daily leaderboard.</p>
  </div>

  <div id="content"></div>

  <div class="foot">Part of <b>Run The Arcade</b> · <a href="/arcade/">Today's puzzles</a> · <a href="/">RunThe.GG</a></div>
</div>

<script src="/arcade/tokens.js"></script>
<script src="/arcade/archive.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/arcade/board.js"></script>
<script>
(function(){
  'use strict';
  var LS=window.localStorage;
  var content=document.getElementById('content');
  var LAUNCH=(window.RTGArchive&&RTGArchive.LAUNCH)||'2026-06-01';
  var MAX_DAYS=45;
  var GAMES=[
    {k:'table', path:'table', name:'Run The Table', c:'var(--gold)'},
    {k:'match', path:'match', name:'Daily Match', c:'var(--blue)'},
    {k:'career', path:'career', name:'Career Path', c:'var(--green)'},
    {k:'oddone', path:'oddone', name:'Odd One Out', c:'var(--violet)'},
    {k:'rankit', path:'rankit', name:'Rank It', c:'var(--pink)'},
    {k:'almamater', path:'almamater', name:'Alma Mater', c:'var(--gold)'},
    {k:'guess', path:'guess', name:'Guess the Player', c:'var(--coral)'},
    {k:'crossword', path:'crossword', name:'Daily Crossword', c:'var(--gray)'},
    {k:'wordsearch', path:'wordsearch', name:'Word Search', c:'var(--teal)'}
  ];

  function isPro(){ return !!(window.RTGTokens && RTGTokens.isPro && RTGTokens.isPro()); }
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function pretty(s){ try{ var d=new Date(s+'T00:00:00'); return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric', year:'numeric'}); }catch(e){ return s; } }
  function daysAgo(s){ var a=new Date(s+'T00:00:00'), b=new Date(iso(new Date())+'T00:00:00'); var n=Math.round((b-a)/86400000); return n===1?'Yesterday':(n+' days ago'); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function renderGate(){
    content.innerHTML =
      '<div class="gate">'+
        '<div class="crown"><svg width="28" height="28" viewBox="0 0 24 24" fill="#20140a" aria-hidden="true"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-1.6 11H4.6L3 7z"/></svg></div>'+
        '<h2>Past days are a Pro perk</h2>'+
        '<p>Go back and play any puzzle you missed, from any of the eight games.</p>'+
        '<ul>'+
          '<li><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg><span>Replay every past day, all eight games</span></li>'+
          '<li><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg><span>Unlimited plays, no daily token limit</span></li>'+
          '<li><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg><span>Your streak and today’s leaderboard stay untouched</span></li>'+
        '</ul>'+
        '<button class="btn" id="goPro">Get Pro</button>'+
        '<p class="fine" id="gateFine">Unlimited plays + every past day. Cancel anytime.</p>'+
        '<p class="fine"><a href="#" id="unlock" style="color:var(--dim); text-decoration:underline;">Preview unlock (testing)</a></p>'+
      '</div>';
    // Stripe checkout — needs a signed-in RunThe.GG account so the
    // subscription can be tied to it. Falls back gracefully pre-config.
    document.getElementById('goPro').addEventListener('click', function(){
      var btn=this; btn.disabled=true; btn.textContent='Opening checkout…';
      var st=(window.RTG_BOARD && RTG_BOARD.state()) || {};
      if(!st.signedIn){
        document.getElementById('gateFine').textContent='Sign in with your RunThe.GG account first, then tap Get Pro.';
        btn.disabled=false; btn.textContent='Get Pro';
        return;
      }
      fetch('/api/stripe/checkout', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ user_id: st.userId })
      }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
        .then(function(res){
          if(res.ok && res.d && res.d.url){ location.href=res.d.url; return; }
          document.getElementById('gateFine').textContent='Checkout isn’t live yet. Use the preview unlock below for now.';
          btn.disabled=false; btn.textContent='Get Pro';
        })
        .catch(function(){
          document.getElementById('gateFine').textContent='Checkout isn’t live yet. Use the preview unlock below for now.';
          btn.disabled=false; btn.textContent='Get Pro';
        });
    });
    document.getElementById('unlock').addEventListener('click', function(ev){
      ev.preventDefault();
      try{ LS.setItem('runthegrid_pro','1'); }catch(e){}
      location.reload();
    });
  }

  function renderList(){
    document.getElementById('proPill').hidden=false;
    var today=iso(new Date());
    var html='<div class="probar"><b>PRO</b><span>Unlimited plays + past days unlocked</span><button class="off" id="proOff">Turn off preview</button></div>';
    // yesterday back to LAUNCH, capped
    var d=new Date(today+'T00:00:00'); d.setDate(d.getDate()-1);
    var count=0;
    while(count<MAX_DAYS){
      var ds=iso(d);
      if(ds<LAUNCH) break;
      html+='<div class="day"><div class="dh"><span class="d">'+esc(pretty(ds))+'</span><span class="ago">'+esc(daysAgo(ds))+'</span></div><div class="games">';
      for(var i=0;i<GAMES.length;i++){ var g=GAMES[i];
        html+='<a class="gm" style="--c:'+g.c+'" href="/arcade/'+g.path+'/?date='+ds+'"><span class="dot"></span>'+esc(g.name)+'</a>';
      }
      html+='</div></div>';
      d.setDate(d.getDate()-1); count++;
    }
    html+='<div class="arch-note">Showing the last '+count+' days, back to launch.</div>';
    content.innerHTML=html;
    document.getElementById('proOff').addEventListener('click', function(){
      try{ LS.removeItem('runthegrid_pro'); }catch(e){}
      location.reload();
    });
  }

  if(isPro()) renderList(); else renderGate();

  // theme toggle
  function applyThemeMeta(){ var t=document.documentElement.getAttribute('data-theme'); var m=document.getElementById('themeMeta'); if(m) m.setAttribute('content', t==='light'?'#EEF2F7':'#071426'); }
  applyThemeMeta();
  document.getElementById('themeBtn').addEventListener('click', function(){ var next=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'; document.documentElement.setAttribute('data-theme',next); try{ LS.setItem('runthegrid_theme',next); }catch(e){} applyThemeMeta(); });
})();
</script>
</body>
</html>
