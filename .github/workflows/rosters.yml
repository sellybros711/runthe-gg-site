name: Refresh rosters
on:
  schedule:
    - cron: '0 10 * * 1'   # Mondays 10:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-rosters.mjs
      # Pack before the bump, so the version moves with the bytes that ship.
      # Shape-preserving and idempotent: see scripts/lib/packdata.mjs.
      - run: node scripts/pack-arcade-data.mjs rosters
      # A data file that changed and kept its ?v= hands a returning visitor the
      # old data against the new page. Only when it actually moved: a bump with
      # no change is a re-download for everybody who already has the file.
      - name: Bump the cache version if the data moved
        run: git diff --quiet -- arcade/rosters.js || node scripts/bump-cachebust.mjs arcade/rosters.js
      - name: Commit if changed
        run: |
          git config user.name "roster-bot"
          git config user.email "noreply@anthropic.com"
          # -u picks up the pages the bump rewrote and scripts/cachebust.json.
          git add arcade/rosters.js && git add -u
          git diff --cached --quiet && echo "no changes" || {
            git commit -m "Refresh NBA/NFL/MLB rosters from ESPN"
            # Rebase-and-retry: the former/leaderboard Actions push to main too, so
            # a concurrent run can advance the ref while this job runs. Rebase onto
            # the latest main and retry so the push never fails on a non-fast-forward
            # (rosters.js and former.js differ, so the rebase is always clean).
            for i in 1 2 3 4 5; do
              git push && break
              echo "push rejected, rebasing onto latest main (attempt $i)"
              git pull --rebase origin main || exit 1
            done
          }
