name: Refresh rosters
on:
  schedule:
    - cron: '0 10 * * 1'   # Mondays 10:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-rosters.mjs
      - name: Commit if changed
        run: |
          git config user.name "roster-bot"
          git config user.email "noreply@anthropic.com"
          git add arcade/rosters.js
          git diff --cached --quiet && echo "no changes" || {
            git commit -m "Refresh NBA/NFL/MLB rosters from ESPN"
            # Rebase-and-retry: the former/leaderboard Actions push to main too, so
            # a concurrent run can advance the ref while this job runs. Rebase onto
            # the latest main and retry so the push never fails on a non-fast-forward
            # (rosters.js and former.js differ, so the rebase is always clean).
            for i in 1 2 3 4 5; do
              git push && break
              echo "push rejected, rebasing onto latest main (attempt $i)"
              git pull --rebase origin main || exit 1
            done
          }
