name: Baseball checks

# Run The Diamond's October decides nothing on screen: generatePlayoffs() settles
# the player's path, and both the bracket and the at-bat simulator are built around
# it. The failures that follow from that are all invisible in a screenshot, which
# is what these two check.
#
#   node baseball/check-atbats.mjs    the line score adds up to the score it was handed
#   node baseball/check-bracket.mjs   the field agrees with the run it was built from
#
# No secrets, no network, no deploy.

on:
  pull_request:
    paths:
      - 'baseball/**'
      - '.github/workflows/baseball-checks.yml'
  push:
    branches: [main]
    paths:
      - 'baseball/**'
      - '.github/workflows/baseball-checks.yml'
  workflow_dispatch: {}

concurrency:
  group: baseball-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 25,000 games off the run distribution resolveGame() actually produces,
      # then every game of 25 real brackets drafted and played from scratch.
      # Asserts the line score is always the score it was handed, that no inning
      # runs past three outs, that a walk-off is a home win on the last play, and
      # that the shape (plate appearances, hits, scoreless innings) is baseball.
      - name: The at-bat simulator
        run: node baseball/check-atbats.mjs 25000

      # 150 brackets, each off a run drafted and played from scratch. Asserts the
      # seat across from the player is the club the run really scheduled, twelve
      # clubs from twelve franchises with no season drawn twice, that nobody is
      # paired with themselves, and that a column stays unknown until the one
      # feeding it has been played. A bracket that puts the 1951 Giants on both
      # sides of the World Series renders perfectly, which is why this exists.
      - name: The playoff bracket
        run: node baseball/check-bracket.mjs 150

      # What a row SAYS it is. A two-way season is two rows, so each one's WAR
      # is half of what a lookup returns; TOT is not a club; and the WAR is
      # bWAR rather than fWAR. None of that throws and none of it looks wrong,
      # so the only symptom is a player checking a number and finding a
      # different one. Also asserts the coverage: a new surface printing a raw
      # club code is how the labels come back.
      - name: What a player-season says it is
        run: node baseball/check-labels.mjs

      # All-Time Staff assigns its own slots, because SP3 against SP4 is a
      # question staffEra cannot hear: it averages the rotation and averages the
      # pen. What it CAN hear is rotation against bullpen and who closes, so the
      # sort is held to the ranking, to eligibility, and to leaving every other
      # mode alone. A staff sorted wrong is a legal roster the sim reads happily.
      - name: The staff sorts itself
        run: node baseball/check-staff.mjs 60

      # The two themes. A dark mode bolted onto a cream page fails silently three
      # ways: a panel nobody tokenised stays cream, a hairline written
      # rgba(0,0,0,.10) stops existing, and an accent solved against paper goes
      # unreadable. None of the three throws and a screenshot of the one screen
      # somebody looked at shows none of them. It measures the real screens in a
      # real browser, and what it FAILS on is a regression against the light
      # theme rather than an absolute, because the light palette predates it.
      #
      # The front page is two designs rather than two sizes of one, and the order
      # is CSS over the phone's markup, so every way it rots renders perfectly: a
      # block that leaks under its breakpoint, a display:contents that stops
      # applying, an element added with no order. And the reel geometry under both
      # is one property now, where a wrong row height spins, lands and draws the
      # highlight around the row next to the pick.
      - name: The front page, and the reel under it
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node baseball/check-theme.mjs
          node baseball/check-home.mjs
