name: Refresh Run The Floor player data

# Builds hoops/data/players.json from Basketball-Reference and commits it.
#
# THIS IS THE ONLY PLACE THE PIPELINE CAN RUN. Basketball-Reference is blocked
# from the development sandbox and open from GitHub's runners, which is the same
# split scripts/build-register.mjs documents and the reason hoops/build/ ships
# with a hand-entered seed at all. That seed is a fallback now rather than the
# state of things: this workflow has run, and the game plays on 16,057 real
# player-seasons. If it ever drops back to 171 rows, the fetch has failed.
#
# Five stages, and the order matters:
#   fetch-nba.mjs     every player-season: box score, win shares, position, team
#   fetch-draft.mjs   draft year and college, which no season page carries
#   fetch-awards.mjs  MVP, All-NBA, All-Defensive, All-Star and the rest
#   fetch-teams.mjs   the franchises, including the ones that no longer exist
#   build-players.mjs normalizes short seasons, prices everything, joins the rest
#
# Championships are NOT fetched. teams.json already carries every title year, so
# build-players.mjs works out who was on that roster and hands them the ring.
#
# Runnable locally by anyone who can reach the source, with the same commands.
#
# NO SECRETS. It reads a public site and writes one file back to this branch.

on:
  workflow_dispatch:
    inputs:
      from_season:
        description: 'First season (the year it ENDS, so 1974 is 1973-74)'
        required: false
        default: '1974'
      to_season:
        description: 'Last season. Leave blank for the last one that has ended.'
        required: false
      commit:
        description: 'Commit the rebuilt data back to this branch?'
        type: boolean
        default: true
  # ANNUAL, ONCE THE SEASON IS OVER. A scheduled run fires against the DEFAULT
  # branch, so this stayed commented out while hoops/ existed only on a feature
  # branch, where it would have been a guaranteed red build every July. It is
  # turned on in the same commit that merges the game, which is what the note
  # here used to promise.
  #
  # The commit step is safe to leave armed: verify.mjs and check-posture.mjs both
  # gate it, so a refresh that breaks the win-share column or the discoverability
  # posture fails without writing anything.
  schedule:
    - cron: '0 9 5 7 *'   # July 5th, after the finals and the draft

permissions:
  contents: write

concurrency:
  group: hoops-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The throttle is the runtime: two pages a season, one a draft year, and one
    # an All-Star game, all at 3.2s apart. Fifty seasons is roughly twenty
    # minutes of waiting.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # BEFORE anything is fetched. If the parsers are broken, a run that takes
      # fifteen minutes to fail is fifteen minutes wasted, and the fixtures say
      # so in a second.
      - name: Fetch parsers still parse
        run: node hoops/build/check-fetch.mjs

      # THE LAST SEASON THAT HAS ENDED, COMPUTED RATHER THAN TYPED.
      #
      # This was three copies of the literal '2025', and a SCHEDULED run passes
      # no inputs, so THE ANNUAL REFRESH WOULD HAVE ASKED FOR 2025 EVERY JULY
      # FOR EVER. It fires, it re-fetches fifty-two seasons it already has, it
      # reports "data unchanged", and the new season is never added. A green
      # run, a correct-looking log, and a game a year behind the sport with
      # nothing anywhere saying so.
      #
      # A season is named for the calendar year it ENDS in and the Finals are
      # over by the end of June, so from July the current year is the answer and
      # before July it is last year. Same cutoff fetch-teams.mjs uses to decide
      # which champions to demand, and the same reason the cron fires in July.
      - name: The last season that has ended
        id: season
        run: |
          TO="${{ inputs.to_season }}"
          if [ -z "$TO" ]; then
            Y=$(date -u +%Y)
            M=$(date -u +%m)
            # 10# forces base ten, or 08 and 09 are invalid octal and this dies.
            if [ "$((10#$M))" -lt 7 ]; then Y=$((Y - 1)); fi
            TO="$Y"
          fi
          echo "to=$TO" >> "$GITHUB_OUTPUT"
          echo "Fetching seasons through $TO"

      - name: Player-seasons
        run: |
          node hoops/build/fetch-nba.mjs \
            --from "${{ inputs.from_season || '1974' }}" \
            --to "${{ steps.season.outputs.to }}"

      # NON-FATAL, AND THAT IS A DELIBERATE DEMOTION. Draft year and college feed
      # exactly two chemistry links out of eight. The player data is the point of
      # this workflow, and it has already been fetched by the time this runs, so
      # letting a secondary enrichment abort the run threw away six minutes of
      # good data twice in a row. Without it those two links stay silent, which
      # is the documented harmless state rather than a wrong one.
      #
      # It still fails loudly IN ITS OWN LOG, and build-players.mjs prints
      # whether it found the file, so a quiet failure here is visible rather
      # than invisible.
      - name: Draft years and colleges
        continue-on-error: true
        run: node hoops/build/fetch-draft.mjs --from 1960 --to "${{ steps.season.outputs.to }}"

      # NON-FATAL FOR THE SAME REASON as the draft step above, and it is worth
      # saying which reason: the player data is the point of this workflow and
      # has already been fetched by the time this runs. Hardware is what the
      # board SHOWS about a player, not what the engine does with him, so a
      # failure here costs a tile some decoration and costs the run nothing.
      #
      # Without this file the only hardware is the ring, which needs no network
      # at all: teams.json knows every title year. build-players.mjs prints
      # which of the two it found, so a quiet failure here is still visible.
      - name: Awards and hardware
        continue-on-error: true
        run: |
          node hoops/build/fetch-awards.mjs \
            --from "${{ inputs.from_season || '1974' }}" \
            --to "${{ steps.season.outputs.to }}"

      # Franchises change: a club relocates, renames, or wins a title. Refreshed
      # in the same run so the team table and the player table are never built
      # from two different days.
      - name: Franchises
        run: node hoops/build/fetch-teams.mjs

      - name: Price it and write the file the game loads
        run: |
          node hoops/build/build-players.mjs \
            --from hoops/build/raw/nba_player_seasons.json

      # A POOL CACHES EXACTLY LIKE A SCRIPT, so a refresh that rewrites one and
      # leaves its ?v= alone serves a RETURNING player the old basketball. The
      # page revalidates, the data does not, and the only symptom is somebody
      # insisting the new season is not in the game. No crash, no wrong screen.
      #
      # THIS STEP EXISTS BECAUSE THE REFRESH IS THE ONE WRITER THAT CANNOT DO IT
      # BY HAND. Everywhere else the bump and the edit are the same commit by a
      # person; here a bot rewrites 3.6MB of player-seasons once a year and
      # nobody is watching. So it bumps what it actually changed, and only that:
      # `git diff --quiet` is the test, so a run that finds no new basketball
      # moves no number and commits nothing.
      - name: Bump the cache version of anything that moved
        run: |
          for f in players teams; do
            git diff --quiet -- "hoops/data/$f.json" && continue
            CUR=$(grep -o "data/$f\.json?v=[0-9]\+" hoops/index.html | head -1 | sed 's/.*=//')
            if [ -z "$CUR" ]; then
              echo "hoops/index.html does not version data/$f.json, which it must" >&2
              exit 1
            fi
            NEXT=$((CUR + 1))
            sed -i "s|data/$f\.json?v=$CUR|data/$f.json?v=$NEXT|g" hoops/index.html
            echo "data/$f.json: v=$CUR -> v=$NEXT"
          done
          node scripts/check-cachebust.mjs --update
          node scripts/check-cachebust.mjs

      # AND THE SEASON RANGE ON THE FRONT PAGE, for the same reason and by the
      # same argument. `#home-era` is interpolated from the pool at runtime, so
      # the range in the markup is what a reader sees for the moment before the
      # data arrives and for as long as it does not. It is the only claim on
      # that page that goes wrong WITHOUT anybody editing anything: this refresh
      # adds a season and leaves it a year out.
      #
      # IT WENT RED ON THE FIRST REFRESH AFTER THE GUARD WAS WRITTEN, which is
      # the guard working and is also a chore nobody should have to do. The bot
      # adds the season, so the bot rewrites the sentence.
      - name: The season range the front page opens on
        run: |
          SPAN=$(node -e "
            const p = require('./hoops/data/players.json').map(r => r.s);
            process.stdout.write(Math.min(...p) + ' to ' + Math.max(...p));
          ")
          perl -0pi -e "s{(id=\"home-era\"[^>]*>)[^<]*}{\${1}$SPAN}" hoops/index.html
          echo "#home-era: $SPAN"

      # BEFORE the assertions, deliberately. Everything above this line is a
      # quarter of an hour of throttled fetching, and everything below it is a
      # second of arithmetic that can fail. Uploading first means a failed
      # assertion costs a rerun of the CHECK rather than a rerun of the FETCH,
      # and leaves the data to look at while working out why it failed.
      - uses: actions/upload-artifact@v4
        with:
          name: hoops-data
          path: |
            hoops/data/players.json
            hoops/data/teams.json
          if-no-files-found: error

      # The engine has to still be a working game after the data underneath it
      # changes by two orders of magnitude. This asserts the draft rules, the
      # replay, the cap, and that every rating is a number.
      #
      # --lineups-advisory IS THE WHOLE POINT OF RUNNING IT HERE. The lineup
      # expectations ("the 1996 Bulls run the Triangle") were calibrated against
      # 171 rows typed from memory, and real numbers can legitimately move a
      # borderline roster to a neighbouring identity. Blocking on them is the
      # same coupling mistake the draft step already made: a JUDGEMENT ABOUT A
      # MODEL stopping GROUND TRUTH from landing, and it cost a full run once.
      #
      # They are still checked and still printed loudly in this log, and the
      # pull request check (hoops-checks.yml) runs the same file WITHOUT the
      # flag, so nothing can be quietly left drifted. Everything else blocks
      # here exactly as it does there.
      - name: Engine, draft rules, and the fit model
        run: node hoops/verify.mjs --lineups-advisory

      - name: Discoverability posture
        run: node hoops/check-posture.mjs

      # The badges read the same data everything else does, so a refresh that
      # moved the price curve or the award join can quietly make one of them
      # unreachable. That failure is silent by construction: the cabinet still
      # renders and the square just never lights.
      - name: Badges are reachable
        run: node hoops/check-badges.mjs

      - name: Commit
        if: ${{ inputs.commit }}
        run: |
          git config user.name "hoops-data-bot"
          git config user.email "noreply@anthropic.com"
          # The page and the record go with the data: the bump step above edits
          # index.html and scripts/cachebust.json, and a commit that left either
          # behind would ship a pool under a version nobody asks for.
          git add hoops/data/players.json hoops/data/teams.json \
                  hoops/index.html scripts/cachebust.json
          git diff --cached --quiet && echo "data unchanged" || {
            git commit -m "Refresh Run The Floor player data from Basketball-Reference"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push rejected, rebasing (attempt $i)"
              git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            done
          }
