name: Refresh Run The Floor player data

# Builds hoops/data/players.json from Basketball-Reference and commits it.
#
# THIS IS THE ONLY PLACE THE PIPELINE CAN RUN. Basketball-Reference is blocked
# from the development sandbox and open from GitHub's runners, which is the same
# split scripts/build-register.mjs documents and the reason hoops/build/
# ships with a hand-entered seed at all. Until this workflow has run, the game
# is playing on 171 rows somebody typed from memory.
#
# Three stages, and the order matters:
#   fetch-nba.mjs     every player-season: box score, win shares, position, team
#   fetch-draft.mjs   draft year and college, which no season page carries
#   build-players.mjs prices everything and joins the two
#
# Runnable locally by anyone who can reach the source, with the same commands.
#
# NO SECRETS. It reads a public site and writes one file back to this branch.

on:
  workflow_dispatch:
    inputs:
      from_season:
        description: 'First season (the year it ENDS, so 1974 is 1973-74)'
        required: false
        default: '1974'
      to_season:
        description: 'Last season'
        required: false
        default: '2025'
      commit:
        description: 'Commit the rebuilt data back to this branch?'
        type: boolean
        default: true
  # NO SCHEDULE YET, AND THAT IS DELIBERATE. A scheduled run fires against the
  # DEFAULT branch, and hoops/ does not exist there while the game is still on
  # its feature branch: an annual cron would be an annual guaranteed red build
  # on main. Turn this on in the same commit that merges the game:
  #
  #   schedule:
  #     - cron: '0 9 5 7 *'   # July 5th, once the season is finished
  #
  # Until then this is dispatch-only, which is all the first run needs.

permissions:
  contents: write

concurrency:
  group: hoops-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The throttle is the runtime: two pages a season plus one a draft year, all
    # at 3.2s apart. Fifty seasons is roughly fifteen minutes of waiting.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # BEFORE anything is fetched. If the parsers are broken, a run that takes
      # fifteen minutes to fail is fifteen minutes wasted, and the fixtures say
      # so in a second.
      - name: Fetch parsers still parse
        run: node hoops/build/check-fetch.mjs

      - name: Player-seasons
        run: |
          node hoops/build/fetch-nba.mjs \
            --from "${{ inputs.from_season || '1974' }}" \
            --to "${{ inputs.to_season || '2025' }}"

      - name: Draft years and colleges
        run: node hoops/build/fetch-draft.mjs --from 1960 --to "${{ inputs.to_season || '2025' }}"

      - name: Price it and write the file the game loads
        run: |
          node hoops/build/build-players.mjs \
            --from hoops/build/raw/nba_player_seasons.json

      # The engine has to still be a working game after the data underneath it
      # changes by two orders of magnitude. This asserts the draft rules, the
      # replay, and the basketball: real lineups still have to come back as the
      # systems they are known for.
      - name: Engine, draft rules, and the fit model
        run: node hoops/verify.mjs

      - name: Discoverability posture
        run: node hoops/check-posture.mjs

      # Uploaded whether or not it is committed, so a run with commit unchecked
      # is still a way to look at what the pipeline would produce.
      - uses: actions/upload-artifact@v4
        with:
          name: hoops-players
          path: hoops/data/players.json
          if-no-files-found: error

      - name: Commit
        if: ${{ github.event_name == 'schedule' || inputs.commit }}
        run: |
          git config user.name "hoops-data-bot"
          git config user.email "noreply@anthropic.com"
          git add hoops/data/players.json
          git diff --cached --quiet && echo "data unchanged" || {
            git commit -m "Refresh Run The Floor player data from Basketball-Reference"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push rejected, rebasing (attempt $i)"
              git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            done
          }
