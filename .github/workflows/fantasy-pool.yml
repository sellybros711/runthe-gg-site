name: Build the Fantasy Challenge week

# One week of Fantasy Challenge is a board, and the board is built from the games that have
# already been played. So it can only be built AFTER the previous week finishes and BEFORE
# the next one starts, and that window is Tuesday.
#
# TUESDAY 8AM EASTERN, the owner's call (2026-10-27): the next week opens first thing
# Tuesday. The Monday game ends around midnight Eastern and nflverse publishes within a few
# hours, so by 8am the season to date is normally complete. When it is not, the build WAITS
# rather than pricing off a week with a club's game missing, because a price never moves once
# somebody has drafted: see "Is last week in". The watchdog retries hourly, and from noon
# Eastern the week opens whatever, so a late feed costs a morning and never the day.
#
# GITHUB'S CRON IS UTC AND DOES NOT KNOW ABOUT DAYLIGHT SAVING, so one entry cannot mean
# 11am Eastern all year. Both are listed and the job asks WHICH SCHEDULE FIRED rather than
# what time it is now, which is the fix setlist-data.yml carries a long note about: it used
# to read the wall clock, GitHub delayed the runs by hours, and six days of refreshes
# reported success while doing nothing.
#
# WHICH WEEK IS IT. Read off games.csv rather than counted from a start date: the first week
# with no result yet is the week to build. A season with a flexed or postponed game does not
# move, and neither does this.
#
# WHAT IT COMMITS is the week's pool plus fantasy_now.json, which is the only thing telling
# the page which week is live. Both or neither: a pool with no pointer is invisible and a
# pointer with no pool is a page that cannot load.
#
# NOTHING IS COMMITTED UNLESS check-fantasy PASSES. An unattended job that writes a board
# nobody can draft from is worse than one that writes nothing, because the mode looks live.

on:
  # TUESDAY, THEN TWO CATCH-UPS. Week 7 of 2026 never opened: the Tuesday run failed one
  # check, published nothing, and nothing ran again before the Thursday kickoff. So the same
  # job fires again Wednesday 11am and Thursday 9am Eastern. A catch-up builds ONLY a week
  # that is not live yet (see "Is it already open"), so it can never move a price somebody
  # has drafted against. On a normal week both catch-ups stop at that step and do nothing.
  #
  # TUESDAY 11AM STAYS as a settling pass: if the week opened before last week's stats were
  # all in, it finishes scoring last week (see "Settle last week").
  schedule:
    - cron: '0 12 * * 2'    # Tuesday 8am Eastern while daylight saving is in effect
    - cron: '0 13 * * 2'    # Tuesday 8am Eastern the rest of the year
    - cron: '0 15 * * 2'    # Tuesday 11am Eastern, daylight saving
    - cron: '0 16 * * 2'    # Tuesday 11am Eastern, standard time
    - cron: '0 15 * * 3'    # Wednesday 11am Eastern, daylight saving
    - cron: '0 16 * * 3'    # Wednesday 11am Eastern, standard time
    - cron: '0 13 * * 4'    # Thursday 9am Eastern, daylight saving
    - cron: '0 14 * * 4'    # Thursday 9am Eastern, standard time
  workflow_dispatch:
    inputs:
      week:
        description: 'Week to build. Leave blank to use the first unplayed week.'
        required: false
        default: ''
      catchup:
        description: 'Only build if the week is not live yet (what the watchdog sends).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: fantasy-pool
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Is this the entry for the current offset
        id: when
        run: |
          OFFSET=$(TZ=America/New_York date +%z)
          FIRED='${{ github.event.schedule }}'
          echo "New York is at UTC${OFFSET} ($(TZ=America/New_York date))"
          echo "the schedule that fired: '${FIRED}'"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual run, proceeding"
            echo "go=yes" >> "$GITHUB_OUTPUT"
          elif [ "$OFFSET" = "-0400" ] && case "$FIRED" in "0 12 * * 2"|"0 15 * * 2"|"0 15 * * 3"|"0 13 * * 4") true;; *) false;; esac; then
            echo "EDT, and this is the daylight saving entry. Proceeding."
            echo "go=yes" >> "$GITHUB_OUTPUT"
          elif [ "$OFFSET" = "-0500" ] && case "$FIRED" in "0 13 * * 2"|"0 16 * * 2"|"0 16 * * 3"|"0 14 * * 4") true;; *) false;; esac; then
            echo "EST, and this is the standard time entry. Proceeding."
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "this is the other cron entry for the current offset. Stopping."
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.when.outputs.go == 'yes'

      - uses: actions/setup-node@v4
        if: steps.when.outputs.go == 'yes'
        with:
          node-version: '22'

      # THE WEEK IS THE FIRST ONE WITH NO SCORE IN IT. A finished game carries a result in
      # games.csv, so the earliest week of this season with a blank home score is the week
      # about to be played. Asked of the schedule rather than derived from today's date,
      # because a bye, a flex or a postponement moves a date and never moves this.
      - name: Which week
        id: week
        if: steps.when.outputs.go == 'yes'
        run: node football/build/next-week.mjs --week '${{ inputs.week }}'

      # A SCHEDULED RUN NEVER REBUILDS A WEEK THAT IS ALREADY LIVE. The catch-up entries fire
      # every Wednesday and Thursday, and on a normal week the Tuesday run has already opened
      # this week: rebuilding it would reprice a board people have drafted against, which is
      # the one thing this mode must never do. So a scheduled run whose week is the one
      # fantasy_now.json already points at stops here, and so does a run the watchdog
      # dispatched (catchup), which may land just after another build opened the week. A
      # plain manual run still builds, because a person asked for it.
      - name: Is it already open
        id: open
        if: steps.when.outputs.go == 'yes'
        run: |
          LIVE=$(node -e 'const n=require("./football/data/fantasy_now.json");console.log(n.season+" "+n.week)')
          WANT='${{ steps.week.outputs.season }} ${{ steps.week.outputs.week }}'
          echo "live: $LIVE, this week: $WANT"
          GUARDED=no
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.catchup }}" = "true" ]; then GUARDED=yes; fi
          if [ "$GUARDED" = "yes" ] && [ "$LIVE" = "$WANT" ]; then
            echo "week $WANT is already open. Nothing to do."
            echo "done=yes" >> "$GITHUB_OUTPUT"
          else
            echo "done=no" >> "$GITHUB_OUTPUT"
          fi

      # SCORE THE WEEK THAT JUST FINISHED BEFORE BUILDING THE NEXT ONE, and the order is the
      # point rather than tidiness: the page finds a result by asking for the week's own
      # file, so a week whose board rolls forward before its result is written is a week
      # somebody played and can never see. By Tuesday morning the Monday night game is in.
      #
      # `|| true` because this is allowed to have nothing to do. Week one has no week zero,
      # and a manual run mid-week hits a week that is not finished, which the build refuses
      # by design. Neither is a reason to skip building the board.
      # SETTLE LAST WEEK, on a run that found this week already open. A week that opened at
      # noon on a late stats feed (see "Is last week in") went up with last week only partly
      # scored, and this is the pass that finishes it: score it again, and once it reads
      # final, publish its results and commit the file. On a normal week the results are
      # already final and this does nothing.
      - name: Settle last week
        if: steps.when.outputs.go == 'yes' && steps.open.outputs.done == 'yes'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          SEASON='${{ steps.week.outputs.season }}'
          PREV=$(( ${{ steps.week.outputs.week }} - 1 ))
          F="football/data/results_${SEASON}_w${PREV}.json"
          if [ "$PREV" -lt 1 ]; then echo "no week before this one"; exit 0; fi
          if [ -f "$F" ] && node -e "process.exit(require('./$F').final?0:1)"; then
            echo "week $PREV is already settled"; exit 0
          fi
          node football/build/weekly-results.mjs --season "$SEASON" --week "$PREV" --write
          if ! node -e "process.exit(require('./$F').final?0:1)"; then
            echo "week $PREV is still waiting on stats; the next pass will try again"; exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          OPENED=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from public.fantasy_weeks where season = $SEASON and week = $PREV")
          if [ "$OPENED" != "0" ]; then
            node football/build/publish-week.mjs --season "$SEASON" --week "$PREV" --results \
              | psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q
            echo "published week $PREV's results"
          fi
          git config user.name "fantasy-bot"
          git config user.email "noreply@anthropic.com"
          git add "$F"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fantasy Challenge: $SEASON week $PREV settled"
          for i in 1 2 3 4 5; do
            git push && break
            git pull --rebase origin main || exit 1
          done

      - name: Score the week that just ended
        if: steps.when.outputs.go == 'yes' && steps.open.outputs.done != 'yes'
        run: |
          PREV=$(( ${{ steps.week.outputs.week }} - 1 ))
          if [ "$PREV" -ge 1 ]; then
            node football/build/weekly-results.mjs \
              --season '${{ steps.week.outputs.season }}' --week "$PREV" --write || \
              echo "week $PREV could not be scored yet, carrying on"
          fi

      # IS LAST WEEK IN. The board for week N is priced off weeks 1 to N-1, so building it
      # before Monday night's stats are published would price two clubs' men without their
      # last game, and that price can never be corrected once somebody drafts. So until noon
      # Eastern on the Tuesday, a scheduled or watchdog run WAITS for last week to read final
      # (this run ends green and changes nothing; the watchdog asks again within the hour).
      # From noon it builds anyway: an open week matters more than a perfect one, and
      # "Settle last week" finishes the scoring later. A plain manual run never waits.
      - name: Is last week in
        id: ready
        if: steps.when.outputs.go == 'yes' && steps.open.outputs.done != 'yes'
        run: |
          SEASON='${{ steps.week.outputs.season }}'
          PREV=$(( ${{ steps.week.outputs.week }} - 1 ))
          F="football/data/results_${SEASON}_w${PREV}.json"
          AUTO=no
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.catchup }}" = "true" ]; then AUTO=yes; fi
          DOW=$(TZ=America/New_York date +%u); HOUR=$(TZ=America/New_York date +%H)
          FINAL=yes
          if [ "$PREV" -ge 1 ] && ! { [ -f "$F" ] && node -e "process.exit(require('./$F').final?0:1)"; }; then FINAL=no; fi
          if [ "$AUTO" = "yes" ] && [ "$FINAL" = "no" ] && [ "$DOW" = "2" ] && [ "$HOUR" -lt 12 ]; then
            echo "week $PREV is not final yet (waiting on stats). Not building before noon Eastern."
            echo "build=no" >> "$GITHUB_OUTPUT"
          else
            [ "$FINAL" = "no" ] && echo "::warning::week $PREV is not final yet; building anyway"
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi

      # THE PRICE READS THE GAME STATUS REPORT, SO THE REPORT HAS TO BE THIS MORNING'S, AND
      # THE TWO OF THEM NEED EACH OTHER. That is why the board is built twice.
      #
      # `weekly-pool.mjs` prices off `injuries_<season>_w<week>.json`, deliberately the same
      # file the page reads, and that file is written by a DIFFERENT job on a different
      # clock: fantasy-injuries.yml fires at 11:20am and 6:20pm Eastern. This one fires at
      # 11:00. So without a refresh here the board is priced off a report last refreshed at
      # twenty past six the previous evening, seventeen hours stale, and nothing anywhere
      # says so: the prices are ordinary, the board drafts, and the one number the whole
      # pricing pass was about is simply out of date.
      #
      # AND THE REFRESH CANNOT GO FIRST, which is the part that is not obvious.
      # `injuries.mjs` scopes the report to the men ON THE BOARD, so it reads the week's
      # pool file and exits 1 with "no pool for <season> week <week>. Build it first." A
      # refresh placed above the build is a step that reliably does nothing at all, and the
      # board then prices off whatever report was last committed, which is the defect this
      # is here to fix, silently intact behind a step that looks like the fix.
      #
      # SO: build, refresh, build again. THE ID SET DOES NOT DEPEND ON THE REPORT, which is
      # what makes the first pass a valid scope for the second: `eligible` comes off played
      # games, the schedule and `minGames`, and none of those reads a designation. Driven on
      # the live week 3 board, with the report present and with it moved aside: the same 414
      # men in the same order, and 5 prices different. A build is under a second against the
      # nflverse cache the first pass warms, so this costs nothing worth naming.
      - name: Build the board, to scope the report
        if: steps.ready.outputs.build == 'yes'
        run: |
          node football/build/weekly-pool.mjs \
            --season '${{ steps.week.outputs.season }}' \
            --week '${{ steps.week.outputs.week }}' --write

      # IT WRITES INTO THE RUNNER'S CHECKOUT so the rebuild below reads today's answer, and
      # the commit step at the bottom ships it with the board it priced. The injuries job
      # still owns the CADENCE (twice a day, commit only when it moves, which is what stops
      # a hundred deploys a weekend); this job commits once a week either way, so the report
      # rides along for nothing. The two never write the same week's file: the injuries job
      # writes whatever `fantasy_now.json` points at, and on the Tuesday that pointer has
      # not moved yet.
      #
      # It carries on rather than failing, because a report that cannot be fetched must not
      # stop the week. Every man then falls back to no designation, which is the board this
      # mode priced for a year, the rebuild below is then a no-op, and the read-back after it
      # is what says which of the two happened.
      - name: Refresh the injury report the price reads
        if: steps.ready.outputs.build == 'yes'
        run: |
          node football/build/injuries.mjs \
            --season '${{ steps.week.outputs.season }}' \
            --week '${{ steps.week.outputs.week }}' --write \
            || echo "the report could not be refreshed, pricing on availability alone"

      - name: Build it again, priced off that report
        if: steps.ready.outputs.build == 'yes'
        run: |
          node football/build/weekly-pool.mjs \
            --season '${{ steps.week.outputs.season }}' \
            --week '${{ steps.week.outputs.week }}' --write

      # WHICH REPORT THE PRICE ACTUALLY READ, said out loud rather than inferred from prices.
      #
      # A Tuesday build reads LAST week's report, always, because the coming week's is first
      # filed on the Wednesday: the live file's own history has `report_week` still on 2 at
      # 11:10pm Eastern Tuesday and on 3 by 3:05pm Wednesday. That is not a fault and the
      # board is correct either way, but the two are priced off different amounts of
      # information (a week old DID NOT PRACTISE is worth 0.511, a week old designation is
      # worth nothing) and the log is where somebody finds out which they got.
      - name: Which report the price read
        if: steps.ready.outputs.build == 'yes'
        run: |
          node -e '
            const fs = require("fs");
            const f = "football/data/weekly_${{ steps.week.outputs.season }}_w${{ steps.week.outputs.week }}.json";
            const p = JSON.parse(fs.readFileSync(f, "utf8"));
            /* COUNTED PER MAN, never off report_week. That field is the latest week any
               man is reported for, so a single fresh row makes a fortnight old report look
               current. report_ages is what the price actually saw. */
            const a = p.report_ages || {};
            const seen = Object.values(a).reduce((s, n) => s + n, 0);
            if (!seen) {
              console.log(`week ${p.week}: NO REPORT AT ALL, priced on availability alone`);
            } else {
              console.log(`week ${p.week}: ${seen} men are on the report`);
              console.log(`  reported for this week: ${a["this week"] || 0}`);
              console.log(`  a week old:             ${a["a week old"] || 0}`);
              console.log(`  older, so not news:     ${a.older || 0}`);
            }
            console.log(`${p.report_priced} of ${p.pool.length} men were repriced`);
          '

      # The gate. It plays 1,200 drafts three ways against the board that was just written,
      # so a week that strands or prices somebody out of reach never reaches main.
      - name: Can it be drafted
        if: steps.ready.outputs.build == 'yes'
        run: node football/check-fantasy.mjs --quick

      # ─── the server's copy ───────────────────────────────────────────────────────────
      #
      # THE DATABASE IS PUBLISHED BEFORE THE BOARD IS COMMITTED, and of the two ways to be
      # half done only one is survivable. A week open on the server that no page can see yet
      # is an unvisited week and harmless. A board on the page with no week on the server is
      # a mode that draws the wheel, takes five drafts and then refuses the submit, which is
      # the worst screen this mode could show. So the write that must not be missing goes
      # first, and a failure here stops the commit: no board at all is a state somebody
      # notices, and this one is not.
      #
      # THE BOARD GOES FIRST HERE, AND IT USED TO GO SECOND. The paragraph directly above
      # says the write that must not be missing goes first, and then the code settled last
      # week ahead of it. That is the whole of how 2026 week 3 came to be missing from the
      # server: the results publish raised, `set -e` took the step down, and the board it
      # exists to write was never sent at all. The comment was right and the order under it
      # was not, which is the dangerous direction.
      #
      # NOTHING IS GIVEN UP BY THE FLIP. "Results before prices" is the two BUILD steps'
      # rule and it is about the files and the pointer beside them: a week whose board rolls
      # forward on disk before its result is written is a week somebody played and can never
      # see. On the server these are two tables about two different weeks, neither reads the
      # other, and `fantasy_now.json` is not written here at all, so that argument does not
      # reach this step.
      - name: Install the postgres client
        if: steps.ready.outputs.build == 'yes'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Publish the week to the leaderboard
        if: steps.ready.outputs.build == 'yes'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL is not set, so entries for this week would all"
            echo "::error::be refused. Add it under Settings -> Secrets -> Actions."
            exit 1
          fi
          SEASON='${{ steps.week.outputs.season }}'
          WEEK='${{ steps.week.outputs.week }}'
          PREV=$(( WEEK - 1 ))

          node football/build/publish-week.mjs --season "$SEASON" --week "$WEEK" \
            | psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q
          echo "published week $WEEK's board"

          # READ IT BACK, because a publish that wrote nothing exits 0. An upsert of zero
          # rows is a successful statement, and the symptom of one is a week that refuses
          # every lineup as somebody who is not on the board.
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAc \
            "select case when count(*) > 100 then 'ok ' || count(*) || ' priced'
                    else 'FEW' end from public.fantasy_prices
              where season = $SEASON and week = $WEEK" | tee /tmp/priced
          grep -q '^ok ' /tmp/priced

          # ─── and then settle the week that just finished ──────────────────────────────
          #
          # ONLY IF THAT WEEK WAS EVER OPENED, AND THE FILE ON DISK CANNOT ANSWER THAT.
          # `fantasy_results` carries a foreign key onto `fantasy_weeks`, so results for a
          # week with no row are REFUSED rather than ignored. "Score the week that just
          # ended" writes that file on every single run, including for weeks played before
          # any of this was deployed, so its presence says the week was PLAYED and says
          # nothing about whether anybody could enter it.
          #
          # IT HAPPENED, AND IT COST THE BOARD. Week 2 was scored into a file on the runner,
          # its results were sent, the key refused them with "Key (season, week)=(2026, 2)
          # is not present in table fantasy_weeks", and the step died. A week nobody opened
          # has no entries, so there is nothing for its results to score and skipping them
          # costs exactly nothing.
          #
          # ASKED ON ITS OWN LINE rather than inside the `if`, because `set -e` does not
          # fire on a command in a CONDITION. Written there, an unreachable database hands
          # the test an empty string and the step carries on past a question it never got
          # an answer to, so what decides the branch is which way `[ "" = "0" ]` happens to
          # fall. On its own line the read is a plain command, so a database that cannot be
          # reached stops the step here, with psql's own error, which is the one report
          # that says what is actually wrong.
          OPENED=0
          if [ "$PREV" -ge 1 ] && [ -f "football/data/results_${SEASON}_w${PREV}.json" ]; then
            OPENED=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAc \
              "select count(*) from public.fantasy_weeks
                where season = $SEASON and week = $PREV")
          fi

          if [ "$PREV" -lt 1 ]; then
            echo "week $WEEK has no week before it, so there is nothing to settle"
          elif [ ! -f "football/data/results_${SEASON}_w${PREV}.json" ]; then
            echo "week $PREV was not scored, so there is nothing to publish"
          elif [ "$OPENED" = "0" ]; then
            echo "week $PREV is not on the server, so it took no entries and has nothing"
            echo "to score. Skipping its results."
          else
            node football/build/publish-week.mjs --season "$SEASON" --week "$PREV" --results \
              | psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q
            echo "published week $PREV's results"
          fi

      - name: Commit the week
        if: steps.ready.outputs.build == 'yes'
        run: |
          git config user.name "fantasy-bot"
          git config user.email "noreply@anthropic.com"
          # The injury report is in here because this job REFRESHED it above and priced
          # the board off it. Two reasons, and the second is the one that bites:
          #
          #   the page fetches injuries_<season>_w<week>.json for whatever week
          #   fantasy_now.json points at, so a commit that advanced the pointer and left
          #   the report behind would serve a board with no injury chips on it until the
          #   injuries job next ran, twenty minutes later;
          #
          #   and an uncommitted refresh is an UNSTAGED CHANGE, which `git pull --rebase`
          #   below refuses outright ("cannot pull with rebase: You have unstaged
          #   changes", exit 128). That hits `|| exit 1` and takes this job RED on any
          #   push collision, which is the one branch the loop exists for.
          #
          # It costs no extra deploy: this job commits once a week either way. The
          # injuries job still owns the CADENCE, and writes a different week's file.
          git add football/data/weekly_*.json football/data/results_*.json \
                  football/data/fantasy_now.json football/data/injuries_*.json
          if git diff --cached --quiet; then
            echo "the board has not moved"
            exit 0
          fi
          git commit -m "Fantasy Challenge: ${{ steps.week.outputs.season }} week ${{ steps.week.outputs.week }}"
          # Other scheduled jobs push to main too, so a concurrent run can advance the ref
          # mid-job. Rebase and retry rather than fail on a non-fast-forward.
          for i in 1 2 3 4 5; do
            git push && break
            echo "push rejected, rebasing onto latest main (attempt $i)"
            git pull --rebase origin main || exit 1
          done

      # SAID OUT LOUD WHEN IT FAILS. Tuesday's week 7 build stopped on one check and nobody
      # heard until the owner saw last week's board on game day. A failed run now opens an
      # issue (which emails the owner), a later green run closes it. live-check.yml does the
      # same for the pages.
      - name: Open or close the alert
        if: always() && steps.when.outputs.go == 'yes' && steps.open.outputs.done != 'yes' && steps.ready.outputs.build != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEEK: ${{ steps.week.outputs.season }} week ${{ steps.week.outputs.week }}
        run: |
          TITLE="Fantasy Challenge: the week did not open"
          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$NUM" ]; then gh issue comment "$NUM" --body "$WEEK is open: $RUN_URL" && gh issue close "$NUM"; fi
          else
            BODY="The build for $WEEK failed, so the page still shows last week. Run: $RUN_URL. Fix it and run Build the Fantasy Challenge week by hand before the first kickoff."
            if [ -n "$NUM" ]; then gh issue comment "$NUM" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi
          fi
