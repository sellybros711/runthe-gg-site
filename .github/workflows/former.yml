name: Refresh former players
on:
  schedule:
    - cron: '0 11 1 * *'   # 1st of each month, 11:00 UTC (new seasons/draft classes roll in)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-former.mjs
      # GATE THE REFRESH ON THE ANSWER CHECK. This job rewrites the college
      # every Alma Mater round is scored against, so a feed that starts writing
      # a school a new way ships straight to players. Checking after the commit
      # is checking too late: fail here and the old, working data stays.
      - name: The refreshed data must still answer correctly
        run: node scripts/check-colleges.mjs
      - name: Commit if changed
        run: |
          git config user.name "roster-bot"
          git config user.email "noreply@anthropic.com"
          git add arcade/former.js
          git diff --cached --quiet && echo "no changes" || {
            git commit -m "Refresh former-player dataset"
            # Rebase-and-retry: the rosters/leaderboard Actions push to main too,
            # and a concurrent run can advance the ref while this job is fetching
            # data (a long job). Rebase onto the latest main and retry so the push
            # never fails on a non-fast-forward (former.js and rosters.js differ,
            # so the rebase is always clean).
            for i in 1 2 3 4 5; do
              git push && break
              echo "push rejected, rebasing onto latest main (attempt $i)"
              git pull --rebase origin main || exit 1
            done
          }
