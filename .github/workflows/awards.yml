name: Refresh elite awards
on:
  schedule:
    - cron: '30 11 5 * *'   # 5th of each month, 11:30 UTC (offset from former.yml)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-awards.mjs
      # A data file that changed and kept its ?v= hands a returning visitor the
      # old data against the new page. Only when it actually moved: a bump with
      # no change is a re-download for everybody who already has the file.
      - name: Bump the cache version if the data moved
        run: git diff --quiet -- arcade/awards.js || node scripts/bump-cachebust.mjs arcade/awards.js
      - name: Commit if changed
        run: |
          git config user.name "awards-bot"
          git config user.email "noreply@anthropic.com"
          # -u picks up the pages the bump rewrote and scripts/cachebust.json.
          git add arcade/awards.js && git add -u
          git diff --cached --quiet && echo "no changes" || {
            git commit -m "Refresh elite-awards dataset"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push rejected, rebasing onto latest main (attempt $i)"
              git pull --rebase origin main || exit 1
            done
          }
