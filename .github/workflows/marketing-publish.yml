name: Marketing publish
# Publishes the approved posts in marketing/queue/ when they fall due: X, the Facebook Page and
# Instagram. Merging a post into main is the approval; this only ever posts what is on main.
# Dormant until the account secrets exist AND the repo variable MARKETING_LIVE is "true"; until then
# it reports what it would publish. A failed post stays queued and fails the run, so GitHub emails
# the owner. See scripts/marketing/publish.mjs.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketing-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish what is due
        env:
          MARKETING_LIVE: ${{ vars.MARKETING_LIVE }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/marketing/publish.mjs
      - name: Record what was published
        if: always()
        run: |
          if [ -n "$(git status --porcelain marketing)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A marketing
            git commit -m "Published queued posts [skip ci]"
            git push
          fi
