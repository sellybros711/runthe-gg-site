name: "Stumpire: import search_avg"

# Pulls average monthly Wikipedia pageviews (five years) for every Stumpire
# entity and uploads functions/_stumpire/data/search_avg.json as an artifact.
# Wikimedia is refused by the dev sandbox's proxy, which is why this runs
# here. It does NOT commit: an editor reviews the file (and spot checks the
# top names against Google volumes with --spot) before it replaces the
# synthetic fixture. A published slate is never regraded either way.

on:
  workflow_dispatch:
    inputs:
      league:
        description: 'NFL, NBA, MLB, or blank for all'
        required: false
        default: ''

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import
        run: |
          ARGS="--source wikipedia --delay 50"
          if [ -n "${{ inputs.league }}" ]; then ARGS="$ARGS --league ${{ inputs.league }}"; fi
          node functions/_stumpire/build/import-search.mjs $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: stumpire-search-avg
          path: functions/_stumpire/data/search_avg.json
