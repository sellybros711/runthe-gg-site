name: Course golfer check

# The 3D course golfer (golf/golfer3d.js): every look, aim, shot and store item is
# drawn, the gate and its kill switch are asserted, and the tracer is asked which
# golfer it draws. Runs locally, unchanged:
#
#   (nohup python3 -m http.server 8099 &) ; node golf/check-golfer3d.mjs
#
# No secrets, no deploy.

on:
  pull_request:
    paths:
      - 'golf/golfer3d.js'
      - 'golf/check-golfer3d.mjs'
      - 'golf/index.html'
      - '.github/workflows/golfer3d-check.yml'
  push:
    branches: [main]
    paths:
      - 'golf/golfer3d.js'
      - 'golf/check-golfer3d.mjs'
      - 'golf/index.html'
      - '.github/workflows/golfer3d-check.yml'
  workflow_dispatch: {}

concurrency:
  group: golfer3d-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: The 3D course golfer, every look and every aim
        run: |
          (python3 -m http.server 8099 >/dev/null 2>&1 &)
          sleep 2
          node golf/check-golfer3d.mjs
