name: Run The Pitch checks

# What a finished game reads from the database, and that no poll runs while the
# tab is hidden (the page half of the site's save rule, platform-database-saves
# in the knowledge base). Runs only when the game or its engine changes.
#
# And a guest's Daily Challenge: the Function with Supabase faked, the page in a
# browser, and supabase/188 against a real Postgres.
#
# Locally: node soccer/check-db-reads.mjs
#          node soccer/check-guest-daily.mjs
#          createdb sdg && psql -d sdg -f supabase/test/soccer_daily_guest_test.sql

on:
  pull_request:
    paths:
      - 'soccer/**'
      - 'gameLogic.js'
      - 'data/players_all.json'
      - 'functions/_pitchguest/**'
      - 'functions/api/pitch-guest.js'
      - 'functions/_arcadeguest/core.js'
      - 'supabase/12_daily_challenge.sql'
      - 'supabase/188_soccer_daily_guest.sql'
      - 'supabase/test/soccer_daily_guest_test.sql'
      - '.github/workflows/soccer-checks.yml'
  push:
    branches: [main]
    paths:
      - 'soccer/**'
      - 'gameLogic.js'
      - 'data/players_all.json'
      - 'functions/_pitchguest/**'
      - 'functions/api/pitch-guest.js'
      - 'functions/_arcadeguest/core.js'
      - 'supabase/12_daily_challenge.sql'
      - 'supabase/188_soccer_daily_guest.sql'
      - 'supabase/test/soccer_daily_guest_test.sql'
      - '.github/workflows/soccer-checks.yml'
  workflow_dispatch: {}

concurrency:
  group: soccer-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Database reads and hidden tab polls
        run: node soccer/check-db-reads.mjs
      - name: A guest plays the Daily (the Function, then the page)
        run: node soccer/check-guest-daily.mjs
      - name: Start Postgres
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser -s "$USER"
      - name: supabase/188 against a real Postgres (applied twice)
        run: |
          createdb sdg
          psql -X -q -v ON_ERROR_STOP=1 -d sdg -f supabase/test/soccer_daily_guest_test.sql
