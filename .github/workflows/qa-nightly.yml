name: QA nightly
# Every game's smoke checks, every night, including football, cfb and wrestling, which no other
# workflow runs. A failure opens one issue (GitHub emails the owner); while it stays red the issue
# body is updated quietly; when everything passes again the issue is closed. The QA agent reads that
# issue on its scheduled run. See scripts/qa/run.mjs and agents/qa/qa-spec.md in the knowledge base.
on:
  schedule:
    - cron: '17 10 * * *'   # 10:17 UTC, about 3am Pacific
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: qa-nightly
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright and a browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Run every game's smoke checks
        id: qa
        continue-on-error: true
        run: node scripts/qa/run.mjs --jobs 3 --out qa-report.md
      - name: Report
        if: always()
        run: cat qa-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report
          path: qa-report.md
      - name: Open, update or close the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.qa.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="QA nightly: checks failing"
          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          { echo "Latest run: $RUN_URL"; echo; head -c 60000 qa-report.md; } > body.md
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$NUM" ]; then gh issue comment "$NUM" --body "All smoke checks pass again: $RUN_URL" && gh issue close "$NUM"; fi
          elif [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
