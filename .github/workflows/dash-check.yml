name: Dash check

# Em dashes and en dashes are banned in the directories on the GUARDED list at
# the top of scripts/check-dashes.mjs. See CLAUDE.md for what to write instead.
#
# THE PATHS BELOW HAVE TO MATCH THAT LIST. They are two copies of one answer and
# they had already drifted: globe was guarded and triggered nothing, so a dash
# added there failed only for whoever next ran the checker by hand. Add a
# directory in both places or the guard is a guard on paper.
# Runnable locally with the exact same command:
#   node scripts/check-dashes.mjs
#
# No secrets, no network, no deploy.

on:
  pull_request:
    paths:
      - 'wrestling/**'
      - 'hoops/**'
      - 'globe/**'
      - 'mythiball/**'
      - 'golf/**'
      - 'cfb/**'
      - 'football/**'
      - 'assets/**'
      - 'scripts/check-dashes.mjs'
      - '.github/workflows/dash-check.yml'
  push:
    branches: [main]
    paths:
      - 'wrestling/**'
      - 'hoops/**'
      - 'globe/**'
      - 'mythiball/**'
      - 'golf/**'
      - 'cfb/**'
      - 'football/**'
      - 'assets/**'
      - 'scripts/check-dashes.mjs'
      - '.github/workflows/dash-check.yml'
  workflow_dispatch: {}

concurrency:
  group: dash-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-dashes.mjs
