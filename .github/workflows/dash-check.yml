name: Dash check

# Em dashes and en dashes are banned in every directory on the GUARDED list at
# the top of scripts/check-dashes.mjs. See CLAUDE.md.
#
# THE PATHS BELOW HAVE TO MATCH THAT LIST. They are two separate places saying
# the same thing, and when they drift the check does not fail, it simply stops
# running: globe had been guarded for a while with nothing here to trigger it,
# so a dash added to globe would have sailed through. Add a directory to both or
# to neither.
# Runnable locally with the exact same command:
#   node scripts/check-dashes.mjs
#
# No secrets, no network, no deploy.

on:
  pull_request:
    paths:
      - 'wrestling/**'
      - 'hoops/**'
      - 'globe/**'
      - 'mythiball/**'
      - 'golf/**'
      - 'scripts/check-dashes.mjs'
      - '.github/workflows/dash-check.yml'
  push:
    branches: [main]
    paths:
      - 'wrestling/**'
      - 'hoops/**'
      - 'globe/**'
      - 'mythiball/**'
      - 'golf/**'
      - 'scripts/check-dashes.mjs'
      - '.github/workflows/dash-check.yml'
  workflow_dispatch: {}

concurrency:
  group: dash-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-dashes.mjs
