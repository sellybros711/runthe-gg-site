# Build the COLLEGE Fantasy Challenge week: the twenty games, the board, the prices and the
# cap, then publish it to the leaderboard and commit the files the page reads.
#
# Monday 11am Eastern. Saturday's box scores are settled by then, and the week's betting
# lines, which the projection reads, are up. The two cron entries are the NFL job's answer to
# daylight saving: the job asks which schedule fired rather than what time it is now.
#
# A DRY RUN IS THE DEFAULT BY HAND. Dispatched with `write` off, it builds and prints the
# slate, the cap sweep and the top of the board, and commits and publishes nothing.
name: College fantasy, build the week
on:
  schedule:
    - cron: '0 15 * * 1'    # 11am Eastern while daylight saving is in effect
    - cron: '0 16 * * 1'    # 11am Eastern the rest of the year
  workflow_dispatch:
    inputs:
      week:
        description: 'Week to build. Blank is the week about to be played.'
        required: false
        default: ''
      write:
        description: 'Write the files, publish to the leaderboard and commit'
        type: boolean
        required: false
        default: false
      catchup:
        description: 'Only build if the week is not live yet (what the watchdog sends).'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: cfb-fantasy-pool
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Is this the 11am Eastern entry
        id: when
        run: |
          OFFSET=$(TZ=America/New_York date +%z)
          FIRED='${{ github.event.schedule }}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "write=${{ inputs.write }}" >> "$GITHUB_OUTPUT"
          elif [ "$OFFSET" = "-0400" ] && [ "$FIRED" = "0 15 * * 1" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"; echo "write=true" >> "$GITHUB_OUTPUT"
          elif [ "$OFFSET" = "-0500" ] && [ "$FIRED" = "0 16 * * 1" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"; echo "write=true" >> "$GITHUB_OUTPUT"
          else
            echo "the other cron entry for the current offset. Stopping."
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.when.outputs.go == 'yes'
      - uses: actions/setup-node@v4
        if: steps.when.outputs.go == 'yes'
        with:
          node-version: '22'

      # THE WEEK IS WORKED OUT ONCE, HERE, and handed to the guard and the build, so the two can
      # never be asking about different weeks. A week typed in by hand is taken as given.
      - name: Which week
        id: week
        if: steps.when.outputs.go == 'yes'
        run: |
          WEEK='${{ inputs.week }}'
          if [ -n "$WEEK" ]; then
            echo "season=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
            echo "week=$WEEK" >> "$GITHUB_OUTPUT"
            echo "asked for week $WEEK"
          else
            # 2 is the season over: nothing to build, and not a failure. Anything else fails.
            set +e
            node cfb/build/fantasy/next-week.mjs
            RC=$?
            set -e
            if [ "$RC" = "2" ]; then echo "none=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
            exit $RC
          fi

      # A PRICE NEVER MOVES ONCE ANYBODY HAS DRAFTED AGAINST IT. The scheduled run and the
      # watchdog's catch up both stop if the week is already live, because either can land just
      # after another build opened it. A plain manual run still builds, because a person asked.
      # THE POINTER IS READ FROM origin/main, NOT FROM THIS CHECKOUT. A dispatched run checks out
      # the commit main was on when it was dispatched, so a catch up queued behind the Monday
      # build would read the pointer from before that build committed, and rebuild a live week.
      - name: Is it already open
        id: open
        if: steps.when.outputs.go == 'yes'
        run: |
          if [ "${{ steps.week.outputs.none }}" = "yes" ]; then
            echo "the season is over. Nothing to build."
            echo "go=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch -q --depth 1 origin main
          LIVE=$(git show origin/main:cfb/data/fantasy/now.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const n=JSON.parse(s);console.log(n.season+" "+n.week)})')
          WANT='${{ steps.week.outputs.season }} ${{ steps.week.outputs.week }}'
          echo "live: $LIVE, this week: $WANT"
          GUARDED=no
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.catchup }}" = "true" ]; then GUARDED=yes; fi
          if [ "$GUARDED" = "yes" ] && [ "$LIVE" = "$WANT" ]; then
            echo "week $WANT is already open. Nothing to do."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the board
        if: steps.open.outputs.go == 'yes'
        run: |
          set -o pipefail
          WRITE=''
          if [ "${{ steps.when.outputs.write }}" = "true" ]; then WRITE='--write'; fi
          node cfb/build/fantasy/pool.mjs --season '${{ steps.week.outputs.season }}' \
            --week '${{ steps.week.outputs.week }}' $WRITE

      - name: Who is out
        if: steps.open.outputs.go == 'yes' && steps.when.outputs.write == 'true'
        run: node cfb/build/fantasy/injuries.mjs --write

      - name: Can it be drafted
        if: steps.open.outputs.go == 'yes'
        run: node cfb/build/test/test_fantasy.mjs --quick

      - name: Install the postgres client
        if: steps.open.outputs.go == 'yes' && steps.when.outputs.write == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # THE BOARD IS PUBLISHED BEFORE ANYTHING IS COMMITTED. A committed board with no row on
      # the server is a page that drafts perfectly and refuses every submit.
      - name: Publish the week to the leaderboard
        if: steps.open.outputs.go == 'yes' && steps.when.outputs.write == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL is not set."
            exit 1
          fi
          node cfb/build/fantasy/publish.mjs | psql -q -v ON_ERROR_STOP=1 "$SUPABASE_DB_URL"
          echo "published."

      - name: Commit the week
        if: steps.open.outputs.go == 'yes' && steps.when.outputs.write == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cfb/data/fantasy/
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -q -m "College fantasy: build the week"
          for i in 1 2 3 4; do
            if git push -q; then exit 0; fi
            git pull -q --rebase || exit 1
            sleep $((i * 5))
          done
          exit 1
