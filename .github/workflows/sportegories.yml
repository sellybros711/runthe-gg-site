name: Rebuild Sportegories corpus
on:
  schedule:
    - cron: '30 12 * * *'   # daily, after the roster/former refreshes have landed
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write

# arcade/sportegories-data.js is DERIVED from rosters.js, former.js, awards.js
# and the stats files. Those each refresh on their own schedule, and until this
# job existed nothing rebuilt the corpus afterwards, so a rookie could sign on
# Monday, land in rosters.js, and still be unknown to the game months later.
#
# This is deliberately a job of its own rather than a step bolted onto each
# refresh. Those workflows push to main and recover from races by rebasing,
# which only stays clean because no two of them write the same file. One writer
# for the generated file keeps that property true. A push-triggered run would
# be tidier still, but a push made with GITHUB_TOKEN doesn't trigger workflows,
# so a daily cron is what actually runs.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-sportegories.mjs
      # GATE THE REBUILD ON THE ANSWER CHECK, the way former.yml is gated.
      # Every category in this game is scored against the file this job writes,
      # and the way it goes wrong is silent: a retired player in an "Active"
      # category renders, scores and reads perfectly plausibly, so the only
      # thing that catches it is a player who knows the sport writing in. That
      # happened. Checking after the commit is checking too late: fail here and
      # yesterday's working corpus stays on the site.
      - name: The rebuilt corpus must still answer correctly
        shell: bash
        run: node scripts/check-sportegories.mjs | tee /tmp/check.txt
      - name: Every category still checks every league it names
        shell: bash
        run: node scripts/check-sportegories-leagues.mjs | tee -a /tmp/check.txt
      # A data file that changed and kept its ?v= hands a returning visitor the
      # old data against the new page. Only when it actually moved: a bump with
      # no change is a re-download for everybody who already has the file.
      - name: Bump the cache version if the data moved
        run: git diff --quiet -- arcade/sportegories-data.js || node scripts/bump-cachebust.mjs arcade/sportegories-data.js
      - name: Commit if changed
        run: |
          git config user.name "roster-bot"
          git config user.email "noreply@anthropic.com"
          # -u picks up the pages the bump rewrote and scripts/cachebust.json.
          git add arcade/sportegories-data.js && git add -u
          git diff --cached --quiet && echo "no changes" || {
            git commit -m "Rebuild Sportegories corpus from refreshed rosters"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push rejected, rebasing onto latest main (attempt $i)"
              git pull --rebase origin main || exit 1
            done
          }
      # FAIL LOUDLY. A gate that holds yesterday's corpus is right, but on its own it
      # is silent: from 2026-10-12 and again from 2026-11-02 this job failed every day
      # for two weeks on one undecided name pair, while stale actives piled up on the
      # live game, and nobody heard. Now a failed run opens (or updates) one issue,
      # with the failing lines and the fix, and GitHub notifies the owner. The next
      # green run closes it.
      - name: Alert on failure, all clear on success
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Sportegories rebuild failing"
          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$NUM" ]; then gh issue comment "$NUM" --body "The rebuild passes again: $RUN_URL" && gh issue close "$NUM"; fi
            exit 0
          fi
          {
            echo "The daily Sportegories rebuild failed, so the live game keeps the last good corpus and its active flags go stale every day this stays open."
            echo
            echo "Latest run: $RUN_URL"
            echo
            echo '```'
            if [ -s /tmp/check.txt ]; then grep -E 'FAIL|problem' /tmp/check.txt | head -40; else echo "(no check output: the job failed before the checks ran)"; fi
            echo '```'
            echo
            echo "An undecided related-name pair (\"related names nobody has decided\") is fixed by adding it to \`same\` (one person) or \`apart\` (two people) in \`scripts/sportegories-people.json\`, judged from the roster and former records (college, position, clubs, ids). Ask the Rosters Agent."
          } > /tmp/body.md
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file /tmp/body.md
            gh issue comment "$NUM" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body-file /tmp/body.md
          fi
