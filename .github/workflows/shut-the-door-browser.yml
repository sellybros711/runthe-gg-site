name: Shut The Door browser check

# The whole game in Chromium, at 390x844 and 1440x900 (shut-the-door/test/check-browser.mjs):
# home, the sheets, the 3D mound, every pitch result's motion, a whole outing on the real
# engine, the result screen with the you-vs-him card, the coach, and the four endings forced
# through the mock (door_shut, tie_held, doors_open, walk_off).
#
# Its own workflow, with a path filter, unlike shut-the-door-checks.yml: that one has no filter
# on purpose (the posture check must see every PR) and its jobs take seconds. This one takes
# minutes, so it runs when the game, its 3D, or this file changes.
#
# The runner has no GPU: Chromium draws WebGL with SwiftShader, on the CPU. The check draws
# only where it reads pixels (its header says why and how), which is what lets it finish here.
#
# The browser check runs as four shards side by side (--shard 0/4 to 3/4, each job about 10 of the
# whole run's 40 minutes): the run is a list of units (a screen size's steps 1 to 14, the clips at one
# size, one forced ending, and so on; check-browser.mjs UNITS), each opening its own page, and each unit
# is in exactly one shard. The job named browser then reads what each shard finished (--combine) and
# fails unless every unit finished once, on this commit, with nothing failed: the guard that the four
# add up to the one run. `--plan 4` prints the split.
#
# A second job, contact, runs beside it: every swing the engine says met the ball, posed in the
# game page, the ball on the bat (shut-the-door/lab/pipeline/check-contact.mjs). It runs as six
# shards side by side (--shard 0/6 to 5/6): the packs split between them by size, every case in
# exactly one, so the six together are the whole run, and each limit is per case, so a shard is held
# as the whole run is. Each pack is measured on a freshly loaded page, so a shard measures its packs
# exactly as the whole run does.
#
# Runs locally, unchanged:
#   node shut-the-door/test/check-browser.mjs                       (or --shard 1/4, --plan 4)
#   node shut-the-door/lab/pipeline/check-contact.mjs              (or --shard 2/6, --sample N, --resume)
#
# No secrets, no deploy.

on:
  pull_request:
    paths:
      - 'shut-the-door/**'
      - '.github/workflows/shut-the-door-browser.yml'
      - 'scripts/install-playwright.sh'
      - '.github/actions/playwright/**'
  push:
    branches: [main]
    paths:
      - 'shut-the-door/**'
      - '.github/workflows/shut-the-door-browser.yml'
      - 'scripts/install-playwright.sh'
      - '.github/actions/playwright/**'
  workflow_dispatch: {}

concurrency:
  group: shut-the-door-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-shard:
    name: browser (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    # A shard is about 10 minutes of the run's 40 (#863: a slow runner takes a quarter longer). 25 leaves
    # room for that and for the sections still coming.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        timeout-minutes: 14
        uses: ./.github/actions/playwright
      # Each FAIL line and the tally also go up as annotations, so a red run says what broke on
      # the PR itself (and through the checks API) without opening the log.
      - name: The game in Chromium, a quarter of it
        run: |
          set -o pipefail
          node shut-the-door/test/check-browser.mjs --shard ${{ matrix.shard }}/4 --done-out browser-done.json 2>&1 | tee check-browser.txt
      - name: Failures as annotations
        if: always()
        run: |
          [ -f check-browser.txt ] || exit 0
          grep -E 'FAIL' check-browser.txt | head -30 | sed 's/%/%25/g; s/^ */::error title=check-browser::/' || true
          tail -n 1 check-browser.txt | sed 's/^/::notice title=check-browser::/'
          # the whole output as one more notice (its last 3900 bytes, as an annotation keeps 4 KB; newlines escaped), for a reader with no access to the log
          printf '::notice title=check-browser output::%s\n' "$(tail -c 3900 check-browser.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: What the shard finished, for the combined verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.shard }}
          path: browser-done.json
          if-no-files-found: ignore
          retention-days: 3

  # the four shards as one run: every unit finished in exactly one, on this commit, nothing failed
  browser:
    needs: browser-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-*
          path: browser
      - name: The whole game in Chromium, combined
        run: |
          set -o pipefail
          mkdir -p shards
          for f in browser/*/browser-done.json; do [ -f "$f" ] && cp "$f" "shards/$(basename "$(dirname "$f")").json"; done
          node shut-the-door/test/check-browser.mjs --combine shards 2>&1 | tee check-browser.txt
      - name: Failures as annotations
        if: always()
        run: |
          [ -f check-browser.txt ] || exit 0
          grep -E 'FAIL' check-browser.txt | head -30 | sed 's/%/%25/g; s/^ */::error title=check-browser::/' || true
          tail -n 1 check-browser.txt | sed 's/^/::notice title=check-browser::/'

  contact:
    name: contact (shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        timeout-minutes: 14
        uses: ./.github/actions/playwright
      - name: Every contact meets the bat, every whiff misses it
        run: |
          set -o pipefail
          node shut-the-door/lab/pipeline/check-contact.mjs --shard ${{ matrix.shard }}/6 2>&1 | tr '\r' '\n' | grep -v ' cases *$' | tee check-contact.txt
      - name: Failures as annotations
        if: always()
        run: |
          [ -f check-contact.txt ] || exit 0
          grep -E 'FAIL' check-contact.txt | head -30 | sed 's/%/%25/g; s/^ */::error title=check-contact::/' || true
          tail -n 1 check-contact.txt | sed 's/^/::notice title=check-contact::/'
