name: Cache-bust check

# The game pages load their engine and run loop as separate files with a hand-written
# cache-busting query. index.html revalidates and those files do not, so a change to one
# without a bump serves a RETURNING visitor the new page against the script they already
# have. It fails on their phone and on nobody's development machine.
#
# It also checks the OTHER pair of hand-written numbers: a page that pins the API_VERSION it
# expects from a module has to move that number when the module moves. That one is silent,
# because the page falls through to an offline stub rather than throwing, and it has already
# taken the leaderboard and the profile out for every visitor.
#
# AND A DATA FILE, which is why `**/data/*.json` is on the paths below. Six games
# fetch a player pool with a hand-written ?v= on it and the checker reads them now,
# so a refresh that rewrites a pool without moving the number has to be caught on
# the push that does it. Without this it would sit unchecked until somebody next
# touched an .html file, which for an annual data refresh could be months.
#
# Runnable locally with the exact same command:
#   node scripts/check-cachebust.mjs
# And after a deliberate bump:
#   node scripts/check-cachebust.mjs --update
#
# No secrets, no network, no deploy.

on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/data/*.json'
      - 'scripts/cachebust.json'
      - 'scripts/check-cachebust.mjs'
      - '.github/workflows/cachebust-check.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/data/*.json'
      - 'scripts/cachebust.json'
      - 'scripts/check-cachebust.mjs'
      - '.github/workflows/cachebust-check.yml'
  workflow_dispatch: {}

concurrency:
  group: cachebust-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-cachebust.mjs
