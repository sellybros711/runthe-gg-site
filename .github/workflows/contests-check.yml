name: Contests SQL
# The weekly contests' rules, proved against a real Postgres: the College Fantasy Challenge
# (cfb_fantasy_test), the NFL swap (fantasy_swap_test), and the owner's rule of 2026-11-23 that
# a guest cannot enter (186, contests_need_account_test). The order of files is the one each
# test's header gives. 186 is applied twice, because a migration here must be safe to rerun.
# No secrets, no network, no real database.
on:
  pull_request:
    paths:
      - 'supabase/**'
permissions:
  contents: read
jobs:
  contests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser -s "$USER"
      - name: The contests' migrations, then their tests
        run: |
          createdb cfbf
          P="psql -X -q -v ON_ERROR_STOP=1 -d cfbf"
          $P -f supabase/test/fantasy_base.sql
          sed -n '20,$p' supabase/test/dynboard_base.sql | $P
          $P -f supabase/98_football_gauntlet_board.sql
          $P -c 'create table public.subscriptions(user_id uuid, status text, current_period_end timestamptz);'
          for f in 101_premium_bundles 107_board_pro_and_live 109_fantasy_challenge 110_fantasy_live \
                   111_nfl_scores 112_fantasy_entrants 113_fantasy_submit_username 114_fantasy_prizes \
                   115_fantasy_result_when_ready 119_fantasy_swap 120_fantasy_pro_pass 124_premium_yearly \
                   126_fantasy_results_line 128_cfb_fantasy 186_contests_need_account 186_contests_need_account; do
            $P -f supabase/$f.sql
          done
          $P -f supabase/test/cfb_fantasy_test.sql
          $P -f supabase/test/fantasy_swap_test.sql
          $P -f supabase/test/contests_need_account_test.sql
