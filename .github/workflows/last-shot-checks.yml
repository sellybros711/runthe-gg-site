name: Last Shot checks

# Last Shot is live (served to anybody as static files in last-shot/, indexable,
# in the sitemap; only /last-shot/e and /last-shot/report are Functions). These
# checks hold its posture (the declarations at the top of check-posture.mjs:
# the page, the sitemap, the home page and newsletter list, the ad tag; the
# report stays admins only, and a refusal gets exactly Stumpire's 404,
# measured against Stumpire's own Function), the static folder in step with
# its sources, the sim's
# determinism and the three test plays, and the no dash rule on the game's
# own code.
#
# NO PATH FILTER, ON PURPOSE. The posture check is about the whole site: a
# home page link or a sitemap line removed anywhere moves the game's state,
# and a filter on functions/_lastshot/** would never see it. It takes a second.
#
# Locally, the same commands:
#   node --test functions/_lastshot/test/*.test.mjs
#   node functions/_lastshot/check-posture.mjs
#   node functions/_lastshot/test/check-browser.mjs   (Chromium, not run here)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: last-shot-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Posture (live, the report admins only)
        run: node functions/_lastshot/check-posture.mjs
      - name: Unit tests (the static folder in step, the routes, events, sim, the three plays)
        run: node --test functions/_lastshot/test/*.test.mjs
      - name: No em or en dashes in the game's code
        run: node scripts/check-dashes.mjs functions/_lastshot functions/last-shot last-shot
      # Cloudflare's build image bundles with an older esbuild than current
      # wrangler (see stumpire-checks.yml). Building with wrangler 3 catches it.
      - name: Pages Functions build like Cloudflare's
        run: npx --yes wrangler@3.20.0 pages functions build --outdir "$RUNNER_TEMP/fn"

  # The tester round's events and report (supabase/170), applied twice (it
  # must be idempotent), then checked against players whose numbers are known;
  # then 171, 173 and 175 (guests) on top, and both checks again.
  round-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: The migration twice, then the report's checks
        run: |
          createdb ev
          psql -q -d ev -c 'create role authenticated' -c 'create role anon' -c 'create role service_role'
          psql -q -d ev -f supabase/test/game_events_base.sql
          psql -q -d ev -v ON_ERROR_STOP=1 -f supabase/170_game_events.sql
          psql -q -d ev -v ON_ERROR_STOP=1 -f supabase/170_game_events.sql
          psql -q -d ev -f supabase/test/game_events_test.sql 2>&1 | tee out.txt
          test "$(grep -c '^ ok ' out.txt)" -ge 11
          ! grep -v '^ ok ' out.txt | grep -q .
          # then the chain production runs: 171 and 173 (4th and What's), and
          # 175 twice (guests, the cap, the trim, the report on account or device)
          psql -q -d ev -v ON_ERROR_STOP=1 -f supabase/171_fourth_and_what_events.sql
          psql -q -d ev -v ON_ERROR_STOP=1 -f supabase/173_fourth_and_what_events_purge.sql
          psql -q -d ev -v ON_ERROR_STOP=1 -f supabase/175_last_shot_guest_events.sql
          psql -q -d ev -v ON_ERROR_STOP=1 -f supabase/175_last_shot_guest_events.sql
          psql -q -d ev -f supabase/test/game_events_test.sql 2>&1 | tee out2.txt
          test "$(grep -c '^ ok ' out2.txt)" -ge 11
          ! grep -v '^ ok ' out2.txt | grep -q .
          psql -q -d ev -f supabase/test/last_shot_guest_events_test.sql 2>&1 | tee out3.txt
          test "$(grep -c '^ ok ' out3.txt)" -ge 11
          ! grep -v '^ ok ' out3.txt | grep -q .
