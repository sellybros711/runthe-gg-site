name: Sportegories answers check

# The rebuild job (sportegories.yml) is gated on this same script, which covers
# the DATA path: a refreshed roster that starts calling a retired player active.
# This covers the other path, a hand edit to the matcher or the builder, which
# the daily job would not see until the next morning.
#
# Runnable locally with the exact same command:
#   node scripts/check-sportegories.mjs
#
# No secrets, no network, no deploy.

on:
  pull_request:
    paths:
      - 'arcade/sportegories.js'
      - 'arcade/sportegories-data.js'
      - 'arcade/rosters.js'
      - 'arcade/jerseys.js'
      - 'scripts/build-sportegories.mjs'
      - 'scripts/check-sportegories.mjs'
      - 'scripts/sportegories-people.mjs'
      - 'scripts/sportegories-people.json'
      - 'hoops/data/players.json'
      - 'scripts/check-sportegories-leagues.mjs'
      - 'scripts/nba-awards.json'
      - 'arcade/franchise.js'
      - 'arcade/livecheck.js'
      - 'arcade/flags.js'
      - 'arcade/sportegories/index.html'
      - 'functions/api/sportegories-challenge.js'
      - 'functions/api/player-check.js'
      - 'functions/_sportegories/**'
      - 'scripts/check-sportegories-challenge.mjs'
      - '.github/workflows/sportegories-check.yml'
  push:
    branches: [main]
    paths:
      - 'arcade/sportegories.js'
      - 'arcade/sportegories-data.js'
      - 'arcade/rosters.js'
      - 'arcade/jerseys.js'
      - 'scripts/build-sportegories.mjs'
      - 'scripts/check-sportegories.mjs'
      - 'scripts/sportegories-people.mjs'
      - 'scripts/sportegories-people.json'
      - 'hoops/data/players.json'
      - 'scripts/check-sportegories-leagues.mjs'
      - 'scripts/nba-awards.json'
      - 'arcade/franchise.js'
      - 'arcade/livecheck.js'
      - 'arcade/flags.js'
      - 'arcade/sportegories/index.html'
      - 'functions/api/sportegories-challenge.js'
      - 'functions/api/player-check.js'
      - 'functions/_sportegories/**'
      - 'scripts/check-sportegories-challenge.mjs'
      - '.github/workflows/sportegories-check.yml'
  workflow_dispatch: {}

concurrency:
  group: sportegories-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-sportegories.mjs
      # every category type, per league it names (Hall of Famer, MVP, Rookie of the Year...)
      - run: node scripts/check-sportegories-leagues.mjs
      # a challenge rules live and is remembered (no network: Wikidata is canned)
      - run: node scripts/check-sportegories-challenge.mjs
