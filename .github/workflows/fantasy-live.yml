name: Score the Fantasy Challenge week, live

# THE BOARD MOVES WHILE THE GAMES ARE BEING PLAYED, and this is the only thing that moves
# it. `fantasy-pool.yml` builds a week on the Tuesday and scores the one before it; this
# stays awake through the games and writes what ESPN's box score and nflverse have so far.
#
# IT ALSO WRITES THE SCOREBOARD, on the same tick, from the same run. The live screen shows
# the real games and the standings side by side, and they are about one instant: written by
# two jobs they would be two, and a board that had already paid for a touchdown the
# scoreboard beside it had not shown reads as one of the two being broken.
#
# ─── AND IT IS THE FIRST PLACE THE LIVE FEED IS EVER EXERCISED ─────────────────────────
#
# `site.api.espn.com` is refused by the development sandbox's egress proxy, so the scoreboard
# half has never run against the real feed: everything about it is verified against a saved
# payload and against the schedule fallback. A RUN OF THIS WORKFLOW IS THE VERIFICATION.
# What to read in the log is the `scoreboard:` line, and specifically the number it says the
# feed answered. Sixteen games and a feed that answered none, while a game is on, is the
# feed's week numbering disagreeing with ours rather than a quiet afternoon, and the job
# says so in as many words rather than going green with an empty panel. Everything still
# works in that state: every game falls back to the schedule, which means kickoff times
# during the games and correct final scores a few hours after each one.
#
# IT COMMITS NOTHING AND DEPLOYS NOTHING. The live board is a Supabase read, so a score
# that moves costs one write. Committing `results_*.json` every ten minutes would be a
# hundred commits and a hundred Cloudflare deploys a weekend to publish a file the live
# screen does not read; the Tuesday job still writes it once, at the end.
#
# ─── THE CRON IS A WIDE NET AND THE JOB DECIDES ────────────────────────────────────────
#
# GitHub's cron is UTC and does not know about daylight saving, and the season crosses a
# clock change in early November. `fantasy-pool.yml` answers that by listing both entries
# and asking which one fired, which is right for a job that must run at one exact hour.
# This one does not have an exact hour: it wants to be awake for roughly the whole of a game
# day either side of a clock change, and a wide net in UTC does that with no arithmetic.
#
# So the windows below are deliberately loose and `live-results.mjs` makes the real
# decision, off `games.csv`, which is in Eastern and is already the one source for when a
# game starts. Nothing here reads a wall clock, so a clock change moves nothing. A run with
# nothing to do prints a line and exits: it costs about twenty seconds and writes no SQL.
#
# WHY A LOOP. GitHub's cron is best effort and it proved it: not one scheduled firing ran on
# the first Thursday. So a firing only has to WAKE the job, and the job keeps itself awake
# for as long as a game is on (see the step below). The board is honest about the cadence
# on its own: `checked_at` is when a tick last looked, and the page says so.
#
# ─── IT ALSO ANSWERS A QUESTION NOBODY HAS MEASURED YET ────────────────────────────────
#
# nflverse fills its weekly file in as games finish, which is measured and written up in
# 110_fantasy_live.sql. What is NOT measured is whether it moves DURING a game. Every run
# here logs how many men have a row, so one weekend of these logs answers it with data, and
# `results_at` against `checked_at` in the database answers it a second way.

on:
  schedule:
    # Thursday night in Eastern is Friday in UTC, either 00:15 or 01:15 depending on the
    # offset, so the net runs 00:00 to 06:00 and catches both.
    - cron: '3,13,23,33,43,53 0-6 * * 5'
    # Saturday evening, for the late season Saturday slate.
    - cron: '3,13,23,33,43,53 17-23 * * 6'
    # Sunday: the London games kick off at 9:30am Eastern, which is 13:30 UTC in summer.
    - cron: '3,13,23,33,43,53 13-23 * * 0'
    # Sunday night in Eastern is Monday in UTC.
    - cron: '3,13,23,33,43,53 0-6 * * 1'
    # Monday night in Eastern is Tuesday in UTC.
    - cron: '3,13,23,33,43,53 0-6 * * 2'
  workflow_dispatch:
    inputs:
      force:
        description: 'Write even outside a game window'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  # To hand over to a fresh run when the six hour job limit comes round mid game.
  actions: write

# NEVER TWO AT ONCE, AND THE LATE ONE IS THE ONE TO DROP. Two runs writing the same week
# would both be correct (the upsert is idempotent) and would race on `results_at`, so the
# board could report it had changed when the older of the two simply arrived second.
# `cancel-in-progress: false` because a run that is already fetching should be allowed to
# finish: the next tick is ten minutes away.
concurrency:
  group: fantasy-live
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # NO actions/cache HERE, DELIBERATELY, and this is the one comment in the file that is
      # about something that is not written. `build/.cache` never expires, so a cached
      # `games.csv` or stats file would make this poll the same bytes all afternoon and the
      # board would never move. `live-results.mjs` passes `maxAgeMs: 0` so it would be
      # correct anyway, and the cost of a cache step here is still zero: the two files are
      # the ones that have to be fresh, so there is nothing left worth caching.

      - name: Install the postgres client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # ONE JOB THAT STAYS AWAKE FOR THE GAMES, rather than one job a tick.
      #
      # THE CRON BELOW NEVER FIRED ON THE FIRST THURSDAY. Six scheduled firings sat inside the
      # game window and GitHub ran none of them, which it is allowed to do: scheduled runs are
      # best effort and are dropped under load. So the board read 0.0 for every entrant with
      # a green tick on nothing. What the cron is now is a way to WAKE this job, and one
      # firing that lands anywhere inside three hours of a kickoff is enough: the loop keeps
      # scoring every two minutes while a game is on and every ten while it is waiting on a
      # kickoff or on nflverse's stats, and stops when there is nothing left to watch.
      #
      # A job is capped at six hours, so a loop still watching at five and a half DISPATCHES
      # ITSELF and exits. A workflow_dispatch made with the job's own token is the one kind of
      # event GitHub lets that token start, and the concurrency group queues the new run
      # behind this one, so there is never a gap and never two writers.
      #
      # The repository is public, so the minutes this spends are free.
      #
      # `set -o pipefail` IS LOAD BEARING. Without it the exit status is psql's, so a build
      # that failed outright would pipe nothing into a psql that succeeded and the tick would
      # read as a quiet afternoon. A failed tick does not end the loop (a database blip at
      # 2pm should not cost the rest of Sunday), three in a row do, and any failure at all
      # takes the run red when it ends.
      #
      # THE WINNER'S CODE IS MINTED ON EVERY TICK TOO, because the tick that closes the week
      # is the one that settles the top three (114's trigger) and every entrant's result
      # waits on the code (115). `--pending` asks the database which weeks are unpaid, so a
      # tick with nothing to pay costs one query. Its failures are counted the same way.
      - name: Score the games for as long as they are on
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_PS_PREMIUM_BUNDLE: ${{ secrets.STRIPE_PRICE_PS_PREMIUM_BUNDLE }}
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          set -o pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not set, so there is nowhere to write. Failing loudly."
            exit 1
          fi
          st="$RUNNER_TEMP/live-status"
          deadline=$((SECONDS + 330 * 60))
          failed=0
          streak=0
          tick=0
          while :; do
            tick=$((tick + 1))
            echo "::group::tick $tick at $(date -u +%H:%MZ)"
            if node football/build/live-results.mjs $FORCE --status "$st" \
                 | psql -q -v ON_ERROR_STOP=1 "$SUPABASE_DB_URL"; then
              streak=0
            else
              echo "::warning::tick $tick failed to score"
              failed=1; streak=$((streak + 1))
            fi
            node scripts/stripe/mint-winner-code.mjs --pending --mint \
              || { echo "::warning::tick $tick failed to mint"; failed=1; }
            echo "::endgroup::"
            FORCE=''
            if [ "$streak" -ge 3 ]; then
              echo "::error::three ticks in a row failed to score. Stopping."
              exit 1
            fi
            read -r what wait < "$st" || what=sleep
            if [ "$what" != "watch" ]; then
              echo "Nothing left to watch. Stopping after $tick ticks."
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Still watching at the job's time limit, so handing over to a fresh run."
              gh workflow run fantasy-live.yml --ref "$GITHUB_REF_NAME"
              break
            fi
            sleep "${wait:-600}"
          done
          exit "$failed"
