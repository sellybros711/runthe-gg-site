<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Last Shot | RunThe.GG</title>
<link rel="icon" type="image/png" href="/arcade/assets/arcade-icon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Outfit:wght@600;800&family=Russo+One&display=swap">
<style>
/* One fixed palette, like the Arcade Lab shell: a light page, a dark
   scoreboard. Served by functions/last-shot/[[path]].js, never as a file. */
:root{--ground:#EFEDE8;--ink:#141414;--green:#22B07D;--red:#E0533D;--dim:#5d5a54;--card:#fff;--edge:rgba(20,20,20,.12);--accent:#E8742A;--board:#fbfaf6;--marker:#22324d}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
.app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:8px 10px 4px;margin-top:max(8px,env(safe-area-inset-top));padding:6px 8px 6px 4px;border-radius:18px;background:linear-gradient(180deg,#c8813a 0%,#a8622a 100%);color:#fff;box-shadow:0 8px 22px -12px rgba(0,0,0,.45)}
.top a.back{min-width:40px;min-height:44px;display:grid;place-items:center;text-decoration:none;color:#fff;font-weight:700;font-size:20px;border-radius:12px}
.top .ttl{flex:1;min-width:0}
.top h1{margin:0;font-family:'Russo One','Outfit',sans-serif;font-weight:400;font-size:22px;line-height:1.05;letter-spacing:.02em;text-shadow:0 2px 0 #6e3511}
.top .sub{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:12px;font-weight:600;color:#fbe3cc;white-space:nowrap;overflow:hidden}
.top .sub em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.tag{flex:none;font-size:9px;font-weight:700;letter-spacing:.12em;background:#1d2129;color:#fff;padding:3px 7px;border-radius:999px}
.score{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 10px 6px;padding:6px 12px;border-radius:14px;background:#1d2129;color:#fff;font-family:'Outfit',sans-serif;font-variant-numeric:tabular-nums}
.score .team{display:flex;flex-direction:column;align-items:center;min-width:56px}
.score .team span{font-size:10px;letter-spacing:.12em;color:#b9bec8;font-weight:700}
.score .team b{font-size:24px;line-height:1}
.score .clock{font-family:'Russo One',monospace;font-size:28px;color:#ffd23f;min-width:84px;text-align:center;text-shadow:0 0 10px rgba(255,210,63,.35)}
.stage{position:relative;flex:1;min-height:0}
canvas.surface{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;outline:none}
.pop{position:absolute;left:50%;top:84%;transform:translate(-50%,-50%) scale(.85);font-family:'Outfit',sans-serif;font-weight:800;font-size:22px;line-height:1.1;opacity:0;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;color:#fff;background:rgba(29,33,41,.92);padding:7px 16px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.pop.final{font-size:28px;background:#1d2129;color:#ffd23f}
.pop.on{animation:pop 1s ease-out forwards}
.pop.final.on{animation:popStay 1.3s ease-out forwards}
@keyframes pop{10%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}20%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-56%) scale(1)}}
@keyframes popStay{12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}24%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.hint{position:absolute;left:8px;right:8px;bottom:8px;text-align:center;font-weight:700;font-size:14px;pointer-events:none;color:var(--dim)}
.tools{display:flex;gap:6px;padding:6px 10px 4px}
.tool{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--edge);background:var(--card);font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;touch-action:manipulation}
.tool small{font-size:10px;font-weight:600;color:var(--dim)}
.tool[aria-pressed="true"]{background:var(--marker);color:#fff;border-color:var(--marker)}
.tool[aria-pressed="true"] small{color:#cfd8e8}
.actions{display:flex;gap:6px;padding:4px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.btn{min-height:48px;padding:0 16px;border-radius:14px;border:0;background:var(--ink);color:var(--ground);font-weight:700;font-size:16px;flex:1;touch-action:manipulation}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--edge);flex:.6}
.btn.go{background:var(--green);color:#fff;flex:1.4}
.btn:disabled{opacity:.4;cursor:default}
.sheet{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(239,237,232,.72);backdrop-filter:blur(3px);z-index:5}
.sheet.on{display:flex}
.card{background:var(--card);border:1px solid var(--edge);border-radius:20px 20px 0 0;width:100%;padding:20px 18px;padding-bottom:max(20px,env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.08);max-height:92%;overflow:auto}
.verdict{font-family:'Russo One','Outfit',sans-serif;font-size:40px;line-height:1;margin:0}
.verdict.win{color:var(--green)}.verdict.lose{color:var(--red)}
.finalscore{font-family:'Outfit',sans-serif;font-size:30px;font-weight:800;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.card p{margin:6px 0;line-height:1.4}
.facts{color:var(--dim);font-size:14px}
.reason{font-size:17px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.link{background:none;border:0;padding:0;text-decoration:underline;color:var(--dim);font-size:13px;min-height:32px}
.dbg{font:12px/1.4 ui-monospace,monospace;background:#1d2129;color:#9f9;padding:8px;border-radius:8px;white-space:pre-wrap;word-break:break-all}
/* THE BOTTOM BANNER (/assets/rtg-ads.js), once the ad tag is on at launch: the app ends above it, so
   the court shrinks to fit and Run It is never under it. --sticky-ad-h is 0 until it fills. */
body.rtg-sticky-on .app{bottom:var(--sticky-ad-h,0px)}
@media (prefers-reduced-motion:reduce){.pop.on,.pop.final.on{animation:none;opacity:1;transform:translate(-50%,-50%)}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a class="back" href="/arcade/" aria-label="Back to the Arcade">&#8592;</a>
    <div class="ttl"><h1>Last Shot</h1><div class="sub"><span class="tag">TESTERS ONLY</span><em id="tagline">Draw it up. Win it.</em></div></div>
  </div>
  <div class="score" aria-live="off">
    <div class="team"><span>YOU</span><b id="sUs">87</b></div>
    <div class="clock" id="clock">22.0</div>
    <div class="team"><span>THEM</span><b id="sThem">88</b></div>
  </div>
  <div class="stage" id="stage">
    <canvas class="surface" id="board" aria-label="Clipboard" tabindex="0"></canvas>
    <canvas class="surface" id="court" aria-label="The play" hidden></canvas>
    <div class="pop" id="pop" aria-live="polite"></div>
    <div class="hint" id="hint"></div>
    <div class="sheet" id="sheet"><div class="card" id="card"></div></div>
  </div>
  <div class="tools" id="tools">
    <button class="tool" data-tool="move" aria-pressed="false">Move<small>drag a route</small></button>
    <button class="tool" data-tool="screen" aria-pressed="false">Screen<small>route + bar</small></button>
    <button class="tool" data-tool="pass" aria-pressed="false">Pass<small>ball, then man</small></button>
    <button class="tool" data-tool="shoot" aria-pressed="false">Shoot<small>tap shooter</small></button>
  </div>
  <div class="actions" id="actions">
    <button class="btn alt" id="bUndo">Undo</button>
    <button class="btn alt" id="bClear">Clear</button>
    <button class="btn go" id="bRun" disabled>Run It</button>
  </div>
</div>
<!-- Run The Floor's player rig, for the live play (read only, never edited
     from here). UNVERSIONED ON PURPOSE: a ?v= here would be recorded by
     scripts/check-cachebust.mjs, and every later bump of baller.js in hoops
     would fail that check on this page, so the hoops agents would have to edit
     Last Shot to ship. Unversioned, Pages revalidates it and this page always
     gets the current file. court.js uses it only at API_VERSION 2; missing or
     any other version draws the disc tokens instead. -->
<script defer src="/hoops/baller.js"></script>
<script type="module" src="/last-shot/m/client.js?b=__BUILD__"></script>
<!-- The ads (Ads Agent, 2026-10-30): ready, and inert until the launch commit adds the ad tag.
     functions/_lastshot/ads.js says what turns on. -->
<script defer src="/last-shot/m/ads.js?b=__BUILD__"></script>
</body>
</html>
