<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Stumpire | Run The Arcade</title>
<style>
  :root{--bg:#070b14;--card:#141b2b;--ink:#eef2f8;--mut:#9aa7bd;--line:#26314a;--safe:#3ecf8e;--out:#ff6b6b;--strike:#ffc94d;--np:#8fb3ff;--led:#ffcf5a}
  *{box-sizing:border-box}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .top{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px}
  .top h1{font-size:19px;margin:0;font-weight:900;letter-spacing:.02em}
  .top .r{display:flex;gap:12px;align-items:center}
  .top a{color:var(--mut);text-decoration:none;font-size:14px;white-space:nowrap}
  @media (max-width:520px){.top .r{gap:8px}.top .long{display:none}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .top button{white-space:nowrap;font:inherit;font-size:13px;color:var(--mut);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}

  /* THE BALLPARK. The canvas is drawn at a whole number of device pixels per
     scene pixel, so the art stays crisp. Everything a player reads (the
     prompt, the count, the clock, the Stumpire's words) is real text laid
     over the picture, never pixels in the canvas. */
  #stage{position:relative;max-width:1000px;margin:0 auto;overflow:hidden;line-height:0;background:#04060f}
  #scene{display:block;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges}
  #jumbo{position:absolute;line-height:1.2;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
    padding:5px 8px;color:var(--led);background:#07080a radial-gradient(circle,rgba(255,207,90,.07) 1px,transparent 1.4px) 0 0/3px 3px;
    text-shadow:0 0 6px rgba(255,190,70,.55);font-weight:800}
  .jt-row{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
  .jt-row b{color:#fff3cf}
  #league{opacity:.85}
  .pclock{display:flex;align-items:center;gap:5px}
  #clock{font-size:18px;color:#fff3cf;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
  #clock.low{color:#ff5a4f;animation:blink .5s steps(2) infinite}
  @keyframes blink{50%{opacity:.35}}
  #prompt{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;color:#ffe9b0;padding:2px 0}
  #prompt.reveal{animation:reveal .7s steps(10) both}
  @keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  #board .grp{display:flex;align-items:center;gap:4px}
  .dots span{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2a2410;margin-left:2px;box-shadow:inset 0 0 0 1px #4a3d18}
  .dots span.on{background:var(--strike);box-shadow:0 0 6px var(--strike)}
  .dots.outs span.on{background:#ff5a4f;box-shadow:0 0 6px #ff5a4f}
  #jfx{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#07080a;font-size:30px;font-weight:900;letter-spacing:.06em;color:#fff3cf}
  #jfx.go{display:flex;animation:jfx 1.9s steps(1) both}
  @keyframes jfx{0%,20%,40%,60%,80%{color:#fff3cf}10%,30%,50%,70%{color:#ff7a3d}100%{opacity:0}}

  #ump{position:absolute;line-height:1.25;max-width:min(62%,300px);background:#fffaf0;color:#1b1f2a;border-radius:12px;padding:7px 10px 8px;
    font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.35);transform-origin:0 100%;opacity:0;transition:opacity .2s}
  #ump.on{opacity:1}
  #ump::after{content:"";position:absolute;left:-7px;bottom:10px;border:7px solid transparent;border-right-color:#fffaf0;border-left:0}
  #ump .who{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#9a3b2c}
  #umpSays{font-weight:600;min-height:1.25em}

  /* The call goes up on the big board, where a ballpark puts it. */
  #ruling{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;
    background:#07080a radial-gradient(circle,rgba(255,207,90,.07) 1px,transparent 1.4px) 0 0/3px 3px;line-height:1.05;padding:2px 8px}
  #ruling.hide{display:none}
  #ruling .ruling{font-size:clamp(26px,6.5vw,46px);font-weight:900;font-style:italic;letter-spacing:.04em;text-shadow:0 0 10px currentColor;animation:slam .45s cubic-bezier(.2,1.6,.4,1) both}
  #ruling .sub{margin-top:4px;font-size:13px;font-weight:800;color:#ffe9b0;letter-spacing:.04em}
  #ruling.fade{transition:opacity .5s;opacity:0}
  @keyframes slam{from{transform:scale(2.4) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(-2deg);opacity:1}}
  .SAFE{color:var(--safe)}.OUT{color:var(--out)}.STRIKE{color:var(--strike)}.NO_PITCH{color:var(--np)}

  #hud{max-width:1000px;margin:0 auto;padding:10px 12px 18px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .hide{display:none}
  #atbat{position:sticky;bottom:8px;z-index:5;box-shadow:0 -6px 24px rgba(0,0,0,.45)}
  .tell{color:var(--mut);font-size:14px}
  .swingrow{display:flex;gap:8px;margin-top:8px}
  input[type=text]{flex:1;min-width:0;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0b101a;color:var(--ink)}
  input[type=text]:focus{outline:2px solid #2f6fed;outline-offset:0}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#24304a;color:var(--ink);padding:10px 14px}
  button.go{background:#e0402f;border-color:#e0402f;font-weight:800;letter-spacing:.02em}
  button.big{width:100%;font-size:19px;padding:14px}
  button:disabled{opacity:.5;cursor:default}
  #sugg{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
  #sugg button{width:100%;text-align:left;display:flex;justify-content:space-between;gap:8px;background:#0f1624}
  #sugg small,.opt small{color:var(--mut)}
  #maxTier{color:var(--strike);font-size:13px}
  .abtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .clk2{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--led);min-width:3ch;text-align:right}
  .clk2.low{color:var(--out);animation:blink .5s steps(2) infinite}
  .cardlbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
  .cards{display:flex;flex-wrap:wrap;gap:6px}
  .ccard{min-width:74px;padding:6px 9px;border-radius:7px;font-size:13px;font-weight:700;text-align:center;background:#f3ead2;color:#2a1d10;border:1px solid #c9b88a;box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .ccard.down{background:repeating-linear-gradient(45deg,#7a1f2b 0 6px,#8f2834 6px 12px);color:#f3ead2;border-color:#5a141e}
  .ccard.flip{animation:flip .5s ease both}
  .ccard.hit{background:#ff6b6b;color:#1b0b0b;border-color:#ff6b6b}
  @keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
  #power{display:flex;gap:4px;margin-top:8px;align-items:center}
  #power .lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-right:4px}
  #power span.seg{flex:1;text-align:center;font-size:12px;font-weight:900;padding:4px 0;border-radius:5px;background:#1f2738;color:#56607a;transition:all .3s}
  #power span.seg.on{background:#3ecf8e;color:#06140d}
  #power span.seg.on.peak{background:#ffcf5a;color:#1d1505}
  #power span.seg.lost{text-decoration:line-through}
  #ump{cursor:pointer}

  .called{color:var(--mut);font-size:14px}
  #picker{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:20}
  #picker .sheet{background:var(--card);border-radius:14px;padding:14px;width:100%;max-width:560px}
  .opt{width:100%;text-align:left;margin-top:6px;display:flex;justify-content:space-between}
  pre.share{white-space:pre-wrap;background:#0b101a;padding:12px;border-radius:10px;font-size:18px}
  ol.hist{padding-left:20px;margin:6px 0}
  ol.hist li{margin-bottom:8px}
  .mut{color:var(--mut);font-size:14px}
  .final{font-size:22px;font-weight:900}
  .bigscore{display:flex;align-items:baseline;gap:10px;margin:4px 0 8px}
  .bigscore b{font-size:54px;line-height:1;font-weight:900;color:var(--led);text-shadow:0 0 14px rgba(255,190,70,.35);font-variant-numeric:tabular-nums}
  .bigscore span{color:var(--mut);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12px}
  .linescore{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0 10px}
  .linescore div{background:#0b101a;border:1px solid var(--line);border-radius:7px;text-align:center;padding:6px 2px;font-weight:900}
  .linescore small{display:block;color:var(--mut);font-size:10px;font-weight:700;letter-spacing:.08em}
  .linescore .h{color:var(--safe)}.linescore .o{color:var(--out)}
  table.calc{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:10px}
  table.calc td{padding:3px 0;border-bottom:1px solid var(--line)}
  table.calc td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  table.calc tr.tot td{border-bottom:0;font-size:16px;color:var(--led)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{background:#0b101a;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
  .row2{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  ol.board{list-style:none;padding:0;margin:6px 0 0}
  ol.board li{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:7px;font-size:14px}
  ol.board li:nth-child(odd){background:#0f1624}
  ol.board li.me{outline:2px solid var(--led)}
  ol.board .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  ol.board .sc{font-weight:900;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="top"><h1>Stumpire</h1><div class="r"><button id="howto" type="button">Rules</button><button id="snd" type="button">Sound on</button><a href="/arcade/"><span class="long">Run The </span>Arcade</a></div></div>

<div id="stage">
  <canvas id="scene" aria-label="The ballpark. The Stumpire is behind the plate."></canvas>
  <div id="jumbo">
    <div class="jt-row"><span id="league">Stumpire Park</span><span class="pclock">Clock <span id="clock">30</span></span></div>
    <div id="prompt">Loading the slate.</div>
    <div class="jt-row hide" id="board">
      <span class="grp">Slate <b id="slNo"></b></span>
      <span class="grp">AB <b id="abNo">1</b>/5</span>
      <span class="grp">Score <b id="score">0</b></span>
      <span class="grp">R <b id="runs">0</b></span>
      <span class="grp">S<span class="dots" id="strikes"></span></span>
      <span class="grp">O<span class="dots outs" id="outs"></span></span>
    </div>
    <div id="ruling" class="hide"></div>
    <div id="jfx"></div>
  </div>
  <div id="ump" data-mood="idle" data-state="waiting"><div class="who">The Stumpire</div><div id="umpSays"></div></div>
</div>

<div id="hud">
  <div class="panel" id="gate">Loading.</div>
  <div class="panel hide" id="next"><button class="go big" id="nextBtn">Play ball</button></div>
  <div class="panel hide" id="atbat">
    <div class="abtop"><div><div class="cardlbl">His card</div><div class="cards" id="pocket"></div></div><div class="clk2" id="clock2">30</div></div>
    <div id="power"><span class="lbl">Best hit</span><span class="seg">1B</span><span class="seg">2B</span><span class="seg">3B</span><span class="seg">HR</span></div>
    <div class="sr" id="tell"></div>
    <div class="sr" id="maxTier"></div>
    <div class="swingrow"><input type="text" id="answer" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Name a player or team" maxlength="60"><button class="go" id="swing">Swing</button></div>
    <ul id="sugg"></ul>
  </div>
  <div class="panel hide" id="reveal"></div>
  <div class="panel hide" id="over"></div>
  <div class="panel hide" id="historyCard"><b>The box score</b><ol class="hist" id="history"></ol></div>
</div>

<div id="picker" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
  <div class="sheet"><b id="pickTitle">Which one do you mean?</b><div class="mut">The clock is stopped while you choose.</div><div id="pickOpts"></div>
  <div class="row" style="margin-top:8px"><button id="pickCancel">None of these</button></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/arcade/auth.js?v=4"></script>
<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function show(id, on) { $(id).classList.toggle('hide', !on); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  var A = window.RTG_AUTH;
  var REDUCE = false;
  try { REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  /* ================================================================
     SOUND. Everything is synthesized, so there is nothing to download.
     ================================================================ */
  var SND_KEY = 'stumpire_sound_v1', soundOn = true, AC = null, NOISE = null;
  try { soundOn = localStorage.getItem(SND_KEY) !== '0'; } catch (e) {}
  function paintSnd() { $('snd').textContent = soundOn ? 'Sound on' : 'Sound off'; $('snd').setAttribute('aria-pressed', soundOn ? 'true' : 'false'); }
  paintSnd();
  $('snd').onclick = function () { soundOn = !soundOn; try { localStorage.setItem(SND_KEY, soundOn ? '1' : '0'); } catch (e) {} paintSnd(); if (soundOn) sfx('blip'); };
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function noiseBuf(a) {
    if (NOISE) return NOISE;
    var b = a.createBuffer(1, a.sampleRate * 2, a.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return (NOISE = b);
  }
  function burst(dur, f, q, vol, type, delay) {
    var a = ac(); if (!a) return;
    var t = a.currentTime + (delay || 0);
    var s = a.createBufferSource(); s.buffer = noiseBuf(a);
    var fl = a.createBiquadFilter(); fl.type = type || 'bandpass'; fl.frequency.value = f; fl.Q.value = q || 1;
    var gn = a.createGain(); gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.03, dur / 4));
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(gn); gn.connect(a.destination); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }
  function tone(f0, f1, dur, vol, type, delay) {
    var a = ac(); if (!a) return;
    var t = a.currentTime + (delay || 0);
    var o = a.createOscillator(); o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    var gn = a.createGain(); gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(vol, t + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  var SFX = {
    crack: function () { burst(0.08, 2800, 0.9, 0.9); tone(1200, 300, 0.05, 0.25, 'square'); },
    pop: function () { burst(0.12, 260, 0.8, 1, 'lowpass'); },
    whoosh: function () { burst(0.2, 900, 0.5, 0.3); },
    crowd: function (lv) { burst(1.4 + lv * 1.6, 800, 0.35, 0.08 + lv * 0.16); },
    groan: function () { tone(240, 130, 0.7, 0.05, 'sawtooth'); burst(0.9, 400, 0.4, 0.06); },
    organ: function () { [392, 523, 659, 784, 659, 784].forEach(function (f, i) { tone(f, f, 0.14, 0.07, 'square', i * 0.12); }); },
    call: function () { tone(300, 160, 0.38, 0.1, 'sawtooth'); tone(150, 90, 0.38, 0.08, 'square'); },
    huh: function () { tone(180, 320, 0.25, 0.08, 'sawtooth'); },
    blip: function () { tone(880, 880, 0.04, 0.05, 'square'); },
    tick: function () { tone(1500, 1500, 0.02, 0.03, 'square'); },
    boom: function () { burst(0.7, 140, 0.6, 0.7, 'lowpass'); }
  };
  function sfx(n, a) { if (!soundOn || !SFX[n]) return; try { SFX[n](a); } catch (e) {} }

  /* ================================================================
     THE SCENE. One logical pixel grid, H tall, as wide as the screen
     allows. Static ground is drawn once per layout into BG; the people,
     the ball, the crowd and the fireworks are drawn every frame.
     ================================================================ */
  var cv = $('scene'), g = cv.getContext('2d');
  var BG = document.createElement('canvas'), bg = BG.getContext('2d');
  var W = 320, H = 240, S = 2, U = 1, OFFX = 0, NOW = 0, LAST = 0;
  var GEO = {}, FANS = [], STARS = [], UZ = 1;
  var UMPC = document.createElement('canvas'); UMPC.width = 160; UMPC.height = 132; var umpg = UMPC.getContext('2d');

  function layout() {
    var cssW = $('stage').clientWidth || window.innerWidth;
    var dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    var target = Math.max(250, Math.min(cssW * 0.95, window.innerHeight * 0.6, 600));
    S = Math.max(1, Math.round(target * dpr / H));
    W = Math.max(200, Math.floor(cssW * dpr / S));
    cv.width = W * S; cv.height = H * S;
    U = S / dpr;
    cv.style.width = (W * U) + 'px'; cv.style.height = (H * U) + 'px';
    OFFX = Math.max(0, (cssW - W * U) / 2);
    geometry(); paintBG(); placeOverlays();
  }

  function geometry() {
    var hz = 124, jw = Math.min(W - 22, 310), jh = W < 300 ? 78 : 66;
    GEO = {
      hz: hz, standTop: 36, standBot: hz - 10,
      jumbo: { x: Math.round((W - jw) / 2), y: 5, w: jw, h: jh },
      plate: { x: Math.round(W * 0.46), y: 208 },
      mound: { x: Math.round(W * 0.6), y: 150 },
      b1: { x: Math.round(W * 0.88), y: 168 },
      b2: { x: Math.round(W * 0.64), y: 136 },
      b3: { x: Math.round(W * 0.24), y: 160 },
      ump: { x: 0, y: 238 }
    };
    UZ = W >= 380 ? 2 : 1;
    GEO.ump.x = Math.max(32 * UZ, Math.round(W * 0.13));
    GEO.catcher = { x: GEO.plate.x + 3, y: 226 };
    GEO.batter = { x: GEO.plate.x - 14, y: 208 };
    GEO.base = [GEO.plate, GEO.b1, GEO.b2, GEO.b3, GEO.plate];
    var home = [[0.46, 142, 0.27], [0.78, 147, 0.27], [0.2, 131, 0.21], [0.6, 128, 0.2], [0.93, 133, 0.21]];
    fielders = home.map(function (h) { var x = Math.round(W * h[0]); return { hx: x, hy: h[1], x: x, y: h[1], k: h[2], tx: x, ty: h[1], pose: mkPose(FP.ready), hold: null, run: 0 }; });
    pitcher.x = GEO.mound.x; pitcher.y = GEO.mound.y - 1;
    FANS = []; STARS = [];
    var j = GEO.jumbo, palette = ['#e0402f', '#f2f2f2', '#2f6fed', '#ffcf5a', '#3ecf8e', '#d46bd8', '#ff8a3d', '#8fb3ff'];
    var skins = ['#f1c7a0', '#d9a27a', '#b47a52', '#7d4f33', '#5a3825'];
    for (var y = GEO.standTop + 4; y < GEO.standBot - 2; y += 5) {
      for (var x = 2 + ((y / 5) % 2) * 2; x < W - 2; x += 4 + (hash(x * 7 + y) % 2)) {
        if (x > j.x - 3 && x < j.x + j.w + 3 && y < j.y + j.h + 3) continue;
        if (hash(x * 13 + y * 3) % 9 === 0) continue;
        FANS.push({ x: x, y: y, c: palette[hash(x + y * 31) % palette.length], s: skins[hash(x * 3 + y) % skins.length], ph: (hash(x * y + 5) % 100) / 16 });
      }
    }
    for (var i = 0; i < 40; i++) STARS.push({ x: hash(i * 97) % W, y: hash(i * 61 + 3) % (GEO.standTop - 4), t: hash(i * 7) % 5 });
  }
  function hash(n) { n = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b); n ^= n >>> 13; n = Math.imul(n, 0xc2b2ae35); n ^= n >>> 16; return n >>> 0; }

  function placeOverlays() {
    var j = GEO.jumbo, jb = $('jumbo');
    jb.style.left = (OFFX + (j.x + 3) * U) + 'px'; jb.style.top = ((j.y + 3) * U) + 'px';
    jb.style.width = ((j.w - 6) * U) + 'px'; jb.style.height = ((j.h - 6) * U) + 'px';

      api('GET', 'search?q=' + encodeURIComponent(q)).then(function (r) {
        if (my !== sSeq || busy || $('atbat').classList.contains('hide')) return;
        $('sugg').innerHTML = (r.results || []).map(function (o) { return '<li><button data-id="' + esc(o.id) + '"><span>' + esc(o.name) + '</span><small>' + esc(o.tag) + '</small></button></li>'; }).join('');
      });
    }, 120);
  });
  $('sugg').addEventListener('click', function (e) { var b = e.target.closest('button[data-id]'); if (b) submit({ entityId: b.dataset.id }); });
  $('answer').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit({ text: $('answer').value }); } });
  $('swing').onclick = function () { submit({ text: $('answer').value }); };
  $('nextBtn').onclick = function () {
    if (introStep >= 0) { clearTimeout(introTimer); introStep = -1; try { localStorage.setItem(INTRO_KEY, '1'); } catch (e) {} }
    $('ruling').classList.add('hide'); show('reveal', false); sfx('blip');
    api('POST', 'pitch').then(function (v) { if (v._status === 200) render(v); });
  };
  $('history').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-ch]'); if (!b) return;
    var note = prompt('What did the Stumpire get wrong? (optional)') || '';
    api('POST', 'challenge', { atBat: Number(b.dataset.ch), note: note }).then(function (r) {
      b.disabled = true; b.textContent = r._status === 200 ? 'Challenge sent' : r.error === 'already_challenged' ? 'Already challenged' : 'Could not send';
      if (r._status === 200) setUmp('impatient', null, 'A challenge? Fine. I will look at the tape.');
    });
  });

  function load() {
    api('GET', 'today').then(function (v) {
      if (v._status === 404) { $('gate').textContent = 'Page not found.'; return; }
      if (v.noSlate) { $('gate').textContent = 'No slate today. Check back tomorrow.'; setUmp('idle', 'waiting', 'Day off. Come back tomorrow.'); return; }
      render(v);
    });
  }

  function start() {
    var signed = A && A.state && A.state().signedIn;
    api('GET', 'me').then(function () {
      if (signed) { try { var gid = localStorage.getItem(GUEST_KEY); if (gid) api('POST', 'claim', { guestId: gid }); } catch (e) {} }
      load();
    });
  }

  var rz = null;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(layout, 120); });
  layout();
  requestAnimationFrame(frame);
  setUmp('idle', 'waiting', '');

  if (A && A.boot && A.boot()) {
    var started = false;
    A.onChange(function (s) { if (s.resolved && !started) { started = true; start(); } });
    setTimeout(function () { if (!started) { started = true; start(); } }, 2500);
  } else start();
})();
</script>
</body>
</html>
