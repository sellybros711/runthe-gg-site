<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>CFB — Collegiate font preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;600;700;800&family=Barlow+Condensed:wght@700;800&family=Graduate&family=Alfa+Slab+One&family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#080b14;--panel:#131a2b;--panel-2:#1a2337;--line:rgba(255,255,255,.10);--line-2:rgba(255,255,255,.18);
    --ink:#eef2f9;--dim:#94a3b8;--dim-2:#7d8fa8;--green:#10b981;--gold:#f59e0b;
    --grad-green:linear-gradient(135deg,#10b981,#059669);
    --grad-gold:linear-gradient(135deg,#fbbf24,#d97706);
    --fn:'Archivo',system-ui,sans-serif;--fbar:'Barlow Condensed',Impact,sans-serif;--fd:'Anton',Impact,sans-serif;
  }
  body{background:var(--bg);color:var(--ink);font-family:var(--fn);line-height:1.4;padding:18px 16px 60px;
    background-image:radial-gradient(1000px 600px at 50% -8%,rgba(16,185,129,.10),transparent 70%),
      radial-gradient(800px 500px at 100% 100%,rgba(245,158,11,.07),transparent 70%);background-attachment:fixed}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-family:var(--fd);font-size:30px;text-transform:uppercase;letter-spacing:.01em;margin-bottom:4px}
  .lede{color:var(--dim);font-size:14px;margin-bottom:22px}
  .card{background:linear-gradient(180deg,#182134,#111827);border:1px solid var(--line);border-radius:16px;
    padding:16px 16px 20px;margin-bottom:16px}
  .fontname{font-family:var(--fn);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim-2);margin-bottom:2px}
  .fonttitle{font-size:26px;margin-bottom:14px;line-height:1}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:11px 0}
  .lbl{width:100%;font-family:var(--fn);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim-2);margin-bottom:-2px}

  /* the actual game elements, but the collegiate face is swapped in via --cf */
  .eyebrow{font-family:var(--cf);text-transform:uppercase;letter-spacing:.2em;font-size:12px;font-weight:700}
  .eyebrow.gold{color:var(--gold)} .eyebrow.green{color:var(--green)} .eyebrow.dim{color:var(--dim-2)}

  .ribbon{display:inline-flex;font-family:var(--cf);font-size:11px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:#08130d;padding:6px 15px 5px;border-radius:99px;white-space:nowrap;
    box-shadow:0 5px 14px -5px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.45)}
  .ribbon.gameday{background:var(--grad-green)}
  .ribbon.showdown{background:linear-gradient(135deg,#fde047,#f59e0b);color:#1a1206}
  .ribbon.rivalry{background:linear-gradient(135deg,#fb7185,#dc2626);color:#fff}

  .bowl{font-family:var(--cf);font-size:24px;letter-spacing:.01em;line-height:1.05}
  .round{font-family:var(--cf);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#e6edf6;
    background:linear-gradient(180deg,#586479,#333c4c);padding:6px 13px;border-radius:8px;display:inline-block}
  .champ{background:linear-gradient(180deg,#ffe08a,#e0a423);color:#3a2600}

  .note{font-size:12px;color:var(--dim);margin-top:26px;line-height:1.5;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Collegiate font preview</h1>
  <p class="lede">The same elements — eyebrows/labels, broadcast ribbons, and bowl/round names — shown in each candidate. Scroll to compare, then tell me which you like.</p>
  <div id="out"></div>
  <p class="note">These are only mock-ups on a scratch page. Nothing in the game has changed yet.</p>
</div>
<script>
  const FONTS = [
    {name:'Current', css:"'Barlow Condensed',Impact,sans-serif", tag:'what it is now'},
    {name:'Graduate', css:"'Graduate',serif", tag:'classic varsity block letters'},
    {name:'Alfa Slab One', css:"'Alfa Slab One',serif", tag:'heavy athletic slab'},
    {name:'Zilla Slab', css:"'Zilla Slab',serif", tag:'clean, readable slab serif'},
  ];
  const block = (f) => `
    <div class="card" style="--cf:${f.css}">
      <div class="fontname">${f.tag}</div>
      <div class="fonttitle" style="font-family:${f.css}">${f.name}</div>

      <div class="row"><span class="lbl">Eyebrows &amp; labels</span>
        <span class="eyebrow gold">College Edition</span>
        <span class="eyebrow dim" style="margin-left:14px">NIL Budget</span>
        <span class="eyebrow green" style="margin-left:14px">Your School</span>
      </div>

      <div class="row"><span class="lbl">Broadcast ribbons</span>
        <span class="ribbon gameday">Gameday</span>
        <span class="ribbon showdown">Top 10 Showdown</span>
        <span class="ribbon rivalry">Rivalry Week</span>
      </div>

      <div class="row"><span class="lbl">Bowl &amp; round names</span></div>
      <div class="bowl" style="color:#d8b4fe">Air Raid Bowl</div>
      <div class="row" style="margin-top:8px">
        <span class="round">First Round</span>
        <span class="round">Semifinal</span>
        <span class="round champ">National Championship</span>
      </div>
    </div>`;
  document.getElementById('out').innerHTML = FONTS.map(block).join('');
</script>
</body>
</html>
