<!doctype html>
<!-- THE MYTHIBALL LOGO, IN PIXELS. `node mythiball/build-logo.mjs` renders every logo file from this page.

     The drawing itself is NOT in this file. It lives in the game (mythiball/index.html, between MYPIX BEGIN
     and MYPIX END) because the header draws the same mark, and one drawing in two places is two drawings
     the first time either is touched. This page reads that block out of the game and runs it. It is Run
     The Tour's approach (golf/logo-source.html) on purpose, so the two games carry one family of mark.

     A retro game title: small cream MYTHI over chunky gold BALL with a 16-bit extrude, standing on an
     infield, and a winged baseball flying off the end of it. Every file is one of the kit's grids at a
     WHOLE scale:
       lockup  108 x 56   the title (the link preview, and anywhere that wants a big one)
       icon32   32 x 32   the app icons and a 32px tab
       icon16   16 x 16   a 16px tab and the header, drawn again at that size rather than scaled down -->
<html><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>MythiBall logo</title>
<style>html,body{margin:0;background:#10213f} canvas{image-rendering:pixelated;margin:14px;vertical-align:top}</style></head>
<body>
<script>
(async function(){
  const src=await (await fetch('/mythiball/index.html',{cache:'no-store'})).text();
  const a=src.indexOf('/* ==================== MYPIX BEGIN'), b=src.indexOf('/* ==================== MYPIX END ==================== */');
  if(a<0||b<0) throw new Error('the pixel kit markers are missing from mythiball/index.html');
  const MYPIX=new Function(src.slice(a,b)+'\nreturn MYPIX;')();
  window.MYPIX=MYPIX;
  // the four frames of one wingbeat, a quarter turn apart
  window.PHASES=[0,Math.PI/2,Math.PI,Math.PI*1.5];
  const add=c=>document.body.appendChild(c);
  PHASES.forEach(p=>add(MYPIX.toCanvas(MYPIX.lockup(p),4)));
  add(MYPIX.toCanvas(MYPIX.icon(32,0),6)); add(MYPIX.toCanvas(MYPIX.icon(16,0),6));
  window.__markReady=true;
})();
</script>
</body></html>
