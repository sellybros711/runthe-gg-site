<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MythiBall 3D Prototype</title>
<style>
  :root { --ink: #fbf6e8; --dim: #c9c2ae; --panel: rgba(16, 18, 28, 0.78); --gold: #f4c25a; --line: rgba(255, 255, 255, 0.14); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d1018; color: var(--ink); font: 14px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; }
  .bar { position: fixed; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  #top { top: 0; background: linear-gradient(var(--panel), rgba(16, 18, 28, 0)); padding-bottom: 18px; }
  #bottom { bottom: 0; background: linear-gradient(rgba(16, 18, 28, 0), var(--panel)); padding-top: 18px; justify-content: center; }
  .grp { display: flex; gap: 2px; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
  button, select { font: inherit; font-size: 12px; color: var(--ink); background: transparent; border: 0; border-radius: 8px; padding: 6px 9px; cursor: pointer; }
  select { background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); max-width: 150px; }
  button.solo { background: rgba(0, 0, 0, 0.4); border: 1px solid var(--line); }
  button.on, button.solo.on { background: var(--gold); color: #1a1408; font-weight: 700; }
  h1 { font-size: 14px; margin: 0 6px 0 2px; letter-spacing: .04em; }
  #stats { font: 11px ui-monospace, monospace; color: var(--dim); margin-left: auto; font-variant-numeric: tabular-nums; }
  #res { font: 11px ui-monospace, monospace; color: var(--dim); }
  #name { font-weight: 700; text-shadow: 0 1px 2px #000; }
  #count { font-variant-numeric: tabular-nums; letter-spacing: .05em; text-shadow: 0 1px 2px #000; }
  #count b { color: var(--gold); margin-left: 8px; }
  #tell { color: var(--dim); font-size: 12px; }
  #banner { position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%) scale(.6); font: 900 clamp(28px, 8vw, 64px)/1 system-ui, sans-serif; letter-spacing: .03em; color: #fff; text-shadow: 0 4px 0 #14121a, 0 0 18px rgba(0, 0, 0, .5); opacity: 0; pointer-events: none; transition: opacity .15s, transform .25s cubic-bezier(.2, 1.6, .4, 1); white-space: nowrap; }
  #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #banner.hr { color: var(--gold); } #banner.out { color: #ff8a7a; } #banner.safe { color: #8af08a; } #banner.strike { color: #ffb05a; } #banner.ball { color: #9ad0ff; }
  #anims { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; max-width: 820px; }
  #anims button { background: rgba(0, 0, 0, 0.45); border: 1px solid var(--line); }
  #anims button.on { background: var(--gold); }
  body[data-mode="play"] .cast-only, body[data-mode="cast"] .play-only { display: none !important; }
  #opts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; width: 100%; }
  #b-opts { display: none; }
  @media (max-width: 640px) { #b-opts { display: inline-block; } #opts { display: none; } body.opts #opts { display: flex; } #hint { display: none; } }
  #hint { color: var(--dim); font-size: 12px; text-align: center; width: 100%; }
  #nogl { display: none; position: fixed; inset: 0; place-items: center; text-align: center; padding: 24px; }
  body.nogl #nogl { display: grid; } body.nogl .bar { display: none; }
  @media (max-width: 640px) { #stats { width: 100%; margin: 0; order: 9; } h1 { display: none; } select { max-width: 110px; } }
</style>
<script src="../sprites/cast.js?v=1"></script>
</head>
<body data-mode="play">
<canvas id="view"></canvas>
<div id="banner"></div>
<div id="nogl"><div><h2>This prototype needs WebGL.</h2><p>Your browser did not give it one. <a href="../" style="color:#f4c25a">Back to MythiBall</a></p></div></div>

<div id="top" class="bar">
  <h1>MythiBall 3D</h1>
  <div class="grp" id="modes"><button data-m="play" class="on">Play</button><button data-m="cast">Cast</button></div>
  <div class="grp" id="levels"><button>Chunky</button><button class="on">Pixel</button><button>Crisp</button><button>HD</button></div>
  <span id="res"></span>
  <button id="b-outline" class="solo on">Outlines</button>
  <button id="b-shadow" class="solo on">Shadows</button>
  <span id="stats"></span>
</div>

<div id="bottom" class="bar">
  <span id="name"></span>
  <span id="count" class="play-only"></span>
  <span id="tell" class="play-only"></span>
  <button id="b-opts" class="solo play-only">Options</button>
  <div class="play-only" id="opts">
    <select id="sel-batter" title="Batter"><option value="">Random batter</option></select>
    <select id="sel-pitcher" title="Pitcher"><option value="">Random pitcher</option></select>
    <select id="sel-hand" title="Bats"><option value="auto">Bats: auto</option><option value="R">Bats: right</option><option value="L">Bats: left</option></select>
    <select id="sel-cam" title="Camera"><option value="plate">Camera: plate</option><option value="wide">Camera: wide</option></select>
    <button id="b-bunt" class="solo">Bunt</button>
    <button id="b-newteam" class="solo">New teams</button>
  </div>
  <div id="hint" class="play-only">Aim the green ring at the pitch (mouse, finger or arrow keys). Tap, click or Space swings. B bunts.</div>
  <div class="cast-only" style="display:flex;gap:6px;align-items:center;justify-content:center;width:100%">
    <button id="b-prev" class="solo">Prev</button><button id="b-next" class="solo">Next</button>
  </div>
  <div id="anims" class="cast-only"></div>
</div>

<script type="module" src="main.js?v=1"></script>
</body>
</html>
