<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#080b14;color:#eef2f9;
    font-family:'Inter',system-ui,sans-serif;position:relative;
    background-image:
      radial-gradient(900px 540px at 50% -12%, rgba(59,130,246,.20), transparent 70%),
      radial-gradient(760px 470px at 100% 110%, rgba(239,68,68,.16), transparent 70%);}
  .lines{position:absolute;inset:0;
    background-image:repeating-linear-gradient(90deg,
      rgba(255,255,255,.05) 0 1px, transparent 1px 100px);}
  .wrap{position:relative;height:100%;display:flex;flex-direction:column;
    justify-content:center;padding:0 74px 46px}
  .challenged{font-family:'Anton',Impact,sans-serif;font-weight:400;
    text-transform:uppercase;font-size:118px;line-height:.88;letter-spacing:.01em;
    background:linear-gradient(135deg,#f05252 0%,#b91c1c 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .subtitle{font-family:'Anton',Impact,sans-serif;font-weight:400;
    text-transform:uppercase;font-size:56px;line-height:1;letter-spacing:.06em;
    color:#eef2f9;margin-top:18px}
  p{font-size:27px;line-height:1.34;color:#94a3b8;margin-top:24px;max-width:720px}
  .slots{display:flex;gap:11px;margin-top:30px}
  .slot{font-family:'Anton',sans-serif;font-weight:400;font-size:24px;
    letter-spacing:.1em;padding:11px 18px;border-radius:10px;color:#fff;
    box-shadow:0 10px 26px -10px rgba(0,0,0,.8)}
  .qb{background:linear-gradient(180deg,#ff0a3b,#a3072a)}
  .rb{background:linear-gradient(180deg,#33e66e,#178943)}
  .wr{background:linear-gradient(180deg,#2aa5ff,#0b5fa8)}
  .te{background:linear-gradient(180deg,#ffab1f,#a35f00)}
  .fx{background:linear-gradient(180deg,#c74dff,#7c1bab)}
  .url{position:absolute;right:74px;bottom:52px;text-align:right;
    font-family:'Anton',sans-serif;font-weight:400;font-size:31px;
    letter-spacing:.14em;color:#64748b}
  .url b{color:#eef2f9}
  .url b i{color:#ef4444;font-style:normal}
  .mark{position:absolute;right:70px;top:64px;width:214px;height:214px;display:block}
</style></head>
<body>
  <div class="lines"></div>
  <div class="wrap">
    <img class="mark" src="/football/logo.png" alt="">
    <div class="challenged">You've Been<br>Challenged</div>
    <div class="subtitle">The Perfect Season</div>
    <p>Can you draft a better team? Accept the challenge and find out.</p>
    <div class="slots">
      <span class="slot qb">QB</span><span class="slot rb">RB</span>
      <span class="slot wr">WR</span><span class="slot wr">WR</span>
      <span class="slot te">TE</span><span class="slot fx">FLEX</span>
    </div>
  </div>
  <div class="url"><b>RUNTHE<i>.GG</i></b>/FOOTBALL</div>
</body></html>
