<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RunTheHouse</title>
<meta name="description" content="A social strategy elimination sim. Sixteen players, one prize, and fifteen opponents who form their own opinions of you.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f7f3ea">
<meta http-equiv="cache-control" content="no-cache, must-revalidate">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f7f3ea'/%3E%3Crect x='6' y='9' width='20' height='14' fill='none' stroke='%231c56c2' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%231c56c2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── RunTheHouse. Casting file paperwork on a producer's desk: cream stock,
   white cards, blue ink, a red stamp for the one thing that is final.
   GDD §17.

   LIGHT, and readable. The first build was a dark surveillance monitor set in
   condensed uppercase display type over letter-spaced mono body copy, which
   looked like the reference and was genuinely tiring to read a sentence in.
   Everything below is the same design idea rendered on paper instead of glass.

   ONE aggressive accent, --signal, reserved for eviction and betrayal. If it
   starts appearing on buttons, the design has drifted. Blue is the brand and
   the primary action; it is allowed everywhere. */
:root{
  /* surfaces */
  --cream:#f7f3ea;          /* the page, warm paper stock */
  --panel:#ffffff;          /* cards and panels, white on cream */
  --panel2:#f2eee4;         /* alternating rows, the shade below white */
  --line:#ddd5c5;           /* a ruled line on that stock */
  --line2:#eae4d7;          /* a fainter one */
  /* type */
  --ink:#17222f;            /* body copy, blue-black rather than pure black */
  --paper:#0f1a26;          /* headings, one step darker for weight */
  --chalk:#2b3846;          /* the default reading colour */
  --dim:#5d6b7a;
  --dimmer:#8e9aa7;
  /* brand */
  --blue:#1c56c2;
  --blue-deep:#123c8c;
  --blue-soft:#e7eefb;
  --blue-line:#b9cbef;
  /* meaning */
  --signal:#c0392b;         /* eviction, betrayal, and nothing else */
  --signal-dim:#e6c4bf;
  --signal-soft:#fbecea;
  --ok:#1f7a4d;             /* saved, landed, survived */
  --hand:#a8762b;           /* powers and secrets, the one warm note left */
  --tile:132px;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --disp:'Archivo','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--cream);color:var(--chalk);
  font-family:var(--body);font-size:15.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
/* Display type is no longer uppercase by default. Uppercase belongs to labels
   that are two words long, not to sentences somebody has to read. */
h1,h2,h3{font-family:var(--disp);font-weight:600;letter-spacing:-.01em;
  margin:0;color:var(--paper)}

/* The paper grain, which is what the scanlines became. Barely there. */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(180deg,rgba(23,34,47,.014) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply}

/*
 * THE SHELL IS A FIXED FRAME, NOT A LONG PAGE.
 *
 * Playtest: "I like on BitLife how the main feed, the most recent is always
 * right there without the need to scroll. You can scroll up to see the history
 * but the latest should always be in the user's face."
 *
 * Exactly right, and the old shell could not do it: the log had no height, so
 * the page grew all season and the newest line ended up below the fold under a
 * pile of bars and panels. Now the frame is the viewport. Header block at the
 * top, dock at the bottom, and the log takes whatever is left and is always
 * scrolled to its end, so the last thing that happened sits just above the
 * button that makes the next thing happen.
 */
#app{max-width:1180px;margin:0 auto;padding:0 16px;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden}
#app.scroll{height:auto;min-height:100dvh;overflow:visible;padding-bottom:152px;display:block}
.head{flex:none}
.logwrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin-bottom:4px}
.logwrap .log{flex:1 1 auto;min-height:0;overflow-y:auto;margin-bottom:0}
/* Space for the dock, which is fixed over the bottom of the frame. */
.dockpad{flex:none;height:118px}

/* ── chrome ─────────────────────────────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--cream) 78%,rgba(247,243,234,0));
  padding:14px 0 12px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);margin-bottom:20px}
.topbar .wk{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:-.01em;color:var(--paper)}
.topbar .ph{color:var(--dim);text-transform:uppercase;letter-spacing:.16em;font-size:11px}
.topbar .sp{margin-left:auto;display:flex;gap:14px;align-items:baseline}
.meta{color:var(--dimmer);font-size:11px;letter-spacing:.1em;text-transform:uppercase}

/* ── the house wall: a bank of cameras, not a dashboard of cards ────────── */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:2px;
  background:var(--line);border:1px solid var(--line);margin-bottom:22px}
.cell{background:var(--panel);position:relative;padding:8px 8px 9px;
  display:flex;flex-direction:column;gap:5px;min-height:170px;
  transition:background .18s}
.cell.sel{background:var(--panel2);outline:1px solid var(--hand);outline-offset:-1px}
.cell.gone{opacity:.28;filter:grayscale(1)}
.cell.risk{background:linear-gradient(180deg,var(--panel) 60%,var(--signal-soft))}
.cell.you{outline:1px solid var(--paper);outline-offset:-1px}
.cell button.pick{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.cam{aspect-ratio:1/1;background:var(--panel2);border:1px solid var(--line);overflow:hidden;position:relative}
.cam img.pxa,.cam svg{display:block;width:100%;height:100%}
/* Never resample. The whole point of drawing at 32 square is that it stays at
   32 square and the browser only decides how big each of those pixels is. */
.pxa{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.cam .rec{position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;
  background:var(--signal);opacity:.85}
.cell.gone .cam .rec{display:none}
.nm{font-family:var(--disp);font-size:14px;letter-spacing:.05em;color:var(--paper);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{font-size:11px;letter-spacing:.04em;line-height:1.3}
.lbl b{font-weight:400;display:block}
.lbl i{font-style:normal;color:var(--dimmer);font-size:10px;letter-spacing:.06em}
.t-bonded{color:#e4d9b8} .t-warm{color:#b6c3ae} .t-flat{color:var(--dim)}
.t-cool{color:#b08a80} .t-hostile{color:var(--signal)}
.pips{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.pip{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;padding:1px 4px;
  border:1px solid var(--dimmer);color:var(--dim)}
.pip.cap{border-color:var(--paper);color:var(--paper)}
.pip.risk{border-color:var(--signal);color:var(--signal)}
.pip.veto{border-color:var(--ok);color:var(--ok)}

/* ── the feed: chalk on slate ───────────────────────────────────────────── */
.feed{border:1px solid var(--line);background:var(--panel);padding:14px 16px;
  max-height:280px;overflow-y:auto;margin-bottom:20px;scroll-behavior:smooth}
.feed p{margin:0 0 9px;color:var(--chalk)}
.feed p:last-child{margin-bottom:0}
.feed .sys{color:var(--dim);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.feed .hot{color:var(--signal)}
.feed .quiet{color:var(--dimmer);font-style:italic}

/* ── actions ────────────────────────────────────────────────────────────── */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(247,243,234,.97);
  border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .inner{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .prompt{color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  margin-right:auto}
.btn{border:1px solid var(--dimmer);padding:8px 16px;font-family:var(--disp);font-size:14px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--chalk);transition:.15s}
.btn:hover{border-color:var(--paper);color:var(--paper);background:var(--blue-soft)}
.btn[disabled]{opacity:.3;pointer-events:none}
.btn.go{border-color:var(--paper);color:var(--paper)}
.btn.prime{background:var(--blue);border-color:var(--blue-deep);color:#fbfcff;
  border-bottom-width:2px;font-weight:600}
.btn.prime:hover{background:#2464d6;border-color:var(--blue-deep);color:#fff}
.btn.hot{border-color:var(--signal);color:var(--signal)}
.btn.hot:hover{background:var(--signal-soft);border-color:var(--signal)}
.btn.sm{padding:5px 10px;font-size:12px}

/* ── panels, forms, the file ────────────────────────────────────────────── */
.file{border:1px solid var(--line);background:var(--panel);padding:20px;margin-bottom:20px}
.file h2{font-size:17px;color:var(--paper);margin-bottom:4px}
.file .sub{color:var(--dim);font-size:13.5px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
/* Reading of the plan you are currently holding, above the wall. */
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 16px}
.tg{border:1px solid var(--line);padding:4px 9px;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);background:var(--panel)}
.tg.bad{border-color:var(--signal);color:var(--signal)}
.tg.good{border-color:#7f9a86;color:#7f9a86}
label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-bottom:5px}
input,select{font:inherit;background:var(--panel);border:1px solid var(--line);color:var(--paper);
  padding:8px 10px;min-width:0;width:100%}
input:focus,select:focus{outline:none;border-color:var(--hand)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.choice{border:1px solid var(--line);background:var(--panel2);padding:12px 14px;text-align:left;
  transition:.15s;width:100%}
.choice:hover{border-color:var(--hand)}
.choice.on{border-color:var(--paper);background:var(--blue-soft)}
.choice b{display:block;font-family:var(--disp);font-size:15px;letter-spacing:.06em;
  color:var(--paper);font-weight:400;text-transform:uppercase}
.choice span{color:var(--dim);font-size:12px}

/* ── the tree ───────────────────────────────────────────────────────────── */
.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.trunk h3{font-size:14px;color:var(--paper);margin-bottom:2px}
.trunk .blurb{color:var(--dimmer);font-size:11px;margin-bottom:10px;min-height:30px}
.branch{margin-bottom:10px}
.branch .bn{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  margin-bottom:4px}
.nodes{display:flex;gap:3px}
.node{flex:1;aspect-ratio:1/1;border:1px solid var(--line);background:var(--panel);
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dimmer);
  position:relative;transition:.15s}
.node.can{border-color:var(--dim);color:var(--chalk);cursor:pointer}
.node.can:hover{border-color:var(--paper);background:var(--blue-soft)}
.node.own{background:var(--hand);border-color:var(--hand);color:#14161a}
.node.locked{opacity:.4}

/* ── comps ──────────────────────────────────────────────────────────────── */
.stage{border:1px solid var(--line);background:var(--panel);padding:24px;margin-bottom:20px;
  text-align:center;min-height:300px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;user-select:none}
.stage h2{font-size:22px;color:var(--paper)}
.stage .blurb{color:var(--dim);font-size:13px;max-width:420px}
/* The stage centres its children, so they size to their content and a grid
   with a min track width will happily spill off both edges of the card. Any
   row of options inside the stage states its own width. */
.bastack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:460px}
.bastack .choice{text-align:center}
.padgrid{display:grid;grid-template-columns:repeat(3,72px);gap:6px}
.pad{aspect-ratio:1/1;border:1px solid var(--line);background:var(--panel);transition:.09s}
.pad.lit{background:var(--paper);border-color:var(--paper)}
.pad.hit{background:var(--hand);border-color:var(--hand)}
.rbox{width:min(420px,80vw);height:130px;border:1px solid var(--line);background:var(--panel);
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);
  font-size:20px;letter-spacing:.1em;color:var(--dim);transition:.06s}
.rbox.go{background:var(--ok);color:#0a0b0c;border-color:var(--ok)}
.rbox.bad{background:var(--signal-dim);color:var(--paper)}
/* Widths here are a share of the card, not of the window. The card is inset
   from both edges, so a viewport unit overruns it on a phone. */
.track{width:min(460px,100%);height:26px;border:1px solid var(--line);background:var(--panel);
  position:relative;overflow:hidden}
.track .zone{position:absolute;top:0;bottom:0;left:42%;width:16%;background:rgba(31,122,77,.14);
  border-left:1px solid var(--ok);border-right:1px solid var(--ok)}
.track .mk{position:absolute;top:2px;bottom:2px;width:4px;background:var(--paper)}
.holdpad{width:min(300px,100%);aspect-ratio:1/1;border:1px solid var(--dim);
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);
  font-size:16px;letter-spacing:.14em;color:var(--dim);background:var(--panel);transition:.12s}
.holdpad.on{border-color:var(--paper);color:var(--paper);background:#16191d}
.qbtns{display:flex;flex-direction:column;gap:8px;width:min(420px,100%)}
.meterwrap{width:min(460px,100%);height:5px;background:var(--panel);border:1px solid var(--line)}
.meter{height:100%;background:var(--hand);width:0%}

/* ── the new competitions ─────────────────────────────────────────────────── */
.ordrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:34px;margin:8px 0 14px}
.ordpick{border:1px solid var(--blue-line);background:var(--blue-soft);color:var(--blue-deep);
  padding:5px 10px;font-size:13px;font-weight:600}
.oddrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.oddface{width:86px;height:86px;border:2px solid var(--line);background:var(--panel2);
  overflow:hidden;padding:0;display:block}
.oddface img{display:block;width:100%;height:100%}
button.oddface.pick{cursor:pointer;transition:.12s}
button.oddface.pick:hover{border-color:var(--blue)}
.walkway{height:150px;display:flex;align-items:center;justify-content:center;margin:14px 0;
  border:1px solid var(--line);background:var(--panel);overflow:hidden}
.walker{animation:walk .5s linear}
@keyframes walk{from{transform:translateX(-90px);opacity:.2}to{transform:translateX(0);opacity:1}}
.walker img{display:block}

/* ── vote reveal, the one place the game slows down ─────────────────────── */
.tallywrap{display:flex;gap:34px;justify-content:center;margin:22px 0 8px;flex-wrap:wrap}
.tcol{text-align:center;min-width:132px}
.tface{width:96px;height:96px;margin:0 auto 8px;border:2px solid var(--line);background:var(--panel2);
  transition:border-color .3s}
.tface img.pxa,.tface svg{display:block;width:100%;height:100%}
.tcol.out .tface{box-shadow:0 0 0 4px rgba(192,57,43,.16)}
.tband{font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.tcol .who{font-family:var(--disp);font-size:17px;color:var(--paper);letter-spacing:.06em}
.marks{font-family:var(--disp);font-size:30px;letter-spacing:.14em;color:var(--chalk);
  min-height:44px;line-height:1.3;word-break:break-all}
.tcol.out .who{color:var(--signal)}
.tcol.out .marks{color:var(--signal)}

/* ── results ────────────────────────────────────────────────────────────── */
table.truth{width:100%;border-collapse:collapse;font-size:12px}
table.truth th{text-align:left;font-weight:400;color:var(--dim);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
table.truth td{padding:6px 8px;border-bottom:1px solid #1a1d21}
table.truth td.r{text-align:right;color:var(--dim)}
.wrong{color:var(--signal)}
.scroll{overflow-x:auto}

/* ── the scene: where you are, what it is about, three ways to answer ────── */
.scene{border:1px solid var(--line);background:var(--panel);padding:0;margin-bottom:20px;overflow:hidden}
.scene .where{padding:16px 20px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel2),transparent)}
.scene .where b{display:block;font-family:var(--disp);font-size:19px;letter-spacing:.04em;
  color:var(--hand);font-weight:400;text-transform:none}
.scene .said{padding:18px 20px;color:var(--paper);font-size:15px;line-height:1.65}
.opts{display:flex;flex-direction:column;gap:1px;background:var(--line)}
.opt{background:var(--panel2);padding:13px 18px;display:flex;gap:14px;align-items:flex-start;
  text-align:left;width:100%;transition:.14s;border-left:2px solid transparent}
.opt:hover{background:var(--blue-soft)}
.opt .key{font-family:var(--disp);font-size:17px;letter-spacing:.06em;color:var(--dim);
  min-width:16px;padding-top:1px}
.opt .txt{flex:1;color:var(--chalk)}
.opt .tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--dimmer);
  border:1px solid var(--dimmer);padding:1px 5px;white-space:nowrap;align-self:center}
.opt.safe{border-left-color:var(--ok)}
.opt.safe:hover .key{color:var(--ok)}
.opt.neutral{border-left-color:var(--dim)}
.opt.risky{border-left-color:var(--signal)}
.opt.risky:hover{background:var(--signal-soft)}
.opt.risky:hover .key{color:var(--signal)}
.opt.risky .tag{border-color:var(--signal-dim);color:var(--signal)}
.opt[disabled]{opacity:.32;pointer-events:none}

.energy{display:flex;align-items:center;gap:7px}
.pips-e{display:flex;gap:2px}
.pip-e{width:7px;height:13px;background:var(--hand);opacity:.9}
.pip-e.spent{background:transparent;border:1px solid var(--dimmer)}

/* ── powers ───────────────────────────────────────────────────────────────── */
.power{border:1px solid var(--hand);background:linear-gradient(180deg,rgba(168,118,43,.07),var(--panel));
  padding:18px 20px;margin-bottom:20px}
.power h2{color:var(--hand);font-size:18px}
.power .kind{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  margin-bottom:6px}
.power .long{color:var(--chalk);margin-top:8px;font-size:13px}
.power.hot{border-color:var(--signal);
  background:linear-gradient(180deg,var(--signal-soft),var(--panel))}
.power.hot h2{color:var(--signal)}
.holding{display:inline-block;border:1px solid var(--hand);color:var(--hand);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:1px 5px;margin-left:8px}

/* ── the recap: the chain, week by week ─────────────────────────────────── */
details.wk{border:1px solid var(--line);background:var(--panel);margin-bottom:2px}
details.wk>summary{padding:12px 18px;cursor:pointer;list-style:none;display:flex;gap:14px;
  align-items:baseline;transition:.14s}
details.wk>summary::-webkit-details-marker{display:none}
details.wk>summary:hover{background:var(--panel2)}
details.wk .no{font-family:var(--disp);font-size:15px;letter-spacing:.1em;color:var(--dim);min-width:64px}
details.wk .hl{color:var(--paper);flex:1}
details.wk .tags{display:flex;gap:4px}
details.wk .body{padding:4px 18px 16px 96px;border-top:1px solid var(--line)}
details.wk .body p{margin:0 0 6px;color:var(--chalk)}
details.wk .body p.b{color:var(--dim)}
details.wk .body p.pw{color:var(--hand)}
details.wk .body p.v{padding-left:12px;border-left:1px solid var(--line)}
details.wk .body p.v.broke{border-left-color:var(--signal)}
details.wk .body p.v.you{color:var(--paper);border-left-color:var(--paper)}
details.wk .body h4{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dimmer);margin:14px 0 6px}
.chain{border:1px solid var(--signal-dim);background:linear-gradient(180deg,var(--signal-soft),var(--panel));
  padding:20px;margin-bottom:20px}
.chain h2{color:var(--signal)}
.chain p{margin:0 0 8px;color:var(--chalk)}
.chain p.big{color:var(--paper);font-size:15px}
.chain p.good{color:var(--ok)}
.chain small{display:block;color:var(--dimmer)}
.tl{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line)}
.tl .a{background:var(--panel2);padding:8px 14px;display:flex;gap:12px;align-items:baseline;font-size:12px}
.tl .a b{font-weight:400;color:var(--paper);flex:1}
.tl .a.mine{background:var(--blue-soft);border-left:2px solid var(--hand)}
.tl .a i{font-style:normal;color:var(--dimmer);font-size:11px}

/* ── the visual language, see ui.js ─────────────────────────────────────── */
.ic{display:inline-block;vertical-align:-2px;flex:none}

/* phase rail: where you are in the week and how far the vote is */
.rail{display:flex;gap:2px;margin:10px 0 4px;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rl{flex:1 1 0;min-width:38px;display:flex;flex-direction:column;gap:4px;align-items:center}
.rl i{display:block;width:100%;height:3px;background:var(--line)}
.rl b{font-family:var(--disp);font-weight:600;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dimmer);white-space:nowrap}
.rl.done i{background:var(--dimmer)}
.rl.done b{color:var(--dim)}
.rl.now i{background:var(--hand);height:5px;margin-top:-1px}
.rl.now b{color:var(--paper)}
.railnote{color:var(--dim);font-size:11px;letter-spacing:.06em;margin-bottom:14px}

/* relationship ladder: seven rungs, one lit */
.ldr{display:inline-flex;gap:2px;align-items:flex-end;height:16px}
.ldr i.on{box-shadow:none;border-radius:1px}
.ldr i{display:block;width:6px;height:5px;background:#d8d0c0}
.ldr i.on{height:16px;box-shadow:0 0 6px currentColor}

.bbar{display:inline-block;height:4px;background:var(--line2);vertical-align:middle}
.bbar>span{display:block;height:100%}

/* legend */
.legend{border:1px solid var(--line);background:var(--panel);padding:10px 14px;margin-bottom:16px}
.lgrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lgrow+.lgrow{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim)}
.lg i{width:14px;height:8px;display:block}
.dimrow .lg{color:var(--dimmer)}

/* the wall, rebuilt around the colour language */
.wall{gap:2px}
.cell{border-left:4px solid transparent;padding-left:8px}
.cell .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.cell .marks{display:flex;gap:6px;align-items:center;color:var(--dim);flex-wrap:wrap;min-height:20px}
.cell .marks .ic{opacity:.9}
.m-cap{color:var(--paper)} .m-risk{color:var(--signal)} .m-veto{color:var(--ok)}
.m-rat{color:#9a7f5a} .m-ally{color:var(--hand)} .m-seen{color:var(--dim)}
.m-threat{color:#c8724f} .m-stale{color:var(--dimmer)} .m-power{color:var(--hand)}
.cell .band{font-size:11px;letter-spacing:.04em}
/* The band as a filled chip, not four pixels of border. A wall of sixteen has
   to be readable in one sweep. */
.cell{border-left-width:6px}
.cell .band{display:inline-block;padding:2px 7px;border-radius:2px;font-weight:600;
  font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.prow .n span{display:inline-block;padding:1px 6px;border-radius:2px;font-weight:600;
  font-size:10px;letter-spacing:.07em;text-transform:uppercase;margin-top:2px}
.prow{border-left-width:5px}
.cell .fresh{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dimmer)}

.sorts{display:flex;gap:0;margin-bottom:10px;border:1px solid var(--line);width:fit-content}
.sorts button{padding:5px 12px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);border-right:1px solid var(--line)}
.sorts button:last-child{border-right:none}
.sorts button.on{background:var(--panel2);color:var(--paper)}

/* alliance map */
.amap{width:100%;max-width:520px;display:block;margin:0 auto}
.mapnote{color:var(--dim);font-size:11px;text-align:center;margin-top:8px}

/* week strip */
.strip{display:flex;gap:2px;margin-bottom:16px;background:var(--line);border:1px solid var(--line);
  flex-wrap:wrap}
.ws{flex:1 1 150px;background:var(--panel);padding:8px 12px;display:flex;flex-direction:column;gap:3px}
.wsl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer);
  display:flex;align-items:center;gap:5px}
.wsv{font-family:var(--disp);font-size:15px;letter-spacing:.04em;color:var(--paper)}
.wsv.dim{color:var(--dimmer);font-size:13px}
.ws.c-cap .wsl{color:var(--paper)} .ws.c-risk .wsl{color:var(--signal)}
.ws.c-risk .wsv{color:var(--signal)} .ws.c-veto .wsl{color:var(--ok)}

/* feed, colour coded by what kind of thing happened */
.feed p{display:flex;gap:8px;align-items:flex-start}
.feed p .ic{margin-top:2px;flex:none;opacity:.85}
.feed p.ev-power{color:var(--hand)}
.feed p.ev-vote{color:var(--paper)}
.feed p.ev-bad{color:var(--signal)}
.feed p.ev-good{color:var(--ok)}

/* ── the shell ────────────────────────────────────────────────────────────
 *
 * Borrowed in SHAPE from BitLife, deliberately not in skin. What makes that
 * interface legible to millions of people who never read a tutorial is three
 * structural rules, none of which cost us our own look:
 *
 *   1. The thing that advances time is always in the same place, always the
 *      same colour, and always says what it is about to do.
 *   2. There is never more than one decision on screen. Everything else is
 *      either history you can scroll or a panel you chose to open.
 *   3. Every beat arrives as a card: who it is about, a title, two sentences,
 *      and its choices stacked full width and thumb sized.
 *
 * So: one green button, one log, one card at a time. The palette, the voice
 * and the pixel avatars stay exactly as they were.
 */
/* The primary action was green because the reference game's is. With the
   brand named as cream and blue, blue IS the go colour, and the interface is
   down one accent it did not need. Green survives only as an OUTCOME: saved,
   landed, survived. */
:root{ --go:var(--blue); --go-hi:#2464d6; --go-dark:var(--blue-deep); }

/* the log, which is now the main surface rather than a box under the fold */
.log{border:1px solid var(--line);background:var(--panel);padding:4px 0 10px;margin-bottom:16px}
.log .wkh{font-family:var(--disp);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--hand);padding:14px 16px 6px;border-top:1px solid var(--line);margin-top:8px}
.log .wkh:first-child{border-top:none;margin-top:0;padding-top:12px}
.log p{margin:0;padding:3px 16px;display:flex;gap:9px;align-items:flex-start}
.log p .ic{margin-top:3px;flex:none;opacity:.85}
.log p.ev-power{color:var(--hand)} .log p.ev-vote{color:var(--paper)}
.log p.ev-bad{color:var(--signal)} .log p.ev-good{color:var(--ok)}
.log p.quiet{color:var(--dimmer);font-style:italic}
.log p.hot{color:var(--signal)}
.log p.sys{display:none}

/* who you are, pinned at the top the way a life sim pins your name */
.idbar{display:flex;gap:12px;align-items:center;border:1px solid var(--line);
  background:var(--panel);padding:10px 14px;margin-bottom:14px}
.idbar .av{width:44px;height:44px;border:1px solid var(--blue-line);background:var(--panel2);flex:none;overflow:hidden}
.idbar .av img{width:100%;height:100%;display:block}
.idbar .who{min-width:0;flex:1}
.idbar .who b{display:block;font-family:var(--disp);font-weight:600;font-size:17px;
  letter-spacing:.06em;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idbar .who span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.idbar .rt{text-align:right;flex:none}
.idbar .rt b{display:block;font-family:var(--disp);font-weight:600;font-size:17px;color:var(--paper)}
.idbar .rt span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--dimmer)}

/* four bars that say how your game is going, no numbers on any of them */
.sbars{border:1px solid var(--line);background:var(--panel);padding:9px 14px;margin-bottom:14px}
/* A single line saying what you have spent the week on. */
.yw{border:1px solid var(--line);border-left:3px solid var(--blue);background:var(--panel);
  padding:9px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.yw b{font-family:var(--disp);font-weight:600;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--blue);flex:none}
.yw span{color:var(--chalk);font-size:13.5px}
/* Three names and a colour each: who is with you, who is not, and who you are
   about to lose by not talking to them. */
.stand{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 14px}
.st{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:var(--panel);padding:5px 10px;font-size:12.5px;color:var(--paper)}
.st i{width:9px;height:9px;flex:none;border-radius:1px}
.st b{font-weight:600;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim)}
.sb{display:flex;align-items:center;gap:10px;padding:3px 0}
.sb i{font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);width:78px;flex:none}
.sb u{text-decoration:none;flex:1;height:9px;background:var(--line2);display:block;position:relative}
.sb u>span{display:block;height:100%}
.sb em{font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dimmer);width:76px;text-align:right;flex:none}

/* ── the dock: nav on top, the one green button underneath ───────────────── */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:linear-gradient(180deg,rgba(247,243,234,0),rgba(247,243,234,.97) 22%);
  padding:18px 16px calc(10px + env(safe-area-inset-bottom))}
.dock .inner{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.nav{display:flex;gap:1px;background:var(--line);border:1px solid var(--line)}
.nav button{flex:1 1 0;background:var(--panel);padding:7px 4px 6px;display:flex;
  flex-direction:column;gap:3px;align-items:center;color:var(--dim);
  font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;transition:.14s}
.nav button:hover{background:var(--panel2);color:var(--paper)}
.nav button .ic{opacity:.8}
.nav button.on{background:var(--panel2);color:var(--paper)}
.nav button.on .ic{opacity:1}
.nav button[disabled]{opacity:.3;pointer-events:none}

.gobtn{width:100%;background:var(--go);color:#fbfcff;border:none;border-bottom:3px solid var(--go-dark);
  padding:15px 18px 14px;font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.12em;
  text-transform:uppercase;transition:.12s;display:flex;align-items:center;justify-content:center;gap:10px}
.gobtn:hover{background:var(--go-hi)}
.gobtn:active{transform:translateY(2px);border-bottom-width:1px}
.gobtn[disabled]{opacity:.4;pointer-events:none}
.gobtn small{font-family:var(--body);font-size:10px;letter-spacing:.14em;opacity:.72;
  text-transform:uppercase}
/* the one place the accent is allowed on a button: sending somebody home */
.gobtn.risk{background:var(--signal);border-bottom-color:#7c2b21;color:#fff2ef}
.gobtn.risk:hover{background:#e04b36}
.gobtn.quiet{background:var(--panel2);color:var(--chalk);border:1px solid var(--dimmer);
  border-bottom:3px solid var(--line);font-size:15px}
.gobtn.quiet:hover{background:var(--blue-soft);color:var(--paper)}
.dockrow{display:flex;gap:8px}
.dockrow .gobtn{flex:1}
/* The secondary action is a way out, not an equal choice, so it does not get
   half the dock. */
.dockrow .gobtn.quiet{flex:0 0 34%}

/* ── the card: one beat, one decision, never two ─────────────────────────── */
body.carded .dock,body.carded .bar{display:none}
/*
 * A card can never be taller than the screen it is on.
 *
 * Playtest: "you click talk to and it goes blank." The card was 800px tall
 * against an 844px test viewport, which fits; a real phone loses ninety pixels
 * to the address bar and eighty to the toolbar, so the card overflowed, and a
 * centred item in a scrolling flex container has its overflow pushed ABOVE the
 * scroll origin where it cannot be reached. The header goes off the top of the
 * world and what is left reads as blank.
 *
 * So it anchors to the bottom, which is also where thumbs are, and every part
 * of it that can shrink does.
 */
.sheet{position:fixed;inset:0;z-index:70;background:rgba(23,34,47,.55);
  display:flex;align-items:flex-end;justify-content:center;padding:12px;
  animation:fade .16s ease-out;overflow:hidden}
@media (min-width:721px){ .sheet{align-items:center;padding:16px} }
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line2);
  box-shadow:0 20px 50px rgba(23,34,47,.28),0 2px 6px rgba(23,34,47,.12);
  animation:pop .2s cubic-bezier(.2,.9,.3,1.1);
  max-height:calc(100dvh - 24px);display:flex;flex-direction:column;margin:0}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.card .ch{display:flex;align-items:center;gap:10px;padding:9px 16px;
  background:linear-gradient(90deg,transparent,rgba(28,86,194,.13));
  border-bottom:1px solid var(--line)}
.card .ch .av{width:34px;height:34px;border:1px solid var(--blue-line);background:var(--panel2);flex:none;overflow:hidden}
.card .ch .av img{width:100%;height:100%;display:block}
.card .ch .k{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--chalk);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ch .r{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--paper);flex:none}
.card.t-bad .ch{background:linear-gradient(90deg,transparent,rgba(192,57,43,.16))}
.card.t-bad .ch .r{color:var(--signal)}
.card.t-good .ch{background:linear-gradient(90deg,transparent,rgba(31,122,77,.15))}
.card.t-good .ch .r{color:var(--ok)}
.card.t-power .ch{background:linear-gradient(90deg,transparent,rgba(168,118,43,.17))}
.cbody{padding:18px 20px 4px;overflow-y:auto;flex:1 1 auto;min-height:0;text-align:center;
  display:flex;flex-direction:column}
.cbody h2{font-size:22px;color:var(--paper);line-height:1.2;margin-bottom:12px;
  display:flex;gap:10px;align-items:center;justify-content:center;text-align:center}
.cbody h2 .ic{flex:none}
.cbody p{margin:0 0 12px;color:var(--chalk);font-size:15px;line-height:1.62}
.cbody p.q{color:var(--paper);font-size:15px}
.cbody p.d{color:var(--dim);font-size:13.5px}
.cbody .rows{border:1px solid var(--line);margin:4px 0 14px;text-align:left}
.cbody .rows div{padding:9px 13px;border-top:1px solid var(--line);font-size:13.5px;color:var(--chalk)}
.cbody .rows div:first-child{border-top:none}
.cbody .rows div:nth-child(odd){background:var(--panel2)}
.cbody .rows b{font-weight:400;color:var(--dim);letter-spacing:.1em;
  font-size:10px;text-transform:uppercase;display:block}
.cbody .faces{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:2px 0 16px}
.cbody .sbars{margin:0 0 14px;border-color:var(--line)}

.choices{padding:6px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:none}
.chb{width:100%;background:var(--panel2);border:1px solid var(--dimmer);border-bottom-width:2px;
  padding:13px 15px;display:flex;gap:12px;align-items:center;text-align:left;transition:.13s}
.chb:hover{background:var(--blue-soft);border-color:var(--paper)}
.chb:active{transform:translateY(1px)}
.chb .key{font-family:var(--disp);font-size:16px;letter-spacing:.06em;color:var(--dim);
  width:15px;flex:none}
.chb .txt{flex:1;color:var(--paper);font-size:15px;line-height:1.42;font-weight:500}
.chb .txt small{display:block;color:var(--dim);font-size:12.5px;font-family:var(--body);
  line-height:1.45;margin-top:3px}
.chb .tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--dimmer);
  border:1px solid var(--dimmer);padding:2px 6px;white-space:nowrap;flex:none}
.chb.safe{border-left:3px solid var(--ok)}
.chb.safe:hover .key{color:var(--ok)}
.chb.neutral{border-left:3px solid var(--dim)}
.chb.risky{border-left:3px solid var(--signal)}
.chb.risky:hover{background:var(--signal-soft)}
.chb.risky:hover .key{color:var(--signal)}
.chb.risky .tag{border-color:var(--signal-dim);color:var(--signal)}
.chb.go{background:var(--go);border-color:var(--go-dark);border-bottom-color:var(--go-dark);
  justify-content:center}
.chb.go .txt{color:#fbfcff;font-family:var(--disp);letter-spacing:.12em;text-transform:uppercase;
  flex:none;font-size:16px}
.chb.go:hover{background:var(--go-hi);border-color:var(--go-dark)}
.chb.hot{border-color:var(--signal-dim)}
.chb.hot:hover{background:var(--signal-soft);border-color:var(--signal)}
.chb.hot .txt{color:var(--signal)}
.chb[disabled]{opacity:.32;pointer-events:none}
.cfoot{padding:0 14px 14px;text-align:center;flex:none}
.cfoot button{font-size:12px;letter-spacing:.1em;color:var(--dim);text-decoration:underline;
  text-underline-offset:3px}
.cfoot button:hover{color:var(--paper)}

/* picking a person, as a list rather than a sixteen tile grid. On a phone the
   grid was four rows of scrolling before you could see everybody's name. */
.plist{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border:1px solid var(--line);margin:0 0 14px;overflow-y:auto;
  flex:1 1 auto;min-height:120px}
.prow{background:var(--panel2);padding:8px 12px;display:flex;gap:11px;align-items:center;
  text-align:left;width:100%;transition:.12s;border-left:3px solid transparent}
.prow:hover{background:var(--blue-soft)}
.prow .av{width:42px;height:42px;border:1px solid var(--blue-line);background:var(--panel2);flex:none;overflow:hidden}
.prow .av img{width:100%;height:100%;display:block}
.prow .n{flex:1;min-width:0}
.prow .n b{display:block;font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.05em;
  color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .n span{font-size:10px;letter-spacing:.09em}
.prow .mk{display:flex;gap:6px;align-items:center;color:var(--dim);flex:none}
.prow.sel{background:var(--blue-soft);border-left-color:var(--hand)}
.prow.sel .n b{color:var(--hand)}
.prow.block{border-left-color:var(--signal)}
.prow.you{opacity:.45;pointer-events:none}
.prow[disabled]{opacity:.34;pointer-events:none}

/* a panel opened from the nav, closed with the same button */
.panel{border:1px solid var(--line);background:var(--panel);padding:16px;margin-bottom:16px}
/* A rule between sections of a page opened from the nav. */
.pagehr{height:1px;background:var(--line);margin:22px 0 16px}
/* The same row list, on a PAGE rather than in a card. Every rule for .rows was
   scoped to .cbody, so the pages that use the class rendered an unstyled run of
   divs with the bold label and its value collided on one line. */
#app.scroll .rows{border:1px solid var(--line);margin:4px 0 14px;text-align:left;
  background:var(--panel)}
#app.scroll .rows div{padding:10px 13px;border-top:1px solid var(--line);
  font-size:13.5px;color:var(--chalk)}
#app.scroll .rows div:first-child{border-top:none}
#app.scroll .rows div:nth-child(odd){background:var(--panel2)}
#app.scroll .rows b{display:block;font-weight:600;color:var(--paper);
  font-size:13.5px;letter-spacing:0;margin-bottom:2px}
#app.scroll h3{font-size:15px;margin-bottom:4px}
.panel h3{font-size:14px;color:var(--paper);margin-bottom:4px}
.panel .sub{color:var(--dim);font-size:13.5px;margin-bottom:14px}

@media (max-width:560px){
  /*
   * THE HEADER HAS TO EARN ITS PIXELS.
   *
   * Measured on a 664px viewport, which is what an iPhone actually gives a page
   * once Safari has taken its chrome: the header was 430 of them and the log
   * got sixteen. Everything below is the same information, tighter, and two
   * things are dropped outright because they are furniture rather than facts:
   * the seed, and the sentence under the rail describing the phase the rail is
   * already naming.
   */
  .topbar{padding:9px 0 8px;margin-bottom:10px;gap:8px;align-items:center}
  .topbar .wk{font-size:19px}
  .topbar .sp{gap:8px}
  .topbar .sp .meta:last-child{display:none}
  .railnote{display:none}
  .rail{margin:6px 0 2px}
  .strip{margin-bottom:10px;flex-wrap:nowrap}
  .ws{flex:1 1 0;min-width:0;padding:6px 8px}
  .wsv{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .idbar{padding:7px 10px;margin-bottom:10px;gap:9px}
  .idbar .av{width:36px;height:36px}
  .yw{padding:7px 11px;margin-bottom:10px}
  /* The head does not shrink and the log takes the rest. Asking the log for a
     third of the screen instead squeezed the head to nothing and the feed
     started at the top of a blank frame. */
  .dockpad{height:104px}
  /* Twelve phase labels do not fit across a phone, so the rail scrolls. It has
     to be given room to scroll INTO, or the labels just overlap each other. */
  .rl{min-width:58px;padding:0 3px}
  .cbody h2{font-size:19px}
  .idbar .who b{font-size:15px}
  /* Side by side, the note turned the button into a hundred pixel block of
     wrapped text. Stacked, it reads as a subtitle, which is what it is. */
  .gobtn{font-size:16px;padding:12px 10px 11px;flex-direction:column;gap:2px}
  .gobtn small{font-size:9px;letter-spacing:.1em}
  .dockrow .gobtn.quiet{flex:0 0 32%;font-size:13px}
  .sb i{width:64px} .sb em{width:62px;font-size:9px}
}

/* ── moments: the beats that must not scroll past ────────────────────────── */
.moment{border:1px solid var(--line);background:var(--panel);padding:0;margin-bottom:20px;
  overflow:hidden;animation:mo .28s ease-out}
@keyframes mo{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.moment .mh{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;
  align-items:center;background:linear-gradient(180deg,var(--panel2),transparent)}
.moment .mh b{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim)}
.moment h2{font-size:21px;color:var(--paper);padding:18px 20px 4px}
.moment .msub{padding:0 20px 16px;color:var(--dim);font-size:13px}
.moment .faces{display:flex;gap:14px;flex-wrap:wrap;padding:0 20px 18px}
.mface{text-align:center;width:88px}
.mface .fr{width:88px;height:88px;border:2px solid var(--blue-line);background:var(--panel2);overflow:hidden}
.mface .fr img{display:block;width:100%;height:100%}
.mface .fn{font-family:var(--disp);font-size:13px;letter-spacing:.04em;color:var(--paper);
  margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mface .ft{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;color:var(--dimmer)}
.moment.t-bad .mh{background:linear-gradient(180deg,var(--signal-soft),transparent)}
.moment.t-bad{border-color:var(--signal-dim)}
.moment.t-bad .mh b{color:var(--signal)}
.moment.t-good .mh{background:linear-gradient(180deg,rgba(31,122,77,.12),transparent)}
.moment.t-good .mh b{color:var(--ok)}
.moment.t-power .mh{background:linear-gradient(180deg,rgba(168,118,43,.12),transparent)}
.moment.t-power{border-color:var(--hand)}
.moment.t-power .mh b{color:var(--hand)}

.gread{border-left:3px solid var(--dimmer);padding:8px 14px;margin-top:14px;
  background:var(--panel2);color:var(--dim);font-size:13px}
.gread.good{border-left-color:var(--ok);color:var(--chalk)}

.hide{display:none !important}
@media(max-width:720px){
  :root{--tile:104px}
  /* Bottom padding belongs to the SCROLLING screens only. On the fixed frame
     it is subtracted from the height, and 186 of 664 pixels is why the log
     would not grow: the children were already filling the content box. */
  #app{padding:0 10px}
  #app.scroll{padding:0 10px 186px}
  .tree{grid-template-columns:1fr}
  .topbar .wk{font-size:21px}
  .cell{min-height:150px}
  .padgrid{grid-template-columns:repeat(3,60px)}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="bar hide" id="bar"><div class="inner" id="barinner"></div></div>
<div id="sheet"></div>

<!-- Version stamped on every module.
     A playtest screenshot came back showing options tagged SAFE, EVEN and RISKY
     three deploys after those tags were deleted: the phone was holding a cached
     copy. Worse than a stale page is a MIXED one, where a fresh index.html
     drives a cached scenes.js, so the query has to be on every module and has
     to move on every deploy. Bump BUILD below and they all miss at once. -->
<!-- strings.js first: it depends on nothing, and engine.js reads the alliance
     name bank out of it. A bank the lint checks beats a bank in the model. -->
<script src="strings.js?v=14"></script>
<script src="rng.js?v=14"></script>
<script src="tree.js?v=14"></script>
<script src="generate.js?v=14"></script>
<script src="engine.js?v=14"></script>
<script src="secrets.js?v=14"></script>
<script src="comps.js?v=14"></script>
<script src="powers.js?v=14"></script>
<script src="scenes.js?v=14"></script>
<script src="run.js?v=14"></script>
<script src="recap.js?v=14"></script>
<script src="avatar.js?v=14"></script>
<script src="ui.js?v=14"></script>

<script>
(function(){
'use strict';
var RNG=window.RH_RNG, T=window.RH_TREE, G=window.RH_GEN, E=window.RH_ENGINE,
    C=window.RH_COMPS, R=window.RH_RUN, STR=window.RH_STRINGS,
    PW=window.RH_POWERS, SC=window.RH_SCENES, RC=window.RH_RECAP, U=window.RH_UI, AV=window.RH_AVATAR,
    SEC=window.RH_SECRETS;

/*
 * The palette, once, in JavaScript.
 *
 * Face tags, stat bars and the vote reveal all needed colours, and they were
 * each typed as a raw hex at the call site. Retheming meant finding nineteen of
 * them. These mirror the custom properties in :root by hand, because inline
 * style attributes cannot read a variable that has not been resolved yet, and
 * a getComputedStyle round trip per avatar is not worth it.
 */
var COL={
  ink:'#17222f', dim:'#5d6b7a',
  blue:'#1c56c2', blueDeep:'#123c8c',
  signal:'#c0392b',   /* eviction and betrayal, GDD §17 */
  ok:'#1f7a4d',       /* saved, landed, survived */
  hand:'#a8762b'      /* powers and secrets */
};

var app=document.getElementById('app');
var bar=document.getElementById('bar');
var barin=document.getElementById('barinner');
var sheet=document.getElementById('sheet');

var SAVE='rh_run_v1', ACCT='rh_account_v1';
var s=null, account=null, screen='title';

// ── account ────────────────────────────────────────────────────────────────
function loadAccount(){
  try{ var a=JSON.parse(localStorage.getItem(ACCT)); if(a&&a.owned) return a; }catch(e){}
  return {name:'',gender:'x',hometown:'',region:'',owned:[],xp:0,
          career:{runs:0,wins:0,panels:0,bestPlace:null,placeSum:0}};
}
function saveAccount(){ try{ localStorage.setItem(ACCT,JSON.stringify(account)); }catch(e){} }
function level(){ return T.levelForXp(account.xp||0); }
function tokensTotal(){ return T.tokensForLevel(level()); }
function tokensSpent(){ return T.spend(new Set(account.owned)); }
function tokensLeft(){ return tokensTotal()-tokensSpent(); }

function saveRun(){ try{ localStorage.setItem(SAVE,JSON.stringify(R.serialise(s))); }catch(e){} }
function clearRun(){ try{ localStorage.removeItem(SAVE); }catch(e){} }
function hasRun(){ try{ return !!localStorage.getItem(SAVE); }catch(e){ return false; } }

// ── procedural avatars ─────────────────────────────────────────────────────
/* Built from a small custom shape vocabulary rather than an illustration pack
   (GDD §17). Two tones, hard edges, framed like a still off a camera that has
   been running for six weeks and is not being watched by anyone. */
function avatar(p,size){
  return AV.img(p.avatarSeed,size||96);
}

// ── feed ───────────────────────────────────────────────────────────────────
var feedLines=[];
/* A line in the feed can carry a drawn mark. Sixteen weeks of undifferentiated
   grey paragraphs was the single hardest thing in this interface to skim: the
   eviction and the small talk looked identical. */
function say(text,cls,ic){ if(!text) return;
  feedLines.push({t:text,c:cls||'',i:ic||null,w:s?s.week:0});
  if(feedLines.length>240) feedLines.shift(); }
function sysline(text){ say(text,'sys'); }
/*
 * The log, grouped by week.
 *
 * A life sim's history reads as "Age: 5 years" and then what happened at five,
 * and that heading is doing more work than it looks like: it turns an
 * undifferentiated column of grey sentences into a thing you can scan and
 * scroll back through. Ours groups by week and keeps the whole run rather than
 * the last ninety lines, because the run IS the story and the recap should not
 * be the first time you can read it.
 */
function renderLog(){
  var out='', last=null;
  for(var i=0;i<feedLines.length;i++){
    var l=feedLines[i];
    /* Seed banners and phase markers were only ever there to break the old
       undifferentiated feed into chunks. The week heading does that job now,
       and an empty heading with nothing under it looks like a bug. */
    if(l.c==='sys') continue;
    if(l.w!==last){ last=l.w;
      out+='<div class="wkh">'+(l.w>0?'Week '+l.w:'Move In Night')+'</div>'; }
    out+='<p class="'+l.c+'">'+(l.i?U.icon(l.i,14):'')+'<span>'+esc(l.t)+'</span></p>';
  }
  if(!out) out='<p class="quiet" style="padding:14px 16px">Nothing has happened yet.</p>';
  return '<div class="log" id="feed">'+out+'</div>';
}
function esc(x){ return String(x).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function scrollFeed(){ var f=document.getElementById('feed'); if(f) f.scrollTop=f.scrollHeight; }

function tsay(bank,vars){ return STR.say(s.rng.text,bank,vars); }

// ── the wall ───────────────────────────────────────────────────────────────
function readOf(id){
  if(id===s.human) return null;
  return E.read(s.rel,s.human,id);
}
function cellFor(p,opts){
  var o=opts||{};
  var me=s.human;
  var rd=readOf(p.id);
  var band=rd?rd.band.label:null;
  var col=rd?U.bandColor(band):COL.ink;

  var cls='cell';
  /* `block` is a provisional block: names the player has chosen but not yet
     locked in. Without it the intent screen showed the two nominees looking
     exactly like everybody else, and the only way to tell who was up there was
     to read the tag row. */
  var onBlock=(s.atRisk&&s.atRisk.indexOf(p.id)!==-1)||(o.block&&o.block.indexOf(p.id)!==-1);
  if(p.status!=='active') cls+=' gone';
  if(onBlock) cls+=' risk';
  if(p.id===me) cls+=' you';
  if(o.selected&&o.selected.indexOf(p.id)!==-1) cls+=' sel';

  /* Every state this person is in, as a drawn mark rather than a word. The
     whole point is that a player can sweep the wall and see who holds power,
     who is exposed and who they have stopped talking to, without reading. */
  var marks='';
  if(s.captain===p.id) marks+='<span class="m-cap">'+U.icon('captain',18)+'</span>';
  if(onBlock) marks+='<span class="m-risk">'+U.icon('risk',18)+'</span>';
  if(s.vetoHolder===p.id) marks+='<span class="m-veto">'+U.icon('veto',18)+'</span>';
  if(p.onRations) marks+='<span class="m-rat">'+U.icon('rations',17)+'</span>';
  if(p.id!==me){
    var shared=E.sharedAlliances(s.alliances,me,p.id).filter(function(a){return a.alive;});
    if(shared.length) marks+='<span class="m-ally">'+U.icon('alliance',18)+'</span>';
    else {
      var seen=s.alliances.filter(function(a){ return a.alive&&a.members.indexOf(p.id)!==-1&&a.known&&a.known[me]!=null; });
      if(seen.length) marks+='<span class="m-seen">'+U.icon('seen',18)+'</span>';
    }
    var th=E.threatScore(s.rel,s.cast,me,p.id,s.panel,s.alliances);
    if(th>=62) marks+='<span class="m-threat">'+U.icon('threat',17)+'</span>';
    if(rd&&rd.conf<0.4) marks+='<span class="m-stale">'+U.icon('stale',17)+'</span>';
  } else if(PW.heldBy(s,me).length){
    marks+='<span class="m-power">'+U.icon('power',17)+'</span>';
  }
  if(p.status==='panel') marks+='<span class="m-seen">'+U.icon('panel',17)+'</span>';
  else if(p.status==='evicted') marks+='<span class="m-seen">'+U.icon('out',17)+'</span>';

  var label;
  if(p.id===me) label='<div class="band" style="color:var(--paper)">You</div>'
    +'<div class="fresh">'+esc(p.archetype)+'</div>';
  else label='<div class="band" style="background:'+U.bandDim(band)+';color:'+U.bandOn(band)+'">'
      +esc(band)+'</div>'
    +'<div class="fresh">'+esc(rd.freshness)+'</div>';

  return '<div class="'+cls+'" data-id="'+p.id+'" style="border-left-color:'+col+'">'
    +(o.pick?'<button class="pick" data-pick="'+p.id+'" aria-label="'+esc(p.name)+'"></button>':'')
    +'<div class="cam">'+avatar(p,110)+'<span class="rec"></span></div>'
    +'<div class="top"><span class="nm">'+esc(p.first)+'</span>'
      +(p.id===me?'':U.ladder(band,rd.conf))+'</div>'
    +label
    +'<div class="marks">'+marks+'</div></div>';
}

var wallSort='house';
function wall(opts){
  var o=opts||{};
  var list=s.cast.filter(function(p){
    if(o.only) return o.only.indexOf(p.id)!==-1;
    return o.all?true:p.status==='active';
  });
  if(!o.only) list=U.sortCast(s,E,list,wallSort);
  var tabs='';
  if(!o.only&&!o.nosort){
    tabs='<div class="sorts">'+Object.keys(U.SORTS).map(function(k){
      return '<button data-sort="'+k+'" class="'+(wallSort===k?'on':'')+'">'+U.SORTS[k].n+'</button>';
    }).join('')+'</div>';
  }
  return tabs+'<div class="wall">'+list.map(function(p){ return cellFor(p,o); }).join('')+'</div>';
}

// ── chrome ─────────────────────────────────────────────────────────────────
var PHASE_NAME={
  reset:'Reset',captain_comp:'Captain Comp',captain_room:"The Captain's room",
  scheme1:'Scheming I',naming:'Naming',
  veto_comp:'Veto Comp',scheme2:'Scheming II',veto_ceremony:'Veto Ceremony',
  scheme3:'Scheming III',eviction:'Eviction',fallout:'Fallout',
  final3:'Final Three',panel:'The Panel',over:'Over',move_in:'Move In Night'};
function topbar(withRail){
  if(!s) return '';
  var rail=(withRail===false)?'':U.phaseRail(s.phase);
  return '<div class="topbar"><span class="wk">Week '+s.week+'</span>'
    +(rail?'':'<span class="ph">'+esc(PHASE_NAME[s.phase]||s.phase)+'</span>')
    +'<span class="sp">'+energyStrip()+'<span class="meta">'+R.activeCount(s)+' left</span>'
    +'<span class="meta">Seed '+esc(s.seed)+'</span></span></div>'+rail+weekStrip();
}

/* The three facts a player checks constantly and previously had to find by
   scanning sixteen tiles for a small icon: who has the power, who is on the
   block, who holds the Veto. */
function weekStrip(){
  if(!s||s.phase===R.PHASES.MOVE_IN||s.phase===R.PHASES.SETUP) return '';
  function slot(label,ids,cls,ic){
    if(!ids||!ids.length) return '<div class="ws"><span class="wsl">'+label+'</span>'
      +'<span class="wsv dim">not yet</span></div>';
    return '<div class="ws '+cls+'"><span class="wsl">'+ic+' '+label+'</span>'
      +'<span class="wsv">'+ids.map(function(i){
        return esc(s.cast[i].first)+(i===s.human?' (you)':''); }).join(', ')+'</span></div>';
  }
  /* Playtest: "after a week it shows the same people on the block until after
     you talk to everyone". The block is only cleared at the next Reset, so
     between the vote and the new week the strip was still advertising two
     names, one of whom had already gone. Once the vote is in, the block is
     history and the strip says so. */
  var done=s.phase===R.PHASES.FALLOUT||s.phase===R.PHASES.RESET;
  var gone=done&&s.evictionResult?s.evictionResult.evicted:null;
  var risk=(s.atRisk&&s.atRisk.length&&!done)?s.atRisk:null;
  return '<div class="strip">'
    +slot('Captain',s.captain!=null?[s.captain]:null,'c-cap',U.icon('captain',15))
    +(gone!=null
      ? '<div class="ws c-risk"><span class="wsl">'+U.icon('out',15)+' Evicted</span>'
        +'<span class="wsv">'+esc(s.cast[gone].first)+(gone===s.human?' (you)':'')+'</span></div>'
      : slot('At Risk',risk,'c-risk',U.icon('risk',15)))
    +slot('Veto',(s.vetoHolder!=null&&!done)?[s.vetoHolder]:null,'c-veto',U.icon('veto',15))
    +'</div>';
}
/* Energy as marks rather than a number. GDD §17 scopes the no-numbers rule to
   relationship values, so a digit here would be legal, but a row of marks reads
   as something you are burning through and a digit reads as a budget. */
function energyStrip(){
  if(!s||!s.energy&&s.energy!==0) return '';
  var max=SC.ENERGY.BASE+SC.ENERGY.AT_RISK_BONUS, o='';
  for(var i=0;i<max;i++) o+='<span class="pip-e'+(i<s.energy?'':' spent')+'"></span>';
  return '<span class="energy"><span class="meta">Energy</span><span class="pips-e">'+o+'</span></span>';
}

/* What the player is holding, if anything, shown wherever it is relevant. */
function myPowers(){ return PW.heldBy(s,s.human); }

/* The old bar, still used by the screens that are not the week loop: the title,
   the creator, the tree, the vote reveal and the results. dock() is the week
   loop's version and swaps the class, so this has to swap it back. */
function setBar(prompt,buttons){
  bar.className='bar';
  if(!buttons||!buttons.length){ bar.classList.add('hide'); barin.innerHTML=''; return; }
  bar.classList.remove('hide');
  barin.innerHTML='<span class="prompt">'+esc(prompt||'')+'</span>'
    +buttons.map(function(b,i){
      return '<button class="btn '+(b.cls||'')+'" data-act="'+i+'"'+(b.off?' disabled':'')+'>'+esc(b.label)+'</button>';
    }).join('');
  Array.prototype.forEach.call(barin.querySelectorAll('[data-act]'),function(el){
    el.onclick=function(){ buttons[Number(el.dataset.act)].go(); };
  });
}

// ── screens ────────────────────────────────────────────────────────────────
function render(){
  if(screen==='page') return;              // owns its own paint
  if(screen==='title') return renderTitle();
  if(screen==='create') return renderCreate();
  if(screen==='tree') return renderTree();
  if(screen==='comp') return;               // owns its own paint
  if(screen==='vote') return;               // owns its own paint
  if(screen==='results') return renderResults();
  if(screen==='recap') return renderRecap();
  return renderPhase();
}

function renderTitle(){
  app.className='scroll';
  bar.classList.add('hide');
  var lv=level(), career=account.career||{runs:0,wins:0};
  app.innerHTML=''
   +'<div style="padding:44px 0 10px">'
   /* The wordmark carries the brand, which the light theme otherwise had
      nowhere to show. RunThe in ink, House in blue, same shape as the rest of
      the RunThe.gg family. */
   +'<h1 style="font-size:clamp(38px,9vw,80px);letter-spacing:-.02em;line-height:1">'
   +'<span style="color:var(--paper)">RunThe</span>'
   +'<span style="color:var(--blue)">House</span></h1>'
   +'<p style="color:var(--dim);max-width:560px;margin:12px 0 0">'
   +'Sixteen people, one prize, and a sealed house. Nobody here is scripted. '
   +'They form their own opinions of you, build their own alliances behind your back, '
   +'and vote on their own maths. You survive by managing what people think of you.</p></div>'
   +'<div class="file"><h2>Your File</h2>'
   +'<div class="sub">'+(account.name?esc(account.name):'Unfiled')+'</div>'
   +'<div class="grid2">'
   +'<div><label>Level</label><div style="font-family:var(--disp);font-size:24px;color:var(--paper)">'+lv+'</div></div>'
   +'<div><label>Skill tokens</label><div style="font-family:var(--disp);font-size:24px;color:var(--paper)">'+tokensLeft()+' of '+tokensTotal()+'</div></div>'
   +'<div><label>Runs</label><div style="font-family:var(--disp);font-size:24px;color:var(--paper)">'+(career.runs||0)+'</div></div>'
   +'<div><label>Wins</label><div style="font-family:var(--disp);font-size:24px;color:var(--paper)">'+(career.wins||0)+'</div></div>'
   +'</div></div>'
   +'<div class="row">'
   /* One primary action here too, and it is the same blue as the button that
      moves the week on. */
   +(hasRun()?'<button class="btn prime" id="resume">Resume run</button>':'')
   +'<button class="btn '+(hasRun()?'':'prime')+'" id="newrun">New run</button>'
   +'<button class="btn" id="tofile">'+(account.name?'Edit character':'Create character')+'</button>'
   +'<button class="btn" id="totree">Skill tree</button>'
   +'</div>'
   +'<div class="row"><label style="margin:0">Seed, optional</label>'
   +'<input id="seedin" placeholder="leave blank for a new house" style="max-width:280px" inputmode="numeric"></div>';

  var res=document.getElementById('resume');
  if(res) res.onclick=function(){
    try{ s=R.restore(JSON.parse(localStorage.getItem(SAVE))); }catch(e){ clearRun(); renderTitle(); return; }
    feedLines=[]; sysline('Run resumed.'); screen='phase'; pump();
  };
  document.getElementById('newrun').onclick=function(){
    if(!account.name){ screen='create'; render(); return; }
    var sd=document.getElementById('seedin').value.trim();
    startRun(sd||null);
  };
  document.getElementById('tofile').onclick=function(){ screen='create'; render(); };
  document.getElementById('totree').onclick=function(){ screen='tree'; render(); };
}

function renderCreate(){
  app.className='scroll';
  bar.classList.add('hide');
  var towns=G.HOMETOWNS.map(function(h){ return '<option value="'+esc(h[0])+'"'+(account.hometown===h[0]?' selected':'')+'>'+esc(h[0])+'</option>'; }).join('');
  app.innerHTML=''
   +'<div class="topbar"><span class="wk">Casting File</span></div>'
   +'<div class="file"><h2>Who is walking in</h2>'
   +'<div class="sub">Name, where you are from, and how you read on paper. '
   +'Region and gender shape first impressions and nothing else. They never touch a competition.</div>'
   +'<div class="grid2">'
   +'<div><label>Name</label><input id="cn" value="'+esc(account.name||'')+'" maxlength="26" placeholder="First Last"></div>'
   +'<div><label>Gender</label><select id="cg">'
     +'<option value="f"'+(account.gender==='f'?' selected':'')+'>Woman</option>'
     +'<option value="m"'+(account.gender==='m'?' selected':'')+'>Man</option>'
     +'<option value="x"'+(account.gender==='x'?' selected':'')+'>Nonbinary</option></select></div>'
   +'<div><label>Hometown</label><select id="ch">'+towns+'</select></div>'
   +'</div></div>'
   +'<div class="row"><button class="btn go" id="csave">Save file</button>'
   +'<button class="btn" id="cback">Back</button></div>';
  document.getElementById('csave').onclick=function(){
    var nm=document.getElementById('cn').value.trim();
    if(!nm){ document.getElementById('cn').focus(); return; }
    account.name=nm;
    account.gender=document.getElementById('cg').value;
    account.hometown=document.getElementById('ch').value;
    var t=G.HOMETOWNS.filter(function(h){ return h[0]===account.hometown; })[0];
    account.region=t?t[1]:'northeast';
    if(!account.avatarSeed) account.avatarSeed=Math.floor(Math.random()*1e9);
    saveAccount(); screen='title'; render();
  };
  document.getElementById('cback').onclick=function(){ screen='title'; render(); };
}

function renderTree(){
  app.className='scroll';
  bar.classList.add('hide');
  var owned=new Set(account.owned);
  var attrs=T.deriveAttributes(owned);
  var arch=T.resolveArchetype(owned,attrs);
  var trunks=['comp','floor','long'];
  var cols=trunks.map(function(tk){
    var info=T.TRUNKS[tk];
    var root=T.BY_ID.get(tk+'.root');
    var rootCls=owned.has(root.id)?'own':(T.canBuy(owned,root.id)&&tokensLeft()>=root.cost?'can':'locked');
    var brs=T.BRANCHES.filter(function(b){ return b.trunk===tk; }).map(function(b){
      var nodes=[1,2,3,4,5,6].map(function(t){
        var id=tk+'.'+b.id+'.'+t, n=T.BY_ID.get(id);
        var cls=owned.has(id)?'own':(T.canBuy(owned,id)&&tokensLeft()>=n.cost?'can':'locked');
        return '<div class="node '+cls+'" data-node="'+id+'" title="'+esc(n.name+', '+n.cost+' tokens')+'">'+n.cost+'</div>';
      }).join('');
      return '<div class="branch"><div class="bn">'+esc(b.name)+'</div><div class="nodes">'+nodes+'</div></div>';
    }).join('');
    var capId=tk+'.capstone', cap=T.BY_ID.get(capId);
    var capCls=owned.has(capId)?'own':(T.canBuy(owned,capId)&&tokensLeft()>=cap.cost?'can':'locked');
    return '<div class="trunk"><h3>'+esc(info.name)+'</h3><div class="blurb">'+esc(info.blurb)+'</div>'
      +'<div class="branch"><div class="bn">Root</div><div class="nodes">'
      +'<div class="node '+rootCls+'" data-node="'+root.id+'">'+root.cost+'</div></div></div>'
      +brs
      +'<div class="branch"><div class="bn">Mastery</div><div class="nodes">'
      +'<div class="node '+capCls+'" data-node="'+capId+'">'+cap.cost+'</div></div></div></div>';
  }).join('');

  var attrRows=T.ALL_ATTRS.map(function(k){
    return '<tr><td>'+esc(k)+'</td><td class="r">'+attrs[k]+'</td></tr>';
  }).join('');

  app.innerHTML=''
   +'<div class="topbar"><span class="wk">Skill Tree</span>'
   +'<span class="ph">'+esc(arch.name)+'</span>'
   +'<span class="sp"><span class="meta">'+tokensLeft()+' tokens unspent</span></span></div>'
   +'<div class="file"><div class="sub">Every point you spend also makes you a bigger target. '
   +'The house scales to your level, and being good at things is how people get evicted here.</div>'
   +'<div class="tree">'+cols+'</div></div>'
   +'<div class="file"><h2>Attributes</h2><div class="scroll">'
   +'<table class="truth"><tbody>'+attrRows+'</tbody></table></div></div>'
   +'<div class="row"><button class="btn" id="respec">Reset tree</button>'
   +'<button class="btn go" id="tback">Done</button></div>';

  Array.prototype.forEach.call(app.querySelectorAll('.node.can'),function(el){
    el.onclick=function(){
      var id=el.dataset.node, n=T.BY_ID.get(id);
      if(tokensLeft()<n.cost) return;
      account.owned.push(id); saveAccount(); render();
    };
  });
  document.getElementById('respec').onclick=function(){ account.owned=[]; saveAccount(); render(); };
  document.getElementById('tback').onclick=function(){ screen='title'; render(); };
}

// ── starting a run ─────────────────────────────────────────────────────────
function startRun(seed){
  s=R.createRun({seed:seed||undefined,account:account});
  feedLines=[];
  sysline('Seed '+s.seed+'. Sixteen people. One of them is you.');
  clearRun(); screen='phase'; pump();
}

// ── moments ────────────────────────────────────────────────────────────────
/*
 * Playtest: "someone used the veto but the only way to know is the chat box all
 * the way at the bottom." Correct, and it applied to the nominations, the veto
 * draw and every power in the game. A beat that decides the week cannot be a
 * line of grey text that scrolls past while the player is looking somewhere
 * else. These stop the loop until acknowledged.
 */
var momentQ=[];
function moment(m){ momentQ.push(m); }

/* Moments are cards now. The old full-screen version replaced everything behind
   it, so acknowledging one meant losing your place in the log. */
function showMoment(m){
  openCard({
    kicker:m.kicker||'The house', icon:m.icon||'captain', tone:m.tone||'',
    title:m.title, body:m.sub?[m.sub]:[], faces:m.faces||[], rows:m.rows||null,
    ok:{label:m.cta||'Go on',go:function(){ pump(); }}
  });
}

// ── the card ───────────────────────────────────────────────────────────────
/*
 * ONE beat, ONE decision, and never both at once.
 *
 * Everything that used to paint itself over the whole screen paints in here
 * instead: naming, the veto, powers, scenes, the vote. The stage behind it does
 * not move, so a card is something that happened TO the run rather than a place
 * you got taken to, and dismissing it puts you back exactly where you were.
 *
 * Shape:
 *   kicker  what kind of beat this is, top left
 *   who     the person it is about, with their avatar and their role, top right
 *   title   one line, with a drawn mark
 *   body    one to three sentences, never more
 *   rows    a label and value table, for facts that are not prose
 *   faces   the people involved
 *   bars    where a number would go if we used numbers
 *   pick    a list of people to choose from
 *   choices stacked, full width, thumb sized
 *   ok      or a single button when there is nothing to decide
 *   foot    the one quiet escape, underlined, never a real option
 */
var cardOpen=null;
function openCard(c){
  cardOpen=c;
  document.body.classList.add('carded');
  var h='';
  var who=c.who!=null?s.cast[c.who]:null;
  h+='<div class="ch">'
    +(who?'<div class="av">'+avatar(who,34)+'</div>':'')
    +'<span class="k">'+esc(c.kicker||'')+'</span>'
    +(c.role?'<span class="r">'+esc(c.role)+'</span>':'')
    +'</div>';
  h+='<div class="cbody">';
  if(c.title) h+='<h2>'+(c.icon?U.icon(c.icon,20):'')+'<span>'+esc(c.title)+'</span></h2>';
  (c.body||[]).forEach(function(b){
    if(!b) return;
    if(typeof b==='string') h+='<p>'+esc(b)+'</p>';
    else h+='<p class="'+(b.c||'')+'">'+esc(b.t)+'</p>';
  });
  if(c.rows&&c.rows.length) h+='<div class="rows">'+c.rows.map(function(r){
    return '<div><b>'+esc(r[0])+'</b>'+esc(r[1])+'</div>'; }).join('')+'</div>';
  if(c.faces&&c.faces.length) h+='<div class="faces">'+facesHtml(c.faces)+'</div>';
  if(c.bars&&c.bars.length) h+='<div class="sbars">'+c.bars.map(barRow).join('')+'</div>';
  if(c.pick) h+=pickList(c.pick);
  h+='</div>';

  var btns=c.choices||(c.ok?[{label:c.ok.label,cls:'go',go:c.ok.go}]:[]);
  if(btns.length) h+='<div class="choices">'+btns.map(function(b,i){
    return '<button class="chb '+(b.cls||'')+'" data-c="'+i+'"'+(b.off?' disabled':'')+'>'
      +(b.key?'<span class="key">'+esc(b.key)+'</span>':'')
      +'<span class="txt">'+esc(b.label)+(b.note?'<small>'+esc(b.note)+'</small>':'')+'</span>'
      +(b.tag?'<span class="tag">'+esc(b.tag)+'</span>':'')+'</button>';
  }).join('')+'</div>';
  if(c.foot) h+='<div class="cfoot"><button data-foot="1">'+esc(c.foot.label)+'</button></div>';

  /*
   * Playtest: "doesn't let you choose two people for alliance, it's a glitch".
   * It did let you. Every pick rebuilt the card, which reset the list's scroll
   * to the top, so the second person you had scrolled down to find jumped away
   * under your thumb and the tap looked like it had done nothing. Carry the
   * scroll across the rebuild and the bug disappears.
   */
  var keepScroll=0;
  var oldList=sheet.querySelector('.plist');
  if(oldList) keepScroll=oldList.scrollTop;
  sheet.innerHTML='<div class="sheet"><div class="card t-'+(c.tone||'')+'">'+h+'</div></div>';
  var newList=sheet.querySelector('.plist');
  if(newList&&keepScroll) newList.scrollTop=keepScroll;

  Array.prototype.forEach.call(sheet.querySelectorAll('[data-c]'),function(el){
    el.onclick=function(){ var b=btns[Number(el.dataset.c)]; closeCard(); b.go(); };
  });
  var f=sheet.querySelector('[data-foot]');
  if(f) f.onclick=function(){ closeCard(); c.foot.go(); };
  if(c.pick) Array.prototype.forEach.call(sheet.querySelectorAll('[data-pick]'),function(el){
    el.onclick=function(){ c.pick.go(Number(el.dataset.pick)); };
  });
}
function closeCard(){ cardOpen=null; sheet.innerHTML=''; document.body.classList.remove('carded'); }

function facesHtml(faces){
  return faces.map(function(f){
    var rd=f.id===s.human?null:readOf(f.id);
    var col=f.col||(rd?U.bandColor(rd.band.label):COL.ink);
    return '<div class="mface"><div class="fr" style="border-color:'+col+'">'
      +avatar(s.cast[f.id],88)+'</div>'
      +'<div class="fn">'+esc(s.cast[f.id].first)+(f.id===s.human?' (you)':'')+'</div>'
      +'<div class="ft" style="color:'+col+'">'+esc(f.tag||'')+'</div></div>';
  }).join('');
}

/* Choosing a person is a list, not the sixteen tile wall. On a phone the wall
   was four rows of scrolling before you could read everybody's name, which is
   the exact moment a player stops knowing what the screen is asking them. */
function pickList(p){
  var ids=p.pool.slice();
  if(p.sort!==false) ids=U.sortCast(s,E,ids.map(function(i){return s.cast[i];}),wallSort)
    .map(function(x){return x.id;});
  return '<div class="plist">'+ids.map(function(id){
    var pl=s.cast[id], rd=readOf(id);
    var sel=p.selected&&p.selected.indexOf(id)!==-1;
    var blk=p.block&&p.block.indexOf(id)!==-1;
    var col=rd?U.bandColor(rd.band.label):COL.ink;
    var mk='';
    if(s.captain===id) mk+='<span class="m-cap">'+U.icon('captain',16)+'</span>';
    if(s.atRisk&&s.atRisk.indexOf(id)!==-1||blk) mk+='<span class="m-risk">'+U.icon('risk',16)+'</span>';
    if(s.vetoHolder===id) mk+='<span class="m-veto">'+U.icon('veto',16)+'</span>';
    if(id!==s.human&&E.sharedAlliances(s.alliances,s.human,id).filter(function(a){return a.alive;}).length)
      mk+='<span class="m-ally">'+U.icon('alliance',16)+'</span>';
    return '<button class="prow'+(sel?' sel':'')+(blk?' block':'')+(id===s.human?' you':'')+'"'
      +' data-pick="'+id+'"'+(id===s.human?' disabled':'')+'>'
      +'<div class="av">'+avatar(pl,42)+'</div>'
      +'<div class="n"><b>'+esc(pl.first)+(id===s.human?' (you)':'')+'</b>'
      +'<span style="background:'+(rd?U.bandDim(rd.band.label):'var(--panel2)')
        +';color:'+(rd?U.bandOn(rd.band.label):'var(--dim)')+'">'
        +esc(id===s.human?pl.archetype:rd.band.label)+'</span></div>'
      +'<div class="mk">'+mk+'</div></button>';
  }).join('')+'</div>';
}

/** Everybody still in but you. Nearly every pick list wants exactly this. */
function others(){
  return R.activeIds(s).filter(function(i){ return i!==s.human; });
}

// ── the stage: what is always on screen behind everything ──────────────────
/*
 * The stage never gets replaced, only redrawn. Your name and your standing at
 * the top, the facts of the week under it, then the log, and pinned at the
 * bottom the one button that moves time forward. A player who has been away for
 * a week can come back, read down the page and know exactly where they are
 * without opening anything.
 */
function renderStage(){
  screen='phase';
  var me=s.cast[s.human];
  app.className='';
  /*
   * Header, log, dock. Nothing else lives here.
   *
   * The bars and the panels used to sit between the header and the log, so by
   * the time you had a Panel bar and an open House panel the newest line was
   * two screens down. Playtest: "I want the bottom tabs to open up new pages
   * instead of flooding the main page with more information." They do now, and
   * this is what is left: who you are, what is true this week, and what just
   * happened.
   */
  app.innerHTML='<div class="head">'+topbar()
    +'<div class="idbar"><div class="av">'+avatar(me,44)+'</div>'
    +'<div class="who"><b>'+esc(me.name)+'</b><span>'+esc(me.archetype)
      +(me.status==='active'?'':' &middot; out')+'</span></div>'
    +'<div class="rt"><b>'+R.activeCount(s)+'</b><span>still in</span></div></div>'
    +yourWeek()
    +'</div>'
    +'<div class="logwrap">'+renderLog()+'</div>'
    +'<div class="dockpad"></div>';
  scrollFeed();
}

/*
 * The tabs, as pages.
 *
 * Each one takes the screen and comes back with one button, rather than being
 * stapled underneath the log. The stage is untouched behind them, so closing a
 * page puts you back exactly where you were with the newest line still in view.
 */
function showPage(kind){
  screen='page';
  app.className='scroll';
  var me=s.cast[s.human];
  var body='', title='', sub='';
  if(kind==='house'){
    title='The house'; sub='What you know, and how old the information is.';
    body=U.legend()+wall({});
    if(s.panel&&s.panel.length){
      body+='<div class="pagehr"></div><h3>The Panel</h3>'
        +'<div class="sub">Seven seats when it is full. They are still watching, '
        +'and they vote at the end on which of the last two deserves it.</div>'
        +wall({only:s.panel,all:true});
    }
  } else if(kind==='know'){
    title='What you know';
    sub='Every one of these is worth something to somebody, and nothing to everybody else. They go stale.';
    body=knowList();
  } else if(kind==='map'){
    title='Who is working with who';
    sub='Only what you have actually seen or been told. An empty map means you have not been paying attention.';
    body=U.allianceMap(s,E);
  } else {
    title='Your file'; sub=me.archetype+'. Seed '+esc(s.seed)+'.';
    var held=myPowers();
    body=selfBars()
      +(held.length?'<div class="rows">'+held.map(function(p){
          var d=PW.POWERS[p.kind];
          return '<div><b>'+esc(d.name)+'</b>'+esc(d.long)+'</div>'; }).join('')+'</div>'
        :'<p style="color:var(--dim)">You are not holding anything.</p>');
    var mine=E.allianceOf(s.alliances,s.human).filter(function(a){ return a.alive; });
    if(mine.length){
      body+='<div class="pagehr"></div><h3>Rooms you are in</h3>'
        +'<div class="rows">'+mine.map(function(a){
          /* A named group is a different object from an unnamed one, and the
             heading has to say which one you are looking at, because only one
             of them is drawing heat. GDD §7.7. */
          return '<div><b>'+esc(a.name||(a.members.length+' of you'))+'</b>'
            +esc(a.members.filter(function(i){ return i!==s.human; })
              .map(function(i){ return s.cast[i].first; }).join(', '))
            +(a.name?'. '+a.members.length+' of you'
              +(a.namedSize&&a.members.length<a.namedSize?', and the house still uses the old number':'')+'.'
              :'. No name on it, which is the only reason nobody is counting it.')
            +'</div>'; }).join('')+'</div>';
    }
    var sm=E.showmanceOf(s,s.human);
    if(sm&&sm.alive){
      var mate=sm.a===s.human?sm.b:sm.a;
      body+='<div class="pagehr"></div><h3>The house counts you as one</h3>'
        +'<div class="rows"><div><b>'+esc(s.cast[mate].first)+'</b>'
        +'Neither of you will move against the other. Everything they draw, you draw.</div></div>';
    }
  }
  app.innerHTML='<div class="file"><h2>'+esc(title)+'</h2>'
    +'<div class="sub">'+esc(sub)+'</div></div>'+body;
  Array.prototype.forEach.call(app.querySelectorAll('[data-sort]'),function(el){
    el.onclick=function(){ wallSort=el.dataset.sort; showPage(kind); };
  });
  setBar('',[{label:'Back to the house',cls:'prime',go:function(){ idle(); }}]);
  window.scrollTo(0,0);
}

/*
 * WHAT YOU KNOW, GDD §20.
 *
 * The inventory surface. Every line is a thing you actually learned, in the
 * words the house would use, plus the two facts that make it a decision: how
 * long it stays worth anything, and who it is worth the most to.
 *
 * Naming the best ear is deliberate. §17 keeps numbers off relationships, and
 * a percentage here would be both a number and a lie, but "this is worth most
 * to Devora" is the read a person in that house would actually have, and
 * without it choosing between eleven facts and twelve people is a shrug.
 */
function secretLine(sec){
  var n=function(i){ return i===s.human?'you':s.cast[i].first; };
  if(sec.kind==='read'){
    return n(sec.about[0])+' on '+n(sec.about[1])+': '+E.band(sec.value).label.toLowerCase();
  }
  if(sec.kind==='room'){
    return 'A room with '+sec.about.map(n).join(', ')+' in it';
  }
  if(sec.kind==='name'){
    return (sec.value||'A named group')+', which is '+sec.about.map(n).join(', ');
  }
  if(sec.kind==='pair'){
