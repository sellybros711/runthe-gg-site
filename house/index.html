    return n(sec.about[0])+' and '+n(sec.about[1])+' are one number';
  }
  if(sec.kind==='intent'){
    return n(sec.value)+' is actually after '+n(sec.about[0]);
  }
  return 'Something you heard';
}

/* How long it has left, in words rather than a count of weeks. */
function secretAge(sec){
  var f=SEC.freshness(s,sec);
  return f>0.74?'Still fresh':f>0.49?'Still good':f>0.24?'Going stale':'About to be worthless';
}

function knowList(){
  var list=SEC.held(s, s.human);
  if(!list.length) return '<div class="mapnote">'+esc(tsay('knowNothing'))+'</div>';
  var pool=others();
  return '<div class="rows">'+list.map(function(sec){
    var ear=SEC.bestEar(s,sec,pool);
    var to=ear.id!=null&&ear.worth>0.2
      ? 'Worth most to '+esc(s.cast[ear.id].first)
      : 'Nobody in this house needs this';
    var told=Object.keys(sec.told||{}).length;
    return '<div><b>'+esc(secretLine(sec))+'</b>'
      +to+'. '+secretAge(sec)
      +(told?'. Already told '+told+(told>1?' people':' person'):'')
      +'.</div>';
  }).join('')+'</div>';
}

/*
 * Four readings of your own game, as bars with no numbers on them.
 *
 * GDD §17 keeps numbers off relationships, and these are aggregates of exactly
 * that, so they stay wordless: a bar and a band. What they are FOR is the thing
 * a life sim does well and we did not, which is letting somebody see at a
 * glance whether the last ten minutes went well.
 */
function selfBars(){
  var me=s.human, act=R.activeIds(s).filter(function(i){ return i!==me; });
  var warm=0, tot=0;
  for(var i=0;i<act.length;i++){ tot+=s.rel.trust[act[i]][me]; if(s.rel.trust[act[i]][me]>25) warm++; }
  var avg=act.length?tot/act.length:0;
  var standing=Math.max(0,Math.min(100,(avg+100)/2));
  var threat=act.length?E.threatScore(s.rel,s.cast,me,me,s.panel,s.alliances):50;
  var reach=act.length?(warm/act.length)*100:0;
  var allies=E.allianceOf(s.alliances,me).length;
  var maxE=SC.ENERGY.BASE+SC.ENERGY.AT_RISK_BONUS;
  return '<div class="sbars">'
    +barRow({label:'Standing',v:standing,col:U.bandColor(E.band(avg).label),
             note:E.band(avg).label})
    +barRow({label:'Reach',v:reach,col:COL.blue,
             note:warm+' of '+act.length+' warm'})
    +barRow({label:'Exposure',v:threat,col:threat>62?COL.signal:COL.hand,
             note:threat>62?'they see you':threat>44?'noticed':'under it'})
    +barRow({label:'Energy',v:(s.energy/maxE)*100,col:COL.ok,
             note:s.energy+' left this week'+(allies?' &middot; '+allies+(allies>1?' rooms':' room'):'')})
    +panelBar()
    +'</div>';
}

/*
 * The Panel, once there is one.
 *
 * Everybody in the house starts thinking about the jury the moment it starts
 * filling, and by the last five it is the thing deciding half the evictions.
 * The player had no way to see it: jurors drop off the wall the week they
 * leave and never come back, so the one number that decides the end of the game
 * was the one number nobody could read.
 *
 * Bands, no figures, same as every other relationship reading. §17.
 */
function panelBar(){
  if(!s.panel||!s.panel.length) return '';
  var me=s.human, tot=0, with_=0;
  for(var i=0;i<s.panel.length;i++){
    var v=s.rel.trust[s.panel[i]][me];
    tot+=v; if(v>25) with_++;
  }
  var avg=tot/s.panel.length;
  return barRow({label:'The Panel',v:Math.max(0,Math.min(100,(avg+100)/2)),
    col:U.bandColor(E.band(avg).label),
    note:with_+' of '+s.panel.length+' with you'});
}
/*
 * What YOU have done this week.
 *
 * Playtest: "overall it just feels hard to follow and track what is going on,
 * and what you have done". The week strip answers the first half, the log
 * answers it at length, and nothing at all answered the second half: a player
 * could not tell who they had already spent energy on without scrolling back
 * through a fortnight of prose. Read off the same log the recap uses, so it
 * cannot disagree with the record.
 */
function yourWeek(){
  if(!s.log||!s.log.length) return '';
  var spoke=[], landed=0, rooms=0;
  for(var i=0;i<s.log.length;i++){
    var l=s.log[i];
    if(l.week!==s.week) continue;
    if(l.kind==='scene'&&l.result){
      var nm=s.cast[l.result.target];
      if(nm&&spoke.indexOf(nm.first)===-1) spoke.push(nm.first);
      if(l.result.landed) landed++;
    }
    if(l.kind==='gather') rooms++;
  }
  var line=spoke.length
    ? 'You have been at '+spoke.slice(0,4).join(', ')
      +(spoke.length>4?' and '+(spoke.length-4)+' more':'')+'.'
    : 'You have not spoken to anybody yet.';
  if(landed) line+=' '+landed+' of those landed.';
  if(rooms) line+=' You tried to get a room together'+(rooms>1?' '+rooms+' times.':'.');
  return '<div class="yw"><b>This week</b><span>'+esc(line.trim())+'</span></div>'
    +whereYouStand();
}

/*
 * WHERE YOU STAND, ALWAYS ON SCREEN.
 *
 * Playtest: "I like how it says who is closest and farthest from you now. Let's
 * lean into these kinds of things to help make decisions easier." It was a card
 * you saw once on Move In Night and never again, which is the wrong place for
 * it: the answer changes every week and it is the single most useful thing to
 * know before spending energy. Three names and one warning, on the stage.
 *
 * "Drifting" is the one that actually changes behaviour. Neglect is the
 * pressure the whole relationship engine runs on, and it was only visible by
 * opening the House page and reading fifteen freshness labels one at a time.
 */
function whereYouStand(){
  var me=s.human, act=R.activeIds(s).filter(function(i){ return i!==me; });
  if(act.length<3) return '';
  var rank=act.map(function(i){ return {id:i,v:s.rel.trust[i][me]}; })
    .sort(function(a,b){ return b.v-a.v; });
  var top=rank[0], bot=rank[rank.length-1];
  /* Somebody who liked you and has not seen you in a while. */
  var drift=act.map(function(i){
      return {id:i,gap:s.week-(s.rel.lastWeek[me][i]||0),v:s.rel.trust[i][me]}; })
    .filter(function(x){ return x.gap>=2&&x.v>15; })
    .sort(function(a,b){ return b.gap*b.v-a.gap*a.v; })[0];
  function chip(id,label){
    var band=E.band(s.rel.trust[id][me]).label;
    return '<span class="st"><i style="background:'+U.bandColor(band)+'"></i>'
      +'<b>'+esc(label)+'</b>'+esc(s.cast[id].first)+'</span>';
  }
  return '<div class="stand">'
    +chip(top.id,'Closest')
    +chip(bot.id,'Furthest')
    +(drift?chip(drift.id,'Drifting'):'')
    +'</div>';
}

function barRow(b){
  var v=Math.max(0,Math.min(100,b.v||0));
  return '<div class="sb"><i>'+esc(b.label)+'</i>'
    +'<u><span style="width:'+v.toFixed(0)+'%;background:'+(b.col||COL.blue)+'"></span></u>'
    +'<em>'+(b.note||'')+'</em></div>';
}

// ── the dock ───────────────────────────────────────────────────────────────
var NAV=[
  {k:'house',n:'House',i:'eye'},
  {k:'map',n:'Alliances',i:'alliance'},
  {k:'know',n:'You know',i:'seen'},
  {k:'you',n:'You',i:'power'}
];
/**
 * The dock. Nav chips on top, and under them the one button that moves time.
 *
 * `main` is always present and always green, because the single most useful
 * thing a life sim does is guarantee that there is exactly one way to go
 * forward and it never moves. `extra` is for the rare second action that is not
 * advancing, and it renders beside it in a quieter box.
 */
function dock(main,extra){
  bar.classList.remove('hide');
  var nav='<div class="nav">'+NAV.map(function(n){
    return '<button data-nav="'+n.k+'">'
      +U.icon(n.i,16)+'<span>'+n.n+'</span></button>'; }).join('')+'</div>';
  var row='<div class="dockrow">'
    +(extra?'<button class="gobtn quiet" data-x="1">'+esc(extra.label)+'</button>':'')
    +'<button class="gobtn '+(main.cls||'')+'" data-go="1"'+(main.off?' disabled':'')+'>'
      +esc(main.label)+(main.note?'<small>'+esc(main.note)+'</small>':'')+'</button>'
    +'</div>';
  barin.innerHTML=nav+row;
  bar.className='dock';
  Array.prototype.forEach.call(barin.querySelectorAll('[data-nav]'),function(el){
    el.onclick=function(){ showPage(el.dataset.nav); };
  });
  barin.querySelector('[data-go]').onclick=main.go;
  var x=barin.querySelector('[data-x]');
  if(x) x.onclick=extra.go;
}

/* What the button says it is about to do. Naming a phase is not enough: the
   label has to be the sentence a player would use. */
var NEXT_LABEL={};
NEXT_LABEL[R.PHASES.RESET]='Start the week';
NEXT_LABEL[R.PHASES.CAPTAIN_COMP]='Play for Captain';
NEXT_LABEL[R.PHASES.CAPTAIN_ROOM]='Up to the room';
NEXT_LABEL[R.PHASES.SCHEME1]='Work the house';
NEXT_LABEL[R.PHASES.SAFETY_CALL]='Carry on';
NEXT_LABEL[R.PHASES.NAMING]='The naming';
NEXT_LABEL[R.PHASES.VETO_DRAW]='Draw for the Veto';
NEXT_LABEL[R.PHASES.VETO_COMP]='Play for the Veto';
NEXT_LABEL[R.PHASES.SCHEME2]='Work the house';
NEXT_LABEL[R.PHASES.VETO_CEREMONY]='The ceremony';
NEXT_LABEL[R.PHASES.SCHEME3]='Last word before the vote';
NEXT_LABEL[R.PHASES.EVICTION]='Hold the vote';
NEXT_LABEL[R.PHASES.FALLOUT]='See where it landed';
NEXT_LABEL[R.PHASES.FINAL3]='The last competition';
NEXT_LABEL[R.PHASES.PANEL]='Face the Panel';
NEXT_LABEL[R.PHASES.MOVE_IN]='Move in';

function nextLabel(){
  var ph=s.phase;
  if(ph===R.PHASES.NAMING&&s.captain===s.human) return 'Name two At Risk';
  if(ph===R.PHASES.EVICTION&&s.atRisk.indexOf(s.human)!==-1) return 'Sit through it';
  return NEXT_LABEL[ph]||'Go on';
}

// ── the pump: one press, one beat ──────────────────────────────────────────
/*
 * Press the button, something happens, read it, press again.
 *
 * The old pump ran every phase that did not need input in one go, so a single
 * click could move the game through four phases and dump nine lines into a box
 * under the fold. That is the thing the playtest kept calling hard to follow.
 * Now it stops as soon as there is anything to look at: a card, a decision, or
 * even one new line in the log. Phases that produce nothing visible are still
 * absorbed, so this does not turn into twelve clicks a week.
 */
function pump(){
  if(momentQ.length){ renderStage(); dock({label:'Go on',off:true}); showMoment(momentQ.shift()); return; }
  var guard=400;
  while(guard-->0){
    if(s.phase===R.PHASES.OVER){
      /*
       * Close whatever is open first. `answer` does not close the card it was
       * answering: normally the next `handleNeed` opens a new one over the top,
       * but on a terminal path there is no next card, so the results screen
       * rendered UNDERNEATH a live sheet with body.carded still set and the run
       * could not be finished. Seen as a wedge on the Final Three pick, which
       * is the one card whose answer can end the run outright.
       */
      if(cardOpen) closeCard();
      finishRun(); return;
    }
    var need=R.needsInput(s);
    if(need){ renderStage(); handleNeed(need); return; }
    var before=s.phase, wkBefore=s.week, lines=feedLines.length;
    narrateBefore(before);
    R.step(s,null);
    narrateAfter(before,wkBefore);
    if(before===R.PHASES.EVICTION){ saveRun(); showVoteReveal(); return; }
    if(momentQ.length){ renderStage(); dock({label:'Go on',off:true}); showMoment(momentQ.shift()); return; }
    if(feedLines.length>lines){ saveRun(); idle(); return; }
  }
  idle();
}

/**
 * Answer whatever was being asked, THEN narrate the phase that answered it.
 *
 * This is the hole behind "still no popup saying who won HOH". narrateAfter was
 * only ever called from inside pump's loop, for phases that resolve on their
 * own. Every phase the PLAYER resolves went straight from the input handler to
 * pump(), which starts by looking at the NEXT phase, so the beat you had just
 * taken part in was the one beat never narrated. Play the Captain Comp yourself
 * and no card said who won it; sit it out and one did.
 *
 * Every input handler goes through here now.
 */
function answer(input){
  var before=s.phase, wkBefore=s.week;
  R.step(s,input);
  if(s.phase!==before) narrateAfter(before,wkBefore);
  saveRun();
  pump();
}

/** Nothing is being asked. Draw the stage and arm the button. */
function idle(){
  renderStage();
  dock({label:nextLabel(),go:function(){ pump(); }});
}

function narrateBefore(ph){
  if(ph===R.PHASES.RESET&&s.week>0) sysline('Week '+(s.week+1));
}

/*
 * What Move In Night actually did.
 *
 * Playtest: "idk how much the answers actually affect anything". They always
 * did a lot, and none of it was ever shown. Now every answer reports which way
 * the room went, and the night closes on where you are standing with the two
 * people it worked on and the two it did not, which is the whole point of the
 * opening: you do not start level with fifteen strangers, you start somewhere.
 */
function narrateMoveIn(){
  var ev=s.events.filter(function(e){ return e.kind==='move_in'&&!e.said; });
  for(var i=0;i<ev.length;i++){
    var e=ev[i]; e.said=true;
    say('You went with: '+e.text.replace(/\.$/,'')+'.','quiet');
    var rest=Math.max(0,(R.activeCount(s)-1)-e.warmed-e.cooled);
    if(e.focus!=null){
      say('You spend the night on '+s.cast[e.focus].first
        +'. Everybody else got an evening of you being somewhere else.','ev-good','alliance');
    } else if(e.warmed&&e.cooled){
      /* The shape of the split is the interesting part, so all three numbers
         go in. Reporting only the side that moved most made one person cooling
         read as the room turning on you. */
      say(e.warmed+(e.warmed>1?' of them warm':' of them warms')+' to that and '
        +e.cooled+(e.cooled>1?' do not':' does not')
        +(rest?', with '+rest+' either way.':'.'),'ev-vote');
    } else if(e.warmed){
      say(e.warmed+(e.warmed>1?' of them take to it':' of them takes to it')
        +(rest?', and the rest barely register it.':'.'),'ev-good');
    } else if(e.cooled){
      say(e.cooled+(e.cooled>1?' of them cool on you':' of them cools on you')
        +(rest?', and nobody else moves.':'.'),'ev-bad');
    } else {
      say('Nobody in that room changes their mind about you either way.','quiet');
    }
  }
  if(s.phase!==R.PHASES.MOVE_IN&&!s.moveInSummed&&s.moveInStep){
    s.moveInSummed=true;
    var me=s.human;
    var rank=s.cast.filter(function(p){ return p.id!==me; })
      .map(function(p){ return {id:p.id,v:s.rel.trust[p.id][me]}; })
      .sort(function(a,b){ return b.v-a.v; });
    var top=rank.slice(0,2), bot=rank.slice(-2);
    moment({kicker:'Move In Night',icon:'eye',tone:'good',
      title:'You do not start level with them',
      sub:'Four nights in a house you have never been in, and everybody already has an opinion.',
      rows:[['Closest to you',top.map(function(x){ return s.cast[x.id].first; }).join(' and ')],
            ['Furthest from you',bot.map(function(x){ return s.cast[x.id].first; }).join(' and ')]],
      faces:top.map(function(x){ return {id:x.id,tag:E.band(x.v).label,col:U.bandColor(E.band(x.v).label)}; })
        .concat(bot.slice(0,1).map(function(x){
          return {id:x.id,tag:E.band(x.v).label,col:U.bandColor(E.band(x.v).label)}; }))});
  }
}
/*
 * What the house started calling things, and who stopped pretending.
 *
 * Both are relayed by run.js only when the player would actually know, so this
 * never has to check the fog itself. A group with a name is the single most
 * useful thing a player can be told: it is the object the rest of the house
 * will spend the next four weeks taking apart. GDD §7.7 and §7.8.
 */
function narrateRooms(){
  var ev=s.events.filter(function(e){
    return !e.said&&(e.kind==='alliance_named'||e.kind==='showmance_formed'||e.kind==='showmance_broke'); });
  for(var i=0;i<ev.length;i++){
    var e=ev[i]; e.said=true;
    if(e.kind==='alliance_named'){
      var who=e.members.map(function(x){ return x===s.human?'you':s.cast[x].first; }).join(', ');
      say((e.mine?'Your room has a name now. ':'There is a name going round for a room you are not in. ')
        +e.name+'. '+who+'.',e.mine?'ev-good':'ev-power','alliance');
      moment({kicker:e.mine?'Naming':'You hear a name',icon:'alliance',tone:e.mine?'good':'',
        title:e.name,
        sub:e.mine?'A group with a name is a group the rest of them can count, and hunt.'
                  :'Now you know what they call themselves, which is most of the way to knowing who they are.',
        rows:[['Who is in it',who],['Size when it was named',String(e.size)]],
        faces:e.members.slice(0,3).map(function(x){
          return {id:x,tag:x===s.human?'You':'In it',col:e.mine?COL.ok:COL.dim}; })});
    } else if(e.kind==='showmance_formed'){
      if(e.mine){
        var mate=e.a===s.human?e.b:e.a;
        say(tsay('showYou',{name:s.cast[mate].first}),'ev-good','alliance');
        moment({kicker:'The house noticed',icon:'alliance',tone:'good',
          title:'You and '+s.cast[mate].first,
          sub:'Neither of you will move against the other. Everything they draw, you draw as well.',
          faces:[{id:mate,tag:'With you',col:COL.ok}]});
      } else {
        say(tsay('showFormed',{a:s.cast[e.a].first,b:s.cast[e.b].first}),'ev-power','alliance');
        moment({kicker:'Two of them',icon:'alliance',
          title:s.cast[e.a].first+' and '+s.cast[e.b].first,
          sub:'The house counts them as one number now, and one number is easier to aim at than two.',
          faces:[{id:e.a,tag:'Together',col:COL.blue},{id:e.b,tag:'Together',col:COL.blue}]});
      }
    } else {
      say(tsay('showBroken',{a:s.cast[e.a].first,b:s.cast[e.b].first}),'hot','broken');
    }
  }
}

function narrateAfter(ph,wkBefore){
  if(ph===R.PHASES.MOVE_IN) narrateMoveIn();
  if(ph===R.PHASES.RESET){
    say(tsay('reset'),'quiet');
    var aw=s.events.filter(function(e){ return e.kind==='power_awarded'&&e.week===s.week; });
    for(var ai=0;ai<aw.length;ai++){
      /* `power`, not `kind`. The event's own kind is 'power_awarded'; WHICH
         power it was lives in its own field, because pushEvent stamps the event
         kind last and a payload called `kind` was being eaten by it. */
      var d=PW.POWERS[aw[ai].power];
      if(!d) continue;
      if(aw[ai].holder===s.human) say('You have been handed the '+d.name+'. '+d.long,'ev-power','power');
      else if(aw[ai].secrecy==='public') say(s.cast[aw[ai].holder].first+' has the '+d.name+'.','ev-power','power');
      else if(aw[ai].secrecy==='known') say('Somebody in this house has the '+d.name+'. Nobody is saying who.','ev-power','power');
      if(aw[ai].victim===s.human) say('Your vote has been taken off you this week. Nobody else knows.','ev-bad','broken');
    }
    var bb=s.events.filter(function(e){ return e.kind==='bounce_back'&&e.week===s.week; })[0];
    if(bb) say(s.cast[bb.who].name+' comes back through the door. Nobody expected to see them again.','hot');
    narrateRooms();
  }
  if(ph===R.PHASES.FALLOUT){
    /* GDD §22. Reported plainly, because the whole point is that you will not
       find out whether it worked until seven people vote. */
    var wo=s.events.filter(function(e){ return e.kind==='walkout'&&e.week===s.week&&!e.said; })[0];
    if(wo){
      wo.said=true;
      var wn=s.cast[wo.who].first;
      if(wo.kind==='own') say('You tell '+wn+' exactly why. They do not thank you for it and they do not forget it either.','','out');
      else if(wo.kind==='deflect') say('You tell '+wn+' it was not you. They believe it in the doorway.','quiet','out');
      else if(wo.kind==='goodbye') say('You say goodbye to '+wn+' and leave the game out of it.','ev-good','out');
      moment({kicker:'The doorway',icon:'out',tone:wo.kind==='own'?'':'good',
        title:'The last thing '+wn+' heard from you',
        sub:'They take it to the Panel. You will find out what it was worth when seven people vote.',
        faces:[{id:wo.who,tag:'On the Panel',col:COL.dim}]});
    }
  }
  if(ph===R.PHASES.CAPTAIN_ROOM){
    var cr=s.events.filter(function(e){ return e.kind==='captain_room'&&e.week===s.week&&!e.said; })[0];
    if(cr){
      cr.said=true;
      var g=cr.guests||[];
      var names=g.map(function(i){ return i===s.human?'you':s.cast[i].first; }).join(' and ');
      if(cr.captain===s.human){
        say(g.length?('You take '+names+' up first. '+tsay('roomYou')):'You go up alone and lock the door.',
          'ev-good','captain');
        if(g.length) moment({kicker:'The room',icon:'captain',tone:'good',
          title:'You take '+names+' up',
          sub:'Everybody else finds out about this from somebody who was there.',
          faces:g.map(function(i){ return {id:i,tag:'In the room',col:COL.ok}; })});
      } else if(g.indexOf(s.human)!==-1){
        say(tsay('roomInvited',{name:s.cast[cr.captain].first}),'ev-good','captain');
        moment({kicker:'The room',icon:'captain',tone:'good',
          title:s.cast[cr.captain].first+' takes you up',
          sub:'An hour of the only person in this house with power, and a door that locks.',
          faces:[{id:cr.captain,tag:'Captain',col:COL.blue}]});
      } else if(g.length){
        say(tsay('roomLeftOut',{name:s.cast[cr.captain].first})
          +' It was '+names+'.','quiet','eye');
      }
    }
  }
  if(ph===R.PHASES.CAPTAIN_COMP&&s.captainResult){
    var r=s.captainResult;
    /* Playtest: "after captain comp should be a popup that says who won", and
       "after HOH it should show the order of finish so you know how you did".
       Both were only ever a line of text in the log. */
    moment({kicker:'Captain Comp',icon:'captain',tone:s.captain===s.human?'good':'',
      title:(s.captain===s.human?'You take the Captaincy':s.cast[s.captain].first+' takes the Captaincy'),
      sub:r.name+'. '+(s.rations.length
        ? 'Rations go to '+s.rations.map(function(i){return s.cast[i].first;}).join(', ')+'.'
        : ''),
      rows:standings(r),
      faces:[{id:s.captain,tag:'Captain',col:COL.blue}]});
    say('Captain Comp: '+r.name+'.');
    say(s.captain===s.human?tsay('captainYou'):tsay('captainWon',{name:s.cast[s.captain].first}),'ev-vote','captain');
    if(s.rations.length) say(tsay('rations',{names:s.rations.map(function(i){return s.cast[i].first;}).join(', ')}),'quiet','rations');
    s.captainResult=null;
  }
  if(ph===R.PHASES.NAMING&&s.atRisk.length){
    moment({kicker:'Naming',icon:'risk',tone:'bad',
      title:(s.captain===s.human?'You name':s.cast[s.captain].first+' names')+' two At Risk',
      sub:'One of them is leaving unless the Veto changes it.',
      faces:s.atRisk.map(function(i){ return {id:i,tag:'At Risk',col:COL.signal}; })});
    say(s.captain===s.human
      ? tsay('namingYou',{a:s.cast[s.atRisk[0]].first,b:s.cast[s.atRisk[1]].first})
      : tsay('naming',{captain:s.cast[s.captain].first,a:s.cast[s.atRisk[0]].first,b:s.cast[s.atRisk[1]].first}),'ev-bad','risk');
    if(s.nomMode==='pawn') say(tsay(s.captain===s.human?'namingYouPawn':'namingPawn'),'quiet','risk');
    /* The speech, GDD §19.2. Reported for every Captain, not just the player,
       because the only value of a public statement of intent is that the whole
       house hears it. */
    if(s.speech){
      var you=s.captain===s.human;
      var bank={pawn:'speechPawn',threat:'speechThreat',personal:'speechPersonal',flat:'speechFlat'}[s.speech];
      say(tsay(bank+(you?'You':''),{captain:you?'You':s.cast[s.captain].first}),
        s.speech==='personal'?'hot':'quiet','risk');
    }
  }
  if(ph===R.PHASES.VETO_DRAW&&s.vetoFieldIds&&s.vetoFieldIds.length){
    /* Playtest: "it also didn't show who was playing for veto". */
    moment({kicker:'The draw',icon:'veto',
      title:'Playing for the Veto',
      sub:'The Captain and both At Risk, plus whoever came out of the draw.',
      faces:s.vetoFieldIds.map(function(i){
        return {id:i,tag:i===s.captain?'Captain':(s.atRisk.indexOf(i)!==-1?'At Risk':'Drawn')}; })});
  }
  if(ph===R.PHASES.VETO_COMP&&s.vetoResult){
    /* Playtest: "no popup that says who won veto. It should also tell you the
       comp even if you aren't playing." Both true: this was one grey line, and
       when the player was not drawn they never learned what was played. */
    var vr=s.vetoResult, played=s.vetoFieldIds&&s.vetoFieldIds.indexOf(s.human)!==-1;
    moment({kicker:'Veto Comp',icon:'veto',tone:s.vetoHolder===s.human?'good':'',
      title:(s.vetoHolder===s.human?'You take the Veto':s.cast[s.vetoHolder].first+' takes the Veto'),
      sub:vr.name+'. '+(played?'':'You were not drawn. It happened without you.'),
      rows:standings(vr),
      faces:[{id:s.vetoHolder,tag:'Holds it',col:COL.ok}]});
    say('Veto Comp: '+vr.name+'. '+s.cast[s.vetoHolder].first+' takes it.','ev-good','veto');
    s.vetoResult=null;
  }
  if(ph===R.PHASES.VETO_CEREMONY&&s.phase!==R.PHASES.VETO_CEREMONY){
    if(s.vetoUsed){
      var mf=[{id:s.saved,tag:'Saved',col:COL.ok}];
      if(s.replacement!=null) mf.push({id:s.replacement,tag:'Goes up',col:COL.signal});
      moment({kicker:'The ceremony',icon:'veto',tone:'good',
        title:(s.saved===s.vetoHolder
          ? s.cast[s.vetoHolder].first+' takes themselves off the block'
          : s.cast[s.vetoHolder].first+' saves '+s.cast[s.saved].first),
        sub:s.replacement!=null?(s.cast[s.captain].first+' has to name somebody else.'):'',
        faces:mf});
    } else {
      moment({kicker:'The ceremony',icon:'veto',
        title:s.cast[s.vetoHolder].first+' holds the Veto',
        sub:'The names stand.',
        faces:s.atRisk.map(function(i){ return {id:i,tag:'At Risk',col:COL.signal}; })});
    }
    if(s.vetoUsed){
      say(s.saved===s.vetoHolder
        ? tsay('vetoSelf',{holder:s.cast[s.vetoHolder].first})
        : tsay('vetoUsed',{holder:s.cast[s.vetoHolder].first,saved:s.cast[s.saved].first}),'ev-good','veto');
      if(s.replacement!=null) say(s.cast[s.captain].first+' names '+s.cast[s.replacement].first+' in their place.');
      if(s.backdoorLanded) say(tsay('backdoorLanded',{name:s.cast[s.replacement].first}),'hot','risk');
    } else {
      say(tsay('vetoHeld',{holder:s.cast[s.vetoHolder].first}),'','veto');
      /* A plan that needed the Veto used and did not get it. Only the Captain
         knows it was ever a plan, so only the Captain is told it died. */
      if(s.backdoor!=null&&s.captain===s.human) say(tsay('backdoorFailed'),'quiet','risk');
    }
  }
  var pl=s.events.filter(function(e){ return e.kind==='power_played'&&e.week===s.week&&!e.said; });
  for(var pi=0;pi<pl.length;pi++){
    pl[pi].said=true;
    var k=pl[pi].power, pd=PW.POWERS[k], who=s.cast[pl[pi].holder];
    if(!pd) continue;
    var pf=[{id:pl[pi].holder,tag:'Played it',col:COL.hand}];
    if(k==='diamond'){ pf.push({id:pl[pi].save,tag:'Saved',col:COL.ok});
      pf.push({id:pl[pi].replace,tag:'Goes up',col:COL.signal}); }
    if(k==='veto_pick') pf.push({id:pl[pi].pick,tag:'Chosen'});
    moment({kicker:'A power',icon:'power',tone:'power',title:pd.name,sub:pd.long,faces:pf});
    if(k==='safety') say((pl[pi].holder===s.human?'You are':who.first+' is')+' safe this week. The '+pd.name+' is spent.','ev-power','power');
    else if(k==='diamond') say(who.first+' plays the Diamond Veto. '+s.cast[pl[pi].save].first
      +' comes off, '+s.cast[pl[pi].replace].first+' goes up, and the Captain had no say in it.','ev-power','power');
    else if(k==='veto_pick') say(who.first+' picks '+s.cast[pl[pi].pick].first+' into the Veto Comp.','ev-power','power');
    else if(k==='back_to_back') say(who.first+' should not have been in that comp.','ev-power','power');
    else if(k==='extra_vote') say('The count came back one higher than it should have.','ev-power','power');
  }

  if(ph===R.PHASES.FALLOUT){
    var w=s.weeks[s.weeks.length-1];
    if(w&&w.blame&&w.blame.length){
      var mine=w.blame.filter(function(b){ return b.blamed===s.human; });
      if(mine.length) say('Somebody thinks you flipped.','ev-bad','broken');
    }
  }
}

/*
 * How everybody finished, as a table on the result card.
 *
 * comps.js has always returned a full ranking with scores; nothing had ever
 * shown it, so a player could win or lose a competition without any idea
 * whether it was close. Names only, no scores: the number is meaningless out of
 * context and the order is the whole story. Trimmed to the podium plus wherever
 * you came, because sixteen rows is not a card.
 */
function standings(res){
  if(!res||!res.ranking||!res.ranking.length) return null;
  var rows=[], mineAt=-1;
  for(var i=0;i<res.ranking.length;i++) if(res.ranking[i].id===s.human) mineAt=i;
  function line(i){
    var r=res.ranking[i];
    return [ordinal(r.place),
      s.cast[r.id].first+(r.id===s.human?' (you)':'')+(r.threw?', went out early':'')];
  }
  for(var j=0;j<Math.min(3,res.ranking.length);j++) rows.push(line(j));
  if(mineAt>=3){
    if(mineAt>3) rows.push(['','...']);
    rows.push(line(mineAt));
  }
  return rows;
}
function ordinal(n){
  if(n===1) return 'Won it';
  var t=n%100;
  if(t>=11&&t<=13) return n+'th';
  return n+({1:'st',2:'nd',3:'rd'}[n%10]||'th');
}

// ── input handlers ─────────────────────────────────────────────────────────
function handleNeed(need){
  saveRun();
  if(need.kind==='move_in') return showMoveIn(need);
  if(need.kind==='comp') return showComp(need);
  if(need.kind==='actions') return showScheming(need);
  if(need.kind==='power_safety') return showPowerSafety(need);
  if(need.kind==='power_veto_pick') return showPowerVetoPick(need);
  if(need.kind==='power_diamond') return showPowerDiamond(need);
  if(need.kind==='power_extra_vote') return showPowerExtraVote(need);
  if(need.kind==='captain_room') return showCaptainRoom(need);
  if(need.kind==='naming') return showNaming();
  if(need.kind==='veto_use') return showVetoUse();
  if(need.kind==='replacement') return showReplacement();
  if(need.kind==='vote') return showVote();
  if(need.kind==='walkout') return showWalkout(need);
  if(need.kind==='final3_pick') return showFinal3Pick();
  if(need.kind==='framing') return showFraming();
  R.step(s,null); pump();
}

function showMoveIn(need){

    title:'Fifteen strangers and a lot of cameras',
    body:[{t:need.beat.line,c:'q'}],
    choices:need.beat.options.map(function(o,i){
      return {label:o.t,go:function(){ answer({opt:i}); }};
    })

}

/*
 * THE CAPTAIN'S ROOM, GDD §19.1.
 *
 * The Captaincy used to be worth exactly two nominations. This is the other
 * half of it: a private space, and the choice of who gets to be in it. Two
 * people get an hour of you. The other twelve watched you pick.
 */
function showCaptainRoom(need){
  dock({label:'Take them up',off:true});
  var picked=[];
  function draw(){
    var left=need.take-picked.length;
    openCard({
      kicker:'You are Captain', role:'The room', icon:'captain', tone:'good',
      title:'Who comes up first',
      body:['A door that locks, a bed nobody else has slept in, and photographs of people who are not in this house.',
        {t:left?('Room for '+left+' more.'):'The rest of the house finds out about this afterwards.',c:'d'}],
      pick:{pool:need.pool,selected:picked,go:function(id){
        var i=picked.indexOf(id);
        if(i>=0) picked.splice(i,1); else if(picked.length<need.take) picked.push(id);
        draw();
      }},
      choices:[{label:'Take them up',cls:'go',off:!picked.length,
        note:'They will remember it. So will everybody you did not ask.',
        go:function(){ answer({guests:picked}); }}],
      foot:{label:'Sit up there on your own',go:function(){ answer({guests:[]}); }}
    });
  }
  draw();
}

/*
 * Naming, in three cards. Pick two, say who you are actually after, then say
 * something about it in front of the whole house.
 *
 * The second card is the whole strategy layer: picking somebody who is NOT on
 * the block is the backdoor, and there is no separate button for it on purpose,
 * because the plan only exists while the Veto has not happened yet.
 */
function showNaming(){
  dock({label:'Name them',off:true});
  var picked=[], want=null;

  function step1(){
    openCard({
      kicker:'You are Captain', role:'Naming', icon:'risk', tone:'bad',
      title:'Name two At Risk',
      body:['Both of them will remember it, and one of them is staying.',
            picked.length===2?{t:'On the block: '+s.cast[picked[0]].first+' and '+s.cast[picked[1]].first,c:'d'}
              :{t:picked.length?'One more.':'Choose two.',c:'d'}],
      pick:{pool:others(),selected:picked,block:picked,go:function(id){
        var i=picked.indexOf(id);
        if(i>=0) picked.splice(i,1); else if(picked.length<2) picked.push(id);
        step1();
      }},
      choices:[{label:'Name them',cls:'go',off:picked.length<2,go:function(){
        want=picked[0]; step2(); }}]
    });
  }

  function step2(){
    var back=picked.indexOf(want)===-1;
    var pawn=picked.filter(function(i){ return i!==want; })[0];
    openCard({
      kicker:'You are Captain', role:back?'Backdoor':'Straight shot', icon:'eye',
      tone:back?'bad':'',
      title:'Who do you actually want gone',
      body:[
        'The house reads the room, not the speech. Whoever you are after is who the votes will drift toward.',
        back
          ? {t:s.cast[want].first+' is not on the block. You need the Veto used to open the seat, or this week is wasted.',c:'q'}
          : (pawn!=null?{t:s.cast[pawn].first+' is the pawn. Sitting beside somebody the house wants gone is how a pawn survives.',c:'q'}
             :{t:'A straight shot at the person you named.',c:'q'})
      ],
      rows:[['On the block',picked.map(function(i){ return s.cast[i].first; }).join(' and ')],
            ['Your target',s.cast[want].first]],
      pick:{pool:others(),selected:[want],block:picked,go:function(id){
        want=id; step2(); }},
      choices:[{label:back?'Set the trap':'Lock it in',cls:'go',go:step3}],
      foot:{label:'Change the names',go:step1}
    });
  }

  /*
   * The speech, GDD §19.2. The only public statement of intent in the format,
   * and the game had none of it: two names appeared and the house guessed.
   *
   * The pawn line is the interesting one, because the house checks it. Calling
   * somebody a formality when there is no formality is a lie told standing up
   * in front of everybody, and it is priced that way.
   */
  function step3(){
    var pawn=picked.filter(function(i){ return i!==want; })[0];
    var back=picked.indexOf(want)===-1;
    var real=!back&&pawn!=null;
    openCard({
      kicker:'You are Captain', role:'The speech', icon:'risk', tone:'bad',
      title:'You have to say something',
      body:['Everybody is sitting down and looking at you. What you say now is the only thing the house hears from you all week.'],
      rows:[['On the block',picked.map(function(i){ return s.cast[i].first; }).join(' and ')],
            ['After',back?s.cast[want].first+', if the Veto opens the seat':s.cast[want].first]],
      choices:[
        {label:'One of you is a formality',
         note:real?'Softens '+s.cast[pawn].first+' and points the room at '+s.cast[want].first+'.'
           :'There is no formality here. If the room works that out it costs you with all of them.',
         go:function(){ answer({noms:picked,target:want,speech:'pawn'}); }},
        {label:'I am going after the biggest game in here',
         note:'Flatters '+s.cast[back?picked[0]:want].first+' and hardens them. Everybody else hears the word threat and keeps it.',
         go:function(){ answer({noms:picked,target:want,speech:'threat'}); }},
        {label:'Make it personal',
         note:'Cheapest with the room, worst with the two of them. They will not forget the wording.',
         go:function(){ answer({noms:picked,target:want,speech:'personal'}); }},
        {label:'Eleven words and sit down',
         note:'Nothing to argue with. Nothing given away either.',
         go:function(){ answer({noms:picked,target:want,speech:'flat'}); }}
      ],
      foot:{label:'Back to the target',go:step2}
    });
  }
  step1();
}

function showVetoUse(){
  dock({label:'The Veto',off:true});
  var mine=s.atRisk.indexOf(s.human)!==-1;
  openCard({
    kicker:'You hold the Veto', role:'Ceremony', icon:'veto', tone:'good',
    title:'Use it, or sit on it',
    body:['Use it and the Captain has to name somebody else. They will know exactly who cost them their week.'],
    faces:s.atRisk.map(function(i){ return {id:i,tag:i===s.human?'You':'At Risk',col:COL.signal}; }),
    choices:s.atRisk.map(function(id){
      return {label:id===s.human?'Take yourself off':'Save '+s.cast[id].first,
        cls:id===s.human?'go':'',
        note:id===s.human?'Nobody has ever been blamed for this one.'
          :'They owe you. The Captain will not.',
        go:function(){ answer({save:id}); }};
    }),
    foot:{label:mine?'Leave the names alone':'Hold it and stay clean',
      go:function(){ answer({save:null}); }}
  });
}

function showReplacement(){
  dock({label:'Name a replacement',off:true});
  var pool=s.replacementPool;
  openCard({
    kicker:'You are Captain', role:'Replacement', icon:'risk', tone:'bad',
    title:'Somebody has to go up',
    body:['The Veto took one of yours off the block. This one has no chance to play for it.'],
    pick:{pool:pool,go:function(id){
      if(pool.indexOf(id)!==-1){ answer({replacement:id}); } }}
  });

function showVote(){
  dock({label:'Cast it',off:true});
  /*
   * Everything you need, at the sharpest moment in the week.
   *
   * Playtest: "I like how it says who is closest and farthest from you now.
   * Let's lean into these kinds of things to help make decisions easier." This
   * is where it matters most. Each name now carries how they read on you,
   * whether you are in a room with them, how stale that read is, and how the
   * count is going, so the vote is a judgement rather than a coin toss between
   * two strangers.
   */
  var tally={}, heard=0;
  s.atRisk.forEach(function(i){ tally[i]=0; });
  R.whipCount(s).forEach(function(r){
    if(r.quiet||r.says==null) return;
    if(tally[r.says]!=null){ tally[r.says]++; heard++; }
  });
  openCard({
    kicker:'The vote', role:'Anonymous', icon:'vote',
    title:'Cast your vote',
    body:['The tally gets read out. The names never do.',
      heard?{t:'Of the '+heard+' who would tell you, '
        +s.atRisk.map(function(i){ return tally[i]+' said '+s.cast[i].first; }).join(' and ')
        +'.',c:'d'}
        :{t:'Nobody would tell you which way they are going.',c:'d'}],
    faces:s.atRisk.map(function(i){ return {id:i,tag:'At Risk',col:COL.signal}; }),
    choices:s.atRisk.map(function(id){
      var rd=E.read(s.rel,s.human,id);
      var room=E.sharedAlliances(s.alliances,s.human,id).filter(function(a){ return a.alive; }).length;
      var bits=[rd.band.label+' on you'];
      if(room) bits.push('in a room with you');
      if(rd.freshness!=='current') bits.push('read is '+rd.freshness);
      if(tally[id]) bits.push(tally[id]+' said they would');
      return {label:'Evict '+s.cast[id].first,cls:'hot',
        note:bits.join(', '),
        go:function(){ answer({vote:id}); saveRun(); showVoteReveal(); }};
    })
  });
}

/*
 * WALKING SOMEBODY OUT, GDD §22.
 *
 * Jury management used to be one binary choice in the last five minutes of a
 * run. This is the other fourteen: the person you just cut is standing in the
 * doorway, they are about to spend nine weeks on a Panel with nothing to do but
 * compare notes, and what you say now is the last thing they take with them.
 *
 * Only offered when you actually had a hand in it. Watching somebody go does
 * not earn you a speech.
 */
function showWalkout(need){
  dock({label:'Say it',off:true});
  var nm=s.cast[need.who].first;
  /* The read is the decision. Owning a cut is worth a lot to somebody who came
     here to play and costs you with somebody who came here for the people, and
     measured across a thousand runs a player who reads it takes 3.15 of seven
     Panel votes against 3.01 for one who always owns it and 2.80 for one who
     says nothing. Hiding the read would make this a coin flip. */
  var wants=need.wants;
  var read=wants==='game'
    ? nm+' came here to play. They will respect a reason and resent being handled.'
    : wants==='people'
      ? nm+' came here for the people in it. A strategy lecture in a doorway will not land.'
      : nm+' could go either way on this.';
  openCard({
    kicker:'The doorway', role:'Last word', icon:'out', tone:'bad',
    title:nm+' is going, and they know it was partly you',
    body:['They will be sitting on the Panel in a few weeks with a vote and a long memory.',
      {t:read,c:'q'}],
    faces:[{id:need.who,tag:'Evicted',col:COL.signal}],
    choices:[
      {label:'Tell them exactly why',cls:wants==='game'?'go':'',
       note:wants==='game'?'This is what they want to hear.'
         :wants==='people'?'They did not ask for the strategy. They asked why you.'
         :'Respected by some of them, resented by the rest.',
       go:function(){ answer({walkout:'own'}); }},
      {label:'No strategy. Just say goodbye',cls:wants==='people'?'go':'',
       note:wants==='people'?'This is what they want to hear.'
         :'Small, and it never backfires. It also does not answer the question they are asking.',
       go:function(){ answer({walkout:'goodbye'}); }},
      {label:'It was not me',
       note:'It buys you their vote, right up until the jury house compares notes.',
       go:function(){ answer({walkout:'deflect'}); }}
    ],
    foot:{label:'Say nothing at all',go:function(){ answer({walkout:'nothing'}); }}
  });
}

function showFinal3Pick(){
  dock({label:'Choose',off:true});
  var pool=R.activeIds(s).filter(function(i){ return i!==s.human; });
  openCard({
    kicker:'Final Three', role:'Your call', icon:'captain', tone:'good',
    title:'You won the last one',
    body:['Pick who sits beside you. The other one joins the Panel and gets a vote on which of you deserves it.'],
    pick:{pool:pool,go:function(id){ answer({keep:id}); }}
  });

function showFraming(){

  openCard({

    title:'How are you playing it',

      {label:'Own it',note:'Every move was yours and you would make them again. The strategists respect it. The ones you cut will not.',
