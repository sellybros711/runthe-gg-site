/* Each minigame returns 0..100. comps.js blends that with the build at
   HUMAN_SKILL_WEIGHT, so hands matter and the tree matters. Adding a comp is
   adding a case here plus a row in comps.js, and it never touches the engine. */
function startMinigame(comp,done){
  var st=document.getElementById('stage');
  var k=comp.kind;
  if(k==='reaction') return mgReaction(st,done);
  if(k==='memory') return mgMemory(st,done);
  if(k==='hold') return mgHold(st,done);
  if(k==='slider') return mgSlider(st,done);
  if(k==='trivia') return mgTrivia(st,done);
  if(k==='nerve') return mgNerve(st,done);
  if(k==='tightrope') return mgTightrope(st,done);
  if(k==='grip') return mgGrip(st,done);
  return mgRandom(st,done);
}

function mgReaction(st,done){
  var round=0,total=0,rounds=3,t0=0,armed=false,timer=null;
  function next(){
    if(round>=rounds){ done(Math.max(0,Math.min(100,total/rounds))); return; }
    st.innerHTML='<h2>Hair Trigger</h2><div class="blurb">Round '+(round+1)+' of '+rounds+'. '
      +'Wait for it. Going early costs you the round.</div>'
      +'<div class="rbox" id="rb">WAIT</div>';
    var rb=document.getElementById('rb');
    armed=false;
    timer=setTimeout(function(){ armed=true; t0=Date.now(); rb.className='rbox go'; rb.textContent='NOW'; },
      900+Math.random()*2200);
    rb.onpointerdown=function(){
      if(!armed){ clearTimeout(timer); rb.className='rbox bad'; rb.textContent='TOO EARLY';
        round++; total+=8; setTimeout(next,700); return; }
      var ms=Date.now()-t0;
      /* 180ms is a very good human; 600ms is asleep. */
      var sc=Math.max(0,Math.min(100,100-(ms-180)/4.2));
      total+=sc; round++;
      rb.className='rbox'; rb.textContent=ms+' ms';
      setTimeout(next,650);
    };
  }
  next();
}

function mgMemory(st,done){
  var len=3,best=0,seq=[],idx=0,lock=true;
  function show(){
    seq=[]; for(var i=0;i<len;i++) seq.push(Math.floor(Math.random()*9));
    st.innerHTML='<h2>The Long Hallway</h2><div class="blurb">Watch, then repeat. '
      +'Length '+len+'.</div><div class="padgrid" id="pg">'
      +Array.apply(null,Array(9)).map(function(_,i){ return '<div class="pad" data-p="'+i+'"></div>'; }).join('')
      +'</div>';
    var pads=app.querySelectorAll('[data-p]');
    lock=true; idx=0;
    seq.forEach(function(v,i){
      setTimeout(function(){ pads[v].classList.add('lit');
        setTimeout(function(){ pads[v].classList.remove('lit'); },330); }, 480*i+260);
    });
    setTimeout(function(){
      lock=false;
      Array.prototype.forEach.call(pads,function(el){
        el.onpointerdown=function(){
          if(lock) return;
          var v=Number(el.dataset.p);
          el.classList.add('hit'); setTimeout(function(){ el.classList.remove('hit'); },140);
          if(v!==seq[idx]){ lock=true; finish(); return; }
          idx++;
          if(idx>=seq.length){ lock=true; best=len; len++;
            if(len>7){ finish(); return; }
            setTimeout(show,420); }
        };
      });
    },480*seq.length+320);
  }
  function finish(){
    /* 3 is a floor, 7 is exceptional. */
    done(Math.max(0,Math.min(100,(best-2)/5*100)));
  }
  show();
}

function mgHold(st,done){
  var start=0,held=0,running=false,raf=null,target=14000;
  st.innerHTML='<h2>Dead Weight</h2><div class="blurb">Hold it down. Let go and it is over. '
    +'The house will try to make you let go.</div>'
    +'<div class="holdpad" id="hp">HOLD</div>'
    +'<div class="meterwrap"><div class="meter" id="mt"></div></div>';
  var hp=document.getElementById('hp'), mt=document.getElementById('mt');
  function tick(){
    held=Date.now()-start;
    mt.style.width=Math.min(100,held/target*100)+'%';
    /* Distraction escalates. Nothing here changes the score, it only makes the
       pad harder to keep a finger on, which is the whole comp. */
    var jitter=Math.min(20,held/900);
    hp.style.transform='translate('+(Math.random()*jitter-jitter/2).toFixed(1)+'px,'
      +(Math.random()*jitter-jitter/2).toFixed(1)+'px)';
    if(held>=target){ stop(); return; }
    raf=requestAnimationFrame(tick);
  }
  function stop(){
    if(!running) return; running=false; cancelAnimationFrame(raf);
    hp.classList.remove('on'); hp.textContent='DONE';
    done(Math.max(0,Math.min(100,held/target*100)));
  }
  hp.onpointerdown=function(){ if(running) return; running=true; start=Date.now();
    hp.classList.add('on'); hp.textContent='HOLDING'; tick(); };
  hp.onpointerup=stop; hp.onpointerleave=stop; hp.onpointercancel=stop;
}

function mgSlider(st,done){
  st.innerHTML='<h2>Level Head</h2><div class="blurb">Hold the marker in the band. '
    +'Press and hold to push it right. It falls left on its own.</div>'
    +'<div class="track" id="tk"><div class="zone"></div><div class="mk" id="mk"></div></div>'
    +'<div class="meterwrap"><div class="meter" id="mt"></div></div>';
  var tk=document.getElementById('tk'), mk=document.getElementById('mk'), mt=document.getElementById('mt');
  var pos=50,vel=0,push=false,inZone=0,elapsed=0,last=Date.now(),dur=15000,raf=null;
  function tick(){
    var now=Date.now(), dt=Math.min(60,now-last); last=now; elapsed+=dt;
    var drift=-0.020-Math.sin(elapsed/1400)*0.014;
    vel+=(push?0.052:0)+drift;
    vel*=0.94; pos+=vel*dt*0.75;
    if(pos<0){pos=0;vel=0;} if(pos>100){pos=100;vel=0;}
    if(pos>=42&&pos<=58) inZone+=dt;
    mk.style.left='calc('+pos+'% - 2px)';
    mt.style.width=(elapsed/dur*100)+'%';
    if(elapsed>=dur){ cancelAnimationFrame(raf); done(Math.max(0,Math.min(100,inZone/dur*135))); return; }
    raf=requestAnimationFrame(tick);
  }
  tk.onpointerdown=function(){push=true;}; tk.onpointerup=function(){push=false;};
  tk.onpointerleave=function(){push=false;}; tk.onpointercancel=function(){push=false;};
  tick();
}

/* Trivia is built from the WeekLog, which GDD §13 says it powers. The questions
   only exist because the run happened. */
function mgTrivia(st,done){
  var qs=buildTrivia();
  if(!qs.length){ done(45); return; }
  var i=0,right=0;
  function ask(){
    if(i>=qs.length){ done(Math.max(0,Math.min(100,right/qs.length*100))); return; }
    var q=qs[i];
    st.innerHTML='<h2>House Rules</h2><div class="blurb">'+esc(q.q)+'</div>'
      +'<div class="qbtns">'+q.opts.map(function(o,n){
        return '<button class="choice" data-q="'+n+'"><b>'+esc(o)+'</b></button>'; }).join('')+'</div>'
      +'<div class="blurb">'+(i+1)+' of '+qs.length+'</div>';
    Array.prototype.forEach.call(app.querySelectorAll('[data-q]'),function(el){
      el.onclick=function(){
        if(q.opts[Number(el.dataset.q)]===q.a) right++;
        i++; ask();
      };
    });
  }
  ask();
}
function buildTrivia(){
  var out=[], rng=s.rng.comp;
  var pool=s.weeks.filter(function(w){ return !w.final3&&w.evicted!=null; });
  for(var n=0;n<Math.min(4,pool.length);n++){
    var w=pool[Math.floor(rng()*pool.length)];
    var kind=Math.floor(rng()*2);
    var ans,q;
    if(kind===0){ ans=s.cast[w.evicted].first; q='Who was evicted in week '+w.week+'?'; }
    else { ans=s.cast[w.captain].first; q='Who was Captain in week '+w.week+'?'; }
    var opts=[ans];
    var others=s.cast.filter(function(p){ return p.first!==ans; });
    while(opts.length<4&&others.length){
      var pick=others.splice(Math.floor(rng()*others.length),1)[0];
      if(opts.indexOf(pick.first)===-1) opts.push(pick.first);
    }
    rng.shuffle(opts);
    out.push({q:q,a:ans,opts:opts});
  }
  return out;
}

/* Push your luck. Every card is worth more than the last and one of them ends
   the run. The decision is when to stop, which is the same decision the game
   asks everywhere else. */
function mgNerve(st,done){
  var banked=0,turned=0,dead=false;
  var risk=function(n){ return Math.min(0.55,0.10+n*0.055); };
  function paint(msg){
    st.innerHTML='<h2>Nerve</h2>'
      +'<div class="blurb">'+(msg||'Each card is worth more than the last. One of them is not a card.')+'</div>'
      +'<div class="rbox'+(dead?' bad':'')+'" id="rb">'+(dead?'GONE':banked+' BANKED')+'</div>'
      +'<div class="blurb">'+turned+' turned</div>';
    if(dead) return;
    document.getElementById('rb').onpointerdown=turn;
  }
  function turn(){
    if(dead) return;
    if(Math.random()<risk(turned)){ dead=true; banked=Math.round(banked*0.25); paint('That was the one.');
      setTimeout(function(){ done(Math.max(0,Math.min(100,banked))); },900); return; }
    turned++; banked+=6+turned*3;
    if(banked>=100||turned>=12){ paint('You have taken everything there is.');
      setTimeout(function(){ done(Math.min(100,banked)); },700); return; }
    paint();
  }
  paint();
  setBar('Nerve',[{label:'Bank it',cls:'go',go:function(){ if(!dead){ dead=true; done(Math.min(100,banked)); } }}]);
}

/* Stop a sweeping marker inside a target that shrinks each round. */
function mgTightrope(st,done){
  var round=0,rounds=5,score=0,raf=null,pos=0,dir=1,running=false;
  function width(){ return 26-round*4; }
  function next(){
    if(round>=rounds){ done(Math.max(0,Math.min(100,score/rounds))); return; }
    st.innerHTML='<h2>Tightrope</h2><div class="blurb">Round '+(round+1)+' of '+rounds
      +'. Stop it in the gap.</div>'
      +'<div class="track" id="tk"><div class="zone" id="zn"></div><div class="mk" id="mk"></div></div>'
      +'<div class="blurb">'+Math.round(score/Math.max(1,round))+' average</div>';
    var zn=document.getElementById('zn'), mk=document.getElementById('mk'), tk=document.getElementById('tk');
    zn.style.left=(50-width()/2)+'%'; zn.style.width=width()+'%';
    pos=0; dir=1; running=true;
    var speed=0.9+round*0.35;
    (function tick(){
      if(!running) return;
      pos+=dir*speed; if(pos>100){pos=100;dir=-1;} if(pos<0){pos=0;dir=1;}
      mk.style.left='calc('+pos+'% - 2px)';
      raf=requestAnimationFrame(tick);
    })();
    tk.onpointerdown=function(){
      if(!running) return; running=false; cancelAnimationFrame(raf);
      var off=Math.abs(pos-50), half=width()/2;
      score+=off<=half?Math.max(35,100-(off/half)*55):Math.max(0,30-off);
      round++; setTimeout(next,420);
    };
  }
  next();
}

/* Alternate two pads without breaking rhythm. Mistiming costs more than being
   slow, which is what makes it precision as well as physical. */
function mgGrip(st,done){
  var want='l',hits=0,breaks=0,start=0,dur=12000,raf=null,last=0,gaps=[];
  st.innerHTML='<h2>White Knuckle</h2><div class="blurb">Alternate. Left, right, left, right. '
    +'Twelve seconds.</div>'
    +'<div class="padgrid" style="grid-template-columns:repeat(2,96px)">'
    +'<div class="pad lit" data-g="l" style="aspect-ratio:1/1"></div>'
    +'<div class="pad" data-g="r" style="aspect-ratio:1/1"></div></div>'
    +'<div class="meterwrap"><div class="meter" id="mt"></div></div>';
  var pads=app.querySelectorAll('[data-g]'), mt=document.getElementById('mt');
  function light(){ Array.prototype.forEach.call(pads,function(p){
    p.classList.toggle('lit',p.dataset.g===want); }); }
  function tick(){
    var el=Date.now()-start; mt.style.width=Math.min(100,el/dur*100)+'%';
    if(el>=dur){ finish(); return; }
    raf=requestAnimationFrame(tick);
  }
  function finish(){
    cancelAnimationFrame(raf);
    /* Rhythm matters: steady gaps score better than a fast burst and a stall. */
    var mean=gaps.length?gaps.reduce(function(a,b){return a+b;},0)/gaps.length:1000;
    var vary=gaps.length>1?Math.sqrt(gaps.reduce(function(a,g){return a+(g-mean)*(g-mean);},0)/gaps.length):400;
    var rate=Math.min(1,hits/46);
    var steady=Math.max(0,1-vary/260);
    done(Math.max(0,Math.min(100,(rate*72+steady*28)-breaks*2.5)));
  }
  Array.prototype.forEach.call(pads,function(p){
    p.onpointerdown=function(){
      if(!start){ start=Date.now(); last=start; tick(); }
      if(p.dataset.g===want){
        var now=Date.now(); if(hits>0) gaps.push(now-last); last=now;
        hits++; want=want==='l'?'r':'l'; light();
      } else breaks++;
    };
  });
}

function mgRandom(st,done){
  st.innerHTML='<h2>Draw</h2><div class="blurb">No skill in it. Somebody still walks away with the power.</div>'
    +'<div class="rbox" id="rb">DRAW</div>';
  document.getElementById('rb').onpointerdown=function(){
    var v=Math.random()*100;
    this.textContent=v>66?'GOOD DRAW':v>33?'MIDDLING':'POOR DRAW';
    setTimeout(function(){ done(v); },800);
  };
}

// ── the vote reveal ────────────────────────────────────────────────────────
/* The one place the game slows down, GDD §17. Anonymous: the tally builds one
   mark at a time and no name is ever attached to a vote. */
function showVoteReveal(){
  screen='vote';
  var res=s.evictionResult;
  if(!res||!res.votes.length){ screen='phase'; R.step(s,null); pump(); return; }
  var atRisk=s.atRisk.slice();
  var counts={}; atRisk.forEach(function(id){ counts[id]=0; });
  var order=res.votes.slice();
  var i=0, timer=null;

  function paint(reveal){
    app.innerHTML=topbar()
      +'<div class="file"><h2>The vote</h2><div class="sub">'+esc(STR.S.voteOpen[0])+'</div>'
      +'<div class="tallywrap">'+atRisk.map(function(id){
        var out=reveal&&res.evicted===id;
        var rd=readOf(id);
        var col=rd?U.bandColor(rd.band.label):'#e7e2d7';
        /* The face and the colour, not just a name. A player should be able to
           feel which of these two they can afford to lose without reading. */
        return '<div class="tcol'+(out?' out':'')+'">'
          +'<div class="tface" style="border-color:'+(out?'var(--signal)':col)+'">'+avatar(s.cast[id],96)+'</div>'
          +'<div class="who">'+esc(s.cast[id].first)+(id===s.human?' (you)':'')+'</div>'
          +(rd?'<div class="tband" style="color:'+col+'">'+esc(rd.band.label)+'</div>':'<div class="tband">&nbsp;</div>')
          +'<div class="marks">'+marks(counts[id])+'</div></div>';
      }).join('')+'</div>'
      +(reveal?'<div style="text-align:center;color:var(--signal);font-family:var(--disp);'
        +'font-size:20px;letter-spacing:.1em;text-transform:uppercase">'
        +esc(res.evicted===s.human?'You are evicted':s.cast[res.evicted].name+' is evicted')+'</div>':'')
      +'</div>'+renderFeed();
    scrollFeed();
  }
  function marks(n){
    var o='';
    for(var j=0;j<n;j++) o+=(j>0&&j%5===0?' ':'')+'|';
    return o||'.';
  }
  /* Deliberate, but not punishing. At 760ms a twelve vote tally took ten
     seconds and there are thirteen of them in a run, which is over two minutes
     of a twenty five minute session spent watching marks appear. Tapping
     anywhere drops the rest at once. */
  function skip(){
    while(i<order.length){ counts[order[i].target]++; i++; }
    if(timer) clearTimeout(timer);
    step();
  }
  function step(){
    if(i>=order.length){
      if(res.tieBreak!=null) say(s.cast[res.tieBreak].first+' breaks the tie.','hot');
      paint(true);
      say(res.evicted===s.human?tsay('evictedYou'):tsay('evicted',{name:s.cast[res.evicted].name}),'ev-bad','out');
      setBar('',[{label:'Continue',cls:'go',go:function(){
        screen='phase'; R.step(s,null); saveRun(); pump(); }}]);
      return;
    }
    counts[order[i].target]++;
    i++;
    paint(false);
    timer=setTimeout(step,520);
  }
  setBar('',[{label:'Read it out',go:skip}]);
  paint(false);
  timer=setTimeout(step,640);
}

// ── results ────────────────────────────────────────────────────────────────
function finishRun(){
  if(!s.awarded){
    s.awarded=true;
    var place=s.result.playerPlace;
    account.xp=(account.xp||0)+T.xpForFinish(place);
    var c=account.career||{runs:0,wins:0,panels:0,placeSum:0,bestPlace:null};
    c.runs=(c.runs||0)+1; c.placeSum=(c.placeSum||0)+place;
    if(place===1) c.wins=(c.wins||0)+1;
    if(place<=8) c.panels=(c.panels||0)+1;
    c.bestPlace=c.bestPlace==null?place:Math.min(c.bestPlace,place);
    account.career=c; saveAccount(); clearRun();
  }
  screen='results'; render();
}

function renderRecap(){
  var rec=RC.build(s);
  var me=s.cast[s.human];

  var weeks=rec.weeks.map(function(w){
    var tags='';
    if(w.broken) tags+='<span class="pip risk">'+w.broken+' broke a promise</span>';
    if(w.powers&&w.powers.length) tags+='<span class="pip veto">power</span>';
    if(w.evicted===s.human) tags+='<span class="pip risk">you</span>';
    var body=''
      +(w.beats||[]).map(function(b){ return '<p class="b">'+esc(b)+'</p>'; }).join('')
      +((w.powers&&w.powers.length)?'<h4>Powers</h4>'+w.powers.map(function(p){ return '<p class="pw">'+esc(p)+'</p>'; }).join(''):'')
      +((w.votes&&w.votes.length)?'<h4>The vote, with names on it</h4>'+w.votes.map(function(v){
          return '<p class="v'+(v.broke?' broke':'')+(v.target===s.human||v.voter===s.human?' you':'')+'">'+esc(v.text)+'</p>'; }).join(''):'')
      +((w.blame&&w.blame.length)?'<h4>Who got blamed</h4>'+w.blame.map(function(b){
          return '<p class="b">'+esc(b.text)+' '+(b.correct?'They were right.':'They were wrong.')+'</p>'; }).join(''):'');
    return '<details class="wk"'+(w.evicted===s.human?' open':'')+'><summary>'
      +'<span class="no">Week '+w.week+'</span><span class="hl">'+esc(w.headline)+'</span>'
      +'<span class="tags">'+tags+'</span></summary>'
      +'<div class="body">'+body+'</div></details>';
  }).join('');

  var chain=rec.chain.map(function(c){
    var cls=c.kind==='exit'||c.kind==='result'?'big':(c.good?'good':'');
    return '<p class="'+cls+'">'+esc(c.text)+(c.detail?'<small>'+esc(c.detail)+'</small>':'')+'</p>';
  }).join('');

  var tl=rec.alliances.map(function(a){
    return '<div class="a'+(a.hadYou?' mine':'')+'">'
      +'<b>'+esc(a.members.join(', '))+'</b>'
      +'<i>week '+a.formed+(a.alive?' to the end':(a.died?' to '+a.died:''))+'</i>'
      +'<i>'+(a.hadYou?'yours':(a.youKnew?'you knew':'you never knew'))+'</i></div>';
  }).join('')||'<div class="a"><b>Nobody formalised anything.</b></div>';

  var pw=rec.powers.map(function(p){
    return '<tr><td>'+esc(p.name)+'</td><td>'+esc(p.holder)+(p.wasYou?' (you)':'')+'</td>'
      +'<td>week '+p.week+'</td><td>'+(p.used?'played week '+p.usedWeek:'never played')+'</td>'
      +'<td>'+(p.victim?esc(p.victim)+(p.victimWasYou?' (you)':'')+' lost a vote':'')+'</td></tr>';
  }).join('');

  app.innerHTML=''
   +'<div class="topbar"><span class="wk" style="font-family:var(--disp)">The Recap</span>'
   +'<span class="ph">Seed '+esc(s.seed)+'</span></div>'
   +'<div class="chain"><h2>'+(me.place===1?'How you won':'How it ended')+'</h2>'+chain+'</div>'
   +'<div class="file"><h2>Every week, with the names on the votes</h2>'
   +'<div class="sub">During the run the tally was anonymous. It is not any more.</div></div>'
   +weeks
   +'<div class="file" style="margin-top:20px"><h2>Alliances</h2>'
   +'<div class="sub">Including the ones you never found out about.</div>'
   +'<div class="tl">'+tl+'</div></div>'
   +(pw?'<div class="file"><h2>Powers</h2><div class="scroll"><table class="truth">'
     +'<thead><tr><th>Power</th><th>Held by</th><th>Awarded</th><th>Used</th><th>Cost</th></tr></thead>'
     +'<tbody>'+pw+'</tbody></table></div></div>':'')
   +'<div class="file"><h2>What you actually knew</h2>'
   +'<div class="sub">You misread '+rec.stats.misread+' of the other fifteen, and '
   +rec.stats.flattered+' of them let you think better of them than they thought of you.</div>'
   +'<div class="scroll"><table class="truth"><thead><tr>'
   +'<th>Name</th><th>Build</th><th>You believed</th><th>The truth</th><th>Place</th></tr></thead><tbody>'
   +rec.reads.map(function(r){
      return '<tr><td>'+esc(r.name)+'</td><td>'+esc(r.archetype)+'</td>'
        +'<td>'+esc(r.believed.label)+'</td>'
        +'<td class="'+(r.wrong?'wrong':'')+'">'+esc(r.truth.label)+'</td>'
        +'<td class="r">'+(r.place||'')+'</td></tr>'; }).join('')
   +'</tbody></table></div></div>';
  setBar('',[{label:'Back to the results',go:function(){ screen='results'; render(); }},
             {label:'Back to the file',cls:'go',go:function(){ screen='title'; render(); }}]);
}

function renderResults(){
  var res=s.result, me=s.cast[s.human];
  var jurors=res.detail.map(function(d){
    return '<tr><td>'+esc(s.cast[d.juror].name)+'</td><td>'+esc(s.cast[d.voted].first)+'</td></tr>';
  }).join('');

  /* The truth reveal. Everything the run kept from you, side by side with what
     you believed. This is the payoff for the whole belief layer. */
  var truth=s.cast.filter(function(p){ return p.id!==s.human; }).map(function(p){
    var believed=E.band(s.rel.belief[s.human][p.id].v);
    var actual=E.band(s.rel.trust[p.id][s.human]);
    var wrong=believed.label!==actual.label;
    return '<tr><td>'+esc(p.name)+'</td><td>'+esc(p.archetype)+'</td>'
      +'<td>'+esc(believed.label)+'</td>'
      +'<td class="'+(wrong?'wrong':'')+'">'+esc(actual.label)+'</td>'
      +'<td class="r">'+(p.place||'')+'</td></tr>';
  }).join('');

  var wrongCount=s.cast.filter(function(p){
    return p.id!==s.human
      && E.band(s.rel.belief[s.human][p.id].v).label!==E.band(s.rel.trust[p.id][s.human]).label;
  }).length;

  app.innerHTML=''
   +'<div class="topbar"><span class="wk">'+(me.place===1?'You won':'Place '+me.place)+'</span>'
   +'<span class="ph">Seed '+esc(s.seed)+'</span></div>'
   +'<div class="file"><h2>'+esc(s.cast[res.winner].name)+' takes it</h2>'
   +'<div class="sub">'+esc(s.cast[res.winner].archetype)+', '
   +s.cast[res.winner].compWins.length+' comp wins, '
   +s.cast[res.winner].weeksAsCaptain+' weeks as Captain, At Risk '+s.cast[res.winner].timesAtRisk+' times.</div>'
   +'<div class="scroll"><table class="truth"><thead><tr><th>Juror</th><th>Voted</th></tr></thead>'
   +'<tbody>'+jurors+'</tbody></table></div></div>'
   +'<div class="file"><h2>What you actually knew</h2>'
   +'<div class="sub">You misread '+wrongCount+' of the other fifteen. '
   +'The right hand column is what they really thought of you.</div>'
   +'<div class="scroll"><table class="truth"><thead><tr>'
   +'<th>Name</th><th>Build</th><th>You believed</th><th>The truth</th><th>Place</th>'
   +'</tr></thead><tbody>'+truth+'</tbody></table></div></div>'
   +'<div class="file"><h2>Your run</h2><div class="grid2">'
   +'<div><label>Finish</label><div style="font-family:var(--disp);font-size:24px;color:var(--paper)">'+me.place+' of 16</div></div>'
   +'<div><label>XP earned</label><div style="font-family:var(--disp);font-size:24px;color:var(--paper)">'+T.xpForFinish(me.place)+'</div></div>'
   +'<div><label>Comp wins</label><div style="font-family:var(--disp);font-size:24px;color:var(--paper)">'+me.compWins.length+'</div></div>'
   +'<div><label>Level</label><div style="font-family:var(--disp);font-size:24px;color:var(--paper)">'+level()+'</div></div>'
   +'</div></div>';
  setBar('',[
    {label:'Read it back',cls:'go',go:function(){ screen='recap'; render(); }},
    {label:'Back to the file',go:function(){ screen='title'; render(); }}]);
}

function renderPhase(){
  app.innerHTML=topbar()+wall({})+renderFeed();
  bindSorts(renderPhase);
  scrollFeed();
}

// ── boot ───────────────────────────────────────────────────────────────────
account=loadAccount();
render();
})();
</script>
</body>
</html>
