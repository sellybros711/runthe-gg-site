// ── scheming ───────────────────────────────────────────────────────────────
/* Scheming is now a place and a conversation rather than a verb list. You pick
   who to spend energy on, the house draws where you are and what it is about,
   and the answer is A, B or C. scenes.js owns the banks; this owns the screen. */
/*
 * Scheming is the surface the player spends the most time in, so it is the one
 * that has to be least confusing.
 *
 * It now sits on the stage rather than in a card: the log and your bars stay
 * visible, the dock's green button is "Talk to somebody", and the quiet button
 * beside it moves the week on. Cards only open for the thing you chose to do.
 * Previously this was four different full screen states with a sixteen tile
 * grid in each of them, and the only way to know how much energy you had left
 * was to count pips in the top right.
 */
function showScheming(need){
  renderStage();
  var can=s.energy>=SC.ENERGY.SCENE_COST;
  /* The last window before the vote leads with the count, not with talking,
     because the count is free and it is the thing you came here for. */
  var onBlock=s.atRisk.indexOf(s.human)!==-1;
  if(need&&need.whip){
    /* The dock holds two buttons, so campaigning lives one level in, at the top
       of the card it belongs to. GDD §19.4. */
    dock(
      {label:onBlock?'Work the room from the block':'Count the votes',
       note:onBlock?'Count the votes, then go and change them. Both are free.'
                   :'Ask around. It costs nothing.',
       go:showWhip},
      {label:'Go to the vote',go:function(){ answer({done:true}); }}
    );
  } else {
    dock(
      {label:can?'Talk to somebody':'Out of energy',off:!can,
       note:can?(s.energy+' energy left this week'):'The week moves on without you',
       go:pickPerson},
      {label:'Move on',go:function(){ answer({done:true}); }}
    );
  }

  /*
   * The whip count. Who says what, and how much of the room you can see.
   *
   * The coverage IS the mechanic: people in a room with you talk, warm people
   * talk, everybody else says nothing. A player with no social game gets a card
   * full of shrugs, which is the correct answer and a more useful one than a
   * number.
   */
  function showWhip(){
    var rows=R.whipCount(s), tally={}, quiet=0, undecided=0;
    s.atRisk.forEach(function(id){ tally[id]=0; });
    rows.forEach(function(r){
      if(r.quiet){ quiet++; return; }
      if(r.undecided||r.says==null){ undecided++; return; }
      if(tally[r.says]!=null) tally[r.says]++;
    });
    var table=rows.map(function(r){
      var who=s.cast[r.voter].first+(r.allied?' (with you)':'');
      if(r.quiet) return [who,'will not say'];
      if(r.undecided||r.says==null) return [who,'has not decided'];
      return [who,'says '+s.cast[r.says].first];
    });
    var lead=null, tied=false;
    s.atRisk.forEach(function(id){
      if(lead==null||tally[id]>tally[lead]){ lead=id; tied=false; }
      else if(tally[id]===tally[lead]) tied=true;
    });
    var heard=rows.length-quiet-undecided;
    var read=heard===0
      ? 'Nobody in this house will tell you anything. You are voting blind.'
      : (tied?'It is level as far as you can tell.'
             :'As far as you can hear it, '+s.cast[lead].first+' is going.');
    openCard({
      kicker:'Before the vote', role:heard+' of '+rows.length+' talking', icon:'vote',
      title:'Count the votes',
      body:[read,
        quiet?{t:quiet+(quiet>1?' people will':' person will')+' not tell you anything. That is what having no room with them costs.',c:'d'}:null],
      rows:table.length?table:null,
      choices:[
        onBlock?{label:'Campaign for your life',cls:'go',
          note:'Free. One conversation each, and the second time you ask them is worse than the first.',
          go:pickCampaign}:null,
        {label:can?'Go and work on somebody':'No energy left to work with',
         off:!can,note:can?(s.energy+' energy left'):'',go:pickPerson},
        {label:'Cast your vote',cls:onBlock?'':'go',go:function(){ answer({done:true}); }}
      ].filter(Boolean)
    });
  }

  /*
   * CAMPAIGNING FROM THE BLOCK, GDD §19.4.
   *
   * The one thing every nominee in this format actually does, and the game had
   * no verb for it: you sat At Risk and made small talk like everybody else.
   *
   * Four pitches, and each is checked against something real where the listener
   * is standing rather than rolled flat. The card says which of them is true
   * here, because that read is the whole decision and hiding it would make this
   * a lottery with four tickets.
   */
  function pickCampaign(){
    dock({label:'Pick somebody',off:true});
    var pool=R.activeIds(s).filter(function(i){
      return i!==s.human&&s.atRisk.indexOf(i)===-1; });
    openCard({
      kicker:'From the block', role:'Free', icon:'risk', tone:'bad',
      title:'Who are you asking',
      body:['Everybody in this house is deciding between you and the other one this evening. Some of them have not thought about it yet.'],
      pick:{pool:pool,go:function(id){ closeCard(); pitchTo(id); }},
      foot:{label:'Back',go:showWhip}
    });
  }

  function pitchTo(id){
    var other=s.atRisk.filter(function(i){ return i!==s.human; })[0];
    var again=(s.campaigned&&s.campaigned[s.human+':'+id])||0;
    var nm=s.cast[id].first;
    var allied=E.sharedAlliances(s.alliances,s.human,id).filter(function(a){ return a.alive; }).length;
    var mine=E.threatSeen(s,id,s.human);
    var theirs=other!=null?E.threatSeen(s,id,other):50;
    var rd=E.read(s.rel,s.human,id);
    dock({label:'Say it',off:true});
    openCard({
      kicker:'From the block', role:again?'You have already asked':'Free', icon:'risk', tone:'bad',
      title:'What do you say to '+nm,
      body:[again?{t:'You have been to '+nm+' once already this week. Going back is worse than not going.',c:'q'}:null,
        {t:nm+' reads '+rd.band.label.toLowerCase()+' on you'
          +(allied?', and you are in a room together':'')+'.',c:'d'}],
      choices:[
        {label:'I am a number for you',
         note:theirs>mine?'True here. '+nm+' has more to fear from '+s.cast[other].first+' than from you.'
           :'A stretch. '+nm+' does not think '+s.cast[other].first+' is the bigger problem.',
         go:function(){ doCampaign(id,'numbers'); }},
        {label:s.cast[other].first+' is the one you should be scared of',
         note:theirs>58?'They already half believe it.'
           :'Nothing in what '+nm+' has seen supports that yet.',
         go:function(){ doCampaign(id,'threat'); }},
        {label:'Just keep me',
         note:rd.band.label==='Cold'||rd.band.label==='Hostile'
           ?'You are asking somebody who does not like you. It shows.'
           :'Works on people who already want you here. Asking still costs you a little with everybody.',
         go:function(){ doCampaign(id,'mercy'); }},
        {label:'You get me for the next two weeks',
         note:'Worth most to somebody who thinks they are next. Worth nothing if they are comfortable.',
         go:function(){ doCampaign(id,'deal'); }}
      ],
      foot:{label:'Somebody else',go:pickCampaign}
    });
  }

  function doCampaign(id,pitch){
    var o=R.performAction(s,{kind:'campaign',target:id,pitch:pitch});
    narrateAction(o); saveRun(); showWhip();
  }

  function backToFloor(){
    /* Running out of energy ends the window, EXCEPT before the vote, where the
       count is free and the player has not necessarily taken it yet. */
    if(s.energy<SC.ENERGY.SCENE_COST&&!(need&&need.whip)){ answer({done:true}); return; }
    showScheming(need);
  }

  function pickPerson(){
    dock({label:'Pick somebody',off:true});
    openCard({
      kicker:'The house', role:s.energy+' energy', icon:'eye',
      title:'Who are you spending it on',
      body:['Energy runs all week, not per phase. Everybody you skip drifts back toward how they felt about you on day one.'],
      pick:{pool:others(),go:function(id){
        if(s.energy<SC.ENERGY.SCENE_COST) return;
        closeCard(); showScene(R.sceneFor(s,id));
      }},
      choices:[
        {label:'Get people in one room',note:'Try to put a name on it. One energy a head.',
         off:s.energy<SC.ENERGY.GATHER_MIN*SC.ENERGY.GATHER_PER_HEAD,
         go:function(){ showGather([]); }},
        {label:'Listen at a door',note:'Costs '+SC.ENERGY.EAVESDROP_COST+'. You find out what two of them think of each other.',
         off:s.energy<SC.ENERGY.EAVESDROP_COST,
         go:function(){
           var o=R.performAction(s,{kind:'eavesdrop'}); s.energy-=SC.ENERGY.EAVESDROP_COST;
           narrateAction(o); saveRun(); backToFloor(); }},
        /* GDD §20. Cheapest verb in the game, because handing over something
           you already know costs you nothing but the risk of being the only
           person who could have said it. */
        {label:tradeCount()?'Trade something you know':'You are not holding anything',
         note:tradeCount()?(tradeCount()+' worth trading. Costs '+SEC.K.TELL_COST+'.')
           :(heldCount()?'Nothing you know is any use to anybody now':'Listen at a door first'),
         off:!tradeCount()||s.energy<SEC.K.TELL_COST,
         go:pickSecret},
        /* GDD §21. The slow verb: nothing at all happens tonight. */
        {label:'Put a name in somebody’s head',
         note:'Costs '+SC.ENERGY.SEED_COST+'. They will think they got there themselves.',
         off:s.energy<SC.ENERGY.SEED_COST,
         go:pickSeedEar}
      ],
      foot:{label:'Not yet',go:backToFloor}
    });
  }

  function heldCount(){ return SEC.held(s, s.human).length; }
  /* What is actually spendable, which is what the button has to count. Holding
     eleven things nobody needs is not the same as having something to trade. */
  function tradeCount(){
    var pool=others();
    return SEC.held(s, s.human).filter(function(sec){
      return SEC.bestEar(s,sec,pool).worth>0; }).length;
  }

  /*
   * SEEDING, GDD §21, in two cards: who you are talking to, then who you point
   * them at.
   *
   * The second card is the entire verb. It shows, for each possible name, how
   * much ground is already there with that listener, because you cannot make
   * somebody believe a thing they have no reason to believe. Finding the pair
   * where the doubt already exists IS the play, and it is the thing the
   * information layer in §20 exists to tell you.
   */
  function pickSeedEar(){
    dock({label:'Pick somebody',off:true});
    openCard({
      kicker:'A quiet word', role:SC.ENERGY.SEED_COST+' energy', icon:'eye',
      title:'Who are you talking to',
      body:['You are not going to ask them for anything. You are going to ask them a question they already half know the answer to.'],
      pick:{pool:others(),go:function(id){ closeCard(); pickSeedTarget(id); }},
      foot:{label:'Not yet',go:backToFloor}
    });
  }

  function pickSeedTarget(ear){
    dock({label:'Pick a name',off:true});
    var nm=s.cast[ear].first;
    var pool=others().filter(function(i){ return i!==ear; });
    var ranked=pool.map(function(id){
      var seen=E.threatSeen(s,ear,id), warmth=s.rel.trust[ear][id];
      var ground=Math.max(0,Math.min(1,(seen-30)/45))*0.55
        +Math.max(0,Math.min(1,(25-warmth)/75))*0.45;
      return {id:id,ground:ground};
    }).sort(function(a,b){ return b.ground-a.ground; });
    openCard({
      kicker:'A quiet word', role:'Through '+nm, icon:'eye',
      title:'Whose name are you leaving there',
      body:['Nothing happens tonight. If it takes, '+nm+' starts seeing that person differently, and nobody can point at you for it.'],
      choices:ranked.slice(0,5).map(function(r){
        return {label:s.cast[r.id].first,
          cls:r.ground>0.6?'go':'',
          note:r.ground>0.6?nm+' is most of the way there already.'
            :r.ground>0.35?nm+' has had the thought. It has not stuck yet.'
            :r.ground>0.15?'Thin. '+nm+' does not see it.'
            :nm+' has no reason at all to believe that.',
          go:function(){
            if(s.energy<SC.ENERGY.SEED_COST) return;
            var o=R.performAction(s,{kind:'seed',target:ear,against:r.id});
            s.energy-=SC.ENERGY.SEED_COST;
            narrateAction(o); saveRun(); backToFloor();
          }};
      }),
      foot:{label:'Somebody else',go:pickSeedEar}
    });
  }

  /*
   * TRADING INFORMATION, GDD §20, in two cards: what, then who.
   *
   * That order is the whole point. Picking the fact first and the ear second is
   * what makes this a strategic act rather than another way to talk to
   * somebody: the same fact is decisive to one person and noise to twelve
   * others, and the second card shows you which is which.
   */
  function pickSecret(){
    dock({label:'Pick something',off:true});
    var pool=others();
    /* Only offer things somebody can still use. A secret the whole house has
       already worked out is a dead end, and offering it leads to a card where
       every button is disabled and the only way out is back to here. */
    var list=SEC.held(s, s.human).map(function(sec){
      return {sec:sec,ear:SEC.bestEar(s,sec,pool)}; });
    var live=list.filter(function(x){ return x.ear.id!=null&&x.ear.worth>0; });
    var dead=list.length-live.length;
    openCard({
      kicker:'What you know', role:live.length+' worth trading', icon:'seen',
      title:'What are you trading',
      body:['Everything here goes stale. Something you heard four weeks ago is history, not information.',
        dead?{t:dead+(dead>1?' other things you know are':' other thing you know is')
          +' no use to anybody now. Either they all worked it out or you already told them.',c:'d'}:null,
        live.length?null:{t:'There is nothing here anybody still needs. Go and find something.',c:'q'}],
      choices:live.map(function(x){
        return {label:secretLine(x.sec),
          note:'Worth most to '+s.cast[x.ear.id].first+'. '+secretAge(x.sec),
          go:function(){ pickEar(x.sec); }};
      }),
      foot:{label:'Keep it all to yourself',go:backToFloor}
    });
  }

  function pickEar(sec){
    dock({label:'Pick somebody',off:true});
    var pool=others();
    /* Sorted by what it is worth to them, because the ranking IS the
       information the player came to this card for. */
    var ranked=pool.map(function(id){ return {id:id,w:SEC.worth(s,sec,id)}; })
      .sort(function(a,b){ return b.w-a.w; });
    openCard({
      kicker:'What you know', role:'Who gets it', icon:'seen',
      title:secretLine(sec),
      body:['Handing this over buys you something with them. If they work out you were the only one who could have said it, it costs you with the person it is about.'],
      choices:ranked.slice(0,5).map(function(r){
        var w=r.w;
        return {label:'Tell '+s.cast[r.id].first,
          cls:w>0.6?'go':'',
          note:w<=0?'They already know this.'
            :w>0.6?'This is about them, or about somebody they cannot afford to be wrong about.'
            :w>0.3?'They will want this.'
            :'They will take it. It will not change their week.',
          off:w<=0,
          go:function(){
            if(s.energy<SEC.K.TELL_COST) return;
            var o=R.performAction(s,{kind:'tell',secret:sec.id,target:r.id});
            s.energy-=SEC.K.TELL_COST;
            narrateAction(o); saveRun(); backToFloor();
          }};
      }),
      foot:{label:'Something else',go:pickSecret}
    });
  }

  /* Pull two to four people into one room and try to put a name on it. The odds
     are a read rather than a percentage: §17 keeps numbers off relationships,
     and "somebody in this room cannot stand somebody else in it" is the useful
     version of that information anyway. */
  function showGather(g){
    var cost=g.length*SC.ENERGY.GATHER_PER_HEAD;
    var ok=g.length>=SC.ENERGY.GATHER_MIN&&s.energy>=cost;
    var read=null;
    if(g.length>=SC.ENERGY.GATHER_MIN){
      var c=SC.gatherChance(s,g);
      read=c>0.62?'This room would hold.'
        :c>0.42?'It could go either way.'
        :c>0.22?'This is a stretch. Somebody in here is not there yet.'
        :'These people are nowhere near ready. Somebody in this room cannot stand somebody else in it.';
    }
    openCard({
      kicker:'An alliance', role:cost?cost+' energy':'Pick two', icon:'alliance',
      tone:read&&SC.gatherChance(s,g)>0.42?'good':'',
      title:'Get them in one room',
      body:['Every pair in the room has to hold, not just how each of them feels about you. If it does not land you have shown them all exactly who you were counting on.',
            read?{t:read,c:'q'}:null],
      pick:{pool:others(),selected:g,sort:false,go:function(id){
        var i=g.indexOf(id);
        if(i>=0) g.splice(i,1); else if(g.length<SC.ENERGY.GATHER_MAX) g.push(id);
        showGather(g);
      }},
      choices:[{label:'Bring them in',cls:'go',off:!ok,go:function(){
        var out=R.gatherPeople(s,g);
        if(out){
          if(out.landed){
            say('You get them in one room and it holds.','ev-good','alliance');
            moment({kicker:'An alliance',icon:'alliance',tone:'good',
              title:'You have something now',
              sub:'It lasts as long as all of you want it to, which is never as long as you think.',
              faces:out.members.map(function(i){ return {id:i,tag:i===s.human?'You':'In'}; })});
          } else {
            say('It does not come together, and now they all know who you counted on.','ev-bad','broken');
          }
        }
        saveRun();
        if(momentQ.length){ pump(); return; }
        backToFloor();
      }}],
      foot:{label:'Back',go:pickPerson}
    });
  }

  function showScene(mo){
    /*
     * Playtest: "none of my risky talks have worked so far". Measured, C lands
     * about half the time, which is not the problem. The problem was that the
     * player was choosing between three options with nothing to tell them which
     * one they could get away with, so every failure read as the mechanic being
     * broken rather than as a bet they took. The odds are a sentence, not a
     * percentage, same as the read on getting a room together.
     */
    /*
     * Four answers, nothing telling you which is which.
     *
     * Playtest: "I don't like that we tell the user which option is risky."
     * Correct, and it retired the odds-read from the previous build with it: a
     * tag saying RISKY and a sentence saying "this could go either way" were
     * both doing the reading FOR the player, which is the job the player came
     * here to do. What the option costs is in what it says.
     */
    /* The kicker used to be the whole scene string, which is a sentence, so it
       always arrived truncated, as the first four words and an ellipsis. A
       header is a
       label. The scene belongs in the body, where there is room for it. */
    var rd=E.read(s.rel,s.human,mo.target);
    openCard({
      kicker:'Talking to', who:mo.target, role:rd.band.label,
      icon:'eye', title:s.cast[mo.target].first,
      body:[{t:mo.scene.charAt(0).toUpperCase()+mo.scene.slice(1)+'.',c:'d'},
            {t:mo.line,c:'q'}],
      choices:mo.options.map(function(o){
        return {label:o.text,
          off:s.energy<o.cost,go:function(){
            var out=R.playScene(s,mo,o.key);
            if(!out) return;
            var big=narrateScene(mo,out); saveRun();
            if(big.length){
              openCard({kicker:'That conversation', who:out.target,
                role:out.read?out.read.band.label:'', icon:'alliance',
                tone:out.landed?'good':'bad',
                title:out.landed?'It moved something':'That did not go your way',
                body:big,
                ok:{label:'Go on',go:backToFloor}});
              return;
            }
            backToFloor();
          }};
      }),
      foot:{label:'Walk away',go:pickPerson}
    });
  }
}

/*
 * What came of it.
 *
 * Playtest: "I feel like the chats don't have a big enough impact." Half of
 * that was mechanical and is fixed in scenes.js. The other half was that the
 * consequence went into the log as a grey sentence, so moving a vote and asking
 * somebody how they slept looked identical from the chair. Anything that
 * actually changed the game now stops the screen and says so.
 */
function narrateScene(moment,out){
  var nm=s.cast[out.target].first;
  var lines=[], big=[];

  /*
   * WHAT ACTUALLY HAPPENED, IN THE LOG.
   *
   * Playtest: "the live feed also has to be way more descriptive with the
   * outcomes of your decisions." It was three sentences on rotation. "It
   * lands", "It does not quite land", "It goes the way those go" is a report on
   * a dice roll, not on a conversation, and it never once mentioned the person
   * you had just spent two energy on or which way they moved.
   *
   * So: name them, say what you did, and say which direction it went. The
   * choice text is the record of what you actually said, so it goes in.
   */
  var what=String(out.text||'').replace(/\.$/,'');
  say('With '+nm+', '+moment.scene.replace(/^[A-Z]/,function(c){ return c.toLowerCase(); })+'.','quiet');
  if(what) say('You went with: '+what+'.','quiet');

  var moved=Math.round(out.gain||0);
  var dir=moved>=6?(nm+' warms to you.')
    :moved>0?(nm+' takes it well enough.')
    :moved===0?(nm+' gives you nothing back.')
    :(nm+' does not like it.');
  if(out.kind==='safe') say('Nothing you could have got wrong. '+dir);
  else if(out.kind==='neutral') say(out.landed?('It lands. '+dir)
    :('It does not quite land. '+dir),out.landed?'':'quiet');
  else say(out.landed?('You get away with it. '+dir)
    :('You do not get away with it. '+nm+' will remember you tried.'),
    out.landed?'ev-good':'hot');
  if(out.read) lines.push(nm+' now reads '+out.read.band.label.toLowerCase()+' on you.');

  for(var i=0;i<out.fx.length;i++){
    var f=out.fx[i], line=null, weighty=false;
    if(f.k==='ally'){ line='You and '+nm+' have a room now. It holds as long as both of you want it to.';
      weighty=true; say(line,'ev-good','alliance'); }
    else if(f.k==='ally_declined'){ line=nm+' will work with you but will not put a name on it yet.';
      say(line,'quiet'); }
    else if(f.k==='swung'){ line='You have moved a vote. '+nm+' says they are voting out '
      +s.cast[f.target].first+' now, and they were not before.';
      weighty=true; say(line,'ev-vote','vote'); }
    else if(f.k==='swing_refused'){
      line=nm+' will not move off '+(s.voteIntent[out.target]!=null
        ? s.cast[s.voteIntent[out.target]].first : 'it')+', and now they know you asked.';
      weighty=true; say(line,'ev-bad','broken'); }
    else if(f.k==='intent'){ line=nm+' says they are voting out '+s.cast[f.target].first+'.'; say(line); }
    else if(f.k==='info'){ line='You get a read out of it. '+nm+' on '+s.cast[f.b].first
      +': '+f.band.toLowerCase()+'.'; say(line,'','eye'); }
    else if(f.k==='alliance_seen'){
      line='You find out there is a room you were not in: '
        +f.members.map(function(x){return s.cast[x].first;}).join(' and ')+'.';
      weighty=true; say(line,'ev-power','alliance'); }
    else if(f.k==='heat'){ line='You have put '+s.cast[f.who].first+' in their head. '+nm
      +' walks away thinking about them, and not kindly.';
      weighty=true; say(line,'','threat'); }
    else if(f.k==='watched'){ line=nm+' has started watching what you do rather than what you say.';
      weighty=true; say(line,'ev-bad','eye'); }
    else if(f.k==='backfire'){ line='That cost you with '+nm+', and you are not getting it back this week.';
      say(line,'hot'); }
    else if(f.k==='got_back'){ line='It gets back to '+s.cast[f.who].first+' by the evening.';
      weighty=true; say(line,'ev-bad','broken'); }
    if(line){ lines.push(line); if(weighty) big.push(line); }
  }
  if(out.read) say(nm+' now reads '+out.read.band.label.toLowerCase()+' on you'
    +(out.read.freshness==='current'?', and that is fresh.':'.'),'quiet');

  /* Handed back so the caller can stop the screen. A pleasant chat that nudged
     trust does not deserve a card; a vote you moved does. */
  return big;
}

/* Eavesdrop and the Confessional survive the move to scenes: one is not a
   conversation and the other is not with anybody. */
function narrateAction(o){
  var nm=o.target!=null?s.cast[o.target].first:'';
  if(o.kind==='eavesdrop'){
    say(tsay('eavesOk'));
    say(s.cast[o.pair[0]].first+' on '+s.cast[o.pair[1]].first+': '+o.value.toLowerCase()+'.','quiet');
    if(o.alliance) say('They are working together. '+o.alliance.map(function(i){return s.cast[i].first;}).join(', ')+'.','quiet');
    if(o.caught) say(tsay('eavesCaught',{name:s.cast[o.pair[0]].first}),'hot');
  }
  if(o.kind==='confessional'&&o.read) say('You write it down. '+nm+': '+o.read.band.label.toLowerCase()+'.','quiet');
  /* GDD §20. Anything you picked up is reported as a thing you now HOLD, so the
     player learns the inventory exists at the moment it first has something in
     it rather than by finding a tab. */
  if(o.learned&&o.learned.length){
    for(var li=0;li<o.learned.length;li++){
      say('You are carrying that now: '+secretLine(o.learned[li])+'.','ev-power','seen');
    }
    if(!s.knowTaught){
      s.knowTaught=true;
      moment({kicker:'What you know',icon:'seen',tone:'good',
        title:'You are holding something',
        sub:'Things you learn are yours to spend. Pick the week, pick the person, and remember that the only people who could have told them are the ones who were there.',
        rows:o.learned.map(function(x){ return ['You know',secretLine(x)]; })});
    }
  }
  if(o.kind==='seed'){
    /* Deliberately quiet in the feed. Nothing visible happened, which is what
       the player is buying. GDD §21. */
    var tgt=o.against!=null?s.cast[o.against].first:'';
    say(tsay(o.ok?'seedOk':'seedFail',{name:nm,target:tgt}),o.ok?'ev-good':'quiet','eye');
    if(o.ok){
      say('Nothing happens tonight. '+nm+' will get there on their own, and nobody will be able to say who pointed them.','quiet');
    }
    if(o.noticed) say(tsay('seedNoticed',{name:nm}),'ev-bad','eye');
  }
  if(o.kind==='tell'){
    if(o.missing){ say('Whatever that was, it is no good to anybody now.','quiet'); return; }
    var bank=o.landed==='read_self'?'toldRead'
      :o.landed==='read_third'?'toldThird'
      :o.landed==='room'?'toldRoom'
      :o.landed==='name'?'toldName'
      :o.landed==='pair'?'toldPair'
      :o.landed==='intent'?'toldIntent':'tellOk';
    var other=o.about.length>1?s.cast[o.about[1]].first:'';
    say(tsay(bank,{name:nm,target:s.cast[o.about[0]]?s.cast[o.about[0]].first:'',other:other}),'','seen');
    say(tsay(o.worth>0.3?'tellOk':'tellFlat',
      {name:nm,target:s.cast[o.about[0]]?s.cast[o.about[0]].first:''}),
      o.worth>0.3?'ev-good':'quiet');
    if(o.worth>0.6){
      moment({kicker:'What you know',icon:'seen',tone:'good',
        title:nm+' owes you one',
        sub:'That was worth something to them, and they know where it came from.',
        faces:[{id:o.target,tag:'Told',col:COL.ok}]});
    }
    if(o.traced!=null){
      say(tsay('tellTraced',{target:s.cast[o.traced].first}),'ev-bad','broken');
      moment({kicker:'It got back',icon:'broken',tone:'bad',
        title:s.cast[o.traced].first+' knows it was you',
        sub:'There were not many people who could have said it.',
        faces:[{id:o.traced,tag:'Knows',col:COL.signal}]});
    }
  }
  if(o.kind==='campaign'){
    /* The feed has to say what moved, not that something happened. GDD §19.4
       moves a real vote intent when it lands, so the line names it. */
    say(tsay(o.pitch==='numbers'?'campNumbers'
      :o.pitch==='threat'?'campThreat'
      :o.pitch==='mercy'?'campMercy':'campDeal',{name:nm}),'quiet','risk');
    if(o.ok&&o.against!=null){
      say(nm+' says they are voting out '+s.cast[o.against].first+'. That was not where they were an hour ago.',
        'ev-vote','vote');
      moment({kicker:'From the block',icon:'vote',tone:'good',
        title:'You have moved '+nm,
        sub:'One conversation, one vote. It still has to hold until the tally.',
        faces:[{id:o.target,tag:'Moved',col:COL.ok}]});
    } else {
      say(nm+' does not move, and now they know exactly how worried you are.','ev-bad','broken');
    }
    if(o.again) say('That was your second time asking them. It landed worse than the first.','quiet');
  }
}

// ── powers ─────────────────────────────────────────────────────────────────
/* A power is a card like anything else. The old version painted the whole
   screen and put a sixteen tile wall under it, which buried the one sentence
   that said what the thing actually did. */
function powerHead(kind){
  var d=PW.POWERS[kind];
  return {kicker:'You are holding', role:d.name, icon:'power',
          tone:kind==='diamond'?'bad':'power', title:d.name, blurb:d.blurb, long:d.long};
}

function showPowerSafety(need){
  var h=powerHead('safety');
  dock({label:'Decide',off:true});
  openCard({kicker:h.kicker,role:h.role,icon:h.icon,tone:h.tone,title:h.title,
    body:[h.blurb,h.long,{t:'Names go up next. Once they are up this is worth nothing.',c:'q'}],
    choices:[
      {label:'Play it',cls:'go',note:'You cannot be named this week.',go:function(){
        say('You take yourself off the table.'); answer({play:true}); }},
      {label:'Sit on it',note:'Worth nothing after the naming.',go:function(){
        answer({play:false}); }}
    ]});
}

function showPowerVetoPick(need){
  var h=powerHead('veto_pick');
  dock({label:'Decide',off:true});
  openCard({kicker:h.kicker,role:h.role,icon:h.icon,tone:h.tone,title:h.title,
    body:[h.long,{t:'Whoever you choose, everybody sees you choose them.',c:'q'}],
    pick:{pool:need.pool,go:function(id){
      say('You put '+s.cast[id].first+' in the Veto Comp. Everyone saw.');
      answer({pick:id}); }},
    foot:{label:'Do not use it',go:function(){ answer({pick:null}); }}});
}

function showPowerDiamond(need){
  var h=powerHead('diamond');
  dock({label:'Decide',off:true});
  var save=null;
  function paint(){
    openCard({kicker:h.kicker,role:h.role,icon:h.icon,tone:'bad',title:h.title,
      body:[h.long,{t:save==null?'Choose who comes off the block.'
        :'Now choose who goes up in their place. The Captain does not get a say.',c:'q'}],
      pick:{pool:save==null?need.atRisk:need.pool,selected:save!=null?[save]:[],go:function(id){
        if(save==null){ save=id; paint(); return; }
        say('You take '+s.cast[save].first+' off and put '+s.cast[id].first+' up. Everybody knows it was you.','hot');
        answer({diamond:true,save:save,replace:id});
      }},
      foot:{label:'Do not use it',go:function(){ answer({diamond:false}); }}});
  }
  paint();
}

function showPowerExtraVote(need){
  var h=powerHead('extra_vote');
  dock({label:'Decide',off:true});
  openCard({kicker:h.kicker,role:h.role,icon:h.icon,tone:h.tone,title:h.title,
    body:[h.long,{t:'The count comes back one higher than the house expects. Nobody can prove it was you, because nobody can prove anything about an anonymous vote.',c:'q'}],
    faces:need.atRisk.map(function(i){ return {id:i,tag:'At Risk',col:COL.signal}; }),
    choices:[
      {label:'Play it',cls:'go',go:function(){ say('You put two in.'); answer({extraVote:true}); }},
      {label:'Keep it',go:function(){ answer({extraVote:false}); }}
    ]});
}

// ── competitions ───────────────────────────────────────────────────────────
/* The decision to play or throw is a card. The comp itself takes the screen,
   because a minigame with a log and four bars around it is a minigame nobody
   can concentrate on. */
function showComp(need){
  var comp=need.comp||C.pickComp(s.rng.comp,s.lastCompId,s.weeks.length);
  s.pendingComp=comp;
  var which=need.which==='captain'?'Captain Comp':'Veto Comp';
  var streak=s.cast[s.human].throwStreak;
  renderStage();
  dock({label:'Take your place',off:true});
  /* The family and what it tests go on the card, so "I am hopeless at memory,
     I will take the Rations" is a real decision rather than a shrug. Throwing
     is a strategy in this format and it cannot be one blind. */
  openCard({
    kicker:which, role:comp.family,
    icon:need.which==='captain'?'captain':'veto',
    title:comp.name, body:[comp.blurb],
    rows:[['What it is',comp.family],
          ['What it tests',comp.tests],
          [need.which==='captain'?'What you win':'What you win',
           need.which==='captain'?'The power for a week'
             :'The right to take somebody off the block']],
    choices:[
      {label:'Play it',cls:'go',go:function(){ runComp(comp); }},
      {label:'Throw it',cls:'hot',
       note:streak>=2?'That would be three in a row. The house can count.'
         :'Go out early. Lands you in Rations, and somebody else holds the power.',
       go:function(){
         say(tsay('throwing'),'quiet');
         if(streak>=2) say(tsay('throwSuspicion'),'hot');
         answer({throw:true});
       }}
    ]});

  function runComp(comp){
    screen='comp';
    app.className='scroll';
    app.innerHTML=topbar()
      +'<div class="file"><h2>'+esc(comp.name)+'</h2>'
      +'<div class="sub">'+esc(which)+'. '+esc(comp.blurb)+'</div></div>'
      +'<div class="stage" id="stage"></div>';
    bar.className='bar hide'; barin.innerHTML='';
    startMinigame(comp,function(perf){
      say('You finish the '+comp.name+'.','quiet');
      screen='phase'; answer({perf:perf});
    });
  }
}

/*
 * NOTHING MAY HANG THE RUN.
 *
 * Every minigame ends by calling done(score), and several of them wait on a
 * pointer event that may never arrive: a phone that locks, a tab that gets
 * backgrounded mid round, a player who walks away. There is no way out of that
 * state, and a competition that never finishes is a run that never finishes.
 *
 * So: done fires at most once, and a watchdog fires it anyway if nothing has
 * been touched for a while. The score in that case is deliberately poor rather
 * than zero, because somebody who wandered off did compete, badly.
 */
/*
 * A minigame that re-renders on a timer has to stop when its stage is gone.
 *
 * Half the comps run in rounds and schedule the next round on a setTimeout.
 * Nothing stopped that chain: the idle watchdog below can end a comp between
 * rounds, and so can the phase moving on, and the pending callback then writes
 * into a detached stage and asks the DOCUMENT for elements that are no longer
 * in it. Measured symptom was an intermittent "Cannot read properties of null
 * reading style" out of Tightrope, in roughly one run in four.
 */
function later(st,fn,ms){
  return setTimeout(function(){ if(st&&st.isConnected) fn(); },ms);
}

var MG_IDLE_MS=50000;
function guardDone(done,st){
  var fired=false,timer=null;
  function finish(score){
    if(fired) return;
    fired=true;
    if(timer) clearTimeout(timer);
    if(st) st.onpointerdown=null;
    done(Math.max(0,Math.min(100,score)));
  }
  function arm(){
    if(timer) clearTimeout(timer);
    timer=setTimeout(function(){ finish(12); },MG_IDLE_MS);
  }
  /* Any touch anywhere in the comp counts as still being here. */
  if(st) st.addEventListener('pointerdown',arm,true);
  arm();
  return finish;
}

/* Each minigame returns 0..100. comps.js blends that with the build at
   HUMAN_SKILL_WEIGHT, so hands matter and the tree matters. Adding a comp is
   adding a case here plus a row in comps.js, and it never touches the engine. */
function startMinigame(comp,done){
  var st=document.getElementById('stage');
  var k=comp.kind;
  done=guardDone(done,st);
  if(k==='reaction') return mgReaction(st,done);
  if(k==='memory') return mgMemory(st,done);
  if(k==='hold') return mgHold(st,done);
  if(k==='slider') return mgSlider(st,done);
  if(k==='trivia') return mgTrivia(st,done);
  if(k==='nerve') return mgNerve(st,done);
  if(k==='tightrope') return mgTightrope(st,done);
  if(k==='grip') return mgGrip(st,done);
  if(k==='before_after') return mgBeforeAfter(st,done);
  if(k==='order') return mgOrder(st,done);
  if(k==='oddone') return mgOddOne(st,done);
  if(k==='count') return mgCount(st,done);
  if(k==='potato') return mgPotato(st,done);
  return mgRandom(st,done);
}

function mgReaction(st,done){
  var round=0,total=0,rounds=3,t0=0,armed=false,timer=null;
  function next(){
    if(round>=rounds){ done(Math.max(0,Math.min(100,total/rounds))); return; }
    st.innerHTML='<h2>Hair Trigger</h2><div class="blurb">Round '+(round+1)+' of '+rounds+'. '
      +'Wait for it. Going early costs you the round.</div>'
      +'<div class="rbox" id="rb">WAIT</div>';
    var rb=document.getElementById('rb');
    armed=false;
    timer=setTimeout(function(){ armed=true; t0=Date.now(); rb.className='rbox go'; rb.textContent='NOW'; },
      900+Math.random()*2200);
    rb.onpointerdown=function(){
      if(!armed){ clearTimeout(timer); rb.className='rbox bad'; rb.textContent='TOO EARLY';
        round++; total+=8; later(st,next,700); return; }
      var ms=Date.now()-t0;
      /* 180ms is a very good human; 600ms is asleep. */
      var sc=Math.max(0,Math.min(100,100-(ms-180)/4.2));
      total+=sc; round++;
      rb.className='rbox'; rb.textContent=ms+' ms';
      later(st,next,650);
    };
  }
  next();
}

function mgMemory(st,done){
  var len=3,best=0,seq=[],idx=0,lock=true;
  function show(){
    seq=[]; for(var i=0;i<len;i++) seq.push(Math.floor(Math.random()*9));
    st.innerHTML='<h2>The Long Hallway</h2><div class="blurb">Watch, then repeat. '
      +'Length '+len+'.</div><div class="padgrid" id="pg">'
      +Array.apply(null,Array(9)).map(function(_,i){ return '<div class="pad" data-p="'+i+'"></div>'; }).join('')
      +'</div>';
    var pads=app.querySelectorAll('[data-p]');
    lock=true; idx=0;
    seq.forEach(function(v,i){
      setTimeout(function(){ pads[v].classList.add('lit');
        setTimeout(function(){ pads[v].classList.remove('lit'); },330); }, 480*i+260);
    });
    setTimeout(function(){
      lock=false;
      Array.prototype.forEach.call(pads,function(el){
        el.onpointerdown=function(){
          if(lock) return;
          var v=Number(el.dataset.p);
          el.classList.add('hit'); setTimeout(function(){ el.classList.remove('hit'); },140);
          if(v!==seq[idx]){ lock=true; finish(); return; }
          idx++;
          if(idx>=seq.length){ lock=true; best=len; len++;
            if(len>7){ finish(); return; }
            later(st,show,420); }
        };
      });
    },480*seq.length+320);
  }
  function finish(){
    /* 3 is a floor, 7 is exceptional. */
    done(Math.max(0,Math.min(100,(best-2)/5*100)));
  }
  show();
}

function mgHold(st,done){
  var start=0,held=0,running=false,raf=null,target=14000;
  st.innerHTML='<h2>Dead Weight</h2><div class="blurb">Hold it down. Let go and it is over. '
    +'The house will try to make you let go.</div>'
    +'<div class="holdpad" id="hp">HOLD</div>'
    +'<div class="meterwrap"><div class="meter" id="mt"></div></div>';
  var hp=document.getElementById('hp'), mt=document.getElementById('mt');
  function tick(){
    held=Date.now()-start;
    mt.style.width=Math.min(100,held/target*100)+'%';
    /* Distraction escalates. Nothing here changes the score, it only makes the
       pad harder to keep a finger on, which is the whole comp. */
    var jitter=Math.min(20,held/900);
    hp.style.transform='translate('+(Math.random()*jitter-jitter/2).toFixed(1)+'px,'
      +(Math.random()*jitter-jitter/2).toFixed(1)+'px)';
    if(held>=target){ stop(); return; }
    raf=requestAnimationFrame(tick);
  }
  function stop(){
    if(!running) return; running=false; cancelAnimationFrame(raf);
    hp.classList.remove('on'); hp.textContent='DONE';
    done(Math.max(0,Math.min(100,held/target*100)));
  }
  hp.onpointerdown=function(){ if(running) return; running=true; start=Date.now();
    hp.classList.add('on'); hp.textContent='HOLDING'; tick(); };
  hp.onpointerup=stop; hp.onpointerleave=stop; hp.onpointercancel=stop;
}

function mgSlider(st,done){
  st.innerHTML='<h2>Level Head</h2><div class="blurb">Hold the marker in the band. '
    +'Press and hold to push it right. It falls left on its own.</div>'
    +'<div class="track" id="tk"><div class="zone"></div><div class="mk" id="mk"></div></div>'
    +'<div class="meterwrap"><div class="meter" id="mt"></div></div>';
  var tk=document.getElementById('tk'), mk=document.getElementById('mk'), mt=document.getElementById('mt');
  var pos=50,vel=0,push=false,inZone=0,elapsed=0,last=Date.now(),dur=15000,raf=null;
  function tick(){
    var now=Date.now(), dt=Math.min(60,now-last); last=now; elapsed+=dt;
    var drift=-0.020-Math.sin(elapsed/1400)*0.014;
    vel+=(push?0.052:0)+drift;
    vel*=0.94; pos+=vel*dt*0.75;
    if(pos<0){pos=0;vel=0;} if(pos>100){pos=100;vel=0;}
    if(pos>=42&&pos<=58) inZone+=dt;
    mk.style.left='calc('+pos+'% - 2px)';
    mt.style.width=(elapsed/dur*100)+'%';
    if(elapsed>=dur){ cancelAnimationFrame(raf); done(Math.max(0,Math.min(100,inZone/dur*135))); return; }
    raf=requestAnimationFrame(tick);
  }
  tk.onpointerdown=function(){push=true;}; tk.onpointerup=function(){push=false;};
  tk.onpointerleave=function(){push=false;}; tk.onpointercancel=function(){push=false;};
  tick();
}

/* Trivia is built from the WeekLog, which GDD §13 says it powers. The questions
   only exist because the run happened. */
function mgTrivia(st,done){
  var qs=buildTrivia();
  if(!qs.length){ done(45); return; }
  var i=0,right=0;
  function ask(){
    if(i>=qs.length){ done(Math.max(0,Math.min(100,right/qs.length*100))); return; }
    var q=qs[i];
    st.innerHTML='<h2>House Rules</h2><div class="blurb">'+esc(q.q)+'</div>'
      +'<div class="qbtns">'+q.opts.map(function(o,n){
        return '<button class="choice" data-q="'+n+'"><b>'+esc(o)+'</b></button>'; }).join('')+'</div>'
      +'<div class="blurb">'+(i+1)+' of '+qs.length+'</div>';
    Array.prototype.forEach.call(app.querySelectorAll('[data-q]'),function(el){
      el.onclick=function(){
        if(q.opts[Number(el.dataset.q)]===q.a) right++;
        i++; ask();
      };
    });
  }
  ask();
}
function buildTrivia(){
  var out=[], rng=s.rng.comp;
  var pool=s.weeks.filter(function(w){ return !w.final3&&w.evicted!=null; });
  for(var n=0;n<Math.min(4,pool.length);n++){
    var w=pool[Math.floor(rng()*pool.length)];
    var kind=Math.floor(rng()*2);
    var ans,q;
    if(kind===0){ ans=s.cast[w.evicted].first; q='Who was evicted in week '+w.week+'?'; }
    else { ans=s.cast[w.captain].first; q='Who was Captain in week '+w.week+'?'; }
    var opts=[ans];
    var others=s.cast.filter(function(p){ return p.first!==ans; });
    while(opts.length<4&&others.length){
      var pick=others.splice(Math.floor(rng()*others.length),1)[0];
      if(opts.indexOf(pick.first)===-1) opts.push(pick.first);
    }
    rng.shuffle(opts);
    out.push({q:q,a:ans,opts:opts});
  }
  return out;
}

/* Push your luck. Every card is worth more than the last and one of them ends
   the run. The decision is when to stop, which is the same decision the game
   asks everywhere else. */
function mgNerve(st,done){
  var banked=0,turned=0,dead=false;
  var risk=function(n){ return Math.min(0.55,0.10+n*0.055); };
  function paint(msg){
    st.innerHTML='<h2>Nerve</h2>'
      +'<div class="blurb">'+(msg||'Each card is worth more than the last. One of them is not a card.')+'</div>'
      +'<div class="rbox'+(dead?' bad':'')+'" id="rb">'+(dead?'GONE':banked+' BANKED')+'</div>'
      +'<div class="blurb">'+turned+' turned</div>';
    if(dead) return;
    document.getElementById('rb').onpointerdown=turn;
  }
  function turn(){
    if(dead) return;
    if(Math.random()<risk(turned)){ dead=true; banked=Math.round(banked*0.25); paint('That was the one.');
      setTimeout(function(){ done(Math.max(0,Math.min(100,banked))); },900); return; }
    turned++; banked+=6+turned*3;
    if(banked>=100||turned>=12){ paint('You have taken everything there is.');
      setTimeout(function(){ done(Math.min(100,banked)); },700); return; }
    paint();
  }
  paint();
  setBar('Nerve',[{label:'Bank it',cls:'go',go:function(){ if(!dead){ dead=true; done(Math.min(100,banked)); } }}]);
}

/* Stop a sweeping marker inside a target that shrinks each round. */
function mgTightrope(st,done){
  var round=0,rounds=5,score=0,raf=null,pos=0,dir=1,running=false;
  function width(){ return 26-round*4; }
  function next(){
    if(round>=rounds){ done(Math.max(0,Math.min(100,score/rounds))); return; }
    st.innerHTML='<h2>Tightrope</h2><div class="blurb">Round '+(round+1)+' of '+rounds
      +'. Stop it in the gap.</div>'
      +'<div class="track" id="tk"><div class="zone" id="zn"></div><div class="mk" id="mk"></div></div>'
      +'<div class="blurb">'+Math.round(score/Math.max(1,round))+' average</div>';
    var zn=document.getElementById('zn'), mk=document.getElementById('mk'), tk=document.getElementById('tk');
    zn.style.left=(50-width()/2)+'%'; zn.style.width=width()+'%';
    pos=0; dir=1; running=true;
    var speed=0.9+round*0.35;
    (function tick(){
      if(!running) return;
      pos+=dir*speed; if(pos>100){pos=100;dir=-1;} if(pos<0){pos=0;dir=1;}
      mk.style.left='calc('+pos+'% - 2px)';
      raf=requestAnimationFrame(tick);
    })();
    tk.onpointerdown=function(){
      if(!running) return; running=false; cancelAnimationFrame(raf);
      var off=Math.abs(pos-50), half=width()/2;
      score+=off<=half?Math.max(35,100-(off/half)*55):Math.max(0,30-off);
      round++; later(st,next,420);
    };
  }
  next();
}

/* Alternate two pads without breaking rhythm. Mistiming costs more than being
   slow, which is what makes it precision as well as physical. */
function mgGrip(st,done){
  var want='l',hits=0,breaks=0,start=0,dur=12000,raf=null,last=0,gaps=[];
  st.innerHTML='<h2>White Knuckle</h2><div class="blurb">Alternate. Left, right, left, right. '
    +'Twelve seconds.</div>'
    +'<div class="padgrid" style="grid-template-columns:repeat(2,96px)">'
    +'<div class="pad lit" data-g="l" style="aspect-ratio:1/1"></div>'
    +'<div class="pad" data-g="r" style="aspect-ratio:1/1"></div></div>'
    +'<div class="meterwrap"><div class="meter" id="mt"></div></div>';
  var pads=app.querySelectorAll('[data-g]'), mt=document.getElementById('mt');
  function light(){ Array.prototype.forEach.call(pads,function(p){
    p.classList.toggle('lit',p.dataset.g===want); }); }
  function tick(){
    var el=Date.now()-start; mt.style.width=Math.min(100,el/dur*100)+'%';
    if(el>=dur){ finish(); return; }
    raf=requestAnimationFrame(tick);
  }
  function finish(){
    cancelAnimationFrame(raf);
    /* Rhythm matters: steady gaps score better than a fast burst and a stall. */
    var mean=gaps.length?gaps.reduce(function(a,b){return a+b;},0)/gaps.length:1000;
    var vary=gaps.length>1?Math.sqrt(gaps.reduce(function(a,g){return a+(g-mean)*(g-mean);},0)/gaps.length):400;
    var rate=Math.min(1,hits/46);
    var steady=Math.max(0,1-vary/260);
    done(Math.max(0,Math.min(100,(rate*72+steady*28)-breaks*2.5)));
  }
  /* The clock starts NOW, not on the first press. It said twelve seconds and
     then waited indefinitely for a pad that might never be touched, which is
     both a lie in the instructions and the one place a run could hang for real
     rather than through inattention. */
  start=Date.now(); last=start; tick();
  Array.prototype.forEach.call(pads,function(p){
    p.onpointerdown=function(){
      if(p.dataset.g===want){
        var now=Date.now(); if(hits>0) gaps.push(now-last); last=now;
        hits++; want=want==='l'?'r':'l'; light();
      } else breaks++;
    };
  });
}

/*
 * ── the five built out of this run ─────────────────────────────────────────
 *
 * A competition in this format can ask a question a minigame cannot: it can ask
 * about the fifteen people you have been living with. Four of these five read
 * the WeekLog and the cast, so no two houses ever set the same test, and being
 * good at them is the same skill as playing well.
 *
 * All five degrade to something playable when the run is too young to have a
 * history, because week one has to work too.
 */

/* Which came first. Two real events from this house, in the wrong order half
   the time. */
function mgBeforeAfter(st,done){
  var rng=s.rng.comp, i=0, right=0;
  var facts=[];
  for(var w=0;w<s.weeks.length;w++){
    var x=s.weeks[w];
    if(x.final3||x.evicted==null) continue;
    facts.push({wk:x.week,t:s.cast[x.evicted].first+' was evicted'});
    if(x.captain!=null) facts.push({wk:x.week,t:s.cast[x.captain].first+' took the Captaincy'});
    if(x.vetoUsed&&x.savedId!=null) facts.push({wk:x.week,t:s.cast[x.savedId].first+' came off the block'});
  }
  if(facts.length<4){ done(45); return; }
  var pairs=[];
  for(var n=0;n<5&&facts.length>1;n++){
    var a=facts[Math.floor(rng()*facts.length)], b=facts[Math.floor(rng()*facts.length)];
    if(a.wk===b.wk) continue;
    pairs.push(rng()<0.5?[a,b]:[b,a]);
  }
  if(!pairs.length){ done(45); return; }
  function ask(){
    if(i>=pairs.length){ done(right/pairs.length*100); return; }
    var p=pairs[i];
    st.innerHTML='<h2>Before and After</h2>'
      +'<div class="blurb">Which of these happened first.</div>'
      +'<div class="bastack">'
      +'<button class="choice" data-ba="0"><b>'+esc(p[0].t)+'</b></button>'
      +'<button class="choice" data-ba="1"><b>'+esc(p[1].t)+'</b></button></div>'
      +'<div class="blurb">'+(i+1)+' of '+pairs.length+'</div>';
    Array.prototype.forEach.call(st.querySelectorAll('[data-ba]'),function(el){
      el.onclick=function(){
        var pickIdx=Number(el.dataset.ba);
        var firstIdx=p[0].wk<p[1].wk?0:1;
        if(pickIdx===firstIdx) right++;
        i++; ask();
      };
    });
  }
  ask();
}

/* Put four people back in the order they left. */
function mgOrder(st,done){
  var gone=s.cast.filter(function(p){ return p.place!=null&&p.status!=='active'; })
    .sort(function(a,b){ return b.place-a.place; }).slice(0,4);
  if(gone.length<3){ done(45); return; }
  var rng=s.rng.comp;
  var shuffled=gone.slice(); rng.shuffle(shuffled);
  var picked=[];
  function paint(){
    st.innerHTML='<h2>In Order</h2>'
      +'<div class="blurb">Tap them in the order they left, earliest first.</div>'
      +'<div class="ordrow">'+picked.map(function(p,n){
        return '<span class="ordpick">'+(n+1)+'. '+esc(p.first)+'</span>'; }).join('')+'</div>'
      +'<div class="padgrid" style="grid-template-columns:repeat(2,minmax(120px,1fr));max-width:400px">'
      +shuffled.map(function(p){
        var taken=picked.indexOf(p)!==-1;
        return '<button class="choice" data-or="'+p.id+'"'+(taken?' disabled':'')+'>'
          +'<b>'+esc(p.first)+'</b></button>'; }).join('')+'</div>';
    Array.prototype.forEach.call(st.querySelectorAll('[data-or]'),function(el){
      el.onclick=function(){
        var p=shuffled.filter(function(x){ return x.id===Number(el.dataset.or); })[0];
        if(!p||picked.indexOf(p)!==-1) return;
        picked.push(p);
        if(picked.length===shuffled.length){
          var ok=0;
          for(var n=0;n<picked.length;n++) if(picked[n]===gone[n]) ok++;
          done(ok/picked.length*100);
          return;
        }
        paint();
      };
    });
  }
  paint();
}

/* One of these faces is not the person who was standing there. */
function mgOddOne(st,done){
  var rng=s.rng.comp, round=0, rounds=4, right=0;
  var pool=s.cast.slice();
  function ask(){
    if(round>=rounds){ done(right/rounds*100); return; }
    rng.shuffle(pool);
    var five=pool.slice(0,5);
    var swapAt=Math.floor(rng()*five.length);
    var replacement=pool.filter(function(p){ return five.indexOf(p)===-1; })[0];
    if(!replacement){ done(50); return; }
    st.innerHTML='<h2>Spot the Difference</h2>'
      +'<div class="blurb">Look at them. Then find the one who changed.</div>'
      +'<div class="oddrow" id="od">'+five.map(function(p){
        return '<div class="oddface">'+avatar(p,86)+'</div>'; }).join('')+'</div>'
      +'<div class="blurb">Round '+(round+1)+' of '+rounds+'</div>';
    setTimeout(function(){
      var shown=five.slice(); shown[swapAt]=replacement;
      var od=document.getElementById('od');
      if(!od) return;
      od.innerHTML=shown.map(function(p,n){
        return '<button class="oddface pick" data-od="'+n+'">'+avatar(p,86)+'</button>'; }).join('');
      Array.prototype.forEach.call(od.querySelectorAll('[data-od]'),function(el){
        el.onclick=function(){
          if(Number(el.dataset.od)===swapAt) right++;
          round++; ask();
        };
      });
    },1500+Math.random()*700);
  }
  ask();
}

/* They walk past. Count the ones that match. */
function mgCount(st,done){
  var rng=s.rng.comp, round=0, rounds=3, total=0;
  function ask(){
    if(round>=rounds){ done(Math.max(0,total/rounds)); return; }
    var pool=s.cast.slice(); rng.shuffle(pool);
    var n=6+Math.floor(rng()*7);
    var walkers=[]; for(var j=0;j<n;j++) walkers.push(pool[j%pool.length]);
    var wanted=rng()<0.5?'glasses':'beard';
    var truth=0;
    walkers.forEach(function(p){ if(AV.features(p.avatarSeed)[wanted]) truth++; });
    st.innerHTML='<h2>Head Count</h2>'
      +'<div class="blurb">Count how many of them are '
      +(wanted==='glasses'?'wearing glasses':'wearing a beard')+'.</div>'
      +'<div class="walkway" id="wk"></div>';
    var wk=document.getElementById('wk'), k=0;
    var timer=setInterval(function(){
      if(!wk){ clearInterval(timer); return; }
      if(k>=walkers.length){
        clearInterval(timer);
        st.innerHTML='<h2>Head Count</h2><div class="blurb">How many were '
          +(wanted==='glasses'?'wearing glasses':'wearing a beard')+'.</div>'
          +'<div class="padgrid" style="grid-template-columns:repeat(4,64px);max-width:320px">'
          +[0,1,2,3,4,5,6,7].map(function(v){
            return '<button class="choice" data-ct="'+v+'"><b>'+v+'</b></button>'; }).join('')+'</div>';
        Array.prototype.forEach.call(st.querySelectorAll('[data-ct]'),function(el){
          el.onclick=function(){
            var off=Math.abs(Number(el.dataset.ct)-truth);
            total+=Math.max(0,100-off*34);
            round++; ask();
          };
        });
        return;
      }
      wk.innerHTML='<div class="walker">'+avatar(walkers[k],96)+'</div>';
      k++;
    },520);
  }
  ask();
}

/* Worth more every second, and it goes off without warning. */
function mgPotato(st,done){
  var rng=s.rng.comp, held=0, banked=0, round=0, rounds=3, timer=null, fuse=0;
  function ask(){
    if(round>=rounds){ done(Math.min(100,banked)); return; }
    held=0; fuse=1800+rng()*5200;
    st.innerHTML='<h2>Hot Potato</h2>'
      +'<div class="blurb">Let go before it goes off. Round '+(round+1)+' of '+rounds+'.</div>'
      +'<div class="rbox go" id="rb">0</div>'
      +'<div class="blurb">Banked '+Math.round(banked)+'</div>';
    var rb=document.getElementById('rb'), t0=Date.now();
    timer=setInterval(function(){
      held=Date.now()-t0;
      if(!rb) { clearInterval(timer); return; }
      rb.textContent=Math.round(held/1000*10);
      if(held>=fuse){
        clearInterval(timer);
        rb.className='rbox bad'; rb.textContent='GONE';
        round++; later(st,ask,700);
      }
    },60);
    rb.onpointerdown=function(){
      clearInterval(timer);
      banked+=Math.round(held/1000*10);
      rb.className='rbox'; rb.textContent='BANKED';
      round++; later(st,ask,600);
    };
  }
  ask();
}

function mgRandom(st,done){
  st.innerHTML='<h2>Draw</h2><div class="blurb">No skill in it. Somebody still walks away with the power.</div>'
    +'<div class="rbox" id="rb">DRAW</div>';
  document.getElementById('rb').onpointerdown=function(){
    var v=Math.random()*100;
    this.textContent=v>66?'GOOD DRAW':v>33?'MIDDLING':'POOR DRAW';
    setTimeout(function(){ done(v); },800);
  };
}

// ── the vote reveal ────────────────────────────────────────────────────────
/* The one place the game slows down, GDD §17. Anonymous: the tally builds one
   mark at a time and no name is ever attached to a vote. */
function showVoteReveal(){
  screen='vote';
  var res=s.evictionResult;
  if(!res||!res.votes.length){ screen='phase'; R.step(s,null); pump(); return; }
  var atRisk=s.atRisk.slice();
  var counts={}; atRisk.forEach(function(id){ counts[id]=0; });
  var order=res.votes.slice();
  var i=0, timer=null;

  function paint(reveal){
    app.className='scroll';
    app.innerHTML=topbar()
      +'<div class="file"><h2>The vote</h2><div class="sub">'+esc(STR.S.voteOpen[0])+'</div>'
      +'<div class="tallywrap">'+atRisk.map(function(id){
        var out=reveal&&res.evicted===id;
        var rd=readOf(id);
        var col=rd?U.bandColor(rd.band.label):COL.ink;
        /* The face and the colour, not just a name. A player should be able to
           feel which of these two they can afford to lose without reading. */
        return '<div class="tcol'+(out?' out':'')+'">'
          +'<div class="tface" style="border-color:'+(out?'var(--signal)':col)+'">'+avatar(s.cast[id],96)+'</div>'
          +'<div class="who">'+esc(s.cast[id].first)+(id===s.human?' (you)':'')+'</div>'
          +(rd?'<div class="tband" style="color:'+col+'">'+esc(rd.band.label)+'</div>':'<div class="tband">&nbsp;</div>')
          +'<div class="marks">'+marks(counts[id])+'</div></div>';
      }).join('')+'</div>'
      +(reveal?'<div style="text-align:center;color:var(--signal);font-family:var(--disp);'
        +'font-size:20px;letter-spacing:.1em;text-transform:uppercase">'
        +esc(res.evicted===s.human?'You are evicted':s.cast[res.evicted].name+' is evicted')+'</div>':'')
      +'</div>'+renderLog();
    scrollFeed();
  }
  function marks(n){
    var o='';
    for(var j=0;j<n;j++) o+=(j>0&&j%5===0?' ':'')+'|';
    return o||'.';
  }
  /* Deliberate, but not punishing. At 760ms a twelve vote tally took ten
     seconds and there are thirteen of them in a run, which is over two minutes
     of a twenty five minute session spent watching marks appear. Tapping
     anywhere drops the rest at once. */
  function skip(){
    while(i<order.length){ counts[order[i].target]++; i++; }
    if(timer) clearTimeout(timer);
    step();
  }
  function step(){
    if(i>=order.length){
      if(res.tieBreak!=null) say(s.cast[res.tieBreak].first+' breaks the tie.','hot');
      paint(true);
      say(res.evicted===s.human?tsay('evictedYou'):tsay('evicted',{name:s.cast[res.evicted].name}),'ev-bad','out');
      dock({label:'Live with it',go:function(){
        screen='phase'; answer(null); }});
      return;
    }
    counts[order[i].target]++;
    i++;
    paint(false);
    timer=setTimeout(step,520);
  }
  /* The one green button still advances, it just advances the tally. */
  dock({label:'Read it out',note:'Drop the rest of the votes at once',go:skip});
  paint(false);
  timer=setTimeout(step,640);
}

// ── results ────────────────────────────────────────────────────────────────
function finishRun(){
  if(!s.awarded){
    s.awarded=true;
    var place=s.result.playerPlace;
    account.xp=(account.xp||0)+T.xpForFinish(place);
    var c=account.career||{runs:0,wins:0,panels:0,placeSum:0,bestPlace:null};
    c.runs=(c.runs||0)+1; c.placeSum=(c.placeSum||0)+place;
    if(place===1) c.wins=(c.wins||0)+1;
    if(place<=8) c.panels=(c.panels||0)+1;
    c.bestPlace=c.bestPlace==null?place:Math.min(c.bestPlace,place);
    account.career=c; saveAccount(); clearRun();
  }
  screen='results'; render();
}

function renderRecap(){
  app.className='scroll';
  var rec=RC.build(s);
  var me=s.cast[s.human];

  var weeks=rec.weeks.map(function(w){
    var tags='';
    if(w.broken) tags+='<span class="pip risk">'+w.broken+' broke a promise</span>';
    if(w.powers&&w.powers.length) tags+='<span class="pip veto">power</span>';
    if(w.evicted===s.human) tags+='<span class="pip risk">you</span>';
    var body=''
      +(w.beats||[]).map(function(b){ return '<p class="b">'+esc(b)+'</p>'; }).join('')
      +((w.powers&&w.powers.length)?'<h4>Powers</h4>'+w.powers.map(function(p){ return '<p class="pw">'+esc(p)+'</p>'; }).join(''):'')
      +((w.votes&&w.votes.length)?'<h4>The vote, with names on it</h4>'+w.votes.map(function(v){
          return '<p class="v'+(v.broke?' broke':'')+(v.target===s.human||v.voter===s.human?' you':'')+'">'+esc(v.text)+'</p>'; }).join(''):'')
      +((w.blame&&w.blame.length)?'<h4>Who got blamed</h4>'+w.blame.map(function(b){
          return '<p class="b">'+esc(b.text)+' '+(b.correct?'They were right.':'They were wrong.')+'</p>'; }).join(''):'');
    return '<details class="wk"'+(w.evicted===s.human?' open':'')+'><summary>'
      +'<span class="no">Week '+w.week+'</span><span class="hl">'+esc(w.headline)+'</span>'
      +'<span class="tags">'+tags+'</span></summary>'
      +'<div class="body">'+body+'</div></details>';
  }).join('');

  var chain=rec.chain.map(function(c){
    var cls=c.kind==='exit'||c.kind==='result'?'big':(c.good?'good':'');
    return '<p class="'+cls+'">'+esc(c.text)+(c.detail?'<small>'+esc(c.detail)+'</small>':'')+'</p>';
  }).join('');

  var tl=rec.alliances.map(function(a){
    return '<div class="a'+(a.hadYou?' mine':'')+'">'
      +'<b>'+esc(a.members.join(', '))+'</b>'
      +'<i>week '+a.formed+(a.alive?' to the end':(a.died?' to '+a.died:''))+'</i>'
      +'<i>'+(a.hadYou?'yours':(a.youKnew?'you knew':'you never knew'))+'</i></div>';
  }).join('')||'<div class="a"><b>Nobody formalised anything.</b></div>';

  var pw=rec.powers.map(function(p){
    return '<tr><td>'+esc(p.name)+'</td><td>'+esc(p.holder)+(p.wasYou?' (you)':'')+'</td>'
      +'<td>week '+p.week+'</td><td>'+(p.used?'played week '+p.usedWeek:'never played')+'</td>'
      +'<td>'+(p.victim?esc(p.victim)+(p.victimWasYou?' (you)':'')+' lost a vote':'')+'</td></tr>';
  }).join('');

  app.innerHTML=''
   +'<div class="topbar"><span class="wk" style="font-family:var(--disp)">The Recap</span>'
   +'<span class="ph">Seed '+esc(s.seed)+'</span></div>'
   +'<div class="chain"><h2>'+(me.place===1?'How you won':'How it ended')+'</h2>'+chain+'</div>'
   +'<div class="file"><h2>Every week, with the names on the votes</h2>'
   +'<div class="sub">During the run the tally was anonymous. It is not any more.</div></div>'
   +weeks
   +'<div class="file" style="margin-top:20px"><h2>Alliances</h2>'
   +'<div class="sub">Including the ones you never found out about.</div>'
   +'<div class="tl">'+tl+'</div></div>'
   +(pw?'<div class="file"><h2>Powers</h2><div class="scroll"><table class="truth">'
     +'<thead><tr><th>Power</th><th>Held by</th><th>Awarded</th><th>Used</th><th>Cost</th></tr></thead>'
     +'<tbody>'+pw+'</tbody></table></div></div>':'')
   +'<div class="file"><h2>What you actually knew</h2>'
   +'<div class="sub">You misread '+rec.stats.misread+' of the other fifteen, and '
   +rec.stats.flattered+' of them let you think better of them than they thought of you.</div>'
   +'<div class="scroll"><table class="truth"><thead><tr>'
   +'<th>Name</th><th>Build</th><th>You believed</th><th>The truth</th><th>Place</th></tr></thead><tbody>'
   +rec.reads.map(function(r){
      return '<tr><td>'+esc(r.name)+'</td><td>'+esc(r.archetype)+'</td>'
        +'<td>'+esc(r.believed.label)+'</td>'
        +'<td class="'+(r.wrong?'wrong':'')+'">'+esc(r.truth.label)+'</td>'
        +'<td class="r">'+(r.place||'')+'</td></tr>'; }).join('')
   +'</tbody></table></div></div>';
  setBar('',[{label:'Run it again',cls:'prime',go:function(){ startRun(null); }},
             {label:'Back to the results',go:function(){ screen='results'; render(); }},
             {label:'Back to the file',go:function(){ screen='title'; render(); }}]);
}

function renderResults(){
  app.className='scroll';
  var res=s.result, me=s.cast[s.human];
  var jurors=res.detail.map(function(d){
    return '<tr><td>'+esc(s.cast[d.juror].name)+'</td><td>'+esc(s.cast[d.voted].first)+'</td></tr>';
  }).join('');

  /* The truth reveal. Everything the run kept from you, side by side with what
     you believed. This is the payoff for the whole belief layer. */
  var truth=s.cast.filter(function(p){ return p.id!==s.human; }).map(function(p){
    var believed=E.band(s.rel.belief[s.human][p.id].v);
    var actual=E.band(s.rel.trust[p.id][s.human]);
    var wrong=believed.label!==actual.label;
    return '<tr><td>'+esc(p.name)+'</td><td>'+esc(p.archetype)+'</td>'
      +'<td>'+esc(believed.label)+'</td>'
      +'<td class="'+(wrong?'wrong':'')+'">'+esc(actual.label)+'</td>'
      +'<td class="r">'+(p.place||'')+'</td></tr>';
  }).join('');

  var wrongCount=s.cast.filter(function(p){
    return p.id!==s.human
      && E.band(s.rel.belief[s.human][p.id].v).label!==E.band(s.rel.trust[p.id][s.human]).label;
  }).length;

  app.innerHTML=''
   +'<div class="topbar"><span class="wk">'+(me.place===1?'You won':'Place '+me.place)+'</span>'
   +'<span class="ph">Seed '+esc(s.seed)+'</span></div>'
   +'<div class="file"><h2>'+esc(s.cast[res.winner].name)+' takes it</h2>'
   +'<div class="sub">'+esc(s.cast[res.winner].archetype)+', '
   +s.cast[res.winner].compWins.length+' comp wins, '
   +s.cast[res.winner].weeksAsCaptain+' weeks as Captain, At Risk '+s.cast[res.winner].timesAtRisk+' times.</div>'
   +'<div class="scroll"><table class="truth"><thead><tr><th>Juror</th><th>Voted</th></tr></thead>'
   +'<tbody>'+jurors+'</tbody></table></div></div>'
   +'<div class="file"><h2>What you actually knew</h2>'
   +'<div class="sub">You misread '+wrongCount+' of the other fifteen. '
   +'The right hand column is what they really thought of you.</div>'
   +'<div class="scroll"><table class="truth"><thead><tr>'
   +'<th>Name</th><th>Build</th><th>You believed</th><th>The truth</th><th>Place</th>'
   +'</tr></thead><tbody>'+truth+'</tbody></table></div></div>'
   +'<div class="file"><h2>Your run</h2><div class="grid2">'
   +'<div><label>Finish</label><div style="font-family:var(--disp);font-size:24px;color:var(--paper)">'+me.place+' of 16</div></div>'
   +'<div><label>XP earned</label><div style="font-family:var(--disp);font-size:24px;color:var(--paper)">'+T.xpForFinish(me.place)+'</div></div>'
   +'<div><label>Comp wins</label><div style="font-family:var(--disp);font-size:24px;color:var(--paper)">'+me.compWins.length+'</div></div>'
   +'<div><label>Level</label><div style="font-family:var(--disp);font-size:24px;color:var(--paper)">'+level()+'</div></div>'
   +'</div></div>';
  /* The loop has to close HERE. Getting back into a new house meant going to
     the title and finding New run, which is two steps and a screen change after
     a fourteen week season. The most likely next thing a player wants is
     another one, so it is the primary and it is on this screen. */
  setBar('',[
    {label:'Run it again',cls:'prime',go:function(){
      var sd=''; startRun(sd||null); }},
    {label:'Read it back',cls:'go',go:function(){ screen='recap'; render(); }},
    {label:'Back to the file',go:function(){ screen='title'; render(); }}]);
}

/* Repainting the week loop from render() means redrawing the stage and arming
   the button, which is exactly what idle() does. */
function renderPhase(){ idle(); }

// ── boot ───────────────────────────────────────────────────────────────────
account=loadAccount();
render();
})();
</script>
