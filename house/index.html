<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RunTheHouse</title>
<meta name="description" content="A social strategy elimination sim. Sixteen players, one prize, and fifteen opponents who form their own opinions of you.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0b0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0b0c'/%3E%3Crect x='6' y='9' width='20' height='14' fill='none' stroke='%23d4402c' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23d4402c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ── RunTheHouse. Surveillance monitor, casting file paperwork, chalk tallies.
   Cold institutional surfaces with human handwriting on top. GDD §17.
   ONE aggressive accent, --signal, and it is reserved for eviction and
   betrayal. If it starts appearing on buttons, the design has drifted. */
:root{
  --ink:#0a0b0c; --panel:#121417; --panel2:#171a1e; --line:#252a30;
  --chalk:#c9cfd5; --dim:#727a85; --dimmer:#4a515b;
  --paper:#e7e2d7; --hand:#bfae8e;
  --signal:#d4402c; --signal-dim:#7c2b21;
  --ok:#7f9a86;
  --tile:132px;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --disp:'Oswald','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);color:var(--chalk);
  font-family:var(--mono);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:.06em;
  text-transform:uppercase;margin:0}

/* film grain + scanlines, the surveillance surface */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);
  mix-blend-mode:screen}

#app{max-width:1180px;margin:0 auto;padding:0 16px 96px;min-height:100dvh}

/* ── chrome ─────────────────────────────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--ink) 72%,transparent);
  padding:14px 0 12px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);margin-bottom:20px}
.topbar .wk{font-family:var(--disp);font-size:26px;letter-spacing:.1em;color:var(--paper)}
.topbar .ph{color:var(--dim);text-transform:uppercase;letter-spacing:.16em;font-size:11px}
.topbar .sp{margin-left:auto;display:flex;gap:14px;align-items:baseline}
.meta{color:var(--dimmer);font-size:11px;letter-spacing:.1em;text-transform:uppercase}

/* ── the house wall: a bank of cameras, not a dashboard of cards ────────── */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:2px;
  background:var(--line);border:1px solid var(--line);margin-bottom:22px}
.cell{background:var(--panel);position:relative;padding:8px 8px 9px;
  display:flex;flex-direction:column;gap:5px;min-height:170px;
  transition:background .18s}
.cell.sel{background:var(--panel2);outline:1px solid var(--hand);outline-offset:-1px}
.cell.gone{opacity:.28;filter:grayscale(1)}
.cell.risk{background:linear-gradient(180deg,var(--panel) 60%,rgba(212,64,44,.14))}
.cell.you{outline:1px solid var(--paper);outline-offset:-1px}
.cell button.pick{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.cam{aspect-ratio:1/1;background:#000;border:1px solid var(--line);overflow:hidden;position:relative}
.cam img.pxa,.cam svg{display:block;width:100%;height:100%}
/* Never resample. The whole point of drawing at 32 square is that it stays at
   32 square and the browser only decides how big each of those pixels is. */
.pxa{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.cam .rec{position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;
  background:var(--signal);opacity:.85}
.cell.gone .cam .rec{display:none}
.nm{font-family:var(--disp);font-size:14px;letter-spacing:.05em;color:var(--paper);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{font-size:11px;letter-spacing:.04em;line-height:1.3}
.lbl b{font-weight:400;display:block}
.lbl i{font-style:normal;color:var(--dimmer);font-size:10px;letter-spacing:.06em}
.t-bonded{color:#e4d9b8} .t-warm{color:#b6c3ae} .t-flat{color:var(--dim)}
.t-cool{color:#b08a80} .t-hostile{color:var(--signal)}
.pips{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.pip{font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:1px 4px;
  border:1px solid var(--dimmer);color:var(--dim)}
.pip.cap{border-color:var(--paper);color:var(--paper)}
.pip.risk{border-color:var(--signal);color:var(--signal)}
.pip.veto{border-color:var(--ok);color:var(--ok)}

/* ── the feed: chalk on slate ───────────────────────────────────────────── */
.feed{border:1px solid var(--line);background:var(--panel);padding:14px 16px;
  max-height:280px;overflow-y:auto;margin-bottom:20px;scroll-behavior:smooth}
.feed p{margin:0 0 9px;color:var(--chalk)}
.feed p:last-child{margin-bottom:0}
.feed .sys{color:var(--dim);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.feed .hot{color:var(--signal)}
.feed .quiet{color:var(--dimmer);font-style:italic}

/* ── actions ────────────────────────────────────────────────────────────── */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(10,11,12,.97);
  border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .inner{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .prompt{color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  margin-right:auto}
.btn{border:1px solid var(--dimmer);padding:8px 16px;font-family:var(--disp);font-size:14px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--chalk);transition:.15s}
.btn:hover{border-color:var(--paper);color:var(--paper);background:rgba(255,255,255,.03)}
.btn[disabled]{opacity:.3;pointer-events:none}
.btn.go{border-color:var(--paper);color:var(--paper)}
.btn.hot{border-color:var(--signal);color:var(--signal)}
.btn.hot:hover{background:rgba(212,64,44,.1);border-color:var(--signal)}
.btn.sm{padding:5px 10px;font-size:12px}

/* ── panels, forms, the file ────────────────────────────────────────────── */
.file{border:1px solid var(--line);background:var(--panel);padding:20px;margin-bottom:20px}
.file h2{font-size:17px;color:var(--paper);margin-bottom:4px}
.file .sub{color:var(--dim);font-size:12px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
/* Reading of the plan you are currently holding, above the wall. */
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 16px}
.tg{border:1px solid var(--line);padding:4px 9px;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);background:var(--panel)}
.tg.bad{border-color:var(--signal);color:var(--signal)}
.tg.good{border-color:#7f9a86;color:#7f9a86}
label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-bottom:5px}
input,select{font:inherit;background:#0e1013;border:1px solid var(--line);color:var(--paper);
  padding:8px 10px;min-width:0;width:100%}
input:focus,select:focus{outline:none;border-color:var(--hand)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.choice{border:1px solid var(--line);background:var(--panel2);padding:12px 14px;text-align:left;
  transition:.15s;width:100%}
.choice:hover{border-color:var(--hand)}
.choice.on{border-color:var(--paper);background:rgba(255,255,255,.04)}
.choice b{display:block;font-family:var(--disp);font-size:15px;letter-spacing:.06em;
  color:var(--paper);font-weight:400;text-transform:uppercase}
.choice span{color:var(--dim);font-size:12px}

/* ── the tree ───────────────────────────────────────────────────────────── */
.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.trunk h3{font-size:14px;color:var(--paper);margin-bottom:2px}
.trunk .blurb{color:var(--dimmer);font-size:11px;margin-bottom:10px;min-height:30px}
.branch{margin-bottom:10px}
.branch .bn{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  margin-bottom:4px}
.nodes{display:flex;gap:3px}
.node{flex:1;aspect-ratio:1/1;border:1px solid var(--line);background:#0e1013;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dimmer);
  position:relative;transition:.15s}
.node.can{border-color:var(--dim);color:var(--chalk);cursor:pointer}
.node.can:hover{border-color:var(--paper);background:rgba(255,255,255,.05)}
.node.own{background:var(--hand);border-color:var(--hand);color:#14161a}
.node.locked{opacity:.4}

/* ── comps ──────────────────────────────────────────────────────────────── */
.stage{border:1px solid var(--line);background:var(--panel);padding:24px;margin-bottom:20px;
  text-align:center;min-height:300px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;user-select:none}
.stage h2{font-size:22px;color:var(--paper)}
.stage .blurb{color:var(--dim);font-size:13px;max-width:420px}
.padgrid{display:grid;grid-template-columns:repeat(3,72px);gap:6px}
.pad{aspect-ratio:1/1;border:1px solid var(--line);background:#0e1013;transition:.09s}
.pad.lit{background:var(--paper);border-color:var(--paper)}
.pad.hit{background:var(--hand);border-color:var(--hand)}
.rbox{width:min(420px,80vw);height:130px;border:1px solid var(--line);background:#0e1013;
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);
  font-size:20px;letter-spacing:.1em;color:var(--dim);transition:.06s}
.rbox.go{background:var(--ok);color:#0a0b0c;border-color:var(--ok)}
.rbox.bad{background:var(--signal-dim);color:var(--paper)}
.track{width:min(460px,86vw);height:26px;border:1px solid var(--line);background:#0e1013;
  position:relative;overflow:hidden}
.track .zone{position:absolute;top:0;bottom:0;left:42%;width:16%;background:rgba(127,154,134,.16);
  border-left:1px solid var(--ok);border-right:1px solid var(--ok)}
.track .mk{position:absolute;top:2px;bottom:2px;width:4px;background:var(--paper)}
.holdpad{width:min(300px,70vw);aspect-ratio:1/1;border:1px solid var(--dim);
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);
  font-size:16px;letter-spacing:.14em;color:var(--dim);background:#0e1013;transition:.12s}
.holdpad.on{border-color:var(--paper);color:var(--paper);background:#16191d}
.qbtns{display:flex;flex-direction:column;gap:8px;width:min(420px,86vw)}
.meterwrap{width:min(460px,86vw);height:5px;background:#0e1013;border:1px solid var(--line)}
.meter{height:100%;background:var(--hand);width:0%}

/* ── vote reveal, the one place the game slows down ─────────────────────── */
.tallywrap{display:flex;gap:34px;justify-content:center;margin:22px 0 8px;flex-wrap:wrap}
.tcol{text-align:center;min-width:132px}
.tface{width:96px;height:96px;margin:0 auto 8px;border:2px solid var(--line);background:#000;
  transition:border-color .3s}
.tface img.pxa,.tface svg{display:block;width:100%;height:100%}
.tcol.out .tface{box-shadow:0 0 0 4px rgba(212,64,44,.18)}
.tband{font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.tcol .who{font-family:var(--disp);font-size:17px;color:var(--paper);letter-spacing:.06em}
.marks{font-family:var(--disp);font-size:30px;letter-spacing:.14em;color:var(--chalk);
  min-height:44px;line-height:1.3;word-break:break-all}
.tcol.out .who{color:var(--signal)}
.tcol.out .marks{color:var(--signal)}

/* ── results ────────────────────────────────────────────────────────────── */
table.truth{width:100%;border-collapse:collapse;font-size:12px}
table.truth th{text-align:left;font-weight:400;color:var(--dim);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
table.truth td{padding:6px 8px;border-bottom:1px solid #1a1d21}
table.truth td.r{text-align:right;color:var(--dim)}
.wrong{color:var(--signal)}
.scroll{overflow-x:auto}

/* ── the scene: where you are, what it is about, three ways to answer ────── */
.scene{border:1px solid var(--line);background:var(--panel);padding:0;margin-bottom:20px;overflow:hidden}
.scene .where{padding:16px 20px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(191,174,142,.07),transparent)}
.scene .where b{display:block;font-family:var(--disp);font-size:19px;letter-spacing:.04em;
  color:var(--hand);font-weight:400;text-transform:none}
.scene .said{padding:18px 20px;color:var(--paper);font-size:15px;line-height:1.65}
.opts{display:flex;flex-direction:column;gap:1px;background:var(--line)}
.opt{background:var(--panel2);padding:13px 18px;display:flex;gap:14px;align-items:flex-start;
  text-align:left;width:100%;transition:.14s;border-left:2px solid transparent}
.opt:hover{background:#1c2025}
.opt .key{font-family:var(--disp);font-size:17px;letter-spacing:.06em;color:var(--dim);
  min-width:16px;padding-top:1px}
.opt .txt{flex:1;color:var(--chalk)}
.opt .tag{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);
  border:1px solid var(--dimmer);padding:1px 5px;white-space:nowrap;align-self:center}
.opt.safe{border-left-color:var(--ok)}
.opt.safe:hover .key{color:var(--ok)}
.opt.neutral{border-left-color:var(--dim)}
.opt.risky{border-left-color:var(--signal)}
.opt.risky:hover{background:rgba(212,64,44,.07)}
.opt.risky:hover .key{color:var(--signal)}
.opt.risky .tag{border-color:var(--signal-dim);color:var(--signal)}
.opt[disabled]{opacity:.32;pointer-events:none}

.energy{display:flex;align-items:center;gap:7px}
.pips-e{display:flex;gap:2px}
.pip-e{width:7px;height:13px;background:var(--hand);opacity:.9}
.pip-e.spent{background:transparent;border:1px solid var(--dimmer)}

/* ── powers ───────────────────────────────────────────────────────────────── */
.power{border:1px solid var(--hand);background:linear-gradient(180deg,rgba(191,174,142,.09),var(--panel));
  padding:18px 20px;margin-bottom:20px}
.power h2{color:var(--hand);font-size:18px}
.power .kind{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  margin-bottom:6px}
.power .long{color:var(--chalk);margin-top:8px;font-size:13px}
.power.hot{border-color:var(--signal);
  background:linear-gradient(180deg,rgba(212,64,44,.12),var(--panel))}
.power.hot h2{color:var(--signal)}
.holding{display:inline-block;border:1px solid var(--hand);color:var(--hand);
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:1px 5px;margin-left:8px}

/* ── the recap: the chain, week by week ─────────────────────────────────── */
.wk{border:1px solid var(--line);background:var(--panel);margin-bottom:2px}
.wk>summary{padding:12px 18px;cursor:pointer;list-style:none;display:flex;gap:14px;
  align-items:baseline;transition:.14s}
.wk>summary::-webkit-details-marker{display:none}
.wk>summary:hover{background:var(--panel2)}
.wk .no{font-family:var(--disp);font-size:15px;letter-spacing:.1em;color:var(--dim);min-width:64px}
.wk .hl{color:var(--paper);flex:1}
.wk .tags{display:flex;gap:4px}
.wk .body{padding:4px 18px 16px 96px;border-top:1px solid var(--line)}
.wk .body p{margin:0 0 6px;color:var(--chalk)}
.wk .body p.b{color:var(--dim)}
.wk .body p.pw{color:var(--hand)}
.wk .body p.v{padding-left:12px;border-left:1px solid var(--line)}
.wk .body p.v.broke{border-left-color:var(--signal)}
.wk .body p.v.you{color:var(--paper);border-left-color:var(--paper)}
.wk .body h4{font-family:var(--disp);font-weight:400;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dimmer);margin:14px 0 6px}
.chain{border:1px solid var(--signal-dim);background:linear-gradient(180deg,rgba(212,64,44,.07),var(--panel));
  padding:20px;margin-bottom:20px}
.chain h2{color:var(--signal)}
.chain p{margin:0 0 8px;color:var(--chalk)}
.chain p.big{color:var(--paper);font-size:15px}
.chain p.good{color:var(--ok)}
.chain small{display:block;color:var(--dimmer)}
.tl{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line)}
.tl .a{background:var(--panel2);padding:8px 14px;display:flex;gap:12px;align-items:baseline;font-size:12px}
.tl .a b{font-weight:400;color:var(--paper);flex:1}
.tl .a.mine{background:#1b1f23;border-left:2px solid var(--hand)}
.tl .a i{font-style:normal;color:var(--dimmer);font-size:11px}

/* ── the visual language, see ui.js ─────────────────────────────────────── */
.ic{display:inline-block;vertical-align:-2px;flex:none}

/* phase rail: where you are in the week and how far the vote is */
.rail{display:flex;gap:2px;margin:10px 0 4px;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rl{flex:1 1 0;min-width:38px;display:flex;flex-direction:column;gap:4px;align-items:center}
.rl i{display:block;width:100%;height:3px;background:var(--line)}
.rl b{font-family:var(--disp);font-weight:400;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dimmer);white-space:nowrap}
.rl.done i{background:var(--dimmer)}
.rl.done b{color:var(--dim)}
.rl.now i{background:var(--hand);height:5px;margin-top:-1px}
.rl.now b{color:var(--paper)}
.railnote{color:var(--dim);font-size:11px;letter-spacing:.06em;margin-bottom:14px}

/* relationship ladder: seven rungs, one lit */
.ldr{display:inline-flex;gap:2px;align-items:flex-end;height:16px}
.ldr i{display:block;width:5px;height:5px;background:#2b3138}
.ldr i.on{height:16px;box-shadow:0 0 6px currentColor}

.bbar{display:inline-block;height:4px;background:#1b1f24;vertical-align:middle}
.bbar>span{display:block;height:100%}

/* legend */
.legend{border:1px solid var(--line);background:var(--panel);padding:10px 14px;margin-bottom:16px}
.lgrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lgrow+.lgrow{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim)}
.lg i{width:14px;height:8px;display:block}
.dimrow .lg{color:var(--dimmer)}

/* the wall, rebuilt around the colour language */
.wall{gap:2px}
.cell{border-left:4px solid transparent;padding-left:8px}
.cell .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.cell .marks{display:flex;gap:6px;align-items:center;color:var(--dim);flex-wrap:wrap;min-height:20px}
.cell .marks .ic{opacity:.9}
.m-cap{color:var(--paper)} .m-risk{color:var(--signal)} .m-veto{color:var(--ok)}
.m-rat{color:#9a7f5a} .m-ally{color:var(--hand)} .m-seen{color:var(--dim)}
.m-threat{color:#c8724f} .m-stale{color:var(--dimmer)} .m-power{color:var(--hand)}
.cell .band{font-size:11px;letter-spacing:.04em}
.cell .fresh{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dimmer)}

.sorts{display:flex;gap:0;margin-bottom:10px;border:1px solid var(--line);width:fit-content}
.sorts button{padding:5px 12px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);border-right:1px solid var(--line)}
.sorts button:last-child{border-right:none}
.sorts button.on{background:var(--panel2);color:var(--paper)}

/* alliance map */
.amap{width:100%;max-width:520px;display:block;margin:0 auto}
.mapnote{color:var(--dim);font-size:11px;text-align:center;margin-top:8px}

/* week strip */
.strip{display:flex;gap:2px;margin-bottom:16px;background:var(--line);border:1px solid var(--line);
  flex-wrap:wrap}
.ws{flex:1 1 150px;background:var(--panel);padding:8px 12px;display:flex;flex-direction:column;gap:3px}
.wsl{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer);
  display:flex;align-items:center;gap:5px}
.wsv{font-family:var(--disp);font-size:15px;letter-spacing:.04em;color:var(--paper)}
.wsv.dim{color:var(--dimmer);font-size:13px}
.ws.c-cap .wsl{color:var(--paper)} .ws.c-risk .wsl{color:var(--signal)}
.ws.c-risk .wsv{color:var(--signal)} .ws.c-veto .wsl{color:var(--ok)}

/* feed, colour coded by what kind of thing happened */
.feed p{display:flex;gap:8px;align-items:flex-start}
.feed p .ic{margin-top:2px;flex:none;opacity:.85}
.feed p.ev-power{color:var(--hand)}
.feed p.ev-vote{color:var(--paper)}
.feed p.ev-bad{color:var(--signal)}
.feed p.ev-good{color:var(--ok)}

/* ── moments: the beats that must not scroll past ────────────────────────── */
.moment{border:1px solid var(--line);background:var(--panel);padding:0;margin-bottom:20px;
  overflow:hidden;animation:mo .28s ease-out}
@keyframes mo{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.moment .mh{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;
  align-items:center;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
.moment .mh b{font-family:var(--disp);font-weight:400;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim)}
.moment h2{font-size:21px;color:var(--paper);padding:18px 20px 4px}
.moment .msub{padding:0 20px 16px;color:var(--dim);font-size:13px}
.moment .faces{display:flex;gap:14px;flex-wrap:wrap;padding:0 20px 18px}
.mface{text-align:center;width:88px}
.mface .fr{width:88px;height:88px;border:2px solid var(--line);background:#000;overflow:hidden}
.mface .fr img{display:block;width:100%;height:100%}
.mface .fn{font-family:var(--disp);font-size:13px;letter-spacing:.04em;color:var(--paper);
  margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mface .ft{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer)}
.moment.t-bad .mh{background:linear-gradient(180deg,rgba(212,64,44,.16),transparent)}
.moment.t-bad{border-color:var(--signal-dim)}
.moment.t-bad .mh b{color:var(--signal)}
.moment.t-good .mh{background:linear-gradient(180deg,rgba(127,154,134,.14),transparent)}
.moment.t-good .mh b{color:var(--ok)}
.moment.t-power .mh{background:linear-gradient(180deg,rgba(191,174,142,.16),transparent)}
.moment.t-power{border-color:var(--hand)}
.moment.t-power .mh b{color:var(--hand)}

.gread{border-left:3px solid var(--dimmer);padding:8px 14px;margin-top:14px;
  background:var(--panel2);color:var(--dim);font-size:13px}
.gread.good{border-left-color:var(--ok);color:var(--chalk)}

.hide{display:none !important}
@media(max-width:720px){
  :root{--tile:104px}
  #app{padding:0 10px 110px}
  .tree{grid-template-columns:1fr}
  .topbar .wk{font-size:21px}
  .cell{min-height:150px}
  .padgrid{grid-template-columns:repeat(3,60px)}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="bar hide" id="bar"><div class="inner" id="barinner"></div></div>

<script src="rng.js"></script>
<script src="tree.js"></script>
<script src="generate.js"></script>
<script src="engine.js"></script>
<script src="comps.js"></script>
<script src="powers.js"></script>
<script src="scenes.js"></script>
<script src="run.js"></script>
<script src="recap.js"></script>
<script src="avatar.js"></script>
<script src="ui.js"></script>
<script src="strings.js"></script>
<script>
(function(){
'use strict';
var RNG=window.RH_RNG, T=window.RH_TREE, G=window.RH_GEN, E=window.RH_ENGINE,
    C=window.RH_COMPS, R=window.RH_RUN, STR=window.RH_STRINGS,
    PW=window.RH_POWERS, SC=window.RH_SCENES, RC=window.RH_RECAP, U=window.RH_UI, AV=window.RH_AVATAR;

var app=document.getElementById('app');
var bar=document.getElementById('bar');
var barin=document.getElementById('barinner');

var SAVE='rh_run_v1', ACCT='rh_account_v1';
var s=null, account=null, screen='title';

// ── account ────────────────────────────────────────────────────────────────
function loadAccount(){
  try{ var a=JSON.parse(localStorage.getItem(ACCT)); if(a&&a.owned) return a; }catch(e){}
  return {name:'',gender:'x',hometown:'',region:'',owned:[],xp:0,
          career:{runs:0,wins:0,panels:0,bestPlace:null,placeSum:0}};
}
function saveAccount(){ try{ localStorage.setItem(ACCT,JSON.stringify(account)); }catch(e){} }
function level(){ return T.levelForXp(account.xp||0); }
function tokensTotal(){ return T.tokensForLevel(level()); }
function tokensSpent(){ return T.spend(new Set(account.owned)); }
function tokensLeft(){ return tokensTotal()-tokensSpent(); }

function saveRun(){ try{ localStorage.setItem(SAVE,JSON.stringify(R.serialise(s))); }catch(e){} }
function clearRun(){ try{ localStorage.removeItem(SAVE); }catch(e){} }
function hasRun(){ try{ return !!localStorage.getItem(SAVE); }catch(e){ return false; } }

// ── procedural avatars ─────────────────────────────────────────────────────
/* Built from a small custom shape vocabulary rather than an illustration pack
   (GDD §17). Two tones, hard edges, framed like a still off a camera that has
   been running for six weeks and is not being watched by anyone. */
function avatar(p,size){
  return AV.img(p.avatarSeed,size||96);
}

// ── feed ───────────────────────────────────────────────────────────────────
var feedLines=[];
/* A line in the feed can carry a drawn mark. Sixteen weeks of undifferentiated
   grey paragraphs was the single hardest thing in this interface to skim: the
   eviction and the small talk looked identical. */
function say(text,cls,ic){ if(!text) return; feedLines.push({t:text,c:cls||'',i:ic||null});
  if(feedLines.length>90) feedLines.shift(); }
function sysline(text){ say(text,'sys'); }
function renderFeed(){
  return '<div class="feed" id="feed">'+feedLines.map(function(l){
    return '<p class="'+l.c+'">'+(l.i?U.icon(l.i,14):'')+'<span>'+esc(l.t)+'</span></p>';
  }).join('')+'</div>';
}
function esc(x){ return String(x).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function scrollFeed(){ var f=document.getElementById('feed'); if(f) f.scrollTop=f.scrollHeight; }

function tsay(bank,vars){ return STR.say(s.rng.text,bank,vars); }

// ── the wall ───────────────────────────────────────────────────────────────
function readOf(id){
  if(id===s.human) return null;
  return E.read(s.rel,s.human,id);
}
function cellFor(p,opts){
  var o=opts||{};
  var me=s.human;
  var rd=readOf(p.id);
  var band=rd?rd.band.label:null;
  var col=rd?U.bandColor(band):'#e7e2d7';

  var cls='cell';
  /* `block` is a provisional block: names the player has chosen but not yet
     locked in. Without it the intent screen showed the two nominees looking
     exactly like everybody else, and the only way to tell who was up there was
     to read the tag row. */
  var onBlock=(s.atRisk&&s.atRisk.indexOf(p.id)!==-1)||(o.block&&o.block.indexOf(p.id)!==-1);
  if(p.status!=='active') cls+=' gone';
  if(onBlock) cls+=' risk';
  if(p.id===me) cls+=' you';
  if(o.selected&&o.selected.indexOf(p.id)!==-1) cls+=' sel';

  /* Every state this person is in, as a drawn mark rather than a word. The
     whole point is that a player can sweep the wall and see who holds power,
     who is exposed and who they have stopped talking to, without reading. */
  var marks='';
  if(s.captain===p.id) marks+='<span class="m-cap">'+U.icon('captain',18)+'</span>';
  if(onBlock) marks+='<span class="m-risk">'+U.icon('risk',18)+'</span>';
  if(s.vetoHolder===p.id) marks+='<span class="m-veto">'+U.icon('veto',18)+'</span>';
  if(p.onRations) marks+='<span class="m-rat">'+U.icon('rations',17)+'</span>';
  if(p.id!==me){
    var shared=E.sharedAlliances(s.alliances,me,p.id).filter(function(a){return a.alive;});
    if(shared.length) marks+='<span class="m-ally">'+U.icon('alliance',18)+'</span>';
    else {
      var seen=s.alliances.filter(function(a){ return a.alive&&a.members.indexOf(p.id)!==-1&&a.known&&a.known[me]!=null; });
      if(seen.length) marks+='<span class="m-seen">'+U.icon('seen',18)+'</span>';
    }
    var th=E.threatScore(s.rel,s.cast,me,p.id,s.panel,s.alliances);
    if(th>=62) marks+='<span class="m-threat">'+U.icon('threat',17)+'</span>';
    if(rd&&rd.conf<0.4) marks+='<span class="m-stale">'+U.icon('stale',17)+'</span>';
  } else if(PW.heldBy(s,me).length){
    marks+='<span class="m-power">'+U.icon('power',17)+'</span>';
  }
  if(p.status==='panel') marks+='<span class="m-seen">'+U.icon('panel',17)+'</span>';
  else if(p.status==='evicted') marks+='<span class="m-seen">'+U.icon('out',17)+'</span>';

  var label;
  if(p.id===me) label='<div class="band" style="color:var(--paper)">You</div>'
    +'<div class="fresh">'+esc(p.archetype)+'</div>';
  else label='<div class="band" style="color:'+col+'">'+esc(band)+'</div>'
    +'<div class="fresh">'+esc(rd.freshness)+'</div>';

  return '<div class="'+cls+'" data-id="'+p.id+'" style="border-left-color:'+col+'">'
    +(o.pick?'<button class="pick" data-pick="'+p.id+'" aria-label="'+esc(p.name)+'"></button>':'')
    +'<div class="cam">'+avatar(p,110)+'<span class="rec"></span></div>'
    +'<div class="top"><span class="nm">'+esc(p.first)+'</span>'
      +(p.id===me?'':U.ladder(band,rd.conf))+'</div>'
    +label
    +'<div class="marks">'+marks+'</div></div>';
}

var wallSort='house';
function wall(opts){
  var o=opts||{};
  var list=s.cast.filter(function(p){
    if(o.only) return o.only.indexOf(p.id)!==-1;
    return o.all?true:p.status==='active';
  });
  if(!o.only) list=U.sortCast(s,E,list,wallSort);
  var tabs='';
  if(!o.only&&!o.nosort){
    tabs='<div class="sorts">'+Object.keys(U.SORTS).map(function(k){
      return '<button data-sort="'+k+'" class="'+(wallSort===k?'on':'')+'">'+U.SORTS[k].n+'</button>';
    }).join('')+'</div>';
  }
  return tabs+'<div class="wall">'+list.map(function(p){ return cellFor(p,o); }).join('')+'</div>';
}

/* Re-bind the sort tabs after any paint that included a wall. */
function bindSorts(repaint){
  Array.prototype.forEach.call(app.querySelectorAll('[data-sort]'),function(el){
    el.onclick=function(){ wallSort=el.dataset.sort; repaint(); };
  });
}

// ── chrome ─────────────────────────────────────────────────────────────────
var PHASE_NAME={
  reset:'Reset',captain_comp:'Captain Comp',scheme1:'Scheming I',naming:'Naming',
  veto_comp:'Veto Comp',scheme2:'Scheming II',veto_ceremony:'Veto Ceremony',
  scheme3:'Scheming III',eviction:'Eviction',fallout:'Fallout',
  final3:'Final Three',panel:'The Panel',over:'Over',move_in:'Move In Night'};
function topbar(withRail){
  if(!s) return '';
  var rail=(withRail===false)?'':U.phaseRail(s.phase);
  return '<div class="topbar"><span class="wk">Week '+s.week+'</span>'
    +(rail?'':'<span class="ph">'+esc(PHASE_NAME[s.phase]||s.phase)+'</span>')
    +'<span class="sp">'+energyStrip()+'<span class="meta">'+R.activeCount(s)+' left</span>'
    +'<span class="meta">Seed '+esc(s.seed)+'</span></span></div>'+rail+weekStrip();
}

/* The three facts a player checks constantly and previously had to find by
   scanning sixteen tiles for a small icon: who has the power, who is on the
   block, who holds the Veto. */
function weekStrip(){
  if(!s||s.phase===R.PHASES.MOVE_IN||s.phase===R.PHASES.SETUP) return '';
  function slot(label,ids,cls,ic){
    if(!ids||!ids.length) return '<div class="ws"><span class="wsl">'+label+'</span>'
      +'<span class="wsv dim">not yet</span></div>';
    return '<div class="ws '+cls+'"><span class="wsl">'+ic+' '+label+'</span>'
      +'<span class="wsv">'+ids.map(function(i){
        return esc(s.cast[i].first)+(i===s.human?' (you)':''); }).join(', ')+'</span></div>';
  }
  return '<div class="strip">'
    +slot('Captain',s.captain!=null?[s.captain]:null,'c-cap',U.icon('captain',15))
    +slot('At Risk',s.atRisk&&s.atRisk.length?s.atRisk:null,'c-risk',U.icon('risk',15))
    +slot('Veto',s.vetoHolder!=null?[s.vetoHolder]:null,'c-veto',U.icon('veto',15))
    +'</div>';
}
/* Energy as marks rather than a number. GDD §17 scopes the no-numbers rule to
   relationship values, so a digit here would be legal, but a row of marks reads
   as something you are burning through and a digit reads as a budget. */
function energyStrip(){
  if(!s||!s.energy&&s.energy!==0) return '';
  var max=SC.ENERGY.BASE+SC.ENERGY.AT_RISK_BONUS, o='';
  for(var i=0;i<max;i++) o+='<span class="pip-e'+(i<s.energy?'':' spent')+'"></span>';
  return '<span class="energy"><span class="meta">Energy</span><span class="pips-e">'+o+'</span></span>';
}

/* What the player is holding, if anything, shown wherever it is relevant. */
function myPowers(){ return PW.heldBy(s,s.human); }
function powerBadge(){
  var mine=myPowers();
  if(!mine.length) return '';
  return mine.map(function(p){
    return '<span class="holding">'+esc(PW.POWERS[p.kind].name)+'</span>'; }).join('');
}

function setBar(prompt,buttons){
  if(!buttons||!buttons.length){ bar.classList.add('hide'); barin.innerHTML=''; return; }
  bar.classList.remove('hide');
  barin.innerHTML='<span class="prompt">'+esc(prompt||'')+'</span>'
    +buttons.map(function(b,i){
      return '<button class="btn '+(b.cls||'')+'" data-act="'+i+'"'+(b.off?' disabled':'')+'>'+esc(b.label)+'</button>';
    }).join('');
  Array.prototype.forEach.call(barin.querySelectorAll('[data-act]'),function(el){
    el.onclick=function(){ buttons[Number(el.dataset.act)].go(); };
  });
}

// ── screens ────────────────────────────────────────────────────────────────
function render(){
  if(screen==='title') return renderTitle();
  if(screen==='create') return renderCreate();
  if(screen==='tree') return renderTree();
  if(screen==='comp') return;               // owns its own paint
  if(screen==='vote') return;               // owns its own paint
  if(screen==='results') return renderResults();
  if(screen==='recap') return renderRecap();
  return renderPhase();
}

function renderTitle(){
  bar.classList.add('hide');
  var lv=level(), career=account.career||{runs:0,wins:0};
  app.innerHTML=''
   +'<div style="padding:44px 0 10px">'
   +'<h1 style="font-size:clamp(38px,9vw,80px);color:var(--paper);letter-spacing:.02em">RunTheHouse</h1>'
   +'<p style="color:var(--dim);max-width:560px;margin:12px 0 0">'
   +'Sixteen people, one prize, and a sealed house. Nobody here is scripted. '
   +'They form their own opinions of you, build their own alliances behind your back, '
   +'and vote on their own maths. You survive by managing what people think of you.</p></div>'
   +'<div class="file"><h2>Your File</h2>'
   +'<div class="sub">'+(account.name?esc(account.name):'Unfiled')+'</div>'
   +'<div class="grid2">'
   +'<div><label>Level</label><div style="font-family:var(--disp);font-size:24px;color:var(--paper)">'+lv+'</div></div>'
   +'<div><label>Skill tokens</label><div style="font-family:var(--disp);font-size:24px;color:var(--paper)">'+tokensLeft()+' of '+tokensTotal()+'</div></div>'
   +'<div><label>Runs</label><div style="font-family:var(--disp);font-size:24px;color:var(--paper)">'+(career.runs||0)+'</div></div>'
   +'<div><label>Wins</label><div style="font-family:var(--disp);font-size:24px;color:var(--paper)">'+(career.wins||0)+'</div></div>'
   +'</div></div>'
   +'<div class="row">'
   +(hasRun()?'<button class="btn go" id="resume">Resume run</button>':'')
   +'<button class="btn '+(hasRun()?'':'go')+'" id="newrun">New run</button>'
   +'<button class="btn" id="tofile">'+(account.name?'Edit character':'Create character')+'</button>'
   +'<button class="btn" id="totree">Skill tree</button>'
   +'</div>'
   +'<div class="row"><label style="margin:0">Seed, optional</label>'
   +'<input id="seedin" placeholder="leave blank for a new house" style="max-width:280px" inputmode="numeric"></div>';

  var res=document.getElementById('resume');
  if(res) res.onclick=function(){
    try{ s=R.restore(JSON.parse(localStorage.getItem(SAVE))); }catch(e){ clearRun(); renderTitle(); return; }
    feedLines=[]; sysline('Run resumed.'); screen='phase'; pump();
  };
  document.getElementById('newrun').onclick=function(){
    if(!account.name){ screen='create'; render(); return; }
    var sd=document.getElementById('seedin').value.trim();
    startRun(sd||null);
  };
  document.getElementById('tofile').onclick=function(){ screen='create'; render(); };
  document.getElementById('totree').onclick=function(){ screen='tree'; render(); };
}

function renderCreate(){
  bar.classList.add('hide');
  var towns=G.HOMETOWNS.map(function(h){ return '<option value="'+esc(h[0])+'"'+(account.hometown===h[0]?' selected':'')+'>'+esc(h[0])+'</option>'; }).join('');
  app.innerHTML=''
   +'<div class="topbar"><span class="wk">Casting File</span></div>'
   +'<div class="file"><h2>Who is walking in</h2>'
   +'<div class="sub">Name, where you are from, and how you read on paper. '
   +'Region and gender shape first impressions and nothing else. They never touch a competition.</div>'
   +'<div class="grid2">'
   +'<div><label>Name</label><input id="cn" value="'+esc(account.name||'')+'" maxlength="26" placeholder="First Last"></div>'
   +'<div><label>Gender</label><select id="cg">'
     +'<option value="f"'+(account.gender==='f'?' selected':'')+'>Woman</option>'
     +'<option value="m"'+(account.gender==='m'?' selected':'')+'>Man</option>'
     +'<option value="x"'+(account.gender==='x'?' selected':'')+'>Nonbinary</option></select></div>'
   +'<div><label>Hometown</label><select id="ch">'+towns+'</select></div>'
   +'</div></div>'
   +'<div class="row"><button class="btn go" id="csave">Save file</button>'
   +'<button class="btn" id="cback">Back</button></div>';
  document.getElementById('csave').onclick=function(){
    var nm=document.getElementById('cn').value.trim();
    if(!nm){ document.getElementById('cn').focus(); return; }
    account.name=nm;
    account.gender=document.getElementById('cg').value;
    account.hometown=document.getElementById('ch').value;
    var t=G.HOMETOWNS.filter(function(h){ return h[0]===account.hometown; })[0];
    account.region=t?t[1]:'northeast';
    if(!account.avatarSeed) account.avatarSeed=Math.floor(Math.random()*1e9);
    saveAccount(); screen='title'; render();
  };
  document.getElementById('cback').onclick=function(){ screen='title'; render(); };
}

function renderTree(){
  bar.classList.add('hide');
  var owned=new Set(account.owned);
  var attrs=T.deriveAttributes(owned);
  var arch=T.resolveArchetype(owned,attrs);
  var trunks=['comp','floor','long'];
  var cols=trunks.map(function(tk){
    var info=T.TRUNKS[tk];
    var root=T.BY_ID.get(tk+'.root');
    var rootCls=owned.has(root.id)?'own':(T.canBuy(owned,root.id)&&tokensLeft()>=root.cost?'can':'locked');
    var brs=T.BRANCHES.filter(function(b){ return b.trunk===tk; }).map(function(b){
      var nodes=[1,2,3,4,5,6].map(function(t){
        var id=tk+'.'+b.id+'.'+t, n=T.BY_ID.get(id);
        var cls=owned.has(id)?'own':(T.canBuy(owned,id)&&tokensLeft()>=n.cost?'can':'locked');
        return '<div class="node '+cls+'" data-node="'+id+'" title="'+esc(n.name+', '+n.cost+' tokens')+'">'+n.cost+'</div>';
      }).join('');
      return '<div class="branch"><div class="bn">'+esc(b.name)+'</div><div class="nodes">'+nodes+'</div></div>';
    }).join('');
    var capId=tk+'.capstone', cap=T.BY_ID.get(capId);
    var capCls=owned.has(capId)?'own':(T.canBuy(owned,capId)&&tokensLeft()>=cap.cost?'can':'locked');
    return '<div class="trunk"><h3>'+esc(info.name)+'</h3><div class="blurb">'+esc(info.blurb)+'</div>'
      +'<div class="branch"><div class="bn">Root</div><div class="nodes">'
      +'<div class="node '+rootCls+'" data-node="'+root.id+'">'+root.cost+'</div></div></div>'
      +brs
      +'<div class="branch"><div class="bn">Mastery</div><div class="nodes">'
      +'<div class="node '+capCls+'" data-node="'+capId+'">'+cap.cost+'</div></div></div></div>';
  }).join('');

  var attrRows=T.ALL_ATTRS.map(function(k){
    return '<tr><td>'+esc(k)+'</td><td class="r">'+attrs[k]+'</td></tr>';
  }).join('');

  app.innerHTML=''
   +'<div class="topbar"><span class="wk">Skill Tree</span>'
   +'<span class="ph">'+esc(arch.name)+'</span>'
   +'<span class="sp"><span class="meta">'+tokensLeft()+' tokens unspent</span></span></div>'
   +'<div class="file"><div class="sub">Every point you spend also makes you a bigger target. '
   +'The house scales to your level, and being good at things is how people get evicted here.</div>'
   +'<div class="tree">'+cols+'</div></div>'
   +'<div class="file"><h2>Attributes</h2><div class="scroll">'
   +'<table class="truth"><tbody>'+attrRows+'</tbody></table></div></div>'
   +'<div class="row"><button class="btn" id="respec">Reset tree</button>'
   +'<button class="btn go" id="tback">Done</button></div>';

  Array.prototype.forEach.call(app.querySelectorAll('.node.can'),function(el){
    el.onclick=function(){
      var id=el.dataset.node, n=T.BY_ID.get(id);
      if(tokensLeft()<n.cost) return;
      account.owned.push(id); saveAccount(); render();
    };
  });
  document.getElementById('respec').onclick=function(){ account.owned=[]; saveAccount(); render(); };
  document.getElementById('tback').onclick=function(){ screen='title'; render(); };
}

// ── starting a run ─────────────────────────────────────────────────────────
function startRun(seed){
  s=R.createRun({seed:seed||undefined,account:account});
  feedLines=[];
  sysline('Seed '+s.seed+'. Sixteen people. One of them is you.');
  clearRun(); screen='phase'; pump();
}

// ── moments ────────────────────────────────────────────────────────────────
/*
 * Playtest: "someone used the veto but the only way to know is the chat box all
 * the way at the bottom." Correct, and it applied to the nominations, the veto
 * draw and every power in the game. A beat that decides the week cannot be a
 * line of grey text that scrolls past while the player is looking somewhere
 * else. These stop the loop until acknowledged.
 */
var momentQ=[];
function moment(m){ momentQ.push(m); }

function showMoment(m){
  screen='phase';
  var faces=(m.faces||[]).map(function(f){
    var rd=f.id===s.human?null:readOf(f.id);
    var col=f.col||(rd?U.bandColor(rd.band.label):'#e7e2d7');
    return '<div class="mface"><div class="fr" style="border-color:'+col+'">'
      +avatar(s.cast[f.id],88)+'</div>'
      +'<div class="fn">'+esc(s.cast[f.id].first)+(f.id===s.human?' (you)':'')+'</div>'
      +'<div class="ft" style="color:'+col+'">'+esc(f.tag||'')+'</div></div>';
  }).join('');
  app.innerHTML=topbar()
    +'<div class="moment t-'+(m.tone||'')+'">'
    +'<div class="mh">'+U.icon(m.icon||'captain',18)+'<b>'+esc(m.kicker||'')+'</b></div>'
    +'<h2>'+esc(m.title)+'</h2>'
    +(m.sub?'<div class="msub">'+esc(m.sub)+'</div>':'')
    +(faces?'<div class="faces">'+faces+'</div>':'')
    +'</div>'+renderFeed();
  setBar('',[{label:m.cta||'Go on',cls:'go',go:function(){ pump(); }}]);
  scrollFeed();
}

// ── the pump: advance until the game needs the player ──────────────────────
function pump(){
  if(momentQ.length){ showMoment(momentQ.shift()); return; }
  var guard=400;
  while(guard-->0){
    if(s.phase===R.PHASES.OVER){ finishRun(); return; }
    var need=R.needsInput(s);
    if(need){ handleNeed(need); return; }
    var before=s.phase, wkBefore=s.week;
    narrateBefore(before);
    R.step(s,null);
    narrateAfter(before,wkBefore);
    if(s.phase===R.PHASES.EVICTION&&!R.needsInput(s)){ /* falls through to reveal */ }
    if(before===R.PHASES.EVICTION){ saveRun(); showVoteReveal(); return; }
  }
}

function narrateBefore(ph){
  if(ph===R.PHASES.RESET&&s.week>0) sysline('Week '+(s.week+1));
}
function narrateAfter(ph,wkBefore){
  if(ph===R.PHASES.RESET){
    say(tsay('reset'),'quiet');
    var aw=s.events.filter(function(e){ return e.kind==='power_awarded'&&e.week===s.week; });
    for(var ai=0;ai<aw.length;ai++){
      var d=PW.POWERS[aw[ai].kind];
      if(aw[ai].holder===s.human) say('You have been handed the '+d.name+'. '+d.long,'ev-power','power');
      else if(aw[ai].secrecy==='public') say(s.cast[aw[ai].holder].first+' has the '+d.name+'.','ev-power','power');
      else if(aw[ai].secrecy==='known') say('Somebody in this house has the '+d.name+'. Nobody is saying who.','ev-power','power');
      if(aw[ai].victim===s.human) say('Your vote has been taken off you this week. Nobody else knows.','ev-bad','broken');
    }
    var bb=s.events.filter(function(e){ return e.kind==='bounce_back'&&e.week===s.week; })[0];
    if(bb) say(s.cast[bb.who].name+' comes back through the door. Nobody expected to see them again.','hot');
  }
  if(ph===R.PHASES.CAPTAIN_COMP&&s.captainResult){
    var r=s.captainResult;
    say('Captain Comp: '+r.name+'.');
    say(s.captain===s.human?tsay('captainYou'):tsay('captainWon',{name:s.cast[s.captain].first}),'ev-vote','captain');
    if(s.rations.length) say(tsay('rations',{names:s.rations.map(function(i){return s.cast[i].first;}).join(', ')}),'quiet','rations');
    s.captainResult=null;
  }
  if(ph===R.PHASES.NAMING&&s.atRisk.length){
    moment({kicker:'Naming',icon:'risk',tone:'bad',
      title:(s.captain===s.human?'You name':s.cast[s.captain].first+' names')+' two At Risk',
      sub:'One of them is leaving unless the Veto changes it.',
      faces:s.atRisk.map(function(i){ return {id:i,tag:'At Risk',col:'#d4402c'}; })});
    say(s.captain===s.human
      ? tsay('namingYou',{a:s.cast[s.atRisk[0]].first,b:s.cast[s.atRisk[1]].first})
      : tsay('naming',{captain:s.cast[s.captain].first,a:s.cast[s.atRisk[0]].first,b:s.cast[s.atRisk[1]].first}),'ev-bad','risk');
    if(s.nomMode==='pawn') say(tsay(s.captain===s.human?'namingYouPawn':'namingPawn'),'quiet','risk');
  }
  if(ph===R.PHASES.VETO_DRAW&&s.vetoFieldIds&&s.vetoFieldIds.length){
    /* Playtest: "it also didn't show who was playing for veto". */
    moment({kicker:'The draw',icon:'veto',
      title:'Playing for the Veto',
      sub:'The Captain and both At Risk, plus whoever came out of the draw.',
      faces:s.vetoFieldIds.map(function(i){
        return {id:i,tag:i===s.captain?'Captain':(s.atRisk.indexOf(i)!==-1?'At Risk':'Drawn')}; })});
  }
  if(ph===R.PHASES.VETO_COMP&&s.vetoResult){
    say('Veto Comp: '+s.vetoResult.name+'. '+s.cast[s.vetoHolder].first+' takes it.','ev-good','veto');
    s.vetoResult=null;
  }
  if(ph===R.PHASES.VETO_CEREMONY&&s.phase!==R.PHASES.VETO_CEREMONY){
    if(s.vetoUsed){
      var mf=[{id:s.saved,tag:'Saved',col:'#7f9a86'}];
      if(s.replacement!=null) mf.push({id:s.replacement,tag:'Goes up',col:'#d4402c'});
      moment({kicker:'The ceremony',icon:'veto',tone:'good',
        title:(s.saved===s.vetoHolder
          ? s.cast[s.vetoHolder].first+' takes themselves off the block'
          : s.cast[s.vetoHolder].first+' saves '+s.cast[s.saved].first),
        sub:s.replacement!=null?(s.cast[s.captain].first+' has to name somebody else.'):'',
        faces:mf});
    } else {
      moment({kicker:'The ceremony',icon:'veto',
        title:s.cast[s.vetoHolder].first+' holds the Veto',
        sub:'The names stand.',
        faces:s.atRisk.map(function(i){ return {id:i,tag:'At Risk',col:'#d4402c'}; })});
    }
    if(s.vetoUsed){
      say(s.saved===s.vetoHolder
        ? tsay('vetoSelf',{holder:s.cast[s.vetoHolder].first})
        : tsay('vetoUsed',{holder:s.cast[s.vetoHolder].first,saved:s.cast[s.saved].first}),'ev-good','veto');
      if(s.replacement!=null) say(s.cast[s.captain].first+' names '+s.cast[s.replacement].first+' in their place.');
      if(s.backdoorLanded) say(tsay('backdoorLanded',{name:s.cast[s.replacement].first}),'hot','risk');
    } else {
      say(tsay('vetoHeld',{holder:s.cast[s.vetoHolder].first}),'','veto');
      /* A plan that needed the Veto used and did not get it. Only the Captain
         knows it was ever a plan, so only the Captain is told it died. */
      if(s.backdoor!=null&&s.captain===s.human) say(tsay('backdoorFailed'),'quiet','risk');
    }
  }
  var pl=s.events.filter(function(e){ return e.kind==='power_played'&&e.week===s.week&&!e.said; });
  for(var pi=0;pi<pl.length;pi++){
    pl[pi].said=true;
    var pd=PW.POWERS[pl[pi].kind], who=s.cast[pl[pi].holder];
    var pf=[{id:pl[pi].holder,tag:'Played it',col:'#bfae8e'}];
    if(pl[pi].kind==='diamond'){ pf.push({id:pl[pi].save,tag:'Saved',col:'#7f9a86'});
      pf.push({id:pl[pi].replace,tag:'Goes up',col:'#d4402c'}); }
    if(pl[pi].kind==='veto_pick') pf.push({id:pl[pi].pick,tag:'Chosen'});
    moment({kicker:'A power',icon:'power',tone:'power',title:pd.name,sub:pd.long,faces:pf});
    if(pl[pi].kind==='safety') say((pl[pi].holder===s.human?'You are':who.first+' is')+' safe this week. The '+pd.name+' is spent.','ev-power','power');
    else if(pl[pi].kind==='diamond') say(who.first+' plays the Diamond Veto. '+s.cast[pl[pi].save].first
      +' comes off, '+s.cast[pl[pi].replace].first+' goes up, and the Captain had no say in it.','ev-power','power');
    else if(pl[pi].kind==='veto_pick') say(who.first+' picks '+s.cast[pl[pi].pick].first+' into the Veto Comp.','ev-power','power');
    else if(pl[pi].kind==='back_to_back') say(who.first+' should not have been in that comp.','ev-power','power');
    else if(pl[pi].kind==='extra_vote') say('The count came back one higher than it should have.','ev-power','power');
  }

  if(ph===R.PHASES.FALLOUT){
    var w=s.weeks[s.weeks.length-1];
    if(w&&w.blame&&w.blame.length){
      var mine=w.blame.filter(function(b){ return b.blamed===s.human; });
      if(mine.length) say('Somebody thinks you flipped.','ev-bad','broken');
    }
  }
}

// ── input handlers ─────────────────────────────────────────────────────────
function handleNeed(need){
  saveRun();
  if(need.kind==='move_in') return showMoveIn(need);
  if(need.kind==='comp') return showComp(need);
  if(need.kind==='actions') return showScheming(need);
  if(need.kind==='power_safety') return showPowerSafety(need);
  if(need.kind==='power_veto_pick') return showPowerVetoPick(need);
  if(need.kind==='power_diamond') return showPowerDiamond(need);
  if(need.kind==='power_extra_vote') return showPowerExtraVote(need);
  if(need.kind==='naming') return showNaming();
  if(need.kind==='veto_use') return showVetoUse();
  if(need.kind==='replacement') return showReplacement();
  if(need.kind==='vote') return showVote();
  if(need.kind==='final3_pick') return showFinal3Pick();
  if(need.kind==='framing') return showFraming();
  R.step(s,null); pump();
}

function showMoveIn(need){
  screen='phase';
  var TAG={safe:'Safe',neutral:'Even',risky:'Risky'};
  app.innerHTML='<div class="topbar"><span class="wk">Move In Night</span>'
   +'<span class="ph">'+(need.step+1)+' of '+need.of+'</span></div>'
   +'<div class="scene"><div class="where"><b>Fifteen strangers and a lot of cameras.</b></div>'
   +'<div class="said">'+esc(need.beat.line)+'</div>'
   +'<div class="opts">'+need.beat.options.map(function(o){
      return '<button class="opt '+o.kind+'" data-mi="'+o.key+'">'
        +'<span class="key">'+o.key.toUpperCase()+'</span>'
        +'<span class="txt">'+esc(o.text)+'</span>'
        +'<span class="tag">'+TAG[o.kind]+'</span></button>'; }).join('')
   +'</div></div>'+renderFeed();
  Array.prototype.forEach.call(app.querySelectorAll('[data-mi]'),function(el){
    el.onclick=function(){
      var o=need.beat.options.filter(function(x){ return x.key===el.dataset.mi; })[0];
      say(o.text,'quiet');
      R.step(s,{key:el.dataset.mi}); pump();
    };
  });
  setBar('A, B or C',[]);
  scrollFeed();
}

function showNaming(){
  screen='phase';
  var picked=[],stage='noms',want=null;
  function paint(){
    if(stage==='noms'){
      app.innerHTML=topbar()
        +'<div class="file"><h2>Name two At Risk</h2>'
        +'<div class="sub">You hold the power. Both of them will remember it, and one of them is staying.</div></div>'
        +wall({pick:true,selected:picked})+renderFeed();
      bindSorts(paint);
      bindPicks(function(id){
        if(id===s.human) return;
        var i=picked.indexOf(id);
        if(i>=0) picked.splice(i,1); else if(picked.length<2) picked.push(id);
        paint();
      });
      setBar(picked.length<2?'Choose two':'Locked in',[
        {label:'Name them',cls:'hot go',off:picked.length<2,go:function(){
          stage='intent'; want=picked[0]; paint(); }}
      ]);
      scrollFeed(); return;
    }
    /* Who you are ACTUALLY after. Naming somebody who is not on the block is
       the backdoor, and there is no separate button for it on purpose: the plan
       only exists because the Veto has not happened yet. */
    var back=picked.indexOf(want)===-1;
    app.innerHTML=topbar()
      +'<div class="file"><h2>Who do you actually want gone</h2>'
      +'<div class="sub">The house reads the room, not the speech. Whoever you are after '
      +'is who the votes will drift toward. Pick somebody who is not on the block '
      +'and you are backdooring them: you need the Veto used to open the seat.</div></div>'
      +'<div class="tagrow">'
      +'<span class="tg">On the block: '+picked.map(function(i){ return esc(s.cast[i].first); }).join(' and ')+'</span>'
      +(back
        ? '<span class="tg bad">Backdoor</span><span class="tg">Needs the Veto used</span>'
        : (picked.filter(function(i){return i!==want;}).length
          ? '<span class="tg good">'
            +esc(s.cast[picked.filter(function(i){return i!==want;})[0]].first)+' is the pawn</span>'
          : '<span class="tg">Straight shot</span>'))+'</div>'
      +wall({pick:true,selected:[want],block:picked})+renderFeed();
    bindSorts(paint);
    bindPicks(function(id){ if(id!==s.human&&id!==s.captain){ want=id; paint(); } });
    setBar('Your target',[
      {label:'Back',go:function(){ stage='noms'; paint(); }},
      {label:back?'Set the trap':'Lock it in',cls:'hot go',go:function(){
        R.step(s,{noms:picked,target:want}); pump(); }}
    ]);
    scrollFeed();
  }
  paint();
}

function showVetoUse(){
  screen='phase';
  app.innerHTML=topbar()
    +'<div class="file"><h2>You hold the Veto</h2>'
    +'<div class="sub">Use it and the Captain has to name somebody else. '
    +'They will know exactly who cost them their week.</div></div>'
    +wall({only:s.atRisk.concat([s.human]),all:true})+renderFeed();
  var btns=s.atRisk.map(function(id){
    return {label:'Save '+s.cast[id].first,cls:'go',go:function(){ R.step(s,{save:id}); pump(); }};
  });
  btns.push({label:'Hold it',go:function(){ R.step(s,{save:null}); pump(); }});
  setBar('The Veto',btns);
  scrollFeed();
}

function showReplacement(){
  screen='phase';
  var pool=s.replacementPool;
  app.innerHTML=topbar()
    +'<div class="file"><h2>Name a replacement</h2>'
    +'<div class="sub">The Veto took one of yours off. Somebody has to go up.</div></div>'
    +wall({pick:true,only:pool,all:true})+renderFeed();
  bindPicks(function(id){ if(pool.indexOf(id)!==-1){ R.step(s,{replacement:id}); pump(); } });
  setBar('Choose one',[]);
  scrollFeed();
}

function showVote(){
  screen='phase';
  app.innerHTML=topbar()
    +'<div class="file"><h2>Cast your vote</h2>'
    +'<div class="sub">Votes are anonymous. The tally gets read out, the names never do.</div></div>'
    +wall({only:s.atRisk,all:true})+renderFeed();
  setBar('Evict',s.atRisk.map(function(id){
    return {label:'Evict '+s.cast[id].first,cls:'hot',go:function(){
      R.step(s,{vote:id}); saveRun(); showVoteReveal(); }};
  }));
  scrollFeed();
}

function showFinal3Pick(){
  screen='phase';
  var pool=R.activeIds(s).filter(function(i){ return i!==s.human; });
  app.innerHTML=topbar()
    +'<div class="file"><h2>You won the last one</h2>'
    +'<div class="sub">Pick who sits beside you. The other one joins the Panel, '
    +'and gets a vote on which of you deserves it.</div></div>'
    +wall({pick:true,only:pool,all:true})+renderFeed();
  bindPicks(function(id){ R.step(s,{keep:id}); pump(); });
  setBar('Choose one',[]);
}

function showFraming(){
  screen='phase';
  app.innerHTML=topbar()
    +'<div class="file"><h2>The Panel is seated</h2>'
    +'<div class="sub">'+esc(tsay('panelOpen'))+'</div>'
    +'<div class="grid2">'
    +'<button class="choice" data-fr="own"><b>Own it</b><span>Every move was yours and you would make them again. '
    +'The strategists respect it. The ones you cut will not.</span></button>'
    +'<button class="choice" data-fr="humble"><b>Play it down</b><span>You did what the house made you do. '
    +'Softer landing with the people you hurt, thinner with the ones who wanted a game.</span></button>'
    +'</div></div>'+renderFeed();
  Array.prototype.forEach.call(app.querySelectorAll('[data-fr]'),function(el){
    el.onclick=function(){ R.step(s,{framing:el.dataset.fr}); pump(); };
  });
  setBar('',[]);
}

function bindPicks(fn){
  Array.prototype.forEach.call(app.querySelectorAll('[data-pick]'),function(el){
    el.onclick=function(){ fn(Number(el.dataset.pick)); };
  });
}

// ── scheming ───────────────────────────────────────────────────────────────
/* Scheming is now a place and a conversation rather than a verb list. You pick
   who to spend energy on, the house draws where you are and what it is about,
   and the answer is A, B or C. scenes.js owns the banks; this owns the screen. */
var housePanel=false;
function showScheming(need){
  screen='phase';
  var moment=null, gathering=null;

  function paintPick(){
    var side=[
      {label:'Bring people together',off:s.energy<SC.ENERGY.GATHER_MIN*SC.ENERGY.GATHER_PER_HEAD,
        go:function(){ gathering=[]; paintGather(); }},
      {label:'Eavesdrop',off:s.energy<SC.ENERGY.EAVESDROP_COST,go:function(){
        var o=R.performAction(s,{kind:'eavesdrop'}); s.energy-=SC.ENERGY.EAVESDROP_COST;
        narrateAction(o); saveRun(); paintPick(); }},
      {label:'Move on',cls:'go',go:function(){ R.step(s,{done:true}); pump(); }}
    ];
    app.innerHTML=topbar()
      +'<div class="file"><h2>Who are you spending it on'+powerBadge()+'</h2>'
      +'<div class="sub">Energy runs all week, not per phase. Hold some back for after '
      +'the Veto ceremony or spend it now while nobody has been named. '
      +'Everybody you skip drifts back toward how they felt about you on day one.</div></div>'
      +'<details class="wk" id="hp"'+(housePanel?' open':'')+'><summary>'
      +'<span class="no">Read</span><span class="hl">The house, as far as you know it</span>'
      +'<span class="tags"><span class="pip">key and map</span></span></summary>'
      +'<div class="body" style="padding-left:18px">'+U.legend()
      +U.allianceMap(s,E)+'</div></details>'
      +wall({pick:true})+renderFeed();
    var hp=document.getElementById('hp');
    if(hp) hp.ontoggle=function(){ housePanel=hp.open; };
    bindSorts(paintPick);
    bindPicks(function(id){
      if(id===s.human) return;
      if(s.energy<SC.ENERGY.SCENE_COST) return;
      moment=R.sceneFor(s,id); paintScene();
    });
    setBar('Pick somebody',side);
    scrollFeed();
  }

  /* Pull two to four people into one room and try to put a name on it. The
     odds are shown as a read rather than a percentage: §17 keeps numbers off
     relationships, and "these two cannot stand each other" is the useful
     version of that information anyway. */
  function paintGather(){
    var cost=gathering.length*SC.ENERGY.GATHER_PER_HEAD;
    var ok=gathering.length>=SC.ENERGY.GATHER_MIN&&s.energy>=cost;
    var read='';
    if(gathering.length>=SC.ENERGY.GATHER_MIN){
      var c=SC.gatherChance(s,gathering);
      read=c>0.62?'This room would hold.'
        :c>0.42?'It could go either way.'
        :c>0.22?'This is a stretch. Somebody in here is not there yet.'
        :'These people are nowhere near ready. Somebody in this room cannot stand somebody else in it.';
    }
    app.innerHTML=topbar()
      +'<div class="file"><h2>Get them in one room</h2>'
      +'<div class="sub">Name the people you think are already with you. '
      +'One energy a head, and every pair in the room has to hold, not just how each of them feels about you. '
      +'If it does not land you have shown them all exactly who you were counting on.</div>'
      +(read?'<div class="gread'+(SC.gatherChance(s,gathering)>0.42?' good':'')+'">'+esc(read)+'</div>':'')
      +'</div>'
      +wall({pick:true,selected:gathering,nosort:true})+renderFeed();
    bindPicks(function(id){
      if(id===s.human) return;
      var i=gathering.indexOf(id);
      if(i>=0) gathering.splice(i,1);
      else if(gathering.length<SC.ENERGY.GATHER_MAX) gathering.push(id);
      paintGather();
    });
    setBar(gathering.length?(cost+' energy'):'Pick two to four',[
      {label:'Back',go:function(){ gathering=null; paintPick(); }},
      {label:'Bring them in',cls:'go',off:!ok,go:function(){
        var out=R.gatherPeople(s,gathering);
        if(out){
          if(out.landed){
            say('You get them in one room and it holds.','ev-good','alliance');
            moment({kicker:'An alliance',icon:'alliance',tone:'good',
              title:'You have something now',
              sub:'It lasts as long as all of you want it to, which is never as long as you think.',
              faces:out.members.map(function(i){ return {id:i,tag:i===s.human?'You':'In'}; })});
          } else {
            say('It does not come together, and now they all know who you counted on.','ev-bad','broken');
          }
        }
        gathering=null; saveRun();
        if(s.energy<SC.ENERGY.SCENE_COST){ R.step(s,{done:true}); pump(); return; }
        pump();
      }}
    ]);
    scrollFeed();
  }

  function paintScene(){
    var TAG={safe:'Safe',neutral:'Even',risky:'Risky'};
    app.innerHTML=topbar()
      +'<div class="scene">'
      +'<div class="where"><b>'+esc(moment.scene)+'</b></div>'
      +'<div class="said">'+esc(moment.line)+'</div>'
      +'<div class="opts">'+moment.options.map(function(o){
        var off=s.energy<o.cost;
        return '<button class="opt '+o.kind+'" data-opt="'+o.key+'"'+(off?' disabled':'')+'>'
          +'<span class="key">'+o.key.toUpperCase()+'</span>'
          +'<span class="txt">'+esc(o.text)+'</span>'
          +'<span class="tag">'+TAG[o.kind]+'</span></button>';
      }).join('')+'</div></div>'
      +renderFeed();
    Array.prototype.forEach.call(app.querySelectorAll('[data-opt]'),function(el){
      el.onclick=function(){
        var out=R.playScene(s,moment,el.dataset.opt);
        if(!out) return;
        narrateScene(moment,out);
        moment=null; saveRun();
        if(s.energy<SC.ENERGY.SCENE_COST){ R.step(s,{done:true}); pump(); return; }
        paintPick();
      };
    });
    setBar('A, B or C',[{label:'Walk away',go:function(){ moment=null; paintPick(); }}]);
    scrollFeed();
  }

  paintPick();
}

function narrateScene(moment,out){
  var nm=s.cast[out.target].first;
  say(moment.scene.charAt(0).toUpperCase()+moment.scene.slice(1)+'.','quiet');
  if(out.kind==='safe') say('It goes the way those go.');
  else if(out.kind==='neutral') say(out.landed?'It lands.':'It does not quite land.',out.landed?'':'quiet');
  else say(out.landed?'It lands, and it moves something.':'It does not land, and '+nm+' will remember you tried.',
    out.landed?'':'hot');

  for(var i=0;i<out.fx.length;i++){
    var f=out.fx[i];
    if(f.k==='ally') say('You and '+nm+' have something now.','ev-good','alliance');
    else if(f.k==='ally_declined') say(nm+' is not ready to put a name on it.','quiet');
    else if(f.k==='intent') say(nm+' says they are voting out '+s.cast[f.target].first+'.');
    else if(f.k==='info') say(nm+' on '+s.cast[f.b].first+': '+f.band.toLowerCase()+'.','quiet');
    else if(f.k==='alliance_seen') say('They are working with '+f.members.map(function(x){return s.cast[x].first;}).join(' and ')+'.','quiet');
    else if(f.k==='heat') say(nm+' walks away thinking about '+s.cast[f.who].first+'.','quiet');
    else if(f.k==='watched') say(nm+' is watching you now.','ev-bad','eye');
    else if(f.k==='backfire') say('You spent something you are not getting back.','hot');
  }
  if(out.read) say(nm+' reads '+out.read.band.label.toLowerCase()+' on you.','quiet');
}

/* Eavesdrop and the Confessional survive the move to scenes: one is not a
   conversation and the other is not with anybody. */
function narrateAction(o){
  var nm=o.target!=null?s.cast[o.target].first:'';
  if(o.kind==='eavesdrop'){
    say(tsay('eavesOk'));
    say(s.cast[o.pair[0]].first+' on '+s.cast[o.pair[1]].first+': '+o.value.toLowerCase()+'.','quiet');
    if(o.alliance) say('They are working together. '+o.alliance.map(function(i){return s.cast[i].first;}).join(', ')+'.','quiet');
    if(o.caught) say(tsay('eavesCaught',{name:s.cast[o.pair[0]].first}),'hot');
  }
  if(o.kind==='confessional'&&o.read) say('You write it down. '+nm+': '+o.read.band.label.toLowerCase()+'.','quiet');
}
