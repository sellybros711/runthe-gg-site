<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;font-family:'Barlow Semi Condensed','Arial Narrow',Helvetica,Arial,sans-serif;color:#F6EAD0}
  .scene{position:absolute;inset:0}
  .dim{position:absolute;inset:0;background:linear-gradient(90deg, rgba(3,24,13,.95) 0%, rgba(3,24,13,.85) 32%, rgba(3,24,13,.58) 62%, rgba(3,24,13,.52) 100%)}
  .goldtop{position:absolute;top:0;left:0;right:0;height:10px;background:linear-gradient(90deg,#b9821a,#F5C24B 45%,#EBA61F 55%,#b9821a);z-index:5}
  .frame{position:absolute;inset:0;box-shadow:inset 0 0 0 4px rgba(235,166,31,.55), inset 0 0 90px rgba(0,0,0,.4);z-index:5}

  .wrap{position:absolute;inset:0;padding:34px 56px 34px;display:flex;flex-direction:column;z-index:4}
  .head{display:flex;align-items:center;gap:15px}
  .crest{width:50px;height:58px;flex:0 0 auto}
  .word{font-family:'Cinzel',Georgia,'Times New Roman',serif;font-weight:800;letter-spacing:.05em;font-size:50px;line-height:1;display:flex;gap:15px}
  .word .a{color:#F6EAD0}.word .b{color:#EBA61F}

  .body{flex:1;display:flex;align-items:center;gap:22px;margin-top:8px}
  .left{width:366px;flex:0 0 auto}
  .h1{font-family:'Anton','Arial Narrow',Impact,sans-serif;font-weight:800;line-height:.92;text-transform:uppercase;text-shadow:0 3px 16px rgba(0,0,0,.6)}
  .h1 .l1{font-size:74px;color:#F6EAD0}
  .h1 .l2{font-size:74px;color:#EBA61F}

  .viz{flex:1;display:flex;align-items:center;justify-content:center;gap:14px}
  .draftcol{display:flex;flex-direction:column;gap:14px}
  .scard{width:344px;height:86px;border-radius:16px;border:3px solid #EBA61F;overflow:hidden;
    background:linear-gradient(150deg,rgba(11,46,26,.98),rgba(3,18,11,.98));display:flex;align-items:center;gap:12px;padding:0 11px;
    box-shadow:0 10px 26px rgba(0,0,0,.55)}
  .scard .ic{width:50px;height:50px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 35%, rgba(235,166,31,.24), rgba(235,166,31,.05));border:1.5px solid rgba(235,166,31,.55)}
  .scard .ic svg{width:32px;height:32px;stroke:#F5C24B;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .scard .sk{flex:1;min-width:0;font-family:'Anton','Arial Narrow',Impact;font-size:29px;line-height:1;color:#F6EAD0;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:clip}
  .scard .rt{font-family:'Anton','Arial Narrow',Impact;font-size:38px;line-height:1;color:#03180c;font-weight:800;flex:0 0 auto;
    background:linear-gradient(180deg,#F5C24B,#e5a11c);width:60px;height:60px;border-radius:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.35)}

  .arrow{font-family:'Anton',Impact;font-size:64px;color:#EBA61F;line-height:1;font-weight:800;text-shadow:0 3px 12px rgba(0,0,0,.6)}

  .built{display:flex;flex-direction:column;align-items:center;gap:4px}
  .trophy{width:60px;height:66px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
  .radarbox{position:relative;width:250px;height:250px;filter:drop-shadow(0 8px 22px rgba(0,0,0,.6))}
  .ovr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}
  .ovr .n{font-family:'Anton',Impact;font-size:78px;line-height:.82;color:#EBA61F;font-weight:800}
  .ovr .t{font-size:18px;font-weight:800;letter-spacing:.22em;color:#F6EAD0}
  .built .cap{font-family:'Anton',Impact;font-size:28px;letter-spacing:.07em;color:#F6EAD0;font-weight:800;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .built .cap b{color:#EBA61F}

  .foot{display:flex;align-items:center;justify-content:center;margin-top:4px}
  .url{font-weight:800;font-size:34px;color:#F6EAD0;text-shadow:0 2px 10px rgba(0,0,0,.6);letter-spacing:.01em}
  .url b{color:#EBA61F}.url .free{color:#8fe9c8;font-size:34px;margin-left:14px}
</style></head><body>
  <svg class="scene" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d9a8"/><stop offset="42%" stop-color="#eebf86"/><stop offset="72%" stop-color="#8fbf7e"/><stop offset="100%" stop-color="#3f8a4f"/></linearGradient>
      <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff4d6"/><stop offset="55%" stop-color="#ffe6a8" stop-opacity=".9"/><stop offset="100%" stop-color="#ffe6a8" stop-opacity="0"/></radialGradient>
      <linearGradient id="fw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fae5b"/><stop offset="100%" stop-color="#2f8340"/></linearGradient>
      <linearGradient id="grn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fc06a"/><stop offset="100%" stop-color="#3a9a4c"/></linearGradient>
    </defs>
    <rect width="1200" height="360" fill="url(#sky)"/>
    <circle cx="980" cy="140" r="150" fill="url(#sun)"/>
    <circle cx="980" cy="140" r="44" fill="#fff2cf"/>
    <path d="M0 300 Q220 250 460 288 Q720 330 980 278 Q1120 252 1200 288 L1200 360 L0 360 Z" fill="#2f6b3f" opacity=".85"/>
    <path d="M0 330 Q300 300 620 322 Q900 340 1200 312 L1200 372 L0 372 Z" fill="#255a34"/>
    <path d="M0 372 L1200 348 L1200 630 L0 630 Z" fill="url(#fw)"/>
    <ellipse cx="1055" cy="392" rx="116" ry="36" fill="url(#grn)"/>
    <ellipse cx="1065" cy="396" rx="8" ry="3.4" fill="#0c2c1a"/>
    <path d="M1065 396 V330" stroke="#f4ecd9" stroke-width="3" stroke-linecap="round"/>
    <path d="M1065 330 q24 5 40 -3 q-13 11 0 20 q-20 -6 -40 0 z" fill="#EBA61F"/>
  </svg>
  <div class="dim"></div>
  <div class="goldtop"></div><div class="frame"></div>

  <div class="wrap">
    <div class="head">
      <svg class="crest" viewBox="0 0 52 60"><path d="M4 6 L48 6 L48 34 Q48 52 26 58 Q4 52 4 34 Z" fill="#0a3b1e" stroke="#EBA61F" stroke-width="2.5"/><path d="M20 44 V20" stroke="#EBA61F" stroke-width="2.4"/><path d="M20 20 Q30 17 38 22 Q30 28 20 26 Z" fill="#EBA61F"/><ellipse cx="26" cy="45" rx="10" ry="3.2" fill="#2c8a49"/></svg>
      <div class="word"><span class="a">RUN THE</span><span class="b">TOUR</span></div>
    </div>

    <div class="body">
      <div class="left">
        <div class="h1"><div class="l1">Draft the pros.</div><div class="l2">Become the G.O.A.T.</div></div>
      </div>

      <div class="viz">
        <div class="draftcol">
          <div class="scard"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 20 L15 9"/><path d="M14 6 c4 -2 6 1 4 4 c-2 2 -5 2 -7 1 z" fill="#F5C24B" stroke="none"/><circle cx="4" cy="20" r="1.6" fill="#F5C24B" stroke="none"/></svg></div><div class="sk">Driving</div><div class="rt">98</div></div>
          <div class="scard"><div class="ic"><svg viewBox="0 0 24 24"><path d="M7 21 V4"/><path d="M7 4 q7 2 11 -1 q-4 4 0 7 q-6 -2 -11 0 Z" fill="#F5C24B" stroke="none"/><ellipse cx="9" cy="21" rx="5" ry="1.6"/></svg></div><div class="sk">Approach</div><div class="rt">97</div></div>
          <div class="scard"><div class="ic"><svg viewBox="0 0 24 24"><path d="M6 4 V15"/><rect x="3" y="15" width="12" height="3" rx="1.4" fill="#F5C24B" stroke="none"/><circle cx="19" cy="18" r="3"/></svg></div><div class="sk">Putting</div><div class="rt">99</div></div>
        </div>
        <div class="arrow">&rarr;</div>
        <div class="built">
          <svg class="trophy" viewBox="0 0 70 78"><path d="M20 8 H50 V26 Q50 40 35 44 Q20 40 20 26 Z" fill="url(#tg)" stroke="#b9821a" stroke-width="1.5"/><path d="M20 12 H10 Q8 26 22 30" fill="none" stroke="#EBA61F" stroke-width="3"/><path d="M50 12 H60 Q62 26 48 30" fill="none" stroke="#EBA61F" stroke-width="3"/><rect x="31" y="44" width="8" height="12" fill="#c9922a"/><rect x="22" y="56" width="26" height="7" rx="2" fill="#EBA61F"/><rect x="18" y="63" width="34" height="8" rx="2" fill="#c9922a"/><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5C24B"/><stop offset="1" stop-color="#d69a1e"/></linearGradient></defs></svg>
          <div class="radarbox">
            <svg viewBox="0 0 250 250" width="250" height="250">
              <g stroke="rgba(246,234,208,.22)" fill="none" stroke-width="1.1">
                <polygon points="125,24 197,57 223,125 197,193 125,226 53,193 27,125 53,57"/>
                <polygon points="125,58 178,77 197,125 178,173 125,192 72,173 53,125 72,77"/></g>
              <g stroke="rgba(246,234,208,.12)"><line x1="125" y1="125" x2="125" y2="24"/><line x1="125" y1="125" x2="223" y2="125"/><line x1="125" y1="125" x2="125" y2="226"/><line x1="125" y1="125" x2="27" y2="125"/><line x1="125" y1="125" x2="197" y2="57"/><line x1="125" y1="125" x2="197" y2="193"/><line x1="125" y1="125" x2="53" y2="193"/><line x1="125" y1="125" x2="53" y2="57"/></g>
              <polygon points="125,30 191,62 214,125 181,180 125,214 68,180 38,125 64,62" fill="rgba(18,179,154,.36)" stroke="#12b39a" stroke-width="4"/>
              <circle cx="125" cy="125" r="52" fill="rgba(3,16,10,.92)" stroke="#EBA61F" stroke-width="2.4"/></svg>
            <div class="ovr"><div class="n">99</div><div class="t">OVR</div></div>
          </div>
          <div class="cap">Your <b>Legend</b></div>
        </div>
      </div>
    </div>

    <div class="foot">
      <div class="url">Play free at runthe.gg/<b>golf</b></div>
    </div>
  </div>
</body></html>
