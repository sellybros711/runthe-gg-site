<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;font-family:'Barlow Semi Condensed','Arial Narrow',Helvetica,Arial,sans-serif;color:#F6EAD0}
  .scene{position:absolute;inset:0}
  .dim{position:absolute;inset:0;background:linear-gradient(90deg, rgba(3,24,13,.94) 0%, rgba(3,24,13,.82) 30%, rgba(3,24,13,.55) 60%, rgba(3,24,13,.5) 100%)}
  .goldtop{position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,#b9821a,#F5C24B 45%,#EBA61F 55%,#b9821a);z-index:5}
  .frame{position:absolute;inset:0;box-shadow:inset 0 0 0 3px rgba(235,166,31,.5), inset 0 0 90px rgba(0,0,0,.4);z-index:5}

  .wrap{position:absolute;inset:0;padding:30px 54px 28px;display:flex;flex-direction:column;z-index:4}
  .head{display:flex;align-items:center;gap:13px}
  .crest{width:42px;height:50px;flex:0 0 auto}
  .word{font-family:'Cinzel',Georgia,'Times New Roman',serif;font-weight:800;letter-spacing:.05em;font-size:42px;line-height:1;display:flex;gap:13px}
  .word .a{color:#F6EAD0}.word .b{color:#EBA61F}

  .body{flex:1;display:flex;align-items:center;gap:28px;margin-top:6px}
  .left{width:388px;flex:0 0 auto}
  .h1{font-family:'Anton','Arial Narrow',Impact,sans-serif;font-weight:800;line-height:.94;text-transform:uppercase;text-shadow:0 3px 14px rgba(0,0,0,.55)}
  .h1 .l1{font-size:64px;color:#F6EAD0}
  .h1 .l2{font-size:64px;color:#EBA61F}
  .tagline{font-size:23px;line-height:1.3;color:#eaf3ec;margin-top:16px;font-weight:600;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .tagline b{color:#F6EAD0;font-weight:800}

  .viz{flex:1;display:flex;align-items:center;justify-content:center;gap:16px}
  .draftcol{display:flex;flex-direction:column;gap:12px}
  .dlabel{font-weight:800;letter-spacing:.1em;font-size:14px;color:#8fe9c8;text-transform:uppercase;text-align:center;margin-bottom:2px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .scard{width:306px;height:76px;border-radius:15px;border:2.5px solid #EBA61F;position:relative;overflow:hidden;
    background:linear-gradient(150deg,rgba(11,46,26,.98),rgba(3,18,11,.98));display:flex;align-items:center;gap:11px;padding:0 12px 0 12px;
    box-shadow:0 10px 26px rgba(0,0,0,.5)}
  .scard .ic{width:44px;height:44px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 35%, rgba(235,166,31,.22), rgba(235,166,31,.05));border:1.5px solid rgba(235,166,31,.5)}
  .scard .ic svg{width:28px;height:28px;stroke:#F5C24B;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .scard .who{flex:1;min-width:0;overflow:hidden}
  .scard .sk{font-family:'Anton','Arial Narrow',Impact;font-size:22px;line-height:.98;color:#F6EAD0;font-weight:800;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
  .scard .tag{font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8fe9c8;margin-top:3px}
  .scard .rt{font-family:'Anton','Arial Narrow',Impact;font-size:31px;line-height:1;color:#03180c;font-weight:800;flex:0 0 auto;
    background:linear-gradient(180deg,#F5C24B,#e5a11c);width:50px;height:50px;border-radius:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.35)}

  .arrow{display:flex;flex-direction:column;align-items:center;gap:3px}
  .arrow .a{font-family:'Anton',Impact;font-size:64px;color:#EBA61F;line-height:1;font-weight:800;text-shadow:0 3px 10px rgba(0,0,0,.6)}
  .arrow .lab{font-weight:800;font-size:10px;letter-spacing:.16em;color:#8fe9c8;text-transform:uppercase}

  .built{display:flex;flex-direction:column;align-items:center;gap:5px}
  .trophy{width:54px;height:60px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
  .radarbox{position:relative;width:212px;height:212px;filter:drop-shadow(0 8px 22px rgba(0,0,0,.6))}
  .ovr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}
  .ovr .n{font-family:'Anton',Impact;font-size:62px;line-height:.85;color:#EBA61F;font-weight:800}
  .ovr .t{font-size:14px;font-weight:800;letter-spacing:.22em;color:#F6EAD0}
  .built .cap{font-family:'Anton',Impact;font-size:23px;letter-spacing:.08em;color:#F6EAD0;font-weight:800;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .built .cap b{color:#EBA61F}

  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
  .pills{display:flex;gap:9px}
  .pill{border:1.5px solid rgba(235,166,31,.6);color:#F5C24B;font-weight:800;letter-spacing:.11em;font-size:15px;text-transform:uppercase;padding:7px 14px;border-radius:999px;background:rgba(6,28,16,.6)}
  .url{font-weight:800;font-size:24px;color:#F6EAD0;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .url b{color:#EBA61F}.url .free{color:#8fe9c8;font-size:18px;letter-spacing:.08em;margin-left:9px;text-transform:uppercase}
</style></head><body>
  <svg class="scene" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
    <defs>

  <div class="dim"></div>

  <div class="wrap">

      <div class="word"><span class="a">RUN THE</span><span class="b">TOUR</span></div>
    </div>

    <div class="body">
      <div class="left">
        <div class="h1"><div class="l1">Draft the pros.</div><div class="l2">Become the G.O.A.T.</div></div>
        <div class="tagline">Draft an elite skill from each pro into <b>one golfer</b>, then chase a <b>30-year legacy</b>.</div>
      </div>

      <div class="viz">
        <div class="draftcol">

          <div class="scard"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 20 L15 9"/><path d="M14 6 c4 -2 6 1 4 4 c-2 2 -5 2 -7 1 z" fill="#F5C24B" stroke="none"/><circle cx="4" cy="20" r="1.6" fill="#F5C24B" stroke="none"/></svg></div><div class="who"><div class="sk">Driving</div><div class="tag">Pro pick</div></div><div class="rt">98</div></div>

          <div class="scard"><div class="ic"><svg viewBox="0 0 24 24"><path d="M6 4 V15"/><rect x="3" y="15" width="12" height="3" rx="1.4" fill="#F5C24B" stroke="none"/><circle cx="19" cy="18" r="3"/></svg></div><div class="who"><div class="sk">Putting</div><div class="tag">Pro pick</div></div><div class="rt">99</div></div>

          <div class="radarbox">

              <g stroke="rgba(246,234,208,.22)" fill="none" stroke-width="1">

              <polygon points="106,26 162,53 182,106 154,153 106,182 58,153 33,106 55,53" fill="rgba(18,179,154,.34)" stroke="#12b39a" stroke-width="3.4"/>
              <circle cx="106" cy="106" r="43" fill="rgba(3,16,10,.9)" stroke="#EBA61F" stroke-width="2"/></svg>
            <div class="ovr"><div class="n">99</div><div class="t">OVR</div></div>
          </div>
          <div class="cap">Your <b>Legend</b></div>
        </div>
      </div>
    </div>

    <div class="foot">
      <div class="pills"><span class="pill">Spin</span><span class="pill">Draft</span><span class="pill">Win Majors</span></div>

</body></html>
