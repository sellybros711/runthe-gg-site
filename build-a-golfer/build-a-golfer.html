<style>
  :root{
    --cream:#F4E8D6; --peach:#F7DCCC;
    --ink:#0C1B2E; --inkmut:#6b6256;
    --teal:#06A291; --gold:#EBA61F; --gold2:#c79320;
    --red:#E14A33; --red2:#b8371f;
    --cardA:#0d2740; --cardB:#0a1a2c;
    --board:rgba(255,255,255,.035); --oncard:#F4E3C9; --muted:#88a397;
    --line:rgba(244,227,201,.09);
    --panel:rgba(255,255,255,.045); --panelb:rgba(244,227,201,.10);
    --display:'Anton',Impact,'Arial Narrow',sans-serif;
    --serif:'Cinzel','Times New Roman',Georgia,serif;
    --body:'Barlow Semi Condensed',system-ui,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --hgreen:#16432f; --hgold:#cda24a;
    --pagebg:
      radial-gradient(1300px 680px at 50% -8%, rgba(74,156,108,.22), transparent 60%),
      radial-gradient(900px 700px at 50% 120%, rgba(10,60,40,.5), transparent 70%),
      linear-gradient(180deg,#11432f,#06200f);
    --pageink:#F4E3C9; --pagemut:#9cbfa8; --pill:rgba(0,0,0,.26); --pillb:rgba(244,227,201,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0; overscroll-behavior-y:none}
  /* solid base + a COMPOSITED fixed backdrop (body::before) instead of background-attachment:fixed,
     which forces a full-screen repaint on every scroll frame and makes mobile scrolling stutter. */
  body{background:#06200f; color:var(--pageink);
    font-family:var(--body); -webkit-font-smoothing:antialiased; min-height:100vh; line-height:1.4}
  body::before{content:""; position:fixed; inset:0; z-index:-1; background:var(--pagebg); pointer-events:none}
  #app{max-width:none; margin:0; padding:0 env(safe-area-inset-right, 0px) calc(36px + env(safe-area-inset-bottom, 0px)) env(safe-area-inset-left, 0px)}

  /* ---- top bar + header (cream Masters-style band) ---- */
  /* installed-PWA safe areas: the translucent iOS status bar overlays the web view, so pad the
     header by the top inset (otherwise the ≡ menu sits under the clock and can't be tapped). */
  .head{text-align:center; padding:calc(10px + env(safe-area-inset-top, 0px)) 16px 12px; max-width:780px; margin:0 auto; position:relative; z-index:2}
  .topbar{display:flex; justify-content:flex-start; align-items:center; margin:0 0 8px}
  .icobtn{width:38px;height:38px;border-radius:11px;background:var(--pill);border:1px solid var(--pillb);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--oncard);font-size:18px;
    box-shadow:0 4px 12px -6px rgba(0,0,0,.5)}
  .crestrow{display:flex; align-items:center; justify-content:center; gap:18px}
  .crest{width:64px;height:76px;display:block;flex:0 0 auto}
  .wmblock{min-width:0}
  .divider{display:flex; align-items:center; gap:12px; margin-bottom:9px}
  .divider .ln{flex:1; height:1.5px; background:linear-gradient(90deg,transparent,var(--hgold))}
  .divider .ln.r{background:linear-gradient(90deg,var(--hgold),transparent)}
  .divider .ball{width:22px;height:22px;flex:0 0 auto}
  .wordmark{font-family:var(--serif); font-weight:700; font-size:39px; line-height:.86; text-align:center;
    letter-spacing:.015em; text-transform:uppercase; white-space:nowrap}
  .wordmark .a{display:block; color:var(--oncard); font-size:.54em; letter-spacing:.2em; margin-bottom:1px}
  .wordmark .b{display:block; color:var(--hgold); font-size:1.18em; letter-spacing:.06em}
  .rule{height:4px; margin-top:9px; background:
    linear-gradient(var(--hgold),var(--hgold)) top/100% 1.5px no-repeat,
    linear-gradient(rgba(244,227,201,.30),rgba(244,227,201,.30)) bottom/100% 1px no-repeat}
  .pills{display:flex; gap:14px; justify-content:center; margin-top:16px}
  .pill{background:var(--pill); border:1px solid var(--pillb); border-radius:999px; padding:9px 22px;
    font-family:var(--serif); font-weight:600; font-size:15px; color:var(--oncard); cursor:pointer;
    box-shadow:0 4px 14px -6px rgba(0,0,0,.5); display:inline-flex; align-items:center; gap:9px}
  .pill svg{width:18px;height:18px;display:block}

  /* ---- the game panel: full-width deep green with a gold top edge ---- */
  .card{position:relative; z-index:1; width:100%; max-width:none; margin:0; border-radius:0; overflow:visible;
    background:transparent; box-shadow:none}
  .cardtop{display:none}
  .flag-ico{display:inline-block;width:1.5em;height:1.0em;border-radius:3px;background-size:cover;background-position:center;
    background-repeat:no-repeat;background-color:#e9e4d8;border:1px solid rgba(0,0,0,.22);box-shadow:0 1px 2px rgba(0,0,0,.22);
    vertical-align:-0.12em;flex:0 0 auto}
  .flag-none{background-image:repeating-linear-gradient(45deg,#cfc8ba 0 5px,#bdb6a7 5px 10px)}
  .flagstrip{display:flex; gap:6px; padding:8px 10px; background:rgba(0,0,0,.22); overflow:hidden}
  .flagstrip.bot{border-top:1px solid var(--line)} .flagstrip.top{border-bottom:1px solid var(--line)}
  .ftrack{display:flex; gap:6px; animation:marq 26s linear infinite}
  .flagstrip.bot .ftrack{animation-direction:reverse; animation-duration:30s}
  .ftile{font-size:20px; line-height:1; width:34px; height:26px; border-radius:6px; background:#0a1626;
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex:0 0 auto}
  @keyframes marq{to{transform:translateX(-50%)}}
  .screen{max-width:600px; margin:0 auto; padding:18px 16px 22px; position:relative}
  .screen.wide{max-width:1140px}
  /* Ryder/Presidents Cup running scoreboard, pinned to the top of the viewport while the
     match-by-match session cards below it scroll, so the score never leaves view. */
  .cupsticky{position:sticky; top:0; z-index:6; margin:0 -16px 4px; padding:calc(8px + env(safe-area-inset-top, 0px)) 16px 6px;
    background:#06200f; border-bottom:1px solid var(--line); box-shadow:0 8px 14px -10px rgba(0,0,0,.55)}
  .cols{display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start}
  .col{min-width:0}
  /* align-items:stretch (overriding .cols' :start) so the avatar column's own box spans the full
     row height, matching the (taller) customization column, without this, a position:sticky child
     has no room to travel and just scrolls away with the rest of the row instead of staying put. */
  .setup-cols{grid-template-columns:0.85fr 1fr; max-width:840px; margin:0 auto; align-items:stretch}
  @media(max-width:860px){
    .cols{grid-template-columns:1fr; gap:16px} .seasoncols .scorecol{order:-1}
    /* Stacked single-column layout breaks the row-sharing trick above (each column becomes its own
       separate, content-height row, so the sticky avatar has nothing to stretch into). display:contents
       unwraps the two column divs so the avatar + every customization control become direct siblings
       in one shared, genuinely tall block, giving the sticky avatar real room to stay pinned near the
       top while the (now single-column) form scrolls beneath it. */
    .setup-cols{display:block} .setup-cols>.col{display:contents}
  }

  h1{font-family:var(--display); font-style:normal; font-weight:400; color:var(--oncard);
    letter-spacing:.01em; line-height:.96; margin:6px 0; text-transform:uppercase; text-shadow:0 2px 18px rgba(0,0,0,.5)}
  h2{font-family:var(--body); font-weight:800; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:0 0 10px}
  p.lede{color:#d7e2ea; margin:0 0 16px}
  .center{text-align:center}
  .muted{color:var(--muted)} .small{font-size:12.5px}
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
  .ic{display:inline-block;width:1em;height:1em;vertical-align:-0.14em;flex:0 0 auto;line-height:1}
  .tag{display:inline-block; font:800 10px/1 var(--body); letter-spacing:.18em; text-transform:uppercase;
    color:var(--teal); border:1px solid var(--line); padding:6px 9px; border-radius:999px}

  /* ---- buttons ---- */
  .btn{appearance:none; cursor:pointer; display:block; width:100%; text-align:center;
    font-family:var(--display); font-weight:400; letter-spacing:.03em; text-transform:uppercase;
    font-size:21px; border-radius:14px; padding:15px 16px; border:0; color:#fff;
    transition:transform .04s ease, filter .15s ease}
  .btn .sub{display:block; font-family:var(--body); font-weight:800; font-size:10.5px; letter-spacing:.12em; opacity:.9; margin-top:6px}
  .btn.red{background:linear-gradient(180deg,#ef5b45,var(--red2)); box-shadow:0 8px 20px -8px rgba(184,55,31,.75), inset 0 1px 0 rgba(255,255,255,.22)}
  .btn.red:active{transform:translateY(2px)}
  .btn.gold{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.16)); color:var(--gold); border:1.5px solid var(--gold); box-shadow:0 5px 14px -7px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06)}
  .btn.teal{background:linear-gradient(180deg,#1ec6a6,#0a7c67); color:#04211c; box-shadow:0 8px 20px -8px rgba(10,107,88,.7), inset 0 1px 0 rgba(255,255,255,.3)}
  .btn.teal:active{transform:translateY(2px)}
  .btn.blue{background:linear-gradient(180deg,#4a90d9,#1f5fa8); color:#eaf3ff; box-shadow:0 8px 20px -8px rgba(20,70,140,.75), inset 0 1px 0 rgba(255,255,255,.32)}
  .btn.blue:active{transform:translateY(2px)}
  .btn.ghost{background:transparent; color:var(--oncard); border:1px solid var(--line); font-size:18px}
  /* paired risk/reward choices read as ONE decision: same neutral style, "or" between them */
  .btn.choice{background:rgba(244,227,201,.10); color:var(--oncard); border:1.5px solid rgba(244,227,201,.5)}
  .btn.choice:active{transform:translateY(2px)}
  .ordiv{display:flex; align-items:center; gap:10px; max-width:520px; margin:10px auto; color:var(--muted); font-weight:800; font-size:11px; letter-spacing:.16em; text-transform:uppercase}
  .ordiv::before,.ordiv::after{content:""; flex:1; height:1px; background:var(--line)}
  .btn:hover{filter:brightness(1.06)}
  /* ---- win celebration ---- */
  .celebrate{position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:28px 24px; overflow:hidden; cursor:pointer;
    background:radial-gradient(120% 80% at 50% 30%, #134a32, #04120b 78%); animation:celebFade .3s ease both}
  .celebrate.major{background:radial-gradient(100% 72% at 50% 34%, #16331f, #03100a 72%)}
  .celebrate canvas.confetti{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
  .celebrate .spot{position:absolute; left:50%; top:32%; transform:translate(-50%,-50%); width:560px; height:560px; max-width:130vw; max-height:74vh;
    background:radial-gradient(circle, rgba(235,166,31,.26), transparent 60%); pointer-events:none; animation:celebSpot 1.1s ease both}
  .celeb-trophy{position:relative; width:120px; height:138px; filter:drop-shadow(0 12px 26px rgba(0,0,0,.55)); animation:celebPop .6s cubic-bezier(.22,1.4,.38,1) both}
  .celebrate.major .celeb-trophy{width:150px; height:168px}
  .celeb-kicker{position:relative; margin-top:16px; font:800 12px/1.3 var(--body); letter-spacing:.3em; text-transform:uppercase; color:var(--gold); animation:celebRise .5s .12s ease both}
  .celeb-title{position:relative; font-family:var(--display); font-weight:400; text-transform:uppercase; color:var(--oncard);
    font-size:40px; line-height:.95; margin-top:7px; letter-spacing:.02em; animation:celebRise .5s .18s ease both}
  .celebrate.major .celeb-title{font-size:46px; color:#f9d271}
  .celeb-sub{position:relative; margin-top:9px; font-size:15px; color:#dfeae2; max-width:440px; animation:celebRise .5s .24s ease both}
  .celeb-cheque{position:relative; margin-top:10px; font-family:var(--mono); font-weight:800; font-size:27px; color:#35d6a0; animation:celebRise .5s .3s ease both}
  .celeb-tally{position:relative; margin-top:6px; font:800 12px/1 var(--body); letter-spacing:.16em; text-transform:uppercase; color:var(--gold); animation:celebRise .5s .36s ease both}
  .celeb-actions{position:relative; margin-top:24px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; animation:celebRise .5s .44s ease both}
  .celeb-actions .btn{width:auto; padding:12px 22px}
  @keyframes celebFade{from{opacity:0}to{opacity:1}}
  @keyframes celebPop{0%{opacity:0;transform:scale(.3) translateY(34px)}60%{opacity:1}100%{opacity:1;transform:scale(1) translateY(0)}}
  @keyframes celebRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes celebSpot{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @media (prefers-reduced-motion:reduce){ .celebrate,.celeb-trophy,.celeb-kicker,.celeb-title,.celeb-sub,.celeb-cheque,.celeb-tally,.celeb-actions,.celebrate .spot{animation-duration:.01ms} }
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn:focus-visible, button:focus-visible, [tabindex]:focus-visible, input:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  .mini{display:flex; gap:10px; margin-top:10px}
  .mini .btn{font-size:14px; padding:12px}
  .spotlive{position:relative; animation:spotpulse 2.4s ease-in-out infinite}
  @keyframes spotpulse{0%,100%{box-shadow:0 0 0 0 rgba(235,166,31,.0)}50%{box-shadow:0 0 0 4px rgba(235,166,31,.16)}}
  @media (prefers-reduced-motion:reduce){.spotlive{animation:none}}
  .stack>*+*{margin-top:10px}

  /* ---- title scene ---- */
  .scene{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none}
  .coursebg{position:absolute; inset:0; width:100%; height:100%; display:block}
  .sky{position:absolute; inset:0; background:linear-gradient(180deg,#0a2038 0%,#0b2742 40%,#0f3f30 58%,#0b3325 100%)}
  .glow{position:absolute; top:-14%; width:62%; height:60%;
    background:radial-gradient(closest-side, rgba(255,242,205,.18), transparent 70%); filter:blur(2px)}
  .glow.l{left:-14%} .glow.r{right:-14%}
  .green{position:absolute; left:50%; bottom:-6%; transform:translateX(-50%); width:160%; height:58%;
    background:radial-gradient(120% 92% at 50% 100%, #257a4f 0%, #14512f 55%, transparent 76%)}
  .ring{position:absolute; left:50%; bottom:2%; transform:translateX(-50%); border:1px solid rgba(255,255,255,.10); border-radius:50%}
  .titlewrap{position:relative; z-index:1; max-width:560px; margin:0 auto}
  .hero{font-family:var(--serif); font-weight:700; font-style:normal; line-height:.98; letter-spacing:.015em; margin:2px 0 2px; text-transform:uppercase; text-shadow:0 3px 22px rgba(0,0,0,.55)}
  .hero .hr1{color:var(--oncard)} .hero .hr2{color:var(--hgold)}
  .herotag{font-family:var(--body); font-weight:800; letter-spacing:.3em; text-transform:uppercase; font-size:11px; color:var(--teal); opacity:.92; margin-bottom:8px}
  .herorule{display:flex; align-items:center; justify-content:center; gap:11px; max-width:230px; margin:10px auto 2px}
  .herorule span{height:1px; flex:1; background:rgba(235,166,31,.42)}
  .trophy{width:54px; height:72px; display:block; margin:2px auto 4px; filter:drop-shadow(0 6px 14px rgba(235,166,31,.4))}
  .scorechip{display:inline-flex; align-items:center; gap:14px; background:rgba(7,18,30,.82);
    border:1px solid var(--gold); border-radius:12px; padding:9px 16px; margin:6px auto 16px;
    font-family:var(--mono); font-weight:700; color:var(--oncard)}
  .scorechip b{color:var(--gold); font-size:18px}
  .scorechip .lab{font-family:var(--body); font-weight:800; letter-spacing:.12em; font-size:11px; color:var(--muted)}
  .rollchip{display:inline-block; min-width:230px; background:rgba(7,18,30,.82); border:1px solid var(--gold);
    border-radius:12px; padding:9px 18px; margin:6px auto 16px; text-align:center}
  .rolllab{font-family:var(--body); font-weight:800; letter-spacing:.16em; font-size:10px; text-transform:uppercase; color:var(--muted)}
  .rollval{font-family:var(--display); font-style:italic; font-size:22px; color:var(--gold); margin-top:4px;
    transition:opacity .18s ease; letter-spacing:.01em}
  .skillwheel{overflow:hidden; margin-top:7px;
    -webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
    mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
  .skillwheel .track{display:inline-flex; align-items:center; animation:marq 20s linear infinite; will-change:transform}
  .swchip{font-family:var(--display); font-style:italic; font-size:19px; color:var(--gold); white-space:nowrap; letter-spacing:.01em}
  .swchip::after{content:'•'; color:var(--pagemut); font-style:normal; margin:0 16px; opacity:.6}
  .btn.goldfill{background:linear-gradient(180deg,#f9d271,#e9a81e 55%,#c98f12); color:#2a1c06; box-shadow:0 9px 22px -8px rgba(154,110,18,.8), inset 0 1px 0 rgba(255,255,255,.5); text-shadow:0 1px 0 rgba(255,255,255,.25)}
  .btn.goldfill:active{transform:translateY(2px)}

  /* ---- draft ---- */
  .draftbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
  .spins{font-family:var(--mono); font-weight:700}
  .pips{display:flex; gap:5px; margin-top:6px; flex-wrap:wrap}
  .pip{width:9px;height:9px;border-radius:999px;background:var(--line)} .pip.on{background:var(--gold)}
  .reel{height:84px; border-radius:16px; border:1px solid var(--panelb);
    background:radial-gradient(120% 120% at 50% 0%, rgba(255,255,255,.08), rgba(0,0,0,.12)); display:flex; align-items:center;
    justify-content:center; overflow:hidden; position:relative}

  .attrs{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:10px}
  .attr{display:flex; align-items:center; gap:9px; background:var(--panel);
    border:1px solid var(--panelb); border-radius:10px; padding:9px 10px 9px 12px; cursor:pointer; text-align:left;
    color:var(--oncard); font:inherit; width:100%; box-shadow:0 4px 12px -10px rgba(0,0,0,.6); transition:transform .05s ease, border-color .12s ease}
  .attr .lab{flex:1; font-weight:600; font-size:12px; color:#cfdbe6}
  .attr .val{font-family:var(--mono); font-weight:800; font-size:16px; color:var(--gold)}
  .attr .take{font:800 9px/1 var(--body); letter-spacing:.08em; text-transform:uppercase; color:#04211c;
    background:linear-gradient(180deg,#f9d271,#e9a81e); border-radius:6px; padding:5px 7px; flex:0 0 auto}
  .attr:hover:not(:disabled){border-color:var(--gold)}
  .attr:active:not(:disabled){transform:scale(.985)}
  .attr:disabled{opacity:.34; cursor:not-allowed} .attr:disabled .take{display:none}
  .attr.keyhole{border-color:var(--gold); background:linear-gradient(180deg,rgba(235,166,31,.16),rgba(235,166,31,.05))}
  .attr.keyhole .lab{color:#f3e7c8}
  .attr .keystar{flex:0 0 auto; color:var(--gold); font-size:12px; line-height:1; margin-right:-3px}

  .buildhero{display:flex; align-items:center; gap:20px; justify-content:center;
    background:linear-gradient(157deg, rgba(22,62,51,.66), rgba(8,30,24,.74));
    border:1px solid rgba(235,166,31,.22); border-radius:18px; padding:16px 20px; margin:2px 0 14px;
    box-shadow:0 18px 38px -22px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.06)}
  .herocol{display:flex; flex-direction:column; align-items:center; flex:0 0 auto; min-width:128px}

  .avatarimg{object-fit:cover; border-radius:50%}
  .ovrchip{position:absolute; bottom:-10px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:6px;
    background:rgba(6,16,26,.95); border:1.5px solid var(--tc,#cd7f32); border-radius:999px; padding:4px 12px;
    box-shadow:0 5px 14px rgba(0,0,0,.55); white-space:nowrap}
  .ovrchip b{font-family:var(--mono); font-weight:800; font-size:19px; color:var(--tc,#cd7f32); line-height:1; transition:color .2s}
  .ovrchip i{font:800 8.5px/1 var(--body); letter-spacing:.13em; color:var(--tc,#cd7f32); font-style:normal; opacity:.92}
  .heroname{font-family:var(--serif); font-weight:700; font-size:17px; color:var(--oncard); margin-top:17px; text-align:center; line-height:1.1; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .herometa{font:800 9.5px/1 var(--body); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:5px}
  .radarwrap{flex:0 1 auto; min-width:0; display:flex; justify-content:center}
  .radar{width:100%; max-width:250px; height:auto; display:block}
  .radar text{font-family:var(--body)}
  .card-grid{display:grid; gap:6px; margin-top:10px}
  .slot{display:flex; align-items:center; gap:10px; background:var(--board); border:1px solid var(--line);
    border-radius:10px; padding:7px 11px}
  .slot .lab{flex:1; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:#bfe7df}
  .slot .who{font-size:11.5px; color:var(--oncard); opacity:.85}
  .slot .v{font-family:var(--mono); font-weight:800; font-size:15px; color:var(--gold); min-width:30px; text-align:right}
  .slot .slotdec{font-family:var(--mono); font-weight:800; font-size:12px; color:#e07a5f; flex:0 0 auto; letter-spacing:-.02em}
  .slot.empty .v, .slot.empty .lab{color:var(--muted)}
  .authbox{max-width:360px; margin:2px auto 0}
  .autherr{color:#e98a72; font-size:13px; font-weight:600; margin-top:9px}
  .author{display:flex; align-items:center; gap:10px; margin:13px 0}
  .author:before, .author:after{content:''; flex:1; height:1px; background:rgba(244,227,201,.16)}
  .author span{color:var(--muted); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase}
  .gbtn{display:flex; align-items:center; justify-content:center; gap:9px; background:#fff; color:#1f1f1f; border:none; font-weight:700}
  .gbtn svg{width:17px; height:17px; flex:0 0 auto}
  .profhdr .avatarfig{width:84px; height:84px}
  .perkhd{font:800 10.5px/1 var(--body); letter-spacing:.16em; text-transform:uppercase; color:var(--gold); margin:0 0 10px; text-align:left}
  .perks{display:grid; gap:9px; margin:0 0 15px}
  .perk{display:flex; align-items:flex-start; gap:10px; text-align:left}
  .perk .pic{flex:0 0 auto; width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-size:15px; background:rgba(235,166,31,.12); border:1px solid rgba(235,166,31,.32); border-radius:8px}
  .perk .pt{min-width:0}
  .perk .pt b{display:block; color:var(--oncard); font-size:12.5px; font-weight:700; line-height:1.2}
  .perk .pt span{display:block; color:var(--muted); font-size:11px; line-height:1.3; margin-top:1px}
  .lockwrap{position:relative; margin-top:6px; min-height:120px}
  .lockblur{filter:blur(4.5px); opacity:.42; pointer-events:none; user-select:none}
  .lockover{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:11px; text-align:center; padding:12px;
    background:linear-gradient(180deg, rgba(8,30,24,.12) 0%, rgba(8,30,24,.6) 45%, rgba(8,30,24,.82) 100%)}
  .lockover .lockmsg b{display:block; color:var(--gold); font-size:14.5px}
  .lockcta{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:8px;
    background:var(--panel); border:1px solid rgba(235,166,31,.3); border-radius:12px; padding:11px 13px}

  /* tee-tier badges */
  .bcat{font:800 10.5px/1 var(--body); letter-spacing:.16em; text-transform:uppercase; color:var(--gold); margin:16px 0 8px}
  .bgrid{display:grid; grid-template-columns:1fr 1fr; gap:9px}
  @media(min-width:560px){ .bgrid{grid-template-columns:1fr 1fr 1fr} }
  .bcard{position:relative; background:var(--panel); border:1px solid var(--panelb); border-radius:14px; padding:13px 9px 11px; text-align:center; overflow:hidden}
  .bcard.locked{opacity:.6}
  .bcard.maxed{border-color:rgba(235,166,31,.5); box-shadow:0 0 0 1px rgba(235,166,31,.25) inset}
  .teemedal{width:54px; height:54px; margin:0 auto 7px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:3px solid var(--tc); background:radial-gradient(circle at 38% 32%, rgba(255,255,255,.16), rgba(0,0,0,.28)); box-shadow:0 3px 9px rgba(0,0,0,.4)}
  .bcard.locked .teemedal{border-color:#46586a; filter:grayscale(.85) brightness(.8)}
  .teeglyph{font-size:24px; line-height:1}
  .bname{font-weight:800; font-size:12.5px; color:var(--oncard); line-height:1.12}
  .bdesc{font-size:10px; color:var(--muted); line-height:1.3; margin:3px 2px 7px; min-height:26px}
  .btier{font:800 8.5px/1 var(--body); letter-spacing:.6px; text-transform:uppercase; color:#8aa0ad}
  .bcard.maxed .btier{color:var(--gold)}
  .bprog{font-family:var(--mono); font-weight:800; font-size:15px; color:var(--oncard); margin-top:3px}
  .bbar{height:5px; border-radius:4px; background:rgba(255,255,255,.12); overflow:hidden; margin-top:7px}
  .bbar span{display:block; height:100%; border-radius:4px; transition:width .5s cubic-bezier(.2,.7,.2,1)}
  .btees{display:flex; gap:4px; justify-content:center; margin-top:8px}
  .btees i{width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.14)}
  .btees i.on{border-color:rgba(255,255,255,.35)}

  /* daily challenge scorecard */
  .dcard{display:grid; grid-template-columns:repeat(9,1fr); gap:4px}
  .dcell{background:var(--panel); border:1px solid var(--panelb); border-radius:7px; padding:5px 0 4px; text-align:center}
  .dcell.cur{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset}
  .dcell.sel{border-color:var(--teal); box-shadow:0 0 0 1px var(--teal) inset}
  .dcell.done{transition:transform .05s ease} .dcell.done:active{transform:scale(.94)}
  .dcell .dn{font-size:9px; color:var(--muted); font-weight:700; line-height:1}
  .dcell .ds{font-family:var(--mono); font-weight:800; font-size:15px; line-height:1.15}
  .dcell .ds .smk{display:inline-flex; align-items:center; justify-content:center; min-width:19px; height:19px; padding:0 1px; box-sizing:border-box; line-height:1}
  .dcell .ds .smk.circle{border:1.6px solid currentColor; border-radius:50%}
  .dcell .ds .smk.box{border:1.6px solid currentColor; border-radius:3px}
  .dcell .ds .smk.dcircle{border:1.6px solid currentColor; border-radius:50%; outline:1.6px solid currentColor; outline-offset:1.6px}
  .dcell .ds .smk.dbox{border:1.6px solid currentColor; border-radius:3px; outline:1.6px solid currentColor; outline-offset:1.6px}
  .shotpanel{max-width:560px; margin:8px auto 0; background:var(--panel); border:1px solid var(--panelb); border-radius:13px; padding:10px 14px}
  .shothd{display:flex; align-items:baseline; gap:11px; border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:2px}
  .shothd .hn{font-family:var(--display); font-style:italic; font-size:26px; color:var(--oncard); line-height:.9}
  .shothd .hi{font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.07em}
  .shotrow{display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid rgba(244,227,201,.05); animation:shotIn .3s ease both}
  .shotrow:first-of-type{border-top:none}
  .shotrow .sl{flex:0 0 56px; font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase; letter-spacing:.04em}
  .shotrow .sd{flex:1; font-size:13.5px; color:#cfdbe6; line-height:1.3}
  .shotrow.hole .sd{font-weight:800; color:var(--oncard)}
  .shotrow .stag{flex:0 0 auto; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; border:1.4px solid currentColor; border-radius:999px; padding:2px 9px}
  .shothd .restag{margin-left:auto; flex:0 0 auto; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; border:1.4px solid currentColor; border-radius:999px; padding:2px 10px}
  .shotsum{padding:9px 0 2px; font-size:13.5px; color:#cfdbe6}
  .shottoggle{display:block; width:100%; margin-top:8px; background:transparent; border:1px dashed var(--line); color:var(--gold); border-radius:9px; padding:8px; font-weight:800; font-size:12px; letter-spacing:.03em; cursor:pointer}
  .shottoggle:hover{background:rgba(235,166,31,.06)}
  .legendx,.blurbmore{background:transparent; border:1px solid var(--line); color:var(--gold); border-radius:8px; padding:4px 10px; font-weight:800; font-size:11px; cursor:pointer; white-space:nowrap}
  .blurbmore{padding:1px 7px; margin-left:4px}
  @keyframes shotIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){ .shotrow{animation:none} }

  .ovr{display:flex; align-items:baseline; gap:10px; justify-content:center; margin:4px 0}
  .ovr .num{font-family:var(--mono); font-weight:800; font-size:52px; color:var(--gold); line-height:1}
  .ovr .lbl{font:800 11px/1 var(--body); letter-spacing:.2em; text-transform:uppercase; color:var(--muted)}
  .scout{background:var(--panel); border:1px solid var(--panelb); border-radius:12px; padding:12px 14px; font-size:13px; color:#dfeae2; margin-top:12px}
  input.name{width:100%; background:#0a2740; border:1px solid var(--line); color:var(--oncard);
    font:800 16px/1 var(--body); border-radius:11px; padding:13px 14px; margin-top:6px}

  /* ---- leaderboard ---- */
  .evt-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:10px}
  .evt-head .nm{font-family:var(--display); font-weight:400; font-size:24px; text-transform:uppercase; color:var(--oncard); letter-spacing:.02em}
  .kx{font:800 10px/1.3 var(--body); letter-spacing:.14em; text-transform:uppercase}
  .major{color:var(--gold)} .sig{color:var(--teal)} .reg{color:var(--muted)}
  .board{background:var(--board); border:1px solid var(--line); border-radius:13px; overflow:hidden}
  .lb{display:grid; grid-template-columns:34px 1fr 56px 62px; gap:8px; align-items:center; padding:9px 12px; font-size:13px; border-top:1px solid rgba(244,227,201,.06)}
  .lb:first-child{border-top:0}
  .lb .pos{font-family:var(--mono); color:var(--muted); font-weight:700}
  .lb .pl{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--oncard)}
  .lb .sc{font-family:var(--mono); font-weight:800; text-align:right; color:var(--oncard)}

  .sep{height:1px; background:repeating-linear-gradient(90deg,var(--line),var(--line) 6px,transparent 6px,transparent 12px)}
  /* collapsible career groups (native <details>, no re-render needed) */
  .acc{border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:7px; background:var(--board)}
  .acc.flat{background:transparent}
  .accsum{list-style:none; cursor:pointer; display:flex; align-items:center; gap:9px; padding:11px 14px; font-size:13.5px; color:var(--oncard); user-select:none}
  .accsum::-webkit-details-marker{display:none}
  .accsum.nochev{cursor:default}
  .acc .chev{transition:transform .15s ease, background .15s ease; color:var(--gold); font-size:15px; font-weight:900; line-height:1;
    flex:0 0 auto; width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:8px; background:rgba(235,166,31,.16); border:1px solid rgba(235,166,31,.42)}
  .acc .chev.dim{color:var(--muted); font-size:13px; background:transparent; border-color:transparent}
  .acc[open] .chev{transform:rotate(90deg); background:rgba(235,166,31,.28); border-color:var(--gold)}
  .accsum:hover .chev:not(.dim){background:rgba(235,166,31,.26)}
  .acc .yrtag{flex:0 0 auto; font-family:var(--mono); color:var(--muted); font-weight:700; min-width:48px}
  .acc .acctitle{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:800}
  .acc .acctitle.thin{font-weight:600}
  .accmeta{margin-left:auto; font-family:var(--mono); color:var(--muted); font-size:12.5px; white-space:nowrap}
  .accbody{border-top:1px solid var(--line); padding:3px 0}
  .accbody .lb{border-top:1px solid rgba(244,227,201,.05)}
  .accbody .lb:first-child{border-top:0}
  .runline{display:flex; justify-content:space-between; font-family:var(--mono); font-size:13px; padding:10px 2px 0; color:var(--oncard)}
  /* live tournament scorecard */
  .scorecard{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.20)); border:1px solid var(--panelb);
    border-radius:16px; padding:14px 14px 16px; box-shadow:0 14px 32px -20px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.05)}
  .sc-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; gap:10px}
  .sc-name{font-family:var(--display); font-size:22px; color:var(--oncard); text-transform:uppercase; letter-spacing:.02em; line-height:1}
  .sc-pos{font-family:var(--mono); font-weight:800; font-size:27px; line-height:1}
  .sc-topar{font-family:var(--mono); font-weight:800; font-size:15px; margin-top:3px}
  .rounds{display:flex; gap:8px}
  .rdcell{flex:1; text-align:center; background:#0a2740; border:1px solid var(--line); border-radius:12px; padding:11px 4px 10px;
    transition:background .25s ease, border-color .25s ease, transform .25s ease}
  .rdcell.live{border-color:var(--gold); background:rgba(235,166,31,.14); transform:translateY(-2px); box-shadow:0 6px 16px -10px rgba(235,166,31,.6)}
  .rdlab{font:800 9px/1 var(--body); letter-spacing:.16em; color:var(--muted)}
  .rdval{font-family:var(--mono); font-weight:800; font-size:24px; margin-top:7px; color:var(--oncard)}
  .rdcell.empty .rdval{color:var(--muted); opacity:.5}
  .sc-status{margin-top:12px; text-align:center; font:800 12px/1.35 var(--body); letter-spacing:.05em; color:var(--teal)}

  .sbar{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line);
    border:1px solid var(--line); border-radius:13px; overflow:hidden; margin-bottom:14px}
  .sstat{background:var(--panel); padding:10px 11px}
  .sstat.wide{grid-column:1 / -1; background:rgba(255,255,255,.06)}
  .sstat.w3{grid-column:1 / 4; background:rgba(255,255,255,.06)}
  .sstat.rankcell{background:rgba(235,166,31,.10)}
  .authspin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(235,166,31,.35);border-top-color:var(--gold);display:inline-block;animation:authspin .7s linear infinite}
  @keyframes authspin{to{transform:rotate(360deg)}}
  .sstat .k{font:800 9.5px/1 var(--body); letter-spacing:.13em; text-transform:uppercase; color:var(--muted)}
  .sstat .v{font-family:var(--mono); font-weight:800; font-size:18px; margin-top:5px; color:var(--oncard)}
  .sstat .v.gold{color:var(--gold); font-size:22px}
  .screen.major-screen{background:radial-gradient(130% 70% at 50% -8%, rgba(235,166,31,.20), transparent 62%)}
  .majorbanner{display:flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(90deg,#5a3d0b,var(--gold),#5a3d0b); color:#1a1206;
    font-family:var(--display); font-style:italic; font-size:17px; letter-spacing:.05em;
    padding:9px; border-radius:12px; margin-bottom:12px; text-transform:uppercase;
    box-shadow:0 0 18px rgba(235,166,31,.35)}
  .board.major{border-color:var(--gold); box-shadow:0 0 0 1px rgba(235,166,31,.4)}

  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0}
  .tiles.four{grid-template-columns:repeat(4,1fr)}
  @media(max-width:680px){ .tiles.four{grid-template-columns:1fr 1fr} }
  .tile{background:var(--panel); border:1px solid var(--panelb); border-radius:12px; padding:12px 14px}
  .tile .k{font:800 10px/1 var(--body); letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
  .tile .v{font-family:var(--mono); font-weight:800; font-size:23px; margin-top:6px; color:var(--gold)}
  .tile .v.cream{color:var(--oncard)}
  .share{background:#0a2740; border:1px dashed var(--line); border-radius:11px; padding:12px 14px; font-family:var(--mono); font-size:12px; color:#d2e1ea; white-space:pre-wrap; margin-top:6px}

  if(ds.last===t)return ds;

  if(ds.last===yesterdayKey()) ds.current=(ds.current||0)+1;                       // played on consecutive days
  else if(ds.last===twoDaysAgoKey() && ds.freezes>0){ ds.freezes--; ds.current=(ds.current||0)+1; ds._usedFreeze=true; }  // a freeze bridges one missed day

const PULL_RATES=[['Legendary',0.05],['Epic',0.25],['Rare',0.35],['Common',0.35]]; // rarest first; sum 1.0

  const all=Object.values(pool).flat().filter(g=>!revealed.has(g.name)); if(!all.length)return null;
  const g=all[Math.floor(rng()*all.length)]; revealed.add(g.name); return g;
}

// career gets its own ordering. Walks a fixed stride through a per-career shuffle of the pool.
// the men's Olympic golf tournament runs every 4 years (2028, 2032, ...): 72 holes, no cut, ~60 players
// with a max of 4 per country, and gold/silver/bronze medals instead of prize money.
function isOlympicYear(year){ return (year||1)%4===0; }   // every 4 years, first in year 4 (then 8, 12, ...)

// Modeled on each major's real current-era past-champion policy: the Masters grants a true lifetime
// invitation; The Open exempts past champions through age 60; the PGA Championship ("The Championship"
// in-game) exempts winners for 5 years (its old lifetime exemption was rescinded in 2016); the U.S. Open

const GUEST_MAJOR_WK={'The Masters':15,'The Championship':19,'U.S. Open':24,'The Open':27};

function guestMajorExemptions(){

  if(lastWinYear['The Open']!=null && age<=60) out.push('The Open');                                        // through age 60

function circuitSchedule(seed){

function gauss(){let u=0,v=0;while(!u)u=RNG();while(!v)v=RNG();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
// per-round score-to-par = BASE + courseAdj - (overall-80)*0.238 + gauss(0,SIGMA).  overall 80 = tour average.
// BASE re-bisected for this ~120 field (the eligible pool runs mean ~82 with stars to 95, so BASE is
// higher than the spec's mean-80 starting values). COURSE_SD = a per-event difficulty draw that models
// course/weather variance (gives the real winner-score spread). Validated vs the spec's target table.
// sigma = per-player per-round noise (the one lever that drives finish-position variance; csd is a
// field-wide weekly draw that cancels in the standings). RESTORED to the real DataGolf-measured baseline
// (2.80/2.90), a previous pass had trimmed this ~16% to tighten season-to-season swings, but that made a
// clearly-better build's per-event win probability far higher than any real career (see CLAUDE.md CS78):
// real legends peak around a 15-20% major win rate in their absolute prime, not 25%+ routinely. base & csd
// unchanged (those track the winning-score calibration, a separate concern from win-rate realism).
const SIM={reg:{base:0.91,sigma:2.80,csd:0.90}, maj:{base:2.74,sigma:2.90,csd:1.45}};
const SKILLSLOPE=0.238;
// Diminishing returns above the field's realistic ceiling (~92 OVR is close to the best NPCs a maxed
// build ever faces), real strokes-gained data shows the very best players in the world separate from
// mid-pack tour pros by roughly a stroke a round, not four or five, so a 99-build's edge over a 92-build
// should be a fraction of a 92-build's edge over an 80-build, not the same fixed per-point rate all the
// way up. Below the knee, nothing changes, every previously-calibrated realistic build (60-92 OVR) sees
// the exact same edge as before.
const SKILL_KNEE=92, SKILL_KNEE_COMPRESS=0.45;
function skillEdge(eo){ const capped=Math.min(eo,SKILL_KNEE)-80, extra=Math.max(0,eo-SKILL_KNEE)*SKILL_KNEE_COMPRESS; return (capped+extra)*SKILLSLOPE; }
// Composure under real pressure, majors AND big/signature/playoff finales, final round only. Beyond the
// existing small mean nudge (±0.4 strokes), low composure now carries a real CHOKE RISK: a chance of a
// one-round blowup (a genuine collapse, not just a slightly worse average). Deliberately asymmetric, not
// a symmetric variance widening, an earlier version of this tried "low composure = wider spread both
// ways," but that gives an underdog MORE win equity in a big single-elimination-style field (wider variance
// helps whoever's behind), which is backwards from the ask: low composure should make majors harder, full
// stop, not just more chaotic. High composure (80+) carries no choke risk at all, cool under pressure,
// not just lucky.
const CHOKE_RATE=0.008, CHOKE_CAP=0.30, CHOKE_STROKES=3.2;
function simRound(eo,clu,{major,big,finalRd,courseAdj}){
  const k=major?SIM.maj:SIM.reg;
  let m=k.base+(courseAdj||0)-skillEdge(eo);
  const pressure=(major||big)&&finalRd;
  if(pressure){
    m-=clamp((clu-80)*0.02,-0.4,0.4);
    if(RNG()<clamp((80-clu)*CHOKE_RATE,0,CHOKE_CAP)) m+=CHOKE_STROKES;   // the choke moment itself
  }
  return m+gauss()*k.sigma;
}

ndrews, Scotland","par":72,"yd":7305,"ver":true,"blurb":"The Home of Golf, played over the same linksland for some 600 years and shaped by nature more than any architect. Seven enormous double greens, blind tee shots and over a hundred ravenous pot bunkers, Hell Bunker, the Beardies, the Road Hole bunker, reward local knowledge and punish the careless. With no wind it can be torn apart; when it howls off the North Sea it becomes a brutal exam of flight control and creativity. The 17th Road Hole is the most fearsome par-4 in golf, while the wide 1st and 18th share the iconic Swilcan Bridge.","avg":0.3,"cdiff":-0.022,"fit":{"dist":1.328,"acc":1.328,"app":0.85,"sht":1.113,"scr":1.113,"bnk":1.113,"put":1.265,"clu":1},"sig":[[17,"The Road Hole par-4, Road Bunker and the wall behind make it maybe golf's hardest par-4"],[14,"Long par-5 with Hell Bunker lurking, bold seconds flirt with disaster"],[18,"Drivable home hole over the Swilcan Burn into the town, birdie or heartbreak"]],"holes":[[4,376,"Burn"],[4,453,"Dyke"],[4,397,"Cartgate (Out)"],[4,480,"Ginger Beer"],[5,568,"Hole o' Cross (Out)"],[4,412,"Heathery (Out)"],[4,371,"High (Out)"],[3,188,"Short"],[4,352,"End"],[4,386,"Bobby Jones"],[3,174,"High (In)"],[4,351,"Heathery (In)"],[4,465,"Hole o' Cross (In)"],[5,618,"Long"],[4,455,"Cartgate (In)"],[4,418,"Corner of the Dyke"],[4,495,"Road"],[4,357,"Home"]]},"Oakmont":{"v":"Oakmont Country Club","loc":"Oakmont, Pennsylvania","par":70,"yd":7357,"ver":true,"blurb":"Founded in 1903 by Henry Fownes on the belief that a shot poorly played should be a shot irrevocably lost, Oakmont is widely regarded as the hardest course in America. Its greens are the fastest in championship golf, lightning-quick and tilted, while the Church Pews bunker between the 3rd and 4th and over 175 other traps swallow anything offline. The rough is punishing, the fairways pinched, and par is a genuinely great score on nearly every hole. Only flawless ball-striking and ice-cold putting survive; this is b function genRookie(rng,simYear,used){

/* §2 per-career potential roll, talent tilts the odds, dice stay live (varies each universe) */
function rollPotential(b,rng){
  const r=rng();
  if(b.bust&&r<b.bust) return b.lo + rng()*Math.max(0,(b.exp-1)-b.lo);          // bust toward floor
  if(b.boom&&r>1-b.boom) return (b.exp+1) + rng()*Math.max(0,b.hi-(b.exp+1));   // boom toward ceiling
  return clamp(cgauss(rng,b.exp,(b.hi-b.lo)/6 || 0.0001), b.lo, b.hi);          // land in band
}
function applyCareerRoll(g,rng){
  const base={}; SKK.forEach(s=>{const a=ageArc(s,g.arc_age||32); base[s]=clamp(Math.round((g[s]||60)/a),(g[s]||60),99);});
  let b=g.pot_band;
  // Youth upside: young, still-developing REAL players get a wider boom tail so that DIFFERENT real
  // prospects break out in different universes (a young stud can roll into the mid-90s and contest #1).
  // Generated rookies (g.fictional) are excluded, they fill the field but shouldn't top it.
  if(b && !g.fictional){ const age=CAREER_START_YEAR-(g.born||1994);
    if(age<=28){ const upside=clamp(Math.round((30-age)*0.9),2,8);
      b={exp:b.exp, lo:b.lo, hi:clamp(b.hi+upside,b.hi,97), boom:clamp((b.boom||0)+0.11,0,0.22), bust:b.bust}; } }
  if(!b||b.hi===b.lo){ g._sp=base; g.career_potential=g.potential||Math.round(SKK.reduce((a,s)=>a+base[s]*CW[s],0)); return; }
  const baseOv=SKK.reduce((a,s)=>a+base[s]*CW[s],0), rolled=rollPotential(b,rng), scale=baseOv>0?rolled/baseOv:1;
  const sp={}; SKK.forEach(s=>sp[s]=clamp(Math.round(base[s]*scale),40,99));
  g._sp=sp; g.career_potential=Math.round(rolled);
}
function stampLiving(g,simYear){const l=livingOf(g,simYear); g.lov=l.ov; g.lage=l.age; SKK.forEach(s=>g['l_'+s]=l.ls[s]); return g;}
function refillWorld(w,rng){let guard=0;
  const used=new Set(w.active.map(g=>g.name).concat(w.alumni.map(g=>g.name)).concat(GOLFERS.map(g=>g.name)));
  while(w.active.length<WORLD_TARGET && guard++<500){ const r=genRookie(rng,w.simYear,used); stampLiving(r,w.simYear); w.active.push(r); } }
function seedWorld(seed){
  const rng=mulberry32((seed^0x51ed2701)>>>0);
  // Field is gated by REAL AGE: any real golfer under the retirement age plays in 2026 at their
  // age-declined living rating and ages out (e.g. Tiger at 51 → ~4 seasons, gone by 55). Their peak
  // CARD stays draftable in the spin. Players already past the cap in 2026 are retired (arcade-only).
  const active=GOLFERS.filter(g=>g.born && (CAREER_START_YEAR-g.born)<FIELD_RETIRE_AGE).map(g=>Object.assign({},g));
  active.forEach(g=>{ applyCareerRoll(g,rng); stampLiving(g,CAREER_START_YEAR); });   // roll each developing player's universe potential

function advanceWorld(w){ if(!w) return;

function ensureWorld(){ if(S.daily) return null;
  if(!S.world){ if(S.careerSeed==null) S.careerSeed=(Math.floor(Math.random()*4294967295))>>>0; S.world=seedWorld(S.careerSeed); }
  return S.world; }
function worldField(n){ const w=ensureWorld(); if(!w) return null;

/* ---- Official World Golf Ranking (OWGR) ----
   A rolling, decaying, results-based world ranking. Every player carries `rankPts`: world players
   in S.world.rankPts (persisted with the world), YOU in S.career.rankPts. Seeded from skill so the
   very first season already has a sensible pecking order, then each season decays the prior total and
   adds the Tour points earned that year (≈ a two-year rolling window). World Rank = sort everyone
   (the active world + you) by rankPts. Drives the marquee "World #N" stat and (deploy 2) elite-event
   entry: signature events invite the top OWGR, majors the top OWGR + reigning major champions. */
const OWGR_DECAY=0.55;                                  // last year keeps 55% weight (≈ a 2-yr window)
const OWGR_FLOOR=0.4;                                   // ratings never decay below 40% of the skill seed
function owgrSeed(lov){ return Math.max(0,(lov-52))*120; }   // skill-based starting points (≈ a season's Tour points)
function myOvrNow(){ try{ return Math.round(buildPlayer().skill); }catch(_){ return 70; } }
function hasBuild(){ return !S.daily && S.slots && CATS.some(c=>S.slots[c.k]); }
function myRankPts(){ return (S.career&&S.career.rankPts!=null)?S.career.rankPts:owgrSeed(myOvrNow()); }
// full ranking list best→worst: [{name,pts,lov,you}], defaulting any unseeded active player from skill
function worldRanking(){
  const w=ensureWorld(); if(!w) return [];
  const rp=(w.rankPts=w.rankPts||{});
  const list=w.active.map(g=>({name:g.name, pts:(rp[g.name]!=null?rp[g.name]:owgrSeed(g.lov)), lov:g.lov, you:false}));
  if(hasBuild()) list.push({name:S.name||'Your Golfer', pts:myRankPts(), lov:myOvrNow(), you:true});
  list.sort((a,b)=>b.pts-a.pts);
  return list;
}
function myWorldRank(){ const L=worldRanking(); const i=L.findIndex(x=>x.you); return i<0?L.length:i+1; }
function worldRankSize(){ return worldRanking().length; }
function worldRankOfName(name){ const L=worldRanking(); const i=L.findIndex(x=>x.name===name && !x.you); return i<0?L.length:i+1; }
// Tour Card line: finish inside the top CARD_LINE in the world to keep a full card for next season
const CARD_LINE=100;
function cardStatus(rank){ rank=rank||myWorldRank();
  if(rank<=CARD_LINE-15) return {key:'secure', rank, col:'#35d6a0', label:'Tour Card secured', note:`Comfortably inside the top ${CARD_LINE}`};
  if(rank<=CARD_LINE)     return {key:'bubble', rank, col:'#EBA61F', label:'Tour Card held · on the bubble', note:`Stay inside the top ${CARD_LINE} to keep your card`};
  return {key:'lost', rank, col:'#E14A33', label:'Lost your Tour Card', note:`Outside the top ${CARD_LINE} · limited status next season`};
}
// end-of-season ranking update: decay everyone, add the year's Tour points (run BEFORE advanceWorld ages the world)
function updateWorldRanking(){
  if(S.daily||!S.season) return; const w=ensureWorld(); if(!w) return;
  const rp=(w.rankPts=w.rankPts||{}), tot=S.season.totals, meName=S.season.me.name;
  const activeNames=new Set(w.active.map(g=>g.name)), lovOf={};
  Object.keys(rp).forEach(n=>{ if(!activeNames.has(n)) delete rp[n]; });   // drop players who've left the tour
  w.active.forEach(g=>{ lovOf[g.name]=g.lov; if(rp[g.name]==null) rp[g.name]=owgrSeed(g.lov); });   // seed new rookies from skill
  Object.keys(rp).forEach(n=>{ rp[n]*=OWGR_DECAY; });                          // decay the trailing window
  Object.entries(tot).forEach(([n,v])=>{ if(n===meName) return; if(rp[n]!=null) rp[n]+=(v.points||0); });

  Object.keys(rp).forEach(n=>{ const fl=owgrSeed(lovOf[n]!=null?lovOf[n]:60)*OWGR_FLOOR; if(rp[n]<fl) rp[n]=fl; });
  if(S.career){ const earned=((tot[meName]&&tot[meName].points)||0);

}
/* ---- Ranking-gated entry ----

const OPPO_NAMES=['Barracuda Championship','Barbasol Championship','Puerto Rico Open','ISCO Championship','Myrtle Beach Classic','Corales Puntacana Championship'];
function makeOppoEvt(evt){ return {name:OPPO_NAMES[(evt.wk||0)%OPPO_NAMES.length], purse:4*1e6, type:'reg', wk:evt.wk, major:false, big:false, oppo:true, against:evt.name}; }

function playerExempt(evt){ const yr=S.year||1, wl=(S.career&&S.career.winsList)||[];

/* ---- Olympic Games: every 4 years, a 60-player no-cut field chosen by OWGR with a max of 4 per country,

function olympicField(){

function olympicPlayers(me){

/* ---- Season awards: Player of the Year, Rookie of the Year, money title, scoring title, year-end World #1.

function computeAwards(){

function simTeamEvent(opts){

/* ---- YOUR golfer's bounded career (30-year shelf life). Decline is AGE- and FORM-based, not a
   flat year cutoff: a rookie starts ~22 and peaks through year 14 (age 35) with NO decline; only
   after does regression begin, LATER if you keep performing ("play young"), SOONER if you slump -
   and it keeps compounding deeper into the career instead of leveling off (max ramp lands right
   around year 29, so nothing plateaus early). Power (distance) fades first, touch/experience last.
   The FIELD ages by its own real age. ---- */

function playerAge(){ return START_AGE + ((S.year||1)-1); }
// how the season just finished went vs the field: -1 (poor) .. +1 (dominant). Wins/majors keep you sharp.
function seasonForm(s){ if(!s) return 0; const N=FIELDSIZE||120;
  const rank=s.rank||Math.round(N*0.6), rankScore=1-(rank-1)/Math.max(1,N-1);
  return clamp((rankScore-0.5)/0.5 + (s.wins||0)*0.25 + (s.majors||0)*0.35, -1, 1); }

// stay sharp a few years longer; a slump ages you faster). Capped at +3 so even a dominant career
// can't push regression off indefinitely, it starts around year 15 and only shifts by a few years
// either way. Bank is persisted on the career.
function effAge(){ return playerAge() - ((S.career&&S.career.primeBank)||0); }
function pastPeak(){ return effAge() > PEAK_END_AGE; }
function applyPlayerDecline(){   // once per off-season; scaled by how far past your peak you are

  c.primeBank=clamp((c.primeBank||0)+seasonForm(last), -2, 3);   // win → defy age; slump → age faster

/* Imbalance-aware OVERALL, for DISPLAY + matchmaking only. The sim itself reads raw per-skill values
   (eventOverall), so a player's actual finishes are unchanged. The OVR is your WEIGHTED MEAN, minus a
   penalty that ONLY bites for genuinely lopsided "cherry-picked" bags (cheap categories dumped to max the
   expensive ones). A `dd` deadband lets a normal strong build, even one with a heavier-weighted stat a few
   points lower, read at its true average; only sizeable downside spread (the exploit) gets docked. No
   elite "stretch": a build never reads above its own weighted average, so the number stays intuitive. */
const OVR_IMBALANCE_K=1.37, OVR_DEADBAND=2.2;
function ovrFromSkills(sk){
  const vals=CATS.map(c=>(sk[c.k]!=null?sk[c.k]:REPLACEMENT));
  const wmean=CATS.reduce((s,c,i)=>s+vals[i]*c.w,0);                 // weighted mean
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const below=vals.filter(v=>v<mean).map(v=>mean-v);                 // downside deviation, weak links
  const dd=below.length?Math.sqrt(below.reduce((a,b)=>a+b*b,0)/vals.length):0;
  const o=wmean - OVR_IMBALANCE_K*Math.max(0, dd-OVR_DEADBAND);      // only cherry-picked spread is penalised
  return Math.max(40, Math.min(99, o)); }

    if(mean>=84) return {name:'The Complete Player', desc:'No weakness in the bag'};
    return {name:'The Journeyman', desc:'Steady across the board, no real holes'};
  }
  const sorted=vals.slice().sort((a,b)=>b.v-a.v);
  const top1=sorted[0], top2=sorted[1];
  if(top1.v-top2.v<=6){
    const pair=ARCH_PAIR[pairKey(top1.k,top2.k)];
    if(pair) return {name:pair[0], desc:pair[1]};
  }
  const a=ARCH[top1.k]; return {name:a[0], desc:a[1]};
}
// scouting report in golf-analytics terms, varies by the build's actual strength/weakness + ratings
const SK_AREA={dist:'driving distance',acc:'driving accuracy',app:'approach play',sht:'short game',scr:'scrambling',bnk:'bunker play',put:'putting',clu:'composure'};
const SK_GAIN={
  dist:'you overpower the par 5s with serious Strokes Gained off the tee',
  acc:'you find fairway after fairway and attack from the short grass',
  app:'you stuff irons tight for elite Strokes Gained: approach',
  sht:'you get up-and-down from anywhere like a wizard around the greens',
  scr:'you scramble at a tour-leading rate, turning misses into pars',
  bnk:'you post a sand-save percentage rivals would envy',
  put:'you roll in everything inside 15 feet for top-tier Strokes Gained: putting',
  clu:"you're a stone-cold closer when the pressure peaks" };
const SK_LEAK={
  dist:'you leave long irons in where rivals are flipping wedges',
  acc:'you spray it off the tee and bleed strokes from the rough and trees',
  app:'you miss too many greens for negative Strokes Gained: approach',
  sht:'you turn greenside misses into dropped shots',
  scr:'you turn too many missed greens into missed pars',
  bnk:'you let bunkers become genuine hazards',
  put:'you leave makeable putts on the lip as your Strokes Gained: putting runs cold',
  clu:'you give shots back down the stretch' };
function scoutingNote(p){
  let best={v:-1},worst={v:200};
  CATS.forEach(cat=>{const v=p[cat.k]; if(v>best.v)best={v,k:cat.k,c:cat.short}; if(v<worst.v)worst={v,k:cat.k,c:cat.short};});
  const holes=CATS.filter(c=>!S.slots[c.k]).length;
  const strQ = best.v>=90?'World-class':best.v>=85?'Elite':best.v>=80?'Strong':'Your steadiest gear is your';
  const wkQ  = worst.v<65?'A glaring hole in your':worst.v<74?'A real soft spot in your':worst.v<82?'A slight dip in your':'Only a minor wobble in your';
  const strC = best.v>=80 ? SK_GAIN[best.k] : 'it sits around tour average, your most reliable club';
  const wkC  = worst.v>=82 ? 'still comfortably tour-level, just the one club not quite elite' : SK_LEAK[worst.k];
  let note=`<b style="color:var(--oncard)">Strength · ${best.c} (${best.v})</b>: ${strQ} ${SK_AREA[best.k]}: ${strC}. `
         +`<b style="color:var(--oncard)">Weakness · ${worst.c} (${worst.v})</b>: ${wkQ} ${SK_AREA[worst.k]}: ${wkC}.`;
  if(holes) note+=` ${holes} slot${holes>1?'s':''} unfilled, and those play as a tour journeyman.`;
  let read;
  if(worst.v>=85) read='Your game is remarkably complete: no number for the field to attack.';
  else if(best.v-worst.v>=20) read='A boom-or-bust profile: you can go very low when the course rewards that strength, but the soft spot bites when it doesn’t.';
  else if(worst.v<68) read='That weakness will leak real strokes against a field of complete players, so fit your schedule to the courses that hide it.';
  else if(worst.v<78) read='Solid across the board, but that weak link keeps you a notch below the pure ball-strikers.';
  else read='A well-rounded game without one standout gear: steady more than spectacular.';
  return note+` ${read}`;
}

let _lastView=null;
let _rendering=false;
function render(){
  // Re-entrancy guard: some async loaders (lbLoad/crLoad/dbLoad) call render() to refresh, and when
  // Supabase isn't available they do so SYNCHRONOUSLY from inside a screen fn, which would re-enter
  // render() mid-build, wipe #app, and leave the original call appending a second copy. Defer instead.
  if(_rendering){ setTimeout(render,0); return; }
  _rendering=true;
  try{
  const savedY=window.scrollY;
  const prevOv=app.querySelector('.ov'); const savedOvY=prevOv?prevOv.scrollTop:0;   // keep overlay scroll across async re-renders
  if(S.screen!=='dailyround') clearDailyTimer();   // stop daily auto-advance if we left the round
  const view=S.screen+'|'+(S.overlay||'')+'|'+(S.recapEvent==null?'':S.recapEvent)+'|'+(S.recapYear==null?'':S.recapYear);
  const sameView=(view===_lastView);
  app.innerHTML='';
  app.appendChild(header());
  const card=$(`<main class="card"></main>`);
  const screen=$(`<div class="screen${['title','draft','season','setup','offseason','build','summary','dailyintro','dailyprev','dailyround','dailyresult','rules'].includes(S.screen)?' wide':''}"></div>`);
  card.appendChild(screen);
  app.appendChild(card);
  app.appendChild(footer());
  // returning from a Google redirect, the token exchange + profile fetch take a few network
  // round-trips. Show a visible "finishing" pill so the wait reads as in-progress instead of
  // "sign-in is broken" (otherwise the confirmation can land mid-sim and feel like a bug).
  if(S.authPending){
    app.appendChild($(`<div style="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:30;background:#0a1626;color:var(--oncard);border:1px solid var(--gold);border-radius:10px;padding:11px 16px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;align-items:center;gap:9px"><span class="authspin"></span>Finishing Google sign-in…</div>`));
  }
  RT=screen;
  // overlays attach to #app (top level), NOT the screen, the screen lives inside .card
  // (z-index:1) which sits BELOW .head (z-index:2), so an overlay nested there would render
  // under the header. At app level its z-index:40 covers the whole page cleanly.
  // Wrapped the same way as the screen dispatch below: an overlay fn throwing (e.g. opening the
  // Trophy Room) used to leave NOTHING visible and no error anywhere, since this ran before that
  // catch existed at all, closing the broken overlay + surfacing the real error message here
  // instead turns a silent blank page into something the player (and we) can actually act on.
  try{
    if(S.overlay==='record') overlayRecord(app);
    if(S.overlay==='account') overlayAccount(app);
    if(S.overlay==='leaderboard') overlayLeaderboard(app);
    if(S.overlay==='dailydone') overlayDailyDone(app);
    if(S.overlay==='courserecords') overlayCourseRecords(app);
    if(S.overlay==='confirmReset') overlayConfirmReset(app);
    if(S.overlay==='about') overlayAbout(app);
    if(S.overlay==='privacy') overlayPrivacy(app);
    if(S.overlay==='terms') overlayTerms(app);
    if(S.overlay==='menu') overlayMenu(app);
  }catch(err){
    console.error('[RunTheTour] overlay render failed:', S.overlay, err);
    try{ track('screen_render_error',{overlay:S.overlay,message:(err&&err.message)||String(err)}); }catch(e){}
    const broken=S.overlay; S.overlay=null;
    const stray=app.querySelector('.ov'); if(stray) stray.remove();
    app.appendChild($(`<div style="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:45;max-width:90vw;background:#0a1626;color:var(--oncard);border:1px solid #E14A33;border-radius:10px;padding:11px 16px;box-shadow:0 8px 24px rgba(0,0,0,.4)">
      <b style="color:#E14A33">That popped up broke, closed it.</b>
      <div class="small muted" style="margin-top:3px;word-break:break-word">${esc(broken)}: ${esc((err&&err.message)||String(err))}</div></div>`));
  }
  // A screen fn throwing used to leave the header/footer up but the middle of the page totally
  // blank with no error shown anywhere, this catch turns that into a recoverable "Back to Title"
  // card instead (showing the real error message so a recurrence is diagnosable straight from a
  // screenshot, not just from analytics we might never see).
  try{
    ({title:scrTitle,setup:scrSetup,draft:scrDraft,build:scrBuild,offseason:scrOffseason,season:scrSeason,summary:scrSummary,recap:scrRecap,careerend:scrCareerEnd,circuitend:scrCircuitEnd,rules:scrRules,dailyintro:scrDailyIntro,dailyprev:scrDailyPreview,dailyround:scrDailyRound,dailyresult:scrDailyResult})[S.screen]();
  }catch(err){
    console.error('[RunTheTour] screen render failed:', S.screen, err);
    try{ track('screen_render_error',{screen:S.screen,message:(err&&err.message)||String(err)}); }catch(e){}
    screen.innerHTML='';
    const fb=$(`<div class="center" style="padding:40px 16px">
      <span class="tag" style="color:#E14A33;border-color:#E14A33">Something went wrong</span>
      <p class="lede center" style="margin:14px 0 18px">This screen hit a snag loading. Your saved progress is untouched, try heading back to the title screen.</p>
      <p class="small muted center" style="margin:0 0 18px;word-break:break-word">${esc(S.screen)}: ${esc((err&&err.message)||String(err))}</p>
      <button class="btn goldfill" id="rerr-home">Back to Title</button></div>`);
    const hb=fb.querySelector('#rerr-home'); hb.onclick=()=>{ S.overlay=null; S.screen='title'; render(); };
    screen.appendChild(fb);
  }
  paintAvatars();   // recolor any avatar canvases just added to the DOM
  saveResume();   // snapshot in-progress free-play golfer so a refresh can resume
  _lastView=view;
  // lock the page behind an open overlay so background scroll can't bleed through / fight the overlay
  document.body.classList.toggle('ovopen', !!S.overlay);
  // keep your place when re-rendering the same view (e.g. picking customization swatches, async
  // leaderboard loads); only jump to top when the view actually changes.
  const nowOv=app.querySelector('.ov');
  if(nowOv && sameView) nowOv.scrollTop=savedOvY;   // restore the overlay's own scroll position
  window.scrollTo({top: sameView ? savedY : 0});
  } finally { _rendering=false; }
}

        : `<div class="small muted center" style="padding:18px 8px">Play a season to bank career earnings.</div>`;

function overlayConfirmReset(screen){
  // Reset used to only clear the in-progress DRAFT (bag_resume), never the actual saved career
  // franchise (bag_careersave), so confirming it still left "Resume Career Mode" sitting right there
  // on the title screen afterward, looking like the button hadn't done anything. It now genuinely
  // retires whatever golfer/career is active, same as reaching the end of a career normally would.
  const hasActive=!!(careerSaveInfo()||resumeInfo());
  const title=hasActive?'Retire your golfer & start over?':'Start over?';
  const body=hasActive
    ? `This retires your current golfer and career in progress, once you start over there's no way back to them. Your lifetime stats, achievements, and Hall of Fame are always safe, they carry over untouched.`
    : `This starts you fresh from the title screen. Your lifetime stats, achievements, and Hall of Fame are always safe, they carry over untouched.`;
  const btnLabel=hasActive?'Retire & Start New Career':'Start Fresh';
  const ov=$(`<div class="ov" role="dialog" aria-modal="true">
    <button class="btn ghost x" style="width:auto;padding:8px 12px;font-size:14px">Close ✕</button>
    <h3>${title}</h3>
    <p class="lede">${body}</p>
    <button class="btn red">${btnLabel}</button>
    <button class="btn ghost cancel" style="margin-top:10px">Cancel</button></div>`);
  ov.querySelector('.x').onclick=()=>{S.overlay=null;render();};
  ov.querySelector('.cancel').onclick=()=>{S.overlay=null;render();};
  ov.querySelector('.red').onclick=()=>{
    clearCareerSave();   // retires the saved franchise so "Resume Career Mode" can never reappear
    clearResume();       // drops any in-progress (never-saved) draft golfer too
    reset();             // fresh S, also lands on the title screen
    render();
  };
  screen.appendChild(ov);
}

/* ---------- avatar (layered canvas recolor) ---------- */
// Two high-quality painted base portraits (male + female) are recolored live on a
// <canvas>: skin / hair / shirt / cap pixels are re-tinted from the player's
// choices (the exact wheel-swatch colors) while preserving the painted shading.
// The cap matches the shirt colour. No per-combo PNGs. Base art:
// public/avatars/golfers/base/{male,female}-base.png (relative → dev + /golf).
// Result is cached per look combo.
const AV_BASE={ male:'public/avatars/golfers/base/male-base.png', female:'public/avatars/golfers/base/female-base.png' };
const _avImg=new Map();      // src -> {img, ready, failed}
const _avRender=new Map();   // look-key -> recolored 512 offscreen canvas

}
function avHexRgb(h){h=h.replace('#','');return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}

  // l floor keeps the background out (it was bleeding purple behind the hat before).
  const cap=ny>0.08&&ny<0.34&&nx>0.27&&nx<0.73&&avInHue(h,150,196)&&s>0.30&&l>0.31&&l<0.92;

  // temples, sideburns) are hair. This stops the hairline being painted skin-tone.

// Keep them a fixed natural brow. Brow/eye band = mid-face, away from the temples/sideburns.

    wrap.appendChild(sw);
  });
  row.appendChild(wrap); return row;
}

function radarSVG(){

    grid+=`<polygon points="${CATS.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="rgba(244,227,201,.10)" stroke-width="1"/>`;
  });
  let axes='', labels='';
  CATS.forEach((c,i)=>{
    const [x,y]=pt(i,R);
    axes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(244,227,201,.08)"/>`;
    const [lx,ly]=pt(i,R+15);

  });

  const data=vals.map((v,i)=>pt(i,R*(v/100)).map(x=>x.toFixed(1)).join(',')).join(' ');

  // the shape grows in as you draft, faint when empty, solid once filled
  const nFilled=filled.filter(Boolean).length;

  return `<svg class="radar" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
    ${grid}${axes}
    <polygon points="${base}" fill="none" stroke="rgba(159,176,189,.45)" stroke-dasharray="3 3" stroke-width="1"/>
    <polygon points="${data}" fill="rgba(6,162,145,${fillOp})" stroke="#06A291" stroke-width="2" stroke-opacity="${(0.45+0.55*(nFilled/CATS.length)).toFixed(2)}"/>

}

  let alive=contenders.slice(), hole=0; const log=[];
  while(alive.length>1 && hole<25){
    hole++;
    alive.forEach(o=>{ o._ph=playoffHole(o.eo,o.p.clu,major); });
    const best=Math.min(...alive.map(o=>o._ph));
    const low=alive.filter(o=>o._ph<=best+1e-9);
    const advancing=(low.length<alive.length)?low:alive;
    // record the hole (for a watchable reveal when YOU are in the playoff)
    log.push({hole, scores:alive.map(o=>({name:o.p.name, you:!!o.p.you, label:poLabel(o._ph), advances:advancing.indexOf(o)>=0}))});
    if(low.length<alive.length) alive=low;   // separation → the rest are eliminated
  }

}
// assign finishing positions with TIES: players on the same FINAL SCORE (the rounded to-par
// figure the player actually sees) share the position number and split the combined prize
// money of the slots they occupy (e.g. a 2-way T3 each get (3rd+4th money)/2). The sim uses
// continuous strokes, so ties are decided on the displayed integer score, not the raw float.
// `list` must already be sorted ascending by total. `soloFirst` = a playoff already decided
// 1st, so list[0] takes 1st outright and grouping starts from 2nd.
function assignTies(list,soloFirst){
  let i=0;
  if(soloFirst && list.length){ list[0].pos=1; list[0].tied=false; list[0].pct=(PAYOUT[0]||0); i=1; }
  while(i<list.length){
    const s=Math.round(list[i].total);
    let j=i; while(j+1<list.length && Math.round(list[j+1].total)===s) j++;
    const n=j-i+1; let pctSum=0; for(let k=i;k<=j;k++) pctSum+=(PAYOUT[k]||0);
    const each=pctSum/n;
    for(let k=i;k<=j;k++){ list[k].pos=i+1; list[k].tied=n>1; list[k].pct=each; }
    i=j+1;
  }
}
function finalizeEvent(){

    const lead=made.filter(o=>Math.round(o.total)===leadScore);
    if(lead.length>1){
      const po=simPlayoff(lead,evt.major);
      made.splice(made.indexOf(po.winner),1); made.unshift(po.winner);   // winner takes 1st outright
      solo=true;

        you:lead.some(o=>o.p.you), youWon:!!po.winner.p.you, log:po.log};
    }

  assignTies(made,solo);

  order.forEach(o=>{o.money=evt.purse*o.pct; o.points=typeof o.pos==='number'?Math.round(basePts*(o.pct/0.18)):0;
    o.score=Math.round(o.total); o.r1=o.rounds[0];o.r2=o.rounds[1];o.r3=o.rounds[2];o.r4=o.rounds[3];});

    const rr=o.rounds.filter(r=>r!=null); t.toPar=(t.toPar||0)+rr.reduce((a,b)=>a+b,0); t.rounds=(t.rounds||0)+rr.length;
    if(o.pos===1){t.wins++; if(evt.major)t.majors++;}

      if(you.pos===1){
        if(/Tour Championship|Finale/i.test(evt.name)||evt.type==='finale') ev.set.wonFinale=1;
        if(/Players/i.test(evt.name)) ev.set.wonPlayers=1;

}
function liveOrder(ce){   // current standings mid-event; assigns _pos / _tied (tie-aware)

  const tag=list=>{ let i=0; while(i<list.length){ const s=Math.round(list[i].total); let j=i;
    while(j+1<list.length && Math.round(list[j+1].total)===s) j++;
    for(let k=i;k<=j;k++){ list[k]._pos=i+1; list[k]._tied=j>i; } i=j+1; } };
  if(ce.roundsDone<2){ tag(sorted); return sorted; }

function confettiRun(canvas, opts){
  const ctx=canvas.getContext('2d'); let W=canvas.clientWidth||window.innerWidth, H=canvas.clientHeight||window.innerHeight;
  const dpr=Math.min(2,window.devicePixelRatio||1); canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=opts.colors, P=[];

    P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:0.12+Math.random()*0.06,rot:Math.random()*6.28,vr:(Math.random()-.5)*0.34,
      w:5+Math.random()*6,h:7+Math.random()*8,col:cols[Math.floor(Math.random()*cols.length)],life:0,max:80+Math.random()*70}); };
  if(opts.mode==='cannons'){ const n=opts.count/2; for(let i=0;i<n;i++){ add(6,H+4,-Math.PI*0.42,15+Math.random()*7); add(W-6,H+4,-Math.PI*0.58,15+Math.random()*7); } }
  else { const cx=W/2, cy=H*0.34; for(let i=0;i<opts.count;i++) add(cx,cy,-Math.PI/2+(Math.random()-.5)*Math.PI*1.5,6+Math.random()*10); }
  let raf, stopped=false, t=0;
  (function frame(){ t++; ctx.clearRect(0,0,W,H);
    for(let i=P.length-1;i>=0;i--){ const p=P[i]; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=0.99; p.rot+=p.vr; p.life++;
      const al=p.life>p.max?Math.max(0,1-(p.life-p.max)/30):1;
      if(p.y>H+24||al<=0){ P.splice(i,1); continue; }
      ctx.save(); ctx.globalAlpha=al; ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.col; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); }
    if(!stopped && (P.length||t<8)) raf=requestAnimationFrame(frame);
  })();
  return ()=>{ stopped=true; cancelAnimationFrame(raf); };
}

function celebrateWin(evt, o, opts){
  opts=opts||{}; const major=!!evt.major, reduce=!!opts.reduce, me=S.season.me;
  const theme=major?majorTheme(evt.name):{accent:'#EBA61F', svg:winTrophySVG, label:'Tournament Won'};
  const win=document.createElement('div'); win.className='celebrate'+(major?' major':'');
  if(major) win.appendChild($(`<div class="spot"></div>`));
  const cv=document.createElement('canvas'); cv.className='confetti'; win.appendChild(cv);
  win.appendChild($(`<div class="celeb-trophy">${theme.svg()}</div>`));
  win.appendChild($(`<div class="celeb-kicker">${esc(major?theme.label:'Tournament Won')}</div>`));
  win.appendChild($(`<div class="celeb-title">${major?'Major Champion':'Champion'}</div>`));
  win.appendChild($(`<div class="celeb-sub">${esc(me.name)} · ${esc(evt.name)}${o&&o.score!=null?` · ${par(o.score)}`:''}</div>`));
  const cheque=$(`<div class="celeb-cheque">+$0</div>`); win.appendChild(cheque);
  if(major){ const cm=Math.max(1,((S.career&&S.career.majors)||0)+((S.season.totals[me.name]&&S.season.totals[me.name].majors)||0));
    win.appendChild($(`<div class="celeb-tally">${ord(cm)} career major</div>`)); }
  // Auto Sim on → no buttons, the celebration just plays and advances on its own (incl. majors).
  // Manual → Continue (+ Share on majors) and wait for the tap so the Share button stays reachable.
  const autoAdv=!!opts.auto;
  let done=false, celebTimer=null;
  function finish(){ if(done)return; done=true; if(celebTimer){clearTimeout(celebTimer);celebTimer=null;} if(_celebStop){_celebStop();_celebStop=null;} win.remove(); advanceEvent(); render(); }
  // Manual mode (Auto Sim off) → the player paces it: majors show Continue (+ Share) and wait for the tap.
  if(!autoAdv){
    const actions=$(`<div class="celeb-actions"></div>`);
    const cont=$(`<button class="btn goldfill">Continue ▸</button>`); cont.onclick=e=>{ e.stopPropagation(); finish(); }; actions.appendChild(cont);
    if(major){ const sh=$(`<button class="btn gold">↗ Share win</button>`); sh.onclick=e=>{ e.stopPropagation(); if(celebTimer){clearTimeout(celebTimer);celebTimer=null;} shareMajorWin(evt,o); }; actions.appendChild(sh); }
    win.appendChild(actions);
  }
  document.body.appendChild(win);
  try{ if(major && !reduce && navigator.vibrate) navigator.vibrate([0,35,40,55]); }catch(_){}
  track(major?'major_won':'tournament_won',{event:evt.name});
  const target=(o&&o.money)||0;
  if(reduce){ cheque.textContent='+'+fmt(target); }
  else { const dur=820,t0=performance.now(); (function cu(now){ const k=Math.min(1,(now-t0)/dur);
    cheque.textContent='+'+fmt(Math.round(target*(1-Math.pow(1-k,3)))); if(k<1) requestAnimationFrame(cu); })(t0); }
  if(major && !reduce){ const colors=['#EBA61F','#f9d271','#ffffff',theme.accent];   // confetti = majors only
    _celebStop=confettiRun(cv,{count:170, colors, mode:'cannons'}); }
  win.onclick=finish;   // tap anywhere advances (skip)
  // Auto Sim ON → hands-off, auto-advance (majors a touch longer). Auto Sim OFF → the player is pacing it
  // themselves: a regular win still ticks on after 2s, but a MAJOR waits for them to Continue (and Share).
  if(autoAdv) celebTimer=setTimeout(finish, major?2600:2000);
  else if(!major) celebTimer=setTimeout(finish, 2000);
}

    {o:top3[1], emoji:'🥈', col:'#cbd2da', glow:'rgba(203,210,218,.45)', h:114, lab:'SILVER', nm:'Silver'},

  const colEls={};
  [M[1],M[0],M[2]].forEach(m=>{   // display order: silver, gold, bronze
    const o=m.o, you=o.p.you;
    const col=$(`<div style="flex:0 0 auto;width:31%;max-width:168px;opacity:.16;transition:opacity .5s"></div>`);
    col.innerHTML=`

        ${you?'<div style="font-size:10px;letter-spacing:.16em;color:#ffd76a;font-weight:800;margin-top:1px">★ YOU</div>':''}
        <div class="small" style="color:#cfe6d8;margin-top:2px">${par(o.score)}</div>
      </div>
      <div style="height:${m.h}px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,${m.col},rgba(0,0,0,.32));display:flex;align-items:flex-start;justify-content:center;padding-top:7px;box-shadow:0 0 22px ${m.glow}">
        <span style="font-family:var(--display);font-size:30px;color:rgba(0,0,0,.5);font-weight:800">${M.indexOf(m)+1}</span>
      </div>`;
    col.innerHTML=emojifyIcons(col.innerHTML); podium.appendChild(col); colEls[m.lab]=col;
  });
  wrap.appendChild(podium);
  const actions=$(`<div class="celeb-actions" style="margin-top:20px"></div>`); wrap.appendChild(actions);
  stage.appendChild(wrap); document.body.appendChild(stage);

  let done=false, timer=null, i=0; const seq=[M[2],M[1],M[0]];   // reveal bronze → silver → gold
  function finish(){ if(done)return; done=true; if(timer)clearTimeout(timer); if(_celebStop){_celebStop();_celebStop=null;} stage.remove(); advanceEvent(); render(); }
  function reveal(m,isGold){
    const col=colEls[m.lab]; col.style.opacity='1';
    const card=col.querySelector('.pod-card'); card.style.opacity='1'; card.style.transform='translateY(0)';
    sub.innerHTML = emojifyIcons(m.o.p.you ? `<span style="color:#ffd76a;font-weight:800">${m.emoji} You take ${m.nm} for ${myCountry}!</span>`
      : `${m.emoji} ${m.nm}: ${esc(m.o.p.name)}`);
    if(isGold && !reduce){ _celebStop=confettiRun(cv,{count:170, colors:['#f4cf5b','#ffffff','#ffd76a','#cbd2da'], mode:'cannons'}); }
    try{ if(m.o.p.you && !reduce && navigator.vibrate) navigator.vibrate(40); }catch(_){}
  }
  function endCeremony(){
    sub.innerHTML = emojifyIcons(youMedal>=0
      ? `<span style="color:#ffd76a;font-weight:800">${['🥇 GOLD MEDAL','🥈 SILVER MEDAL','🥉 BRONZE MEDAL'][youMedal]} for ${myCountry}</span>`
      : `<span style="color:#cfe6d8">🥇 ${esc(M[0].o.p.name)} wins gold for ${esc(M[0].o.p.country||M[0].o.p.nation||'')}</span>`);
    if(auto||reduce){ timer=setTimeout(finish, reduce?20:2400); }
    else { const b=$(`<button class="btn goldfill">Continue ▸</button>`); b.onclick=e=>{e.stopPropagation();finish();}; actions.appendChild(b); }
  }
  function step(){ if(i>=seq.length){ endCeremony(); return; } reveal(seq[i], i===seq.length-1); i++; timer=setTimeout(step, reduce?20:1350); }
  stage.onclick=()=>{ if(i<seq.length){ if(timer)clearTimeout(timer); while(i<seq.length){ reveal(seq[i], i===seq.length-1); i++; } endCeremony(); } else finish(); };

// where the player sits on the season points list (1 = leader)
function pointsRank(name){
  return Object.entries(S.season.totals).map(([n,v])=>({n,p:v.points})).sort((a,b)=>b.p-a.p).findIndex(r=>r.n===name)+1;
}

function selectionInfo(evt){
  const meName=S.season.me.name, country=esc((S.look&&S.look.country)||'your country');
  let tag, made, title, sub;
  if(evt.playoff){
    const rank=pointsRank(meName); made=rank<=evt.cap;
    tag=S.circuitMode?'Schwab Cup Playoffs':'FedEx Cup Playoffs';
    if(made){
      title = S.circuitMode
        ? (evt.stage===1?"You're in the Playoffs!" : evt.stage===2?'Through to Playoffs II!' : 'You made the Schwab Cup Championship!')
        : (evt.stage===1?"You're in the Playoffs!" : evt.stage===2?'Through to the BMW Championship!' : 'You made it to East Lake!');
      sub = `#${rank} in the ${S.circuitMode?'Schwab Cup':'FedEx Cup'} standings, inside the top ${evt.cap}. ${evt.stagger?`Just ${evt.cap} left, with a staggered start, this one is for the Cup itself.`:'Keep climbing, the field shrinks again next week.'}`;
    } else {
      title = evt.stage===1?'Just missed the Playoffs' : 'Your playoff run ends here';
      sub = `#${rank} in the standings, agonisingly outside the top ${evt.cap}. That is a season to be proud of, build on it and you will be deep in this hunt next year.`;
    }
  } else if(evt.guestMajor){
    tag='Past Champion'; made=true; title=`Welcome back to ${evt.name}`;
    const reason = evt.name==='The Masters' ? 'a lifetime past-champion invitation'
      : evt.name==='The Open' ? 'your past-champion exemption'
      : 'your 5-year past-champion exemption';
    sub = `You're off the Legend Circuit this week, ${reason} gets you back into the field against today's tour.`;
  } else { // olympics
    const sel=olympicField(); made=sel.some(s=>s.you); tag='Summer Games';
    title = made?'You qualified for the Summer Games!' : 'Not in the field this time';
    sub = made
      ? `You are one of the 60 teeing it up for ${country}. Go and win a medal for the nation.`
      : `Outside the 60-player field for ${country} this cycle (max 4 per country). Keep climbing the World Ranking and you will be on the plane in four years. You will play a Tour stop this week instead.`;
  }
  return {tag, made, title, sub};
}
