<!-- Build a Golfer (RunTheGreen) — solo season · v2 · RunThePitch skin -->
<title>Build a Golfer · RunThe.GG</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4E8D6; --peach:#F7DCCC;
    --ink:#0C1B2E; --inkmut:#6b6256;
    --teal:#0FA888; --gold:#EBA61F; --gold2:#c79320;
    --red:#E14A33; --red2:#b8371f;
    --cardA:#0d2740; --cardB:#0a1a2c;
    --board:rgba(255,255,255,.035); --oncard:#F4E3C9; --muted:#88a397;
    --line:rgba(244,227,201,.09);
    --panel:rgba(255,255,255,.045); --panelb:rgba(244,227,201,.10);
    --display:'Anton',Impact,'Arial Narrow',sans-serif;
    --serif:'Cinzel','Times New Roman',Georgia,serif;
    --body:'Barlow Semi Condensed',system-ui,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --hgreen:#16432f; --hgold:#b8902f;
    --pagebg:linear-gradient(180deg,#f6eed8,#f1e6cd);
    --pageink:#16432f; --pagemut:#6f6a55; --pill:#fbf6e9; --pillb:rgba(20,60,40,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0; overscroll-behavior-y:none}
  body{background:var(--pagebg); background-attachment:fixed; color:var(--pageink);
    font-family:var(--body); -webkit-font-smoothing:antialiased; min-height:100vh; line-height:1.4}
  #app{max-width:none; margin:0; padding:0 0 36px}

  /* ---- top bar + header (cream Masters-style band) ---- */
  .head{text-align:center; padding:10px 16px 12px; max-width:780px; margin:0 auto}
  .topbar{display:flex; justify-content:flex-start; align-items:center; margin:0 0 8px}
  .icobtn{width:38px;height:38px;border-radius:11px;background:var(--pill);border:1px solid var(--pillb);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--hgreen);font-size:18px;
    box-shadow:0 2px 6px rgba(20,60,40,.10)}
  .crestrow{display:flex; align-items:center; justify-content:center; gap:18px}
  .crest{width:64px;height:76px;display:block;flex:0 0 auto}
  .wmblock{min-width:0}
  .divider{display:flex; align-items:center; gap:12px; margin-bottom:9px}
  .divider .ln{flex:1; height:1.5px; background:linear-gradient(90deg,transparent,var(--hgold))}
  .divider .ln.r{background:linear-gradient(90deg,var(--hgold),transparent)}
  .divider .ball{width:22px;height:22px;flex:0 0 auto}
  .wordmark{font-family:var(--serif); font-weight:700; font-size:39px; line-height:.92;
    letter-spacing:.015em; text-transform:uppercase; white-space:nowrap}
  .wordmark .a{color:var(--hgreen)} .wordmark .b{color:var(--hgold)}
  .rule{height:4px; margin-top:9px; background:
    linear-gradient(var(--hgreen),var(--hgreen)) top/100% 1.5px no-repeat,
    linear-gradient(rgba(20,60,40,.38),rgba(20,60,40,.38)) bottom/100% 1px no-repeat}
  .pills{display:flex; gap:14px; justify-content:center; margin-top:16px}
  .pill{background:var(--pill); border:1px solid var(--pillb); border-radius:999px; padding:9px 22px;
    font-family:var(--serif); font-weight:600; font-size:15px; color:var(--hgreen); cursor:pointer;
    box-shadow:0 3px 10px rgba(20,60,40,.12); display:inline-flex; align-items:center; gap:9px}
  .pill svg{width:18px;height:18px;display:block}

  /* ---- the game panel: full-width deep green with a gold top edge ---- */
  .card{position:relative; width:100%; max-width:none; margin:0; border-radius:0; overflow:visible;
    background:linear-gradient(180deg,#0f3d2f,#0a2a20); box-shadow:0 -1px 0 rgba(20,60,40,.2)}
  .cardtop{display:block; height:4px; background:linear-gradient(90deg,#9a7726,var(--hgold),#9a7726)}
  .flagstrip{display:flex; gap:6px; padding:8px 10px; background:rgba(0,0,0,.22); overflow:hidden}
  .flagstrip.bot{border-top:1px solid var(--line)} .flagstrip.top{border-bottom:1px solid var(--line)}
  .ftrack{display:flex; gap:6px; animation:marq 26s linear infinite}
  .flagstrip.bot .ftrack{animation-direction:reverse; animation-duration:30s}
  .ftile{font-size:20px; line-height:1; width:34px; height:26px; border-radius:6px; background:#0a1626;
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex:0 0 auto}
  @keyframes marq{to{transform:translateX(-50%)}}
  .screen{max-width:600px; margin:0 auto; padding:18px 16px 22px; position:relative}
  .screen.wide{max-width:1140px}
  .cols{display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start}
  .col{min-width:0}
  .setup-cols{grid-template-columns:0.85fr 1fr; max-width:840px; margin:0 auto}
  @media(max-width:860px){ .cols{grid-template-columns:1fr; gap:16px} }

  h1{font-family:var(--display); font-style:normal; font-weight:400; color:var(--oncard);
    letter-spacing:.01em; line-height:.96; margin:6px 0; text-transform:uppercase; text-shadow:0 2px 18px rgba(0,0,0,.5)}
  h2{font-family:var(--body); font-weight:800; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:0 0 10px}
  p.lede{color:#d7e2ea; margin:0 0 16px}
  .center{text-align:center}
  .muted{color:var(--muted)} .small{font-size:12.5px}
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
  .tag{display:inline-block; font:800 10px/1 var(--body); letter-spacing:.18em; text-transform:uppercase;
    color:var(--teal); border:1px solid var(--line); padding:6px 9px; border-radius:999px}

  /* ---- buttons ---- */
  .btn{appearance:none; cursor:pointer; display:block; width:100%; text-align:center;
    font-family:var(--display); font-weight:400; letter-spacing:.03em; text-transform:uppercase;
    font-size:21px; border-radius:14px; padding:15px 16px; border:0; color:#fff;
    transition:transform .04s ease, filter .15s ease}
  .btn .sub{display:block; font-family:var(--body); font-weight:800; font-size:10.5px; letter-spacing:.12em; opacity:.9; margin-top:6px}
  .btn.red{background:linear-gradient(180deg,var(--red),var(--red2)); box-shadow:0 5px 0 #8f2c19}
  .btn.red:active{transform:translateY(3px); box-shadow:0 2px 0 #8f2c19}
  .btn.gold{background:#0a1626; color:var(--gold); border:2px solid var(--gold)}
  .btn.teal{background:var(--teal); color:#04211c; box-shadow:0 5px 0 #0a6b58}
  .btn.teal:active{transform:translateY(3px); box-shadow:0 2px 0 #0a6b58}
  .btn.ghost{background:transparent; color:var(--oncard); border:1px solid var(--line); font-size:18px}
  .btn:hover{filter:brightness(1.05)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn:focus-visible, button:focus-visible, [tabindex]:focus-visible, input:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  .mini{display:flex; gap:10px; margin-top:10px}
  .mini .btn{font-size:14px; padding:12px}
  .stack>*+*{margin-top:10px}

  /* ---- title scene ---- */
  .scene{position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none}
  .coursebg{position:absolute; inset:0; width:100%; height:100%; display:block}
  .sky{position:absolute; inset:0; background:linear-gradient(180deg,#0a2038 0%,#0b2742 40%,#0f3f30 58%,#0b3325 100%)}
  .glow{position:absolute; top:-14%; width:62%; height:60%;
    background:radial-gradient(closest-side, rgba(255,242,205,.18), transparent 70%); filter:blur(2px)}
  .glow.l{left:-14%} .glow.r{right:-14%}
  .green{position:absolute; left:50%; bottom:-6%; transform:translateX(-50%); width:160%; height:58%;
    background:radial-gradient(120% 92% at 50% 100%, #257a4f 0%, #14512f 55%, transparent 76%)}
  .ring{position:absolute; left:50%; bottom:2%; transform:translateX(-50%); border:1px solid rgba(255,255,255,.10); border-radius:50%}
  .titlewrap{position:relative; z-index:1; max-width:560px; margin:0 auto}
  .hero{font-family:var(--display); font-style:italic; line-height:.9; letter-spacing:.01em; margin:4px 0 2px; text-transform:none; text-shadow:0 3px 22px rgba(0,0,0,.55)}
  .hero .hr1{color:var(--oncard)} .hero .hr2{color:var(--teal)}
  .trophy{width:54px; height:72px; display:block; margin:2px auto 4px; filter:drop-shadow(0 6px 14px rgba(235,166,31,.4))}
  .scorechip{display:inline-flex; align-items:center; gap:14px; background:rgba(7,18,30,.82);
    border:1px solid var(--gold); border-radius:12px; padding:9px 16px; margin:6px auto 16px;
    font-family:var(--mono); font-weight:700; color:var(--oncard)}
  .scorechip b{color:var(--gold); font-size:18px}
  .scorechip .lab{font-family:var(--body); font-weight:800; letter-spacing:.12em; font-size:11px; color:var(--muted)}
  .rollchip{display:inline-block; min-width:230px; background:rgba(7,18,30,.82); border:1px solid var(--gold);
    border-radius:12px; padding:9px 18px; margin:6px auto 16px; text-align:center}
  .rolllab{font-family:var(--body); font-weight:800; letter-spacing:.16em; font-size:10px; text-transform:uppercase; color:var(--muted)}
  .rollval{font-family:var(--display); font-style:italic; font-size:22px; color:var(--gold); margin-top:4px;
    transition:opacity .18s ease; letter-spacing:.01em}
  .btn.goldfill{background:linear-gradient(180deg,#f4b840,var(--gold)); color:#1a1206; box-shadow:0 5px 0 #9a6e12}
  .btn.goldfill:active{transform:translateY(3px); box-shadow:0 2px 0 #9a6e12}

  /* ---- draft ---- */
  .draftbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
  .spins{font-family:var(--mono); font-weight:700}
  .pips{display:flex; gap:5px; margin-top:6px; flex-wrap:wrap}
  .pip{width:9px;height:9px;border-radius:999px;background:var(--line)} .pip.on{background:var(--gold)}
  .reel{height:84px; border-radius:16px; border:1px solid var(--panelb);
    background:radial-gradient(120% 120% at 50% 0%, rgba(255,255,255,.08), rgba(0,0,0,.12)); display:flex; align-items:center;
    justify-content:center; overflow:hidden; position:relative}
  .reel .name{font-family:var(--display); font-weight:400; font-size:27px; text-align:center; padding:0 10px; color:var(--oncard); text-transform:uppercase; letter-spacing:.02em}
  .reel .sub{position:absolute; bottom:7px; font:800 9px/1 var(--body); letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
  .reel .reeltag{position:absolute; top:6px; font:800 9px/1 var(--body); letter-spacing:.2em; color:var(--muted)}
  .reel.rar-rare{border-color:#4f9fd0} .reel.rar-rare .reeltag{color:#82c1e8}
  .reel.rar-epic{border-color:#a679e0; box-shadow:0 0 13px rgba(166,121,224,.28) inset} .reel.rar-epic .reeltag{color:#c7a6f2}
  .reel.rar-legendary{border-color:var(--gold); box-shadow:0 0 18px rgba(235,166,31,.40) inset, 0 0 14px rgba(235,166,31,.30);
    background:radial-gradient(120% 100% at 50% 0%, #2a2510, #0a1f30)}
  .reel.rar-legendary .reeltag{color:var(--gold)}
  .reel.landed{animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(.97)}55%{transform:scale(1.02)}100%{transform:scale(1)}}
  .spinning .name{animation:flick .08s steps(1) infinite} @keyframes flick{50%{opacity:.34}}
  .attrs{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:10px}
  .attr{display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:8px 11px; cursor:pointer; text-align:left;
    color:var(--oncard); font:inherit; width:100%}
  .attr .lab{font-weight:600; font-size:12px; color:#cfdbe6}
  .attr .val{font-family:var(--mono); font-weight:800; font-size:16px; color:var(--gold)}
  .attr:hover:not(:disabled){border-color:var(--gold)} .attr:disabled{opacity:.32; cursor:not-allowed}

  .buildhero{display:flex; align-items:center; gap:8px; background:var(--panel);
    border:1px solid var(--panelb); border-radius:16px; padding:11px 10px; margin-bottom:10px}
  .herofig{display:flex; flex-direction:column; align-items:center; gap:8px; flex:0 0 84px}
  .golferfig{width:70px; height:112px; display:block; filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
  .ovrbadge{display:flex; flex-direction:column; align-items:center; background:rgba(0,0,0,.28); border:2px solid var(--gold); border-radius:12px; padding:5px 0; width:74px}
  .ovrbadge .n{font-family:var(--mono); font-weight:800; font-size:28px; color:var(--gold); line-height:1; transition:color .2s}
  .ovrbadge .l{font:800 9px/1 var(--body); letter-spacing:.18em; color:var(--muted); margin-top:4px}
  .radarwrap{flex:1; min-width:0; display:flex; justify-content:center}
  .radar{width:100%; max-width:198px; height:auto; display:block}
  .radar text{font-family:var(--body)}
  .card-grid{display:grid; gap:6px; margin-top:10px}
  .slot{display:flex; align-items:center; gap:10px; background:var(--board); border:1px solid var(--line);
    border-radius:10px; padding:7px 11px}
  .slot .lab{flex:1; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:#bfe7df}
  .slot .who{font-size:11.5px; color:var(--oncard); opacity:.85}
  .slot .v{font-family:var(--mono); font-weight:800; font-size:15px; color:var(--gold); min-width:30px; text-align:right}
  .slot.empty .v, .slot.empty .lab{color:var(--muted)}

  .ovr{display:flex; align-items:baseline; gap:10px; justify-content:center; margin:4px 0}
  .ovr .num{font-family:var(--mono); font-weight:800; font-size:52px; color:var(--gold); line-height:1}
  .ovr .lbl{font:800 11px/1 var(--body); letter-spacing:.2em; text-transform:uppercase; color:var(--muted)}
  .scout{background:var(--panel); border:1px solid var(--panelb); border-radius:12px; padding:12px 14px; font-size:13px; color:#dfeae2; margin-top:12px}
  input.name{width:100%; background:#0a2740; border:1px solid var(--line); color:var(--oncard);
    font:800 16px/1 var(--body); border-radius:11px; padding:13px 14px; margin-top:6px}

  /* ---- leaderboard ---- */
  .evt-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:10px}
  .evt-head .nm{font-family:var(--display); font-weight:400; font-size:24px; text-transform:uppercase; color:var(--oncard); letter-spacing:.02em}
  .kx{font:800 10px/1.3 var(--body); letter-spacing:.14em; text-transform:uppercase}
  .major{color:var(--gold)} .sig{color:var(--teal)} .reg{color:var(--muted)}
  .board{background:var(--board); border:1px solid var(--line); border-radius:13px; overflow:hidden}
  .lb{display:grid; grid-template-columns:34px 1fr 56px 62px; gap:8px; align-items:center; padding:9px 12px; font-size:13px; border-top:1px solid rgba(244,227,201,.06)}
  .lb:first-child{border-top:0}
  .lb .pos{font-family:var(--mono); color:var(--muted); font-weight:700}
  .lb .pl{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--oncard)}
  .lb .sc{font-family:var(--mono); font-weight:800; text-align:right; color:var(--oncard)}
  .lb .mny{font-family:var(--mono); text-align:right; color:#bfe7df; font-size:12px}
  .lb.you{background:linear-gradient(90deg, rgba(235,166,31,.22), rgba(235,166,31,.05))}
  .lb.you .pl{color:var(--gold); font-weight:800}
  .lb.cut .sc{color:#e07a5f}
  .sep{height:1px; background:repeating-linear-gradient(90deg,var(--line),var(--line) 6px,transparent 6px,transparent 12px)}
  .runline{display:flex; justify-content:space-between; font-family:var(--mono); font-size:13px; padding:10px 2px 0; color:var(--oncard)}

  .sbar{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line);
    border:1px solid var(--line); border-radius:13px; overflow:hidden; margin-bottom:14px}
  .sstat{background:var(--panel); padding:10px 11px}
  .sstat.wide{grid-column:1 / -1; background:rgba(255,255,255,.06)}
  .sstat .k{font:800 9.5px/1 var(--body); letter-spacing:.13em; text-transform:uppercase; color:var(--muted)}
  .sstat .v{font-family:var(--mono); font-weight:800; font-size:18px; margin-top:5px; color:var(--oncard)}
  .sstat .v.gold{color:var(--gold); font-size:22px}
  .screen.major-screen{background:radial-gradient(130% 70% at 50% -8%, rgba(235,166,31,.20), transparent 62%)}
  .majorbanner{display:flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(90deg,#5a3d0b,var(--gold),#5a3d0b); color:#1a1206;
    font-family:var(--display); font-style:italic; font-size:17px; letter-spacing:.05em;
    padding:9px; border-radius:12px; margin-bottom:12px; text-transform:uppercase;
    box-shadow:0 0 18px rgba(235,166,31,.35)}
  .board.major{border-color:var(--gold); box-shadow:0 0 0 1px rgba(235,166,31,.4)}

  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0}
  .tile{background:var(--panel); border:1px solid var(--panelb); border-radius:12px; padding:12px 14px}
  .tile .k{font:800 10px/1 var(--body); letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
  .tile .v{font-family:var(--mono); font-weight:800; font-size:23px; margin-top:6px; color:var(--gold)}
  .tile .v.cream{color:var(--oncard)}
  .share{background:#0a2740; border:1px dashed var(--line); border-radius:11px; padding:12px 14px; font-family:var(--mono); font-size:12px; color:#d2e1ea; white-space:pre-wrap; margin-top:6px}

  /* ---- overlay (rules) ---- */
  .ov{position:absolute; inset:0; z-index:5; background:rgba(6,14,24,.93); padding:22px 18px; overflow:auto}
  .ov h3{font-family:var(--display); font-weight:400; font-size:26px; color:var(--gold); margin:6px 0 12px; text-transform:uppercase}
  .ov ol{margin:0 0 14px; padding-left:18px; color:#dbe6ee} .ov li{margin:7px 0}
  .ov .x{position:absolute; top:14px; right:14px}

  /* ---- footer ---- */
  .foot{max-width:438px; margin:18px auto 0; text-align:center}
  .footpills{display:flex; gap:10px; justify-content:center}
  .footnote{margin-top:14px; font-weight:700; color:var(--pagemut)} .footnote b{color:var(--teal)}
  .footlinks{margin-top:8px; color:var(--pagemut); font-size:13px}
  .footlinks span{margin:0 7px}

  @media (max-width:480px){ .wordmark{font-size:32px} .crest{width:52px;height:62px} .crestrow{gap:12px} }
  @media (max-width:380px){ .wordmark{font-size:27px} }
  @media (max-width:430px){ .attrs{grid-template-columns:1fr} h1{font-size:30px} }
  @media (prefers-reduced-motion:reduce){ .spinning .name{animation:none} .ftrack{animation:none} .btn,.attr{transition:none} }
</style>

<div id="app" aria-live="polite"></div>

<script>
const $=(h)=>{const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild;};
const app=document.getElementById('app');
/* block pull-to-refresh so a stray downward swipe can't reload & wipe an in-progress draft (CSS alone isn't enough on iOS) */
let _touchY=0;
document.addEventListener('touchstart',e=>{ if(e.touches.length===1) _touchY=e.touches[0].clientY; },{passive:true});
document.addEventListener('touchmove',e=>{
  const atTop=(window.scrollY||document.documentElement.scrollTop||0)<=0;
  if(atTop && e.touches[0].clientY>_touchY && e.cancelable) e.preventDefault();
},{passive:false});
let RT=app;
let rollTimer=null;
let seasonTimer=null;
const add=(el)=>RT.appendChild(el);
const fmt=(n)=>'$'+Math.round(n).toLocaleString('en-US');
const fmtSigned=(n)=>(n<0?'−':'')+'$'+Math.round(Math.abs(n)).toLocaleString('en-US');
const par=(s)=>s===0?'E':(s>0?'+'+s:''+s);
const ord=(n)=>{const v=n%100; if(v>=11&&v<=13)return n+'th'; return n+({1:'st',2:'nd',3:'rd'}[n%10]||'th');};

/* ---------- persistence / career ---------- */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function career(){return LS.get('bag_career',{builds:0,bestMoney:0,bestNet:null,bestOvr:0,wins:0,majors:0,hof:[],badges:{}});}
/* expenses: caddie 10% of winnings + ~$8k travel per event entered (tuning knob) */
const COSTS={caddiePct:0.10, travelPerEvent:8000};
function seasonNet(t){const gross=t.money, caddie=gross*COSTS.caddiePct, travel=t.played*COSTS.travelPerEvent, costs=caddie+travel; return {gross,caddie,travel,costs,net:gross-costs};}
/* local achievements — computed from a finished season */
const ACHS=[
  {id:'win',  e:'🏆', t:'First Win',        d:'Win any event',                     f:c=>c.wins>=1},
  {id:'major',e:'⛳', t:'Major Champion',    d:'Win a major championship',          f:c=>c.majorsWon>=1},
  {id:'slam', e:'👑', t:'Grand Slam',        d:'Win all 4 majors in one season',    f:c=>c.majorsWon>=4},

function recordSeason(o){
  const c=career(); c.badges=c.badges||{};
  c.builds++; c.wins+=o.wins; c.majors+=o.majorsWon;
  if(o.money>c.bestMoney)c.bestMoney=o.money;
  if(c.bestNet==null||o.net>c.bestNet)c.bestNet=o.net;
  if(o.ovr>c.bestOvr)c.bestOvr=o.ovr;
  c.hof.push({name:o.name,ovr:o.ovr,money:o.money,net:o.net,wins:o.wins,majors:o.majorsWon,best:o.best});
  c.hof.sort((a,b)=>b.net-a.net); c.hof=c.hof.slice(0,5);
  const earned=evalAchievements(o); const fresh=earned.filter(id=>!c.badges[id]);
  earned.forEach(id=>c.badges[id]=true);
  LS.set('bag_career',c); return {career:c,fresh};
}

/* ---------- seeded RNG (daily challenge) ---------- */
let RNG=Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seededShuffle(arr,seed){const r=mulberry32((seed^0x9e3779b9)>>>0);const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function todayKey(){const d=new Date();return d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate();}
function dailyState(){return LS.get('bag_daily',null);}
function dailyDoneToday(){const dd=dailyState();return !!(dd&&dd.date===todayKey()&&dd.done);}
function startDaily(){
  if(dailyDoneToday()){S.overlay='dailydone';render();return;}
  const seed=todayKey(); reset();
  S.daily=true; S.dailySeed=seed; S.mode='daily';
  S.drawRng=mulberry32((seed^0x2545f491)>>>0);   // seeded draw → same rarity sequence for everyone today
  S.screen='setup'; render();
}

   move to backend config when the server-authoritative draw is built) ---- */
const PULL_RATES=[['Legendary',0.05],['Epic',0.25],['Rare',0.35],['Common',0.35]]; // rarest first; sum 1.0
function buildPool(golfers){const p={Common:[],Rare:[],Epic:[],Legendary:[]}; golfers.forEach(g=>p[g.rarity].push(g)); return p;}
const RPOOL=buildPool(GOLFERS);
function rollBucket(rng){const r=rng(); let acc=0; for(const[b,p]of PULL_RATES){acc+=p; if(r<acc)return b;} return 'Common';}
function drawGolfer(rng,pool,revealed){
  for(let i=0;i<8;i++){const b=rollBucket(rng); const avail=pool[b].filter(g=>!revealed.has(g.name));
    if(avail.length){const g=avail[Math.floor(rng()*avail.length)]; revealed.add(g.name); return g;}}
  const all=Object.values(pool).flat().filter(g=>!revealed.has(g.name)); if(!all.length)return null;
  const g=all[Math.floor(rng()*all.length)]; revealed.add(g.name); return g;
}

/* ---------- sim ---------- */
function gauss(){let u=0,v=0;while(!u)u=RNG();while(!v)v=RNG();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function simRound(p,{major,finalRd}){
  let base=(74-p.skill)*0.225;
  if(major)base+=1.4;
  let std=clamp(2.4+(90-p.clu)*0.045,1.7,4.2);
  if(finalRd||major)std*=1.12;
  if(finalRd)base+=(88-p.clu)*0.045;
  return base+gauss()*std;
}
function simEvent(evt,field){
  const res=field.map(p=>{const r1=simRound(p,{major:evt.major}),r2=simRound(p,{major:evt.major});return {p,half:r1+r2,r1,r2};});
  res.sort((a,b)=>a.half-b.half);
  const cutN=Math.max(22,Math.round(field.length*0.5));   // ~top half make the weekend (scales with field)
  const cut=res[Math.min(cutN-1,res.length-1)].half;
  res.forEach(o=>{o.made=o.half<=cut+1e-9; if(o.made){o.r3=simRound(o.p,{major:evt.major});o.r4=simRound(o.p,{major:evt.major,finalRd:true});} o.total=o.made?o.half+o.r3+o.r4:o.half;});
  const made=res.filter(o=>o.made).sort((a,b)=>a.total-b.total);
  const missed=res.filter(o=>!o.made).sort((a,b)=>a.half-b.half);
  made.forEach((o,i)=>{o.pos=i+1;o.pct=PAYOUT[i]||0;});
  missed.forEach(o=>{o.pos='CUT';o.pct=0;});
  const order=made.concat(missed);
  const basePts=evt.major?750:evt.big?600:500;
  order.forEach(o=>{o.money=evt.purse*o.pct; o.points=typeof o.pos==='number'?Math.round(basePts*(o.pct/0.18)):0; o.score=Math.round(o.total);});
  return order;
}

  const a=ARCH[top.k]; return {name:a[0], desc:a[1]};
}

let _lastView=null;
function render(){
  const savedY=window.scrollY;
  const view=S.screen+'|'+(S.overlay||'')+'|'+(S.recapEvent==null?'':S.recapEvent);
  const sameView=(view===_lastView);
  app.innerHTML='';
  app.appendChild(header());
  const card=$(`<main class="card"></main>`);
  const screen=$(`<div class="screen${['title','draft','season','setup'].includes(S.screen)?' wide':''}"></div>`);
  card.appendChild(screen);
  app.appendChild(card);
  app.appendChild(footer());
  RT=screen;
  if(S.overlay==='rules') overlayRules(screen);
  if(S.overlay==='record') overlayRecord(screen);
  if(S.overlay==='dailydone') overlayDailyDone(screen);
  if(S.overlay==='confirmReset') overlayConfirmReset(screen);
  ({title:scrTitle,setup:scrSetup,draft:scrDraft,build:scrBuild,season:scrSeason,summary:scrSummary,recap:scrRecap})[S.screen]();
  _lastView=view;
  // keep your place when re-rendering the same view (e.g. picking customization swatches);
  // only jump to top when the view actually changes.
  window.scrollTo({top: sameView ? savedY : 0});
}

    <ol>
      <li>Spin the wheel up to <b>10 times</b>. Each spin lands on a real golfer.</li>

function startRoll(){
  clearInterval(rollTimer);
  let i=0;
  rollTimer=setInterval(()=>{
    const el=document.getElementById('rollval');
    if(!el||!el.isConnected){clearInterval(rollTimer);return;}
    i=(i+1)%CATS.length;
    el.style.opacity='0';
    setTimeout(()=>{ if(el.isConnected){el.textContent=CATS[i].short; el.style.opacity='1';} },180);
  },1700);
}
function toast(msg){
  const t=$(`<div style="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:30;background:#0a1626;color:var(--oncard);border:1px solid var(--gold);border-radius:10px;padding:11px 16px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4)">${msg}</div>`);
  document.body.appendChild(t); setTimeout(()=>t.remove(),1800);
}

  ctx.beginPath(); vals.forEach((v,i)=>{const[x,y]=pt(i,R*(v/100));i?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.closePath();
  ctx.fillStyle='rgba(6,162,145,.34)'; ctx.fill(); ctx.strokeStyle='#0FA888'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.fillStyle='#EBA61F'; vals.forEach((v,i)=>{const[x,y]=pt(i,R*(v/100)); ctx.beginPath(); ctx.arc(x,y,3.6,0,7); ctx.fill();});
  ctx.fillStyle='#9fb0bd'; ctx.font='700 12px system-ui,sans-serif';
  RLABS.forEach((L,i)=>{const[x,y]=pt(i,R+17); ctx.fillText(L,x,y+4);});
  // name + ovr
  ctx.fillStyle='#F4E3C9'; ctx.font='800 34px Impact,system-ui,sans-serif';
  ctx.fillText((info.name||'Your Golfer').toUpperCase(),W/2,392);
  ctx.fillStyle='#9fb0bd'; ctx.font='700 14px system-ui,sans-serif';
  ctx.fillText(`OVR ${info.ovr}${info.year>1?'  ·  YR '+info.year:''}  ·  ${info.events} EVENTS  ·  ${info.majors} MAJORS`,W/2,414);
  ctx.fillStyle=info.net>=0?'#35d6a0':'#E14A33'; ctx.font='800 22px Impact,system-ui,sans-serif';
  ctx.fillText('NET '+fmtSigned(info.net),W/2,448);
  // stat cells
  const cells=[
    ['MONEY WON',fmt(info.money),'#EBA61F'],
    ['MONEY RANK','#'+info.moneyRank+' / '+info.N,'#F4E3C9'],
    ['WINS',info.wins+'','#F4E3C9'],
    ['MAJORS',info.majorsWon+'','#F4E3C9'],
    ['BEST FINISH',bestTxt(info.best),'#F4E3C9'],
    ['FEDEX RANK','#'+info.fedexRank+' / '+info.N,'#F4E3C9'],
  ];
  const colX=[W*0.28,W*0.72], y0=486, rowH=66;
  cells.forEach((c,i)=>{
    const x=colX[i%2], y=y0+Math.floor(i/2)*rowH;
    ctx.fillStyle='#9fb0bd'; ctx.font='800 11px system-ui,sans-serif'; ctx.fillText(c[0],x,y);
    ctx.fillStyle=c[2]; ctx.font='800 26px Impact,system-ui,sans-serif'; ctx.fillText(c[1],x,y+28);
  });
  ctx.fillStyle='#EBA61F'; ctx.font='800 16px Impact,system-ui,sans-serif';
  ctx.fillText('RunThe.GG',W/2,H-26);
}
function shareCard(cv,text,name){
  cv.toBlob(async b=>{
    if(!b){toast('Could not build the image — copy the text instead');return;}
    const file=new File([b],((name||'golfer').replace(/\s+/g,'-'))+'-season.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],text}); return;}catch(e){if(e&&e.name==='AbortError')return;}
    }
    const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=file.name; a.click(); URL.revokeObjectURL(u);
    toast('Card saved — attach it to your post');
  });
}

/* ---------- summary ---------- */
function scrSummary(){
  const me=S.season.me, t=S.season.totals[me.name];
  const byMoney=Object.entries(S.season.totals).map(([n,v])=>({n,...v})).sort((a,b)=>b.money-a.money);
  const byPoints=[...byMoney].sort((a,b)=>b.points-a.points);
  const moneyRank=byMoney.findIndex(r=>r.n===me.name)+1;
  const fedexRank=byPoints.findIndex(r=>r.n===me.name)+1;
  const N=byMoney.length;
  const ovr=Math.round(me.skill);
  const ec=seasonNet(t);
  if(!S.recorded){S.recorded=true;
    const r=recordSeason({name:me.name,ovr,money:t.money,gross:ec.gross,net:ec.net,wins:t.wins,majorsWon:t.majors,played:t.played,made:t.made,moneyRank,best:t.best}); S.freshBadges=r.fresh;
    S.career=S.career||{money:0,net:0,wins:0,majors:0,top10:0,best:99,seasons:[]};
    S.career.money+=t.money; S.career.net+=ec.net; S.career.wins+=t.wins; S.career.majors+=t.majors; S.career.top10+=t.top10;
    if(t.best<S.career.best)S.career.best=t.best;
    S.career.seasons.push({year:S.year||1,net:ec.net,money:t.money,wins:t.wins,majors:t.majors,best:t.best,rank:moneyRank});
  }
  if(S.daily&&!S.dailyStored){S.dailyStored=true; LS.set('bag_daily',{date:S.dailySeed,done:true,result:{name:me.name,ovr,net:ec.net,money:t.money,moneyRank,N,wins:t.wins,majors:t.majors,best:t.best}});}
  add($(`<div class="center"><span class="tag">${S.daily?'★ Daily Challenge complete':(S.year>1?('Year '+S.year+' complete'):'Season complete')}</span></div>`));
  add($(`<h1 class="center" style="font-size:30px;margin:12px 0 2px">${me.name}</h1>`));
  add($(`<p class="lede center" style="margin-bottom:10px">${S.daily?'':('Year '+(S.year||1)+' · ')}${S.schedule.length} events · ${S.schedule.filter(e=>e.major).length} majors · Overall ${ovr}</p>`));
  const netCol=ec.net>=0?'#35d6a0':'#E14A33';
  add($(`<div class="center" style="margin-bottom:6px">
    <div style="font:800 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)">Net profit</div>
    <div class="mono" style="font-weight:800;font-size:38px;color:${netCol};margin-top:4px">${fmtSigned(ec.net)}</div>
    <div class="small muted" style="margin-top:2px">${fmt(ec.gross)} won · caddie −${fmt(ec.caddie)} · travel −${fmt(ec.travel)}</div></div>`));
  if(S.freshBadges&&S.freshBadges.length){
    const got=ACHS.filter(a=>S.freshBadges.includes(a.id));
    const chips=got.map(a=>`<span class="tag" style="color:var(--gold);border-color:var(--gold)">${a.e} ${a.t}</span>`).join(' ');
    add($(`<div class="scout" style="margin:4px 0 12px;text-align:center"><b style="color:var(--gold)">Achievement${got.length>1?'s':''} unlocked</b><div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center">${chips}</div></div>`));
  }
  const tiles=$(`<div class="tiles"></div>`);
  tiles.appendChild(tile('Money won',fmt(t.money),true));
  tiles.appendChild(tile('Money rank',moneyRank+' / '+N));
  tiles.appendChild(tile('Wins',t.wins+''));
  tiles.appendChild(tile('Majors',t.majors+''));
  tiles.appendChild(tile('Top 10s',t.top10+''));
  tiles.appendChild(tile('Best finish',t.best===99?'MC':(t.best===1?'WIN':'T'+t.best)));
  tiles.appendChild(tile('FedEx points',t.points.toLocaleString()));
  tiles.appendChild(tile('FedEx rank',fedexRank+' / '+N));
  add(tiles);
  add($(`<h2 style="margin:6px 0 8px">Season money list</h2>`));
  const board=$(`<div class="board"></div>`);
  byMoney.slice(0,10).forEach((r,i)=>board.appendChild(moneyRow(r,i+1,r.n===me.name)));
  if(moneyRank>10){board.appendChild($(`<div class="sep"></div>`)); board.appendChild(moneyRow(byMoney[moneyRank-1],moneyRank,true));}
  add(board);
  const recapBtn=$(`<button class="btn gold" style="margin-top:10px">📋 Full Season Recap<span class="sub">Every event, leaderboard by leaderboard</span></button>`);
  recapBtn.onclick=()=>{S.recapEvent=null; S.screen='recap'; render();}; add(recapBtn);
  if(!S.daily && S.career && S.career.seasons.length>1){
    const c=S.career, ccol=c.net>=0?'#35d6a0':'#E14A33';
    add($(`<h2 style="margin:16px 0 8px">Career · ${c.seasons.length} years</h2>`));
    const ct=$(`<div class="tiles"></div>`);
    ct.appendChild($(`<div class="tile"><div class="k">Career net</div><div class="v" style="color:${ccol}">${fmtSigned(c.net)}</div></div>`));
    ct.appendChild(tile('Career money',fmt(c.money),true));
    ct.appendChild(tile('Career wins',c.wins+''));
    ct.appendChild(tile('Career majors',c.majors+''));
    add(ct);
    const yb=$(`<div class="board"></div>`);
    c.seasons.forEach(s=>yb.appendChild($(`<div class="lb" style="grid-template-columns:46px 1fr 96px">
      <span class="pos">Yr ${s.year}</span>
      <span class="pl">${s.wins}W · ${s.majors} maj · best ${bestTxt(s.best)}</span>
      <span class="mny" style="color:${s.net>=0?'#35d6a0':'#E14A33'}">${fmtSigned(s.net)}</span></div>`)));
    add(yb);
  }
  const wreath=t.wins>0?` 🏆×${t.wins}`:'';
  const share=`BUILD A GOLFER — ${me.name} (OVR ${Math.round(me.skill)})\n${fmt(t.money)} · #${moneyRank} money${wreath}\n${t.wins}W · ${t.majors} majors · best ${bestTxt(t.best)}\nRunThe.GG`;
  add($(`<div style="height:14px"></div>`));
  add($(`<h2 style="margin:0 0 8px">Share card</h2>`));
  const vals=CATS.map(c=> S.slots[c.k]? S.slots[c.k].value : REPLACEMENT);
  const cv=document.createElement('canvas');
  cv.style.cssText='width:100%;max-width:300px;display:block;margin:0 auto;border-radius:14px;border:1px solid var(--line)';
  drawShareCard(cv,{name:me.name,ovr,year:S.year||1,events:S.schedule.length,majors:S.schedule.filter(e=>e.major).length,money:t.money,net:ec.net,moneyRank,N,wins:t.wins,majorsWon:t.majors,best:t.best,fedexRank},vals);
  add(cv);
  const row=$(`<div class="mini" style="margin-top:10px"></div>`);
  const dl=$(`<button class="btn gold">⤓ Save Card</button>`);
  const sh=$(`<button class="btn gold">↗ Share</button>`);
  dl.onclick=()=>cv.toBlob(b=>{if(!b)return;const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=((me.name||'golfer').replace(/\s+/g,'-'))+'-season.png';a.click();URL.revokeObjectURL(u);});
  sh.onclick=()=>shareCard(cv,share,me.name);
  row.appendChild(dl); row.appendChild(sh); add(row);
  const cp=$(`<button class="btn ghost" style="margin-top:10px">Copy Text Result</button>`);
  cp.onclick=()=>{navigator.clipboard?.writeText(share); cp.textContent='Copied ✓'; setTimeout(()=>cp.textContent='Copy Text Result',1400);};
  add(cp);
  add($(`<div style="height:14px"></div>`));
  if(S.daily){
    const again=$(`<button class="btn red">Build Another Golfer</button>`);
    again.onclick=()=>{reset();render();}; add(again);
  } else {
    const cont=$(`<button class="btn goldfill">Continue to Year ${(S.year||1)+1} ▸<span class="sub">Same golfer · run another season</span></button>`);
    cont.onclick=continueFranchise; add(cont);
    const retire=$(`<button class="btn ghost" style="margin-top:10px">Retire — Build New Golfer</button>`);
    retire.onclick=()=>{reset();render();}; add(retire);
  }
}
function continueFranchise(){
  S.year=(S.year||1)+1;
  S.schedule=[]; S.evtIndex=0; S.season=null; S.recorded=false; S.freshBadges=null; S.seasonPaused=false;
  startSeason(false);
}
/* ---------- season recap ---------- */
function scrRecap(){
  const results=S.season.results;
  if(S.recapEvent!=null){
    const {evt,order}=results[S.recapEvent];
    const me=order.find(o=>o.p.you);
    const typeLbl=evt.major?'<span class="major">Major</span>':evt.type==='finale'?'<span class="sig">Finale</span>':evt.big?'<span class="sig">Signature</span>':'<span class="reg">Tour event</span>';
    add($(`<div class="evt-head"><div><div class="nm">${evt.name}</div>
      <div class="kx">${typeLbl} · ${fmt(evt.purse)} purse</div></div>
      <div class="kx reg">Event ${S.recapEvent+1}/${results.length}</div></div>`));
    const board=$(`<div class="board ${evt.major?'major':''}"></div>`);
    const top=order.slice(0,12);
    top.forEach(o=>board.appendChild(lbRow(o)));
    if(!top.includes(me)){board.appendChild($(`<div class="sep"></div>`)); board.appendChild(lbRow(me));}
    add(board);
    const result=(me.pos==='CUT')?'Missed cut':(me.pos===1?'WON':'T'+me.pos);
    add($(`<div class="runline"><span>${me.p.name}: <b style="color:var(--oncard)">${result}</b> · ${par(me.score)}</span><span style="color:var(--gold)">${me.money>0?'+'+fmt(me.money):'—'}</span></div>`));
    add(roundsRow(me));
    add($(`<div style="height:14px"></div>`));
    const back=$(`<button class="btn gold">‹ All events</button>`); back.onclick=()=>{S.recapEvent=null;render();}; add(back);
    return;
  }
  add($(`<h1 class="center" style="font-size:24px;margin:2px 0 2px">Season recap</h1>`));
  add($(`<p class="lede center" style="margin-bottom:12px">Tap any event to replay its leaderboard.</p>`));
  const board=$(`<div class="board"></div>`);
  results.forEach((r,i)=>{
    const me=r.order.find(o=>o.p.you);
    const fin=me.pos==='CUT'?'MC':(me.pos===1?'WON':'T'+me.pos);
    const col=me.pos==='CUT'?'#e07a5f':(me.pos===1?'var(--gold)':'var(--oncard)');
    const row=$(`<div class="lb" style="grid-template-columns:26px 1fr 50px 74px;cursor:pointer">
      <span class="pos">${r.evt.major?'★':i+1}</span>
      <span class="pl">${r.evt.name}</span>
      <span class="sc" style="color:${col}">${fin}</span>
      <span class="mny">${me.money>0?fmt(me.money):'—'}</span></div>`);
    row.onclick=()=>{S.recapEvent=i;render();};
    board.appendChild(row);
  });
  add(board);
  add($(`<div style="height:14px"></div>`));
  const back=$(`<button class="btn red">‹ Back to results</button>`); back.onclick=()=>{S.screen='summary';render();}; add(back);
}
function tile(k,v,gold){return $(`<div class="tile"><div class="k">${k}</div><div class="v ${gold?'':'cream'}">${v}</div></div>`);}
function moneyRow(r,pos,you){return $(`<div class="lb ${you?'you':''}" style="grid-template-columns:34px 1fr 92px">
  <span class="pos">${pos===1?'🏆':pos}</span><span class="pl">${r.n}</span>
  <span class="mny" style="color:var(--gold)">${fmt(r.money)}</span></div>`);}

render();
</script>
