// live "Race to the Cup" strip: your points rank vs the next cut line (top 70 → 50 → 30 → the Cup)
function raceToCupNode(byPts, evt){
  const meName=S.season.me.name;
  const rank=byPts.findIndex(r=>r.n===meName)+1;
  const myPts=Math.round((byPts.find(r=>r.n===meName)||{}).points||0);
  const fmtP=n=>Math.round(n).toLocaleString();
  // `noun` = what the top-N actually qualify FOR, named explicitly so the strip always reads as a
  // complete sentence: "Only the top 70 qualify for the FedEx Cup Playoffs. You're #12, safely in."
  let gate=0, noun='';
  if(S.circuitMode){
    if(!evt.playoff){ gate=CIRCUIT_PLAYOFFS[0].cap; noun='the Schwab Cup Playoffs'; }
    else if(evt.stage===1){ gate=CIRCUIT_PLAYOFFS[1].cap; noun='the '+CIRCUIT_PLAYOFFS[1].name; }
    else if(evt.stage===2){ gate=CIRCUIT_PLAYOFFS[2].cap; noun='the '+CIRCUIT_PLAYOFFS[2].name; }
  } else {
    if(!evt.playoff){ gate=70; noun='the FedEx Cup Playoffs'; }
    else if(evt.stage===1){ gate=50; noun='the BMW Championship'; }
    else if(evt.stage===2){ gate=30; noun='the Tour Championship at East Lake'; }
  }
  const finale=(gate===0);
  let detail, inside=true, line=gate;
  if(finale){ detail=S.circuitMode?'You made the finale. Win the Schwab Cup Championship to lift the Cup.':'You made the 30-man finale. Win the Tour Championship to lift the Cup.'; }
  else {
    inside=rank<=gate; const lineP=Math.round((byPts[gate-1]||{points:0}).points||0);
    if(inside){ const cu=gate-rank;
      detail=cu>0
        ? `Only the top ${gate} qualify for ${noun}. You're #${rank}, safely inside, ${cu} spot${cu===1?'':'s'} above the cut line.`
        : `Only the top ${gate} qualify for ${noun}. You're #${rank}, the very last qualifying spot. One bad week drops you out.`;
    }
    else detail=`Only the top ${gate} qualify for ${noun}. You're #${rank}, ${rank-gate} spot${rank-gate===1?'':'s'} below the cut line (about ${fmtP(lineP-myPts)} pts behind #${gate}). Earn points to climb in.`;
  }
  const NP=byPts.length;
  const fillPct=finale?100:Math.max(3,Math.min(100,100*(1-(rank-1)/Math.max(1,NP-1))));
  const linePct=finale?0:Math.max(0,Math.min(100,100*(1-(gate-1)/Math.max(1,NP-1))));
  const col=finale?'var(--gold)':(inside?'#35d6a0':'#E14A33');
  const wrap=$(`<div class="race2cup" style="background:#0a2740;border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin:0 0 12px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div style="min-width:0"><div style="font:800 10px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)">${finale?'🏆 The Cup is on the line':(S.circuitMode?'Race to the Schwab Cup':'Race to the Cup')}</div>
        <div class="small" style="margin-top:3px;color:var(--oncard)">${detail}</div></div>
      <div style="text-align:right;flex:0 0 auto"><div class="mono" style="font-weight:800;font-size:20px;color:${col}">#${rank}</div>
        <div class="small muted" style="margin-top:1px">${fmtP(myPts)} pts</div></div>
    </div>
    <div style="position:relative;height:8px;border-radius:5px;background:#06223a;margin-top:9px;overflow:hidden">
      <div style="position:absolute;left:0;top:0;bottom:0;width:${fillPct}%;background:${col};opacity:.85;border-radius:5px"></div>
      ${finale?'':`<div title="Top ${gate} line" style="position:absolute;left:${linePct}%;top:-2px;bottom:-2px;width:2px;background:#f9d271;box-shadow:0 0 4px #f9d271"></div>`}
    </div>
  </div>`);
  return wrap;
}

  const typeLbl=evt.olympics?'<span class="major">🏅 Summer Games</span>':evt.guestMajor?'<span class="major">🎖️ Past Champion</span>':evt.major?'<span class="major">Major</span>':evt.stagger?`<span class="sig">🏆 Cup Finale · top ${evt.cap}</span>`:evt.playoff?`<span class="sig">Playoff · top ${evt.cap}</span>`:evt.oppo?'<span class="reg">Opposite-field</span>':evt.type==='finale'?'<span class="sig">Finale</span>':evt.big?`<span class="sig">Signature · top ${evt.entryCap||50}</span>`:'<span class="reg">Tour event</span>';
  const dayLbl=ce.done?'Final':(ce.roundsDone>=2&&!ce.players.find(o=>o.p.you).made?`After ${DAYS[1]}`:`${DAYS[Math.max(0,ce.roundsDone-1)]} · Round ${Math.min(ce.roundsDone,4)}/4`);
  const cols=$(`<div class="cols seasoncols"></div>`);
  const left=$(`<div class="col"></div>`), right=$(`<div class="col scorecol"></div>`);
  cols.appendChild(left); cols.appendChild(right); add(cols);

  // LEFT, live, re-sorting leaderboard (the event name lives on the scorecard now)

    <div class="kx reg" style="text-align:right">Event ${S.evtIndex+1}/${S.schedule.length}<br><span style="color:var(--gold)">${dayLbl}</span></div></div>`));
  const ordered=liveOrder(ce);

  if(youOut){board.appendChild($(`<div class="sep"></div>`)); board.appendChild(liveRow(meLive,meLive._pos,true,ce.done,flag));}

  }
}
function roundsRow(o){

function lbRow(o){

/* ---------- season headlines (#6): a newspaper-style recap of the year's story ----------
   Derives a LEAD headline + a few supporting notes from this season's actual events
   (finishes, wins, majors, money rank) and the career context. Pure read of S.season/S.career. */
function seasonHeadlines(x){
  const {t,moneyRank,N,ec}=x, year=x.year, results=(S.season&&S.season.results)||[];
  const fin=results.map(r=>{ const me=r.order&&r.order.find(o=>o.p&&o.p.you); if(!me)return null;
    const pos=(me.pos==='CUT')?99:me.pos; return {name:r.evt.name,major:!!r.evt.major,pos,money:me.money||0}; }).filter(Boolean);
  const wins=fin.filter(f=>f.pos===1), majorWins=wins.filter(f=>f.major);
  const seconds=fin.filter(f=>f.pos===2).length, top5=fin.filter(f=>f.pos<=5).length, top10=fin.filter(f=>f.pos<=10).length;
  const playedN=fin.length, missed=fin.filter(f=>f.pos===99).length, made=playedN-missed;
  const bestFin=fin.reduce((m,f)=>Math.min(m,f.pos),99);
  const bigPay=fin.slice().sort((a,b)=>b.money-a.money)[0];
  const distinctMajors=new Set(majorWins.map(f=>f.name)).size;

  // expandable itemized expense sheet (caddie / agent / travel / tour overhead)
  const expWrap=$(`<div class="center" style="margin:0 0 8px"></div>`);
  const expBtn=$(`<button class="btn ghost" style="width:auto;font-size:11px;padding:6px 13px">${S.showExpenses?'Hide expense breakdown ▴':'See expense breakdown ▾'}</button>`);
  expBtn.onclick=()=>{S.showExpenses=!S.showExpenses;render();};
  expWrap.appendChild(expBtn);
  if(S.showExpenses){
    const row=(k,v,col,strong)=>`<div style="display:flex;justify-content:space-between;gap:14px;padding:7px 2px;border-bottom:1px solid rgba(255,255,255,.06)"><span class="small ${strong?'':'muted'}" style="text-align:left${strong?';font-weight:800':''}">${k}</span><span class="mono" style="color:${col};white-space:nowrap${strong?';font-weight:800':''}">${v}</span></div>`;
    const items=[
      row('Prize money won','+'+fmt(ec.gross),'#35d6a0'),
      row('Caddie · '+Math.round(caddieFeePct()*100)+'% of winnings','−'+fmt(ec.caddie),'#E14A33'),
      row('Agent · 8% of winnings','−'+fmt(ec.agent),'#E14A33'),
      row(`Travel · ${t.played} event${t.played===1?'':'s'} × $22k`,'−'+fmt(ec.travel),'#E14A33'),
      row('Tour overhead · coach, equipment, taxes, team','−'+fmt(ec.fixed),'#E14A33'),
      row('Total expenses','−'+fmt(ec.costs),'#E14A33',true),
      `<div style="display:flex;justify-content:space-between;gap:14px;padding:8px 2px 2px"><span class="small" style="font-weight:800">Net profit</span><span class="mono" style="color:${netCol};font-weight:800">${fmtSigned(ec.net)}</span></div>`
    ].join('');
    expWrap.appendChild($(`<div class="scout" style="max-width:460px;margin:8px auto 0;text-align:left">${items}</div>`));
  }
  add(expWrap);
  if(sbSignedIn() && S.freshAch&&S.freshAch.length){   // Tour Rep / achievements are a signed-in feature, never shown to guests
    const gained=S.freshAch.reduce((s,a)=>s+(a.pts||0),0);
    add(seasonRepNode(achPoints()-gained, S.freshAch));   // status bar on top → achievements reveal one by one, rep climbs in sync
  }
  if(sbSignedIn() && S.freshRep){ add($(repUpHTML(S.freshRep))); }
  // season headlines (#6): newspaper-style recap of the year's story
  const HL=(!S.daily)?seasonHeadlines({t,moneyRank,N,ec,year:S.year||1}):null;
  // five headline stats: Earnings · Profit (two money tiles) over Tour Rank · Top 10's · Wins
  const pcol=ec.net>=0?'#35d6a0':'#E14A33';
  const tilesA=$(`<div class="tiles" style="grid-template-columns:1fr 1fr;margin-bottom:10px"></div>`);
  tilesA.appendChild(tile('Earnings',fmt(t.money),true));
  tilesA.appendChild($(`<div class="tile"><div class="k">Profit</div><div class="v" style="color:${pcol}">${fmtSigned(ec.net)}</div></div>`));
  add(tilesA);
  const tilesB=$(`<div class="tiles" style="grid-template-columns:repeat(4,1fr);margin-top:0"></div>`);
  const statTile=(k,v)=>$(`<div class="tile"><div class="k">${k}</div><div class="v" style="font-size:19px;white-space:nowrap">${v}</div></div>`);
  tilesB.appendChild(statTile('Tour Rank',fedexRank+' / '+N));
  tilesB.appendChild(statTile("Top 10's",t.top10+''));
  tilesB.appendChild(statTile('Wins',t.wins+''));
  tilesB.appendChild(statTile('Majors',t.majors+''));
  add(tilesB);
  // Official World Ranking + Tour Card status, the season's headline standing, with year-over-year movement
  if(!S.daily && S.worldRankMove){
    const m=S.worldRankMove, cs=cardStatus(m.now), dlt=m.prev-m.now;   // dlt>0 = climbed (lower number is better)
    const firstYr=(S.career&&S.career.seasons.length<=1);
    const moveTxt=firstYr?'New entry':(dlt>0?`▲ ${dlt}`:dlt<0?`▼ ${Math.abs(dlt)}`:'- level');
    const moveCol=firstYr?'var(--gold)':(dlt>0?'#35d6a0':dlt<0?'#E14A33':'var(--muted)');
    add($(`<div class="scout" style="display:flex;align-items:center;justify-content:space-between;gap:14px;margin:8px 0 12px;border-color:${cs.col}">
      <div style="min-width:0">
        <div style="font:800 10px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)">Official World Ranking</div>
        <div style="font:800 26px/1 var(--body);color:var(--oncard);margin-top:6px">World #${m.now} <span style="font-size:13px;color:${moveCol};font-weight:700">${moveTxt}</span></div>
        <div class="small" style="margin-top:5px;color:${cs.col};font-weight:700">${cs.label}</div>
        <div class="small muted" style="margin-top:1px">${cs.note}</div>
      </div>
      <div style="text-align:right;flex:0 0 auto"><div class="small muted">of ${m.size}</div></div>
    </div>`));
  }
  // ---- Season Awards ----
  if(!S.daily && S.seasonAwards){
    const aw=S.seasonAwards;
    const scoreTxt=aw.scoring?((aw.scoring.avg<=0?'−':'+')+Math.abs(aw.scoring.avg).toFixed(2)+' per round'):'';
    const items=[
      ['Player of the Year', aw.poy, ''],
      ['Money Title', aw.money, aw.money?fmt(aw.money.amount):''],
      ['Scoring Title', aw.scoring, scoreTxt],
      ['Rookie of the Year', aw.roy, ''],
      ['World No. 1', aw.no1, ''],
    ].filter(x=>x[1]);
    const won=items.filter(x=>x[1].you).length;
    add($(`<h2 class="center" style="margin:14px 0 8px;font-size:15px">Season Awards${won?` · <span style="color:var(--gold)">you won ${won}</span>`:''}</h2>`));
    const wrap=$(`<div class="scout" style="padding:2px 12px;margin-bottom:6px"></div>`);
    items.forEach(([label,a,sub],i)=>{
      const you=a.you, br=i<items.length-1?'border-bottom:1px solid rgba(255,255,255,.06)':'';
      wrap.appendChild($(`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;${br}">
        <span class="small" style="color:var(--muted);flex:0 0 auto">${label}</span>
        <span style="text-align:right;min-width:0"><span style="font-weight:800;color:${you?'var(--gold)':'var(--oncard)'}">${esc(a.name)}</span>${you?' <span class="tag" style="font-size:9px;padding:1px 6px;color:var(--gold);border-color:var(--gold)">YOU</span>':''}${sub?`<div class="small muted" style="margin-top:1px">${sub}</div>`:''}</span>
      </div>`));
    });
    add(wrap);
  }
  // ---- Olympic medal callout (Olympic years only) ----
  if(!S.daily && S.season.olympicMedals){
    const med=S.season.olympicMyMedal, M={gold:['🥇','GOLD Medal','var(--gold)'],silver:['🥈','Silver Medal','#c7ced8'],bronze:['🥉','Bronze Medal','#cd8e5a']};
    const gold=S.season.olympicMedals[0];
    if(med){ const m=M[med];
      add($(`<div class="center" style="margin:8px 0 12px"><div style="display:inline-block;background:linear-gradient(180deg,#1c3a56,#0a2740);border:1px solid ${m[2]};border-radius:14px;padding:13px 22px">
        <div style="font:800 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:${m[2]}">Summer Games</div>
        <div style="font:800 22px/1.1 var(--body);color:${m[2]};margin-top:6px">${m[0]} ${m[1]}</div>
        <div class="small muted" style="margin-top:4px">You medalled for ${esc((S.look&&S.look.country)||'your country')}</div></div></div>`));
    } else {
      add($(`<div class="center" style="margin:6px 0 12px"><div class="scout" style="display:inline-block;padding:10px 16px">
        <span style="font:800 10px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)">Summer Games</span>
        <span class="small" style="margin-left:8px;color:var(--oncard)">🥇 ${natFlag(gold.nat)} ${esc(gold.name)} took gold</span></div></div>`));
    }
  }
  // ---- Ryder/Presidents Cup callout ----
  if(!S.daily && S.season.teamCup && (S.season.teamCup.playerSide || S.season.teamCup.captain)){
    const T=S.season.teamCup, mineWon=T.mineWon, tie=T.retained, col=mineWon?'var(--gold)':tie?'#c9b25a':'#9fb0bf';
    const winName=T.winner==='A'?T.nameA:T.nameB, mine=(T.captain?T.mySide:T.playerSide)==='A'?T.nameA:T.nameB;
    const sub=T.captain?(mineWon?'🎖️ You captained them to the Cup':tie?'You captained them to a retained Cup':'Captained, fell just short')
      :`Your record: ${T.playerRec.w}-${T.playerRec.l}-${T.playerRec.h} · ${ptTxt(T.playerRec.pts)} point${T.playerRec.pts===1?'':'s'}`;
    add($(`<div class="center" style="margin:8px 0 12px"><div style="display:inline-block;background:linear-gradient(180deg,#15331f,#0a2740);border:1px solid ${col};border-radius:14px;padding:12px 20px">
      <div style="font:800 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:${col}">${esc(T.short)} · ${esc(mine)}${T.captain?' · Captain':''}</div>
      <div style="font:800 19px/1.15 var(--body);color:${col};margin-top:6px">${tie?esc(winName)+' retain the Cup':(mineWon?'🏆 ':'')+esc(winName)+' win the Cup'}</div>
      <div class="small muted" style="margin-top:4px">${sub}</div></div></div>`));
  }
  if(HL) add($(headlinesHTML(HL)));
  if(S.freshRivalOutgrown) add($(rivalOutgrownHTML(S.freshRivalOutgrown)));
  if(S.freshRival) add($(rivalFormedHTML(S.freshRival)));
  if(S.rivalOutcome) add($(rivalCardHTML(S.rivalOutcome)));
  // the actual tournaments won this season (majors flagged in gold)
  const wonThisSeason=[];
  (S.season.results||[]).forEach(r=>{ const meR=r.order&&r.order.find(o=>o.p&&o.p.you); if(meR&&meR.pos===1) wonThisSeason.push({name:r.evt.name,major:!!r.evt.major}); });
  if(wonThisSeason.length){
    add($(`<h2 class="center" style="margin:14px 0 8px;font-size:15px">Tournaments won this season</h2>`));
    const wrap=$(`<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:4px"></div>`);
    wonThisSeason.forEach(w=>wrap.appendChild($(`<span class="tag" style="font-size:12px;padding:7px 12px;${w.major?'color:var(--gold);border-color:var(--gold)':''}">🏆 ${w.name}${w.major?' · MAJOR':''}</span>`)));
    add(wrap);
  }
  // year-over-year skill changes, only once decline kicks in (Year 15+), since
  // before that nothing moves and every tile would read 0. Shows the new rating
  // with the change (e.g. red −1) beside it. Circuit seasons read their OWN skillSeasons
  // (tracked separately, see the circuit bookkeeping above), otherwise this froze at
  // the regular career's last entry (year 30) for the entire 12-season circuit.
  const ss=(!S.daily && (S.circuitMode ? (S.circuitCareer&&S.circuitCareer.skillSeasons) : (S.career&&S.career.skillSeasons)))||[];
  if(ss.length>=2 && pastPeak()){
    const cur=ss[ss.length-1].skills, prev=ss[ss.length-2].skills, py=ss[ss.length-2].year;
    add($(`<h2 class="center" style="margin:14px 0 8px;font-size:15px">Skill changes vs Year ${py}</h2>`));
    const dt=$(`<div class="tiles four"></div>`);
    CATS.forEach(c=>{
      const nv=cur[c.k]||0, d=nv-(prev[c.k]||0);
      const dcol=d>0?'#35d6a0':(d<0?'#E14A33':'var(--muted)');
      const dtxt=d===0?'·0':(d>0?'+'+d:'−'+Math.abs(d));
      dt.appendChild($(`<div class="tile"><div class="k">${c.short}</div><div class="v" style="font-size:20px">${nv} <span style="color:${dcol};font-size:13px;font-weight:700">${dtxt}</span></div></div>`));
    });
    add(dt);
  }

  // guest: nudge to sign up & post this season to the global board (with would-be rank if known)
  if(!sbSignedIn() && !S.daily){
    if(!lbCache['season:earnings']) lbLoad('season','earnings');
    let rankMsg='Post this season to the global leaderboard';
    const _sb=lbCache['season:earnings'];
    if(_sb && _sb.ok && _sb.rows){
      const above=_sb.rows.filter(r=>r.season_earnings>t.money).length;
      const full=_sb.rows.length>=50;
      if(!full || above<_sb.rows.length) rankMsg=`You'd rank <b style="color:var(--gold)">#${above+1}</b> on the Single-Season board`;
    }
    const gb=$(`<div class="scout" style="border-color:var(--gold);margin:2px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div style="min-width:0"><b style="color:var(--oncard)">🏆 ${rankMsg}</b><div class="small muted" style="margin-top:2px">Create a free account to claim your spot, save your career &amp; unlock achievements.</div></div>
      <button class="btn goldfill" style="width:auto;padding:10px 16px;flex:0 0 auto" id="sum-signup">Create free account</button></div>`);
    gb.querySelector('#sum-signup').onclick=()=>{S.overlay='account';S.acctMode='signup';S.acctErr='';render();};
    add(gb);
  }

  // two columns: money list / career on the left, share + actions on the right
  const cols=$(`<div class="cols"></div>`);
  const left=$(`<div class="col"></div>`), right=$(`<div class="col"></div>`);
  cols.appendChild(left); cols.appendChild(right); add(cols);

  const hasCareer = !S.daily && S.career && S.career.seasons.length>1;
  const tab = hasCareer ? (S.summaryTab||'season') : 'season';
  // career standings (cumulative vs the persistent field)
  const careerList=Object.entries(S.career&&S.career.fieldMoney||{}).map(([n,money])=>({n,money})).sort((a,b)=>b.money-a.money);
  const cRank=careerList.findIndex(r=>r.n===me.name)+1;
  if(hasCareer){
    const head=$(`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 8px"></div>`);
    head.appendChild($(`<h2 style="margin:0">${tab==='career'?`Career earnings list · ${S.career.seasons.length} yrs`:'This season'}</h2>`));
    const seg=$(`<div class="mini" style="margin:0;width:auto;flex:0 0 auto"></div>`);
    const t1=$(`<button class="btn ${tab==='season'?'gold':'ghost'}" style="font-size:11px;padding:6px 11px;width:auto">This Season</button>`);
    const t2=$(`<button class="btn ${tab==='career'?'gold':'ghost'}" style="font-size:11px;padding:6px 11px;width:auto">Career</button>`);
    t1.onclick=()=>{S.summaryTab='season';render();}; t2.onclick=()=>{S.summaryTab='career';render();};
    seg.appendChild(t1); seg.appendChild(t2); head.appendChild(seg); left.appendChild(head);
  } else {
    left.appendChild($(`<h2 style="margin:2px 0 8px">Season earnings list</h2>`));
  }
  const board=$(`<div class="board"></div>`);
  if(tab==='career'){
    careerList.slice(0,10).forEach((r,i)=>board.appendChild(moneyRow(r,i+1,r.n===me.name)));
    if(cRank>10){board.appendChild($(`<div class="sep"></div>`)); board.appendChild(moneyRow(careerList[cRank-1],cRank,true));}
  } else {
    byMoney.slice(0,10).forEach((r,i)=>board.appendChild(moneyRow(r,i+1,r.n===me.name)));
    if(moneyRank>10){board.appendChild($(`<div class="sep"></div>`)); board.appendChild(moneyRow(byMoney[moneyRank-1],moneyRank,true));}
  }
  left.appendChild(board);
  const recapBtn=$(`<button class="btn gold" style="margin-top:10px">Full Season Recap<span class="sub">Every event, leaderboard by leaderboard</span></button>`);
  recapBtn.onclick=()=>{S.recapEvent=null; S.recapYear=S.year||1; S.screen='recap'; render();}; left.appendChild(recapBtn);
  if(!S.daily && S.career && S.career.seasons.length>1){
    const c=S.career, ccol=c.net>=0?'#35d6a0':'#E14A33';
    left.appendChild($(`<h2 style="margin:16px 0 8px">Career · ${c.seasons.length} years (through Year ${S.year})</h2>`));
    const ct=$(`<div class="tiles"></div>`);
    ct.appendChild($(`<div class="tile"><div class="k">Net worth</div><div class="v" style="color:${ccol}">${fmtSigned(c.net)}</div></div>`));
    ct.appendChild(tile('Career earnings',fmt(c.money),true));
    ct.appendChild(tile('Career rank',cRank+' / '+careerList.length));
    ct.appendChild(tile('Career wins',c.wins+''));
    ct.appendChild(tile('Career majors',c.majors+''));
    ct.appendChild(tile('Top 10s',c.top10+''));
    const bestS=(c.seasons||[]).reduce((m,s)=>(!m||s.money>m.money)?s:m,null);
    if(bestS) ct.appendChild($(`<div class="tile"><div class="k">Season high</div><div class="v cream" style="font-size:17px">${fmt(bestS.money)}</div><div class="small muted" style="font-size:10px;margin-top:2px">Year ${bestS.year}</div></div>`));
    left.appendChild(ct);
    // Wins + seasons, grouped into dropdowns so a long career stays readable
    const wl=(c.winsList||[]);
    const majWins=wl.filter(w=>w.major).length;
    left.appendChild($(`<h3 style="margin:16px 0 7px;font-size:14px;letter-spacing:.02em">Wins <span class="small muted" style="font-weight:600">· ${wl.length}${majWins?` · ${majWins} major${majWins>1?'s':''}`:''}</span></h3>`));
    if(!wl.length) left.appendChild($(`<div class="scout small muted" style="margin-top:2px">No tournament wins yet, keep grinding.</div>`));
    else if(majWins) left.appendChild($(careerMajorsHTML(c)));
    left.appendChild($(`<h3 style="margin:16px 0 7px;font-size:14px;letter-spacing:.02em">Season by season <span class="small muted" style="font-weight:600">· ${c.seasons.length} yrs · tap a year for its wins</span></h3>`));
    left.appendChild($(`<div>${careerSeasonsHTML(c)}</div>`));
    // the career share CARD lives only on the end-of-career ceremony now, here we just point to it
    left.appendChild($(`<div class="scout small muted" style="margin-top:12px;text-align:center">Your shareable career card unlocks when you finish your career.</div>`));
  }

  const wreath=t.wins>0?` 🏆×${t.wins}`:'';
  const finTxt=(t.wins>0?`${t.wins} win${t.wins>1?'s':''}`:`best ${bestTxt(t.best)}`);
  const headLine=HL?`${HL.lead.icon} ${HL.lead.head}, `:'';
  const share=`⛳ RUNTHETOUR, ${me.name} (OVR ${ovr})\n${headLine}Year ${S.year||1}: ${fmt(t.money)} earned · #${moneyRank} of ${N}${wreath}\n${t.wins}W · ${t.majors} major${t.majors===1?'':'s'} · ${finTxt}\nThink you can build better? → https://runthe.gg/golf`;
  right.appendChild($(`<h2 style="margin:2px 0 2px">Share your season</h2>`));
  right.appendChild($(`<p class="small muted" style="margin:0 0 10px">Post your card and dare a friend to beat your number.</p>`));
  const vals=CATS.map(c=> S.slots[c.k]? S.slots[c.k].value : REPLACEMENT);
  const cv=document.createElement('canvas');
  cv.style.cssText='width:100%;max-width:320px;display:block;margin:0 auto 4px;border-radius:14px;border:1px solid var(--line)';
  cv.setAttribute('role','img');
  cv.setAttribute('aria-label',`Season share card: ${esc(me.name)}, overall ${ovr}, ${fmt(t.money)} earned, ${t.wins} wins, ${t.majors} majors`);
  drawShareCard(cv,{name:me.name,ovr,year:S.year||1,events:S.schedule.length,majors:S.schedule.filter(e=>e.major).length,money:t.money,net:ec.net,moneyRank,N,wins:t.wins,majorsWon:t.majors,best:t.best,fedexRank},vals);
  right.appendChild(cv);
  // primary CTA = Share (bold); Save + Copy are secondary
  const sh=$(`<button class="btn goldfill" style="margin-top:10px">↗ Share my season<span class="sub">Card + caption, ready to post</span></button>`);
  sh.onclick=()=>{track('result_shared');shareCard(cv,share,me.name);};
  right.appendChild(sh);
  const row=$(`<div class="mini" style="margin-top:8px"></div>`);
  const dl=$(`<button class="btn ghost">⤓ Save card</button>`);
  const cp=$(`<button class="btn ghost">Copy text</button>`);
  dl.onclick=()=>{track('result_saved');cv.toBlob(b=>{if(!b)return;const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=((me.name||'golfer').replace(/\s+/g,'-'))+'-season.png';a.click();URL.revokeObjectURL(u);});};
  cp.onclick=()=>{track('result_copied');navigator.clipboard?.writeText(share); cp.textContent='Copied ✓'; setTimeout(()=>cp.textContent='Copy text',1400);};
  row.appendChild(dl); row.appendChild(cp); right.appendChild(row);
  right.appendChild($(`<div class="sep" style="margin:16px 0"></div>`));
  if(S.daily){
    const again=$(`<button class="btn red">Build Another Golfer</button>`);
    again.onclick=()=>{reset();render();}; right.appendChild(again);
  } else {
    const lastYear=S.circuitMode?circuitOver():((S.year||1)>=CAREER_MAX_YEARS);
    const declining=pastPeak();
    const circuitYear2=S.circuitMode?((S.year||1)-(S.circuitStartYear||1)+1):null;
    right.appendChild($(`<div class="small center" style="margin:0 0 10px;color:#35d6a0;font-weight:700">✓ Progress auto-saved, your career is checkpointed at the home screen</div>`));
    const cont=$(`<button class="btn goldfill">${lastYear?(S.circuitMode?'Finish Legend Circuit ▸':'Finish Career ▸'):'Continue to Year '+((S.year||1)+1)+' ▸'}<span class="sub">${lastYear
      ? (S.circuitMode?('Year '+CIRCUIT_MAX_YEARS+' was your last, circuit ceremony'):('Year '+CAREER_MAX_YEARS+' was your last, career ceremony'))
      : (S.circuitMode?('Legend Circuit · year '+(circuitYear2+1)+' of '+CIRCUIT_MAX_YEARS+(declining?' · skills are declining (re-spin to repair)':'')+' · off-season, then a new season')
        :('Career Mode · year '+((S.year||1)+1)+' of '+CAREER_MAX_YEARS+(declining?' · skills are declining (re-spin to repair)':'')+' · off-season, then a new season'))}</span></button>`);
    cont.onclick=continueFranchise; right.appendChild(cont);
    const save=$(`<button class="btn gold" style="margin-top:10px">Exit to Home<span class="sub">Already saved, come back and resume anytime</span></button>`);
    save.onclick=()=>{ saveCareer(summaryResumeExtra()); track('career_saved_exit',{year:S.year||1}); reset(); render(); };
    right.appendChild(save);
    const retire=$(`<button class="btn ghost" style="margin-top:10px">${S.circuitMode?'End Circuit Now':'Retire, End Career'}</button>`);
    retire.onclick=()=>{ S.circuitMode?endCircuit():endCareer('chose'); }; right.appendChild(retire);
    // right on the year-30 result page itself (not just the separate ceremony screen after "Finish
    // Career ▸"), finalizes the just-completed career exactly as "Finish Career" does, then drops
    // straight into the circuit's own off-season instead of lingering on the ceremony first.
    if(lastYear && !S.circuitMode && playerAge()>=CIRCUIT_MIN_AGE && sbSignedIn()){
      const joinCircuit=$(`<button class="btn teal" style="margin-top:10px">Join the Legend Circuit ▸<span class="sub">Face off against every retired legend on tour, at age ${playerAge()}</span></button>`);
      joinCircuit.onclick=()=>{ endCareer('age'); startCircuit(); }; right.appendChild(joinCircuit);
    }
  }
}

function dShotSeq(par,yards,strokes,rng,sk,opts){

    else if(rem()===1){ ftToHole=Math.max(3,(toPar<0?6+rng()*16:(30-18*appQ)+rng()*20)); sh.push({d:`${dClub(yards)} to ${dPick(rng,sides)} green, ${dFeet(ftToHole)} to hole`}); played++; }

// UI-FIRST: tapping Daily Challenge must ALWAYS change the screen immediately, on every browser/network.
// The earlier version `await`ed the server attempt-check BEFORE switching screens, so on a browser/network
// where that request stalled (e.g. iOS Chrome vs. iOS Safari, same WebKit engine but a flaky connection),
// the button appeared to "do nothing". Now we render the preview synchronously and enforce the account's
// 3-a-day cap in the BACKGROUND (enforceDailyAttempt) — it still bounces an over-cap player to the "done"
// overlay within a moment, and score submission / records are separately server-gated, so the cap holds.
function beginDailyAttempt(){
  if(dailyAttemptsLeft()<=0){ S.overlay='dailydone'; render(); return; }
  const seed=todayKey();
  const att=dailyAttempts(); reset();
  S.daily=true; S.dailySeed=seed; S.mode='daily'; S.dailyMode='round'; S.dailyAttempt=att;
  // course/conditions/hole-sim stay seeded by the day (fair, server-verifiable); only the draft
  // wheel is salted by attempt # so each of your 3 plays offers a fresh draft (still identical
  // across players for the same attempt number).
  S.drawRng=mulberry32((seed^0x2545f491^Math.imul(att+1,0x9e3779b1))>>>0);
  S.dailyCourse=dailyCourseKey(seed); S.dailyCond=dailyConditions(seed,S.dailyCourse); S.dailyPlan='balanced';
  track('daily_started',{seed,course:S.dailyCourse,attempt:att+1});
  S.screen=LS.get('bag_daily_howto_seen',false)?'dailyprev':'dailyintro'; render();   // INSTANT, never "does nothing"
  enforceDailyAttempt(seed);   // background: confirm the account isn't over its daily cap (fail-open, timeout-guarded)
}
// Signed-in players' 3-a-day cap is enforced by the ACCOUNT server-side, not just this browser's localStorage
// counter (otherwise signing into the same account on another browser/device, or clearing storage, would reset
// the counter and grant unlimited retries). Runs AFTER the preview is already showing, so it can never freeze
// the button. Fails OPEN on any network/RPC problem (offline, sb not loaded, migration not applied, timeout),
// matching the rest of the online backend; only an explicit "no attempts left" bounces the player out.
async function enforceDailyAttempt(seed){
  if(!sb || !sbSignedIn()) return;
  const withTimeout=(promise,ms)=>Promise.race([
    Promise.resolve(promise).then(v=>({v}),e=>({e})),
    new Promise(r=>setTimeout(()=>r({timeout:true}),ms))
  ]);
  try{
    const res=await withTimeout(sb.rpc('runtour_daily_attempt_start',{p_day:seed,p_max:DAILY_MAX_ATTEMPTS}), 6000);
    if(res.timeout || res.e){ return; }   // fail open, local gate stands
    const {data,error}=res.v||{};
    if(error){
      if(/no attempts left/i.test(error.message||'')){
        const cur=dailyState(); const st=(cur&&cur.date===seed)?cur:{date:seed,attempts:0};
        st.date=seed; st.attempts=DAILY_MAX_ATTEMPTS;
        if(!st.best){ const b=await withTimeout(fetchServerDailyBest(seed),6000); if(b&&b.v) st.best=b.v; }

        // so we never yank someone out mid-result. They genuinely used all attempts (likely on another device).
        if(S.daily && !S.dailyResult && ['dailyintro','dailyprev','setup','draft','build','dailyround'].includes(S.screen)){
          S.daily=false; S.overlay='dailydone'; S.screen='title'; render();
        }

      return;   // any other error: fail open
    }

      st.date=seed; st.attempts=Math.max(st.attempts||0,data); LS.set(acctKey('bag_daily'),st);
    }

}

  const hazWord=haz==='creek'?'the creek':haz==='cliff'?'the cliff edge':haz==='bunker'?'the bunkers':wet?'the water':'the trouble';

   can reconstruct these fields from it. GROW-ONLY (max/union) so it can only ever restore or raise a value,

/* ---------- cloud save: career saves, Legend Tokens, streak, daily stats, achievements, Spotlight ----------

   the same signed into the same account on any browser/device, not just this one. This is especially
   important on iOS, where a Home-Screen web app runs in a SEPARATE storage sandbox from Safari, so the
   same account can otherwise show different stats depending on which one you open it from.
   bag_career IS now included (the build-record fields: Builds / Best earned / Best OVR / Best net / Wins /
   Hall of Fame), because those were the ONE career stat with no server sync at all, which is exactly why
   they could show up on one browser and be zero on another for the same account. bag_courserecords (+ the
   legend bucket) are included for the same reason: the all-time Course Records screen reads the DEVICE's
   local record store (topped up from the global board by crLoad), so records set before the launch reset
   survived only in whichever browser set them (e.g. an iOS Home-Screen app) and read "unclaimed" elsewhere. The existing sbSyncStats/

    look: LS.get('bag_look', null),                // golfer identity/appearance + equipped title (last-write-wins by _ts)
    name: LS.get('bag_name', null),                // golfer name (rides with look's timestamp)

    legendTokens: legendTokens(),
    streak: LS.get(acctKey('bag_streak'), null),

// Grow-only merge of a course-records map: for each course, the LOWER round (to-par) wins, so a merge can
// only ever restore or improve a record, never erase or worsen one held on either device. Used to keep the

function mergeCareerSave(local, server){

function mergeLegendTokens(local, server){

async function flushPendingSeasons(){

      // `raise exception` for "set a username first" comes back as {error}, not a rejection. The old
      // code never checked `error` here, so a rejected submission was silently counted as posted and
      // dropped from this retry queue forever, the exact bug behind seasons vanishing without a trace.
      let error;

          p_skills:s.skills,p_career_id:s.careerId||null,p_rep_pts:(s.repPts!=null?s.repPts:achPoints())}));
      }
      if(error) throw error;

  // asc (true bottom N) gets its own key so both can be cached at once.

async function dbLoad(day){
  if(!sb){ dbCache={day,rows:[],ok:false}; render(); return; }
  try{ const {data,error}=await sb.rpc('runtour_daily_board',{p_day:day,p_limit:50});
    dbCache={day,rows:(data||[]),ok:!error};
  }catch(e){ dbCache={day,rows:[],ok:false}; }
  render();
}
async function dbLoadLegend(day){
  if(!sb){ dbCacheLegend={day,rows:[],ok:false}; render(); return; }
  try{ const {data,error}=await sb.rpc('runtour_daily_board',{p_day:day,p_limit:50,p_legend:true});
    dbCacheLegend={day,rows:(data||[]),ok:!error};
  }catch(e){ dbCacheLegend={day,rows:[],ok:false}; }
  render();
}
// The Supabase CDN script is now `defer`ed, so window.supabase may not exist yet at this point in the
// (non-deferred) inline script. Deferred external scripts run AFTER parsing but BEFORE DOMContentLoaded,
// so if it isn't ready, wait for DOMContentLoaded to run sbInit — accounts/leaderboard still initialize,
// just a few ms later. Nothing else depends on `sb` synchronously (the initial render() below is offline-safe).
if(window.supabase && window.supabase.createClient){ sbInit(); }
else { window.addEventListener('DOMContentLoaded', sbInit); }
try{ window.addEventListener('online', ()=>flushPendingSeasons()); }catch(e){}   // retry any unsubmitted seasons when back online
// Service worker: network-first for the HTML so a new deploy reaches players without a manual ?v= cache-bust,
// with a cached copy as the offline fallback. Feature-detected + fully guarded; never blocks or breaks the game.
if('serviceWorker' in navigator){ try{ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }catch(e){} }

track('game_start');
if(LS.get('bag_seen',false)) track('return_visit'); else LS.set('bag_seen',true);
render();
</script>
</body>
</html>
