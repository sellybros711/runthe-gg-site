<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Segue lab: the concert world</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/segue-icon_32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;600;700;800;900&family=Permanent+Marker&family=Shrikhand&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="lab.css?v=1" />
<style>
  /* LAYOUT B: THE VENUE IS THE MENU. One screen, no scrolling: a Goose night on a lawn, and every part
     of the grounds is a door. The stage plays, the tour bus has the dates, the soundboard has last
     night's setlist taped to it, the green room trailer is where you dress the band, and so on.
     Each sign is a real button; the scene behind it is a painting. */
  html,body{height:100%; overflow:hidden; background:#07051A;}
  .world{position:fixed; inset:0;}
  .world canvas{position:absolute; left:0; top:0; image-rendering:pixelated;}
  .hud{position:absolute; left:0; right:0; top:0; display:flex; justify-content:space-between; align-items:center;
    padding:calc(env(safe-area-inset-top,0px) + 40px) 12px 0; pointer-events:none;}
  .hud > *{pointer-events:auto;}
  .logo{display:flex; align-items:center; gap:8px; font-family:var(--hero); font-size:22px;
    text-shadow:2px 2px 0 var(--px);}
  .logo img{width:30px; height:30px; border-radius:7px; box-shadow:2px 2px 0 var(--px);}
  .acct{font-size:12.5px; font-weight:800; border:2px solid var(--px); background:#F6F2EA; color:#1B1726;
    padding:7px 12px; border-radius:2px; box-shadow:2px 2px 0 var(--px);}

  /* A SIGN IS A BUTTON. It sits on the thing it names, in that destination's colour, and the whole
     painted object under it is the hit area too. */
  .spot{position:absolute; background:none; border:0; padding:0; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start;}
  .spot .sign{font-family:var(--ui); font-size:13px; letter-spacing:1.2px; text-transform:uppercase; white-space:nowrap;
    color:#fff; background:var(--sc); border:2px solid var(--px); border-radius:2px; padding:3px 8px 2px;
    box-shadow:2px 2px 0 var(--px); transform:translateY(-70%); transition:transform .12s;}
  .spot:hover .sign, .spot:focus-visible .sign{transform:translateY(-85%) scale(1.06);}
  .spot:active .sign{transform:translateY(-60%);}
  .spot.play .sign{font-size:20px; padding:5px 16px 3px; letter-spacing:2px; animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{50%{box-shadow:2px 2px 0 var(--px), 0 0 18px var(--sc);}}

  /* The one call to action that is always on screen, at the thumb. */
  .cta{position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); transform:translateX(-50%);
    display:flex; gap:8px;}
  .cta .pxbtn{min-height:52px; font-size:16px; white-space:nowrap;}

  /* The panel a door opens: a sheet up from the bottom, over a dimmed scene. */
  .veil{position:fixed; inset:0; background:rgba(5,3,14,.55); opacity:0; pointer-events:none; transition:opacity .2s; z-index:60;}
  .veil.on{opacity:1; pointer-events:auto;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:61; max-height:78dvh; overflow:auto;
    background:#14102A; border-top:3px solid var(--sc, var(--teal)); box-shadow:0 -4px 0 var(--px);
    transform:translateY(105%); transition:transform .26s cubic-bezier(.33,1,.68,1);
    padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);}
  @media (min-width:760px){ .sheet{left:50%; right:auto; width:640px; margin-left:-320px; border:3px solid var(--sc); border-bottom:0;} }
  .sheet.on{transform:none;}
  .sh-hd{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .sh-hd h2{font-family:var(--ui); font-weight:400; font-size:24px; letter-spacing:1.6px; text-transform:uppercase; margin:0; color:var(--sc);}
  .sh-x{background:none; border:2px solid var(--line2); border-radius:2px; padding:6px 12px; font-weight:800; font-size:13px;}
  .sh-p{font-size:14px; font-weight:600; color:var(--mut); line-height:1.45; margin:0 0 12px;}
  .modes{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
  .mode{border:3px solid var(--px); border-radius:2px; padding:12px; display:flex; flex-direction:column; gap:6px;}
  .mode.free{background:var(--paper); color:var(--paper-ink);}
  .mode.daily{background:#0E0B1C; border-color:var(--teal);}
  .md-k{font-size:10.5px; font-weight:900; letter-spacing:2px; text-transform:uppercase; opacity:.75;}
  .md-t{font-family:var(--ui); font-size:24px; line-height:1;}
  .md-p{font-size:12.5px; font-weight:600; opacity:.8; flex:1;}
  .mode .pxbtn{font-size:14px; padding:0 8px; white-space:nowrap;}
  .dates{display:grid; gap:8px;}
  .date{display:flex; gap:12px; align-items:center; background:#140B05; border:2px solid #3A2A18; padding:10px 12px;}
  .date b{font-family:var(--hero); font-weight:400; color:#FFB347; font-size:20px; min-width:70px;}
  .date span{font-size:13px; font-weight:700; color:#F5D9A8;}
  .menu{background:#1B1726; border:3px solid #3a3550; padding:12px 14px; font-family:var(--hand); font-size:17px; line-height:1.6; color:#F6F2EA;}
  .menu li{list-style:none;} .menu ol{margin:0; padding:0;}
  .menu .px{color:#F2B632;}
  .roomrow{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px;}
  .roomrow img{width:100%; aspect-ratio:8/5; border:3px solid var(--px); image-rendering:pixelated; object-fit:cover;}
  .roomrow img.locked{filter:grayscale(1) brightness(.45);}
  .linkrow{display:flex; gap:8px; flex-wrap:wrap;}
</style>
</head>
<body>
<div class="labbar">Lab · Layout B · <a href="simple.html">see layout A</a></div>
<main class="world" id="world">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="hud">
    <div class="logo"><img src="/assets/segue-icon_192.png" alt=""><span>Segue</span></div>
    <button class="acct" type="button">Sign in</button>
  </div>
  <div id="spots"></div>
  <div class="cta"><button class="pxbtn" type="button" data-open="stage">Build your show</button></div>
</main>
<div class="veil" id="veil"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shHd">
  <div class="sh-hd"><h2 id="shHd"></h2><button class="sh-x" type="button" id="shX">Close</button></div>
  <div id="shBody"></div>
</section>

<script type="module">
/* THE WORLD IS THE GAME'S OWN RENDERER. stage.js draws it, in a room made of the stage kit's solids
   (grounds.js), with the band in their real frames and the crowd, sky and lights it draws every show.
   The page only hangs signs on it, worked out from the same feet the buildings were built in. */
import { latest, esc, daysUntil, shortDate, wardrobeHTML, mountWardrobe, setlistHTML, dress } from './lab.js?v=1';
import { createStage, ROOMS } from '../stage.js?v=20';
import { sx, sy, WPX, HPX } from '../world.js?v=5';
import { VENUE_LIST } from '../venues.js?v=2';
import { GROUNDS, SPOTS } from './grounds.js?v=1';

ROOMS.lab_tall = GROUNDS.tall; ROOMS.lab_wide = GROUNDS.wide;
const world = document.getElementById('world'), view = document.getElementById('scene');
let arr = innerWidth > innerHeight * 1.1 ? 'wide' : 'tall', stage = null, L = null;

const ROTATE = ['jam', 'closer', 'opener', 'peak', 'cover'];
function start(){
  if (stage) stage.destroy();
  stage = createStage(view, { venue: 'lab_' + arr, seed: 23, sync: true, shot: 'crowd', dress: { ...dress },
    you: { d: .3, rnd: null, seed: 5 }, reduce: matchMedia('(prefers-reduced-motion: reduce)').matches });
  // Not the end of the night: the band is playing, the lights are on the lawn.
  stage.cue({ kind: 'set', progress: .92 });
  stage.cue({ kind: 'song', instant: true, progress: .92, energy: .6, palette: 'jam' });
  placeSpots();
}
// A new song every so often, so the lights move round the grounds the way a show does.
let n = 0;
setInterval(() => { if (stage && !document.hidden) stage.cue({ kind: 'song', progress: .92, energy: .45 + Math.random() * .4, palette: ROTATE[n++ % ROTATE.length], hold: 7000 }); }, 7000);

/* The renderer's own camera, worked the same way it works it, so a sign lands on its building. */
function camera(){
  const dpr = devicePixelRatio || 1, cw = world.clientWidth, ch = world.clientHeight;
  const devW = Math.round(cw * dpr), devH = Math.round(ch * dpr);
  let k = Math.max(1, Math.round(devW / 340)); k = Math.max(k, Math.ceil(devW / WPX), Math.ceil(devH / HPX));
  const visW = Math.ceil(devW / k), visH = Math.ceil(devH / k), back = ROOMS['lab_' + arr].floor.back;
  const camX = Math.round(sx(0) - visW / 2), camY = Math.round(Math.min(Math.max(0, sy(back + .5, 0) + 5 - visH), HPX - visH));
  const u = k / dpr;
  return (x, y, z) => [(sx(x) - camX) * u, (sy(y, z) - camY) * u];
}
const SIGNS = [
  ['stage', 'Play', 'var(--c-home)', 'play'], ['board', 'Board', 'var(--c-board)'], ['foh', 'Last night', '#5a4a8a'],
  ['bus', 'Tour', 'var(--c-tour)'], ['trailer', 'Your band', 'var(--c-you)'], ['records', 'Songs', 'var(--c-songs)'],
  ['food', 'How it works', '#B8860B'], ['box', 'Your shows', 'var(--c-you)'], ['gate', 'Rooms', 'var(--c-home)'],
];
function placeSpots(){
  const host = document.getElementById('spots'), P = camera();
  const S = Object.assign({ stage: [-14, 14, -14.5, 0, 17] }, SPOTS[arr]);
  host.innerHTML = SIGNS.map(([id, label, c, cls]) => {
    const [x0, x1, y0, y1, h] = S[id], [l, t] = P(x0, y0, h), [r, b] = P(x1, y1, 0);
    return `<button type="button" class="spot ${cls || ''}" data-open="${id}" style="--sc:${c}; left:${l}px; top:${t}px; width:${r - l}px; height:${b - t}px"
      aria-label="${esc(label)}"><span class="sign">${esc(label)}</span></button>`;
  }).join('');
}
addEventListener('resize', () => { const a = innerWidth > innerHeight * 1.1 ? 'wide' : 'tall'; if (a !== arr){ arr = a; start(); } else placeSpots(); });
start();

// ── the panels ──────────────────────────────────────────────────────────────
const sheet = document.getElementById('sheet'), veil = document.getElementById('veil');
const today = new Date(), dayLbl = `${today.toLocaleString('en-US', { month: 'short' })} ${today.getDate()}`;
const PANELS = {
  stage: () => ['Play', 'var(--c-home)', `<div class="modes">
      <section class="mode free"><span class="md-k">Free play</span><span class="md-t">Build a setlist</span>
        <span class="md-p">Random nights, as many as you like.</span><a class="pxbtn ink" href="/setlist/">Build your show</a></section>
      <section class="mode daily"><span class="md-k" style="color:var(--teal)">Daily · ${esc(dayLbl)}</span><span class="md-t">Today's shows</span>
        <span class="md-p">Same shows for everyone. One try.</span><a class="pxbtn" href="/setlist/">Build your show</a></section></div>`],
  board: () => ['Board', 'var(--c-board)', `<p class="sh-p">Today's best shows, and the all-time board.</p><div class="linkrow"><a class="pxbtn" href="/setlist/">Open the leaderboard</a></div>`],
  foh: () => ['Last night', '#8a7ae0', L ? `<div class="paper"><div class="pp-k">Last show</div><div class="pp-h">${esc(new Date(L.last.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }))}</div><div class="pp-p">${esc(L.last.venue)}, ${esc(L.last.city)}</div>${setlistHTML(L.last)}</div>` : '<p class="sh-p">Loading...</p>'],
  bus: () => ['Tour', 'var(--c-tour)', `<div class="dates">${(L ? L.upcoming : []).map(u => { const d = daysUntil(u.date);
      return `<div class="date"><b>${esc(shortDate(u.date))}</b><span>${esc(u.venue)}, ${esc(u.city)}${u.state ? ', ' + esc(u.state) : ''}<br>${d === 0 ? 'Tonight' : `In ${d} day${d === 1 ? '' : 's'}`}</span></div>`; }).join('')}</div>`],
  trailer: () => ['Your band', 'var(--c-you)', `<p class="sh-p">Dress them here. Close this and they walk back on stage wearing it.</p>${wardrobeHTML()}`],
  records: () => ['Songs', 'var(--c-songs)', `<p class="sh-p">Every song they've played, how often, and how it feels.</p><div class="linkrow"><a class="pxbtn" href="/setlist/">Browse every song</a></div>`],
  food: () => ['How it works', '#E0A82E', `<div class="menu"><ol>
      <li><span class="px">1.</span> The wheel picks a real night. Not you.</li>
      <li><span class="px">2.</span> Take one song. It costs every second it ran.</li>
      <li><span class="px">3.</span> Fill 75, 70 and 10 minutes. Then the crowd decides.</li></ol></div>
      <p class="sh-p" style="margin-top:12px">Real segues are where the points are. Grabbing every monster jam is how you lose.</p>`],
  box: () => ['Your shows', 'var(--c-you)', `<p class="sh-p">The shows you were at, and every setlist you've built.</p><div class="linkrow"><a class="pxbtn" href="/setlist/">Track your shows</a></div>`],
  gate: () => ['Rooms', 'var(--c-home)', `<p class="sh-p">Earn new rooms by playing. One is drawn each show.</p><div class="roomrow">${VENUE_LIST.slice(0, 9).map(v => `<img src="/setlist/venues/${v.id}.png?v=4" alt="" class="${v.free ? '' : 'locked'}">`).join('')}</div>`],
};
let stopWardrobe = null, dressedAs = '';
function open(id){
  const [title, col, body] = PANELS[id]();
  sheet.style.setProperty('--sc', col);
  document.getElementById('shHd').textContent = title;
  const b = document.getElementById('shBody'); b.innerHTML = body;
  if (stopWardrobe){ stopWardrobe(); stopWardrobe = null; }
  if (id === 'trailer'){ stopWardrobe = mountWardrobe(b); dressedAs = JSON.stringify(dress); }
  sheet.classList.add('on'); veil.classList.add('on');
}
function close(){
  sheet.classList.remove('on'); veil.classList.remove('on');
  if (stopWardrobe){ stopWardrobe(); stopWardrobe = null; if (JSON.stringify(dress) !== dressedAs) start(); }
}
document.addEventListener('click', e => { const o = e.target.closest('[data-open]'); if (o) open(o.dataset.open); });
veil.addEventListener('click', close); document.getElementById('shX').addEventListener('click', close);
addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

L = await latest();
</script>
</body>
</html>
