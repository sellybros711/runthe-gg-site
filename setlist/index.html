function shareText(){
  const r = S.result;
  const lines = [];

  lines.push('SEGUE — ' + S.band.label.toUpperCase());
  lines.push('');

  S.sets.forEach((set, i) => {
    if (!set.length) return;
    if (i === ENCORE_INDEX) lines.push('E:');
    set.forEach((p, j) => {
      // Same test scoring uses, or the written setlist prints arrows the
      // scorecard paid nothing for: the TAKE has to have segued, not just the
      // song pair be one the band has played.
      const nxt = set[j + 1];
      const mark = nxt && String(p.is_segue) === 'true'
        && S.data.segues.has(`${p.song_id}|${nxt.song_id}`) ? ' >' : '';
      lines.push(p.song + mark);
    });
    lines.push('');
  });

  lines.push(`${r.total} pts · ${r.stats.songs} songs · ${fmtClock(r.totalUsed)}`);
  const got = r.breadth.filter(c => c.got).map(c => c.label.toLowerCase());
  if (got.length) lines.push(got.join(' · '));
  lines.push(`"${r.headline}"`);
  lines.push('');
  lines.push('runthe.gg/setlist');
  return lines.join('\n');
}


// ── loading / data ───────────────────────────────────────────────────────────
function renderLoading(msg){
  app.innerHTML = `<div class="loading"><div class="spinner"></div><div>${esc(msg)}</div></div>`;
}

const csvCache = new Map();
async function fetchBand(band){
  if (csvCache.has(band.id)) return csvCache.get(band.id);
  const res = await fetch(`${band.csv}?v=${DATA_VERSION}`);
  if (!res.ok){
    throw new Error(res.status === 404
      ? `No data file yet for ${band.label} — run scripts/setlist/ingest_band.mjs to build ${band.csv}.`
      : `Could not load ${band.csv} (${res.status}).`);
  }
  const data = loadBand(await res.text());
  if (drawableShows(data.shows).length < 12){
    throw new Error(`${band.label} has too few timed shows to build a night.`);
  }
  csvCache.set(band.id, data);
  return data;
}

// ── running a show ───────────────────────────────────────────────────────────
async function start(bandId){
  const band = BANDS.find(b => b.id === bandId);
  if (!band) return;

  S.band = band; S.error = '';
  setScreen('loading');
  renderLoading(`Loading the ${band.label} archive…`);

  try {
    S.data = await fetchBand(band);
  } catch (e){
    S.error = e.message;
    setScreen('home');
    return;
  }

  // Fresh draw every run — there is no shared/seeded mode yet.
  S.rng = mulberry32(hash32(`${bandId}|${Date.now()}|${Math.random()}`));
  S.round = 0;
  S.sets = [[], [], []];
  S.closed = [false, false, false];
  S.spent = [0, 0, 0];
  S.respins = 0;
  S.seenShows = new Set();
  S.seenSongs = [];
  S.pickedSong = null; S.sheetForced = false;
  S.hint = ''; S.hintBad = false; S.result = null;
  drawShow();
  setScreen('reveal');
}

/** Draw tonight's show — never the same one twice in a run. */
function drawShow(){
  const all = drawableShows(S.data.shows);
  const fresh = all.filter(x => !S.seenShows.has(x.show_id));
  const from = fresh.length ? fresh : all;
  S.show = from[Math.floor(S.rng() * from.length)];
  S.seenShows.add(S.show.show_id);
  // Everything they were offered, for "the one that got away".
  S.show.songs.forEach(p => S.seenSongs.push(p));
}

/** Index of the set being built, or -1 when the show is over. */
function currentSet(){
  return S.closed.findIndex((c, i) => !c && !setFull(S.sets, i));
}

function lockedSongIds(){
  return new Set(S.sets.flat().map(p => p.song_id));
}

function lockIn(){
  const song = S.pickedSong;
  const si = currentSet();
  if (!song || si === -1) return;
  if (lockedSongIds().has(song.song_id)) return;
  if (!canPlace(S.sets, si, song, S.closed, S.spent)) return;

  S.sets[si].push(song);
  S.pickedSong = null; S.hint = ''; S.hintBad = false; S.sheetForced = false;

  // A set that can hold nothing more closes itself, so the player is never left
  // staring at a set with forty seconds in it.
  if (setFull(S.sets, si) && !danglingSegue(S.sets, si)) S.closed[si] = true;
  nextRound();
}

/**
 * Close the current set. Whatever is left flows to the encore.
 *
 * Deliberately does NOT draw a new show. The show on screen is the night's
 * source material, not a per-set handout — closing Set I while looking at a
 * good show should drop you straight into Set II still holding it. Re-spinning
 * here also handed out a free reroll, which is exactly what respins cost time
 * to prevent.
 */
function closeSet(){
  const si = currentSet();
  if (si === -1) return;
  const dangling = danglingSegue(S.sets, si);
  const taken = lockedSongIds();
  const couldLand = S.show && S.show.songs.some(p =>
    !taken.has(p.song_id) && canPlace(S.sets, si, p, S.closed, S.spent));
  if (dangling && couldLand){
    S.hint = `${dangling.song} segues — play what it runs into before closing.`;
    S.hintBad = true;
    renderDraft();
    return;
  }
  S.closed[si] = true;
  S.pickedSong = null; S.hint = ''; S.hintBad = false; S.sheetForced = false;
  if (currentSet() === -1){ finishShow(); return; }
  renderDraft();
}

/** Reject this show and draw another, at a price. */
function respin(){
  const si = currentSet();
  if (si === -1) return;
  if (!canRespin(S.sets, si, S.respins, S.closed, S.spent)) return;
  S.spent[si] += respinCost(S.respins);
  S.respins += 1;
  S.pickedSong = null; S.sheetForced = false;
  S.hint = ''; S.hintBad = false;
  drawShow();
  setScreen('reveal');
}

function nextRound(){
  if (currentSet() === -1){ finishShow(); return; }
  S.round += 1;
  if (S.round >= MAX_ROUNDS){ finishShow(); return; }
  drawShow();
  setScreen('reveal');
}

function finishShow(){
  S.result = scoreShow(S.sets, S.data.segues, S.spent, S.data.segueCounts);
  S.missed = theOneThatGotAway(S.seenSongs, S.sets);
  setScreen('show');
}

/* THE SHOW.
 *
 * A score you are handed is a number. A score that arrives one song at a time,
 * with the room reacting, is a gig. Same arithmetic either way — this just
 * plays it in the order it would have happened, which is the order the player
 * built it in.
 *
 * Every beat is derived from the already-computed result, so nothing here can
 * disagree with the breakdown that follows it.
 */
function showBeats(){
  const r = S.result;
  const beats = [];
  let running = 0, played = 0;

  S.sets.forEach((set, si) => {
    if (!set.length) return;
    beats.push({ kind: 'set', label: SETS[si].label, running, played });

    set.forEach((perf, j) => {
      const sc = r.perSet[si][j].score;
      running += sc.subtotal;
      // A segue INTO this song is the loud part, so it rides with the song.
      const seg = r.segues.find(x => x.set === si && x.to === j);
      if (seg) running += seg.points;
      played += 1;
      beats.push({
        kind: 'song', perf, sc, running, played,
        role: r.perSet[si][j].role.name,
        gained: sc.subtotal,
        reaction: reactionFor(sc, perf, j + si * 7 + perf.song.length),
        event: seg ? eventLine(seg.kinds, j + perf.song.length) : null,
        segPoints: seg ? seg.points : 0,
      });
    });

    const t = r.time[si];
    running += t.points;
    beats.push({ kind: 'time', label: SETS[si].label, note: t.note,
      points: t.points, used: t.used, budget: t.budget, running, played });
  });

  // Whatever is left is the whole-night stuff: arc, breadth, and the verdict.
  const rest = r.total - running;
  beats.push({ kind: 'final', rest, running: r.total, played, headline: r.headline });
  const totalSongs = played || 1;
  beats.forEach(b => { b.progress = Math.min(1, (b.played || 0) / totalSongs); });
  beats[beats.length - 1].progress = 1;
  return beats;
}

function renderShow(){
  const beats = showBeats();
  app.innerHTML = `
    <div class="showsim" id="showSim">
      <div class="card sim-head">
        <div class="eyebrow">The show</div>
        <div class="sim-score" id="simScore">0</div>
        <div class="sim-sub" id="simSub">Lights down.</div>
      </div>
      <div class="sim-feed" id="simFeed"></div>
      <div class="skip" id="simSkip">Tap to skip &rarr;</div>
    </div>`;

  const feed = document.getElementById('simFeed');
  const scoreEl = document.getElementById('simScore');
  const subEl = document.getElementById('simSub');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let i = 0, stopped = false;
  const paint = b => {
    if (b.kind === 'set'){
      feed.insertAdjacentHTML('beforeend',
        `<div class="sim-set">${esc(b.label)}</div>`);
      subEl.textContent = setOpenLine(SETS.findIndex(x => x.label === b.label));
    } else if (b.kind === 'song'){
      feed.insertAdjacentHTML('beforeend', `
        <div class="sim-song">
          ${b.event ? `<div class="sim-seg">&rsaquo; ${esc(b.event)}${
            b.segPoints ? ` <b>+${b.segPoints}</b>` : ''}</div>` : ''}
          <div class="sim-row">
            <span class="sim-nm">${esc(b.perf.song)}</span>
            <span class="sim-pts">+${b.gained}</span>
          </div>
          <div class="sim-react">${esc(b.reaction)}</div>
        </div>`);
      subEl.textContent = b.perf.song;
    } else if (b.kind === 'time'){
      feed.insertAdjacentHTML('beforeend', `
        <div class="sim-time">${esc(b.label)} ran ${fmtClock(b.used)} of ${fmtClock(b.budget)}
          — ${esc(b.note)} <b>+${b.points}</b></div>`);
    } else {
      feed.insertAdjacentHTML('beforeend', `
        <div class="sim-final">
          <div class="sim-rest">Flow and the rest of the night <b>+${b.rest}</b></div>
          <div class="headline">&ldquo;${esc(b.headline)}&rdquo;</div>
          <button class="btn primary" type="button" id="toResult">See the scorecard</button>
        </div>`);
      subEl.textContent = 'House lights.';
    }
    scoreEl.textContent = b.running;
    // Too few songs in and a projection is noise, so hold the neutral colour.
    scoreEl.className = 'sim-score grade-' + ((b.played || 0) < GRADE_SETTLE
      ? 'warm' : gradeRunning(b.running, b.progress));
    feed.lastElementChild.scrollIntoView({ block: 'nearest',
      behavior: reduce ? 'auto' : 'smooth' });
  };

  const step = () => {
    if (stopped) return;
    if (i >= beats.length) return;
    const b = beats[i++];
    paint(b);
    const wait = b.kind === 'song' ? (b.event ? 1150 : 850)
      : b.kind === 'set' ? 700 : b.kind === 'time' ? 750 : 0;
    if (i < beats.length) S.revealTimer = setTimeout(step, wait);
  };

  const skip = () => {
    if (stopped) return;
    stopped = true;
    clearTimeout(S.revealTimer);
    while (i < beats.length){ const b = beats[i++]; paint(b); }
    stopped = false;
    i = beats.length;
    const sk = document.getElementById('simSkip');
    if (sk) sk.remove();
  };
  document.getElementById('showSim').addEventListener('click', e => {
    if (e.target.closest('#toResult')){ setScreen('result'); return; }
    skip();
  });

  if (reduce){ skip(); return; }
  S.revealTimer = setTimeout(step, 500);
}

function render(){
  if (S.screen === 'home')    return renderHome();
  if (S.screen === 'loading') return;
  if (S.screen === 'reveal')  return renderReveal();
  if (S.screen === 'draft')   return renderDraft();
  if (S.screen === 'show')    return renderShow();
  if (S.screen === 'result')  return renderResult();
}

// ── events ───────────────────────────────────────────────────────────────────
app.addEventListener('click', e => {
  const startBtn = e.target.closest('[data-start]');
  if (startBtn && !startBtn.disabled){
    start(startBtn.dataset.start);
    return;
  }

  // Sheet scrim: a tap outside the panel puts the song back.
  if (e.target.id === 'slotCol'){
    S.pickedSong = null; S.sheetForced = false; S.hint = ''; S.hintBad = false;
    renderDraft();
    return;
  }

  const songBtn = e.target.closest('[data-song]');
  if (songBtn){
    if (songBtn.disabled) return;
    const show = S.show;
    const s = show.songs[Number(songBtn.dataset.song)];
    if (s !== S.pickedSong && lockedSongIds().has(s.song_id)){
      S.hint = `${s.song} is already in your show.`;
      S.hintBad = true; renderDraft(); return;
    }
    const si = currentSet();
    if (s !== S.pickedSong && si !== -1 && !canPlace(S.sets, si, s, S.closed, S.spent)){
      S.hint = `No room for ${fmtClock(lenOf(s))} in ${SETS[si].label}.`;
      S.hintBad = true; renderDraft(); return;
    }
    S.pickedSong = S.pickedSong === s ? null : s;
    S.hint = S.pickedSong ? `Play it, or pick a different one.` : '';
    S.hintBad = false;
    renderDraft();
    return;
  }


  if (e.target.closest('#lockBtn')){ lockIn(); return; }
  if (e.target.closest('#closeSetBtn')){ closeSet(); return; }
  if (e.target.closest('#respinBtn')){ respin(); return; }
  if (e.target.closest('#sofarTog')){ S.sofarAll = !S.sofarAll; renderDraft(); return; }
  if (e.target.closest('#openSets')){
    S.sheetForced = !S.sheetForced; renderDraft(); return;
  }
  if (e.target.closest('#homeBtn')){ setScreen('home'); return; }

  const peek = e.target.closest('[data-peek]');
  if (peek){ openDetail(Number(peek.dataset.peek)); return; }

  const share = e.target.closest('#shareBtn');
  if (share){
    const text = shareText();
    navigator.clipboard.writeText(text).then(() => {
      share.textContent = 'Copied';
      setTimeout(() => { share.textContent = 'Copy score card'; }, 2200);
    }).catch(() => { window.prompt('Copy your score card:', text); });
  }
});

// ── theme toggle ─────────────────────────────────────────────────────────────
document.getElementById('themeBtn').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('runthegrid_theme', next); } catch(e){}
  const meta = document.getElementById('themeMeta');
  if (meta) meta.setAttribute('content', next === 'light' ? '#EEF2F7' : '#071426');
});

render();
</script>
</body>
</html>
