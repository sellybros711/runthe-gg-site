<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Segue: The Setlist Builder Game | RunThe.GG</title>
<meta name="theme-color" content="#071426" id="themeMeta" />
<script>
/* theme boot: runs before first paint. Manual choice persists in
   runthegrid_theme (shared across the suite); otherwise follow the system. */
(function(){
  var t; try{ t = localStorage.getItem('runthegrid_theme'); }catch(e){}
  if(t !== 'light' && t !== 'dark'){
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<meta name="description" content="Segue is a setlist builder. Spin up a real concert, pull a song, spend it against your set clock — then watch your show play back to a crowd." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23071426'/%3E%3Cg fill='none' stroke-width='2.6'%3E%3Ccircle cx='16' cy='16' r='2' stroke='%23F06A5F'/%3E%3Ccircle cx='16' cy='16' r='5.2' stroke='%23F2B632'/%3E%3Ccircle cx='16' cy='16' r='8.4' stroke='%2348D17A'/%3E%3Ccircle cx='16' cy='16' r='11.6' stroke='%2337C5D5'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="/assets/runthegames-icon_180.png" />
<meta property="og:title" content="Segue: The Setlist Builder Game | RunThe.GG" />
<meta property="og:description" content="Build a setlist from real concerts. Two sets, an encore, and a curfew — then watch the show play back." />
<meta property="og:image" content="https://runthe.gg/assets/runthegames-og_1200x630.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  /* ---------------- design tokens (dark default + light override) ---------------- */
  :root{
    --bg:#071426; --card:#10233A; --card2:#162B44; --card3:#1A3350;
    --ink:#F4F7FB; --mut:#A9B8CB; --dim:#7C8DA3;
    --line:rgba(244,247,251,.08); --line2:rgba(244,247,251,.15);
    --teal:#37C5D5; --violet:#A982F3; --gold:#F2B632; --coral:#F06A5F;
    --blue:#2F6BFF; --green:#48D17A; --red:#FF625F;
    --tealT:#37C5D5; --goldT:#F2B632; --coralT:#F06A5F; --violetT:#B79BF6;
    --greenT:#48D17A; --redT:#FF625F; --blueT:#5C8CFF;
    /* Peak's own hue. It used to borrow --redT, which sits 3 degrees off
       --coralT, so COVER and PEAK chips were the same colour on screen. */
    --pinkT:#FF6FC1;
    --shadow:0 6px 18px -10px rgba(0,0,0,.55);
    --r-lg:14px; --r-md:10px; --r-sm:8px;
    /* Tie dye, from the existing accents rather than a new palette — the same
       five colours the chips and accent strips already use, swept round. */
    --dye:conic-gradient(from 210deg at 50% 50%,
      var(--coral) 0deg, var(--gold) 62deg, var(--green) 128deg,
      var(--teal) 196deg, var(--violet) 268deg, var(--coral) 360deg);
    /* Two display faces, split by size rather than by taste.
       --hero is the loud one: a 70s slab that belongs next to tie dye, and
       wide enough that the conic gradient sweeps its whole range across a
       word. Anton is so condensed the dye only ever showed two colours.
       --ui is that same condensed Anton, kept for the handful of small
       letterspaced labels where a slab turns to mush and, in the HUD, where
       a wider face would push "remaining" back out of a 390px screen. */
    --hero:'Alfa Slab One', Rockwell, Georgia, serif;
    --ui:'Anton', Impact, sans-serif;
    --body:'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#EEF2F7; --card:#FFFFFF; --card2:#F1F5FA; --card3:#E3EDF8;
    --ink:#0D1B2C; --mut:#51637A; --dim:#8B98A6;
    --line:rgba(13,27,44,.10); --line2:rgba(13,27,44,.18);
    --tealT:#0E7C89; --goldT:#A87508; --coralT:#D8452F; --violetT:#6D3BD6;
    --greenT:#17A34A; --redT:#C4372C; --blueT:#2358E0; --pinkT:#BE2E86;
    --shadow:0 6px 18px -12px rgba(13,27,44,.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  /* The hero's tie-dye spiral is deliberately larger than the hero and bleeds
     off both edges, which was adding ~59px of sideways scroll on a phone.
     overflow-x:clip and not hidden on purpose: clip trims the bleed without
     making the element a scroll container, so the sticky topbar, set panel and
     playback header keep sticking. */
  html,body{margin:0; padding:0; overflow-x:clip;}
  body{font-family:var(--body); color:var(--ink); min-height:100dvh;
    -webkit-font-smoothing:antialiased; background:var(--bg);}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; color:inherit; cursor:pointer;}
  :focus-visible{outline:2px solid var(--teal); outline-offset:2px; border-radius:4px;}
  .hidden{display:none !important;}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap; border:0;}

  /* ---------------- shell ---------------- */
  .wrap{width:100%; max-width:1080px; margin:0 auto;
    padding:0 18px calc(24px + env(safe-area-inset-bottom,0));}
  @media (max-width:640px){ .wrap{padding-left:14px; padding-right:14px;} }

  /* Sticky and short. The draft screen is the one a player sits on eight times
     a game, so every fixed pixel here is a pixel of song list they lose. */
  .topbar{position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:10px;
    padding:calc(8px + env(safe-area-inset-top,0)) 0 8px; background:var(--bg);
    border-bottom:1px solid var(--line);}
  .topbar:after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px;
    background:var(--dye); background-size:300% 100%; opacity:.5;
    animation:dyeSlide 22s linear infinite;}
  @keyframes dyeSlide{ from{background-position:0% 50%;} to{background-position:300% 50%;} }
  @media (prefers-reduced-motion: reduce){ .topbar:after{animation:none;} }
  body.playing .topbar{padding-bottom:6px;}
  body.playing .brand img{height:30px;}
  .icon-btn{width:34px; height:36px; display:inline-flex; align-items:center; justify-content:center;
    font-size:22px; color:var(--mut); flex:0 0 auto;}
  .icon-btn:hover{color:var(--ink);}
  .brand{display:inline-flex; align-items:center; line-height:0; min-width:0;}
  .brand img{height:44px; width:auto; display:block;}
  @media (max-width:640px){ .brand img{height:36px;} }
  .spacer{flex:1;}
  .themeBtn{width:36px; height:36px; border-radius:9px; border:1px solid var(--line2);
    background:var(--card); color:var(--mut); display:inline-flex; align-items:center;
    justify-content:center; box-shadow:var(--shadow); padding:0; flex:0 0 auto;}
  .themeBtn:hover{color:var(--ink); border-color:var(--teal);}
  .themeBtn .ic-moon{display:none;} .themeBtn .ic-sun{display:block;}
  :root[data-theme="light"] .themeBtn .ic-moon{display:block;}
  :root[data-theme="light"] .themeBtn .ic-sun{display:none;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg);
    box-shadow:var(--shadow);}
  .eyebrow{font-size:11px; font-weight:800; letter-spacing:2.4px; text-transform:uppercase;
    color:var(--dim);}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
    border-radius:var(--r-md); border:1px solid var(--line2); background:var(--card2);
    color:var(--ink); font-weight:800; font-size:15px; padding:13px 18px;
    transition:background .15s, border-color .15s, color .15s, transform .1s;}
  .btn:hover{border-color:var(--teal);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--teal); border-color:var(--teal); color:#04121F;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}
  .btn.ghost{background:transparent;}

  /* ---------------- home ---------------- */
  .hero{text-align:center; padding:16px 0 20px; position:relative; isolation:isolate;}
  .hero:before{
    content:''; position:absolute; z-index:-1; left:50%; top:38%;
    width:min(560px, 130vw); aspect-ratio:1; transform:translate(-50%,-50%);
    background:var(--dye);
    /* Concentric rings turn the sweep into a spiral without an image. */
    -webkit-mask:
      repeating-radial-gradient(circle at 50% 50%, #000 0 7px, transparent 7px 20px),
      radial-gradient(circle at 50% 50%, #000 12%, rgba(0,0,0,.55) 42%, transparent 70%);
    -webkit-mask-composite:source-in;
    mask:
      repeating-radial-gradient(circle at 50% 50%, #000 0 7px, transparent 7px 20px),
      radial-gradient(circle at 50% 50%, #000 12%, rgba(0,0,0,.55) 42%, transparent 70%);
    mask-composite:intersect;
    opacity:.10; pointer-events:none;
  }
  :root[data-theme="light"] .hero:before{opacity:.09;}
  /* No added tracking: the slab carries its own sidebearings, and at 40px on a
     320px screen the extra half-pixel per letter is the difference between
     filling the line and running past the gutter. */
  .hero h1{font-family:var(--hero); font-size:clamp(38px,9.2vw,68px); line-height:.94;
    letter-spacing:0; margin:5px 0 9px; text-transform:uppercase;}
  .hero h1 .accent{color:var(--gold);}
  /* @supports so a browser without background-clip:text still shows the word in
     gold rather than showing nothing at all. */
  @supports (-webkit-background-clip: text) or (background-clip: text) {
    .hero h1 .accent{
      background:var(--dye); background-size:180% 180%; background-position:50% 50%;
      -webkit-background-clip:text; background-clip:text;
      -webkit-text-fill-color:transparent; color:transparent;
      animation:dyeDrift 18s ease-in-out infinite;
    }
  }
  @keyframes dyeDrift{
    0%,100%{ background-position:44% 46%; }
    50%    { background-position:56% 54%; }
  }
  @media (prefers-reduced-motion: reduce){ .hero h1 .accent{animation:none;} }
  .tagline{font-size:13px; font-weight:800; letter-spacing:2.6px; text-transform:uppercase;
    color:var(--mut); margin:2px 0 10px;}
  @media (max-width:420px){ .tagline{font-size:11px; letter-spacing:1.8px;} }
  .hero p{max-width:34ch; margin:0 auto; color:var(--mut); font-size:15px; line-height:1.55;
    font-weight:600;}

  /* Three columns even on a phone: the copy is short, and stacked they cost
     three times the height for the same three sentences. */
  .steps{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:18px 0 16px;}
  .step{padding:11px 11px 12px; border-radius:var(--r-md); background:var(--card);
    border:1px solid var(--line);}
  .step b{display:block; font-family:var(--ui); font-size:18px; color:var(--teal); line-height:1;
    margin-bottom:5px;}
  .step span{font-size:11.5px; color:var(--mut); line-height:1.45; font-weight:600;}
  @media (max-width:420px){ .step{padding:9px 9px 10px;} .step span{font-size:11px;} }

  .bands{display:flex; flex-direction:column; gap:11px;}
  .band{padding:14px 16px 14px;}
  .band-hd{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    margin-bottom:4px;}
  .band-hd h2{font-family:var(--hero); font-size:30px; margin:0; text-transform:uppercase;
    letter-spacing:.5px;}
  .band-meta{font-size:12.5px; color:var(--dim); font-weight:700; margin-bottom:11px;}
  .band-actions{display:grid; grid-template-columns:1fr; gap:10px;}
  .warn{margin-top:12px; padding:11px 13px; border-radius:var(--r-sm); font-size:13px;
    font-weight:700; line-height:1.5; background:color-mix(in srgb,var(--gold) 12%, transparent);
    border:1px solid color-mix(in srgb,var(--gold) 34%, transparent); color:var(--goldT);}
  .err{margin-top:12px; padding:11px 13px; border-radius:var(--r-sm); font-size:13px;
    font-weight:700; line-height:1.5; background:color-mix(in srgb,var(--red) 12%, transparent);
    border:1px solid color-mix(in srgb,var(--red) 34%, transparent); color:var(--redT);}

  /* ---------------- reveal ---------------- */
  .reveal{min-height:70dvh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:22px; text-align:center;}
  .reveal-win{width:100%; max-width:520px; border-radius:var(--r-lg); overflow:hidden;
    border:1px solid var(--line2); background:var(--card); box-shadow:var(--shadow);
    transition:border-color .35s, box-shadow .35s;}
  .reveal-win.landed{border-color:var(--gold);
    box-shadow:0 0 0 1px var(--gold), 0 12px 40px -14px color-mix(in srgb,var(--gold) 60%, transparent);}
  .reveal-bar{display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 16px; background:var(--card2); border-bottom:1px solid var(--line);}
  .reveal-bar .n{font-weight:900; font-size:13px; color:var(--mut); font-variant-numeric:tabular-nums;}
  .reveal-body{padding:34px 22px; min-height:186px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:7px;}
  .reveal-date{font-family:var(--hero); font-size:clamp(28px,7vw,40px); line-height:1.02;
    color:var(--dim); transition:color .3s;}
  .landed .reveal-date{color:var(--ink);}
  .reveal-venue{font-size:15px; font-weight:800; color:var(--dim); transition:color .3s;}
  .landed .reveal-venue{color:var(--tealT);}
  .reveal-city{font-size:13px; font-weight:600; color:var(--dim);}
  .reveal-count{margin-top:8px; font-size:12px; font-weight:800; letter-spacing:1.6px;
    text-transform:uppercase; color:var(--goldT);}
  .reveal-cue{font-size:13px; font-weight:800; letter-spacing:2px; text-transform:uppercase;
    color:var(--mut);}

  /* ---------------- draft ---------------- */
  .hud{display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:9px 14px; margin-bottom:10px;}
  .hud{gap:8px;}
  .hud > div:first-child{min-width:0;}
  .hud .rd{font-family:var(--ui); font-size:18px; line-height:1.05;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hud .rd-clock{color:var(--mut); font-variant-numeric:tabular-nums;
    transition:color .3s ease;}
  .hud .rd-clock.warn{color:var(--goldT);}
  .hud .rd-clock.crit{color:var(--redT); animation:clockPulse 1.6s ease-in-out infinite;}
  @keyframes clockPulse{ 0%,100%{opacity:1;} 50%{opacity:.55;} }
  @media (prefers-reduced-motion: reduce){ .hud .rd-clock.crit{animation:none;} }
  .hud .rd-rem{color:var(--dim);}
  .hud .rd-rem.warn{color:var(--goldT);}
  .hud .rd-rem.crit{color:var(--redT);}
  .hud .md{font-size:11px; font-weight:800; letter-spacing:2px; text-transform:uppercase;
    color:var(--dim); margin-top:3px;}
  .pips{display:flex; gap:5px;}
  .pip{width:9px; height:9px; border-radius:50%; background:var(--line2);}
  .pip.done{background:var(--gold);} .pip.now{background:var(--teal); transform:scale(1.25);}

  .board{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:18px; align-items:start;}

  /* Under 860 the setlist panel stops being a column and becomes a bottom sheet.
     Same markup either way — only this block decides which it is — so there is
     one draft interaction to reason about, not two. */
  @media (max-width:860px){
    .board{grid-template-columns:minmax(0,1fr);}
    .board > .slotcol{position:fixed; inset:0; z-index:60; display:flex;
      align-items:flex-end; justify-content:center; background:rgba(0,0,0,0);
      visibility:hidden; pointer-events:none;
      transition:background .28s ease, visibility 0s .28s;}
    body.sheet-on .board > .slotcol{visibility:visible; pointer-events:auto;
      background:rgba(0,0,0,.62); transition:background .28s ease, visibility 0s;}
    .board > .slotcol > .setlist{width:100%; max-width:560px; margin:0;
      border-radius:18px 18px 0 0; border-bottom:0; max-height:84dvh; overflow-y:auto;
      padding-bottom:calc(14px + env(safe-area-inset-bottom,0));
      transform:translateY(100%); opacity:0;
      transition:transform .22s ease, opacity .16s ease;}
    body.sheet-on .board > .slotcol > .setlist{transform:translateY(0); opacity:1;
      transition:transform .34s cubic-bezier(.33,1,.68,1), opacity .22s ease;}
    .sheetgrab{display:block;}
  }
  .sheetgrab{display:none; width:38px; height:4px; border-radius:99px;
    background:var(--line2); margin:0 auto 12px;}

  .showcard{padding:11px 15px; margin-bottom:10px;}
  .showcard .d{font-family:var(--hero); font-size:21px; line-height:1.05;}
  .showcard .v{font-size:14px; font-weight:700; color:var(--tealT); margin-top:3px;}
  .showcard .c{font-size:13px; font-weight:600; color:var(--dim);}

  .setgrp{margin-bottom:14px;}
  .setgrp h3{font-size:11px; font-weight:900; letter-spacing:2.4px; text-transform:uppercase;
    color:var(--dim); margin:0 0 8px;}
  .songs{display:flex; flex-direction:column; gap:6px;}

  .song{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; width:100%;
    text-align:left; padding:10px 12px; border-radius:var(--r-sm); background:var(--card);
    border:1px solid var(--line); border-left:3px solid var(--acc, var(--line2));
    transition:background .15s, border-color .15s, transform .1s;}
  .song:hover{background:var(--card2);}
  .song.used{opacity:.4; cursor:not-allowed;}
  .song.used:hover{background:var(--card);}
  .song.used .t{text-decoration:line-through;}
  .segout{display:inline-block; margin-left:5px; font-weight:900; color:var(--goldT);
    font-size:16px; line-height:1; vertical-align:-1px;}
  .song .o.seg{color:var(--goldT);}
  .song .o.seg i{font-style:normal; color:var(--dim); font-weight:600;}
  .commit{margin-top:7px; padding:7px 10px; border-radius:var(--r-sm); font-size:11.5px;
    font-weight:700; line-height:1.45; color:var(--goldT);
    background:color-mix(in srgb,var(--gold) 12%, transparent);
    border:1px solid color-mix(in srgb,var(--gold) 30%, transparent);}
  .chip.sand{background:color-mix(in srgb,var(--violet) 22%, transparent); color:var(--violetT);
    border-color:color-mix(in srgb,var(--violet) 50%, transparent);}
  .chip.seg{background:color-mix(in srgb,var(--green) 20%, transparent); color:var(--greenT);
    border-color:color-mix(in srgb,var(--green) 50%, transparent);}
  .song.finishes{border-color:color-mix(in srgb,var(--green) 55%, transparent);}
  /* ---------------- the setlist so far ---------------- */
  .sofar{margin-bottom:10px; padding:9px 12px 7px; border-radius:var(--r-md);
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);}
  .sf-hd{display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    margin-bottom:5px;}
  .sf-hd b{font-size:10.5px; font-weight:900; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--dim);}
  .sf-tog{font-size:10.5px; font-weight:800; color:var(--tealT); background:none; border:0;
    padding:2px 0;}
  .sf-set + .sf-set{margin-top:6px;}
  .sf-lbl{font-size:9.5px; font-weight:900; letter-spacing:1.3px; text-transform:uppercase;
    color:var(--dim); margin:4px 0 2px;}
  .sf-row{display:flex; align-items:baseline; gap:8px; padding:2px 0; font-size:12.5px;}
  .sf-n{flex:0 0 14px; color:var(--dim); font-weight:800; font-size:10px;
    font-variant-numeric:tabular-nums;}
  .sf-song{flex:1; min-width:0; font-weight:700; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap;}
  .sf-seg{font-style:normal; color:var(--goldT); font-weight:900; margin-left:3px;}
  .sf-len{color:var(--mut); font-weight:700; font-variant-numeric:tabular-nums; font-size:11.5px;}
  .sf-none{font-size:12px; font-weight:600; color:var(--dim); padding:2px 0 3px;}

  .hunt{margin-bottom:10px; padding:9px 12px; border-radius:var(--r-sm); font-size:12.5px;
    font-weight:700; line-height:1.5; color:var(--mut);
    background:color-mix(in srgb,var(--gold) 10%, transparent);
    border:1px solid color-mix(in srgb,var(--gold) 30%, transparent);}
  .hunt b{color:var(--goldT);}
  .hunt.hot{background:color-mix(in srgb,var(--green) 12%, transparent);
    border-color:color-mix(in srgb,var(--green) 38%, transparent);}
  .hunt.hot b{color:var(--greenT);}

  .chip.rec{background:color-mix(in srgb,var(--violet) 20%, transparent); color:var(--violetT);
    border-color:color-mix(in srgb,var(--violet) 45%, transparent);}
  /* Selection rings in teal, the UI's action colour, not in the song's accent.
     Accent is identity; selection is a thing you did. It also stops a song
     with no notable role — now grey — from getting a grey selection ring. */
  .song[aria-pressed="true"]{background:var(--card3); border-color:var(--teal);
    box-shadow:0 0 0 1px var(--teal);}
  .song .t{font-weight:800; font-size:14.5px; line-height:1.25;}
  .song .o{font-size:11.5px; font-weight:600; color:var(--dim); margin-top:2px;}
  .song .r{display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0;}
  .song .len{font-size:12.5px; font-weight:800; color:var(--mut); font-variant-numeric:tabular-nums;}
  .chips{display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end;}
  .chip{font-size:9.5px; font-weight:900; letter-spacing:.7px; text-transform:uppercase;
    padding:2px 5px; border-radius:4px; background:var(--line); color:var(--mut);}
  /* The role chip is OUTLINED and the event chips (segue, sandwich,
     recommended, gap) are FILLED. Jam and RECOMMENDED are both violet and
     routinely sit side by side; gap and ENCORE are both gold. Rather than
     hunt for eleven distinguishable hues, the two families differ in shape,
     so a repeat of hue across families still reads as two different things. */
  .chip.acc{background:transparent; color:var(--acc);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 60%, transparent);}
  .chip.rare{background:color-mix(in srgb,var(--gold) 20%, transparent); color:var(--goldT);}

  /* ---------------- setlist panel ---------------- */
  .setlist{position:sticky; top:66px; padding:14px 16px 12px;}
  .setlist h2{font-family:var(--hero); font-size:22px; margin:0 0 2px; text-transform:uppercase;
    letter-spacing:.5px;}
  .setlist .sub{font-size:11.5px; font-weight:700; color:var(--dim); margin-bottom:12px;}
  .slotgrp{margin-bottom:10px;}
  .slotgrp .lbl{font-size:10px; font-weight:900; letter-spacing:2.2px; text-transform:uppercase;
    color:var(--dim); padding-bottom:5px; margin-bottom:6px; border-bottom:1px solid var(--line);}
  .slot{display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:7px 9px;
    border-radius:var(--r-sm); background:transparent; border:1px solid transparent;
    margin-bottom:3px; transition:background .15s, border-color .15s, box-shadow .2s;}
  .slot .nm{font-size:10.5px; font-weight:900; letter-spacing:.8px; text-transform:uppercase;
    color:var(--dim); width:64px; flex-shrink:0;}
  .slot .val{flex:1; min-width:0; font-weight:800; font-size:14px; line-height:1.25;
    color:var(--acc, var(--ink)); overflow:hidden; text-overflow:ellipsis;}
  .slot .rule{flex:1; height:0; border-bottom:1px dashed var(--line2);}
  .slot .pts{font-size:12.5px; font-weight:900; color:var(--mut); font-variant-numeric:tabular-nums;
    flex-shrink:0;}
  .slot.open{cursor:pointer;}
  .slot.open:hover{background:var(--card2);}
  .slot.sel{background:var(--card3); border-color:var(--teal);}
  .slot.fit-great{border-color:var(--green); box-shadow:0 0 0 1px color-mix(in srgb,var(--green) 55%, transparent);}
  .slot.fit-ok{border-color:var(--gold); box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 55%, transparent);}
  .slot.fit-bad{border-color:var(--red); box-shadow:0 0 0 1px color-mix(in srgb,var(--red) 55%, transparent);}
  .slot.filled{cursor:default;}
  .segue{display:flex; align-items:center; gap:6px; padding:1px 0 2px 73px; font-size:10.5px;
    font-weight:900; letter-spacing:1px; color:var(--violetT);}
  .setbreak{text-align:center; font-size:9.5px; font-weight:900; letter-spacing:2.4px;
    text-transform:uppercase; color:var(--dim); margin:8px 0;}
  .lockbar{margin-top:12px;}
  .hint{margin-top:9px; font-size:12px; font-weight:700; color:var(--dim); text-align:center;
    line-height:1.45; min-height:17px;}
  .hint.bad{color:var(--redT);}

  /* ---------------- result ---------------- */
  .result{max-width:600px; margin:0 auto;}
  .scorebox{text-align:center; padding:26px 20px 22px; margin-bottom:16px;}
  .scorebox .n{font-family:var(--hero); font-size:clamp(64px,17vw,104px); line-height:.9;
    font-variant-numeric:tabular-nums;}

  /* A score's colour is a rating and nothing else — green good, yellow middling,
     red weak — so no tie dye goes anywhere near one. The dye stays on identity
     (the wordmark, the top rule), where it has no number to contradict. */
  .grade-hot{color:var(--greenT);}
  .grade-warm{color:var(--goldT);}
  .grade-cold{color:var(--redT);}
  /* Four categories, two rows on a phone rather than four squeezed columns. */
  .breakdown{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin:16px 0;}
  @media (min-width:520px){ .breakdown{grid-template-columns:repeat(4,minmax(0,1fr));} }
  .bd{padding:12px 10px; text-align:center; border-radius:var(--r-md); background:var(--card2);
    border:1px solid var(--line);}
  .bd .v{font-family:var(--hero); font-size:24px; line-height:1;}
  .bd .k{font-size:10px; font-weight:900; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--dim); margin-top:5px;}
  .actions{display:flex; flex-direction:column; gap:9px; margin-top:14px;}

  /* ---------------- bottom sheet ----------------
     Same shape as The Perfect Season's: a scrim you can tap out of, a panel that
     rises from the bottom and caps its own height so it never pushes the page. */
  .sheet{position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end;
    justify-content:center; padding:0; background:rgba(0,0,0,0);
    visibility:hidden; pointer-events:none;
    transition:background .28s ease, visibility 0s .28s;}
  .sheet.on{visibility:visible; pointer-events:auto; background:rgba(0,0,0,.62);
    transition:background .28s ease, visibility 0s;}
  .sheet .inner{width:100%; max-width:560px; background:var(--card);
    border:1px solid var(--line2); border-bottom:0;
    border-radius:18px 18px 0 0; padding:8px 16px calc(16px + env(safe-area-inset-bottom,0));
    max-height:82dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    transform:translateY(100%); opacity:0;
    transition:transform .22s ease, opacity .16s ease;}
  .sheet.on .inner{transform:translateY(0); opacity:1;
    transition:transform .34s cubic-bezier(.33,1,.68,1), opacity .22s ease;}
  .grab{width:38px; height:4px; border-radius:99px; background:var(--line2);
    margin:4px auto 12px;}
  .sheet-hd{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    margin-bottom:10px;}
  .sheet-hd h2{font-family:var(--hero); font-size:21px; margin:0; text-transform:uppercase;
    letter-spacing:.5px;}
  .sheet-hd .x{font-size:12px; font-weight:800; color:var(--dim); background:none; border:0;
    padding:4px 2px;}

  .slot.tappable{width:100%; text-align:left; border:0; background:transparent;
    font-family:inherit; cursor:pointer;}
  .slot.tappable:hover{background:var(--card2);}
  .slot.tappable:after{content:'›'; color:var(--dim); font-size:17px; margin-left:2px;}


  /* ---------------- set clocks ---------------- */
  .setblk{padding:10px 0 4px; border-bottom:1px solid var(--line);}
  .setblk:last-child{border-bottom:0;}
  .setblk.done{opacity:.62;}
  .setblk.cur{opacity:1;}
  .set-hd{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .set-nm{font-size:11px; font-weight:900; letter-spacing:1.6px; text-transform:uppercase;}
  .setblk.cur .set-nm{color:var(--tealT);}
  .set-clock{font-size:12px; font-weight:800; color:var(--mut);
    font-variant-numeric:tabular-nums;}
  .set-clock.low{color:var(--coralT);}
  .set-sub{font-size:10.5px; font-weight:700; color:var(--dim); margin-top:4px;}
  .bar{height:6px; border-radius:99px; background:var(--card3); overflow:hidden; margin-top:6px;}
  .bar > span{display:block; height:100%; border-radius:99px; background:var(--teal);
    transition:width .3s ease;}
  .bar.good > span{background:var(--green);}
  .bar.bad > span{background:var(--coral);}
  .srow{display:flex; align-items:baseline; gap:8px; padding:4px 0 0; font-size:12px;}
  .sr-role{flex:0 0 52px; font-size:9px; font-weight:900; letter-spacing:.9px;
    text-transform:uppercase; color:var(--dim);}
  .sr-song{flex:1; min-width:0; font-weight:700; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap;}
  .sr-len{font-variant-numeric:tabular-nums; color:var(--mut); font-weight:700;}

  .rset{margin-bottom:14px;}
  .rset:last-child{margin-bottom:0;}
  .rset-hd{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .rs-nm{font-size:12px; font-weight:900; letter-spacing:1.6px; text-transform:uppercase;}
  .rs-clock{font-size:12.5px; font-weight:800; font-variant-numeric:tabular-nums;}
  .rs-clock i{font-style:normal; color:var(--dim); font-weight:700;}
  .rs-note{font-size:11.5px; font-weight:700; color:var(--mut); margin:5px 0 3px;}
  .rs-note b{color:var(--goldT);}
  .rs-empty{font-size:12px; color:var(--dim); font-weight:700; padding:6px 0;}

  .btn.tiny{width:auto; font-size:11.5px; padding:7px 11px; font-weight:800;}
  .hud-btns{display:flex; gap:6px; align-items:center; flex:0 0 auto;}
  .btn.tiny.spin{border-color:color-mix(in srgb,var(--gold) 45%, transparent);
    color:var(--goldT);}
  .btn.tiny.spin:disabled{border-color:var(--line2); color:var(--dim);}
  .nospin{font-size:10.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
    color:var(--dim);}

  /* ---------------- the reels ----------------
     A real slot reel is one transform on one element, not a stream of text
     swaps — the GPU interpolates it, so it stays smooth on a phone under load.
     Each reel is a fixed-height window over a tall strip; landing is just
     translating the strip so the target row sits in the window. */
  .reels{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .reel{position:relative; overflow:hidden; border-radius:var(--r-md);
    background:var(--card2); border:1px solid var(--line);}
  .reel.year{height:52px;}
  .reel.show{height:84px;}
  .reel:after{content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(var(--card2), transparent 34%, transparent 66%, var(--card2));}
  .reel-strip{will-change:transform;}
  .reel-item{display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 10px;}
  .reel.year .reel-item{height:52px;}
  .reel.show .reel-item{height:84px;}
  .ri-year{font-family:var(--hero); font-size:30px; line-height:1; letter-spacing:1px;}
  .ri-date{font-family:var(--hero); font-size:20px; line-height:1.1;}
  .ri-venue{font-size:12px; font-weight:700; color:var(--mut); margin-top:3px;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .reel.locked{border-color:color-mix(in srgb,var(--teal) 55%, transparent);}
  .reel.locked .ri-year, .reel.locked .ri-date{color:var(--tealT);}
  .reel-lbl{font-size:9.5px; font-weight:900; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--dim); margin-bottom:4px;}
  .skip{margin-top:12px; font-size:11px; font-weight:700; color:var(--dim);}
  .btn.small{font-size:13px; padding:9px 14px; margin-top:7px;}

  /* Closing a set is the pivotal irreversible move, so it reads as a real
     choice next to the primary rather than a footnote under it. */
  .btn.closeset{flex-direction:column; gap:1px; margin-top:8px; padding:10px 14px;
    background:transparent; border-style:dashed;}
  .btn.closeset .cs-t{font-size:14px; font-weight:800;}
  .btn.closeset .cs-s{font-size:11px; font-weight:700; color:var(--dim);}
  .btn.closeset:hover{border-color:var(--gold); border-style:solid;}
  /* When the set is nearly spent, or nothing fits, this IS the move. */
  .btn.closeset.urge{border-style:solid; border-color:var(--gold); background:
    color-mix(in srgb,var(--gold) 12%, transparent);}
  .btn.closeset.urge .cs-t{color:var(--goldT);}

  .banked{margin-top:5px; font-size:11px; font-weight:800; color:var(--greenT);}
  .banked b{font-variant-numeric:tabular-nums;}
  .burned{margin-top:3px; font-size:11px; font-weight:800; color:var(--coralT);
    font-variant-numeric:tabular-nums;}
  .bdlen{font-size:12px; color:var(--dim); font-weight:700;}
  .gotaway{padding:14px 16px; margin-top:12px;
    border-left:3px solid var(--coral);}
  .ga-lbl{font-size:10px; font-weight:900; letter-spacing:1.8px; text-transform:uppercase;
    color:var(--coralT);}
  .ga-song{font-family:var(--hero); font-size:22px; margin-top:4px; line-height:1.1;}
  .ga-len{font-family:var(--body); font-size:13px; font-weight:800; color:var(--mut);}
  .ga-meta{font-size:12px; font-weight:700; color:var(--dim); margin-top:3px;}
  .ga-why{font-size:12.5px; font-weight:600; color:var(--mut); line-height:1.5; margin-top:7px;}
  .ga-why b{color:var(--goldT);}

  .headline{font-size:15px; font-weight:800; line-height:1.4; margin-top:8px;
    color:var(--goldT); font-style:italic;}

  /* ---------------- the show playback ---------------- */
  .showsim{padding-top:6px;}
  .sim-head{position:sticky; top:52px; z-index:20; padding:12px 16px; text-align:center;
    margin-bottom:12px;}
  .sim-score{font-family:var(--hero); font-size:44px; line-height:1;
    font-variant-numeric:tabular-nums; transition:color .5s ease;}
  .sim-sub{font-size:12.5px; font-weight:700; color:var(--dim); margin-top:4px;
    min-height:1.2em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sim-feed{display:flex; flex-direction:column; gap:8px;}
  .sim-set{font-family:var(--ui); font-size:15px; letter-spacing:2px; text-transform:uppercase;
    color:var(--dim); padding:10px 0 2px; border-top:1px solid var(--line);}
  .sim-song{background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);
    padding:10px 13px; box-shadow:var(--shadow);
    animation:simIn .28s cubic-bezier(.16,.84,.3,1) both;}
  @keyframes simIn{ from{ opacity:0; transform:translateY(9px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .sim-song{animation:none;} }
  .sim-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .sim-nm{font-size:15.5px; font-weight:800; min-width:0;}
  .sim-pts{font-family:var(--hero); font-size:19px; color:var(--goldT); flex:0 0 auto;}
  .sim-react{font-size:12.5px; font-weight:600; color:var(--mut); margin-top:3px; font-style:italic;}
  .sim-seg{font-size:11.5px; font-weight:800; color:var(--violetT); margin-bottom:5px;}
  .sim-seg b{color:var(--goldT);}
  .sim-time{font-size:12px; font-weight:700; color:var(--mut); padding:2px 2px 6px;}
  .sim-time b{color:var(--goldT);}
  .sim-final{margin-top:10px; padding-top:12px; border-top:2px solid var(--line2); text-align:center;}
  .sim-rest{font-size:12.5px; font-weight:700; color:var(--mut);}
  .sim-rest b{color:var(--goldT);}
  .sim-final .headline{margin:8px 0 14px;}

  .toast{position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0)); z-index:99;
    transform:translateX(-50%) translateY(80px); background:var(--card3);
    border:1px solid var(--line2); padding:11px 17px; border-radius:10px;
    font-weight:800; font-size:13.5px; opacity:0; pointer-events:none;
    transition:transform .25s ease, opacity .25s ease; box-shadow:var(--shadow);}
  .toast.on{transform:translateX(-50%) translateY(0); opacity:1;}

  /* ---------------- result: how this scored ---------------- */
  .scoresheet{padding:18px; margin-top:14px;}
  .scoresheet h2{font-family:var(--hero); font-size:24px; margin:0 0 4px; text-transform:uppercase;}
  .scoresheet .sub{font-size:13px; color:var(--mut); font-weight:600; line-height:1.55;
    margin-bottom:16px;}
  .sheetgrp{margin-bottom:18px;}
  .sheetgrp h3{display:flex; justify-content:space-between; align-items:baseline;
    font-size:12px; font-weight:900; letter-spacing:1.8px; text-transform:uppercase;
    color:var(--dim); margin:0 0 9px; padding-bottom:7px; border-bottom:1px solid var(--line);}
  .sheetgrp h3 span{font-family:var(--hero); font-size:20px; letter-spacing:0; color:var(--ink);}

  .bdrow{padding:11px 0; border-bottom:1px solid var(--line);}
  .bdrow:last-child{border-bottom:0;}
  .bdhd{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .bdslot{font-size:10.5px; font-weight:900; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--dim);}
  .bdsong{font-size:15px; font-weight:800; margin-top:1px;}
  .bdpts{font-family:var(--hero); font-size:22px; color:var(--goldT); flex:0 0 auto;}
  .bdmath{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .bdterm{display:inline-flex; flex-direction:column; align-items:center; gap:1px;
    padding:4px 9px; border-radius:var(--r-sm); background:var(--card2);
    border:1px solid var(--line);}
  .bdterm i{font-style:normal; font-size:9.5px; font-weight:800; letter-spacing:.8px;
    text-transform:uppercase; color:var(--dim);}
  .bdterm b{font-size:14px; font-variant-numeric:tabular-nums;}
  .bdterm.great{border-color:color-mix(in srgb,var(--green) 55%, transparent);}
  .bdterm.ok{border-color:color-mix(in srgb,var(--teal) 55%, transparent);}
  .bdterm.bad{border-color:color-mix(in srgb,var(--red) 55%, transparent);}
  .bdterm.tot{background:var(--card3); border-color:var(--line2);}
  .bdterm.tot b{color:var(--goldT);}
  .bdop{color:var(--dim); font-weight:800; font-size:13px;}
  .bdwhy{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px;}
  .vr{font-size:11px; font-weight:700; padding:3px 8px; border-radius:99px;
    background:var(--card2); color:var(--mut); border:1px solid var(--line);}
  .vr b{color:var(--ink);}
  .vr.dim{color:var(--dim);}
  .vr.fit.great{background:color-mix(in srgb,var(--green) 14%, transparent); color:var(--greenT);
    border-color:color-mix(in srgb,var(--green) 34%, transparent);}
  .vr.fit.ok{background:color-mix(in srgb,var(--teal) 14%, transparent); color:var(--tealT);
    border-color:color-mix(in srgb,var(--teal) 34%, transparent);}
  .vr.fit.bad{background:color-mix(in srgb,var(--red) 14%, transparent); color:var(--redT);
    border-color:color-mix(in srgb,var(--red) 34%, transparent);}
  .vr.fit.neutral{color:var(--dim);}
  .bdnote{margin-top:9px; padding:9px 11px; border-radius:var(--r-sm); background:var(--card2);
    border-left:3px solid var(--violet); font-size:12px; line-height:1.55; color:var(--mut);
    font-weight:600;}

  .flowrow{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    padding:9px 0; border-bottom:1px solid var(--line);}
  .flowrow:last-child{border-bottom:0;}
  /* A breadth card you did not earn still gets a row — a blank where points
     could have been is the whole message. */
  .flowrow.miss{opacity:.5;}
  .flowrow.miss .fp{color:var(--dim);}
  .fl b{display:block; font-size:14px; font-weight:800;}
  .fl i{display:block; font-style:normal; font-size:12px; color:var(--mut); font-weight:600;
    line-height:1.5; margin-top:2px;}
  .fp{font-family:var(--hero); font-size:20px; color:var(--goldT); flex:0 0 auto;}
  .sheettot{display:flex; justify-content:space-between; align-items:baseline;
    padding-top:13px; border-top:2px solid var(--line2);}
  .sheettot span{font-size:12px; font-weight:900; letter-spacing:1.8px; text-transform:uppercase;
    color:var(--dim);}
  .sheettot b{font-family:var(--hero); font-size:30px; color:var(--goldT);}

  .loading{min-height:60dvh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; color:var(--mut); font-weight:800;}
  .spinner{width:26px; height:26px; border-radius:50%; border:3px solid var(--line2);
    border-top-color:var(--teal); animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){ .spinner{animation-duration:2s;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="icon-btn" href="/" aria-label="Back to RunThe.GG">&larr;</a>
    <a class="brand" href="/" aria-label="RunThe.GG">
      <img src="/assets/runthe-r-games.png" alt="RunThe.GG" />
    </a>
    <span class="spacer"></span>
    <button class="themeBtn" id="themeBtn" type="button" aria-label="Toggle light and dark theme">
      <svg class="ic-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.1 5.1l1.4 1.4M17.5 17.5l1.4 1.4M18.9 5.1l-1.4 1.4M6.5 17.5l-1.4 1.4"/></svg>
      <svg class="ic-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.2 8.2 0 0 1 9.5 4a8.3 8.3 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
  <main id="app" aria-live="polite"></main>
</div>

<script>
/* Boot watchdog. An ES module that fails to link (a renamed export, a stale
   cached page against fresh code) never runs, so it cannot show an error — the
   page renders the header and stops. This runs outside the module, so it still
   fires, and turns a blank screen into a reload button. */
window.addEventListener('error', function(e){
  if (e.message && /module|import/i.test(e.message)) window.__setlistBootFailed = true;
});
setTimeout(function(){
  var app = document.getElementById('app');
  if (!app || app.innerHTML.trim()) return;      // it booted; nothing to do
  app.innerHTML =
    '<div class="err" style="margin-top:24px">' +
    '<b>This page needs a refresh.</b><br />' +
    'The game updated and your browser is holding an old copy of it. ' +
    'Reload to get the current version.' +
    '<div style="margin-top:12px"><button class="btn" type="button" ' +
    'onclick="location.reload(true)">Reload</button></div></div>';
}, 4000);
</script>

<script type="module">
import {
  SETS, MAX_ROUNDS, ENCORE_INDEX, ARC_MAX, TIME_POINTS_PER_SET,
  RESPIN_COSTS, respinCost, canRespin, theOneThatGotAway,
  wouldStrand, danglingSegue, closesSandwich, SANDWICH_BONUS,
  reactionFor, eventLine, setOpenLine,
  scoreShow, gradeScore, gradeRunning, GRADE_SETTLE, scorePerf, roleAt, roleFit, tagsOf, isJamchart, isRecommended,
  budgets, remaining, canPlace, setFull, lenOf, fmtClock,
} from './scoring.js?v=13';
import { loadBand, setLabel, setRank } from './dataLoader.js?v=13';

// ── bands ────────────────────────────────────────────────────────────────────
// `sample` is invented data used to exercise the pipeline — see
// scripts/setlist/make_sample.mjs. Real bands come from the ingester.
const BANDS = [
  { id: 'goose',  label: 'Goose',  csv: '/setlist/data/goose.csv',  note: 'elgoose.net archive' },
  { id: 'sample', label: 'Sample Band', csv: '/setlist/data/sample.csv',
    note: 'Test data — not a real band', sample: true },
];

const DATA_VERSION = 2;   // bump to bust the CSV cache after a regeneration

// A round is only a decision if there is a setlist to read, and — now that time
// is the currency — only if the songs have durations to spend. 17% of songs in
// the archive are untimed, so a show is drawable when it is at least this long
// AND every song in it is timed. That leaves 425 of Goose's 655.
const MIN_SONGS_PER_SHOW = 8;

function drawableShows(shows){
  const full = shows.filter(s =>
    s.songs.length >= MIN_SONGS_PER_SHOW && s.songs.every(p => lenOf(p) > 0));
  return full.length >= 12 ? full : shows.filter(s => s.songs.some(p => lenOf(p) > 0));
}

/* song_ids already locked into a slot — a setlist should not repeat a song.
 *
 * Keyed on song_id, not the row, because the same song from two different
 * nights is two different rows. Within one show a song CAN legitimately appear
 * twice (a sandwich: play it, jam out, segue away, segue back), but that never
 * reaches here — each round draws a distinct show and locks exactly one song
 * from it, so the two halves of a sandwich can never both be picked. */
// ── seeded RNG (mulberry32, per the house convention) ─────────────────────────
function hash32(s){
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h >>> 0;
}
function mulberry32(a){
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── formatting ───────────────────────────────────────────────────────────────
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d){
  if (!d) return '';
  const [y, m, day] = String(d).split('-');
  return `${MONTHS[Number(m) - 1] || ''} ${Number(day)}, ${y}`;
}
function fmtLen(sec){
  const n = Number(sec);
  if (!n) return '';
  return `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`;
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* Accent for a song, mapped onto the site palette. Order matters: the most
   characterful trait wins.
 *
 * Every accent here has to be tellable from every other one AT CHIP SIZE,
 * which is nine and a half pixels of uppercase. Two were not: PEAK borrowed
 * --redT, three degrees of hue from COVER's --coralT, and opener and closer
 * were the same green as each other. Their hues now run
 *
 *   cover 5deg · encore 41 · opener 142 · closer 186 · ballad 222 ·
 *   jam 258 · peak 326
 *
 * The closest pair is now 33 degrees apart, in the light theme, against 0 and
 * 3 before. A song with no notable role goes grey
 * rather than teal — nothing to say, nothing to colour. Re-check with
 * hue.mjs before adding one. */
function accentOf(perf){
  const t = tagsOf(perf);
  if (perf.is_cover === 'true') return { v: 'var(--coralT)', chip: 'cover' };
  if (t.includes('peak'))   return { v: 'var(--pinkT)',   chip: 'peak' };
  if (t.includes('jam'))    return { v: 'var(--violetT)', chip: 'jam' };
  if (t.includes('encore')) return { v: 'var(--goldT)',   chip: 'encore' };
  if (t.includes('ballad')) return { v: 'var(--blueT)',   chip: 'ballad' };
  if (t.includes('opener')) return { v: 'var(--greenT)',  chip: 'opener' };
  if (t.includes('closer')) return { v: 'var(--tealT)',   chip: 'closer' };
  return { v: 'var(--dim)', chip: '' };
}

// ── state ────────────────────────────────────────────────────────────────────
const S = {
  screen: 'home',
  band: null,          // band config
  data: null,          // { shows, segues }
  show: null,          // tonight's drawn show
  round: 0,
  sets: [[], [], []],  // Set I / Set II / Encore, in running order
  closed: [false, false, false],
  spent: [0, 0, 0],    // stage time burned on respins, per set
  respins: 0,          // how many this run — each costs more than the last
  seenShows: new Set(),
  seenSongs: [],       // every song offered, for "the one that got away"
  sofarAll: false,     // is the on-screen setlist showing every set?
  pickedSong: null,
  hint: '',
  hintBad: false,
  error: '',
  result: null,
  revealTimer: null,
};

const app = document.getElementById('app');

function setScreen(name){
  clearTimeout(S.revealTimer);
  S.screen = name;
  // The sheet belongs to the draft screen only — never let it survive a screen change.
  if (name !== 'draft') document.body.classList.remove('sheet-on');
  document.body.classList.toggle('playing', name === 'draft' || name === 'reveal');

}

// ── home ─────────────────────────────────────────────────────────────────────
function renderHome(){

    const warn = b.sample
      ? `<div class="warn">Invented data for a band that doesn't exist — kept as a test fixture.</div>`

      <section class="card band">

          <button class="btn primary" data-start="${b.id}">Draft a setlist</button>
        </div>
        ${warn}
      </section>`;
  }).join('');

  app.innerHTML = `
    <div class="hero">
      <div class="eyebrow">RunThe.GG presents</div>
      <h1><span class="accent">Segue</span></h1>
      <div class="tagline">The Setlist Builder Game</div>
      <p>Two sets, an encore, and a curfew on each. Spin up real shows, spend
        their songs against the clock, and build the night you wish they'd played.</p>
    </div>

    <div class="steps">
      <div class="step"><b>01</b><span>Spin a year, then a night from it — a real concert, from the band's whole history.</span></div>
      <div class="step"><b>02</b><span>Pull one song and play it. It spends its running time from your set. No takebacks.</span></div>
      <div class="step"><b>03</b><span>Bustouts, monster versions and real segues all score. Then the show plays back to a crowd.</span></div>
    </div>

    ${S.error ? `<div class="err">${esc(S.error)}</div>` : ''}
    <div class="bands">${bands}</div>`;
}

// ── reveal ───────────────────────────────────────────────────────────────────
/* Spin one reel onto its target.
 *
 * The strip is built with filler rows and the target LAST, so landing is a
 * single translateY to the end — one GPU-composited transition rather than a
 * stream of DOM writes. Resolves when the reel stops.
 */
function spinReel(el, filler, target, renderItem, ms){
  const rows = [...filler, target];
  el.querySelector('.reel-strip').innerHTML =
    rows.map(r => `<div class="reel-item">${renderItem(r)}</div>`).join('');

  const strip = el.querySelector('.reel-strip');
  const h = el.classList.contains('year') ? 52 : 84;
  const distance = (rows.length - 1) * h;

  return new Promise(resolve => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches){
      strip.style.transform = `translateY(-${distance}px)`;
      el.classList.add('locked');
      resolve();
      return;
    }
    strip.style.transform = 'translateY(0)';
    // Force a reflow so the transition has a start value to animate from.
    void strip.offsetHeight;
    strip.style.transition = `transform ${ms}ms cubic-bezier(.16,.84,.3,1)`;
    strip.style.transform = `translateY(-${distance}px)`;
    const done = () => { el.classList.add('locked'); resolve(); };
    strip.addEventListener('transitionend', done, { once: true });
    // Belt and braces: transitionend does not fire if the tab is hidden.
    setTimeout(done, ms + 120);
  });
}

const yearOf = sh => String(sh.show_date).slice(0, 4);

/* Two reels: the year lands first, then the night. Drawing happens before any
   of this (drawShow), so the animation always agrees with the outcome — it is
   showing you a result, not choosing one. */
function renderReveal(){
  const show = S.show;
  const pool = drawableShows(S.data.shows);
  const si = Math.max(0, currentSet());

  app.innerHTML = `
    <div class="reveal" id="revealRoot">
      <div class="eyebrow">${esc(SETS[si].label)} · pick ${S.round + 1}</div>
      <div class="reveal-win landed" id="revealWin">
        <div class="reveal-bar">
          <span class="eyebrow" id="revealLbl">Spinning the archive</span>
          <span class="n">${String(S.round + 1).padStart(2, '0')}</span>
        </div>
        <div class="reveal-body">
          <div class="reels">
            <div>
              <div class="reel-lbl">Year</div>
              <div class="reel year" id="reelYear"><div class="reel-strip"></div></div>
            </div>
            <div>
              <div class="reel-lbl">Night</div>
              <div class="reel show" id="reelShow"><div class="reel-strip"></div></div>
            </div>
          </div>
          <div class="reveal-count hidden" id="rCount"></div>
        </div>
      </div>
      <div class="skip" id="skipHint">Tap to skip</div>
      <div class="reveal-cue hidden" id="rCue">Pull your song &darr;</div>
    </div>`;

  const years = [...new Set(pool.map(yearOf))].sort();
  const target = yearOf(show);
  const sameYear = pool.filter(x => yearOf(x) === target);
  const pick = a => a[Math.floor(Math.random() * a.length)];

  const yearFiller = Array.from({ length: 16 }, () => pick(years));
  const showFiller = Array.from({ length: 14 }, () => pick(sameYear.length > 1 ? sameYear : pool));

  const land = () => {
    document.getElementById('revealLbl').textContent = "Tonight's show";
    const c = document.getElementById('rCount');
    c.textContent = `${show.songs.length} songs played`;
    c.classList.remove('hidden');
    document.getElementById('rCue').classList.remove('hidden');
    const sk = document.getElementById('skipHint');
    if (sk) sk.remove();
    S.revealTimer = setTimeout(() => setScreen('draft'), 700);
  };

  let skipped = false;
  const skip = () => {
    if (skipped) return;
    skipped = true;
    clearTimeout(S.revealTimer);
    document.querySelectorAll('#revealRoot .reel-strip').forEach(st => {
      st.style.transition = 'none';
    });
    const y = document.getElementById('reelYear');
    const sh = document.getElementById('reelShow');
    y.querySelector('.reel-strip').style.transform = `translateY(-${16 * 52}px)`;
    sh.querySelector('.reel-strip').style.transform = `translateY(-${14 * 84}px)`;
    y.classList.add('locked'); sh.classList.add('locked');
    land();
  };
  const root = document.getElementById('revealRoot');
  root.addEventListener('click', skip);

  (async () => {
    await spinReel(document.getElementById('reelYear'), yearFiller, target,
      y => `<span class="ri-year">${esc(y)}</span>`, 900);
    if (skipped) return;
    await spinReel(document.getElementById('reelShow'), showFiller, show,
      sh => `<span class="ri-date">${esc(fmtDate(sh.show_date))}</span>` +
             `<span class="ri-venue">${esc(sh.venue || '')}</span>` +
             `<span class="ri-venue">${esc([sh.city, sh.state].filter(Boolean).join(', '))}</span>`,
      1050);
    if (skipped) return;
    land();
  })();
}

function setsPanelHTML({ live }){
  const bud = budgets(S.sets, S.closed, S.spent);
  const cur = live ? currentSet() : -1;

  return SETS.map((cfg, i) => {
    const songs = S.sets[i];
    const used = songs.reduce((a, p) => a + lenOf(p), 0);
    const left = bud[i] - used;
    const pct = bud[i] > 0 ? Math.min(100, used / bud[i] * 100) : 0;
    const isCur = i === cur;
    const done = S.closed[i] || setFull(S.sets, i);
    const inherited = i === ENCORE_INDEX && bud[i] > cfg.seconds;

    const rows = songs.map((p, j) => {
      const role = roleAt(i, j, songs.length);
      return `<div class="srow">
        <span class="sr-role">${esc(role.name)}</span>
        <span class="sr-song">${esc(p.song)}</span>
        <span class="sr-len">${fmtClock(lenOf(p))}</span>
      </div>`;
    }).join('');

    return `<div class="setblk ${isCur ? 'cur' : ''} ${done ? 'done' : ''}">
      <div class="set-hd">
        <span class="set-nm">${esc(cfg.label)}</span>
        <span class="set-clock ${left < 5 * 60 ? 'low' : ''}">
          ${done ? 'closed' : `${fmtClock(Math.max(0, left))} left`}
        </span>
      </div>
      <div class="bar"><span style="width:${pct}%"></span></div>
      <div class="set-sub">${songs.length}/${cfg.maxSongs} songs · ${fmtClock(used)} of ${fmtClock(bud[i])}</div>
      ${inherited ? `<div class="banked"><b>+${fmtClock(bud[i] - cfg.seconds)}</b> banked from the sets</div>` : ''}
      ${S.spent[i] ? `<div class="burned">&minus;${fmtClock(S.spent[i])} spent spinning</div>` : ''}
      ${rows}
    </div>`;
  }).join('');
}

// ── draft ────────────────────────────────────────────────────────────────────
/* The song at the end of the current set, if it has ever segued out. Placing a
   partner of it next completes a real segue and scores. This is the whole point
   of showing the arrow: a segue you cannot see coming is a segue you cannot
   build, and until now the bonus fired by luck. */
function huntingFor(){
  const si = currentSet();
  if (si === -1) return null;
  const set = S.sets[si];
  if (!set.length) return null;
  const last = set[set.length - 1];
  // Only a take that actually segued leaves anything open.
  if (String(last.is_segue) !== 'true') return null;
  const p = S.data.partners && S.data.partners.get(last.song_id);
  if (!p || !p.size) return null;
  return { from: last, partners: p };
}

/* What is already on the setlist, kept on screen while you choose the next one.
   Collapsed to the set being built by default — that is the part a decision
   actually depends on — with the earlier sets one tap away. */
function sofarHTML(si){
  const played = S.sets.flat().length;
  if (!played) return '';
  const showAll = S.sofarAll;
  const blocks = [];

  S.sets.forEach((set, i) => {
    if (!set.length) return;
    if (!showAll && i !== si) return;
    blocks.push(`
      <div class="sf-set">
        <div class="sf-lbl">${esc(SETS[i].label)}</div>
        ${set.map((p, j) => `
          <div class="sf-row">
            <span class="sf-n">${j + 1}</span>
            <span class="sf-song">${esc(p.song)}${
              j < set.length - 1 && S.data.segues.has(`${p.song_id}|${set[j + 1].song_id}`)
                ? '<i class="sf-seg">&rsaquo;</i>' : ''}</span>
            <span class="sf-len">${fmtClock(lenOf(p))}</span>
          </div>`).join('')}
      </div>`);
  });

  if (!blocks.length && !showAll) return `
    <div class="sofar empty">
      <div class="sf-hd"><b>Your setlist</b>
        <button class="sf-tog" type="button" id="sofarTog">show all ${played}</button></div>
      <div class="sf-none">${esc(SETS[si].label)} is empty — this is the opener.</div>
    </div>`;

  return `
    <div class="sofar">
      <div class="sf-hd">
        <b>Your setlist</b>
        <button class="sf-tog" type="button" id="sofarTog">${
          showAll ? 'just this set' : `show all ${played}`}</button>
      </div>
      ${blocks.join('')}
    </div>`;
}

function renderDraft(){
  const show = S.show;
  const taken = lockedSongIds();
  const si = currentSet();
  if (si === -1){ finishShow(); return; }
  const cfg = SETS[si];
  const left = remaining(S.sets, si, S.closed, S.spent);

  const bySet = new Map();
  for (const p of show.songs){
    if (!bySet.has(p.set)) bySet.set(p.set, []);
    bySet.get(p.set).push(p);
  }
  const keys = Array.from(bySet.keys()).sort((a, b) => setRank(a) - setRank(b));

  // Every song is shown, but one that will not fit the clock is dead — saying
  // why beats hiding it, because "no room for a 22 minute Drive" IS the game.
  const fits = show.songs.filter(p => !taken.has(p.song_id) && canPlace(S.sets, si, p, S.closed, S.spent));
  const hunt = huntingFor();
  const canFinish = hunt && show.songs.some(p =>
    hunt.partners.has(p.song_id) && !taken.has(p.song_id)
    && canPlace(S.sets, si, p, S.closed, S.spent));

  const songsHTML = keys.map(k => {
    const rows = bySet.get(k).map(p => {
      const acc = accentOf(p);
      const idx = show.songs.indexOf(p);
      const strands = wouldStrand(S.sets, si, p, S.closed, S.spent);
      const sandwich = closesSandwich(S.sets[si], p, S.data.segues);
      // A repeat is allowed in exactly one case: closing a sandwich.
      const used = taken.has(p.song_id) && !sandwich;
      const room = canPlace(S.sets, si, p, S.closed, S.spent);
      const dead = used || !room || strands;
      const finishes = hunt && hunt.partners.has(p.song_id) && !dead;
      const chips = [];
      if (sandwich && !dead) chips.push('<span class="chip sand">CLOSES SANDWICH</span>');
      else if (finishes) chips.push('<span class="chip seg">COMPLETES SEGUE</span>');
      if (isRecommended(p)) chips.push('<span class="chip rec">RECOMMENDED</span>');
      else if (isJamchart(p)) chips.push('<span class="chip">JAMCHART</span>');
      if (acc.chip) chips.push(`<span class="chip acc">${acc.chip}</span>`);
      const gap = Number(p.show_gap) || 0;
      if (gap >= 20) chips.push(`<span class="chip rare">${gap} show gap</span>`);
      const why = used ? 'already in your show'
        : !room ? (lenOf(p) > left ? `needs ${fmtClock(lenOf(p) - left)} more` : 'set is full')
        : strands ? 'segues — no room to land it'
        : '';
      return `<button class="song${dead ? ' used' : ''}${finishes ? ' finishes' : ''}"
          type="button" data-song="${idx}"
          aria-pressed="${S.pickedSong === p}" ${dead ? 'disabled aria-disabled="true"' : ''}
          style="--acc:${acc.v}">
        <span class="l">
          <span class="t">${esc(p.song)}${p.is_segue === 'true'
            ? '<span class="segout" title="Segued into the next song">&rsaquo;</span>' : ''}</span>
          ${why ? `<span class="o">${esc(why)}</span>`
            : p.segued_into ? `<span class="o seg">&rsaquo; ${esc(p.segued_into)}${
                (() => { const n = (S.data.partners.get(p.song_id) || new Set()).size;
                         return n > 1 ? ` <i>or ${n - 1} other${n > 2 ? 's' : ''}</i>` : ''; })()
              }</span>`
            : p.is_cover === 'true' && p.original_artist
              ? `<span class="o">orig. ${esc(p.original_artist)}</span>` : ''}
        </span>
        <span class="r">
          <span class="len">${fmtClock(lenOf(p))}</span>
          <span class="chips">${chips.join('')}</span>
        </span>
      </button>`;
    }).join('');
    return `<div class="setgrp"><h3>${esc(setLabel(k))}</h3><div class="songs">${rows}</div></div>`;
  }).join('');

  app.innerHTML = `
    <div class="card hud">
      <div>
        <div class="rd">${esc(cfg.label)}
          <span class="rd-clock ${left < 5 * 60 ? 'crit' : left < 15 * 60 ? 'warn' : ''}"
            >${fmtClock(Math.max(0, left))}</span></div>
        <div class="md"><span class="rd-rem ${left < 5 * 60 ? 'crit' : left < 15 * 60 ? 'warn' : ''}"
          >remaining</span> · pick ${S.round + 1}${
          S.respins ? ` · ${S.respins} spin${S.respins > 1 ? 's' : ''}` : ''}</div>
      </div>
      <div class="hud-btns">
        ${(() => {
          const cost = respinCost(S.respins);
          const can = canRespin(S.sets, si, S.respins, S.closed, S.spent);
          if (cost === null) return '<span class="nospin">No spins left</span>';
          return `<button class="btn tiny spin" type="button" id="respinBtn" ${can ? '' : 'disabled'}
            title="${can ? '' : 'Not enough time left in this set'}">
            Spin &middot; ${fmtClock(cost)}</button>`;
        })()}
        <button class="btn tiny" type="button" id="openSets">Clock</button>
      </div>
    </div>

    <div class="board">
      <div>
        <div class="card showcard">
          <div class="d">${esc(fmtDate(show.show_date))}</div>
          <div class="v">${esc(show.venue || '')}</div>
          <div class="c">${esc([show.city, show.state].filter(Boolean).join(', '))}</div>
        </div>
        ${sofarHTML(si)}
        ${hunt ? `<div class="hunt ${canFinish ? 'hot' : ''}">
          <b>${esc(hunt.from.song)} &rsaquo;</b>
          ${canFinish
            ? 'is still going — a song below finishes it.'
            : `is still going. Nothing here lands it${
                canRespin(S.sets, si, S.respins, S.closed, S.spent)
                  ? ` — spinning costs ${fmtClock(respinCost(S.respins))}.`
                  : '. Play anything to move on.'}`}
        </div>` : ''}
        ${fits.length ? '' : `<div class="warn">Nothing here fits ${esc(cfg.label)}.
          Close the set and move on.</div>`}
        ${songsHTML}
      </div>

      <div class="slotcol" id="slotCol">
        <aside class="card setlist">
          <div class="sheetgrab"></div>
          <h2>${S.pickedSong ? 'Add to ' + esc(cfg.label) : 'Tonight'}</h2>
          <div class="sub">${S.pickedSong
            ? `${esc(S.pickedSong.song)} · ${fmtClock(lenOf(S.pickedSong))}`
            : 'Two sets and an encore. Spend the time well.'}</div>
          ${setsPanelHTML({ live: true })}
          <div class="lockbar">
            <button class="btn primary" type="button" id="lockBtn" ${S.pickedSong ? '' : 'disabled'}>
              ${S.pickedSong ? `Play it (${fmtClock(lenOf(S.pickedSong))})` : 'Pick a song'}
            </button>
            ${S.pickedSong && String(S.pickedSong.is_segue) === 'true' ? `
              <div class="commit">This one segues — you will need to land it next
                or the transition is lost.</div>` : ''}
            <button class="btn closeset ${!fits.length || left < 6 * 60 ? 'urge' : ''}"
              type="button" id="closeSetBtn">
              <span class="cs-t">${si === ENCORE_INDEX ? 'End the show' : `Close ${esc(cfg.label)}`}</span>
              <span class="cs-s">${si === ENCORE_INDEX
                ? 'Final. Scores the night.'
                : `Banks ${fmtClock(Math.max(0, left))} for the encore`}</span>
            </button>
            <div class="hint ${S.hintBad ? 'bad' : ''}">${esc(S.hint
              || (!fits.length ? 'Nothing here fits — closing is the only move.'
                : si === ENCORE_INDEX ? 'Leftover time from the sets is yours here.'
                : 'Every minute you leave unplayed goes to the encore.'))}</div>
          </div>
        </aside>
      </div>
    </div>`;

  // If nothing in this show fits, the only move left is closing the set — and on
  // a phone that button lives in the sheet. Open it rather than hiding the exit.
  document.body.classList.toggle('sheet-on',
    !!S.pickedSong || S.sheetForced || !fits.length);
}

/* One row of the per-song breakdown: the arithmetic, in the order the model
   asks its four questions, so the number is readable rather than asserted. */
function songBreakdownHTML(perf, sc, opts = {}){
  const fitWord = { great: 'Perfect fit', ok: 'Good fit', neutral: 'Neutral', bad: 'Wrong spot' }[sc.fit];
  const reasons = sc.versionReasons.length
    ? sc.versionReasons.map(v => `<span class="vr">${esc(v.label)} <b>+${v.mult.toFixed(2)}</b></span>`).join('')
    : '<span class="vr dim">Standard version</span>';
  return `
    <div class="bdrow">
      <div class="bdhd">
        <div>
          ${opts.hideRole ? '' : `<div class="bdslot">${esc(sc.role)}</div>`}
          <div class="bdsong">${esc(perf.song)} <span class="bdlen">${fmtClock(lenOf(perf))}</span></div>
        </div>
        <div class="bdpts">${sc.subtotal}</div>
      </div>
      <div class="bdmath">
        <span class="bdterm"><i>Song</i><b>${sc.base}</b></span><span class="bdop">×</span>
        <span class="bdterm"><i>Version</i><b>${sc.versionMult.toFixed(2)}</b></span><span class="bdop">×</span>
        <span class="bdterm ${sc.fit}"><i>Placement</i><b>${sc.placementMult.toFixed(2)}</b></span>
        <span class="bdop">=</span><span class="bdterm tot"><b>${sc.subtotal}</b></span>
      </div>
      <div class="bdwhy">${reasons}<span class="vr fit ${sc.fit}">${fitWord}</span></div>
      ${perf.jamchart_note ? `<div class="bdnote">${esc(perf.jamchart_note)}</div>` : ''}
    </div>`;
}

  S._flat = idx;

  const setBlocks = r.perSet.map((set, i) => {

            S.missed.score.versionReasons.length

              : ''}.</div>

      <div class="breakdown">
        <div class="bd"><div class="v">${r.songTotal}</div><div class="k">Songs</div></div>

          × <b>how well it suited where it landed</b>. Then the night is judged as a whole.</div>

        <div class="sheetgrp">
          <h3>Time <span>${r.timeTotal}</span></h3>
          ${r.time.map(t => `<div class="flowrow">
            <div class="fl"><b>${esc(t.label)}</b>

              ? 'Builds and releases where a real show does'

          <h3>Breadth <span>${r.breadthTotal}</span></h3>
          ${r.breadth.map(c => `<div class="flowrow${c.got ? '' : ' miss'}">
            <div class="fl"><b>${esc(c.label)}</b><i>${esc(c.got ? c.blurb : c.missed)}</i></div>
            <div class="fp">${c.got ? c.points : 0}</div></div>`).join('')}
        </div>

      </div>

        <button class="btn primary" type="button" id="shareBtn">Copy score card</button>
        <button class="btn" type="button" data-start="${S.band.id}">Play again</button>

      </div>
    </div>`;

  const el = document.getElementById('scoreN');
  const target = r.total;
  // The grade is the finished night's, fixed up front — the count-up animation
  // must not walk the colour from red to green on its way to the number.
  el.className = 'n grade-' + gradeScore(r.total);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = target; }
  else {
    const t0 = performance.now(), dur = 900;
    const step = now => {
      const p = Math.min((now - t0) / dur, 1);
      el.textContent = Math.round((1 - Math.pow(1 - p, 3)) * target);
      if (p < 1) requestAnimationFrame(step);

  }
