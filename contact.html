<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact: RunThe.GG</title>
  <meta name="description" content="Questions, feedback, bug reports, or business inquiries for RunThe.GG? Get in touch.">
  <meta name="theme-color" content="#06182e">
  <link rel="icon" href="/assets/runthegames-icon_48.png?v=3" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/runthegames-icon_180.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a1626;--card:#122a44;--cardb:#1e3d5c;--ink:#eaf1f8;--mut:#93a7bd;--coral:#EF4E50;--teal:#35C4CD;--line:rgba(255,255,255,.08);}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;}
    body{font-family:'Archivo',system-ui,-apple-system,sans-serif;line-height:1.6;color:var(--ink);
      min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
      background:
        radial-gradient(1100px 520px at 50% -8%, rgba(53,196,205,.16), transparent 60%),
        radial-gradient(900px 460px at 88% 4%, rgba(239,78,80,.12), transparent 55%),
        linear-gradient(180deg,#0b1a2c 0%, var(--bg) 46%, #081120 100%);
      background-attachment:fixed;}
    .wrap{max-width:680px;margin:0 auto;padding:26px 18px 56px;}
    .mast{text-align:center;margin:4px 0 22px;}
    .mast img{display:block;width:100%;max-width:440px;height:auto;margin:0 auto;filter:drop-shadow(0 6px 26px rgba(0,0,0,.45));}
    .card{background:linear-gradient(180deg,var(--card),#0f2338);border:1px solid var(--cardb);border-radius:18px;padding:26px 22px 30px;text-align:center;}
    h1{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em;
      font-size:clamp(30px,8.5vw,46px);line-height:1;margin:0 0 6px;}
    h1 .a{color:var(--coral);}
    .sub{font-weight:900;color:var(--teal);text-transform:uppercase;letter-spacing:2px;font-size:11.5px;margin:0 0 18px;}
    .card p{margin:0 0 16px;font-size:15px;color:var(--mut);}
    .cta{display:inline-block;background:linear-gradient(180deg,#FF5F60,#E7433F);color:#fff;font-weight:800;
      text-transform:uppercase;letter-spacing:.5px;font-size:15px;padding:13px 26px;border-radius:12px;
      text-decoration:none;box-shadow:0 8px 22px -12px rgba(239,78,80,.9);}
    .cta:hover{filter:brightness(1.05);}
    .muted{font-size:13px;color:#7d8fa6;margin-top:30px;}
    .muted a{color:var(--teal);font-weight:700;text-decoration:none;}
    .foot{margin-top:28px;text-align:center;font-size:12.5px;color:#6f829a;}
    .foot a{color:#9db2c8;text-decoration:none;font-weight:700;}
    .foot a:hover{color:var(--ink);}
    .foot a.here{color:var(--ink);}
    .foot .sep{margin:0 7px;color:#3c4c60;}
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5952069078178257"
       crossorigin="anonymous"></script>
</head>
<body>
  <div class="wrap">
    <div class="mast"><a href="/"><img src="/assets/runthegames-wordmark.png?v=2" alt="Run The Games" width="2172" height="724" /></a></div>

    <main class="card">
      <h1>Get in <span class="a">Touch</span></h1>
      <p class="sub">We'd love to hear from you</p>

      <p>Questions, feedback, bug reports, or business inquiries? Drop us a line and
         we'll get back to you.</p>

      <a class="cta" href="mailto:hello@runthe.gg">Email us</a>

      <p class="muted">or reach us directly at
         <a href="mailto:hello@runthe.gg">hello@runthe.gg</a></p>
    </main>

    <footer class="foot">
      <a href="/">Home</a><span class="sep">·</span>
      <a href="about.html">About</a><span class="sep">·</span>
      <a href="privacy.html">Privacy</a><span class="sep">·</span>
      <a href="contact.html" class="here">Contact</a>
    </footer>
  </div>
</body>
</html>
